# Owned by the CSOC. A field is alerting-relevant when its ECS target
# appears in the required list for one of its dataset's event categories.
# @timestamp is deliberately absent: the pipeline guarantees it.
profiles:
  network:
    required: [source.ip, destination.ip, source.port, destination.port,
               network.transport, event.action, event.outcome, host.name]
  authentication:
    required: [user.name, source.ip, event.action, event.outcome,
               host.name]
  process:
    required: [process.name, process.command_line, process.executable,
               user.name, host.name, event.action]
  file:
    required: [file.path, process.name, user.name, host.name,
               event.action]
  dns:
    required: [dns.question.name, source.ip, event.action, host.name]
  web:
    required: [url.original, source.ip, destination.ip,
               http.request.method, event.action, event.outcome]
  iam:
    required: [user.name, user.target.name, event.action, event.outcome,
               host.name]
  malware:
    required: [file.hash.sha256, file.path, host.name, event.action,
               event.outcome]
  configuration:
    required: [event.action, event.outcome, user.name, host.name]
