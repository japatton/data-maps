# Studio site configuration. No secrets: tokens and keys live only in the
# admin's browser settings panel. See README "Studio".
repository:
  kind: forgejo
  api_url: https://forgejo.example/api/v1
  project: jpatton/data-maps
  default_branch: main
  web_ide_url: https://forgejo.example/{project}/_edit/{branch}/{path}
analysis:
  api_kind: openai
  api_url: http://localhost:11434/v1
  model: llama3.1:8b
  api_version: ""
  # false pins the analysis endpoint: Settings stops offering the LLM
  # url/model/kind fields and only the values above are used.
  allow_override: true
elastic:
  url: ""
