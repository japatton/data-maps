  - format: syslog-cef
    enable: >
      Same enablement as the device-security CEF entry - Properties > Security
      > Logs > SIEM with the Audit Log enabled - no separate configuration
      splits the job events out; they arrive on the same SIEM syslog stream
      and are separated downstream by the numeric Audit Log ID that names the
      job class. Set the Event Range severity cutoff aware that Xerox tags
      successful job completions at Informational and cancellations higher, so
      a strict cutoff can silently drop the successful-send records that
      matter most.
    references:
    - >-
      https://download.support.xerox.com/pub/docs/ALB80XX/userdocs/any-os/en_GB/AltaLink_VersaLink_series_siem_en-US.pdf
    - >-
      https://securitydocs.business.xerox.com/wp-content/uploads/2020/11/AltaLink_Series_SIEM_reference_guide_en-us.pdf
    - https://www.support.xerox.com/en-us/article/KB0133329
    parsing:
      mechanism: cribl-pipeline
      artifact: custom MFD job-completion pipeline (Xerox CEF branch)
      notes: >
        Split off the device syslog pipeline by the Audit Log ID range the
        same way the HP form is split by its "job completion" event summary -
        same grammar, different event families. No Elastic integration or
        Cribl pack exists. The advantage over the HP form is that the
        destination channel is an enumerated event ID rather than a
        firmware-versioned English string, so mfd.job.destination_channel can
        be assigned from a (vendor, event.code) table with no summary lookup
        that drifts. Where the fleet sits behind a print-management layer,
        that product's job log is still a richer destination-detail source
        than any device-native form, Xerox included.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Classify the destination channel at the edge from the numeric Audit
          Log ID into a stable mfd.job.destination_channel value, exactly as
          the HP branch derives it from the event summary, so the high side
          sees one enum across vendors. Carry the Xerox job event ID to
          event.code and the Name to event.action, unpack the CEF extension
          for suser, xrxjob1 (job name), fname, fileType and the accounting
          IDs, and enrich device serial/src to site, floor and owner here.
          Mark records that carry no destination value so the gap is queryable
          rather than invisible, invert the syslog severity into
          event.severity, and use Persistent Queue backpressure. Scan/job
          events are orders of magnitude rarer than print events, so this is
          the wrong route to optimise for volume.
        elastic: >
          Own the shared custom logs-mfd.scan_jobs ingest pipeline that
          derives event.outcome (folding cancelled/partial to unknown while
          keeping the raw token) and inverts the RFC 5424 severity into
          event.severity rather than copying it. Map mfd.job.name,
          mfd.job.file_type, mfd.job.source_service,
          mfd.job.image_overwrite_status, mfd.accounting.user_id and
          mfd.accounting.account_id as keyword. As on the HP form, the
          buildable detection is volume and after-hours anomalies per
          (user.name, device, destination channel); recipient-level rules are
          not possible on this device-native feed and belong against the mail
          gateway, which the dashboard should state so absence of evidence is
          not read as evidence.
        relay: >
          Low-side printer VLANs cross the guard as full ECS-shaped NDJSON
          built low-side (envelope mode B), one line per completed job, never
          raw CEF. The content-filter friction is small because the feed is
          thin: the only unbounded free-text values are fname/xrxjob1 (job and
          file names) and any destination text, which should be capped and
          flagged low-side so the custom NDJSON filter stays simple. Volume is
          low enough that _raw can be carried indefinitely here - these are
          the highest-forensic-value records in the map and the cheapest to
          keep whole.
      direct:
        parse_location: high
        cribl: >
          For a high-side device with no guard, forward the CEF syslog to the
          core worker group; the CEF unpack plus destination-channel
          classification from the event ID runs high-side without a low-side
          envelope step because the record is self-describing. Still branch on
          the CEF header to set observer.vendor/observer.product and still
          invert the severity.
        elastic: >
          Own the shared custom logs-mfd.scan_jobs ingest pipeline and drive
          event.action and the destination channel from a (vendor, event.code)
          table. With no boundary, retain the full job/file names; the decoded
          Xerox job record shares the data stream and detections with the HP
          form, distinguished only by observer.vendor.
    fields:
    - vendor: PRI
      type: integer
      description: >-
        RFC 5424 syslog priority; Xerox devices use Log Audit facility code
        13, so PRI = 13 x 8 + severity
      ecs: log.syslog.priority
      status: mapped
      transform: decompose into log.syslog.facility.code and log.syslog.severity.code
    - vendor: TIMESTAMP
      type: timestamp
      description: RFC 5424 job-completion time in the syslog header, already RFC3339
      ecs: '@timestamp'
      status: mapped
    - vendor: HOSTNAME
      type: string
      description: hostname of the device in the RFC 5424 syslog header
      ecs: observer.hostname
      status: mapped
    - vendor: Device Vendor
      type: string
      description: >-
        CEF header - device manufacturer, constant Xerox; set the parser
        branch from this
      ecs: observer.vendor
      status: mapped
    - vendor: Device Product
      type: string
      description: CEF header - device model name
      ecs: observer.product
      status: mapped
    - vendor: Device Version
      type: string
      description: CEF header - device firmware version
      ecs: observer.version
      status: mapped
    - vendor: Device Event Class ID
      type: integer
      description: >-
        CEF header - the numeric Audit Log ID naming the job class and
        destination channel (5 Print, 6 Network Scan, 7 Server Fax, 8 Internet
        Fax, 9 Email, 12 Copy, 13 Embedded Fax, 14 LAN Fax, 20 Scan to
        Mailbox, 24 Scan to Home, 74 Scan to USB, 78/79 Remote Scan)
      ecs: event.code
      status: mapped
      notes: >-
        the stable destination-channel discriminator - an enumerated ID here
        rather than the HP form's free-text summary, so
        mfd.job.destination_channel is a table lookup with no firmware drift
    - vendor: Name
      type: string
      description: >-
        CEF header - the fixed description of the job event (e.g. "Network
        scan job", "Email job")
      ecs: event.action
      status: mapped
    - vendor: Severity
      type: integer
      description: CEF header - syslog severity 0-7 assigned to the job message
      ecs: log.syslog.severity.code
      status: partial
      notes: >
        RFC 5424 scale where 0 is most severe, the inverse of ECS
        event.severity; a direct copy inverts alert ordering. Xerox assigns
        Informational to successful sends, so severity does not track security
        interest on this dataset - invert on the way to event.severity and do
        not gate collection on it
    - vendor: suser
      type: string
      description: >-
        CEF extension sourceUserName - the user that submitted or released the
        job; email addresses are also mapped here
      ecs: user.name
      status: partial
      transform: >-
        split any realm prefix into user.domain plus user.name and recognise
        the email-address case
    - vendor: duser
      type: string
      description: >-
        CEF extension destinationUserName - the user associated with the job
        destination or target
      ecs: destination.user.name
      status: partial
      notes: >-
        present on send jobs that carry a target principal; still not a full
        recipient list, so it does not close the recipient-attribution gap
    - vendor: src
      type: ip
      description: >-
        CEF extension sourceAddress - the source/session address of a
        network-submitted job
      ecs: source.address
      status: partial
      transform: >-
        copy to source.ip only when it parses as an address; absent on
        control-panel walk-up jobs
    - vendor: dst
      type: ip
      description: >-
        CEF extension destinationAddress - a destination IPv4/IPv6 address or
        host name for server-fax/network destinations
      ecs: destination.address
      status: partial
      transform: copy to destination.ip only when it parses as an address
    - vendor: fname
      type: string
      description: CEF extension filename - the file name of the file used in the job
      ecs: file.name
      status: partial
      notes: >-
        present where the job carries a filename; the scan-to-* families are
        thin on this, as on the HP form
    - vendor: xrxjob1
      type: string
      description: Xerox custom CEF key - the Job Name used on the device
      ecs: null
      status: unmapped
      custom: mfd.job.name
      notes: >-
        the job title; kept custom rather than overloaded onto file.name,
        which fname already occupies
    - vendor: fileType
      type: enum
      description: CEF extension fileType - the file type(s) used in the job
      ecs: null
      status: unmapped
      custom: mfd.job.file_type
      notes: >-
        document format (e.g. PDF/TIFF), not ECS file.type's file/dir/symlink
        vocabulary, so it is kept custom rather than mismapped to file.type
    - vendor: sourceServiceName
      type: string
      description: >-
        CEF extension - the service responsible for generating the event (e.g.
        "Print From URL")
      ecs: null
      status: unmapped
      custom: mfd.job.source_service
      notes: >-
        the submission channel/service that produced the job, a Xerox enum
        rather than a running-service identity, so it is kept custom rather
        than mapped to service.name
    - vendor: act
      type: string
      description: >-
        CEF extension deviceAction - the action taken after job completion,
        carrying the Immediate Image Overwrite status (e.g. "IIO Not
        Applicable")
      ecs: null
      status: unmapped
      custom: mfd.job.image_overwrite_status
      notes: >-
        overloaded CEF act key - here it is the per-job data-remnant overwrite
        state, not the event action (event.action comes from Name), so it is
        kept in the job namespace
    - vendor: outcome
      type: enum
      description: CEF extension eventOutcome - the result of the job
      ecs: event.outcome
      status: mapped
      transform: >
        fold cancelled and partial-success to unknown for event.outcome while
        retaining the raw token; a partial success on an email/network job
        means the data reached some but not all destinations and must stay
        distinguishable from a clean failure
    - vendor: msg
      type: string
      description: >-
        CEF extension message - additional information about the job, e.g. an
        image/page count
      ecs: message
      status: partial
      notes: terse supplemental value rather than a rendered line; length-cap low-side
    - vendor: xrxaccUID1
      type: string
      description: >-
        Xerox custom CEF key - the Accounting User ID name, present when
        Network Accounting is enabled
      ecs: null
      status: unmapped
      custom: mfd.accounting.user_id
    - vendor: xrxaccAID1
      type: string
      description: >-
        Xerox custom CEF key - the Accounting Account ID name, present when
        Network Accounting is enabled
      ecs: null
      status: unmapped
      custom: mfd.accounting.account_id
