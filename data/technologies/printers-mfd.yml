          into a stable mfd.job.destination_channel value low-side before
          anything downstream tries to alert on it. Enrich device IP to site,
          floor, and device owner here, and mark the records that carry no
          destination value at all so the gap is queryable rather than
          invisible. Persistent Queue backpressure on the destination, and
          keep this route's volume in perspective — scan events are orders of
          magnitude rarer than print events and are the wrong place to
          optimise.
        elastic: >
          Own a custom logs-mfd.scan_jobs ingest pipeline that derives
          event.outcome (folding canceled and partial_success into unknown
          while keeping the raw value), normalizes the vendor's misspelled
