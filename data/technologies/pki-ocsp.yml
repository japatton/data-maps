datasets:
- id: ca-audit
  name: Certification Authority audit (Security channel)
  description: >
    The issuing CA's own record of the per-certificate request lifecycle,
    written to the Windows Security channel by the
    Microsoft-Windows-Security-Auditing provider under the "Certification
    Services" (Audit Certification Services) subcategory: 4886 request
    received, 4887 request approved and certificate issued, 4888 request
    denied, 4889 request set to pending, 4868 pending request denied by a
    certificate manager, and 4869 request resubmitted. This is the
    credential-issuance side of CAC/PIV: it is where an operator can see which
    account asked for which template and whether the CA issued or denied it.
    Volume tracks enrolment, so this is the noisy half of the AD CS audit
    surface. The administrative half - certificate revocation, CRL publishing,
    CA permission and property changes, certificate-manager settings,
    certificate database deletions, and certificate template load, update and
    security changes (4870, 4871/4872, 4882, 4890, 4891, 4892, 4896 and
    4898-4900) - is a handful of events a week that carries the entire AD CS
    attack path, and it is mapped separately as ca-admin so the CSOC can alert
    on it without alerting on every enrolment. It is NOT the card-issuance
    workflow - the HSPD-12 card management system (USAccess/MyID) that
    sponsors, adjudicates, enrolls and prints the card is a separate catalog
    row (hspd12-cms), and none of that workflow appears here. The events do
    not exist unless auditing is turned on twice: the "Certification Services"
    subcategory must be enabled with auditpol AND the individual audit
    categories must be ticked on the Auditing tab of the CA's properties
    (certutil -setreg CA\AuditFilter). Field names below are the AD CS
    provider's own EventData element names, so they arrive under
    winlog.event_data.* with these exact spellings. The estate also runs
    non-Microsoft CAs (Entrust and the DoD/ECA hierarchies are the usual ones
    in a US government enclave) whose logs are wholly different in shape; this
    dataset is grounded in AD CS documentation only, and an Entrust or other
    vendor CA needs its own dataset before it can be onboarded against this
    map.
  event_categories:
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Elastic Agent on each issuing CA reads the Security channel and ships
        to Cribl. Issuing CAs and their HSMs are frequently held in a
        higher-assurance enclave than the general Windows estate precisely
        because they mint authentication credentials.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.security
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Elastic Agent on each issuing CA reads the Security channel and ships
        to Cribl, which forwards to Elastic with no guard crossing. Issuing
        CAs and their HSMs are frequently held in a higher-assurance enclave
        than the general Windows estate precisely because they mint
        authentication credentials.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.security
  formats:
  - format: windows-event
    parsing:
      mechanism: elastic-integration
      artifact: System integration (winlog input, Security channel)
      notes: >
        There is no Elastic AD CS integration and no adcs data stream. The
        System integration's security data stream transports these events
        because they sit on the Security channel, and the winlog input names
        the EventData elements from the provider manifest, so RequestId,
        Requester, Attributes, Disposition, SubjectKeyIdentifier and Subject
        do arrive as winlog.event_data.* keys. What the stock pipeline does
        NOT do is give them ECS homes, derive event.action from the AD CS
        event id, or decompose the Attributes blob - published AD CS hunting
        work (SpecterOps' Certified Pre-Owned, and the SAN-abuse KQL that
        pivots on winlog.event_data.Requester and .Attributes) all operates on
        the raw event_data names for exactly that reason. The same winlog
        input on the same hosts also carries the administrative events mapped
        as ca-admin; the two are separated by event id downstream, so this
        inventory is the 4868/4869/4886-4889 subset only.
    fields:
    - vendor: EventID
      type: integer
      description: >-
        numeric identifier of the AD CS audit event (4868, 4869 and 4886-4889
        on this dataset)
      ecs: event.code
      status: mapped
      notes: >-
        also the field the pipeline splits on: the administrative ids in the
        same subcategory are routed to ca-admin and never reach this dataset
    - vendor: Computer
      type: string
      description: hostname of the certification authority that recorded the event
      ecs: host.name
      status: mapped
      notes: >-
        the CA server, not the requesting machine; host attribution for the
        requester comes from the ccm/rmd values inside Attributes
    - vendor: RequestId
      type: string
      description: >-
        CA database request identifier assigned when the request arrives
        (win:UnicodeString holding a decimal number)
      ecs: null
      status: unmapped
      custom: adcs.request.id
      notes: >
        the join key that stitches 4886 (received), 4889 (pending), 4888
        (denied) and 4887 (issued) into one request; there is no ECS
        transaction-id field for a certificate request, and it must not be
        overloaded onto event.id, so it stays custom
    - vendor: Requester
      type: string
      description: DOMAIN\account that submitted the certificate request
      ecs: user.name
      status: mapped
      transform: >
        split the DOMAIN\account form into user.domain and user.name; for a
        machine request the account ends in $ and should also populate
        related.hosts
    - vendor: Attributes
      type: string
      description: newline-separated key:value blob of request attributes supplied with the request
      ecs: null
      status: partial
      custom: adcs.request.attributes
      notes: >
        carries ccm (DNS name of the machine that opened the DCOM connection
        to the CA), rmd (request machine DNS name), cdc (the domain controller
        the requester contacted), CertificateTemplate, UserAgent and
        RequestOSVersion as one free-text string; until it is split, the
        requesting host and the requested template are both unqueryable, which
        is why published AD CS detections regex this field instead of a proper
        one
      transform: >
        parse into adcs.request.ccm, .rmd, .cdc, .template and .os_version;
        ccm is the closest thing to host attribution on this dataset and
        should also populate source.address and related.hosts
    - vendor: Disposition
      type: string
      description: CR_DISP result code for the request (win:UnicodeString holding 0-6)
      ecs: event.outcome
      status: partial
      transform: >
        0 incomplete / 1 error / 2 denied -> failure, 3 issued / 4 issued
        separately -> success, 5 taken under submission (pending) -> unknown,
        6 revoked -> failure; keep the raw code alongside as
        adcs.request.disposition because the six-value distinction is lost
        once it is collapsed to the ECS enum
    - vendor: Keywords
      type: string
      description: HexInt64 keyword bitmask carrying the audit-success/audit-failure flag
      ecs: null
      status: partial
      custom: winlog.keywords
      notes: >
        deliberately NOT the source of event.outcome on this dataset, unlike
        the generic Windows map: a 4888 denial is recorded as an audit SUCCESS
        because the audit operation succeeded, so driving event.outcome off
        this bitmask marks every denied certificate request as a success
    - vendor: SubjectKeyIdentifier
      type: string
      description: >-
        subject key identifier of the issued certificate's public key,
        rendered as space-separated hex bytes
      ecs: null
      status: unmapped
      custom: adcs.certificate.subject_key_id
      notes: >
        ECS 9.4 has no SKI field at any x509 reuse point; the value is the
        only durable link between a 4887 issuance and a later revocation or a
        certificate seen on the wire, so it is worth keeping despite having no
        home
    - vendor: Subject
      type: string
      description: distinguished name of the subject of the issued certificate (4887/4888)
      ecs: file.x509.subject.distinguished_name
      status: partial
      notes: >
        ECS 9.4 exposes x509.* only as a reuse set under file.*,
        tls.client/tls.server and threat.indicator.*; file.x509.* is chosen
        here because the certificate IS the object of the event and that is
        the reuse point Elastic's own Zeek x509 data stream uses for a
        standalone certificate - the opposite call from the active-directory
        map, where the certificate is merely presented to the KDC. The
        per-component subject fields (common_name, organization, ...) require
        parsing the DN, and the iam alerting profile needs the CN copied to
        user.target.name.
    - vendor: SubjectUserName
      type: string
      description: >-
        account that acted on an existing request (4868 manager denial, 4869
        resubmission)
      ecs: user.name
      status: partial
      notes: >
        4868 and 4869 name the certificate manager in SubjectUserName/
        SubjectDomainName/SubjectUserSid and carry no Requester, while
        4886-4889 carry Requester and no Subject* fields; no event carries
        both, so the pipeline must coalesce the two into user.name rather than
        mapping only one of them. On 4868/4869 the original requester is
        recoverable only by joining RequestId back to the 4886 that opened the
        request.
    - vendor: SubjectUserSid
      type: string
      description: security identifier of the account named in SubjectUserName
      ecs: user.id
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through and carry _raw end to end:
          the Attributes blob is the evidence on this feed, it is newline-rich
          free text, and no downstream parser can reconstruct it once it has
          been trimmed. Limit low-side work to Persistent Queue backpressure
          on the Elastic destination, CA-role enrichment (host -> CA common
          name, enclave, PKI owner) that is cheaper near the source than in an
          ingest pipeline, and an event-id allow-list scoped to the
          request-lifecycle events (4868, 4869, 4886-4889) rather than
          field-level trimming, so an auditpol change that suddenly enables
          the whole subcategory cannot flood the route. That same allow-list
          is where the split from ca-admin starts: the administrative event
          ids ride the same Security-channel stream off the same agent and are
          tagged, not diverted to a second collector.
        elastic: >
          Own a logs-system.security@custom pipeline for the AD CS event ids
          that does four things the stock System pipeline will not: reroute
          the administrative event ids (4870, 4871, 4872, 4882, 4890, 4891,
          4892, 4896, 4898, 4899, 4900) to logs-pki_ocsp.ca_admin so the
          issuance firehose and the administration record land in separate
          data streams and can be alerted on separately; split the
          newline-separated Attributes blob into adcs.request.* keys so
          ccm/rmd become queryable host attribution and the requested template
          stops hiding inside free text; derive event.outcome from Disposition
          (3/4 issued -> success, 1/2 error or denied -> failure, 5 pending ->
          unknown) and explicitly NOT from the audit-success Keywords bitmask,
          which reports success on a 4888 denial; and drive event.action off
          an event-id lookup table while extracting the CN from Subject into
          user.target.name, so the iam alerting profile has both a populated
          action and the principal the certificate speaks for alongside the
          requester. Add explicitly typed custom-namespace index-template
          mappings for adcs.request.id, adcs.request.template and
          adcs.certificate.subject_key_id as keyword; the adcs.template.*
          mappings belong to ca-admin.
        relay: >
          Use the thin-envelope mode (A) - {_dataId, @timestamp, host, _raw}
          with extraction staying in the high-side ingest pipeline - because
          the raw event is the artifact and the CSOC needs the unsplit
          Attributes string alongside whatever the pipeline derives from it.
          The content-filter friction to settle with the guard owner on this
          feed is volume and character set rather than record size: issuance
          tracks enrolment, so a card-refresh campaign or a mass autoenrolment
          multiplies the event rate for hours and the per-feed policy needs a
          rate ceiling that backs pressure into the low-side Persistent Queue
          instead of discarding, and Attributes is attacker-influenced free
          text - a requester chooses what goes into the SAN attribute - so the
          filter must tolerate arbitrary UTF-8 inside a JSON string value
          rather than rejecting the record, since a rejected 4886 is exactly
          the request worth reading. Nothing CEF-shaped crosses on this route;
          with no return channel, reconcile low-side and high-side counts per
          (dataset, hour) per event id, which is also how a misrouted ca-admin
          event id shows up.
      direct:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through and carry _raw end to end:
          the Attributes blob is the evidence on this feed, it is newline-rich
          free text, and no downstream parser can reconstruct it once it has
          been trimmed. Confine the collector's work to Persistent Queue
          backpressure on the Elastic destination, CA-role enrichment (host ->
          CA common name, enclave, PKI owner) that is cheaper near the source
          than in an ingest pipeline, and an event-id allow-list scoped to the
          request-lifecycle events (4868, 4869, 4886-4889) rather than
          field-level trimming, so an auditpol change that suddenly enables
          the whole subcategory cannot flood the route. That same allow-list
          is where the split from ca-admin starts: the administrative event
          ids ride the same Security-channel stream off the same agent and are
          tagged, not diverted to a second collector.
        elastic: >
          Own a logs-system.security@custom pipeline for the AD CS event ids
          that does four things the stock System pipeline will not: reroute
          the administrative event ids (4870, 4871, 4872, 4882, 4890, 4891,
          4892, 4896, 4898, 4899, 4900) to logs-pki_ocsp.ca_admin so the
          issuance firehose and the administration record land in separate
          data streams and can be alerted on separately; split the
          newline-separated Attributes blob into adcs.request.* keys so
          ccm/rmd become queryable host attribution and the requested template
          stops hiding inside free text; derive event.outcome from Disposition
          (3/4 issued -> success, 1/2 error or denied -> failure, 5 pending ->
          unknown) and explicitly NOT from the audit-success Keywords bitmask,
          which reports success on a 4888 denial; and drive event.action off
          an event-id lookup table while extracting the CN from Subject into
          user.target.name, so the iam alerting profile has both a populated
          action and the principal the certificate speaks for alongside the
          requester. Add explicitly typed custom-namespace index-template
          mappings for adcs.request.id, adcs.request.template and
          adcs.certificate.subject_key_id as keyword; the adcs.template.*
          mappings belong to ca-admin.
- id: ca-admin
  name: Certification Authority administration and template changes
  description: >
    The administration record of the certification authority itself: 4870
    certificate revoked, 4871 and 4872 CRL publish requested and completed,
    4882 CA security permissions changed, 4890 certificate manager settings
    changed, 4891 configuration entry changed, 4892 CA property changed, 4896
    rows deleted from the certificate database, 4898 certificate template
    loaded, 4899 certificate template updated, and 4900 certificate template
    security updated. This is the same collection as ca-audit and nothing
    about the collection path changes: the same Windows Security channel, the
    same Microsoft-Windows-Security-Auditing provider, the same "Certification
    Services" subcategory, the same Elastic Agent on the same issuing CA
    hosts. There is no new agent, no new channel and no new port - the two
    datasets are separated by event id in the pipeline, and that is the only
    thing that separates them. They are separated because the two halves
    behave nothing alike. Issuance is a per-certificate firehose whose volume
    tracks enrolment; administration is a handful of events a week, and it is
    where the AD CS attack path is visible. The escalations catalogued as
    ESC1-ESC8 in SpecterOps' Certified Pre-Owned research turn on exactly
    these events. ESC1 and ESC2 turn on a template gaining
    ENROLLEE_SUPPLIES_SUBJECT in msPKI-Certificate-Name-Flag, losing manager
    approval in msPKI-Enrollment-Flag, or gaining a client-authentication or
    Any Purpose EKU, all of which appear only as a NewTemplateContent /
    OldTemplateContent diff on 4899; ESC3 turns on an enrollment-agent
    template the same way. ESC4 turns on template enrollment and write rights,
    which appear as the SDDL in SecurityDescriptor on 4898 and
    Old/NewSecurityDescriptor on 4900. ESC6 turns on the policy module's
    EDITF_ATTRIBUTESUBJECTALTNAME2 flag, which appears as a 4891
    Node/Entry/Value change, and ESC7 on the CA-level ManageCA and
    ManageCertificates rights, which appear as 4882 SecuritySettings and 4890
    RestrictedPermissions. Bundled into the issuance volume these events are
    invisible and the CSOC cannot alert on the second group without alerting
    on the first, which is the whole reason for the split. This is not a
    complete AD CS detection surface on its own, and it does not always name
    the person responsible: 4898, 4899 and 4900 record what the CA loaded from
    Active Directory, not who changed it, so the template events carry no
    acting account and the actor has to be recovered from directory-service
    auditing on the domain controller. ESC5, the ACLs on the PKI objects in AD
    - the CA computer object, the NTAuthCertificates and Enrollment Services
    containers - is changed in the directory rather than on the CA and
    produces no event here at all; it needs directory object auditing on the
    active-directory map. ESC8, the NTLM relay to the web enrollment endpoint,
    leaves no administrative trace either: on this catalog it surfaces only as
    an ordinary machine-account issuance on ca-audit. The request side is a
    genuine coverage gap - a relay hits /certsrv or the CES/CEP endpoints, and
    that is a different IIS site from the Online Responder's, so it is not in
    ocsp-access, which is deliberately scoped to the responder's own site. No
    row in this catalog carries the web-enrollment site's access log today.
    Like ca-audit, none of these events exist unless auditing is turned on
    twice: the "Certification Services" subcategory must be enabled with
    auditpol AND the individual audit categories must be ticked on the
    Auditing tab of the CA's properties (certutil -setreg CA\AuditFilter). The
    template events 4898, 4899 and 4900 need a third switch, certutil -setreg
    policy\EditFlags +EDITF_AUDITCERTTEMPLATELOAD, which is off by default - a
    CA that has never had it set emits no template auditing whatever, and the
    ESC1 and ESC4 tripwires below are then silently absent rather than quiet.
    Confirming that flag per CA is the first onboarding step for this feed.
    Field names below are the AD CS provider's own EventData element names, so
    they arrive under winlog.event_data.* with these exact spellings. As with
    ca-audit this is grounded in AD CS documentation only; an Entrust or other
    vendor CA records its administration differently and needs its own
    dataset.
  event_categories:
  - configuration
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        The same Elastic Agent that feeds ca-audit - one winlog input on each
        issuing CA reading the Security channel - carries this dataset too;
        the administrative event ids are tagged here, not collected
        separately. Issuing CAs and their HSMs are frequently held in a
        higher-assurance enclave than the general Windows estate precisely
        because they mint authentication credentials.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-pki_ocsp.ca_admin
      notes: >
        Elastic Agent writes the Security channel to logs-system.security like
        every other Windows host; the split lands here, in a reroute processor
        in the logs-system.security@custom pipeline that sends the
        administrative event ids to this data stream. A separate data stream
        is what buys the CSOC a retention, alerting and access policy for the
        AD CS attack path that is independent of enrolment volume.
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        The same Elastic Agent that feeds ca-audit - one winlog input on each
        issuing CA reading the Security channel - carries this dataset too;
        the administrative event ids are tagged here, not collected
        separately, and the feed forwards to Elastic with no guard crossing.
        Issuing CAs and their HSMs are frequently held in a higher-assurance
        enclave than the general Windows estate precisely because they mint
        authentication credentials.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-pki_ocsp.ca_admin
      notes: >
        Elastic Agent writes the Security channel to logs-system.security like
        every other Windows host; the split lands here, in a reroute processor
        in the logs-system.security@custom pipeline that sends the
        administrative event ids to this data stream.
  formats:
  - format: windows-event
    parsing:
      mechanism: elastic-integration
      artifact: System integration (winlog input, Security channel)
      notes: >
        There is no Elastic AD CS integration and no adcs data stream. The
        System integration's security data stream transports these events
        because they sit on the Security channel, and the winlog input names
        the EventData elements from the provider manifest, so TemplateContent,
        SecurityDescriptor, SecuritySettings, PropertyName and the rest do
        arrive as winlog.event_data.* keys. The split from ca-audit happens in
        exactly one place and it is worth naming: a reroute processor keyed on
        winlog.event_id in the logs-system.security@custom ingest pipeline,
        which sends 4870, 4871, 4872, 4882, 4890, 4891, 4892, 4896, 4898, 4899
        and 4900 to logs-pki_ocsp.ca_admin and leaves the request-lifecycle
        ids on logs-system.security. Cribl tags the same two groups on the way
        past so the low side can rate-limit and reconcile them separately, but
        the ingest pipeline is the authoritative split, so an event that
        reaches Elastic by any other path still lands in the right stream. The
        stock System pipeline gives none of these fields ECS homes and derives
        no event.action from the AD CS event id, which is why every template
        and ACL value below is still raw event_data.
    fields:
    - vendor: EventID
      type: integer
      description: >-
        numeric identifier of the AD CS audit event (4870, 4871, 4872, 4882,
        4890, 4891, 4892, 4896 and 4898-4900 on this dataset)
      ecs: event.code
      status: mapped
      notes: >-
        the field the pipeline splits on, and the only thing distinguishing
        this dataset from ca-audit at collection time; duplicated from
        ca-audit deliberately so each inventory stands alone
    - vendor: Computer
      type: string
      description: hostname of the certification authority that recorded the event
      ecs: host.name
      status: mapped
      notes: >
        the CA that performed or observed the administrative action. On
        4898-4900 the template object itself lives in AD, not on the CA, so
        this names the CA that loaded or wrote the template and not the full
        set of CAs the change affects - a template change is estate-wide and
        every CA publishing that template reloads it
    - vendor: Keywords
      type: string
      description: HexInt64 keyword bitmask carrying the audit-success/audit-failure flag
      ecs: event.outcome
      status: partial
      transform: >
        audit success -> success, audit failure -> failure, on the events in
        this dataset only
      notes: >
        the opposite call from ca-audit, deliberately. On the issuance side
        the bitmask is useless because a 4888 denial is recorded as an audit
        success; here the audited operation IS the administrative action, so
        success and failure line up, and none of 4870-4900 carries a result
        field of its own. The configuration alerting profile requires
        event.outcome and this is the only source of it
    - vendor: SubjectUserName
      type: string
      description: account that performed the administrative action
      ecs: user.name
      status: mapped
      notes: >
        the operator-driven events - 4870, 4871, 4882, 4890, 4891, 4892 and
        4896 - carry the Subject* family and never Requester, which is the
        exact inverse of ca-audit; this is the account to alert on. Two groups
        carry no actor at all. 4872 is written by the CA service when it
        finishes publishing a CRL, and 4898, 4899 and 4900 record what the CA
        loaded from the directory rather than who changed it, because the
        template object lives in AD and the CA only observes the result. On
        those five ids user.name is legitimately absent, the actor has to be
        recovered from directory-service auditing (5136 on the domain
        controller named in DCDNSName), and a CSOC rule that requires
        user.name will silently skip exactly the ESC1 and ESC4 evidence this
        dataset exists for
    - vendor: SubjectDomainName
      type: string
      description: domain of the account that performed the administrative action
      ecs: user.domain
      status: mapped
    - vendor: SubjectUserSid
      type: string
      description: security identifier of the account that performed the administrative action
      ecs: user.id
      status: mapped
      notes: >-
        the durable identity - a renamed or since-deleted operator account
        still resolves - and the field to correlate on when the account name
        is ambiguous across domains
    - vendor: SubjectLogonId
      type: string
      description: 'hexadecimal logon session identifier of the operator''s session'
      ecs: null
      status: unmapped
      custom: winlog.logon.id
      notes: >
        ECS 9.4 has no logon-session field at any reuse point. winlog.logon.id
        is the name the winlog input already uses for this value elsewhere on
        the Security channel, so the custom key matches the rest of the
        Windows estate rather than inventing an adcs.* spelling; it joins an
        administrative action back to the 4624/4672 that opened the session,
        which is how a console administrator is told apart from a service
        context or a relayed credential
    - vendor: CertificateSerialNumber
      type: string
      description: serial number of the certificate being revoked (4870)
      ecs: file.x509.serial_number
      status: partial
      transform: >
        ECS 9.4 requires x509.serial_number at every reuse point to be
        base-16, uppercase, with no colons or spaces; the Windows-rendered
        value is lowercase hex, so it must be normalized or revocation events
        will never join to certificates seen elsewhere in the estate
    - vendor: RevocationReason
      type: string
      description: CRLReason code recorded with the revocation (4870)
      ecs: event.reason
      status: partial
      transform: >
        numeric CRLReason needs a lookup to text - 0 unspecified, 1
        keyCompromise, 2 caCompromise, 3 affiliationChanged, 4 superseded, 5
        cessationOfOperation, 6 certificateHold, 8 removeFromCRL, -1 unrevoke;
        1 and 2 are the two values a CSOC should alert on directly, and -1
        deserves its own rule because un-revoking a certificate restores an
        access path someone previously decided to remove
    - vendor: NextUpdate
      type: string
      description: validity end stamped into the CRL being requested (4871)
      ecs: null
      status: unmapped
      custom: adcs.crl.next_update
      notes: >-
        not an ECS timestamp target - @timestamp is the publication event, and
        ECS has no field for the validity window of a revocation list
    - vendor: CRLNumber
      type: string
      description: sequence number of the published CRL (4872)
      ecs: null
      status: unmapped
      custom: adcs.crl.number
      notes: >-
        monotonic per CA, so a gap or a repeat is the cheapest evidence that
        CRL publication is broken or has been tampered with; a stalled CRL
        number means revocations issued after it are not being honoured by
        relying parties
    - vendor: IsBaseCRL
      type: string
      description: whether the published list is a base CRL or a delta CRL (4872)
      ecs: null
      status: unmapped
      custom: adcs.crl.is_base
    - vendor: PublishURLs
      type: string
      description: file and LDAP locations the CRL was published to (4872)
      ecs: null
      status: unmapped
      custom: adcs.crl.publish_urls
      notes: >
        a multi-valued list in one string; not url.original, which belongs to
        the web profile and expects a single request URL. Worth keeping
        because a CRL distribution point that quietly changes is how
        revocation is defeated without revoking anything
    - vendor: SecuritySettings
      type: string
      description: SDDL security descriptor of the CA after the permission change (4882)
      ecs: null
      status: unmapped
      custom: adcs.ca.security_descriptor
      notes: >
        ECS has no ACL field anywhere, so this stays custom. It is the primary
        evidence for ESC7: ManageCA and ManageCertificates are granted here,
        and ManageCA alone is enough to turn on the ESC6 flag and then issue
        against any template. Only the resulting descriptor is logged, never
        the previous one, so a diff needs the last observed value from this
        index
    - vendor: EnableRestrictedPermissions
      type: string
      description: whether certificate managers are restricted rather than unrestricted (4890)
      ecs: null
      status: unmapped
      custom: adcs.ca.restrict_certificate_managers
      notes: >-
        a flip from restricted to unrestricted removes the boundary described
        by RestrictedPermissions in one action and is worth alerting on by
        itself
    - vendor: RestrictedPermissions
      type: string
      description: >-
        per-manager allow and deny list of the templates each certificate
        manager may act on (4890)
      ecs: null
      status: unmapped
      custom: adcs.ca.certificate_manager_permissions
      notes: >
        Microsoft rates 4890 severe, and correctly: the certificate-manager
        restriction is what stops an officer approving requests on templates
        they have no business touching, and enroll-on-behalf-of for smart card
        certificates is the usual abuse of a loosened one. Free-text rendering
        of a structured setting, with no ECS analogue
    - vendor: Node
      type: string
      description: configuration node under which the changed entry lives (4891)
      ecs: null
      status: unmapped
      custom: adcs.ca.config.node
    - vendor: Entry
      type: string
      description: name of the configuration entry that changed (4891)
      ecs: null
      status: unmapped
      custom: adcs.ca.config.entry
      notes: >
        the ESC6 tripwire. The policy module's EditFlags entry gaining
        EDITF_ATTRIBUTESUBJECTALTNAME2 lets any requester attach an arbitrary
        subject alternative name to any request on any template, and this
        Node/Entry/Value triple is the only place on the CA where that change
        is recorded
    - vendor: Value
      type: string
      description: rendered new value of the configuration entry (4891)
      ecs: null
      status: unmapped
      custom: adcs.ca.config.value
      notes: >-
        only the new value is logged, so an EditFlags bitmask has to be diffed
        against the last value this index saw for the same Node and Entry;
        there is no old-value field on 4891 the way there is on 4899
    - vendor: PropertyName
      type: string
      description: name of the CA property that changed (4892)
      ecs: null
      status: unmapped
      custom: adcs.ca.property.name
      notes: >
        4892 also fires in ordinary operation - CA certificate and CRL
        properties are rewritten on renewal - so it is the one event id in
        this dataset with a routine baseline, and alerting should key on the
        property name rather than on the event id
    - vendor: PropertyIndex
      type: string
      description: numeric index of the property within its property set (4892)
      ecs: null
      status: unmapped
      custom: adcs.ca.property.index
    - vendor: PropertyType
      type: string
      description: data type of the changed property (4892)
      ecs: null
      status: unmapped
      custom: adcs.ca.property.type
    - vendor: PropertyValue
      type: string
      description: new value of the changed property (4892)
      ecs: null
      status: unmapped
      custom: adcs.ca.property.value
      notes: >-
        binary properties render as hex or as an empty string, so absence of a
        value here does not mean the property was cleared
    - vendor: TableId
      type: string
      description: identifier of the certificate database table rows were removed from (4896)
      ecs: null
      status: unmapped
      custom: adcs.database.table_id
    - vendor: Filter
      type: string
      description: restriction the row deletion ran under (4896)
      ecs: null
      status: unmapped
      custom: adcs.database.filter
      notes: >-
        the only record of WHICH rows were removed - the deleted rows
        themselves are gone and their request ids are never logged - so
        without this string a 4896 says only that evidence disappeared
    - vendor: RowsDeleted
      type: string
      description: count of rows removed from the certificate database (4896)
      ecs: null
      status: unmapped
      custom: adcs.database.rows_deleted
      notes: >
        win:UnicodeString holding a decimal count, so it needs converting to a
        number before it can be thresholded; deletion from the certificate
        database is the documented "attacker covering their tracks after
        issuing certificates" event and deserves an alert on any non-zero
        value
    - vendor: TemplateInternalName
      type: string
      description: >-
        internal (non-display) name of the certificate template loaded,
        updated or resecured (4898/4899/4900)
      ecs: null
      status: unmapped
      custom: adcs.template.name
      notes: >-
        internal name, which is what appears in ca-audit request Attributes as
        CertificateTemplate - not the friendly display name shown in the MMC -
        so it is the join key between a template change here and the issuance
        that follows it there
    - vendor: TemplateVersion
      type: string
      description: major version number of the certificate template (4898/4899/4900)
      ecs: null
      status: unmapped
      custom: adcs.template.version
      notes: >-
        increments on every template change, so a version jump without a
        corresponding change ticket is the cheapest ESC4 tripwire in this
        dataset
    - vendor: TemplateSchemaVersion
      type: string
      description: AD schema version the template is written against (4898/4899/4900)
      ecs: null
      status: unmapped
      custom: adcs.template.schema_version
      notes: >-
        schema version 1 templates carry no msPKI-* enrollment flags at all,
        so the ESC1 indicators simply do not exist in their content and a
        detection that requires them will pass a v1 template silently
    - vendor: TemplateOID
      type: string
      description: object identifier of the certificate template (4898/4899/4900)
      ecs: null
      status: unmapped
      custom: adcs.template.oid
      notes: >-
        stable across renames, unlike TemplateInternalName, so it is the
        identifier to correlate on when a template is renamed as part of the
        change
    - vendor: TemplateDSObjectFQDN
      type: string
      description: distinguished name of the template object in Active Directory (4898/4899/4900)
      ecs: null
      status: unmapped
      custom: adcs.template.ds_object_fqdn
      notes: >-
        names the forest and configuration naming context the template came
        from, which is what tells a shared-forest estate whether the change
        originated in this enclave
    - vendor: DCDNSName
      type: string
      description: domain controller the CA read the template from (4898/4899/4900)
      ecs: null
      status: unmapped
      custom: adcs.template.dc_dns_name
      transform: >-
        copy to related.hosts so the DC is searchable alongside the CA; it
        must not go to host.name, which is the CA, and it is not host.target
        either - the DC is the source of the template, not the object of the
        administrative action
    - vendor: TemplateContent
      type: string
      description: full serialized attribute set of the template as loaded (4898)
      ecs: null
      status: unmapped
      custom: adcs.template.content
      notes: >
        4898 carries a single content blob rather than the before/after pair
        on 4899, because a load is not a change; it is still the only place a
        template's effective configuration is recorded on the CA, so a CA
        restart is the one chance to baseline every template at once
    - vendor: NewTemplateContent
      type: string
      description: full serialized attribute set of the template after the change (4899/4900)
      ecs: null
      status: unmapped
      custom: adcs.template.content_new
      notes: >
        multi-kilobyte newline-separated dump; the ESC1 indicators
        (msPKI-Certificate-Name-Flag with ENROLLEE_SUPPLIES_SUBJECT,
        msPKI-Enrollment-Flag dropping manager approval, and the EKU list
        gaining Client Authentication) all live inside this free text and have
        no ECS representation
    - vendor: OldTemplateContent
      type: string
      description: full serialized attribute set of the template before the change (4899/4900)
      ecs: null
      status: unmapped
      custom: adcs.template.content_old
      notes: >-
        paired with NewTemplateContent so the diff is computable at query
        time; same unbounded free-text problem
    - vendor: SecurityDescriptor
      type: string
      description: SDDL security descriptor of the template as loaded (4898)
      ecs: null
      status: unmapped
      custom: adcs.template.security_descriptor
      notes: >-
        the enrollment ACL in SDDL form; ECS has no ACL field, and this is the
        primary evidence for ESC4-style enrollment-rights grants
    - vendor: NewSecurityDescriptor
      type: string
      description: SDDL security descriptor of the template after the security change (4900)
      ecs: null
      status: unmapped
      custom: adcs.template.security_descriptor_new
      notes: >
        4900 is the event that fires when only the template ACL moves, and it
        is the highest-value single event in this dataset: an Enroll or Write
        ACE appearing for an unexpected principal is ESC4 in one record. The
        SDDL has to be expanded and the SIDs resolved before a rule can read
        it, which is work no stock pipeline does
    - vendor: OldSecurityDescriptor
      type: string
      description: SDDL security descriptor of the template before the security change (4900)
      ecs: null
      status: unmapped
      custom: adcs.template.security_descriptor_old
      notes: >-
        the before half of the ACL diff, and the reason 4900 is worth
        collecting even though 4898 already carries a descriptor - 4898 only
        tells you the state at load time
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through and carry _raw end to end:
          this is a low-volume, high-forensic-value feed where the rendered
          template content and the SDDL descriptors are the evidence, so it is
          the last Windows-class route to lose raw. Low-side work is the same
          agent and the same pipeline that serves ca-audit, with three
          additions: tag the administrative event ids so the two groups can be
          rate-limited and reconciled separately, apply CA-role enrichment
          (host -> CA common name, enclave, PKI owner) that is cheaper near
          the source than in an ingest pipeline, and give this group its own
          Persistent Queue reservation on the Elastic destination so an
          enrolment surge on ca-audit cannot delay a template change behind
          it. Do not field-trim and do not sample: at a handful of events a
          week there is nothing to save, and the one event dropped would be
          the one that matters.
        elastic: >
          The reroute processor that lands events here belongs in
          logs-system.security@custom and is described in this dataset's route
          notes; everything below runs in a logs-pki_ocsp.ca_admin@custom
          pipeline after it. Do four things. Drive event.action off an
          event-id lookup table - certificate-revoked, ca-permissions-changed,
          certificate-manager-settings-changed, ca-configuration-changed,
          ca-property-changed, certificate-database-rows-deleted,
          certificate-template-loaded, certificate-template-updated,
          certificate-template-security-updated - because both the
          configuration and iam profiles require event.action and no vendor
          field supplies it. Set event.outcome from the audit-success/failure
          Keywords bitmask, which is sound here even though it is not on
          ca-audit. Populate user.target.name on the events that act on a
          named object - the template internal name on 4898-4900, the
          certificate serial on 4870 - so the iam profile has a target and an
          analyst can see who did what to which template in one row, and
          accept that on 4898-4900 the actor half of that row has to be
          enriched in from the domain controller's 5136 rather than derived
          from the event. And parse the SDDL in SecurityDescriptor,
          NewSecurityDescriptor, OldSecurityDescriptor and SecuritySettings
          into resolved principal and right pairs under adcs.acl.*, with the
          raw string kept, because an unexpanded SDDL is unsearchable and ESC4
          and ESC7 both live inside one. Add explicitly typed custom-namespace
          index-template mappings for adcs.template.name/.oid/.version,
          adcs.ca.config.node/.entry, adcs.ca.property.name and
          adcs.database.table_id as keyword, and map
          adcs.template.content_old/_new, adcs.template.content and every
          descriptor field as text with keyword ignore_above so multi-kilobyte
          template dumps stay searchable without blowing up the index.
        relay: >
          Use the thin-envelope mode (A) - {_dataId, @timestamp, host, _raw}
          with extraction staying in the high-side ingest pipeline - because
          the volume is negligible and the raw event is the artifact. The
          specific content-filter friction to settle with the guard owner is
          4898, 4899 and 4900: TemplateContent, OldTemplateContent and
          NewTemplateContent are multi-kilobyte, unbounded, newline-rich free
          text, and the four descriptor fields are SDDL, which is dense
          punctuation that a naive filter reads as suspicious. Agree a
          low-side length cap with an explicit truncation flag on the event
          rather than letting a custom NDJSON filter reject or silently trim
          the very events that reveal ESC1 and ESC4 template changes, and
          agree that SDDL is passed as an opaque string. Nothing CEF-shaped
          crosses on this route. With no return channel, reconcile low-side
          and high-side counts per (dataset, hour) per event id: on a feed
          this quiet a filter that drops only the large template events is
          indistinguishable from a week in which nobody changed a template,
          and that is exactly the failure this dataset exists to prevent.
      direct:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through and carry _raw end to end:
          this is a low-volume, high-forensic-value feed where the rendered
          template content and the SDDL descriptors are the evidence, so it is
          the last Windows-class route to lose raw. The collector's work is
          the same agent and the same pipeline that serves ca-audit, with
          three additions: tag the administrative event ids so the two groups
          can be rate-limited and reconciled separately, apply CA-role
          enrichment (host -> CA common name, enclave, PKI owner) that is
          cheaper near the source than in an ingest pipeline, and give this
          group its own Persistent Queue reservation on the Elastic
          destination so an enrolment surge on ca-audit cannot delay a
          template change behind it. Do not field-trim and do not sample: at a
          handful of events a week there is nothing to save, and the one event
          dropped would be the one that matters.
        elastic: >
          The reroute processor that lands events here belongs in
          logs-system.security@custom and is described in this dataset's route
          notes; everything below runs in a logs-pki_ocsp.ca_admin@custom
          pipeline after it. Do four things. Drive event.action off an
          event-id lookup table - certificate-revoked, ca-permissions-changed,
          certificate-manager-settings-changed, ca-configuration-changed,
          ca-property-changed, certificate-database-rows-deleted,
          certificate-template-loaded, certificate-template-updated,
          certificate-template-security-updated - because both the
          configuration and iam profiles require event.action and no vendor
          field supplies it. Set event.outcome from the audit-success/failure
          Keywords bitmask, which is sound here even though it is not on
          ca-audit. Populate user.target.name on the events that act on a
          named object - the template internal name on 4898-4900, the
          certificate serial on 4870 - so the iam profile has a target and an
          analyst can see who did what to which template in one row, and
          accept that on 4898-4900 the actor half of that row has to be
          enriched in from the domain controller's 5136 rather than derived
          from the event. And parse the SDDL in SecurityDescriptor,
          NewSecurityDescriptor, OldSecurityDescriptor and SecuritySettings
          into resolved principal and right pairs under adcs.acl.*, with the
          raw string kept, because an unexpanded SDDL is unsearchable and ESC4
          and ESC7 both live inside one. Add explicitly typed custom-namespace
          index-template mappings for adcs.template.name/.oid/.version,
          adcs.ca.config.node/.entry, adcs.ca.property.name and
          adcs.database.table_id as keyword, and map
          adcs.template.content_old/_new, adcs.template.content and every
          descriptor field as text with keyword ignore_above so multi-kilobyte
          template dumps stay searchable without blowing up the index.
- id: ocsp-responder
  name: Online Responder service and revocation-configuration events
  description: >
    The Online Responder's own view of itself - the service and
    revocation-configuration events that say whether CAC/PIV validation is
    actually working. Two channels, one operational story. The Security
    channel carries the OCSP audit events under the same Certification
    Services subcategory as the CA above: 5120 responder service started, 5121
    stopped, 5122 a CA configuration entry changed, 5123 a configuration
    property changed, 5124 a security setting updated, 5125 a request was
    submitted, 5126 the signing certificate was automatically renewed, and
    5127 the revocation provider successfully refreshed its CRL data. The
    Application channel carries the Microsoft-Windows- OnlineResponder
    provider's operational events - 17 service started, 20 service failed to
    start, 21 exception, 22 an extremely long request was rejected as a
    possible DoS, 29 a revocation configuration could not be loaded so
    requests are being rejected, 31 performance counters failed to initialize.
    Events 27/29 and 5127 together are the freshness signal that matters most:
    an Online Responder whose revocation provider has stopped updating keeps
    answering, and answers "good" from stale data. Two documented limits shape
    everything below. First, 5125 carries only the responder service account's
    own subject context - there is no requested serial number, no issuer, no
    client address - so it counts requests and nothing else; per-request
    visibility has to come from the IIS dataset. Second, the
    Application-channel provider declares its insertion strings without names,
    so those events surface as winlog.event_data.paramN with no semantics
    attached.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same Elastic Agent path as the CA dataset above. Responders are
        commonly placed closer to the relying-party network than the issuing
        CA is, so a responder in the lower enclave takes the guarded path
        shown here.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.security
      notes: >
        the 512x audit events land in logs-system.security; the
        Microsoft-Windows-OnlineResponder operational events sit on the
        Application channel and land in logs-system.application, so the
        dataset spans two data streams and any responder-health dashboard has
        to query both
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same Elastic Agent path as the CA dataset above. A responder in the
        higher enclave ships to Cribl, which forwards to Elastic with no guard
        crossing.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.security
      notes: >
        the 512x audit events land in logs-system.security; the
        Microsoft-Windows-OnlineResponder operational events sit on the
        Application channel and land in logs-system.application, so the
        dataset spans two data streams and any responder-health dashboard has
        to query both
  formats:
  - format: windows-event
    parsing:
      mechanism: elastic-integration
      artifact: System integration (winlog input, Security and Application channels)
      notes: >
        The System integration transports both channels but has no Online
        Responder handling. The Security-channel 512x events name their
        EventData elements from the provider manifest and so arrive with the
        spellings below; the Application-channel OnlineResponder events do
        not, and arrive as winlog.event_data.paramN. Nothing about revocation
        configuration, CRL freshness or responder health is normalized by any
        stock artifact.
    fields:
    - vendor: EventID
      type: integer
      description: >-
        numeric identifier of the responder event (5120-5127 on Security,
        17-31 on Application)
      ecs: event.code
      status: mapped
    - vendor: Computer
      type: string
      description: hostname of the Online Responder that recorded the event
      ecs: host.name
      status: mapped
    - vendor: Provider
      type: string
      description: >-
        name of the event provider (Microsoft-Windows-Security-Auditing or
        Microsoft-Windows-OnlineResponder)
      ecs: event.provider
      status: mapped
      notes: >-
        the only reliable way to tell the audit half of this dataset from the
        operational half once both are in Elastic
    - vendor: CAConfigurationId
      type: string
      description: name of the revocation configuration the event applies to (5122/5126/5127)
      ecs: null
      status: unmapped
      custom: ocsp.revocation_configuration.name
      notes: >-
        identifies which CA in the hierarchy the responder was answering for;
        there is no ECS field for a revocation configuration, and service.name
        is already the responder itself
    - vendor: BaseCRLNumber
      type: string
      description: CRL sequence number of the base CRL the revocation provider loaded (5127)
      ecs: null
      status: unmapped
      custom: ocsp.crl.base_number
      notes: >-
        monotonically increasing per CA; a number that stops advancing while
        the service still reports healthy is the clearest sign the responder
        is serving stale revocation data
      transform: >-
        win:UnicodeString holding a decimal number - convert to long so it can
        be graphed and differenced
    - vendor: BaseCRLThisUpdate
      type: string
      description: thisUpdate timestamp of the base CRL that was loaded (5127)
      ecs: null
      status: partial
      custom: ocsp.crl.base_this_update
      notes: >-
        the freshness anchor for the whole validation chain; ECS has no CRL
        fields at all, so this cannot go anywhere standard
      transform: >-
        rendered as a localized date-time string, not ISO 8601 - parse to a
        date type or the age comparison that the alert needs is impossible
    - vendor: BaseCRLHash
      type: string
      description: hash of the base CRL that was loaded (5127)
      ecs: null
      status: unmapped
      custom: ocsp.crl.base_hash
      notes: >-
        unqualified as to algorithm in the event, so it cannot be placed under
        an ECS hash field without asserting an algorithm the log does not
        state
    - vendor: DeltaCRLNumber
      type: string
      description: CRL sequence number of the delta CRL the revocation provider loaded (5127)
      ecs: null
      status: unmapped
      custom: ocsp.crl.delta_number
    - vendor: DeltaCRLThisUpdate
      type: string
      description: thisUpdate timestamp of the delta CRL that was loaded (5127)
      ecs: null
      status: partial
      custom: ocsp.crl.delta_this_update
      transform: same localized date-time parsing problem as BaseCRLThisUpdate
    - vendor: NewSigningCertificateHash
      type: string
      description: hash of the signing certificate the responder rolled over to (5126)
      ecs: null
      status: unmapped
      custom: ocsp.signing_certificate.hash
      notes: >-
        an unexpected automatic rollover is worth alerting on - the
        responder's signing key is what relying parties trust
    - vendor: PropertyName
      type: string
      description: name of the responder configuration property that changed (5123)
      ecs: null
      status: unmapped
      custom: ocsp.configuration.property
    - vendor: NewValue
      type: string
      description: >-
        value the configuration entry or security setting was changed to
        (5122/5123/5124)
      ecs: null
      status: partial
      custom: ocsp.configuration.new_value
      notes: >
        the events record only the new value, never the old one, so a
        configuration-drift view has to be reconstructed by ordering
        successive events per property rather than by diffing a single event
    - vendor: SubjectUserName
      type: string
      description: account context recorded with the audit event (5124/5125)
      ecs: user.name
      status: partial
      notes: >
        on 5125 this is the responder service account, not the party asking
        for revocation status - the event has no requester-identifying
        parameter of any kind, which is precisely why the IIS dataset below
        exists
    - vendor: paramN (Microsoft-Windows-OnlineResponder)
      type: string
      description: >-
        positional insertion strings of the Application-channel operational
        events (17, 20, 21, 22, 29, 31)
      ecs: null
      status: unmapped
      custom: ocsp.responder.message_param
      notes: >
        this provider declares its insertion strings without names, so
        winlogbeat surfaces them as event_data.param1..paramN with no
        semantics; the values are meaningful per event id - on 22 ("extremely
        long request rejected; possible DoS attack") param1 is the source
        address of the oversized request and is the only host-attributable
        value in the operational set, and on 29 param1 is the revocation
        configuration that failed to load
      transform: >-
        bind paramN to named fields with a per-event-id template map before
        indexing; on 22, param1 should additionally populate source.address
    - vendor: Message
      type: string
      description: rendered human-readable event message text
      ecs: message
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass through on the core worker group with Persistent Queue
          backpressure and no low-side extraction - this is the lowest-volume
          dataset in the map and there is nothing here worth parsing twice.
          The one piece of low-side work that pays for itself is
          responder-role enrichment (host -> responder array member, the CA
          hierarchy it answers for) so a health alert names the array rather
          than a bare hostname, and keeping _raw, since the
          Application-channel events are unparsed insertion strings whose
          message text is currently the only readable form.
        elastic: >
          Add a logs-system.security@custom and logs-system.application@custom
          pair for the responder event ids that converts BaseCRLThisUpdate and
          DeltaCRLThisUpdate into real dates so a "revocation data older than
          N hours" rule can be written at all, derives event.action from the
          event id (service start/stop, configuration change,
          signing-certificate renewal, CRL refresh) to satisfy the
          configuration alerting profile, and sets event.outcome from the
          event id rather than the Keywords bitmask, since 20/29 are
          Application-channel errors with no audit keyword at all. Map
          ocsp.crl.base_number and .delta_number as long and the
          CAConfigurationId as keyword in the custom-namespace index template
          so a stalled CRL number is a graphable series, and treat the unnamed
          paramN values as a parsing debt: pin them to named fields off the
          message template per event id rather than leaving paramN in the
          index.
      direct:
        parse_location: high
        cribl: >
          Pass through on the core worker group with Persistent Queue
          backpressure and no field extraction - this is the lowest-volume
          dataset in the map and there is nothing here worth parsing twice.
          The one piece of near-source work that pays for itself is
          responder-role enrichment (host -> responder array member, the CA
          hierarchy it answers for) so a health alert names the array rather
          than a bare hostname, and keeping _raw, since the
          Application-channel events are unparsed insertion strings whose
          message text is currently the only readable form.
        elastic: >
          Add a logs-system.security@custom and logs-system.application@custom
          pair for the responder event ids that converts BaseCRLThisUpdate and
          DeltaCRLThisUpdate into real dates so a "revocation data older than
          N hours" rule can be written at all, derives event.action from the
          event id (service start/stop, configuration change,
          signing-certificate renewal, CRL refresh) to satisfy the
          configuration alerting profile, and sets event.outcome from the
          event id rather than the Keywords bitmask, since 20/29 are
          Application-channel errors with no audit keyword at all. Map
          ocsp.crl.base_number and .delta_number as long and the
          CAConfigurationId as keyword in the custom-namespace index template
          so a stalled CRL number is a graphable series, and treat the unnamed
          paramN values as a parsing debt: pin them to named fields off the
          message template per event id rather than leaving paramN in the
          index.
- id: ocsp-access
  name: Online Responder web request log (IIS W3C)
  description: >
    The per-request record of CAC/PIV revocation checking. The Windows Online
    Responder is implemented as an ISAPI extension hosted by IIS under the
    OCSP virtual directory, so every status request a relying party makes is
    written to that site's W3C extended log - and, because Security event 5125
    carries no requester, no serial and no client address, these files are the
    only place the org can see who is checking what. Requests arrive two ways
    and log very differently: RFC 6960 GET requests carry the
    base64url-encoded DER OCSPRequest appended to the /ocsp stem, so the
    certificate under query is present but encoded inside cs-uri-stem, while
    POST requests put the DER body off-log entirely and leave only a method, a
    status and a byte count. Note also that a responder answering from its
    cache does not generate a Security audit event, so IIS request counts and
    5125 counts will never agree; treat that gap as normal rather than as
    loss. This dataset is deliberately scoped to the Online Responder's own
    site - the estate-wide IIS logging story lives on the separate iis catalog
    row.
  event_categories:
  - web
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Elastic Agent tails the Online Responder site's W3C log directory
        (%SystemDrive%\inetpub\logs\LogFiles\W3SVC<siteid>) and ships to
        Cribl; a responder in the lower enclave takes the guarded path shown
        here, per the previous dataset.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-iis.access
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Elastic Agent tails the Online Responder site's W3C log directory
        (%SystemDrive%\inetpub\logs\LogFiles\W3SVC<siteid>) and ships to
        Cribl, which forwards to Elastic with no guard crossing, per the
        previous dataset.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-iis.access
  formats:
  - format: other
    parsing:
      mechanism: elastic-integration
      artifact: IIS integration (iis.access data stream)
      notes: >
        The stock IIS integration parses the W3C extended format and gives
        most of these fields ECS homes already. Two pieces of configuration
        are on the deployment rather than the parser: the Online Responder
        site's log directory has to be added to the integration's path list,
        and the selected W3C field set has to actually include cs-uri-query,
        cs(User-Agent), sc-bytes/cs-bytes and time-taken, none of which is on
        by default in every IIS build - a field left unticked in IIS is a
        field that silently never arrives.
    fields:
    - vendor: date
      type: timestamp
      description: UTC date the request completed, as a separate W3C field
      ecs: '@timestamp'
      status: partial
      notes: >-
        W3C splits the timestamp across two fields; date and time must be
        concatenated and read as UTC, which IIS uses regardless of server
        locale
    - vendor: time
      type: timestamp
      description: UTC time the request completed, as a separate W3C field
      ecs: '@timestamp'
      status: partial
      notes: >-
        paired with date above; also note that IIS writes the time the request
        COMPLETED, so a slow request is recorded after the fact by time-taken
        milliseconds
    - vendor: c-ip
      type: ip
      description: address of the client that submitted the OCSP request
      ecs: source.ip
      status: mapped
      notes: >
        the relying party checking revocation - a workstation, a VPN
        concentrator or a web server; where the responder sits behind a load
        balancer this is the balancer unless X-Forwarded-For is added to the
        logged field set
    - vendor: s-ip
      type: ip
      description: address of the Online Responder that served the request
      ecs: destination.ip
      status: mapped
    - vendor: s-port
      type: port
      description: >-
        server port the request arrived on (80 for OCSP, which is
        unauthenticated by design)
      ecs: destination.port
      status: mapped
    - vendor: cs-method
      type: string
      description: HTTP method of the request
      ecs: http.request.method
      status: mapped
      notes: >-
        GET carries the encoded request in the URI and is the visible case;
        POST carries a DER body that never appears in the log, so method is
        the field that tells an analyst how much they can expect to see
    - vendor: cs-uri-stem
      type: string
      description: >-
        requested resource, normally /ocsp with the base64url-encoded DER
        OCSPRequest appended for GET requests
      ecs: url.path
      status: partial
      notes: >
        the certificate serial under query is present but base64url-encoded
        inside this value on GET requests; it needs splitting at the /ocsp
        boundary and decoding before it can be joined to the CA dataset's
        issuance or revocation records
      transform: >
        split the encoded request off the stem into a separate field; also
        concatenate with cs-uri-query to build url.original, which the web
        alerting profile requires and W3C never emits as a single field
    - vendor: cs-uri-query
      type: string
      description: query string of the request, usually empty for OCSP
      ecs: url.query
      status: mapped
    - vendor: sc-status
      type: integer
      description: HTTP status code returned to the client
      ecs: http.response.status_code
      status: mapped
      notes: >
        200 is returned for every well-formed OCSP request including one whose
        answer is "revoked", so status says nothing about the revocation
        verdict; a rise in 5xx here is a validation outage, which in a CAC/PIV
        estate presents as authentication failures elsewhere
      transform: >-
        derive event.outcome from the code (2xx/3xx success, 4xx/5xx failure)
        - the web alerting profile requires event.outcome and IIS emits no
        such field
    - vendor: sc-substatus
      type: integer
      description: IIS sub-status refining sc-status
      ecs: null
      status: unmapped
      custom: iis.access.sub_status
      notes: >-
        ECS has no sub-status field; the value is what distinguishes an
        ISAPI-level rejection from an ordinary 404 on the OCSP virtual
        directory
    - vendor: sc-win32-status
      type: integer
      description: Win32 error code associated with the response
      ecs: null
      status: partial
      custom: iis.access.win32_status
      notes: >-
        needs a Win32 error lookup to be readable; non-zero values on an
        otherwise-200 response are the signature of an ISAPI extension failing
        behind a successful HTTP status
    - vendor: sc-bytes
      type: bytes
      description: bytes sent by the responder, i.e. the size of the OCSP response
      ecs: http.response.bytes
      status: mapped
    - vendor: cs-bytes
      type: bytes
      description: bytes received from the client, i.e. the size of the OCSP request
      ecs: http.request.bytes
      status: mapped
    - vendor: cs(User-Agent)
      type: string
      description: user agent string of the requesting client
      ecs: user_agent.original
      status: partial
      notes: >
        Windows CryptoAPI clients send a recognizable Microsoft-CryptoAPI
        token, so this field is the cheapest way to spot a non-Windows or
        scripted validator hitting the responder
      transform: >-
        IIS substitutes + for spaces in this field; reverse the substitution
        before user-agent parsing or every agent string mis-parses
    - vendor: cs-username
      type: string
      description: authenticated user name, logged as - for anonymous requests
      ecs: user.name
      status: partial
      notes: >-
        OCSP is anonymous by design, so this is - on essentially every row; a
        populated value on this site is itself anomalous and worth alerting on
    - vendor: time-taken
      type: integer
      description: time to process the request in milliseconds
      ecs: event.duration
      status: partial
      transform: >-
        ECS event.duration is nanoseconds - multiply by 1,000,000; a rising
        distribution here is the leading indicator of a responder that is
        about to time out relying parties
    - vendor: s-sitename
      type: string
      description: IIS site the request was served by, e.g. W3SVC1
      ecs: null
      status: unmapped
      custom: iis.access.site_name
      notes: >-
        the field that separates Online Responder traffic from any other site
        sharing the host, and therefore the filter this whole dataset depends
        on
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass through with Persistent Queue backpressure and let the IIS
          integration parse; the one thing worth doing low-side is tagging the
          events with the responder array and site id so the OCSP site's
          traffic can be separated from any other site on the same host before
          it reaches Elastic. This is the highest-volume dataset in the map
          and the lowest per-event forensic value, so it is the first place to
          drop _raw once the IIS parser is proven, and the right place to
          enforce a length cap on the base64url request blob in cs-uri-stem.
        elastic: >
          Use the stock IIS ingest pipeline and add a logs-iis.access@custom
          pipeline that composes url.original from cs-uri-stem plus
          cs-uri-query (the web alerting profile requires url.original and the
          W3C format never supplies it as one field), converts time-taken from
          milliseconds to nanoseconds for event.duration, derives
          event.outcome from sc-status rather than leaving it unset, and
          splits the base64url OCSPRequest off the /ocsp stem into its own
          keyword field so a revocation check can be correlated to a
          certificate at all. Map iis.access.sub_status and .win32_status as
          long and .site_name as keyword in the custom-namespace index
          template, and expect POST requests to be permanently thinner than
          GETs - do not write rules that assume the queried serial is always
          available.
        relay: >
          On the guarded crossing, the friction is cs-uri-stem: a GET OCSP
          request appends a base64url-encoded DER blob to /ocsp that routinely
          runs to a kilobyte or more of unbroken high-entropy ASCII, which is
          exactly the shape a simple custom NDJSON content filter is least
          happy with. Cap and flag it low-side to an agreed length rather than
          letting the filter decide, and send the thin envelope (mode A) with
          extraction staying in the IIS integration on the high side. The feed
          is W3C text rather than CEF, so nothing CEF-shaped crosses; given
          the volume and the at-most-once crossing, this is the dataset where
          per-(dataset, hour) low-side/high-side count reconciliation matters
          most, because a silent drop here looks identical to relying parties
          simply checking less often.
      direct:
        parse_location: high
        cribl: >
          Pass through with Persistent Queue backpressure and let the IIS
          integration parse; the one thing worth doing near source is tagging
          the events with the responder array and site id so the OCSP site's
          traffic can be separated from any other site on the same host before
          it reaches Elastic. This is the highest-volume dataset in the map
          and the lowest per-event forensic value, so it is the first place to
          drop _raw once the IIS parser is proven, and the right place to
          enforce a length cap on the base64url request blob in cs-uri-stem.
        elastic: >
          Use the stock IIS ingest pipeline and add a logs-iis.access@custom
          pipeline that composes url.original from cs-uri-stem plus
          cs-uri-query (the web alerting profile requires url.original and the
          W3C format never supplies it as one field), converts time-taken from
          milliseconds to nanoseconds for event.duration, derives
          event.outcome from sc-status rather than leaving it unset, and
          splits the base64url OCSPRequest off the /ocsp stem into its own
          keyword field so a revocation check can be correlated to a
          certificate at all. Map iis.access.sub_status and .win32_status as
          long and .site_name as keyword in the custom-namespace index
          template, and expect POST requests to be permanently thinner than
          GETs - do not write rules that assume the queried serial is always
          available.
  - format: csv-file
    enable: >
      The native "Microsoft IIS Log File Format". Select it on the Online
      Responder site in IIS Manager > Logging by setting Format to "IIS", or
      set <logFile logFormat="IIS"> on the site in applicationHost.config
      (appcmd set sites "<ocsp-site>" -logFile.logFormat:IIS). Unlike W3C the
      field set is FIXED and cannot be customised: fifteen comma-delimited
      columns, one line per request, in the order below, with no #Fields
      header - the column order is the only schema. Timestamps are written in
      the server's LOCAL time zone, not UTC. For the OCSP site this format
      keeps the URI stem (so the base64url OCSPRequest on a GET is still
      present) and adds back the server IP, request byte count, time-taken and
      Win32 status that NCSA drops, but it carries no User-Agent and no
      sub-status column, so the Microsoft-CryptoAPI client fingerprint and the
      ISAPI-level rejection refinement both disappear relative to the W3C
      selection.
    references:
    - >-
      https://learn.microsoft.com/en-us/previous-versions/iis/6.0-sdk/ms525807(v=vs.90)
    - >-
      https://learn.microsoft.com/en-us/iis/configuration/system.applicationhost/sites/site/logfile/
    parsing:
      mechanism: elastic-ingest-pipeline
      artifact: >-
        logs-iis.access@custom (CSV/grok split of the fixed 15-column native
        order, then rename-to-ECS)
      notes: >
        The stock Elastic IIS integration groks W3C space-delimited lines
        behind a #Fields header and will not match a comma-delimited native
        line, so an OCSP site emitting native cannot ride the shipped access
        pipeline. It needs a custom pipeline whose head is a csv (or
        positional grok) processor over the fixed field order, followed by
        rename-to-ECS. The governing trap is the timestamp: the native
        Date/Time pair is local server time while the integration assumes UTC,
        so the date parse must apply the responder host's zone per site or
        every OCSP record lands skewed by the offset. The OCSP-specific work -
        splitting the base64url DER off the /ocsp stem in Target and rejoining
        Target with Parameters into url.original - still has to be added on
        top, exactly as on the W3C stream.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          The native format has no #Fields header, so the fixed 15-column
          comma order IS the schema and a parser cannot recover if the OCSP
          site silently switches format. Pin the site's active log format
          low-side as a routing tag so the high side never has to sniff
          comma-native against W3C-space lines, and alert when the responder
          site drifts back to W3C or NCSA mid-stream. The unbounded,
          attacker-influenced value is Target: on a GET it holds the base64url
          DER OCSPRequest appended to /ocsp, routinely a kilobyte or more of
          high-entropy ASCII, so cap and flag it low-side to an agreed length
          as on the W3C route. Tag the responder array and site id near source
          so the OCSP site's traffic separates from any other site on the
          host. Keep _raw for reconciliation and run Persistent Queue
          backpressure, never Block, on the Elastic destination.
        elastic: >
          Parse in a logs-iis.access@custom pipeline whose first processor is
          a csv/grok split of the fifteen positional columns, then rename to
          ECS. Convert the local Date/Time pair to UTC using a per-site zone
          constant carried as an ingest field, since this format unlike W3C
          logs local time and a naive UTC parse skews every event. Split the
          base64url OCSPRequest off the Target stem into its own keyword field
          so a revocation check can still be correlated to a certificate, then
          rejoin Target and Parameters into url.original, which the web
          alerting profile requires and this format never emits as one field.
          Resolve Win32Status through the same Win32 error-code lookup used on
          the W3C stream, and derive event.outcome from ServiceStatus (below
          400 success, 400 and above failure). Declare iis.access.site_name
          and iis.access.win32_status in the custom-namespace index template.
          Expect no User-Agent and no sub-status on this feed, so any rule
          that fingerprints a non-CryptoAPI validator or reads sc-substatus
          must degrade gracefully when the site is on native.
        relay: >
          Low-side instances cross the guard as the same thin-envelope NDJSON
          the W3C stream uses - {_dataId, @timestamp, host, _raw}, never CEF.
          The single unbounded, high-entropy value is Target, which on a GET
          carries the base64url DER OCSPRequest off the /ocsp stem; cap and
          flag it to an agreed length low-side rather than letting a custom
          NDJSON filter reject or silently trim the very rows that name the
          certificate under query. The native format's lack of User-Agent,
          Referer and Cookie columns makes its crossing surface smaller than
          W3C. Treat the crossing as at-most-once and reconcile low-side and
          high-side counts per (site, hour), since a cached responder answer
          generates no Security 5125 event and the IIS log is the only
          per-request record on this side.
      direct:
        parse_location: high
        cribl: >
          High-side responder instances need no guard hops: keep the core
          worker group a pass-through with the raw native line in _raw. If
          some responder sites emit native while others emit W3C, tag the
          format at the edge so the ingest pipeline routes each line to the
          matching parser rather than guessing from the delimiter.
        elastic: >
          Parse in a logs-iis.access@custom pipeline whose first processor is
          a csv/grok split of the fifteen positional columns, then rename to
          ECS. Convert the local Date/Time pair to UTC using a per-site zone
          constant carried as an ingest field, since this format unlike W3C
          logs local time and a naive UTC parse skews every event. Split the
          base64url OCSPRequest off the Target stem into its own keyword field
          so a revocation check can still be correlated to a certificate, then
          rejoin Target and Parameters into url.original, which the web
          alerting profile requires and this format never emits as one field.
          Resolve Win32Status through the same Win32 error-code lookup used on
          the W3C stream, and derive event.outcome from ServiceStatus (below
          400 success, 400 and above failure). Declare iis.access.site_name
          and iis.access.win32_status in the custom-namespace index template.
          Expect no User-Agent and no sub-status on this feed, so any rule
          that fingerprints a non-CryptoAPI validator or reads sc-substatus
          must degrade gracefully when the site is on native.
    fields:
    - vendor: ClientHost
      type: ip
      description: >-
        IP address of the relying party that submitted the OCSP request (first
        comma-delimited column)
      ecs: source.ip
      status: mapped
    - vendor: UserName
      type: string
      description: authenticated account that made the request, hyphen for anonymous requests
      ecs: user.name
      status: partial
      notes: >
        OCSP is anonymous by design, so this is a hyphen on essentially every
        row; a populated value on the responder site is itself anomalous and
        worth alerting on
      transform: >
        on the rare populated row it arrives as DOMAIN\user and needs
        splitting into user.name and user.domain; the hyphen placeholder must
        be dropped rather than indexed
    - vendor: Date
      type: string
      description: >-
        date the request completed, in the server's local time zone, MM/DD/YY
        (two-digit year for 1999 and earlier, four digits thereafter)
      ecs: '@timestamp'
      status: partial
      transform: >
        concatenated with the adjacent Time column and parsed with the
        responder host's local zone applied - this format logs local time, not
        UTC, so a naive UTC parse skews every event by the offset
    - vendor: Time
      type: string
      description: 'time the request completed, in the server''s local time zone, H:MM:SS'
      ecs: '@timestamp'
      status: partial
      notes: >
        local time and second-resolution only; combined with the Date column
        and the per-site zone constant to produce @timestamp. IIS writes the
        time the request COMPLETED, so a slow OCSP lookup is recorded after
        the fact by time-taken milliseconds
    - vendor: Service
      type: string
      description: IIS service name and instance number that handled the request, e.g. W3SVC1
      ecs: null
      status: unmapped
      custom: iis.access.site_name
      notes: >
        the only per-site discriminator on a multi-tenant server; separates
        Online Responder traffic from any other site on the host and reuses
        the same custom namespace as the W3C s-sitename column for ownership
        routing and per-site count reconciliation
    - vendor: Machine
      type: string
      description: name of the Online Responder server on which the log entry was generated
      ecs: host.name
      status: mapped
      transform: lowercased on ingest so it joins cleanly against Windows host inventory
    - vendor: ServerIP
      type: ip
      description: IP address of the Online Responder that served the request
      ecs: destination.ip
      status: mapped
    - vendor: ProcessingTime
      type: integer
      description: elapsed time taken to process the request, in milliseconds
      ecs: event.duration
      status: partial
      transform: >
        multiplied by 1,000,000 to reach ECS nanoseconds; a rising
        distribution is the leading indicator of a responder about to time out
        relying parties
    - vendor: BytesRecvd
      type: bytes
      description: bytes received from the client, i.e. the size of the OCSP request
      ecs: http.request.bytes
      status: mapped
    - vendor: BytesSent
      type: bytes
      description: bytes sent by the responder, i.e. the size of the OCSP response
      ecs: http.response.bytes
      status: mapped
    - vendor: ServiceStatus
      type: integer
      description: HTTP status code returned to the client
      ecs: http.response.status_code
      status: mapped
      notes: >
        the only outcome source on this format - event.outcome is derived from
        it alone (success below 400, failure at 400 and above); 200 is
        returned even for a "revoked" verdict, so status says nothing about
        the revocation answer, and the native format carries no sub-status
        column so ISAPI-level 401.x/500.x refinements are not distinguishable
        here as they are on W3C
    - vendor: Win32Status
      type: integer
      description: Windows (Win32) error code associated with the response
      ecs: null
      status: partial
      custom: iis.access.win32_status
      transform: >
        numeric Win32 code needing a lookup table to become a readable failure
        reason; a non-zero value on an otherwise-200 response is the signature
        of the OCSP ISAPI extension failing behind a successful HTTP status; 0
        means success and should not be indexed as an error
    - vendor: Operation
      type: string
      description: >-
        request type, i.e. the HTTP verb - GET carries the encoded OCSPRequest
        in the URI, POST carries a DER body that never appears in the log
      ecs: http.request.method
      status: mapped
      notes: >
        method is the field that tells an analyst how much they can expect to
        see: a GET exposes the queried certificate in the stem, a POST leaves
        only method, status and byte count
    - vendor: Target
      type: string
      description: >-
        target of the operation - the requested URI stem, normally /ocsp with
        the base64url-encoded DER OCSPRequest appended for GET requests,
        without the query string
      ecs: url.path
      status: partial
      notes: >
        the certificate serial under query is present but base64url-encoded
        inside this value on GET requests; it needs splitting at the /ocsp
        boundary and decoding before it can be joined to the CA dataset's
        issuance or revocation records, and the query string is carried
        separately in Parameters so url.original is not complete until a
        custom pipeline rejoins the two
      transform: >
        split the encoded OCSPRequest off the /ocsp stem into a separate
        field, then concatenate Target with Parameters to build url.original,
        which the web alerting profile requires and this format never emits as
        a single field
    - vendor: Parameters
      type: string
      description: >-
        parameters passed to the request, i.e. the query string, usually empty
        (hyphen) for OCSP
      ecs: url.query
      status: partial
      transform: >
        url-decoded on ingest and the hyphen placeholder dropped rather than
        indexed; usually empty for OCSP, which puts its payload in the stem on
        GET and in the body on POST
  - format: syslog-raw
    enable: >
      The "NCSA Common Log File Format". Select it on the Online Responder
      site in IIS Manager > Logging by setting Format to "NCSA", or set
      <logFile logFormat="NCSA"> on the site (appcmd set sites "<ocsp-site>"
      -logFile.logFormat:NCSA). Available for Web sites only, which the OCSP
      virtual directory is. Like the native IIS format the field set is FIXED
      - seven space-delimited fields, one line per request - but unlike W3C
      and native it records local time WITH an explicit GMT offset embedded in
      the bracketed timestamp, so the value resolves to UTC without a per-site
      zone constant. This is the same line shape as the Apache/NGINX "common"
      log format. It records the least of any IIS format and is the worst fit
      for an OCSP responder: no server IP, no bytes received (so the OCSP
      request size is lost), no time taken, no Win32 status, no sub-status and
      no User-Agent. The base64url OCSPRequest survives only because it rides
      inside the request-line URI, so a GET is still recoverable while
      everything that made the W3C selection useful for responder health is
      gone.
    references:
    - >-
      https://learn.microsoft.com/en-us/previous-versions/iis/6.0-sdk/ms525807(v=vs.90)
    - >-
      https://learn.microsoft.com/en-us/iis/configuration/system.applicationhost/sites/site/logfile/
    parsing:
      mechanism: elastic-ingest-pipeline
      artifact: >-
        logs-iis.access@custom (Common Log Format grok, reusing the
        Apache/NGINX common-log grammar)
      notes: >
        The stock IIS integration will not match an NCSA line either, but
        because the format is byte-identical in shape to the Apache/NGINX
        common log, the existing common-log grok grammar parses it directly -
        no IIS-specific pattern is needed. The bracketed timestamp includes
        its own +/-zzzz offset, so this stream avoids the local-to-UTC zone
        problem the native and W3C streams carry. The OCSP correlation still
        has to be added: the base64url DER lives inside the request-line URI
        here, so the split-and-decode step operates on url.original after the
        request line is broken apart.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          NCSA lines are indistinguishable in shape from Apache/NGINX
          common-log lines, so route them to the existing common-log grok
          rather than an IIS-specific parser, and pin the format tag low-side
          so the routing is deterministic. No per-site zone constant is needed
          because the timestamp already carries its GMT offset. The only
          length concern is the request-line field, which on a GET holds the
          base64url OCSPRequest off the /ocsp stem; cap and normalise it
          low-side. Tag the responder array and site id near source. Keep _raw
          for reconciliation and run Persistent Queue backpressure rather than
          Block on the Elastic destination.
        elastic: >
          Parse with a common-log grok in logs-iis.access@custom - the shared
          Apache/NGINX grammar, not the shipped IIS access pipeline. Split the
          "METHOD URI HTTP/x.y" request line into http.request.method,
          url.original and http.version, then split the base64url OCSPRequest
          off the /ocsp portion of url.original into its own keyword field so
          a revocation check can still be correlated to a certificate. Parse
          the bracketed [dd/Mon/yyyy:HH:MM:SS +/-zzzz] timestamp straight to
          UTC with no zone guess. Derive event.outcome from the status code.
          Because NCSA omits server IP, bytes received, time taken, Win32
          status and User-Agent, those ECS fields simply stay unpopulated on
          this feed - a deliberately narrower responder record than W3C or
          native, and one that cannot support the request-size or
          CryptoAPI-fingerprint rules the W3C selection enables.
        relay: >
          Cross as the same thin-envelope NDJSON as the other IIS streams so
          one schema faces the content filter. The single unbounded value is
          the request line (method, URI and protocol as one quoted string),
          whose URI carries the attacker-influenced base64url OCSPRequest; cap
          and normalise it low-side. This is the smallest crossing surface of
          the three text formats. Treat as at-most-once and reconcile counts
          per (site, hour), remembering that a cached responder answer
          produces no Security 5125 event so the IIS log is the only low-side
          per-request record.
      direct:
        parse_location: high
        cribl: >
          High-side responder instances need no guard hops: pass NCSA lines
          through the core worker group unparsed with _raw intact, routing
          them to the common-log grok. Tag the format at the edge if the
          estate mixes NCSA with W3C or native so each parser sees only its
          own grammar.
        elastic: >
          Parse with a common-log grok in logs-iis.access@custom - the shared
          Apache/NGINX grammar, not the shipped IIS access pipeline. Split the
          "METHOD URI HTTP/x.y" request line into http.request.method,
          url.original and http.version, then split the base64url OCSPRequest
          off the /ocsp portion of url.original into its own keyword field so
          a revocation check can still be correlated to a certificate. Parse
          the bracketed [dd/Mon/yyyy:HH:MM:SS +/-zzzz] timestamp straight to
          UTC with no zone guess. Derive event.outcome from the status code.
          Because NCSA omits server IP, bytes received, time taken, Win32
          status and User-Agent, those ECS fields simply stay unpopulated on
          this feed - a deliberately narrower responder record than W3C or
          native, and one that cannot support the request-size or
          CryptoAPI-fingerprint rules the W3C selection enables.
    fields:
    - vendor: remote-host
      type: ip
      description: >-
        IP address (or resolved host name if reverse DNS is on) of the relying
        party that submitted the OCSP request - first space-delimited field
      ecs: source.ip
      status: mapped
      notes: >
        logs a host name instead of an address when HostnameLookups-style
        resolution is enabled, in which case it will not satisfy an ip-typed
        field and must fall back to source.address
    - vendor: remote-logname
      type: string
      description: RFC 1413 identd identity of the client, effectively always a hyphen
      ecs: null
      status: unmapped
      custom: iis.access.ident
      notes: >
        the second field; identd is not used, so it is a hyphen on every
        record and should be dropped rather than stored
    - vendor: user
      type: string
      description: authenticated account that made the request, hyphen for anonymous requests
      ecs: user.name
      status: partial
      notes: OCSP is anonymous by design, so this is a hyphen on essentially every row
      transform: >
        on the rare populated row it arrives as DOMAIN\user and needs
        splitting into user.name and user.domain; the hyphen placeholder must
        be dropped
    - vendor: date-time
      type: string
      description: >-
        request completion time as [dd/Mon/yyyy:HH:MM:SS +/-zzzz], local time
        with an explicit GMT offset
      ecs: '@timestamp'
      status: mapped
      transform: >
        parsed straight to UTC because the +/-zzzz offset is part of the
        value; no per-site zone constant is required, unlike the native and
        W3C streams
    - vendor: request
      type: string
      description: >-
        full first line of the request - HTTP method, requested URI (the /ocsp
        stem with the base64url OCSPRequest appended on a GET), and protocol
        version as one quoted string
      ecs: url.original
      status: partial
      notes: >
        a composite field that must be split into http.request.method,
        url.original and http.version; the base64url DER OCSPRequest is
        carried inside the URI on a GET and must then be split off the /ocsp
        boundary and decoded to recover the queried certificate. It must
        tolerate a non-conforming or escaped request line since it is
        client-supplied
    - vendor: status
      type: integer
      description: HTTP status code returned to the client
      ecs: http.response.status_code
      status: mapped
      notes: >
        the only outcome source on this format; event.outcome is derived from
        it alone (success below 400, failure at 400 and above), and 200 is
        returned even for a "revoked" verdict so status says nothing about the
        revocation answer
    - vendor: bytes
      type: bytes
      description: number of bytes the responder sent in the OCSP response body
      ecs: http.response.bytes
      status: mapped
      notes: >
        response bytes only; NCSA logs no bytes-received counter, so the OCSP
        request size (http.request.bytes) cannot be populated from this format
  - format: jdbc-sql
    enable: >
      ODBC logging writes each OCSP request as a row to an ODBC data source
      (SQL Server, Access) instead of to a text file. Install the "ODBC
      Logging" role feature (Web Server (IIS) > Health and Diagnostics > ODBC
      Logging), create the target table -
      %windir%\System32\inetsrv\logtemp.sql builds the default InternetLog
      table - and a System DSN, then set the Online Responder site to <logFile
      logFormat="Custom"
      customLogPluginClsid="{FF16065B-DE82-11CF-BC0A-00AA006111E0}"> and
      populate <odbcLogging dataSource tableName userName password>. There is
      no IIS Manager UI for it; configure via appcmd or
      applicationHost.config. The column set is fixed at fourteen columns -
      the same columns as the native format, but with the native Date and Time
      pair merged into a single LogTime column. Enabling ODBC logging disables
      the HTTP.sys kernel-mode cache, which on a high-volume responder is a
      real throughput cost and should be raised with the responder owner
      before it is recommended.
    references:
    - https://learn.microsoft.com/en-us/iis/configuration/system.webserver/odbclogging
    - https://jeffpar.github.io/kbarchive/kb/245/Q245243/
    - >-
      https://learn.microsoft.com/en-us/previous-versions/iis/6.0-sdk/ms525807(v=vs.90)
    parsing:
      mechanism: elastic-ingest-pipeline
      artifact: >-
        logs-iis.access@custom (column rename-to-ECS; collected by an SQL/JDBC
        input, not a file tail)
      notes: >
        This format has no file to tail - the OCSP request records live as
        typed rows in the InternetLog table. Collect with a scheduled query
        (Elastic Agent SQL input, Logstash JDBC, or a Cribl Database
        Collector) that tracks a high-water mark on LogTime so rows are read
        once. Because the DB already stores typed columns, no grok is needed;
        the ingest pipeline is a pure column rename to ECS, plus the same
        OCSP-specific base64url-off-the-Target-stem split as the file formats.
        LogTime is a DATETIME stored in the responder's local zone, so the
        source zone must be applied on ingest.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          There is no line to tail: collect with a Database Collector polling
          the InternetLog table, tracking a high-water mark on LogTime so rows
          are not re-read, and emit one NDJSON object per row across the
          guard. Because the DB stores typed columns the crossing payload is
          already structured - no _raw text line to disambiguate. The value to
          cap is Target, which on a GET holds the base64url OCSPRequest off
          the /ocsp stem. Surface the kernel-cache-disabled throughput cost to
          the responder owner before recommending ODBC on a busy site, and tag
          the responder array and site id. Persistent Queue backpressure,
          never Block.
        elastic: >
          Map the table columns to ECS with a rename pipeline: ClientHost to
          source.ip, ServerIP to destination.ip, Machine to host.name,
          ProcessingTime milliseconds to event.duration nanoseconds,
          BytesRecvd to http.request.bytes, BytesSent to http.response.bytes,
          ServiceStatus to http.response.status_code, Operation to
          http.request.method, Target to url.path and Parameters to url.query,
          with Win32Status resolved through the Win32 lookup into
          iis.access.win32_status and Service into iis.access.site_name. Split
          the base64url OCSPRequest off the Target stem and rejoin Target with
          Parameters into url.original. Apply the responder local zone to
          LogTime on ingest. No integration grok is involved; this is a pure
          column-rename feed collected over JDBC/SQL rather than a file, and
          like the native format it carries no User-Agent, so the CryptoAPI
          fingerprint is unavailable.
        relay: >
          Cross one NDJSON object per row so the ODBC feed presents the same
          schema as the file-based OCSP streams to the content filter. The
          bounded value to cap is Target with its base64url payload. Note the
          log database is itself a low-side asset: run the collector low-side
          and cross the NDJSON rather than opening a broad DB port across the
          guard. Reconcile row counts per (site, hour) using LogTime, an
          at-most-once crossing, remembering the cached-answer gap between IIS
          rows and Security 5125 counts.
      direct:
        parse_location: high
        cribl: >
          High-side responder instances need no guard hops: run a scheduled
          query against InternetLog with a LogTime high-water mark, emitting
          structured rows straight into the core worker group.
        elastic: >
          Map the table columns to ECS with a rename pipeline: ClientHost to
          source.ip, ServerIP to destination.ip, Machine to host.name,
          ProcessingTime milliseconds to event.duration nanoseconds,
          BytesRecvd to http.request.bytes, BytesSent to http.response.bytes,
          ServiceStatus to http.response.status_code, Operation to
          http.request.method, Target to url.path and Parameters to url.query,
          with Win32Status resolved through the Win32 lookup into
          iis.access.win32_status and Service into iis.access.site_name. Split
          the base64url OCSPRequest off the Target stem and rejoin Target with
          Parameters into url.original. Apply the responder local zone to
          LogTime on ingest. No integration grok is involved; this is a pure
          column-rename feed collected over the Elastic Agent SQL input or
          Logstash JDBC directly against the database, and like the native
          format it carries no User-Agent, so the CryptoAPI fingerprint is
          unavailable.
    fields:
    - vendor: ClientHost
      type: ip
      description: IP address of the relying party that submitted the OCSP request (varchar column)
      ecs: source.ip
      status: mapped
    - vendor: Username
      type: string
      description: authenticated account that made the request, hyphen for anonymous requests
      ecs: user.name
      status: partial
      notes: OCSP is anonymous by design, so this is a hyphen on essentially every row
      transform: >-
        arrives as DOMAIN\user and needs splitting into user.name and
        user.domain; the hyphen placeholder must be dropped
    - vendor: LogTime
      type: timestamp
      description: >-
        date and time the log entry was created, a DATETIME in the responder's
        local time zone
      ecs: '@timestamp'
      status: partial
      transform: >
        stored as a single local-time DATETIME with no offset, so the
        responder host's zone must be applied on ingest to produce a correct
        UTC @timestamp
    - vendor: Service
      type: string
      description: IIS service name and instance that handled the request, e.g. W3SVC1
      ecs: null
      status: unmapped
      custom: iis.access.site_name
      notes: >-
        per-site discriminator that separates Online Responder traffic from
        any other site on the host, reusing the W3C s-sitename custom
        namespace
    - vendor: Machine
      type: string
      description: name of the Online Responder server on which the log entry was generated
      ecs: host.name
      status: mapped
      transform: lowercased on ingest so it joins cleanly against Windows host inventory
    - vendor: ServerIP
      type: ip
      description: IP address of the Online Responder that served the request
      ecs: destination.ip
      status: mapped
    - vendor: ProcessingTime
      type: integer
      description: elapsed processing time for the request, in milliseconds
      ecs: event.duration
      status: partial
      transform: >-
        multiplied by 1,000,000 to reach ECS nanoseconds; server-side
        processing only, excludes network transit
    - vendor: BytesRecvd
      type: bytes
      description: bytes received from the client, i.e. the size of the OCSP request
      ecs: http.request.bytes
      status: mapped
    - vendor: BytesSent
      type: bytes
      description: bytes sent by the responder, i.e. the size of the OCSP response
      ecs: http.response.bytes
      status: mapped
    - vendor: ServiceStatus
      type: integer
      description: HTTP status code returned to the client
      ecs: http.response.status_code
      status: mapped
      notes: >-
        the only outcome source on this format; event.outcome is derived from
        it alone (success below 400, failure at 400 and above), and 200 is
        returned even for a "revoked" verdict
    - vendor: Win32Status
      type: integer
      description: Windows (Win32) error code associated with the response
      ecs: null
      status: partial
      custom: iis.access.win32_status
      transform: >-
        numeric Win32 code needing a lookup table to become a readable failure
        reason; a non-zero value on an otherwise-200 response marks the OCSP
        ISAPI extension failing behind a successful HTTP status; 0 means
        success and should not be indexed as an error
    - vendor: Operation
      type: string
      description: >-
        request type carried out, i.e. the HTTP verb - GET exposes the queried
        certificate in the stem, POST leaves only method, status and byte
        count
      ecs: http.request.method
      status: mapped
    - vendor: Target
      type: string
      description: >-
        target of the operation - the requested URI stem, normally /ocsp with
        the base64url-encoded DER OCSPRequest appended for GET requests,
        without the query string
      ecs: url.path
      status: partial
      notes: >-
        the queried certificate serial is base64url-encoded inside this value
        on a GET; the query lives in the Parameters column, so url.original is
        not complete until a pipeline rejoins Target and Parameters
      transform: >-
        split the encoded OCSPRequest off the /ocsp stem into a separate
        field, then rejoin Target with Parameters into url.original
    - vendor: Parameters
      type: string
      description: >-
        parameters passed to the request, i.e. the query string, usually empty
        (hyphen) for OCSP
      ecs: url.query
      status: partial
      transform: >-
        url-decoded on ingest and the hyphen placeholder dropped; usually
        empty for OCSP, which puts its payload in the stem on GET and in the
        body on POST
