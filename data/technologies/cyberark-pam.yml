      ecs: null
      status: unmapped
      custom: cyberarkpas.audit.extra_details.connection_component_id
      notes: >-
        determines whether Command holds keystrokes, an SQL statement, or a
        window title - the field that makes the value interpretable
    - vendor: ExtraDetails:PSMID
      type: string
      description: identifier of the PSM server that recorded the activity
      ecs: null
      status: unmapped
      custom: cyberarkpas.audit.extra_details.psmid
    - vendor: ExtraDetails:TXTOffset
      type: string
      description: 'offset of this activity within the session''s text recording'
