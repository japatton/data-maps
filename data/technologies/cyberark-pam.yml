- id: psm-session-activity
  name: PSM session command and keystroke activity
  description: >
    In-session auditing records emitted while a PSM session is open, when
    keystroke or command auditing is enabled on the connection component -
    Keystroke logging (361 and 412), SQL Command (359) and Window title (411).
    Each record carries the typed command or window text plus the SessionID
    that ties it back to the PSM Connect record, and offsets into the text and
    video recordings.
  event_categories:
  - process
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Same Vault syslog feed as the other two datasets. Of the three this is
        the most sensitive, because the records carry operator-typed text that
        can include credentials.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cyberarkpas.audit
    direct:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
