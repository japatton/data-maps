  formats:
  - format: syslog-cef
    parsing:
      mechanism: elastic-integration
      artifact: CyberArk Privileged Access Security (cyberarkpas) integration
      notes: >
        The integration recognizes codes 359/361/411/412 and key-value splits
        their ExtraDetails, but leaves the Command value unmapped and
        unredacted. The recommendation below therefore moves document
        construction for these codes low-side, reducing the stock pipeline to
        an @custom-assisted pass-through for them while the other two datasets
        continue to use it as the parser.
    fields:
    - vendor: MessageID
      type: integer
      description: >-
        numeric Vault audit action code - 359 SQL Command, 361 and 412
        Keystroke logging, 411 Window title
      ecs: event.code
      status: mapped
      notes: >
        361 and 412 are both Keystroke logging and differ by Vault version;
        detections must match either, and the integration's own source
        questions whether they are genuinely distinct
    - vendor: ExtraDetails:Command
      type: string
      description: the command text, keystroke stream, or window title captured in session
      ecs: null
      status: unmapped
      custom: cyberarkpas.audit.extra_details.command
      transform: >
        mask credential-bearing patterns and apply an explicit, flagged length
        cap before the value leaves the enclave; a keystroke stream can
        contain a password typed at a prompt in cleartext
      notes: >
        the dataset's central value and its biggest ECS gap.
        process.command_line is the tempting home but is wrong: it models the
        invocation that started a process, whereas these records are a typed
        keystroke stream, an SQL statement, or a GUI window title, none of
        which is a process start. Left custom rather than overloading a
        process field that downstream process analytics would then misread
    - vendor: Issuer
      type: string
      description: Vault user whose session produced the activity
      ecs: source.user.name
      status: mapped
      notes: also copied to user.name; the accountable human identity for the typed command
    - vendor: ExtraDetails:User
      type: string
      description: privileged account the command ran as on the target
      ecs: destination.user.name
      status: mapped
    - vendor: ExtraDetails:SessionID
      type: string
      description: GUID of the PSM session this activity belongs to
      ecs: null
      status: unmapped
      custom: cyberarkpas.audit.extra_details.session_id
      notes: joins back to the PSM Connect record; no generic session.id exists in ECS 9.4
    - vendor: ExtraDetails:DstHost
      type: string
      description: target host the command was executed against
      ecs: destination.address
      status: partial
      notes: >-
        resolved to destination.ip or destination.domain depending on whether
        the value parses as an address
    - vendor: ExtraDetails:SrcHost
      type: string
      description: address the session originated from
      ecs: source.address
      status: partial
      notes: >-
        often the PSM proxy's own loopback rather than the real client; use
        Station for client attribution
    - vendor: ExtraDetails:Protocol
      type: string
      description: protocol of the session carrying the command (SSH, RDP, SQLNet)
      ecs: network.application
      status: partial
      notes: same mismapping as the psm-session dataset - belongs in network.protocol
    - vendor: ExtraDetails:DataBase
      type: string
      description: database context the SQL command executed against
      ecs: null
      status: unmapped
      custom: cyberarkpas.audit.extra_details.database
      notes: >-
