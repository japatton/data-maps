        that are not flow endpoints
    - vendor: ExtraDetails:Protocol
      type: string
      description: Protocol carried by the proxied session (SSH, RDP, SQLNet)
      ecs: network.application
      status: partial
      notes: >
        the stock integration puts the protocol in network.application;
        network.protocol is the correct ECS home, so this needs the same
