    - vendor: ExtraDetails:ManagedAccount
      type: enum
      description: Whether the account used was managed by the Vault (Yes/No)
      ecs: null
      custom: cyberarkpas.audit.extra_details.managed_account
      status: unmapped
      notes: >-
