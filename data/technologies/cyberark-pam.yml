    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Build the ECS document for these four codes on the edge worker
          group, because the one thing that must happen before the record
          leaves the enclave cannot be done at Elastic: mask
          credential-bearing patterns in the Command value — mysql -p, psql,
          sqlcmd -P, curl -u, sshpass, su and passwd follow-on keystrokes, and
          the bare password line that follows a prompt in a keystroke stream.
          Cap Command at an explicit, flagged length rather than letting the
          value run to kilobytes, reproduce the integration's
          unescaped-';'/'=' ExtraDetails split exactly so masking does not
          straddle a field boundary, and gate the destination with
          C.Schema(...).validate plus a dead-letter route that alerts on its
          own rate. Never carry _raw on this route: the raw record is
          precisely the unredacted copy the masking exists to eliminate.
        elastic: >
          Take pre-shaped documents into logs-cyberarkpas.audit and keep
          high-side work to a logs-cyberarkpas.audit@custom pipeline that
          asserts the redaction flag is present on every 359/361/412 document
          and quarantines any that arrive without it. Add explicitly typed
          custom-namespace mappings for
          cyberarkpas.audit.extra_details.command as a non-aggregatable text
          field with a keyword sub-field for exact-match hunting, and
          session_id, database, txt_offset and vid_offset as keyword, so
          analysts can pivot from a matched command straight to the recording
          offset. Apply the same Protocol to network.protocol correction as
          the psm-session dataset.
        relay: >
          Redacted, full ECS JSON crosses — never _raw and never CEF. This is
          the least bounded content on the technology and the guard's real
          friction point: Command is arbitrary operator-typed text that can
          carry non-ASCII bytes, control characters, embedded quotes and
          separators, and kilobyte-scale pastes, so normalize encoding and
          enforce the length cap low-side to keep a custom NDJSON content
