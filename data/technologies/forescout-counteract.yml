          values before anything downstream sees them. Carry _raw here -
          console audit records are individually significant and low-volume,
          and system status messages are the only evidence of an Appliance
          going quiet.
        elastic: >
          The integration's event pipeline dissects the sudo-style OS records
          and nothing else, so add a logs-forescout.event@custom pipeline for
          the two grammars it leaves in `message`: split the semicolon-
          delimited system status message into its Application status,
          Connected clients, EM connection status, Assigned hosts, Engine
          status and Installed Plugins components, and derive event.action and
          event.outcome from the console audit trail text - login success and
          failure are documented as flowing through the same System log events
          trigger, so authentication alerting depends entirely on that
          derivation. Correct the sudo identity the dissect leaves behind: the
          USER= target belongs on user.effective.name rather than user.name,
          user.name takes the invoking account the dissect parks at
          forescout.event.service, and both accounts append to related.user.
          Map forescout.event.service and .tty plus the forescout.system.*
          status fields as keyword in the index template, and add source.ip
          extraction from the sshd records so the authentication profile is
          satisfiable.
