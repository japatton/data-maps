id: fortinet-fortigate
name: Fortinet FortiGate NGFW
vendor: Fortinet
versions: FortiOS 7.2, 7.4, 7.6
draft: true
references:
- >-
  https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/357866/log-message-fields
- >-
  https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/160372/list-of-log-types-and-subtypes
- >-
  https://docs.fortinet.com/document/fortigate/7.6.6/administration-guide/986892/sample-logs-by-log-type
- >-
  https://docs.fortinet.com/document/fortigate/7.6.0/administration-guide/834425/understanding-vpn-related-logs
- https://www.elastic.co/docs/reference/integrations/fortinet_fortigate
- https://github.com/elastic/integrations/tree/main/packages/fortinet_fortigate
datasets:
- id: traffic
  name: Forward traffic log
  description: >
    Session records emitted for traffic traversing a firewall policy
    (type=traffic subtype=forward, logid 0000000013). FortiOS emits one
    space-separated key="value" line per session, normally at session close
    and optionally at session start; the same syslog stream also carries
    subtype=local, multicast and sniffer records that share most of this field
    set. This is the highest-volume dataset on the technology by a wide
    margin.
  event_categories:
  - network
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Receives key=value syslog over UDP/TCP from the FortiGate syslogd
        setting (config log syslogd setting). FortiGates are frequently the
        enclave boundary device itself, so a large share of the estate is on
        the low-side path.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (the __syslogout internal
        field carrying a CEF-structured string), being retired; plan of
        record: Cribl HTTP Destination -> guard -> Cribl HTTP Source carrying
        NDJSON. The high side parses _raw (Extract JSON) then adds Cribl
        fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-fortinet_fortigate.log
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Receives key=value syslog over UDP/TCP from the FortiGate syslogd
        setting (config log syslogd setting). High-side instances forward
        straight to the core worker group without crossing the guard.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-fortinet_fortigate.log
  formats:
  - format: syslog-kv
    parsing:
      mechanism: elastic-integration
      artifact: Fortinet FortiGate integration (fortinet_fortigate)
      notes: >
        The integration ships a single log data stream whose default ingest
        pipeline splits on the type field into pipeline_traffic / pipeline_utm
        / pipeline_event, so all four datasets here land in one Elastic data
        stream and are discriminated by fortinet.firewall.type / .subtype
        rather than by index.
    fields:
    - vendor: srcip
      type: ip
      description: source IP address of the session
      ecs: source.ip
      status: mapped
    - vendor: srcport
      type: port
      description: source port of the session
      ecs: source.port
      status: mapped
    - vendor: dstip
      type: ip
      description: destination IP address of the session
      ecs: destination.ip
      status: mapped
    - vendor: dstport
      type: port
      description: destination port of the session
      ecs: destination.port
      status: mapped
    - vendor: proto
      type: integer
      description: >-
        IP protocol of the session, emitted as the numeric IANA protocol
        number (6, 17, 1)
      ecs: network.iana_number
      status: partial
      transform: >
        the vendor value is numeric, so it goes to network.iana_number
        verbatim; network.transport (tcp/udp/icmp) has to be derived from it
        through a protocol-number lookup. FortiGate never emits a transport
        name in this field, so any pipeline that copies proto straight to
        network.transport produces the string "6".
    - vendor: action
      type: enum
      description: >-
        disposition of the session (accept, close, deny, start, timeout,
        client-rst, server-rst, ip-conn, dns)
      ecs: event.action
      status: mapped
      transform: >
        copied to event.action verbatim; event.outcome must be derived from
        the same vocabulary through a lookup (accept/close are successes,
        deny/timeout/client-rst/server-rst are not) because the traffic log
        has no separate outcome column. Note that utmaction="block" can
        contradict action="accept" on a session that a security profile
        stopped mid-flow.
    - vendor: policyid
      type: integer
      description: identifier of the firewall policy the session matched
      ecs: rule.id
      status: mapped
    - vendor: policyname
      type: string
      description: name of the firewall policy the session matched
      ecs: rule.name
      status: partial
      notes: >
        only emitted when the policy has been given a name and FortiOS 6.4 or
        later is in use; unnamed policies leave rule.name empty while rule.id
        is still populated, so dashboards must fall back to policyid rather
        than assume the pair is complete
    - vendor: service
      type: string
      description: >-
        name of the firewall service object matched by the session (HTTP,
        HTTPS, DNS, or a custom name such as tcp/8080)
      ecs: network.protocol
      status: partial
      notes: >
        this is the firewall service-object name, not an observed wire
        protocol - custom service objects put arbitrary administrator-chosen
        strings here, so network.protocol is only meaningful for the built-in
        objects and needs lowercasing plus an allow-list before it can be
        trusted for protocol analytics
    - vendor: app
      type: string
      description: application-control name identified for the session (e.g. HTTP.BROWSER)
      ecs: network.application
      status: mapped
    - vendor: sentbyte
      type: bytes
      description: bytes sent in the client-to-server direction for the session
      ecs: source.bytes
      status: mapped
    - vendor: rcvdbyte
      type: bytes
      description: bytes received in the server-to-client direction for the session
      ecs: destination.bytes
      status: mapped
    - vendor: transip
      type: ip
      description: post-NAT source IP address when source NAT was applied
      ecs: source.nat.ip
      status: mapped
      notes: >
        populated when trandisp is snat; the destination-NAT counterparts on
        the same record (tranip, tranport, emitted when trandisp is dnat for
        VIP-published services) map to destination.nat.ip and
        destination.nat.port and are follow-on mapping work
    - vendor: transport
      type: port
      description: post-NAT source port when source NAT was applied
      ecs: source.nat.port
      status: mapped
      notes: >
        name collision trap - the vendor key "transport" is the translated
        source PORT, not a transport protocol. Any pipeline that pattern-
        matches on the key name will silently write a port number into
        network.transport; the transport protocol comes from proto instead.
    - vendor: srcintf
      type: string
      description: name of the interface the session entered the firewall on
      ecs: observer.ingress.interface.name
      status: mapped
    - vendor: dstintf
      type: string
      description: name of the interface the session left the firewall on
      ecs: observer.egress.interface.name
      status: mapped
    - vendor: sessionid
      type: long
      description: >-
        firewall-local session identifier shared by the traffic record and
        every UTM record raised on the same session
      ecs: null
      status: unmapped
      custom: fortinet.firewall.sessionid
      notes: >
        ECS has no session identifier field, so this stays custom; it is the
        only join key between this dataset and the utm-webfilter / utm-ips
        datasets and must be mapped as keyword rather than left to dynamic
        mapping
    - vendor: devname
      type: string
      description: hostname of the FortiGate that logged the session
      ecs: observer.name
      status: mapped
    - vendor: level
      type: enum
      description: >-
        FortiOS log priority (emergency, alert, critical, error, warning,
        notice, information, debug)
      ecs: log.level
      status: partial
      notes: >
        the integration only lands the string on log.level; numeric ECS
        event.severity needs an explicit lookup over this vocabulary, and the
        same table serves the utm datasets
    - vendor: logid
      type: string
      description: ten-digit FortiOS log message identifier (0000000013 for forward traffic)
      ecs: event.code
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through for this route and let the
          integration's kv parser do the extraction, with Persistent Queue
          backpressure on the Elastic destination rather than Block. The two
          pieces of work worth doing low-side are volume shaping and context:
          sample or suppress subtype=forward action="close" records for
          high-chatter internal policies where the session pair adds nothing,
          and attach the interface-to-site and device-to-owner lookups near
          the source where the inventory data already lives. This is the first
          dataset to drop _raw on once the parser is proven - highest volume,
          lowest per-record forensic value of the four.
        elastic: >
          Parse with the stock fortinet_fortigate pipeline and add a
          logs-fortinet_fortigate.log@custom pipeline for the three gaps this
          map records: derive network.transport from the numeric IANA protocol
          number so transport-based queries work alongside
          network.iana_number, translate the emergency..debug level vocabulary
          into numeric event.severity instead of leaving only log.level, and
          derive event.outcome from the action vocabulary (accept/close are
          successes; deny, timeout and the client-rst/server-rst pair are not)
          because there is no vendor outcome column. Map
          fortinet.firewall.sessionid and .trandisp as keyword in the custom
          namespace so the traffic-to-UTM correlation on sessionid resolves.
        relay: >
          Low-side instances cross the guard: take the thin-envelope hybrid
          rather than parse-low, because a good Elastic integration exists, so
          ship {_dataId, @timestamp, host, _raw} with _dataId set to the
          logs-fortinet_fortigate.log route key and let the integration parse
          high-side. Cap _raw length and strip control and non-UTF-8 bytes
          before the guard destination - FortiOS quotes free-text values but
          does not escape embedded quotes consistently, so unbounded
          policyname and app strings are the content filter's friction here.
          The crossing is at-most-once with no return channel: detect silent
          drops by reconciling low-side and high-side counts per (dataset,
          hour), which matters most on this dataset because its volume masks
          partial loss.
      direct:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through for this route and let the
          integration's kv parser do the extraction, with Persistent Queue
          backpressure on the Elastic destination rather than Block. The two
          pieces of work worth doing near the source are volume shaping and
          context: sample or suppress subtype=forward action="close" records
          for high-chatter internal policies where the session pair adds
          nothing, and attach the interface-to-site and device-to-owner
          lookups at the edge worker group where the inventory data already
          lives. This is the first dataset to drop _raw on once the parser is
          proven - highest volume, lowest per-record forensic value of the
          four.
        elastic: >
          Parse with the stock fortinet_fortigate pipeline and add a
          logs-fortinet_fortigate.log@custom pipeline for the three gaps this
          map records: derive network.transport from the numeric IANA protocol
          number so transport-based queries work alongside
          network.iana_number, translate the emergency..debug level vocabulary
          into numeric event.severity instead of leaving only log.level, and
          derive event.outcome from the action vocabulary (accept/close are
          successes; deny, timeout and the client-rst/server-rst pair are not)
          because there is no vendor outcome column. Map
          fortinet.firewall.sessionid and .trandisp as keyword in the custom
          namespace so the traffic-to-UTM correlation on sessionid resolves.
  - format: syslog-cef
    enable: >
      On the FortiGate: `config log syslogd setting / set status enable / set
      server <collector-ip> / set format cef / set port 514 / end`. `set
      format cef` switches the whole syslog stream (all types and subtypes on
      that syslogd instance) from the default key=value line to the CEF:0
      envelope; there is no per-log-type toggle, so selecting CEF here also
      changes the utm and event datasets on the same server. Up to four
      independent destinations exist (syslogd, syslogd2, syslogd3, syslogd4),
      so CEF can be sent to one collector while default kv is kept on another.
      `config log syslogd filter` still governs which types/subtypes and
      severities are forwarded.
    references:
    - >-
      https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/998820/fortios-to-cef-log-field-mapping-guidelines
    - >-
      https://docs.fortinet.com/document/fortigate/7.4.3/fortios-log-message-reference/949981/traffic-log-support-for-cef
    - >-
      https://github.com/fortinet-ansible-dev/ansible-galaxy-fortios-sphinxdoc/blob/galaxy-1.1.3/gen/fortios_log_syslogd_setting.rst
    parsing:
      mechanism: elastic-integration
      artifact: >-
        Elastic CEF integration (cef) OR fortinet_fortigate with a CEF
        pre-parse; data stream logs-cef.log or logs-fortinet_fortigate.log
      notes: >
        The stock fortinet_fortigate integration is written against the
        key=value line and will not natively decode the CEF envelope. Two
        viable paths: (a) send CEF to the generic Elastic CEF integration,
        which lands the standard keys on ECS (src->source.ip etc.) and the
        FTNTFGT extensions on cef.extensions.* as strings, then add an @custom
        pipeline to lift the FTNTFGT* values onto the same ECS/custom targets
        the kv map uses; or (b) strip the CEF header and re-key in Cribl back
        to the FortiOS field names so the native fortinet_fortigate pipeline
        can run unchanged. Path (a) is less work but leaves the FortiGuard/UTM
        semantics under cef.*; path (b) reuses all the kv pipeline logic. Note
        the CEF form still needs the same numeric-proto, severity-lookup and
        outcome-derivation @custom work the kv form needs - CEF does not
        pre-resolve any of those.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the core group a pass-through and decide the re-key strategy
          once: if the estate standardizes on CEF, run path (b) (rewrite the
          CEF extensions back to FortiOS keys in a Cribl pipeline) so exactly
          one high-side pipeline serves both the kv and CEF instances, rather
          than maintaining a parallel cef.* mapping. The two low-side jobs
          from the kv route still apply - sample/suppress action="close"
          forward records for high-chatter internal policies, and attach the
          interface-to-site and device-to-owner lookups near the source. CEF
          double-quotes free-text extension values and does NOT escape
          embedded quotes or the `=` separator reliably, so FTNTFGTpolicyname
          and app strings remain the extraction hazard - normalize them
          low-side before any downstream parse.
        elastic: >
          Whichever path is chosen, add a logs-fortinet_fortigate.log@custom
          (or logs-cef.log@custom) pipeline that reproduces the three kv gaps:
          derive network.transport from the numeric proto (CEF carries
          proto=6, not "tcp"), translate FTNTFGTlevel's emergency..debug
          vocabulary into numeric event.severity, and derive event.outcome
          from act (accept/close are successes;
          deny/timeout/client-rst/server-rst are not). Map FTNTFGTsessionid as
          keyword so the traffic-to-UTM correlation still resolves, and lift
          FTNTFGTpoluuid onto rule.uuid.
        relay: >
          Low-side instances cross the guard. Do NOT relay CEF across the CDS
          even though FortiOS can emit it: the plan-of-record crossing is
          NDJSON over the Cribl HTTP path, and a CEF string is a second-class,
          quote-fragile envelope for a content filter to reason about. Convert
          CEF to the thin-envelope hybrid ({_dataId, @timestamp, host, _raw})
          low-side, cap _raw length and strip control/non-UTF-8 bytes, and let
          the integration parse high-side. This is still the first dataset to
          drop _raw on once the parser is proven - highest volume, lowest
          per-record forensic value. At-most-once crossing; reconcile low/high
          counts per (dataset, hour).
      direct:
        parse_location: high
        cribl: >
          High-side instances skip the guard: pass CEF straight through with
          Persistent Queue backpressure and do the re-key (path b) or hand to
          the CEF integration (path a) at the core group. No low-side content
          handling is needed on this path.
        elastic: >
          Add a logs-fortinet_fortigate.log@custom (or logs-cef.log@custom)
          pipeline that reproduces the three kv gaps: derive network.transport
          from the numeric proto (CEF carries proto=6, not "tcp"), translate
          FTNTFGTlevel's emergency..debug vocabulary into numeric
          event.severity, and derive event.outcome from act (accept/close are
          successes; deny/timeout/client-rst/server-rst are not). Map
          FTNTFGTsessionid as keyword so the traffic-to-UTM correlation still
          resolves, and lift FTNTFGTpoluuid onto rule.uuid. None of these are
          CEF-native.
    fields:
    - vendor: src
      type: ip
      description: CEF standard key for srcip - session source IP
      ecs: source.ip
      status: mapped
    - vendor: spt
      type: port
      description: CEF standard key for srcport - session source port
      ecs: source.port
      status: mapped
    - vendor: dst
      type: ip
      description: CEF standard key for dstip - session destination IP
      ecs: destination.ip
      status: mapped
    - vendor: dpt
      type: port
      description: CEF standard key for dstport - session destination port
      ecs: destination.port
      status: mapped
    - vendor: proto
      type: integer
      description: CEF standard key for proto - numeric IANA protocol number (6, 17, 1)
      ecs: network.iana_number
      status: partial
      transform: >
        carried as the numeric value exactly as in the kv form, so
        network.transport still has to be derived through a protocol-number
        lookup; CEF does not emit a transport name here
    - vendor: act
      type: enum
      description: >-
        CEF standard key for action - session disposition (accept, close,
        deny, start, timeout, client-rst, server-rst)
      ecs: event.action
      status: mapped
      transform: >
        copied to event.action; event.outcome must be derived from the same
        vocabulary (accept/close success, deny/timeout/client-rst/server-rst
        not) - the CEF form has no outcome key either
    - vendor: app
      type: string
      description: CEF standard key for app - application-control name (e.g. HTTP.BROWSER)
      ecs: network.application
      status: mapped
    - vendor: deviceInboundInterface
      type: string
      description: CEF standard key for srcintf - ingress interface name
      ecs: observer.ingress.interface.name
      status: mapped
    - vendor: deviceOutboundInterface
      type: string
      description: CEF standard key for dstintf - egress interface name
      ecs: observer.egress.interface.name
      status: mapped
    - vendor: deviceExternalId
      type: string
      description: >-
        CEF standard key for devid - serial number of the FortiGate that
        logged the session
      ecs: observer.serial_number
      status: mapped
      notes: >
        the CEF envelope carries the serial, not the hostname: Fortinet's
        traffic sample reads deviceExternalId=FGT5HD3915800610 while the
        hostname FGT-A-LOG sits in the syslog header, and CEF emits no devname
        extension key. Populate observer.name from that header host so this
        route and the kv route - where devname feeds observer.name - carry the
        same appliance name.
    - vendor: FTNTFGTlogid
      type: string
      description: >-
        ten-digit FortiOS log id (0000000013 for forward traffic); also the
        CEF signatureId in the header
      ecs: event.code
      status: mapped
    - vendor: FTNTFGTpolicyid
      type: integer
      description: >-
        firewall policy id the session matched (native policyid,
        FTNTFGT-prefixed because it has no standard CEF key)
      ecs: rule.id
      status: mapped
    - vendor: FTNTFGTpolicyname
      type: string
      description: firewall policy name the session matched
      ecs: rule.name
      status: partial
      notes: >
        only present when the policy is named; unnamed policies leave
        rule.name empty while FTNTFGTpolicyid still populates rule.id, so
        dashboards must fall back to the id
    - vendor: FTNTFGTservice
      type: string
      description: >-
        firewall service-object name matched (HTTP, HTTPS, or a custom name
        such as tcp/8080)
      ecs: network.protocol
      status: partial
      notes: >
        service-object name, not an observed wire protocol; custom objects
        carry arbitrary admin strings, so network.protocol needs lowercasing
        and an allow-list before it is trustworthy
    - vendor: FTNTFGTsessionid
      type: long
      description: >-
        firewall-local session id shared with every UTM record raised on the
        same session
      ecs: null
      status: unmapped
      custom: fortinet.firewall.sessionid
      notes: >-
        the only join key to the utm-webfilter / utm-ips CEF records; map as
        keyword, not dynamic
    - vendor: FTNTFGTlevel
      type: enum
      description: >-
        FortiOS log priority (emergency, alert, critical, error, warning,
        notice, information, debug)
      ecs: log.level
      status: partial
      notes: >-
        numeric ECS event.severity needs an explicit lookup over this
        vocabulary, shared with the utm datasets
    - vendor: FTNTFGTsubtype
      type: string
      description: FortiOS log subtype (forward, local, multicast, sniffer)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.subtype
      notes: discriminates the traffic subtypes that share this field set; no ECS home
    - vendor: cat
      type: string
      description: CEF category, set to the FortiOS type:subtype pair (e.g. traffic:forward)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.type
      notes: >
        the CEF `cat` slot is consumed by the FortiOS type:subtype label, so
        it is NOT available for any FortiGuard/URL category on this technology
        - a trap when reusing CEF parsers written for other vendors
    - vendor: FTNTFGTvd
      type: string
      description: virtual domain (VDOM) that processed the session
      ecs: null
      status: unmapped
      custom: fortinet.firewall.vd
    - vendor: FTNTFGTeventtime
      type: timestamp
      description: >-
        FortiOS event time as an epoch value (nanoseconds on FortiOS 6.2+,
        seconds on older builds)
      ecs: event.start
      status: partial
      transform: >
        epoch unit varies by FortiOS version and by set log-timestamp-format,
        so the value length must be tested before conversion; @timestamp is
        derived from the CEF header time, not from this key
    - vendor: FTNTFGTpoluuid
      type: string
      description: UUID of the matched firewall policy (stable across policy renames/reorders)
      ecs: rule.uuid
      status: mapped
    - vendor: FTNTFGTsrcintfrole
      type: string
      description: configured role of the ingress interface (lan, wan, dmz, undefined)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.srcintfrole
    - vendor: FTNTFGTdstintfrole
      type: string
      description: configured role of the egress interface (lan, wan, dmz, undefined)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.dstintfrole
  - format: netflow
    enable: >
      Global collector(s): `config system netflow / set collector-ip
      <collector> / set collector-port 2055 / set source-ip <fgt-ip> / set
      active-flow-timeout 30 / set inactive-flow-timeout 15 / end` (FortiOS
      7.x replaces the single collector with `config collectors / edit 1 / set
      collector-ip ... / set collector-port ... / set interface-select-method
      ... / next / end` for up to six collectors, and adds template-tx
      controls). Export is off until an interface samples: `config system
      interface / edit <intf> / set netflow-sampler both / next / end` (tx |
      rx | both). Full NetFlow (not just sampled) is derived from the firewall
      session table. VDOM deployments use `config system vdom-netflow`.
      FortiGate exports NetFlow v9 by default; IPFIX is selectable on
      supported builds.
    references:
    - >-
      https://docs.fortinet.com/document/fortigate/7.6.2/administration-guide/998643/netflow
    - >-
      https://docs.fortinet.com/document/fortigate/6.4.0/administration-guide/728397/netflow-and-ipfix-support
    - >-
      https://www.manageengine.com/products/netflow/help/fortigate-fortios-netflow-configuration.html
    parsing:
      mechanism: elastic-integration
      artifact: Elastic NetFlow Records integration (netflow), data stream logs-netflow.log
      notes: >
        NetFlow is binary v9/IPFIX over UDP - it needs a NetFlow decoder, not
        a syslog parser, and the stock fortinet_fortigate integration cannot
        read it. The Elastic Agent netflow input decodes the IANA-standard
        elements (8/12 addresses, 7/11 ports, 4 protocol, 1/2 byte/packet
        deltas, 10/14 ingress/egress ifIndex, 21/22 flow end/start) onto
        netflow.* and ECS automatically. Cribl Stream does not natively decode
        binary NetFlow v9, so on a Cribl-first path a collector or the Elastic
        Agent input must terminate the UDP stream first. Fortinet
        enterprise-specific elements (PEN 12356), when present, arrive as raw
        template fields and need a custom pipeline - their inventory is not
        fully published and is reported as a gap.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          The hard constraint is that NetFlow is binary UDP whose v9 template
          packets are sent on a separate cadence from the data records: a
          naive byte relay would strand data records whose template never
          crossed the guard. Decode NetFlow to structured records LOW-SIDE
          (Elastic Agent netflow input or a collector in the low enclave),
          resolve the ifIndex-to-interface-name lookup while the appliance is
          reachable, then hand NDJSON to Cribl for the crossing.
        elastic: >
          Run the netflow integration for the standard sockets/counters and
          add an @custom pipeline that derives network.transport from the
          numeric protocol, and that folds the flow into the same site/owner
          enrichment the kv traffic dataset uses. There is no policy id, app
          name or outcome in NetFlow, so cross-dataset joins to the UTM
          records are not possible from this feed - treat it as a
          volume/throughput signal, not a replacement for the session log.
        relay: >
          Cross decoded NDJSON, never the raw NetFlow - the binary form is
          both un-inspectable at the guard and template-dependent. Once
          decoded, the content-inspection surface is tiny: NetFlow carries no
          free-text, only typed numeric/address values, so the content filter
          is simple. Persistent Queue with a dead-letter route, and reconcile
          low/high record counts per hour since the crossing is at-most-once.
      direct:
        parse_location: high
        cribl: >
          High-side instances still need the UDP stream terminated by a
          netflow decoder (Elastic Agent input) before Cribl; there is no
          pass-through option for binary NetFlow.
        elastic: >
          Run the netflow integration for the standard sockets/counters and
          add an @custom pipeline that derives network.transport from the
          numeric protocol, and that folds the flow into the same site/owner
          enrichment the kv traffic dataset uses. There is no policy id, app
          name or outcome in NetFlow, so cross-dataset joins to the UTM
          records are not possible from this feed - treat it as a
          volume/throughput signal, not a replacement for the session log.
    fields:
    - vendor: sourceIPv4Address
      type: ip
      description: NetFlow/IPFIX element 8 - flow source address
      ecs: source.ip
      status: mapped
    - vendor: destinationIPv4Address
      type: ip
      description: NetFlow/IPFIX element 12 - flow destination address
      ecs: destination.ip
      status: mapped
    - vendor: sourceTransportPort
      type: port
      description: NetFlow/IPFIX element 7 - source port
      ecs: source.port
      status: mapped
    - vendor: destinationTransportPort
      type: port
      description: NetFlow/IPFIX element 11 - destination port
      ecs: destination.port
      status: mapped
    - vendor: protocolIdentifier
      type: integer
      description: NetFlow/IPFIX element 4 - numeric IANA protocol number
      ecs: network.iana_number
      status: partial
      transform: >-
        numeric only; network.transport must be derived by protocol-number
        lookup, same as the kv/CEF forms
    - vendor: octetDeltaCount
      type: long
      description: NetFlow/IPFIX element 1 - bytes in this flow direction
      ecs: source.bytes
      status: partial
      notes: >-
        directional: the forward flow record maps to source.bytes and the
        reverse to destination.bytes; a single bidirectional record needs both
        octet counters split by direction
    - vendor: packetDeltaCount
      type: long
      description: NetFlow/IPFIX element 2 - packets in this flow direction
      ecs: source.packets
      status: partial
      notes: >-
        directional in the same way as octetDeltaCount; reverse direction is
        destination.packets
    - vendor: ingressInterface
      type: integer
      description: NetFlow/IPFIX element 10 - SNMP ifIndex of the ingress interface
      ecs: observer.ingress.interface.id
      status: partial
      notes: >-
        numeric ifIndex, not a name; resolve to
        observer.ingress.interface.name via a per-device ifIndex lookup
        low-side while the appliance is reachable
    - vendor: egressInterface
      type: integer
      description: NetFlow/IPFIX element 14 - SNMP ifIndex of the egress interface
      ecs: observer.egress.interface.id
      status: partial
      notes: same ifIndex-to-name resolution as ingressInterface
    - vendor: flowStartSysUpTime
      type: long
      description: NetFlow/IPFIX flow start (element 22, or 152 flowStartMilliseconds on IPFIX)
      ecs: event.start
      status: partial
      transform: >-
        v9 expresses start as ms since device boot and needs the
        sysUpTime/export epoch to become an absolute time; IPFIX millisecond
        elements convert directly
- id: utm-webfilter
  name: UTM web filter log
  description: >
    FortiGuard web filtering and URL filtering verdicts (type=utm
    subtype=webfilter, logid 0316013056 and neighbours) raised against a
    session already summarized in the traffic log. Field set diverges sharply
    from the IPS subtype - URL, category and HTTP metadata instead of
    signature identity - which is why it is modelled as its own dataset.
  event_categories:
  - web
  - network
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same syslog stream as the traffic dataset, discriminated on
        type/subtype.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (the __syslogout internal
        field carrying a CEF-structured string), being retired; plan of
        record: Cribl HTTP Destination -> guard -> Cribl HTTP Source carrying
        NDJSON. The high side parses _raw (Extract JSON) then adds Cribl
        fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-fortinet_fortigate.log
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same syslog stream as the traffic dataset, discriminated on
        type/subtype.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-fortinet_fortigate.log
  formats:
  - format: syslog-kv
    parsing:
      mechanism: elastic-integration
      artifact: Fortinet FortiGate integration (fortinet_fortigate)
    fields:
    - vendor: action
      type: enum
      description: >-
        web filter verdict for the request (blocked, passthrough,
        blocked-by-quota, exempt)
      ecs: event.action
      status: mapped
      transform: >
        blocked maps to an event.outcome of failure and passthrough/exempt to
        success; the integration sets event.type from the same value, so the
        outcome derivation must not be left to the default success assignment
    - vendor: eventtype
      type: enum
      description: >-
        which web filter engine produced the verdict (ftgd_allow, ftgd_blk,
        urlfilter, ftgd_quota, command-block)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.eventtype
      notes: >
        discriminates FortiGuard category filtering from static URL-filter
        list hits; the integration copies it to event.action only when action
        is absent, so keep it as its own custom keyword rather than letting it
        overwrite the verdict
    - vendor: hostname
      type: string
      description: FQDN or host header of the requested site
      ecs: url.domain
      status: mapped
    - vendor: url
      type: string
      description: requested URL, normally the path component only when hostname is populated
      ecs: url.path
      status: partial
      transform: >
        in flow-based inspection FortiOS emits just the path here (often "/")
        with the FQDN in hostname, so url.full has to be rebuilt as scheme +
        hostname + path; in proxy-based inspection the same field can carry an
        absolute URL, so the pipeline must test for a scheme before
        concatenating or it will emit doubled hosts
    - vendor: catdesc
      type: string
      description: >-
        FortiGuard category name the requested site resolved to (e.g.
        "Malicious Websites")
      ecs: rule.category
      status: partial
      notes: >
        the stock integration parks this on rule.category, the same field the
        traffic dataset uses for the application category - two different
        taxonomies on one field. Prefer a custom namespace here so
        category-based alerting is not ambiguous across subtypes.
    - vendor: cat
      type: integer
      description: numeric FortiGuard category identifier corresponding to catdesc
      ecs: null
      status: unmapped
      custom: fortinet.firewall.cat
      notes: >
        the stable identifier for the category (catdesc strings change between
        FortiGuard releases); needs the FortiGuard category table as an enrich
        policy to be readable on its own
    - vendor: profile
      type: string
      description: name of the web filter profile that produced the verdict
      ecs: rule.ruleset
      status: mapped
    - vendor: reqtype
      type: enum
      description: whether the request was typed directly or followed a referral (direct, referral)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.reqtype
      notes: >-
        distinguishes user-initiated navigation from embedded/redirected
        fetches; no ECS equivalent
    - vendor: method
      type: enum
      description: >-
        how the web filter matched the request (domain, url, pattern) - NOT
        the HTTP verb
      ecs: null
      status: unmapped
      custom: fortinet.firewall.method
      notes: >
        documented as "HTTP method" in the Elastic integration's field
        reference, which is a trap: in webfilter records the value is the
        match method (domain/url), not GET/POST. The HTTP verb, when present
        at all, comes from the separate httpmethod field, which is what
        http.request.method must be fed from.
    - vendor: referralurl
      type: string
      description: referring URL for the request, when deep inspection or proxy mode is in use
      ecs: http.request.referrer
      status: mapped
    - vendor: agent
      type: string
      description: HTTP User-Agent string of the requesting client
      ecs: user_agent.original
      status: partial
      notes: >
        only populated under proxy-based inspection or deep SSL inspection;
        absent on the flow-based records that make up most of the volume, so
        user-agent-based detections silently under-match
    - vendor: direction
      type: enum
      description: direction of the traffic relative to the firewall (incoming, outgoing)
      ecs: network.direction
      status: partial
      transform: >
        ECS network.direction expects
        ingress/egress/inbound/outbound/internal/external; the vendor's
        incoming/outgoing strings need mapping rather than copying, or the
        field fails index-template expectations
    - vendor: msg
      type: string
      description: >-
        human-readable explanation of the verdict (e.g. "URL belongs to a
        denied category in policy")
      ecs: message
      status: mapped
    - vendor: srcip
      type: ip
      description: IP address of the client making the request
      ecs: source.ip
      status: mapped
    - vendor: dstip
      type: ip
      description: IP address of the web server the request was destined for
      ecs: destination.ip
      status: mapped
    - vendor: dstport
      type: port
      description: destination port of the request (80, 443, ...)
      ecs: destination.port
      status: mapped
    - vendor: user
      type: string
      description: >-
        authenticated username associated with the session (FSSO, captive
        portal, or explicit proxy auth)
      ecs: source.user.name
      status: partial
      notes: >
        FortiOS emits the literal string "N/A" rather than omitting the key
        when no identity is known, so the value must be dropped instead of
        indexed or every unauthenticated request becomes a user named N/A
    - vendor: policyid
      type: integer
      description: identifier of the firewall policy whose profile group applied the web filter
      ecs: rule.id
      status: mapped
    - vendor: level
      type: enum
      description: FortiOS log priority for the verdict (warning for blocks, notice for allows)
      ecs: log.level
      status: partial
      notes: >-
        same emergency..debug vocabulary as the traffic dataset; numeric
        event.severity needs the shared lookup
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass through to Elastic with Persistent Queue backpressure and do no
          low-side extraction, but do the two hygiene jobs that are cheaper
          near the source: normalize percent- and unicode-encoded URL values
          once so downstream matching is deterministic, and strip query
          strings on the categories the org has decided not to retain
          (webmail, search) before they are stored anywhere. Keep _raw on this
          route longer than on traffic - a mis-parsed URL is not
          reconstructable and web-filter records are routinely the pivot in an
          investigation.
        elastic: >
          Let the stock fortinet_fortigate UTM pipeline parse, then add a
          logs-fortinet_fortigate.log@custom pipeline that reconstructs
          url.full from the service scheme, hostname and url path instead of
          relying on the vendor emitting a whole URL, and that normalizes the
          incoming/outgoing direction vocabulary into ECS's
          inbound/outbound/ingress/egress values. Move the FortiGuard category
          name off rule.category into a custom namespace so it stops colliding
          with the traffic dataset's application category on the same field,
          map fortinet.firewall.cat as long with an enrich policy resolving it
          to the FortiGuard category name, and explicitly keep the vendor
          method field away from http.request.method.
        relay: >
          Low-side instances cross the guard, and this is the dataset that
          should NOT go thin-envelope blindly: URLs are the least bounded
          content on the technology (FortiOS allows kilobyte-scale values
          carrying percent-encoded and non-ASCII bytes), so whichever envelope
          is chosen, cap URL and referrer length and normalize encoding
          low-side before the guard destination so a custom NDJSON content
          filter can stay simple. Nothing CEF-shaped should cross even though
          FortiOS can emit webfilter records in CEF - convert low-side.
          At-most-once crossing; reconcile counts per (dataset, hour).
      direct:
        parse_location: high
        cribl: >
          Pass through to Elastic with Persistent Queue backpressure and let
          the integration parse; the two hygiene jobs worth doing near the
          source are normalizing percent- and unicode-encoded URL values once
          so downstream matching is deterministic, and stripping query strings
          on the categories the org has decided not to retain (webmail,
          search) before they are stored anywhere. Keep _raw on this route
          longer than on traffic - a mis-parsed URL is not reconstructable and
          web-filter records are routinely the pivot in an investigation.
        elastic: >
          Let the stock fortinet_fortigate UTM pipeline parse, then add a
          logs-fortinet_fortigate.log@custom pipeline that reconstructs
          url.full from the service scheme, hostname and url path instead of
          relying on the vendor emitting a whole URL, and that normalizes the
          incoming/outgoing direction vocabulary into ECS's
          inbound/outbound/ingress/egress values. Move the FortiGuard category
          name off rule.category into a custom namespace so it stops colliding
          with the traffic dataset's application category on the same field,
          map fortinet.firewall.cat as long with an enrich policy resolving it
          to the FortiGuard category name, and explicitly keep the vendor
          method field away from http.request.method.
  - format: syslog-cef
    enable: >
      Same syslogd instance and `set format cef` as the traffic dataset - CEF
      is a stream-wide setting, so once selected the webfilter subtype is
      emitted in CEF automatically; there is no webfilter-specific format
      toggle. `config log syslogd filter / set forward-traffic ... / set utm
      ...` still governs whether UTM records are forwarded on that
      destination.
    references:
    - >-
      https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/998820/fortios-to-cef-log-field-mapping-guidelines
    - >-
      https://docs.fortinet.com/document/fortigate/7.6.3/fortios-log-message-reference/400992/webfilter-log-support-for-cef
    parsing:
      mechanism: elastic-integration
      artifact: Elastic CEF integration (cef) OR fortinet_fortigate with a CEF pre-parse
      notes: >
        As with traffic, either land the standard keys via the CEF integration
        and lift FTNTFGT* extensions in an @custom pipeline, or re-key back to
        FortiOS names in Cribl and run the native UTM pipeline. The
        webfilter-specific @custom work is unchanged from the kv form: rebuild
        url.full from scheme + dhost + request, move the FortiGuard category
        off rule.category into a custom namespace, and keep the match-method
        value away from http.request.method.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass through with Persistent Queue backpressure; do the two hygiene
          jobs near the source that are cheaper there - normalize percent- and
          unicode-encoded values in the `request` extension once so downstream
          matching is deterministic, and strip query strings on categories the
          org will not retain. CEF quoting does not protect the `=` inside a
          raw URL, so a percent-encoded `=` in request is an extraction hazard
          - normalize before any high-side re-key. Keep _raw on this route
          longer than on traffic: a mis-parsed URL is not reconstructable.
        elastic: >
          Rebuild url.full from the service scheme + dhost + request rather
          than relying on a whole URL being present, normalize the
          FTNTFGTdirection incoming/outgoing vocabulary into ECS's
          inbound/outbound/ingress/egress, move FTNTFGTcatdesc off
          rule.category into a custom namespace so it stops colliding with the
          traffic application category, map FTNTFGTcat as long with an enrich
          policy resolving the FortiGuard category name, and keep the match
          `method` value out of http.request.method.
        relay: >
          Low-side instances cross the guard, and this is the dataset that
          must NOT go thin-envelope blindly: the `request` extension is the
          least bounded content on the technology (kilobyte-scale,
          percent-encoded, non-ASCII). Whichever envelope is chosen, cap the
          request/referrer length and normalize encoding low-side before the
          guard destination. Nothing CEF-shaped should cross - convert to
          NDJSON low-side. At-most-once crossing; reconcile counts per
          (dataset, hour).
      direct:
        parse_location: high
        cribl: >
          High-side instances pass CEF through with Persistent Queue
          backpressure; the URL-normalization job is still worth doing at the
          core group for deterministic matching, but no guard-driven capping
          is required.
        elastic: >
          Rebuild url.full from the service scheme + dhost + request rather
          than relying on a whole URL being present, normalize the
          FTNTFGTdirection incoming/outgoing vocabulary into ECS's
          inbound/outbound/ingress/egress, move FTNTFGTcatdesc off
          rule.category into a custom namespace so it stops colliding with the
          traffic application category, map FTNTFGTcat as long with an enrich
          policy resolving the FortiGuard category name, and keep the match
          `method` value out of http.request.method.
    fields:
    - vendor: src
      type: ip
      description: CEF standard key for srcip - client IP making the request
      ecs: source.ip
      status: mapped
    - vendor: spt
      type: port
      description: CEF standard key for srcport - client source port
      ecs: source.port
      status: mapped
    - vendor: dst
      type: ip
      description: CEF standard key for dstip - web server IP
      ecs: destination.ip
      status: mapped
    - vendor: dpt
      type: port
      description: CEF standard key for dstport - destination port (80, 443, ...)
      ecs: destination.port
      status: mapped
    - vendor: proto
      type: integer
      description: CEF standard key for proto - numeric IANA protocol number
      ecs: network.iana_number
      status: partial
      transform: numeric only; network.transport derived by lookup
    - vendor: app
      type: string
      description: CEF standard key for app - application identified for the request (e.g. HTTP)
      ecs: network.application
      status: mapped
    - vendor: dhost
      type: string
      description: CEF standard key for hostname - FQDN/host header of the requested site
      ecs: url.domain
      status: mapped
    - vendor: request
      type: string
      description: >-
        CEF standard key for url - requested URL, usually the path component
        when dhost is populated
      ecs: url.path
      status: partial
      transform: >
        flow-based inspection puts just the path here with the FQDN in dhost,
        so url.full is rebuilt as scheme + dhost + request; proxy-based
        inspection can carry an absolute URL, so test for a scheme before
        concatenating or doubled hosts result
    - vendor: act
      type: enum
      description: >-
        CEF standard key for action - webfilter verdict (blocked, passthrough,
        blocked-by-quota, exempt)
      ecs: event.action
      status: mapped
      transform: >-
        blocked -> event.outcome failure; passthrough/exempt -> success (not
        left to the default success assignment)
    - vendor: duser
      type: string
      description: >-
        CEF standard key for user - authenticated username (FSSO, captive
        portal, explicit proxy)
      ecs: source.user.name
      status: partial
      notes: >
        FortiOS emits the literal "N/A" rather than omitting the key when no
        identity is known, so the value must be dropped instead of indexed
    - vendor: deviceInboundInterface
      type: string
      description: CEF standard key for srcintf - ingress interface name
      ecs: observer.ingress.interface.name
      status: mapped
    - vendor: deviceOutboundInterface
      type: string
      description: CEF standard key for dstintf - egress interface name
      ecs: observer.egress.interface.name
      status: mapped
    - vendor: deviceExternalId
      type: string
      description: >-
        CEF standard key for devid - serial number of the FortiGate that
        logged the verdict
      ecs: observer.serial_number
      status: mapped
      notes: >
        the CEF envelope carries the serial, not the hostname - the hostname
        sits in the syslog header and CEF emits no devname extension key.
        Populate observer.name from that header host so this route and the kv
        route, where devname feeds observer.name, carry the same appliance
        name.
    - vendor: msg
      type: string
      description: CEF standard key for msg - human-readable verdict explanation
      ecs: message
      status: mapped
    - vendor: FTNTFGTlogid
      type: string
      description: ten-digit FortiOS log id (0316013056 and neighbours); also the CEF signatureId
      ecs: event.code
      status: mapped
    - vendor: FTNTFGTeventtype
      type: enum
      description: >-
        which web filter engine produced the verdict (ftgd_allow, ftgd_blk,
        urlfilter, ftgd_quota)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.eventtype
      notes: >-
        distinguishes FortiGuard category filtering from static URL-filter
        list hits; keep as its own keyword, not overwriting act
    - vendor: FTNTFGTcatdesc
      type: string
      description: >-
        FortiGuard category name the site resolved to (e.g. "Malicious
        Websites"); FTNTFGT-prefixed because the CEF cat slot holds the
        type:subtype
      ecs: rule.category
      status: partial
      notes: >
        parks on rule.category, the same field the traffic dataset uses for
        the application category - two taxonomies on one field; prefer a
        custom namespace so category alerting is unambiguous across subtypes
    - vendor: FTNTFGTcat
      type: integer
      description: numeric FortiGuard category id corresponding to FTNTFGTcatdesc
      ecs: null
      status: unmapped
      custom: fortinet.firewall.cat
      notes: >-
        stable id (catdesc strings change between FortiGuard releases); needs
        the category table as an enrich policy
    - vendor: FTNTFGTprofile
      type: string
      description: web filter profile that produced the verdict
      ecs: rule.ruleset
      status: mapped
    - vendor: FTNTFGTreqtype
      type: enum
      description: whether the request was typed directly or followed a referral (direct, referral)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.reqtype
    - vendor: FTNTFGTlevel
      type: enum
      description: FortiOS log priority for the verdict (warning for blocks, notice for allows)
      ecs: log.level
      status: partial
      notes: same emergency..debug vocabulary; numeric event.severity needs the shared lookup
    - vendor: cat
      type: string
      description: CEF category, set to the FortiOS type:subtype (utm:webfilter)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.type
      notes: >-
        the CEF cat slot carries the log type:subtype, NOT the FortiGuard
        category - that is FTNTFGTcatdesc
- id: utm-ips
  name: UTM IPS log
  description: >
    Intrusion prevention signature detections (type=utm subtype=ips
    eventtype=signature, logid 0419016384) raised by an IPS sensor attached to
    a firewall policy. Carries signature identity, its own severity vocabulary
    and optional base64 packet context; the antivirus subtype rides the same
    route and pipeline with a different field set (virus, virusid, filename,
    checksum) and is follow-on mapping work.
  event_categories:
  - network
  - malware
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same syslog stream as the traffic dataset, discriminated on
        type/subtype.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (the __syslogout internal
        field carrying a CEF-structured string), being retired; plan of
        record: Cribl HTTP Destination -> guard -> Cribl HTTP Source carrying
        NDJSON. The high side parses _raw (Extract JSON) then adds Cribl
        fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-fortinet_fortigate.log
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same syslog stream as the traffic dataset, discriminated on
        type/subtype.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-fortinet_fortigate.log
  formats:
  - format: syslog-kv
    recommended: true
    recommended_because: >-
      the FortiGate key-value format is what the fortinet_fortigate
      integration parses; `set format cef` is stream-wide, so it would flip
      every FortiGate dataset onto the generic CEF integration at once.
    parsing:
      mechanism: elastic-integration
      artifact: Fortinet FortiGate integration (fortinet_fortigate)
    fields:
    - vendor: attack
      type: string
      description: >-
        name of the IPS signature that matched (e.g.
        Adobe.Flash.newfunction.Handling.Code.Execution)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.attack
      notes: >
        detection-rule identity with no correct ECS home here. Not rule.name:
        in this dataset rule.id is already the firewall policyid and
        rule.ruleset the IPS sensor name, so pairing a signature name with a
        policy id under one rule.* object would mislead any dashboard reading
        them as a name/id pair - unlike Suricata, where rule.name and rule.id
        describe the same signature. Not threat.indicator.*, which models
        identifiers issued by a threat-intel provider for an indicator
        document.
    - vendor: attackid
      type: integer
      description: numeric FortiGuard signature identifier for the matched attack
      ecs: null
      status: unmapped
      custom: fortinet.firewall.attackid
      notes: >
        the stable join key to the FortiGuard encyclopedia and the value
        detections should pin on (signature names are renamed between
        releases); kept custom for the same reason as attack above
    - vendor: severity
      type: enum
      description: >-
        severity the IPS sensor assigned to the detection (critical, high,
        medium, low, info)
      ecs: event.severity
      status: partial
      transform: >
        vendor values are strings and need a lookup into ECS's numeric
        event.severity scale. This is a different vocabulary from the level
        field on the same record (which is emergency..debug), so the two must
        not share a translation table.
    - vendor: action
      type: enum
      description: >-
        what the sensor did with the matching traffic (dropped, detected,
        reset, clear_session, block, pass)
      ecs: event.action
      status: mapped
      transform: >
        copied verbatim; event.outcome must be derived from the same
        vocabulary - detected and pass are monitor-only and are not failures,
        while dropped, reset, block and clear_session are
    - vendor: ref
      type: string
      description: FortiGuard encyclopedia URL for the matched signature
      ecs: event.reference
      status: mapped
    - vendor: incidentserialno
      type: long
      description: serial number grouping all records belonging to one detected incident
      ecs: null
      status: unmapped
      custom: fortinet.firewall.incidentserialno
      notes: >-
        groups multi-record detections; no ECS equivalent, but the only way to
        collapse a burst into one incident
    - vendor: profile
      type: string
      description: name of the IPS sensor that produced the detection
      ecs: rule.ruleset
      status: mapped
    - vendor: policyid
      type: integer
      description: identifier of the firewall policy the IPS sensor was attached to
      ecs: rule.id
      status: mapped
    - vendor: srcip
      type: ip
      description: source IP address of the traffic that triggered the signature
      ecs: source.ip
      status: mapped
    - vendor: srcport
      type: port
      description: source port of the triggering traffic
      ecs: source.port
      status: mapped
    - vendor: dstip
      type: ip
      description: destination IP address of the traffic that triggered the signature
      ecs: destination.ip
      status: mapped
    - vendor: dstport
      type: port
      description: destination port of the triggering traffic
      ecs: destination.port
      status: mapped
    - vendor: proto
      type: integer
      description: IP protocol of the triggering traffic, as the numeric IANA protocol number
      ecs: network.iana_number
      status: partial
      transform: >-
        same numeric-to-name derivation as the traffic dataset;
        network.transport must be looked up, never copied
    - vendor: service
      type: string
      description: service the triggering traffic was classified as (HTTP, HTTPS, SMTP, ...)
      ecs: network.protocol
      status: partial
      notes: >-
        service-object name rather than an observed protocol; needs
        lowercasing and an allow-list before it is trustworthy
    - vendor: direction
      type: enum
      description: >-
        direction of the triggering traffic relative to the firewall
        (incoming, outgoing)
      ecs: network.direction
      status: partial
      transform: >-
        vendor incoming/outgoing must be mapped onto ECS's inbound/outbound
        vocabulary rather than copied
    - vendor: msg
      type: string
      description: human-readable description of the detection
      ecs: message
      status: mapped
    - vendor: attackcontext
      type: string
      description: base64-encoded trigger pattern and packet data captured with the detection
      ecs: null
      status: unmapped
      custom: fortinet.firewall.attackcontext
      notes: >
        unbounded, attacker-controlled base64 payload split across multiple
        records via attackcontextid; the single largest field on the
        technology and the main content-inspection and storage risk. Should be
        a deliberate retain/drop decision, not a default.
    - vendor: logid
      type: string
      description: ten-digit FortiOS log message identifier (0419016384 for IPS signature)
      ecs: event.code
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass through with Persistent Queue backpressure and no low-side
          field extraction, but make attackcontext an explicit decision rather
          than an accident: it is base64 packet capture that can dwarf the
          rest of the record, so either drop it at the worker group or route
          it to a separate lower-retention destination keyed on sessionid.
          Keep _raw end-to-end on this dataset - IDS-class detections are the
          last place to trade forensic fidelity for volume.
        elastic: >
          Parse with the stock UTM pipeline and add a
          logs-fortinet_fortigate.log@custom pipeline that translates the
          critical/high/medium/low/info severity vocabulary into numeric ECS
          event.severity (a different vocabulary from the level field, so it
          needs its own table) and derives event.outcome from the IPS action
          vocabulary, where detected and pass are not failures but dropped,
          reset, block and clear_session are. Add explicit custom-namespace
          keyword mappings for fortinet.firewall.attack and .attackid plus
          long for .incidentserialno so signature-frequency dashboards
          aggregate without dynamic mapping, and keep the signature identity
          out of any ECS threat.* field.
        relay: >
          Low-side instances cross the guard, and this dataset is the
          strongest candidate for keeping _raw across the crossing, but
          attackcontext must be settled with the guard owner first: it is
          base64-encoded trigger patterns and raw packet data, unbounded and
          by definition attacker-controlled, which is exactly the content a
          custom NDJSON filter cannot reason about. Strip or hard-cap it
          low-side before the guard destination. The crossing is at-most-once
          with no acknowledgement, and because IPS volume is low and each
          record is individually significant, per (dataset, hour) count
          reconciliation is the only viable drop detection.
      direct:
        parse_location: high
        cribl: >
          Pass through with Persistent Queue backpressure and let the
          integration parse, but make attackcontext an explicit decision
          rather than an accident: it is base64 packet capture that can dwarf
          the rest of the record, so either drop it at the worker group or
          route it to a separate lower-retention destination keyed on
          sessionid. Keep _raw end-to-end on this dataset - IDS-class
          detections are the last place to trade forensic fidelity for volume.
        elastic: >
          Parse with the stock UTM pipeline and add a
          logs-fortinet_fortigate.log@custom pipeline that translates the
          critical/high/medium/low/info severity vocabulary into numeric ECS
          event.severity (a different vocabulary from the level field, so it
          needs its own table) and derives event.outcome from the IPS action
          vocabulary, where detected and pass are not failures but dropped,
          reset, block and clear_session are. Add explicit custom-namespace
          keyword mappings for fortinet.firewall.attack and .attackid plus
          long for .incidentserialno so signature-frequency dashboards
          aggregate without dynamic mapping, and keep the signature identity
          out of any ECS threat.* field.
  - format: syslog-cef
    enable: >
      Same stream-wide `set format cef` on the syslogd instance; the ips
      subtype is emitted in CEF once the format is set. `config log syslogd
      filter / set utm enable` (or the per-subtype filters) governs whether
      IPS records reach that destination. attackcontext base64 packet capture
      is still controlled by the IPS sensor's packet-logging setting,
      independent of the syslog format.
    references:
    - >-
      https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/998820/fortios-to-cef-log-field-mapping-guidelines
    - >-
      https://docs.fortinet.com/document/fortigate/7.6.3/fortios-log-message-reference/311596/ips-log-support-for-cef
    parsing:
      mechanism: elastic-integration
      artifact: Elastic CEF integration (cef) OR fortinet_fortigate with a CEF pre-parse
      notes: >
        Same two paths as the other subtypes. The IPS-specific @custom work is
        unchanged from the kv form: translate FTNTFGTseverity's critical..info
        vocabulary into numeric event.severity (a DIFFERENT table from
        FTNTFGTlevel's emergency..debug), derive event.outcome from act, and
        keep FTNTFGTattack / FTNTFGTattackid in a custom namespace rather than
        any ECS threat.* field.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass through with Persistent Queue backpressure and no low-side
          field extraction, but make attackcontext an explicit decision: it is
          base64 packet capture that can dwarf the record, so either drop it
          at the worker group or route it to a separate lower-retention
          destination keyed on FTNTFGTsessionid. Keep _raw end-to-end -
          IDS-class detections are the last place to trade forensic fidelity
          for volume.
        elastic: >
          Translate FTNTFGTseverity into numeric event.severity with its own
          table, derive event.outcome from act (detected and pass are
          monitor-only; dropped, reset, block and clear_session are failures),
          add custom keyword mappings for FTNTFGTattack / FTNTFGTattackid and
          long for FTNTFGTincidentserialno so signature-frequency dashboards
          aggregate without dynamic mapping, and lift FTNTFGTref onto
          event.reference.
        relay: >
          Low-side instances cross the guard; this dataset is the strongest
          candidate for keeping _raw across the crossing, but attackcontext
          must be settled with the guard owner first - base64-encoded,
          unbounded, attacker-controlled trigger patterns are exactly what a
          custom NDJSON filter cannot reason about. Strip or hard-cap it
          low-side. Convert CEF to NDJSON low-side; at-most-once crossing; per
          (dataset, hour) reconciliation is the only viable drop detection on
          low-volume, individually-significant records.
      direct:
        parse_location: high
        cribl: >
          High-side instances pass CEF through with Persistent Queue
          backpressure; still make the attackcontext retain/drop decision at
          the core group, but no guard-driven capping is required.
        elastic: >
          Translate FTNTFGTseverity into numeric event.severity with its own
          table, derive event.outcome from act (detected and pass are
          monitor-only; dropped, reset, block and clear_session are failures),
          add custom keyword mappings for FTNTFGTattack / FTNTFGTattackid and
          long for FTNTFGTincidentserialno so signature-frequency dashboards
          aggregate without dynamic mapping, and lift FTNTFGTref onto
          event.reference.
    fields:
    - vendor: src
      type: ip
      description: CEF standard key for srcip - source of the triggering traffic
      ecs: source.ip
      status: mapped
    - vendor: spt
      type: port
      description: CEF standard key for srcport - source port of the triggering traffic
      ecs: source.port
      status: mapped
    - vendor: dst
      type: ip
      description: CEF standard key for dstip - destination of the triggering traffic
      ecs: destination.ip
      status: mapped
    - vendor: dpt
      type: port
      description: CEF standard key for dstport - destination port of the triggering traffic
      ecs: destination.port
      status: mapped
    - vendor: proto
      type: integer
      description: CEF standard key for proto - numeric IANA protocol number
      ecs: network.iana_number
      status: partial
      transform: numeric only; network.transport derived by lookup
    - vendor: app
      type: string
      description: >-
        CEF standard key for app - application classification of the
        triggering traffic (e.g. HTTP)
      ecs: network.application
      status: mapped
    - vendor: act
      type: enum
      description: >-
        CEF standard key for action - sensor disposition (dropped, detected,
        reset, clear_session, block, pass)
      ecs: event.action
      status: mapped
      transform: >
        copied to event.action; event.outcome derived from the same vocabulary
        (detected/pass monitor-only; dropped/reset/block/ clear_session are
        failures)
    - vendor: deviceDirection
      type: enum
      description: >-
        CEF standard key for direction - direction of the triggering traffic
        (0 = inbound, 1 = outbound)
      ecs: network.direction
      status: partial
      transform: >
        CEF emits the numeric 0/1 rather than the kv form's incoming/outgoing
        string, so it must be mapped onto ECS's inbound/outbound vocabulary,
        not copied
    - vendor: request
      type: string
      description: CEF standard key for url - URL/path context of the detection when present
      ecs: url.path
      status: partial
      notes: only present for HTTP-borne detections; absent on non-web signatures
    - vendor: deviceInboundInterface
      type: string
      description: CEF standard key for srcintf - ingress interface name
      ecs: observer.ingress.interface.name
      status: mapped
    - vendor: deviceOutboundInterface
      type: string
      description: CEF standard key for dstintf - egress interface name
      ecs: observer.egress.interface.name
      status: mapped
    - vendor: deviceExternalId
      type: string
      description: >-
        CEF standard key for devid - serial number of the FortiGate that
        raised the detection
      ecs: observer.serial_number
      status: mapped
      notes: >
        the CEF envelope carries the serial, not the hostname - the hostname
        sits in the syslog header and CEF emits no devname extension key.
        Populate observer.name from that header host so this route and the kv
        route, where devname feeds observer.name, carry the same appliance
        name.
    - vendor: msg
      type: string
      description: CEF standard key for msg - human-readable detection description
      ecs: message
      status: mapped
    - vendor: FTNTFGTlogid
      type: string
      description: >-
        ten-digit FortiOS log id (0419016384 for IPS signature); also the CEF
        signatureId
      ecs: event.code
      status: mapped
    - vendor: FTNTFGTattack
      type: string
      description: name of the IPS signature that matched (e.g. Eicar.Virus.Test.File)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.attack
      notes: >
        detection-rule identity with no correct ECS home here - not rule.name
        (rule.id is the policy id and rule.ruleset the sensor name, so a
        signature name under rule.* would mislead) and not threat.indicator.*
        (which models intel-provider indicators)
    - vendor: FTNTFGTattackid
      type: integer
      description: numeric FortiGuard signature id for the matched attack
      ecs: null
      status: unmapped
      custom: fortinet.firewall.attackid
      notes: >-
        the stable join key to the FortiGuard encyclopedia; signature names
        are renamed between releases
    - vendor: FTNTFGTseverity
      type: enum
      description: severity the IPS sensor assigned (critical, high, medium, low, info)
      ecs: event.severity
      status: partial
      transform: >
        string values need a lookup into ECS's numeric event.severity scale;
        this is a DIFFERENT vocabulary from FTNTFGTlevel (emergency..debug) on
        the same record, so the two must not share a table
    - vendor: FTNTFGTlevel
      type: enum
      description: FortiOS log priority for the detection (alert, warning, ...)
      ecs: log.level
      status: partial
      notes: >-
        emergency..debug vocabulary; numeric event.severity uses the shared
        level table, not the IPS severity table
    - vendor: FTNTFGTprofile
      type: string
      description: IPS sensor that produced the detection
      ecs: rule.ruleset
      status: mapped
    - vendor: FTNTFGTpolicyid
      type: integer
      description: firewall policy the IPS sensor was attached to
      ecs: rule.id
      status: mapped
    - vendor: FTNTFGTref
      type: string
      description: FortiGuard encyclopedia URL for the matched signature
      ecs: event.reference
      status: mapped
    - vendor: FTNTFGTincidentserialno
      type: long
      description: serial number grouping all records belonging to one detected incident
      ecs: null
      status: unmapped
      custom: fortinet.firewall.incidentserialno
    - vendor: FTNTFGTsrccountry
      type: string
      description: geo-resolved country of the source IP (e.g. Reserved, United States)
      ecs: source.geo.country_name
      status: partial
      notes: >
        FortiOS emits the literal "Reserved" for RFC1918/bogon sources rather
        than omitting the key, so that placeholder must be dropped rather than
        indexed as a country name
    - vendor: cat
      type: string
      description: CEF category, set to the FortiOS type:subtype (utm:ips)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.type
- id: event-vpn
  name: VPN event log
  description: >
    IPsec and SSL-VPN lifecycle events (type=event subtype=vpn, logid
    0101037xxx / 0101039xxx) - phase-1 and phase-2 negotiation, tunnel
    up/down, dial-up client assignment and SSL-VPN login success and failure.
    Lowest-volume, highest per-record value of the four datasets and the
    primary remote-access authentication source on the device.
  event_categories:
  - network
  - authentication
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same syslog stream as the traffic dataset, discriminated on
        type/subtype.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (the __syslogout internal
        field carrying a CEF-structured string), being retired; plan of
        record: Cribl HTTP Destination -> guard -> Cribl HTTP Source carrying
        NDJSON. The high side parses _raw (Extract JSON) then adds Cribl
        fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-fortinet_fortigate.log
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same syslog stream as the traffic dataset, discriminated on
        type/subtype.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-fortinet_fortigate.log
  formats:
  - format: syslog-kv
    recommended: true
    recommended_because: >-
      the FortiGate key-value format is what the fortinet_fortigate
      integration parses; `set format cef` is stream-wide, so it would flip
      every FortiGate dataset onto the generic CEF integration at once.
    parsing:
      mechanism: elastic-integration
      artifact: Fortinet FortiGate integration (fortinet_fortigate)
    fields:
    - vendor: action
      type: enum
      description: >-
        VPN lifecycle action (tunnel-up, tunnel-down, tunnel-stats, negotiate,
        install_sa, ssl-login-fail, ssl-new-con)
      ecs: event.action
      status: mapped
      transform: >
        copied verbatim; event.outcome has to be derived from this plus the
        result/status fields - tunnel-up and successful logins are successes,
        ssl-login-fail and a status of negotiate_error are failures, and
        tunnel-stats is neither
    - vendor: remip
      type: ip
      description: IP address of the remote VPN peer or dial-up client
      ecs: source.ip
      status: partial
      transform: >
        the integration first renames remip to destination.ip and then swaps
        the whole source and destination objects when subtype=vpn, so the
        client ends up on source.ip. Any replacement parser must reproduce the
        swap explicitly or remote-access logins arrive with the client as the
        destination.
    - vendor: locip
      type: ip
      description: IP address on the FortiGate that terminated the tunnel or listener
      ecs: destination.ip
      status: partial
      notes: >-
        subject to the same subtype=vpn source/destination swap as remip; it
        is the firewall side of the connection, not a flow destination
    - vendor: remport
      type: port
      description: port on the remote peer (500/4500 for IPsec, ephemeral for SSL-VPN)
      ecs: source.port
      status: partial
    - vendor: locport
      type: port
      description: port on the FortiGate that terminated the connection
      ecs: destination.port
      status: partial
    - vendor: user
      type: string
      description: username associated with the VPN event
      ecs: source.user.name
      status: partial
      notes: >
        emitted as the literal "N/A" rather than omitted when no identity
        applies (site-to-site tunnels), so the placeholder must be dropped
        before indexing
    - vendor: xauthuser
      type: string
      description: IPsec XAuth username for dial-up clients
      ecs: source.user.name
      status: partial
      notes: >
        the integration copies this to source.user.name only when it is
        non-null, so a record can carry both user and xauthuser; the
        precedence rule needs to be explicit rather than last-writer-wins, and
        the "N/A" placeholder dropped here too
    - vendor: group
      type: string
      description: user group the authenticated VPN user belongs to
      ecs: source.user.group.name
      status: mapped
    - vendor: assignip
      type: ip
      description: >-
        IP address the FortiGate assigned to the dial-up client from the VPN
        address pool
      ecs: null
      status: unmapped
      custom: fortinet.firewall.assignip
      notes: >
        the address the client will appear as in subsequent traffic logs, so
        it is the join key between a VPN login and that user's later sessions.
        Deliberately not client.ip - ECS client.* models the connection
        initiator, and this is an address allocated to it.
    - vendor: tunnelid
      type: long
      description: identifier of the VPN tunnel instance
      ecs: null
      status: unmapped
      custom: fortinet.firewall.tunnelid
    - vendor: tunneltype
      type: enum
      description: kind of VPN tunnel (ipsec, ssl-web, ssl-tunnel)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.tunneltype
      notes: >-
        separates clientless SSL-VPN portal use from full tunnel and
        site-to-site IPsec; no ECS equivalent and the key discriminator for
        remote-access alerting
    - vendor: vpntunnel
      type: string
      description: configured name of the phase-1 tunnel or SSL-VPN portal
      ecs: null
      status: unmapped
      custom: fortinet.firewall.vpntunnel
    - vendor: logdesc
      type: string
      description: fixed description of the event class (e.g. "IPsec connection status changed")
      ecs: rule.description
      status: partial
      notes: >
        the stock integration renames this to rule.description, but it
        describes the event class rather than any rule; treat it as a stable
        event label (better paired with logid) and expect to move it off
        rule.description if rule.* is ever populated on this subtype
    - vendor: msg
      type: string
      description: human-readable text for the specific event instance
      ecs: message
      status: mapped
    - vendor: duration
      type: integer
      description: tunnel lifetime in seconds, reported on tunnel-down and tunnel-stats records
      ecs: event.duration
      status: partial
      transform: >-
        vendor value is whole seconds; ECS event.duration is nanoseconds, so
        it must be multiplied by 1e9 rather than copied
    - vendor: eventtime
      type: timestamp
      description: >-
        event time as a FortiOS epoch value, in nanoseconds on FortiOS 6.2 and
        later and seconds on older builds
      ecs: event.start
      status: partial
      transform: >
        the integration lands this on event.start and derives @timestamp from
        the separate date/time/tz fields; the epoch unit varies by FortiOS
        version and by whether set log-timestamp-format is configured, so the
        length of the value has to be tested before conversion
    - vendor: logid
      type: string
      description: ten-digit FortiOS log message identifier for the VPN event class
      ecs: event.code
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass through unparsed with Persistent Queue backpressure; the volume
          does not justify low-side extraction. The one job worth doing near
          the source is dropping the literal "N/A" placeholders FortiOS emits
          for absent user, group, xauthuser and tunnelip values, so the
          integration never sees them and no account named N/A appears in
          identity dashboards. Keep _raw end-to-end - this is remote-access
          authentication evidence and the cheapest dataset to retain in full.
        elastic: >
          Parse with the stock event pipeline, but pin the source/destination
          orientation in a logs-fortinet_fortigate.log@custom pipeline: the
          integration deliberately swaps source and destination for
          subtype=vpn so the remote client lands on source.ip, and any
          replacement or supplementary parsing must reproduce that swap or
          every dial-up VPN login will be inverted. Add event.outcome
          derivation over the vpn action vocabulary (tunnel-up and
          ssl-login-success versus ssl-login-fail and the negotiate-error
          results), set event.category to authentication for the login
          actions, and map fortinet.firewall.vpntunnel, .tunneltype and
          .tunnelid plus .assignip as keyword/ip in the custom namespace so
          per-tunnel and per-assigned-address pivots work.
        relay: >
          Low-side instances cross the guard: take the thin-envelope hybrid
          and keep _raw. The records are short, bounded key=value lines with
          no kilobyte-scale or binary content, so this is the least demanding
          of the four crossings for a custom NDJSON content filter. The only
          field needing a cap is the free-text msg/logdesc pair. Because the
          volume is low and each record is individually significant, per
          (dataset, hour) reconciliation between low and high side is both
          cheap and the only way to notice the at-most-once crossing dropping
          a login failure.
      direct:
        parse_location: high
        cribl: >
          Pass through unparsed with Persistent Queue backpressure; the volume
          does not justify parsing ahead of the integration. The one job worth
          doing near the source is dropping the literal "N/A" placeholders
          FortiOS emits for absent user, group, xauthuser and tunnelip values,
          so the integration never sees them and no account named N/A appears
          in identity dashboards. Keep _raw end-to-end - this is remote-access
          authentication evidence and the cheapest dataset to retain in full.
        elastic: >
          Parse with the stock event pipeline, but pin the source/destination
          orientation in a logs-fortinet_fortigate.log@custom pipeline: the
          integration deliberately swaps source and destination for
          subtype=vpn so the remote client lands on source.ip, and any
          replacement or supplementary parsing must reproduce that swap or
          every dial-up VPN login will be inverted. Add event.outcome
          derivation over the vpn action vocabulary (tunnel-up and
          ssl-login-success versus ssl-login-fail and the negotiate-error
          results), set event.category to authentication for the login
          actions, and map fortinet.firewall.vpntunnel, .tunneltype and
          .tunnelid plus .assignip as keyword/ip in the custom namespace so
          per-tunnel and per-assigned-address pivots work.
  - format: syslog-cef
    enable: >
      Same stream-wide `set format cef` on the syslogd instance; the event
      subtype is emitted in CEF once the format is set. `config log syslogd
      filter / set event enable` (and the per-event-subtype filters, e.g. set
      filter "vpn") governs whether VPN lifecycle events reach that
      destination.
    references:
    - >-
      https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/998820/fortios-to-cef-log-field-mapping-guidelines
    - >-
      https://docs.fortinet.com/document/fortigate/7.4.3/fortios-log-message-reference/463430/event-log-support-for-cef
    - >-
      https://docs.fortinet.com/document/fortigate/7.6.0/administration-guide/834425/understanding-vpn-related-logs
    parsing:
      mechanism: elastic-integration
      artifact: Elastic CEF integration (cef) OR fortinet_fortigate with a CEF pre-parse
      notes: >
        Same two paths as the other subtypes. The VPN-specific @custom work is
        unchanged from the kv form: reproduce the subtype=vpn source/
        destination swap (the client belongs on source.ip), derive
        event.outcome from act (tunnel-up / ssl-login-success are successes;
        ssl-login-fail and negotiate-error are not), set event.category to
        authentication for the login actions, and map the tunnel/assigned-ip
        fields into the custom namespace. Because a full VPN CEF body sample
        was not captured, validate the exact FTNTFGT* key spellings against a
        live device before pinning the pipeline.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass through unparsed with Persistent Queue backpressure; the volume
          does not justify low-side extraction. The one job worth doing near
          the source is dropping the literal "N/A" placeholders FortiOS emits
          for absent user, group, xauthuser and tunnelip values so no account
          named N/A appears in identity dashboards. Keep _raw end-to-end -
          this is remote-access authentication evidence and the cheapest
          dataset to retain in full.
        elastic: >
          Reproduce the subtype=vpn source/destination swap in a
          logs-fortinet_fortigate.log@custom pipeline (FTNTFGTremip is the
          remote client and must land on source.ip), derive event.outcome over
          the vpn action vocabulary, set event.category to authentication for
          the login actions, and map FTNTFGTvpntunnel, FTNTFGTtunneltype,
          FTNTFGTtunnelid and FTNTFGTassignip as keyword/ip customs so
          per-tunnel and per-assigned-address pivots work.
        relay: >
          Low-side instances cross the guard: convert CEF to the thin-envelope
          hybrid and keep _raw. The records are short, bounded key=value
          bodies with no kilobyte-scale or binary content, so this is the
          least demanding of the four crossings for a custom NDJSON content
          filter - only the free-text msg/FTNTFGTlogdesc pair needs a length
          cap. At-most-once crossing; per (dataset, hour) reconciliation is
          the only way to notice a dropped login failure on a low-volume,
          individually-significant feed.
      direct:
        parse_location: high
        cribl: >
          High-side instances pass CEF through with Persistent Queue
          backpressure; the only near-source job worth keeping is the "N/A"
          placeholder drop for identity fields.
        elastic: >
          Reproduce the subtype=vpn source/destination swap in a
          logs-fortinet_fortigate.log@custom pipeline (FTNTFGTremip is the
          remote client and must land on source.ip), derive event.outcome over
          the vpn action vocabulary, set event.category to authentication for
          the login actions, and map FTNTFGTvpntunnel, FTNTFGTtunneltype,
          FTNTFGTtunnelid and FTNTFGTassignip as keyword/ip customs so
          per-tunnel and per-assigned-address pivots work.
    fields:
    - vendor: act
      type: enum
      description: >-
        CEF standard key for action - VPN lifecycle action (tunnel-up,
        tunnel-down, tunnel-stats, negotiate, install_sa, ssl-login-fail,
        ssl-new-con)
      ecs: event.action
      status: mapped
      transform: >
        copied to event.action; event.outcome derived from this plus the
        result/status fields (tunnel-up and successful logins are successes,
        ssl-login-fail and negotiate_error are failures, tunnel-stats is
        neither)
    - vendor: msg
      type: string
      description: CEF standard key for msg - human-readable text for the event instance
      ecs: message
      status: mapped
    - vendor: duser
      type: string
      description: CEF standard key for user - username associated with the VPN event
      ecs: source.user.name
      status: partial
      notes: >-
        emitted as the literal "N/A" rather than omitted for site-to-site
        tunnels; drop the placeholder before indexing
    - vendor: deviceExternalId
      type: string
      description: >-
        CEF standard key for devid - serial number of the FortiGate that
        logged the event
      ecs: observer.serial_number
      status: mapped
      notes: >
        the CEF envelope carries the serial, not the hostname - the hostname
        sits in the syslog header and CEF emits no devname extension key.
        Populate observer.name from that header host so this route and the kv
        route, where devname feeds observer.name, carry the same appliance
        name.
    - vendor: FTNTFGTlogid
      type: string
      description: >-
        ten-digit FortiOS log id for the VPN event class (0101037xxx /
        0101039xxx); also the CEF signatureId
      ecs: event.code
      status: mapped
    - vendor: FTNTFGTremip
      type: ip
      description: >-
        IP of the remote VPN peer or dial-up client (native remip,
        FTNTFGT-prefixed - it is not srcip, so it takes no standard CEF key)
      ecs: source.ip
      status: partial
      transform: >
        the client must end up on source.ip via the subtype=vpn swap; any
        parser that leaves it as a destination inverts every remote-access
        login
    - vendor: FTNTFGTlocip
      type: ip
      description: IP on the FortiGate that terminated the tunnel or listener (native locip)
      ecs: destination.ip
      status: partial
      notes: >-
        subject to the same subtype=vpn swap as FTNTFGTremip; it is the
        firewall side, not a flow destination
    - vendor: FTNTFGTxauthuser
      type: string
      description: IPsec XAuth username for dial-up clients
      ecs: source.user.name
      status: partial
      notes: >
        a record can carry both duser and FTNTFGTxauthuser; the precedence
        rule (xauthuser wins when non-null) must be explicit, and the "N/A"
        placeholder dropped here too
    - vendor: FTNTFGTgroup
      type: string
      description: user group the authenticated VPN user belongs to (native group)
      ecs: source.user.group.name
      status: mapped
    - vendor: FTNTFGTassignip
      type: ip
      description: IP the FortiGate assigned to the dial-up client from the VPN pool
      ecs: null
      status: unmapped
      custom: fortinet.firewall.assignip
      notes: >
        the address the client appears as in later traffic logs, so it is the
        join key between a VPN login and that user's sessions; deliberately
        not client.ip
    - vendor: FTNTFGTtunneltype
      type: enum
      description: kind of VPN tunnel (ipsec, ssl-web, ssl-tunnel)
      ecs: null
      status: unmapped
      custom: fortinet.firewall.tunneltype
      notes: >-
        separates clientless SSL-VPN portal use from full tunnel and
        site-to-site IPsec; the key discriminator for remote-access alerting
    - vendor: FTNTFGTtunnelid
      type: long
      description: identifier of the VPN tunnel instance
      ecs: null
      status: unmapped
      custom: fortinet.firewall.tunnelid
    - vendor: FTNTFGTvpntunnel
      type: string
      description: configured name of the phase-1 tunnel or SSL-VPN portal
      ecs: null
      status: unmapped
      custom: fortinet.firewall.vpntunnel
    - vendor: FTNTFGTlogdesc
      type: string
      description: fixed description of the event class (e.g. "IPsec connection status changed")
      ecs: rule.description
      status: partial
      notes: >-
        describes the event class rather than any rule; treat as a stable
        event label paired with logid
    - vendor: FTNTFGTduration
      type: integer
      description: tunnel lifetime in seconds, reported on tunnel-down and tunnel-stats records
      ecs: event.duration
      status: partial
      transform: >-
        vendor value is whole seconds; ECS event.duration is nanoseconds, so
        multiply by 1e9 rather than copy
    - vendor: FTNTFGTlevel
      type: enum
      description: FortiOS log priority for the event (notice, warning, ...)
      ecs: log.level
      status: partial
      notes: emergency..debug vocabulary; numeric event.severity needs the shared lookup
