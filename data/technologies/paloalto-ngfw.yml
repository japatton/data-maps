id: paloalto-ngfw
name: Palo Alto NGFW
vendor: Palo Alto Networks
versions: PAN-OS 10.2, PAN-OS 11.1
draft: true
references:
- >-
  https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions
- https://cribl.io/packs/cribl-pack-for-palo-alto-networks/
datasets:
- id: traffic
  name: Traffic log
  description: >
    Session summary records emitted at session close (and optionally at start)
    for every allowed and denied session traversing the firewall.
  event_categories:
  - network
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: Receives syslog-csv over TCP from the PAN-OS syslog forwarding profile.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        allow-list on logs-panw.traffic destination data stream only; no
        free-text fields above the field's declared length cross the boundary
        unfiltered
      notes: >
        Session records must pass content inspection before leaving the
        enclave. Crossing transport is confirmed: TODAY the low-side Cribl
        ships through a Cribl Syslog Destination, using the __syslogout
        internal field whose value is a CEF-structured string, and the
        high-side Cribl receives each message as _raw containing a JSON object
        string, runs a Parser function (Extract JSON) over _raw, adds Cribl
        fields and ships to Routes. That syslog/CEF leg is being retired.
        PLANNED and confirmed as the plan of record: low-side Cribl HTTP
        Destination -> guard -> high-side Cribl HTTP Source carrying NDJSON.
    - hop: cribl
      location: core worker group, Elastic side
      notes: >-
        re-applies the Cribl Pack for final field normalization before the
        Elastic Bulk destination
    - hop: elastic
      data_stream: logs-panw.traffic
    direct:
    - hop: cribl
      location: edge Cribl worker group
      notes: Receives syslog-csv over TCP from the PAN-OS syslog forwarding profile.
    - hop: cribl
      location: core worker group, Elastic side
      notes: >-
        re-applies the Cribl Pack for final field normalization before the
        Elastic Bulk destination
    - hop: elastic
      data_stream: logs-panw.traffic
  formats:
  - format: syslog-csv
    recommended: true
    recommended_because: >-
      PAN-OS CSV is the native log format and the Elastic panw integration
      parses it as delivered; CEF requires pasting a custom template per log
      type and moves parsing into a Cribl pack, and its larger inventory here
      reflects research depth rather than fields CSV lacks.
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks
      notes: >
        Field extraction is being migrated off the legacy ArcSight-era CEF
        templates (pre-Cribl SIEM) onto this pack's native CSV positional
        parser; a handful of pipelines still reference the old CEF field names
        and need to be reverted/retired as datasets are re-mapped.
    fields:
    - vendor: src
      type: ip
      description: original session source IP address
      ecs: source.ip
      status: mapped
    - vendor: dst
      type: ip
      description: original session destination IP address
      ecs: destination.ip
      status: mapped
    - vendor: natsrc
      type: ip
      description: post-NAT source IP address when source NAT was performed
      ecs: source.nat.ip
      status: mapped
    - vendor: natdst
      type: ip
      description: post-NAT destination IP address when destination NAT was performed
      ecs: destination.nat.ip
      status: mapped
    - vendor: sport
      type: port
      description: source port utilized by the session
      ecs: source.port
      status: mapped
    - vendor: dport
      type: port
      description: destination port utilized by the session
      ecs: destination.port
      status: mapped
    - vendor: natsport
      type: port
      description: post-NAT source port
      ecs: source.nat.port
      status: mapped
    - vendor: natdport
      type: port
      description: post-NAT destination port
      ecs: destination.nat.port
      status: mapped
    - vendor: proto
      type: string
      description: IP protocol associated with the session (tcp, udp, icmp, ...)
      ecs: network.transport
      status: mapped
    - vendor: action
      type: enum
      description: action the security policy took on the session
      ecs: event.action
      status: mapped
      transform: >
        PAN-OS action values (allow/deny/drop/reset-client/reset-server/
        reset-both) are copied to event.action verbatim and also drive a
        downstream Cribl lookup that sets event.outcome to success/failure;
        there is no separate vendor column for outcome.
    - vendor: rule
      type: string
      description: name of the security rule the session matched
      ecs: rule.name
      status: mapped
    - vendor: srcuser
      type: string
      description: username of the user who initiated the session
      ecs: source.user.name
      status: mapped
    - vendor: dstuser
      type: string
      description: username of the user to which the session was destined
      ecs: destination.user.name
      status: mapped
    - vendor: app
      type: string
      description: App-ID application associated with the session
      ecs: network.application
      status: mapped
    - vendor: bytes
      type: bytes
      description: total bytes (transmit and receive) for the session
      ecs: network.bytes
      status: mapped
    - vendor: bytes_sent
      type: bytes
      description: bytes in the client-to-server direction
      ecs: source.bytes
      status: mapped
    - vendor: bytes_received
      type: bytes
      description: bytes in the server-to-client direction
      ecs: destination.bytes
      status: mapped
    - vendor: packets
      type: long
      description: total packets (transmit and receive) for the session
      ecs: network.packets
      status: mapped
    - vendor: device_name
      type: string
      description: hostname of the firewall on which the session was logged
      ecs: observer.name
      status: mapped
    - vendor: sessionid
      type: long
      description: internal numerical identifier applied to each session
      ecs: null
      status: unmapped
      custom: panw.panos.session_id
      notes: >-
        firewall-local session identifier; no ECS equivalent, kept as a custom
        field for cross-referencing traffic/threat pairs
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Finish the cut from the ArcSight-era CEF templates to the pack's
          native CSV positional parser on the edge worker group and retire the
          pipelines still keyed on the old CEF field names, emitting
          ECS-shaped JSON with the NAT address/port pairs and the directional
          byte and packet counters already split out. Run the action-driven
          event.outcome lookup and the interface-to-site / device-to-owner
          enrichment here where it is cheapest, then validate against a Schema
          Library schema (C.Schema(...).validate) immediately before the guard
          destination, with a dead-letter route for validation failures and
          Persistent Queue backpressure (never Block) on that destination.
          Drop _raw on this route first - it is the highest-volume and
          lowest-forensic-value of the four datasets.
        elastic: >
          Take the pre-shaped documents into logs-panw.traffic and keep
          high-side work to the pack's final normalization pass rather than a
          second full parse. Add a custom-namespace keyword mapping for
          panw.panos.session_id so the traffic/threat cross-reference queries
          resolve, and assert in the index template that event.outcome is
          populated for every action value the low-side lookup can emit.
        relay: >
          Full ECS-shaped JSON crosses the guard - not CEF, not raw syslog CSV
          - because the guard's per-field length policy needs field-aware
          records that a thin envelope cannot provide. Enforce the declared
          length caps low-side (rule names, App-ID values, usernames) and hold
          the JSON to two levels of nesting with short ASCII keys and bounded
          string lengths so content inspection stays deterministic. Treat the
          crossing as at-most-once and detect silent drops by reconciling
          low-side and high-side session counts per hour, not by
          acknowledgement. Transport is settled, so build against it rather
          than around it: the confirmed plan of record is a low-side Cribl
          HTTP Destination to a high-side Cribl HTTP Source carrying this
          NDJSON, replacing the current Cribl Syslog Destination leg (a
          CEF-structured __syslogout value, unpacked high-side from _raw by an
          Extract JSON parser before Cribl fields and Routes). An
          AST/file-drop crossing is no longer a co-equal candidate - keep it
          only as a replay-capable fallback if a missed window ever has to be
          re-sent.
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard. Finish the cut from the
          ArcSight-era CEF templates to the pack's native CSV positional
          parser on the edge worker group and retire the pipelines still keyed
          on the old CEF field names, emitting ECS-shaped JSON with the NAT
          address/port pairs and the directional byte and packet counters
          already split out. Run the action-driven event.outcome lookup and
          the interface-to-site / device-to-owner enrichment here where it is
          cheapest, then validate against a Schema Library schema
          (C.Schema(...).validate) with a dead-letter route for validation
          failures and Persistent Queue backpressure (never Block) on the
          onward Elastic destination. No guard-driven content capping is
          needed on this path. Drop _raw on this route first - it is the
          highest-volume and lowest-forensic-value of the four datasets.
        elastic: >
          Take the pre-shaped documents into logs-panw.traffic and keep
          high-side work to the pack's final normalization pass rather than a
          second full parse. Add a custom-namespace keyword mapping for
          panw.panos.session_id so the traffic/threat cross-reference queries
          resolve, and assert in the index template that event.outcome is
          populated for every action value the edge lookup can emit.
  - format: syslog-cef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      Traffic: paste the vendor Traffic CEF template (CEF:0|Palo Alto
      Networks|PAN-OS|$sender_sw_version|$subtype|$type|1|
      rt=$cef-formatted-receive_time deviceExternalId=$serial src=$src
      dst=$dst ... act=$action ...). The Custom Log Format is per log type, so
      selecting CEF for Traffic does NOT change Threat/System/Config on the
      same profile - each has its own tab. Attach the profile under Objects >
      Log Forwarding and reference it from the security rules whose sessions
      should be forwarded. Transport is UDP/TCP/SSL syslog on the profile's
      server entry.
    references:
    - >-
      https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-10-0-cef-configuration-guide.pdf
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/network-logs/network-traffic-log/network-traffic-cef-fields
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-external-services-for-monitoring/configure-syslog-monitoring
    parsing:
      mechanism: cribl-pack
      artifact: >-
        Cribl Pack for Palo Alto Networks (CEF pre-parse) OR Elastic CEF
        integration (data stream logs-cef.log)
      notes: >
        The pack's native parser is written against the CSV positional line
        and will not decode the CEF envelope as-is. Two viable paths: (a) run
        a Cribl CEF/KV parser to lift the standard keys onto ECS
        (src->source.ip, etc.) and re-key the PanOS* extensions onto the same
        ECS/custom targets the CSV map uses; or (b) send to the generic
        Elastic CEF integration, which lands standard keys on ECS and the
        PanOS* extensions under cef.extensions.* for an @custom pipeline to
        promote. CEF does NOT pre-resolve the action-driven event.outcome or
        the seconds->nanoseconds event.duration, so the same normalizations
        the CSV form needs still apply. Note the `cat` slot here carries
        $action_source, NOT a category - a trap for CEF parsers reused from
        other vendors.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the CEF low-side into the same ECS NDJSON the CSV route emits
          so exactly one downstream shape exists regardless of which format an
          instance is configured for. Split the directional counters (CEF
          `in`=$bytes_received -> destination.bytes, `out`=$bytes_sent ->
          source.bytes - the in/out naming is inverted relative to intuition,
          so map by the documented variable, not the key word), run the
          action-driven event.outcome lookup and the interface-to-site /
          device-to-owner enrichment here where it is cheapest, and validate
          against a Schema Library schema with a dead-letter route and
          Persistent Queue backpressure ahead of the guard destination. Drop
          _raw first on this route - highest volume, lowest per-record
          forensic value of the four datasets.
        elastic: >
          Take pre-shaped documents into logs-panw.traffic and keep high-side
          work to a final normalization pass. Add a custom keyword mapping for
          panw.panos.session_id so the traffic/threat cross-reference
          resolves, map the CEF zone slots (cs4/cs5) into the custom
          namespace, and assert event.outcome is populated for every act value
          the low-side lookup can emit.
        relay: >
          Full ECS-shaped NDJSON crosses the guard - not the CEF string. The
          plan-of-record crossing is the low-side Cribl HTTP Destination to a
          high-side Cribl HTTP Source carrying NDJSON, and a CEF line is a
          second-class, quote-fragile envelope a content filter cannot reason
          about deterministically. Enforce the declared length caps on rule
          names, App-ID and usernames low-side and hold the JSON to two levels
          of nesting with short ASCII keys. At-most-once crossing; reconcile
          low-side and high-side session counts per (dataset, hour) rather
          than by acknowledgement.
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard: still convert CEF to ECS NDJSON
          at the edge worker group (path a) or hand to the CEF integration
          (path b) with Persistent Queue backpressure. No guard-driven content
          capping is needed on this path, but the same directional byte split
          and outcome lookup apply.
        elastic: >
          Take pre-shaped documents into logs-panw.traffic and keep high-side
          work to a final normalization pass. Add a custom keyword mapping for
          panw.panos.session_id so the traffic/threat cross-reference
          resolves, map the CEF zone slots (cs4/cs5) into the custom
          namespace, and assert event.outcome is populated for every act value
          the edge lookup can emit - none of these are CEF-native.
    fields:
    - vendor: src
      type: ip
      description: CEF standard key for $src - original session source IP
      ecs: source.ip
      status: mapped
    - vendor: dst
      type: ip
      description: CEF standard key for $dst - original session destination IP
      ecs: destination.ip
      status: mapped
    - vendor: sourceTranslatedAddress
      type: ip
      description: CEF standard key for $natsrc - post-NAT source IP
      ecs: source.nat.ip
      status: mapped
    - vendor: destinationTranslatedAddress
      type: ip
      description: CEF standard key for $natdst - post-NAT destination IP
      ecs: destination.nat.ip
      status: mapped
    - vendor: spt
      type: port
      description: CEF standard key for $sport - source port
      ecs: source.port
      status: mapped
    - vendor: dpt
      type: port
      description: CEF standard key for $dport - destination port
      ecs: destination.port
      status: mapped
    - vendor: sourceTranslatedPort
      type: port
      description: CEF standard key for $natsport - post-NAT source port
      ecs: source.nat.port
      status: mapped
    - vendor: destinationTranslatedPort
      type: port
      description: CEF standard key for $natdport - post-NAT destination port
      ecs: destination.nat.port
      status: mapped
    - vendor: proto
      type: string
      description: CEF standard key for $proto - IP protocol (tcp, udp, icmp)
      ecs: network.transport
      status: mapped
    - vendor: act
      type: enum
      description: CEF standard key for $action - security-policy action on the session
      ecs: event.action
      status: mapped
      transform: >
        copied to event.action verbatim (allow/deny/drop/reset-*) and also
        drives the downstream event.outcome lookup; CEF has no separate
        outcome key
    - vendor: cs1
      type: string
      description: labelled Rule - CEF cs1=$rule, name of the matched security rule
      ecs: rule.name
      status: mapped
    - vendor: suser
      type: string
      description: CEF standard key for $srcuser - source username
      ecs: source.user.name
      status: mapped
    - vendor: duser
      type: string
      description: CEF standard key for $dstuser - destination username
      ecs: destination.user.name
      status: mapped
    - vendor: app
      type: string
      description: CEF standard key for $app - App-ID application
      ecs: network.application
      status: mapped
    - vendor: flexNumber1
      type: bytes
      description: labelled Total bytes - CEF flexNumber1=$bytes, total session bytes
      ecs: network.bytes
      status: mapped
    - vendor: in
      type: bytes
      description: CEF standard key carrying $bytes_received - server-to-client bytes
      ecs: destination.bytes
      status: mapped
      notes: >
        PAN-OS assigns bytes_received to CEF `in`; map by the documented
        variable, not the key word, because the in/out labels read backwards
        here. The vendor guide contradicts itself on this pair - the Traffic
        template line reads `in=$bytes_received out=$bytes_sent` while the
        same guide's CEF key-reference table still prints `in / bytesIn /
        $bytes_sent` - so confirm the pairing against a live device before
        pinning the pipeline. The Cortex Data Lake traffic CEF field table
        agrees with the template line
    - vendor: out
      type: bytes
      description: CEF standard key carrying $bytes_sent - client-to-server bytes
      ecs: source.bytes
      status: mapped
      notes: >
        PAN-OS assigns bytes_sent to CEF `out`; the same guide's key-reference
        table still prints `out / bytesOut / $bytes_received` against its own
        template line, so confirm this against a live device together with the
        `in` pair
    - vendor: cn2
      type: long
      description: labelled Packets - CEF cn2=$packets, total session packets
      ecs: network.packets
      status: mapped
    - vendor: PanOSPacketsSent
      type: long
      description: $pkts_sent - client-to-server packets
      ecs: source.packets
      status: mapped
    - vendor: PanOSPacketsReceived
      type: long
      description: $pkts_received - server-to-client packets
      ecs: destination.packets
      status: mapped
    - vendor: cn3
      type: long
      description: labelled Elapsed time in seconds - CEF cn3=$elapsed, session duration in seconds
      ecs: event.duration
      status: partial
      transform: >-
        vendor value is whole seconds; ECS event.duration is nanoseconds, so
        multiply by 1e9 rather than copy
    - vendor: start
      type: timestamp
      description: >-
        CEF start=$cef-formatted-time_generated - dataplane generation time of
        the session record
      ecs: '@timestamp'
      status: partial
      transform: >-
        the $cef-formatted-* variables render MMM dd yyyy HH:mm:ss - an
        explicit date but no offset - so the value is device-local and needs
        the same per-device timezone from the inventory enrichment the sibling
        CEF forms apply before it becomes @timestamp. This is the only
        event-time source in this format's inventory, which carries no rt=
        key. The key name is the CEF standard slot for a start time but the
        vendor template feeds it the generation time, so event.start stays
        unset unless the custom template is extended with $start
    - vendor: deviceInboundInterface
      type: string
      description: $inbound_if - ingress interface name
      ecs: observer.ingress.interface.name
      status: mapped
    - vendor: deviceOutboundInterface
      type: string
      description: $outbound_if - egress interface name
      ecs: observer.egress.interface.name
      status: mapped
    - vendor: dvchost
      type: string
      description: $device_name - hostname of the firewall that logged the session
      ecs: observer.name
      status: mapped
    - vendor: deviceExternalId
      type: string
      description: $serial - firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: PanOSRuleUUID
      type: string
      description: $rule_uuid - UUID of the matched security rule (stable across renames)
      ecs: rule.uuid
      status: mapped
    - vendor: cn1
      type: long
      description: labelled SessionID - CEF cn1=$sessionid, firewall-local session identifier
      ecs: null
      status: unmapped
      custom: panw.panos.session_id
      notes: the join key to the threat dataset; map as keyword, not dynamic
    - vendor: cs3
      type: string
      description: labelled Virtual System - CEF cs3=$vsys, vsys that processed the session
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
    - vendor: cs4
      type: string
      description: labelled Source Zone - CEF cs4=$from, ingress security zone
      ecs: null
      status: unmapped
      custom: panw.panos.source_zone
    - vendor: cs5
      type: string
      description: labelled Destination Zone - CEF cs5=$to, egress security zone
      ecs: null
      status: unmapped
      custom: panw.panos.destination_zone
    - vendor: reason
      type: string
      description: >-
        CEF reason=$session_end_reason - why the session closed (aged-out,
        tcp-fin, policy-deny, threat, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.session_end_reason
    - vendor: cat
      type: string
      description: >-
        CEF cat=$action_source - what determined the action (from-policy,
        from-application, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.action_source
      notes: >
        the CEF `cat` slot carries action_source, NOT a category - do not feed
        it to any category parser reused from another vendor
  - format: syslog-leef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      Traffic: paste the vendor LEEF 2.0 Traffic template (LEEF:2.0|Palo Alto
      Networks|PAN-OS|<ver>|<eventid>| ... src=$src dst=$dst srcPort=$sport
      dstPort=$dport proto=$proto ...). As with CEF the Custom Log Format is
      per log type. This is the format Palo Alto's QRadar app expects, so it
      is the natural alternate anywhere a LEEF-native collector already
      exists.
    references:
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/network-logs/network-traffic-log/network-traffic-leef-fields
    - >-
      https://knowledgebase.paloaltonetworks.com/KCSArticleDetail?id=kA10g000000ClEcCAK
    - >-
      https://www.ibm.com/docs/en/security-qradar/log-insights/saas?topic=panps-configuring-syslog-leef-events-your-palo-alto-pa-series-device
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (LEEF pre-parse) OR Elastic CEF/LEEF handling
      notes: >
        LEEF is a tab/caret-delimited key=value body after the LEEF header; a
        KV parser lifts the keys, then they re-key onto the same ECS/custom
        targets as the CSV map. The Elastic fortinet-style CEF integration
        does not read LEEF, so Cribl (or a QRadar-side re-export) is the
        practical parser. Same post-parse normalizations as the other forms:
        action-driven outcome, seconds->ns duration, session_id keyword.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse LEEF to the same ECS NDJSON as the CSV/CEF routes at the edge
          worker group - the goal is one downstream shape, so no dataset needs
          a per-format high-side pipeline. Split srcBytes/dstBytes to
          source.bytes/destination.bytes, run the outcome lookup and the
          site/owner enrichment near the source, and validate against a Schema
          Library schema with a dead-letter route and Persistent Queue
          backpressure ahead of the guard destination. Drop _raw first, as on
          the CSV/CEF traffic routes.
        elastic: >
          Land the pre-shaped documents in logs-panw.traffic with the
          session_id keyword mapping and the zone customs, and keep high-side
          work to the final normalization pass rather than re-parsing LEEF.
        relay: >
          NDJSON crosses the guard, never the LEEF line. Enforce the field
          length caps low-side and hold the JSON to two nesting levels with
          short ASCII keys. At-most-once crossing; reconcile counts per
          (dataset, hour).
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard but still normalize LEEF to ECS
          NDJSON at the edge with Persistent Queue backpressure; no
          guard-driven capping needed.
        elastic: >
          Land the pre-shaped documents in logs-panw.traffic with the
          session_id keyword mapping and the zone customs, and keep high-side
          work to the final normalization pass rather than re-parsing LEEF.
    fields:
    - vendor: src
      type: ip
      description: LEEF src=$src - original session source IP
      ecs: source.ip
      status: mapped
    - vendor: dst
      type: ip
      description: LEEF dst=$dst - original session destination IP
      ecs: destination.ip
      status: mapped
    - vendor: srcPort
      type: port
      description: LEEF srcPort=$sport - source port
      ecs: source.port
      status: mapped
    - vendor: dstPort
      type: port
      description: LEEF dstPort=$dport - destination port
      ecs: destination.port
      status: mapped
    - vendor: srcPostNAT
      type: ip
      description: LEEF srcPostNAT=$natsrc - post-NAT source IP
      ecs: source.nat.ip
      status: mapped
    - vendor: dstPostNAT
      type: ip
      description: LEEF dstPostNAT=$natdst - post-NAT destination IP
      ecs: destination.nat.ip
      status: mapped
    - vendor: srcPostNATPort
      type: port
      description: LEEF srcPostNATPort=$natsport - post-NAT source port
      ecs: source.nat.port
      status: mapped
    - vendor: dstPostNATPort
      type: port
      description: LEEF dstPostNATPort=$natdport - post-NAT destination port
      ecs: destination.nat.port
      status: mapped
    - vendor: proto
      type: string
      description: LEEF proto=$proto - IP protocol
      ecs: network.transport
      status: mapped
    - vendor: EventID
      type: enum
      description: LEEF header EventID carrying $action - the session action
      ecs: event.action
      status: mapped
      transform: >
        LEEF puts the action in the header EventID slot; copy to event.action
        and derive event.outcome from it, same as the other forms
    - vendor: Rule
      type: string
      description: LEEF Rule=$rule - matched security rule name
      ecs: rule.name
      status: mapped
    - vendor: usrName
      type: string
      description: LEEF usrName=$srcuser - source username
      ecs: source.user.name
      status: mapped
    - vendor: DestinationUser
      type: string
      description: LEEF DestinationUser=$dstuser - destination username
      ecs: destination.user.name
      status: mapped
    - vendor: Application
      type: string
      description: LEEF Application=$app - App-ID application
      ecs: network.application
      status: mapped
    - vendor: srcBytes
      type: bytes
      description: LEEF srcBytes=$bytes_sent - client-to-server bytes
      ecs: source.bytes
      status: mapped
    - vendor: dstBytes
      type: bytes
      description: LEEF dstBytes=$bytes_received - server-to-client bytes
      ecs: destination.bytes
      status: mapped
    - vendor: Bytes
      type: bytes
      description: LEEF Bytes=$bytes - total session bytes
      ecs: network.bytes
      status: mapped
    - vendor: totalPackets
      type: long
      description: LEEF totalPackets=$packets - total session packets
      ecs: network.packets
      status: mapped
    - vendor: srcPackets
      type: long
      description: LEEF srcPackets=$pkts_sent - client-to-server packets
      ecs: source.packets
      status: mapped
    - vendor: dstPackets
      type: long
      description: LEEF dstPackets=$pkts_received - server-to-client packets
      ecs: destination.packets
      status: mapped
    - vendor: SessionDuration
      type: long
      description: LEEF SessionDuration=$elapsed - session duration in seconds
      ecs: event.duration
      status: partial
      transform: whole seconds; multiply by 1e9 for ECS event.duration nanoseconds
    - vendor: InboundInterface
      type: string
      description: LEEF InboundInterface=$inbound_if - ingress interface name
      ecs: observer.ingress.interface.name
      status: mapped
    - vendor: OutboundInterface
      type: string
      description: LEEF OutboundInterface=$outbound_if - egress interface name
      ecs: observer.egress.interface.name
      status: mapped
    - vendor: DeviceName
      type: string
      description: LEEF DeviceName=$device_name - firewall hostname
      ecs: observer.name
      status: mapped
    - vendor: DeviceSN
      type: string
      description: LEEF DeviceSN=$serial - firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: RuleUUID
      type: string
      description: LEEF RuleUUID=$rule_uuid - UUID of the matched security rule
      ecs: rule.uuid
      status: mapped
    - vendor: SessionID
      type: long
      description: LEEF SessionID=$sessionid - firewall-local session identifier
      ecs: null
      status: unmapped
      custom: panw.panos.session_id
      notes: join key to the threat dataset; map as keyword
    - vendor: VirtualLocation
      type: string
      description: LEEF VirtualLocation=$vsys - virtual system
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
    - vendor: FromZone
      type: string
      description: LEEF FromZone=$from - ingress security zone
      ecs: null
      status: unmapped
      custom: panw.panos.source_zone
    - vendor: ToZone
      type: string
      description: LEEF ToZone=$to - egress security zone
      ecs: null
      status: unmapped
      custom: panw.panos.destination_zone
    - vendor: SessionEndReason
      type: string
      description: LEEF SessionEndReason=$session_end_reason - why the session closed
      ecs: null
      status: unmapped
      custom: panw.panos.session_end_reason
  - format: json
    enable: >
      Device > Server Profiles > HTTP: define an HTTP(S) server entry, then on
      the Payload Format tab pick Traffic and build a JSON payload mapping
      each attribute to a PAN-OS field variable (e.g.
      {"src":"$src","dst":"$dst","spt":"$sport","dpt":"$dport",
      "action":"$action","rule":"$rule","app":"$app",...}). Reference the HTTP
      profile from a Log Forwarding Profile (Objects > Log Forwarding) match
      list for the Traffic log type. PAN-OS POSTs one JSON object per record;
      TLS and client-cert options live on the server entry. The attribute set
      is the same field-variable catalog the CSV/CEF/LEEF forms draw from -
      only the transport (HTTP) and container (JSON) differ.
    references:
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/forward-logs-to-an-https-destination
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/log-types-and-severity-levels/traffic-logs
    parsing:
      mechanism: cribl-pipeline
      artifact: Cribl HTTP Source + JSON Parser, emitting to logs-panw.traffic
      notes: >
        Because the payload is already JSON, a Cribl HTTP Source with an
        Extract JSON function reads it directly - no positional or CEF/LEEF
        key parsing. The keys are whatever the payload template named them, so
        pin the template and the pipeline together. Field-to-ECS mapping is
        identical to the CSV route once the keys are known; the inventory is
        left open here because it is operator-defined rather than
        vendor-fixed.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          This is the closest native match to the plan-of-record crossing: the
          firewall already emits JSON, so the low-side job is to conform the
          admin-chosen keys to the shared ECS NDJSON shape (rename to
          ECS/custom targets, split directional counters, run the outcome
          lookup) rather than parse a delimited line. Pin the payload template
          in change control so a key rename cannot silently break the
          pipeline. Validate against a Schema Library schema with a
          dead-letter route and Persistent Queue backpressure ahead of the
          guard destination.
        elastic: >
          Land in logs-panw.traffic with the session_id keyword mapping; keep
          high-side work to a normalization pass, same as the CSV route.
        relay: >
          NDJSON crosses the guard - conform the firewall's JSON to the same
          two-level, short-ASCII-key envelope every other dataset uses so the
          content filter sees one schema. Cap free-text field lengths
          low-side. At-most-once crossing; reconcile counts per (dataset,
          hour).
      direct:
        parse_location: low
        cribl: >
          High-side instances receive the JSON on a Cribl HTTP Source and
          conform keys to ECS with Persistent Queue backpressure; no
          guard-driven capping required.
        elastic: >
          Land in logs-panw.traffic with the session_id keyword mapping; keep
          high-side work to a normalization pass, same as the CSV route.
    fields_omitted: >
      The keys are whatever the operator names them in the firewall's HTTP
      Payload Format template for Traffic, so the inventory is
      operator-defined rather than vendor-fixed; the template draws on the
      same PAN-OS traffic field-variable catalog as the CSV, CEF and LEEF
      forms, and the ECS mapping is the one the syslog-csv entry documents.
    fields: []
- id: threat
  name: Threat log
  description: >
    Emitted when a Content-ID/App-ID security profile (antivirus,
    vulnerability protection, anti-spyware, URL filtering, WildFire, etc.)
    matches traffic already summarized in a traffic-log session.
  event_categories:
  - network
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
    - hop: guard
      device: Everfox High Speed Guard
      constraints: allow-list on logs-panw.threat destination data stream only
      notes: >
        Same confirmed crossing as the traffic route: current transport is a
        Cribl Syslog Destination on the __syslogout internal field carrying a
        CEF-structured string, with the high side parsing _raw through Extract
        JSON before Cribl fields and Routes; that leg is being retired in
        favour of the confirmed plan of record, a low-side Cribl HTTP
        Destination to a high-side Cribl HTTP Source carrying NDJSON.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-panw.threat
    direct:
    - hop: cribl
      location: edge Cribl worker group
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-panw.threat
  formats:
  - format: syslog-csv
    recommended: true
    recommended_because: >-
      PAN-OS CSV is the native log format and the Elastic panw integration
      parses it as delivered; CEF requires pasting a custom template per log
      type and moves parsing into a Cribl pack, and its larger inventory here
      reflects research depth rather than fields CSV lacks.
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks
    fields:
    - vendor: src
      type: ip
      description: original session source IP address
      ecs: source.ip
      status: mapped
    - vendor: dst
      type: ip
      description: original session destination IP address
      ecs: destination.ip
      status: mapped
    - vendor: sport
      type: port
      description: source port utilized by the session
      ecs: source.port
      status: mapped
    - vendor: dport
      type: port
      description: destination port utilized by the session
      ecs: destination.port
      status: mapped
    - vendor: proto
      type: string
      description: IP protocol associated with the session
      ecs: network.transport
      status: mapped
    - vendor: action
      type: enum
      description: >-
        action taken on the traffic that matched the threat signature (alert,
        allow, deny, drop, reset-client, reset-server, reset-both, block-url,
        sinkhole, ...)
      ecs: event.action
      status: mapped
    - vendor: rule
      type: string
      description: name of the security rule the session matched
      ecs: rule.name
      status: mapped
    - vendor: app
      type: string
      description: App-ID application associated with the session
      ecs: network.application
      status: mapped
    - vendor: threatid
      type: string
      description: >-
        Palo Alto identifier for the threat - a description string followed by
        a 64-bit numeric id
      ecs: null
      status: unmapped
      custom: panw.panos.threat.id
      transform: >
        split the vendor value on the trailing parenthesised id: the 64-bit
        numeric signature id lands in panw.panos.threat.id and the leading
        description string in panw.panos.threat.name, with the raw combined
        value preserved for the traffic/threat cross-reference pipelines that
        match on it today
      notes: >
        numeric/textual threat signature identifier, still no correct ECS home
        in 9.4. Not threat.indicator.id (new GA in 9.4): that field models an
        id issued by a threat-intel provider for an indicator document,
        whereas this is detection-rule identity. Not rule.id either: in this
        dataset rule.name already holds the security policy rule, so pairing a
        content-signature id with a policy-rule name under one rule.* object
        would mislead any dashboard that reads them as a name/id pair - unlike
        the Cisco FTD and Suricata maps, where rule.name and rule.id describe
        the same signature.
    - vendor: severity
      type: enum
      description: severity of the threat, one of critical/high/medium/low/informational
      ecs: event.severity
      status: partial
      transform: >
        vendor values are the strings critical/high/medium/low/ informational;
        needs a lookup transform to ECS's numeric event.severity scale before
        it is usable for alerting thresholds
    - vendor: misc
      type: string
      description: >-
        URL (up to 1023 chars) or filename (up to 63 chars) associated with
        the threat, depending on subtype
      ecs: url.original
      status: partial
      notes: >
        only populated for the url-filtering threat subtype; for other
        subtypes (vulnerability, spyware, wildfire, file-blocking) this column
        holds subtype-specific free text, not a URL
    - vendor: category
      type: string
      description: >-
        URL category for url subtypes, WildFire verdict
        (malware/phishing/grayware/benign) for wildfire subtypes, otherwise
        "any"
      ecs: null
      status: unmapped
      custom: panw.panos.threat.category
      notes: URL/threat category taxonomy, PAN-specific, no ECS equivalent
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the CSV low-side into ECS JSON and do the two normalizations
          the map flags before the crossing: split the composite threat
          identifier into the numeric signature id and its description string
          (retaining the combined value the existing cross-reference pipelines
          match on), and translate the critical/high/medium/low/informational
          severity vocabulary through a lookup into the numeric ECS scale so
          alerting thresholds work. Gate the URL field so it is only promoted
          to url.original for the url-filtering subtype - other subtypes put
          unrelated free text in that column - and add Schema Library
          validation with a dead-letter route plus Persistent Queue
          backpressure ahead of the guard destination. Keep _raw across the
          guard on this route: threat events are IDS-class and forensically
          worth the bytes until the parser is proven.
        elastic: >
          Land in logs-panw.threat with custom-namespace keyword mappings for
          the threat id, threat name and threat category fields, and verify
          event.severity arrives as the numeric ECS value rather than the
          vendor string. Layer a logs-panw.threat@custom pipeline that leaves
          the low-side identifier split intact, derives event.outcome from the
          wider threat action vocabulary (alert and allow are not failures;
          deny, drop, reset-* and block-url are), and keeps the URL category
          taxonomy out of any ECS threat.* field it does not actually model.
        relay: >
          Field-aware ECS JSON crosses the guard; the CEF templates the vendor
          feed still carries are converted low-side and no longer reach the
          boundary. Do not confuse that with the crossing's own envelope:
          today the confirmed transport is a Cribl Syslog Destination whose
          __syslogout value is itself CEF-structured, with the high side
          recovering the record from _raw via an Extract JSON parser before
          Cribl fields and Routes, and that leg is being retired in favour of
          the confirmed plan of record - low-side Cribl HTTP Destination to
          high-side Cribl HTTP Source carrying NDJSON, at which point nothing
          CEF-shaped exists anywhere on the path. AST/file drop is a
          replay-capable fallback only, not an alternative design. The
          kilobyte-scale URL/filename column and the free-text threat
          description are the content filter's main friction here, so cap
          their length and normalize percent- and unicode-encoded values
          before the guard destination. The crossing is at-most-once with no
          return channel - reconcile low-side and high-side counts per
          (dataset, hour) to detect drops.
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard. Parse the CSV into ECS JSON at
          the edge worker group and do the two normalizations the map flags:
          split the composite threat identifier into the numeric signature id
          and its description string (retaining the combined value the
          existing cross-reference pipelines match on), and translate the
          critical/high/medium/low/informational severity vocabulary through a
          lookup into the numeric ECS scale so alerting thresholds work. Gate
          the URL field so it is only promoted to url.original for the
          url-filtering subtype - other subtypes put unrelated free text in
          that column - and add Schema Library validation with a dead-letter
          route plus Persistent Queue backpressure on the onward Elastic
          destination. No guard-driven content capping is needed on this path;
          keep _raw on this route regardless, since threat events are
          IDS-class and forensically worth the bytes until the parser is
          proven.
        elastic: >
          Land in logs-panw.threat with custom-namespace keyword mappings for
          the threat id, threat name and threat category fields, and verify
          event.severity arrives as the numeric ECS value rather than the
          vendor string. Layer a logs-panw.threat@custom pipeline that leaves
          the identifier split intact, derives event.outcome from the wider
          threat action vocabulary (alert and allow are not failures; deny,
          drop, reset-* and block-url are), and keeps the URL category
          taxonomy out of any ECS threat.* field it does not actually model.
  - format: syslog-cef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      Threat: paste the vendor Threat CEF template (CEF:0|Palo Alto
      Networks|PAN-OS|$sender_sw_version|$threatid|$type|
      $number-of-severity|rt=$cef-formatted-receive_time
      deviceExternalId=$serial src=$src dst=$dst ... request=$misc
      cs2=$category cat=$threatid ...). Per-log-type tab, so this is
      independent of the Traffic tab. Forward via the Log Forwarding Profile
      match list for the Threat log type.
    references:
    - >-
      https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-90-cef-configuration-guide.pdf
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/network-logs/network-threat-log/network-threat-cef-fields
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (CEF pre-parse) OR Elastic CEF integration
      notes: >
        Same two paths as the traffic CEF form. Threat-specific care: the
        threat identifier appears in CEF header slot 5, Device Event Class ID
        - slot 6, Name, is the constant log type THREAT - AND in
        cat=$threatid, so split it into the numeric signature id and
        description exactly as the CSV map does (retaining the combined value
        the cross-reference pipelines match on). event.severity is carried
        ONLY in the CEF header severity slot ($number-of-severity, a 1-5
        scale), not an extension key, so it must be lifted from the header and
        mapped to the numeric ECS scale. request=$misc holds a URL only for
        the url-filtering subtype. Do not treat cat= as a category - here it
        is the threat id.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse CEF to ECS NDJSON low-side and do the two threat
          normalizations before the crossing: split cat=$threatid into the
          numeric signature id and its description (keeping the combined
          value), and lift the CEF header severity into the numeric ECS
          event.severity scale so alerting thresholds work. Gate request=$misc
          so it only promotes to url.original for the url-filtering subtype -
          other subtypes put unrelated free text there. Validate against a
          Schema Library schema with a dead-letter route and Persistent Queue
          backpressure ahead of the guard destination. Keep _raw across the
          guard here: threat events are IDS-class and forensically worth the
          bytes until the parser is proven.
        elastic: >
          Land in logs-panw.threat with custom keyword mappings for the threat
          id/name/category and verify event.severity arrives numeric. Layer a
          logs-panw.threat@custom pipeline that leaves the identifier split
          intact, derives event.outcome from the wider threat action
          vocabulary (alert/allow are not failures;
          deny/drop/reset-*/block-url are), and keeps the URL taxonomy out of
          any ECS threat.* field it does not model.
        relay: >
          Field-aware ECS NDJSON crosses the guard; the CEF line is converted
          low-side and never reaches the boundary. The kilobyte-scale
          request=$misc URL/filename and the free-text description are the
          content filter's main friction - cap their length and normalize
          percent-/unicode-encoded values before the guard destination.
          At-most-once crossing with no return channel; reconcile counts per
          (dataset, hour).
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard but still convert CEF to ECS
          NDJSON at the edge with the threatid split, header-severity lift and
          Persistent Queue backpressure.
        elastic: >
          Land in logs-panw.threat with custom keyword mappings for the threat
          id/name/category and verify event.severity arrives numeric. Layer a
          logs-panw.threat@custom pipeline that leaves the identifier split
          intact, derives event.outcome from the wider threat action
          vocabulary (alert/allow are not failures;
          deny/drop/reset-*/block-url are), and keeps the URL taxonomy out of
          any ECS threat.* field it does not model.
    fields:
    - vendor: src
      type: ip
      description: CEF standard key for $src - session source IP
      ecs: source.ip
      status: mapped
    - vendor: dst
      type: ip
      description: CEF standard key for $dst - session destination IP
      ecs: destination.ip
      status: mapped
    - vendor: sourceTranslatedAddress
      type: ip
      description: $natsrc - post-NAT source IP
      ecs: source.nat.ip
      status: mapped
    - vendor: destinationTranslatedAddress
      type: ip
      description: $natdst - post-NAT destination IP
      ecs: destination.nat.ip
      status: mapped
    - vendor: spt
      type: port
      description: CEF standard key for $sport - source port
      ecs: source.port
      status: mapped
    - vendor: dpt
      type: port
      description: CEF standard key for $dport - destination port
      ecs: destination.port
      status: mapped
    - vendor: proto
      type: string
      description: CEF standard key for $proto - IP protocol
      ecs: network.transport
      status: mapped
    - vendor: act
      type: enum
      description: >-
        CEF standard key for $action - action taken on the matched threat
        (alert, allow, deny, drop, reset-*, block-url, sinkhole)
      ecs: event.action
      status: mapped
      transform: >
        copied to event.action; event.outcome derived from the wider threat
        vocabulary (alert/allow monitor-only; deny/drop/reset-*/ block-url are
        failures)
    - vendor: cs1
      type: string
      description: labelled Rule - CEF cs1=$rule, matched security rule name
      ecs: rule.name
      status: mapped
    - vendor: suser
      type: string
      description: $srcuser - source username
      ecs: source.user.name
      status: mapped
    - vendor: duser
      type: string
      description: $dstuser - destination username
      ecs: destination.user.name
      status: mapped
    - vendor: app
      type: string
      description: $app - App-ID application
      ecs: network.application
      status: mapped
    - vendor: cat
      type: string
      description: >-
        CEF cat=$threatid - the composite threat identifier (description
        followed by a 64-bit numeric id); also CEF header slot 5, Device Event
        Class ID
      ecs: null
      status: unmapped
      custom: panw.panos.threat.id
      transform: >
        split on the trailing parenthesised id: the numeric signature id lands
        in panw.panos.threat.id and the leading string in
        panw.panos.threat.name, preserving the combined value for the
        traffic/threat cross-reference pipelines
      notes: >
        the CEF `cat` slot carries the threat id, NOT a category - the URL
        category is cs2 and the threat-class category is PanOSThreatCategory.
        Which header slot holds it depends on the envelope: the on-box
        template in this entry's enable: block puts the specific value in slot
        5 and the constant $type in slot 6, while Cortex Data Lake / LF 2.0
        forwarding reverses the pair. This entry documents the on-box
        template.
    - vendor: request
      type: string
      description: >-
        CEF request=$misc - URL (url-filtering subtype) or filename (file
        subtypes) associated with the threat
      ecs: url.original
      status: partial
      notes: >
        only a URL for the url-filtering subtype; other subtypes
        (vulnerability, spyware, wildfire, file-blocking) put subtype-specific
        free text here, so gate the promotion by subtype
    - vendor: cs2
      type: string
      description: >-
        labelled URL Category - CEF cs2=$category, URL category / WildFire
        verdict for the relevant subtypes
      ecs: null
      status: unmapped
      custom: panw.panos.threat.category
      notes: PAN-specific URL/threat category taxonomy, no ECS equivalent
    - vendor: PanOSThreatCategory
      type: string
      description: >-
        $thr_category - the threat-class category (spyware, vulnerability,
        virus, wildfire, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.threat.type
      notes: >-
        distinct from cs2 (the URL category); describes which detection engine
        class raised the record
    - vendor: flexString2
      type: enum
      description: >-
        labelled Direction - CEF flexString2=$direction, direction of the
        attack (0/1 or client-to-server/server-to-client)
      ecs: network.direction
      status: partial
      transform: >
        map the vendor 0/1 or client-to-server/server-to-client value onto ECS
        inbound/outbound rather than copying
    - vendor: fileId
      type: string
      description: CEF fileId=$pcap_id - identifier of the associated packet capture
      ecs: null
      status: unmapped
      custom: panw.panos.threat.pcap_id
    - vendor: deviceInboundInterface
      type: string
      description: $inbound_if - ingress interface name
      ecs: observer.ingress.interface.name
      status: mapped
    - vendor: deviceOutboundInterface
      type: string
      description: $outbound_if - egress interface name
      ecs: observer.egress.interface.name
      status: mapped
    - vendor: dvchost
      type: string
      description: $device_name - firewall hostname that raised the detection
      ecs: observer.name
      status: mapped
    - vendor: deviceExternalId
      type: string
      description: $serial - firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: PanOSRuleUUID
      type: string
      description: $rule_uuid - UUID of the matched security rule
      ecs: rule.uuid
      status: mapped
    - vendor: cn1
      type: long
      description: labelled SessionID - CEF cn1=$sessionid, session shared with the traffic record
      ecs: null
      status: unmapped
      custom: panw.panos.session_id
      notes: the join key back to the traffic dataset
    - vendor: cs4
      type: string
      description: labelled Source Zone - CEF cs4=$from, ingress security zone
      ecs: null
      status: unmapped
      custom: panw.panos.source_zone
    - vendor: cs5
      type: string
      description: labelled Destination Zone - CEF cs5=$to, egress security zone
      ecs: null
      status: unmapped
      custom: panw.panos.destination_zone
  - format: syslog-leef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      Threat: paste the vendor LEEF 2.0 Threat template (LEEF header EventID
      carrying $threatid, then src/dst/srcPort/dstPort/proto/Action/Rule/
      Application/ThreatID/ThreatCategory/Severity/URLDomain ...).
      Per-log-type tab; forward via the Log Forwarding Profile match list for
      Threat.
    references:
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/network-logs/network-threat-log/network-threat-leef-fields
    - >-
      https://knowledgebase.paloaltonetworks.com/KCSArticleDetail?id=kA10g000000ClEcCAK
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (LEEF pre-parse)
      notes: >
        KV parse the LEEF body, then re-key to ECS/custom. LEEF splits the
        threat identity more helpfully than CEF - ThreatID, ThreatName and
        ThreatCategory are separate keys - but the same combined-value
        retention and numeric-severity lookup the CSV map needs still apply.
        Severity is a discrete Severity key (critical/high/medium/low/
        informational), not a header slot as in CEF.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse LEEF to ECS NDJSON low-side; because ThreatID/ThreatName/
          ThreatCategory arrive pre-split, retain them into the custom
          namespace and synthesize the combined value the cross-reference
          pipelines expect. Translate the Severity vocabulary into the numeric
          ECS scale, gate URLDomain/FileName by subtype, and validate against
          a Schema Library schema with a dead-letter route and Persistent
          Queue backpressure ahead of the guard. Keep _raw across the guard as
          on the CSV/CEF threat routes.
        elastic: >
          Land in logs-panw.threat with the threat id/name/category and
          session_id keyword customs; verify event.severity is numeric and
          derive event.outcome from the threat action vocabulary in an @custom
          pipeline.
        relay: >
          ECS NDJSON crosses the guard, not the LEEF line. Cap the URLDomain/
          FileName and free-text fields low-side and normalize encoding.
          At-most-once crossing; reconcile counts per (dataset, hour).
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard but still normalize LEEF to ECS
          NDJSON at the edge with the severity lookup and Persistent Queue
          backpressure.
        elastic: >
          Land in logs-panw.threat with the threat id/name/category and
          session_id keyword customs; verify event.severity is numeric and
          derive event.outcome from the threat action vocabulary in an @custom
          pipeline.
    fields:
    - vendor: src
      type: ip
      description: LEEF src=$src - session source IP
      ecs: source.ip
      status: mapped
    - vendor: dst
      type: ip
      description: LEEF dst=$dst - session destination IP
      ecs: destination.ip
      status: mapped
    - vendor: srcPort
      type: port
      description: LEEF srcPort=$sport - source port
      ecs: source.port
      status: mapped
    - vendor: dstPort
      type: port
      description: LEEF dstPort=$dport - destination port
      ecs: destination.port
      status: mapped
    - vendor: proto
      type: string
      description: LEEF proto=$proto - IP protocol
      ecs: network.transport
      status: mapped
    - vendor: Action
      type: enum
      description: LEEF Action=$action - action taken on the matched threat
      ecs: event.action
      status: mapped
      transform: copied to event.action; derive event.outcome from the threat action vocabulary
    - vendor: Rule
      type: string
      description: LEEF Rule=$rule - matched security rule name
      ecs: rule.name
      status: mapped
    - vendor: usrName
      type: string
      description: LEEF usrName=$srcuser - source username
      ecs: source.user.name
      status: mapped
    - vendor: Application
      type: string
      description: LEEF Application=$app - App-ID application
      ecs: network.application
      status: mapped
    - vendor: EventID
      type: string
      description: LEEF header EventID=$threatid - numeric threat/signature id
      ecs: null
      status: unmapped
      custom: panw.panos.threat.id
      notes: >-
        LEEF places the numeric id in the header EventID slot; pair with
        ThreatName for the combined identifier
    - vendor: ThreatName
      type: string
      description: LEEF ThreatName=$threat_name - human-readable threat/signature name
      ecs: null
      status: unmapped
      custom: panw.panos.threat.name
    - vendor: ThreatCategory
      type: string
      description: >-
        LEEF ThreatCategory=$thr_category - threat-class category (spyware,
        vulnerability, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.threat.type
    - vendor: Severity
      type: enum
      description: LEEF Severity=$severity - critical/high/medium/low/informational
      ecs: event.severity
      status: partial
      transform: >-
        lookup the string vocabulary into ECS's numeric event.severity scale
        before alerting
    - vendor: URLDomain
      type: string
      description: LEEF URLDomain=$url_domain - domain of the URL associated with the threat
      ecs: url.domain
      status: partial
      notes: populated for URL/web-borne subtypes only
    - vendor: FileName
      type: string
      description: LEEF FileName=$file_name - filename associated with file/wildfire subtypes
      ecs: file.name
      status: partial
      notes: populated for file-blocking/wildfire subtypes only
    - vendor: FileHash
      type: string
      description: LEEF FileHash=$filedigest - SHA-256 of the associated file
      ecs: file.hash.sha256
      status: mapped
    - vendor: Verdict
      type: string
      description: LEEF Verdict=$verdict - WildFire verdict (malware, phishing, grayware, benign)
      ecs: null
      status: unmapped
      custom: panw.panos.threat.verdict
    - vendor: DirectionOfAttack
      type: enum
      description: LEEF DirectionOfAttack=$direction - client-to-server or server-to-client
      ecs: network.direction
      status: partial
      transform: map to ECS inbound/outbound rather than copying
    - vendor: DeviceName
      type: string
      description: LEEF DeviceName=$device_name - firewall hostname
      ecs: observer.name
      status: mapped
    - vendor: DeviceSN
      type: string
      description: LEEF DeviceSN=$serial - firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: RuleUUID
      type: string
      description: LEEF RuleUUID=$rule_uuid - UUID of the matched security rule
      ecs: rule.uuid
      status: mapped
    - vendor: SessionID
      type: long
      description: LEEF SessionID=$sessionid - session shared with the traffic record
      ecs: null
      status: unmapped
      custom: panw.panos.session_id
      notes: join key back to the traffic dataset
  - format: json
    enable: >
      Device > Server Profiles > HTTP > (server) > Payload Format > Threat:
      build a JSON payload mapping attributes to threat field variables (e.g.
      {"src":"$src","dst":"$dst","action":"$action","threatid":
      "$threatid","severity":"$severity","category":"$category","misc":
      "$misc",...}). Reference the HTTP profile from a Log Forwarding Profile
      match list for the Threat log type. One JSON object per record over
      HTTP(S); the attribute set is the documented threat field catalog.
    references:
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/forward-logs-to-an-https-destination
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/log-types-and-severity-levels/threat-logs
    parsing:
      mechanism: cribl-pipeline
      artifact: Cribl HTTP Source + JSON Parser, emitting to logs-panw.threat
      notes: >
        The payload is already JSON, so a Cribl HTTP Source with Extract JSON
        reads it directly. Keys are operator-named, so pin the payload
        template with the pipeline. Once keys are known the ECS mapping is
        identical to the CSV route, including the threatid split and the
        numeric-severity lookup. Inventory left open because it is
        operator-defined rather than vendor-fixed.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Native JSON is the closest match to the plan-of-record crossing:
          conform the admin-chosen keys to the shared ECS NDJSON shape,
          perform the threatid split and severity lookup, and gate the URL
          field by subtype at the edge worker group. Pin the payload template
          in change control. Validate against a Schema Library schema with a
          dead-letter route and Persistent Queue backpressure ahead of the
          guard, and keep _raw across the guard as on the other threat routes.
        elastic: >
          Land in logs-panw.threat with the threat id/name/category and
          session_id keyword customs; keep high-side work to a normalization
          pass.
        relay: >
          Conform the firewall's JSON to the same two-level, short-ASCII-key
          envelope as every other dataset; cap the URL/filename and
          description lengths low-side. At-most-once crossing; reconcile
          counts per (dataset, hour).
      direct:
        parse_location: low
        cribl: >
          High-side instances receive JSON on a Cribl HTTP Source and conform
          keys to ECS with the threatid split and Persistent Queue
          backpressure.
        elastic: >
          Land in logs-panw.threat with the threat id/name/category and
          session_id keyword customs; keep high-side work to a normalization
          pass.
    fields_omitted: >
      The keys are named by whoever builds the HTTP Payload Format template
      for Threat, so this inventory is operator-defined rather than
      vendor-fixed; the underlying threat attributes map exactly as the
      syslog-csv entry documents, including the threatid split and the
      numeric-severity lookup.
    fields: []
- id: globalprotect
  name: GlobalProtect log
  description: >
    The firewall's remote-access record: portal and gateway authentication,
    pre-logon and on-demand connection attempts, gateway selection, tunnel
    establishment and teardown, HIP-driven and quarantine-driven rejections,
    and the private address the gateway assigns to each endpoint. PAN-OS 9.1.3
    lifted these events out of the system log into their own GLOBALPROTECT
    type with a fixed column set - stage, authentication method, tunnel type,
    client OS and app version, portal and gateway names, public and private
    addresses, status, error and error code - and a device only emits them
    when GlobalProtect is selected under Device > Log Settings, which is a
    device-level setting rather than a security-rule log-forwarding profile.
    Categorised authentication and network: authentication because the login
    outcome, the failure reason and the account are the substance of the
    record and this is the only PAN-OS record in this map of who signed in
    from where - PAN-OS also emits a dedicated AUTHENTICATION log type, which
    this map does not carry; network because tunnel setup and teardown,
    carrying the assigned private address, is what makes every later traffic
    record attributable to a person rather than to an address out of a pool.
    The network profile's destination, port and transport requirements are
    structurally unsatisfiable here - a GlobalProtect record describes a
    tunnel and its two endpoints, not a session five-tuple - and the coverage
    table is left to say so rather than trimming the category to hide it.
  event_categories:
  - authentication
  - network
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Receives syslog-csv over TCP from the PAN-OS syslog forwarding profile
        selected under Device > Log Settings > GlobalProtect. Volume is a
        small fraction of the traffic feed but every record is individually
        significant, so this hop parses rather than samples.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        allow-list on logs-panw.globalprotect destination data stream only;
        the error, description and attempted-gateways columns are unbounded
        vendor free text and must be capped low-side before inspection, and
        the filter policy has to permit usernames and public client IP
        addresses because on this feed they are the payload, not incidental
        content
      notes: >
        Remote-access records must pass content inspection before leaving the
        enclave. Crossing transport is confirmed: TODAY the low-side Cribl
        ships through a Cribl Syslog Destination, using the __syslogout
        internal field whose value is a CEF-structured string, and the
        high-side Cribl receives each message as _raw containing a JSON object
        string, runs a Parser function (Extract JSON) over _raw, adds Cribl
        fields and ships to Routes. That syslog/CEF leg is being retired.
        PLANNED and confirmed as the plan of record: low-side Cribl HTTP
        Destination -> guard -> high-side Cribl HTTP Source carrying NDJSON.
    - hop: cribl
      location: core worker group, Elastic side
      notes: >-
        re-applies the Cribl Pack for final field normalization before the
        Elastic Bulk destination
    - hop: elastic
      data_stream: logs-panw.globalprotect
    direct:
    - hop: cribl
      location: edge Cribl worker group
      notes: >
        Receives syslog-csv over TCP from the PAN-OS syslog forwarding profile
        selected under Device > Log Settings > GlobalProtect, and parses it to
        ECS before forwarding.
    - hop: cribl
      location: core worker group, Elastic side
      notes: >-
        re-applies the Cribl Pack for final field normalization before the
        Elastic Bulk destination
    - hop: elastic
      data_stream: logs-panw.globalprotect
  formats:
  - format: syslog-csv
    recommended: true
    recommended_because: >-
      PAN-OS CSV is the native log format and the Elastic panw integration
      parses it as delivered; CEF requires pasting a custom template per log
      type and moves parsing into a Cribl pack.
    references:
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/globalprotect-log-fields
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/network-logs/network-globalprotect-log/network-globalprotect-syslog-fields
    - >-
      https://github.com/elastic/integrations/tree/main/packages/panw/data_stream/panos
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks
      notes: >
        Positional CSV after the syslog header, with two reserved FUTURE_USE
        columns (position 1, and position 6 between the subtype and the
        generation time) that the parser must consume or every column after
        them shifts by one and the source user lands in the source region
        slot. Reserved is not empty - vendor sample records carry 1 in
        position 1 and a config-version integer such as 2305 in position 6 -
        so consume both positionally and discard the values rather than
        testing them for emptiness. The column set is stable from PAN-OS 9.1.3
        onward and grows at the tail only: high_res_timestamp arrived in 10.0
        between actionflags and selection_type, cluster_name in 11.1 after
        vsys_id, so pin the parser to named columns from the front and
        tolerate extra trailing columns rather than asserting a fixed width.
        Elastic's panw integration routes this log type through its single
        panos data stream and is a useful cross-check on the column order, but
        two of its mappings are deliberately not followed here and each is
        called out on the field it affects: it puts private_ip on source.ip
        with public_ip on source.nat.ip, and it puts the quarantine reason
        column on event.reason.
    fields:
    - vendor: receive_time
      type: timestamp
      description: time the log was received at the management plane
      ecs: null
      status: partial
      custom: panw.panos.receive_time
      notes: >-
        management-plane arrival, not event time. Deliberately not
        event.created: ECS defines that field as the time the event was first
        read by an agent or by the pipeline, and the firewall's own management
        plane is neither, so mapping it there would misreport collection
        latency as though Cribl had seen the record. The lag between this
        column and time_generated is the firewall's internal queueing delay -
        derive it as its own metric, which is the outstanding work that keeps
        this partial rather than unmapped.
    - vendor: serial
      type: string
      description: serial number of the firewall that generated the log
      ecs: observer.serial_number
      status: mapped
    - vendor: type
      type: string
      description: log type discriminator; the literal value GLOBALPROTECT
      ecs: null
      status: partial
      notes: >-
        consumed by the pipeline to route the record to this dataset and then
        dropped; event.dataset is set from the route key so it carries the
        data-stream name rather than the vendor's uppercase literal
    - vendor: subtype
      type: string
      description: >-
        threat/content type slot; on GlobalProtect records it carries 0 on
        deployed records
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.subtype
      notes: >-
        the vendor field table reproduces the threat-log subtype vocabulary
        (data, file, flood, spyware, url, virus, wildfire, ...) in this row,
        which is a documentation artifact - deployed GlobalProtect records
        carry the constant 0 instead of any of those values, so do not build a
        subtype-conditional branch on this column the way the threat feed
        requires
    - vendor: time_generated
      type: timestamp
      description: time the event was generated on the dataplane
      ecs: '@timestamp'
      status: partial
      transform: >
        rendered as device-local YYYY/MM/DD HH:MM:SS with no offset, so the
        firewall's configured timezone (or the syslog header) has to supply
        the offset before it parses; where the device is missing from the
        timezone enrichment, recover the offset from high_res_timestamp, which
        carries one explicitly. This column stays @timestamp on every record -
        the high resolution column is a management-plane receive time and is
        not a substitute for it
    - vendor: vsys
      type: string
      description: virtual system associated with the session
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
    - vendor: eventid
      type: string
      description: >-
        name of the event (portal-prelogin, portal-getconfig, gateway-auth,
        gateway-getconfig, tunnel-start, tunnel-restart, gateway-logout, ...)
      ecs: event.action
      status: mapped
      transform: >
        GlobalProtect has no separate action column - the event name is the
        action. Lower-case it onto event.action, which is what the
        authentication and network alerting profiles read, and copy the value
        verbatim to event.code as well because it is a stable vendor
        identifier that survives the lower-casing and is what device owners
        quote
    - vendor: stage
      type: string
      description: stage of the connection (before-login, login, tunnel)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.stage
      notes: >-
        pre-logon machine tunnels report before-login; a sudden shift of a
        user's records from login to before-login is a machine-certificate
        problem, not an authentication one
    - vendor: auth_method
      type: string
      description: authentication type used (LDAP, RADIUS, SAML, certificate, local database, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.auth_method
      notes: >-
        ECS has no authentication-mechanism field, so this stays in the vendor
        namespace; map it as keyword because it is the dimension that
        separates a broken SAML IdP from a credential-stuffing run against the
        local database
    - vendor: tunnel_type
      type: string
      description: type of tunnel established, either SSLVPN or IPSec
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.tunnel_type
      notes: >-
        not an ECS-modelled protocol - do not write it to network.protocol; a
        population-wide fallback from IPSec to SSLVPN is a UDP/4501 path
        problem worth alerting on
    - vendor: srcuser
      type: string
      description: username of the user who initiated the session
      ecs: user.name
      status: partial
      transform: >
        the account the authentication is about, so user.name is the primary
        target; also copy to source.user.name and related.user so the
        source-side and entity views resolve. Partial because the value
        arrives qualified: a DOMAIN\ or user@realm prefix has to be split off
        into user.domain rather than left inside the name, and until that
        split runs the account will not join to any directory-sourced identity
    - vendor: srcregion
      type: string
      description: region for the user who initiated the session
      ecs: source.geo.name
      status: partial
      notes: >
        the firewall's own opinion of where the client is, drawn from its
        region objects: the value is an ISO 3166 country code for built-in
        regions but an administrator-chosen string for custom regions defined
        under Objects > Regions, so it cannot be fed to
        source.geo.country_iso_code unconditionally. Run a real geo enrichment
        on source.ip for the geo the CSOC alerts on and keep this as the
        device's assertion
    - vendor: machinename
      type: string
      description: 'name of the user''s machine'
      ecs: host.name
      status: mapped
      transform: >-
        lower-case on ingest; endpoints report mixed case inconsistently
        between the Windows and macOS clients and a case-sensitive keyword
        join to the endpoint estate otherwise misses half the population
    - vendor: public_ip
      type: ip
      description: public IP address for the user who initiated the session
      ecs: source.ip
      status: mapped
      notes: >
        the address the connection actually arrived from, and the only address
        present on a failed authentication - it is what geo enrichment,
        impossible- travel and brute-force detections key on. Elastic's panw
        integration maps this column to source.nat.ip and puts private_ip on
        source.ip instead; that inversion is deliberately not followed,
        because it leaves failed logins with no source.ip at all and breaks
        the authentication profile
    - vendor: public_ipv6
      type: ip
      description: public IPv6 address for the user who initiated the session
      ecs: source.ip
      status: partial
      transform: >-
        guard both sides of the coalesce: take this column only when it parses
        as a real IPv6 address AND public_ip is empty or the literal 0.0.0.0.
        Real records populate the IPv6 columns with the vendor's 0.0.0.0
        placeholder on every IPv4 connection, so an unguarded fallback writes
        that placeholder to source.ip and every v4 client appears to have
        connected from nowhere. Emitting both columns is the other failure: it
        leaves source.ip a two-element array that breaks equality joins to the
        traffic feed
    - vendor: private_ip
      type: ip
      description: private IP address assigned to the endpoint inside the tunnel
      ecs: client.nat.ip
      status: partial
      notes: >
        this is the field that makes later traffic attributable: a traffic
        record whose source.ip falls in the gateway pool is only resolvable to
        a person by joining it to the tunnel-start record that assigned the
        address. ECS has no vpn.* namespace for a concentrator-assigned inner
        address; client.nat.ip is the closest GA field and is the target this
        catalog's other remote-access map already uses, so the two VPN feeds
        answer one query - but it is a tunnel assignment rather than a NAT
        translation, so revisit if ECS grows a VPN namespace. source.nat.ip is
        the tempting alternative because it would keep both addresses on one
        namespace next to source.ip, and it is rejected for the same reason
        the public address is: ECS source.nat.ip means the translated address
        a NAT device substituted for source.ip on an observed session, and
        these two columns are not the two ends of any translation. The public
        address is where the tunnel arrived from and the private one is issued
        to the endpoint for traffic that has not happened yet, so pairing them
        would assert a translation that never occurred and would invert its
        direction - the assigned address is the inside address of later
        sessions, not the outside address of this one. Empty on every
        pre-tunnel stage, which is normal and not a parse failure
    - vendor: private_ipv6
      type: ip
      description: private IPv6 address assigned to the endpoint inside the tunnel
      ecs: client.nat.ip
      status: partial
      transform: >-
        same guarded coalesce as the public pair: take this column only when
        it parses as a real IPv6 address AND private_ip is empty or the
        literal 0.0.0.0. The placeholder problem is identical here - the
        vendor fills the unused address family with 0.0.0.0 rather than
        leaving it blank, and an unguarded fallback would make 0.0.0.0 the
        attribution key every later traffic join resolves through. An
        IPv6-only tunnel assignment is the case the guarded form still has to
        catch, since it silently loses attribution otherwise
    - vendor: hostid
      type: string
      description: unique ID GlobalProtect assigns to identify the host
      ecs: host.id
      status: mapped
      notes: >-
        stable across address changes and hostname renames, so it is the
        durable join key from a GlobalProtect record to the endpoint estate
        and to HIP match records
    - vendor: serialnumber
      type: string
      description: 'serial number of the user''s machine or device'
      ecs: null
      status: partial
      custom: panw.panos.globalprotect.endpoint_serial_number
      notes: >-
        ECS device.serial_number is the natural home but is marked beta in the
        vendored 9.4.0 dictionary, so the value is deliberately withheld from
        ECS and parked in the vendor namespace; adopt when GA
    - vendor: client_ver
      type: string
      description: 'the client''s GlobalProtect app version'
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.client_version
      notes: >-
        stays custom on purpose - agent.version models the shipper that
        delivered the log to Elastic, not a piece of endpoint software the log
        describes, and conflating them makes fleet-version dashboards report
        the Cribl estate. This is the posture field: a client below the
        supported floor is the signal, so map it as keyword and sort it as a
        version downstream
    - vendor: client_os
      type: string
      description: 'the client device''s OS type (Windows, Mac, Linux, iOS, Android, Chrome)'
      ecs: host.os.family
      status: mapped
      transform: >-
        copy verbatim to host.os.family and additionally lower-case it into
        host.os.type where it lands in that ECS vocabulary (windows, macos,
        linux, ios, android) - Mac must be rewritten to macos and Chrome has
        no ECS vocabulary value, so leave host.os.type unset for it rather
        than inventing one
    - vendor: client_os_ver
      type: string
      description: 'the client device''s OS version'
      ecs: host.os.full
      status: mapped
      notes: >-
        free-form vendor build string ("Microsoft Windows 11 Enterprise,
        64-bit"); keep it verbatim on host.os.full and do not try to force the
        numeric part into host.os.version, which would be wrong on the mobile
        clients
    - vendor: repeatcnt
      type: long
      description: number of identical sessions detected within five seconds
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.repeat_count
      notes: >-
        ECS has no event-count field, so this stays custom; it matters here
        because a suppressed repeat count of 40 on a gateway-auth failure is
        one record but forty attempts, and any rate-based detection that
        counts documents rather than summing this column undercounts brute
        force
    - vendor: reason
      type: string
      description: string showing the reason for the quarantine
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.quarantine_reason
      notes: >-
        this is the quarantine reason and NOT the authentication failure
        reason - the failure text lives in the error column. Elastic's panw
        pipeline maps this column to event.reason, so a pipeline lifted from
        that integration will show empty reasons on every rejected login while
        burying genuine quarantine events; the mapping here deliberately
        diverges
    - vendor: error
      type: string
      description: string showing the error that occurred in any event
      ecs: event.reason
      status: mapped
      notes: >-
        the human-readable failure text a CSOC analyst reads first
        ("Authentication failed: Invalid username or password", "Gateway
        rejected the connection", certificate and HIP rejection strings);
        unbounded vendor free text, so cap it low-side before any crossing
    - vendor: opaque
      type: string
      description: additional information for any event that has occurred
      ecs: message
      status: mapped
      notes: >-
        free-text supplement to the error column and frequently the only place
        the failing gateway or IdP is named; unbounded, so cap it low-side
        alongside error
    - vendor: status
      type: enum
      description: status of the event, success or failure
      ecs: event.outcome
      status: mapped
      transform: >
        after lower-casing the two documented values are already the ECS
        event.outcome vocabulary. Do not assume the informational stages leave
        it empty - vendor sample records carry status=success on
        portal-prelogin, gateway-getconfig, gateway-config-release and
        gateway-hip-check, so an outcome filter is not a proxy for "terminal
        login records". Where the column is empty, set event.outcome to
        unknown rather than leaving the field absent, so that a dashboard
        filtered on outcome cannot silently drop records
    - vendor: location
      type: string
      description: administrator-defined location of the GlobalProtect portal or gateway
      ecs: observer.geo.name
      status: mapped
      notes: >-
        the gateway end of the connection, not the client end - srcregion is
        the client side. Keeping them in observer.geo.* and source.geo.*
        respectively is what lets a query ask "US users landing on the EMEA
        gateway"
    - vendor: login_duration
      type: long
      description: seconds the user was connected to the gateway, from login to logout
      ecs: event.duration
      status: partial
      transform: >-
        vendor value is whole seconds and ECS event.duration is nanoseconds,
        so multiply by 1e9 rather than copy; populated only on logout and
        tunnel teardown records, and event.start can be derived by subtracting
        it from the generation time
    - vendor: connect_method
      type: string
      description: how the app connected to the gateway (on-demand, user-logon, pre-logon)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.connect_method
      notes: >-
        a user-logon estate that starts reporting on-demand has had its portal
        configuration changed; keyword-mapped for that comparison
    - vendor: error_code
      type: long
      description: integer associated with any errors that occurred
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.error_code
      notes: >-
        pairs with the error string on event.reason and is the stable half of
        that pair, so detections should key on the code. ECS error.* models a
        failure of the application producing the log rather than the
        firewall's verdict about an observed connection, so the code stays in
        the vendor namespace next to the other GlobalProtect fields
    - vendor: portal
      type: string
      description: name of the GlobalProtect portal or gateway
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.portal
      notes: >-
        an administrator-chosen configuration object name on the firewall, not
        a resolvable host and not the device that logged the record - the
        firewall itself is observer.name - so it belongs in the vendor
        namespace. Map as keyword: it is the primary grouping dimension for
        every remote-access dashboard
    - vendor: seqno
      type: long
      description: 64-bit log entry identifier, incremented sequentially per log type
      ecs: event.sequence
      status: mapped
      notes: >-
        the number space is per log type, so a gap here is evidence of loss on
        this feed specifically and is the cheapest per-device drop check
        available
    - vendor: actionflags
      type: string
      description: bit field indicating whether the log was forwarded to Panorama
      ecs: null
      status: unmapped
      custom: panw.panos.action_flags
      notes: internal forwarding bookkeeping with no security value; drop candidate low-side
    - vendor: high_res_timestamp
      type: timestamp
      description: >-
        (PAN-OS 10.0 and later) time in milliseconds the log was received at
        the management plane, with an explicit UTC offset
      ecs: null
      status: partial
      custom: panw.panos.high_res_timestamp
      notes: >
        Two obligations, and neither is @timestamp. This is management-plane
        receive time like receive_time, not event time, so it must not
        displace time_generated as @timestamp - doing so would date every
        login by when the firewall's management plane got the record. It earns
        its place twice over anyway: it is the only column carrying an
        explicit UTC offset, so where a device is missing from the timezone
        enrichment it is what makes the offsetless time_generated
        interpretable; and its millisecond precision is the tiebreaker that
        orders a burst of failed attempts landing in the same second. Devices
        below 10.0 leave it empty, so neither use can be assumed
    - vendor: selection_type
      type: string
      description: how the gateway was chosen (manual, preferred, auto)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.selection_type
      notes: >-
        manual selection by a user who normally gets auto is worth surfacing -
        it is how someone routes themselves to a specific egress
    - vendor: response_time
      type: long
      description: >-
        SSL response time of the selected gateway, measured on the endpoint in
        milliseconds during tunnel setup
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.ssl_response_time
      notes: >-
        milliseconds and endpoint-measured; do not put it on event.duration,
        which this feed already uses for the login duration
    - vendor: priority
      type: long
      description: priority order of the gateway, highest (1) through lowest (5)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.gateway_priority
    - vendor: attempted_gateways
      type: string
      description: gateway name, SSL response time and priority for each gateway connection attempt
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.attempted_gateways
      notes: >-
        a repeating composite inside one column and the least bounded field on
        the feed - keep it as a single capped string rather than exploding it
        into an unbounded array, which would give the record a variable shape
        and make the guard's content decisions non-deterministic
    - vendor: gateway
      type: string
      description: name of the gateway specified in the portal configuration
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.gateway
      notes: >-
        configuration object name like the portal column, so it stays in the
        vendor namespace; this is the field that answers which gateway a
        failure storm is confined to
    - vendor: dg_hier_level_1..4
      type: long
      description: >-
        four columns of identification numbers giving the device group's
        position in the Panorama device-group hierarchy
      ecs: null
      status: unmapped
      custom: panw.panos.device_group_hierarchy
      notes: >-
        four numeric columns, meaningful only against the Panorama
        device-group tree; keep them together as one keyword-mapped object
        rather than four loose integers
    - vendor: vsys_name
      type: string
      description: name of the virtual system, valid only on multi-vsys firewalls
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_name
    - vendor: device_name
      type: string
      description: hostname of the firewall on which the event was logged
      ecs: observer.name
      status: mapped
    - vendor: vsys_id
      type: long
      description: unique identifier for a virtual system on the firewall
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_id
    - vendor: cluster_name
      type: string
      description: (PAN-OS 11.1 and later) name of the CN-Series firewall cluster
      ecs: null
      status: unmapped
      custom: panw.panos.cluster_name
      notes: >-
        appended after vsys_id in 11.1, so a parser pinned to a fixed column
        count rejects 11.1 records; empty on hardware firewalls
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the GlobalProtect CSV to ECS JSON on the edge worker group and
          get the address decisions right before anything else, because they
          are what the rest of the map depends on: public_ip to source.ip and
          private_ip to client.nat.ip, falling back to the matching IPv6
          column only where the IPv4 one is empty or the literal 0.0.0.0 and
          the IPv6 value parses as a real address - the vendor fills the
          unused address family with 0.0.0.0 rather than leaving it blank, so
          an emptiness-only fallback lands that placeholder on both fields -
          and never the Elastic panw integration's inversion of the two.
          Derive event.action from the lower-cased eventid while copying it
          unchanged to event.code, resolve status to event.outcome with an
          explicit unknown wherever the column is empty, and put the error
          column on event.reason rather than the quarantine reason column. Cap
          error, opaque and attempted_gateways at fixed lengths here - they
          are the three unbounded free-text columns and the only ones the
          guard cannot reason about - and run the geo enrichment on source.ip
          low-side where the account and the address are still together.
          Validate against a Schema Library schema with a dead-letter route
          and Persistent Queue backpressure (never Block) on the guard
          destination. Keep _raw on this feed rather than dropping it as the
          traffic route does: volume is low and a rejected login is exactly
          the record someone will want to re-read verbatim.
        elastic: >
          Land in logs-panw.globalprotect with keyword mappings for the
          panw.panos.globalprotect.* namespace - portal, gateway, auth_method,
          tunnel_type, stage, connect_method, selection_type and
          client_version are all grouping dimensions, not free text, and
          dynamic mapping will get client_version wrong. Mark client.nat.ip as
          the attribution key in the index template and build the runtime join
          from traffic's source.ip to it, because that is the query that turns
          a pool address back into a person. Assert that event.outcome is
          populated on every record so a record with an empty status column
          cannot silently vanish from an authentication dashboard, and do not
          let a dashboard use event.outcome to separate login attempts from
          informational stages - the informational stages report success too,
          so that split has to be made on event.action. Add a transform or
          alias so repeat_count is summed rather than counted by rate-based
          detections.
        relay: >
          Full ECS JSON crosses the guard, not CEF and not raw syslog CSV: the
          plan-of-record crossing is a low-side Cribl HTTP Destination to a
          high-side Cribl HTTP Source carrying NDJSON, and this feed's
          per-field length policy needs field-aware records a thin envelope
          cannot provide. Redaction and length capping are pinned low-side
          because the crossing is at-most-once with no return channel - once
          an over-length error string or a raw attempted-gateways blob is
          filtered out at the boundary there is no way to ask for it again.
          Hold the JSON to two levels of nesting with short ASCII keys, no
          duplicate keys and bounded string lengths, and keep
          attempted_gateways as one capped string rather than a
          variable-length array so the content filter sees a fixed record
          shape. This feed carries usernames and public client addresses on
          every record, so the per-feed filter policy has to permit them
          explicitly rather than treating them as incidental. Detect silent
          drops by reconciling low-side and high-side counts per (dataset,
          hour) and by watching seqno for gaps, which is sharper here than
          elsewhere because the sequence space is per log type and the volume
          is low enough that a gap is unambiguous. AST/file drop is a
          replay-capable fallback only.
      direct:
        parse_location: low
        cribl: >
          High-side firewalls reach the core worker group without a guard
          crossing. Parse the GlobalProtect CSV to the same ECS JSON at the
          edge worker group so one downstream shape exists on both sides:
          public_ip to source.ip and private_ip to client.nat.ip, each falling
          back to its IPv6 column only where the IPv4 one is empty or the
          literal 0.0.0.0 and the IPv6 value parses as a real address,
          event.action from the lower-cased eventid with event.code kept
          verbatim, status resolved to event.outcome with an explicit unknown
          wherever the column is empty, and the error column on event.reason
          rather than the quarantine reason. Run the geo enrichment on
          source.ip here where it is cheapest. No guard-driven length capping
          is required, so error and opaque can be carried at their full vendor
          length. Validate against a Schema Library schema with a dead-letter
          route and Persistent Queue backpressure (never Block) on the onward
          Elastic destination, and keep _raw - the volume does not justify
          dropping the verbatim record of a rejected login.
        elastic: >
          Land in logs-panw.globalprotect with keyword mappings for the
          panw.panos.globalprotect.* namespace and the same client.nat.ip
          attribution join from traffic's source.ip. Assert event.outcome is
          populated for every eventid the edge pipeline can emit, and mark
          repeat_count for summation so brute-force detections count attempts
          rather than documents.
  - format: syslog-cef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      GlobalProtect: paste the vendor GlobalProtect CEF template (CEF:0|Palo
      Alto Networks|PAN-OS|$sender_sw_version|$eventid|GLOBALPROTECT|1|
      rt=$cef-formatted-receive_time start=$cef-formatted-time_generated
      deviceExternalID=$serial dvchost=$device_name suser=$srcuser
      src=$public_ip shost=$machinename outcome=$status ...). The Custom Log
      Format is per log type, so selecting CEF for GlobalProtect does NOT
      change Traffic, Threat, System or Config on the same profile - each has
      its own tab. Attach the profile under Device > Log Settings >
      GlobalProtect; there is no Objects > Log Forwarding path for this log
      type because there is no security rule to hang one off. Transport is
      UDP/TCP/SSL syslog on the profile's server entry.
    references:
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/network-logs/network-globalprotect-log/network-globalprotect-cef-fields
    - >-
      https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-90-cef-configuration-guide.pdf
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-external-services-for-monitoring/configure-syslog-monitoring
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (CEF pre-parse)
      notes: >
        The pack's native parser is written against the CSV positional line
        and will not decode the CEF envelope as-is. Two viable paths: (a) run
        a Cribl CEF/KV parser and re-key the standard and PanOS* extensions
        onto the same ECS and custom targets the CSV map uses; or (b) send to
        the generic Elastic CEF integration, which lands standard keys on ECS
        and leaves the PanOS* extensions under cef.extensions.* for an @custom
        pipeline to promote. GlobalProtect specifics: the event name is in the
        CEF header, not an extension, so event.action has to be lifted from
        the header - and it is slot 5, Device Event Class ID, that carries it,
        while slot 6, Name, carries the constant log type GLOBALPROTECT, so a
        parser that reaches for Name gets the same value on every record;
        outcome= carries the success/failure status directly, which is the one
        thing CEF gives this feed for free; and the extension names come from
        the vendor's LF 2.0 schema, in which several Cortex Data Lake
        bookkeeping keys (PanOSTenantID, ProjectName, PlatformType,
        LogSourceGroupID, PanOSConfigVersion, PanOSLogSourceTimeZoneOffset,
        PanOSPanoramaSN) appear that a firewall-direct template does not emit
        - do not make the parser require them. The seconds-to-nanoseconds
        login duration conversion and the public/private address split the CSV
        form needs apply unchanged.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the GlobalProtect CEF low-side into the same ECS NDJSON the
          CSV route emits so exactly one downstream shape exists regardless of
          which format an instance is configured for. Lift the header Device
          Event Class ID field - slot 5, the one carrying the event id, not
          the Name slot, which is the constant GLOBALPROTECT - to event.action
          and copy it to event.code, take outcome= straight to event.outcome
          with an explicit unknown where it is empty, and keep the address
          split honest: src is the public client address and belongs on
          source.ip, while PanOSPrivateIPv4 is the assigned inner address and
          belongs on client.nat.ip. Watch cs3 - on this log type it carries
          the virtual system NAME, not $vsys as it does on the Traffic and
          Config templates, so a CEF parser reused across PAN-OS log types
          will mislabel it. Cap PanOSConnectionError, PanOSDescription and
          PanOSAttemptedGateways low-side, validate against a Schema Library
          schema with a dead-letter route, and use Persistent Queue
          backpressure (never Block) ahead of the guard destination.
        elastic: >
          Take pre-shaped documents into logs-panw.globalprotect and keep
          high-side work to a final normalization pass rather than a second
          full parse. Map the PanOS* extensions that carry the grouping
          dimensions - portal, gateway, stage, auth method, tunnel type,
          connection method, gateway selection type, client version - as
          keyword in the panw.panos.globalprotect.* namespace, and map the
          vsys name arriving in cs3 to panw.panos.vsys_name rather than
          letting a shared cs3 convention put it on panw.panos.vsys. Assert
          event.outcome is populated for every header Device Event Class ID
          value the low-side parser can emit, and assert event.action has more
          than one distinct value across a day - a single-valued event.action
          is the signature of a parser that lifted the Name slot instead.
        relay: >
          Full ECS NDJSON crosses the guard, never the CEF string: the
          plan-of-record crossing is a low-side Cribl HTTP Destination to a
          high-side Cribl HTTP Source, and a CEF line is a quote-fragile
          envelope whose escaping a content filter cannot reason about
          deterministically - the free-text error and description values on
          this feed are exactly the ones that carry equals signs and pipes.
          Length capping stays low-side because the crossing is at-most-once
          with no return channel. Two levels of nesting, short ASCII keys,
          bounded string lengths, attempted gateways as one capped string.
          Reconcile low-side and high-side counts per (dataset, hour) and
          watch PanOSSequenceNo for gaps.
      direct:
        parse_location: low
        cribl: >
          High-side instances reach Elastic without a guard crossing but still
          convert CEF to the shared ECS NDJSON at the edge worker group (path
          a) or hand off to the CEF integration (path b), with Persistent
          Queue backpressure on the onward Elastic destination. The
          header-to-event.action lift off Device Event Class ID rather than
          Name, the outcome= mapping, the public/private address split and the
          cs3 virtual-system-name trap all apply unchanged; only the
          guard-driven length capping falls away.
        elastic: >
          Take pre-shaped documents into logs-panw.globalprotect with keyword
          mappings across the panw.panos.globalprotect.* namespace and cs3
          routed to panw.panos.vsys_name. Assert event.outcome is populated
          for every header Device Event Class ID value the edge parser can
          emit - outcome= carries the status where the firewall sets one, but
          nothing supplies the unknown where the key is absent or empty, so
          that fallback is created here or nowhere.
    fields:
    - vendor: Device Event Class ID
      type: string
      description: >-
        CEF header slot 5, Device Event Class ID, carrying $eventid - the
        GlobalProtect event id (portal-prelogin, gateway-auth, tunnel-start,
        ...)
      ecs: event.action
      status: mapped
      transform: >-
        this is the slot event.action is derived from, NOT the Name slot, on
        the on-box template this entry documents: it puts $eventid in slot 5
        and the literal log type in slot 6, the same way the Traffic, Threat
        and Config templates put $subtype, $threatid and $result in slot 5
        against $type in slot 6. Cortex Data Lake / LF 2.0 forwarding reverses
        the pair, so confirm which envelope the feed arrives in before pinning
        the parser. Carried in the header rather than an extension key, so
        lift it from the header, lower-case it onto event.action and copy it
        verbatim to event.code, since GlobalProtect has no separate action
        field
    - vendor: Name
      type: string
      description: CEF header slot 6, Name, carrying the literal log type GLOBALPROTECT
      ecs: null
      status: partial
      notes: >-
        a constant, not the action, on the on-box template this entry
        documents - the event id is in Device Event Class ID there, and a
        parser that lifts event.action from Name stamps every record on the
        feed with the same value and silently destroys the only discriminator
        this log type has. Cortex Data Lake / LF 2.0 forwarding reverses the
        pair, putting the event id in Name, so confirm the envelope before
        pinning the parser. What this slot is good for on the on-box template
        is routing: it selects this dataset's pipeline and is then dropped,
        and event.dataset is set from the route key rather than from the
        header
    - vendor: src
      type: ip
      description: CEF standard key carrying the public IP the user connected from
      ecs: source.ip
      status: mapped
      notes: >-
        the only address present on a failed authentication; geo,
        impossible-travel and brute-force detections key on it
    - vendor: c6a2
      type: ip
      description: 'labelled Public IPv6 - CEF c6a2 carrying the client''s public IPv6 address'
      ecs: source.ip
      status: partial
      transform: >-
        guard both sides: take c6a2 only when it parses as a real IPv6 address
        AND src is empty or the literal 0.0.0.0. The vendor fills the unused
        address family with 0.0.0.0 rather than omitting it, so an
        emptiness-only test copies that placeholder onto source.ip; the guard
        also keeps source.ip single-valued so equality joins to the traffic
        feed hold
    - vendor: PanOSPrivateIPv4
      type: ip
      description: private IPv4 address assigned to the endpoint inside the tunnel
      ecs: client.nat.ip
      status: partial
      notes: >-
        the attribution key later traffic records are resolved through; ECS
        has no vpn.* namespace for a concentrator-assigned inner address and
        client.nat.ip is the closest GA field, though it is a tunnel
        assignment rather than a NAT translation. Empty on pre-tunnel stages
    - vendor: PanOSPrivateIPv6
      type: ip
      description: private IPv6 address assigned to the endpoint inside the tunnel
      ecs: client.nat.ip
      status: partial
      transform: >-
        take it only when it parses as a real IPv6 address AND
        PanOSPrivateIPv4 is empty or the literal 0.0.0.0 - the unused address
        family is populated with the 0.0.0.0 placeholder, so an emptiness-only
        test makes 0.0.0.0 the attribution key
    - vendor: suser
      type: string
      description: CEF standard key for the source user - the account that authenticated
      ecs: user.name
      status: partial
      transform: >-
        also copy to source.user.name and related.user; partial because a
        DOMAIN\ or user@realm qualifier has to be split off into user.domain
        rather than left inside the name
    - vendor: sntdom
      type: string
      description: CEF standard key carrying the parsed domain of the source user
      ecs: user.domain
      status: mapped
      notes: >-
        the vendor schema populates dntdom with the same value; ignore the
        destination twin rather than mapping it to destination.user.domain,
        which would assert a second party that does not exist on this log type
    - vendor: susername
      type: string
      description: CEF standard key carrying the account-name portion parsed out of the source user
      ecs: source.user.name
      status: mapped
      notes: >-
        duplicates the account part of suser and exists so the source.* view
        resolves without re-parsing; the vendor emits the same value in
        dusername
    - vendor: suid
      type: string
      description: CEF standard key carrying the directory UUID of the source user
      ecs: user.id
      status: mapped
      notes: >-
        survives account renames, so it is the durable identity join to the
        directory; duid carries the same value
    - vendor: shost
      type: string
      description: CEF standard key carrying the endpoint device name
      ecs: host.name
      status: mapped
      transform: lower-case on ingest to keep the join to the endpoint estate case-stable
    - vendor: PanOSHostID
      type: string
      description: unique host ID GlobalProtect assigns to the endpoint
      ecs: host.id
      status: mapped
    - vendor: PanOSEndpointSN
      type: string
      description: 'serial number of the user''s machine or device'
      ecs: null
      status: partial
      custom: panw.panos.globalprotect.endpoint_serial_number
      notes: >-
        ECS device.serial_number is the natural home but is beta in the
        vendored 9.4.0 dictionary, so the value is withheld from ECS on
        purpose; adopt when GA
    - vendor: PanOSEndpointOSType
      type: string
      description: endpoint OS type (Windows, Mac, Linux, iOS, Android, Chrome)
      ecs: host.os.family
      status: mapped
      transform: >-
        also lower-case into host.os.type where the value lands in that ECS
        vocabulary; Mac becomes macos and Chrome has no vocabulary value, so
        leave host.os.type unset for it
    - vendor: PanOSEndpointOSVersion
      type: string
      description: endpoint OS version string
      ecs: host.os.full
      status: mapped
    - vendor: PanOSGlobalProtectClientVersion
      type: string
      description: GlobalProtect app version on the endpoint
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.client_version
      notes: >-
        agent.version models the shipper that delivered the log, not endpoint
        software the log describes, so this stays in the vendor namespace; it
        is the posture field for below-floor client detection
    - vendor: PanOSStage
      type: string
      description: stage of the connection (before-login, login, tunnel)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.stage
    - vendor: PanOSAuthMethod
      type: string
      description: authentication type used (LDAP, RADIUS, SAML, certificate, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.auth_method
      notes: >-
        ECS has no authentication-mechanism field; keyword-map it because it
        is what separates a broken IdP from credential stuffing
    - vendor: PanOSTunnelType
      type: string
      description: tunnel type established, SSLVPN or IPSec
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.tunnel_type
      notes: not an ECS-modelled protocol - do not write it to network.protocol
    - vendor: PanOSConnectionMethod
      type: string
      description: how the app connected (on-demand, user-logon, pre-logon)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.connect_method
    - vendor: PanOSGatewaySelectionType
      type: string
      description: how the gateway was chosen (manual, preferred, auto)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.selection_type
    - vendor: PanOSPortal
      type: string
      description: name of the GlobalProtect portal or gateway
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.portal
      notes: >-
        a firewall configuration object name rather than a resolvable host;
        the firewall itself is dvchost/observer.name
    - vendor: PanOSGateway
      type: string
      description: name of the gateway specified in the portal configuration
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.gateway
    - vendor: PanOSGatewayPriority
      type: long
      description: priority order of the gateway, highest (1) through lowest (5)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.gateway_priority
    - vendor: PanOSAttemptedGateways
      type: string
      description: gateway name, SSL response time and priority for each connection attempt
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.attempted_gateways
      notes: >-
        a repeating composite inside one extension value, and the value most
        likely to contain the equals signs and pipes that break naive CEF
        unescaping; keep it as one capped string
    - vendor: PanOSSSLResponseTime
      type: long
      description: >-
        SSL response time of the selected gateway in milliseconds, measured on
        the endpoint
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.ssl_response_time
      notes: >-
        milliseconds, and not event.duration - that target is taken by the
        login duration
    - vendor: PanOSGlobalProtectGatewayLocation
      type: string
      description: administrator-defined location of the portal or gateway
      ecs: observer.geo.name
      status: mapped
      notes: the gateway end of the connection; PanOSSourceRegion is the client end
    - vendor: PanOSSourceRegion
      type: string
      description: region of the user who initiated the session
      ecs: source.geo.name
      status: partial
      notes: >-
        an ISO 3166 code for built-in regions but an administrator-chosen
        string for custom regions, so it cannot feed
        source.geo.country_iso_code unconditionally; run a real geo enrichment
        on src for alerting geo
    - vendor: outcome
      type: enum
      description: CEF standard key carrying the event status, success or failure
      ecs: event.outcome
      status: mapped
      transform: >-
        already the ECS vocabulary after lower-casing; the informational
        stages populate it too rather than leaving it empty, so it does not
        separate terminal from non-terminal records. Where the key is absent
        or empty, set unknown rather than leaving the field absent
    - vendor: PanOSConnectionError
      type: string
      description: error string describing why the connection or authentication failed
      ecs: event.reason
      status: mapped
      notes: >-
        the failure text an analyst reads first; unbounded vendor free text,
        so cap it low-side
    - vendor: PanOSConnectionErrorID
      type: long
      description: integer error code paired with the connection error string
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.error_code
      notes: >-
        the stable half of the error pair, so detections key on the code; ECS
        error.* models a failure of the reporting application rather than the
        firewall's verdict about the observed connection
    - vendor: PanOSQuarantineReason
      type: string
      description: reason the endpoint was quarantined
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.quarantine_reason
      notes: >-
        the quarantine reason and NOT the authentication failure reason, which
        is PanOSConnectionError - putting this on event.reason leaves rejected
        logins with an empty reason
    - vendor: PanOSDescription
      type: string
      description: additional free-text information about the event
      ecs: message
      status: mapped
      notes: unbounded; cap it low-side alongside the connection error
    - vendor: PanOSLoginDuration
      type: long
      description: seconds the user was connected to the gateway
      ecs: event.duration
      status: partial
      transform: >-
        whole seconds; multiply by 1e9 for ECS event.duration nanoseconds.
        Populated only on logout and teardown records
    - vendor: PanOSCountOfRepeats
      type: long
      description: number of identical events suppressed into this record
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.repeat_count
      notes: >-
        ECS has no event-count field; rate-based detections must sum this
        rather than count documents or brute force is undercounted
    - vendor: rt
      type: timestamp
      description: CEF standard key for the log receive time at the management plane
      ecs: null
      status: partial
      custom: panw.panos.receive_time
      notes: >-
        management-plane arrival, not event time, and not event.created for
        the same reason as the CSV route - the firewall's management plane is
        neither an agent nor the pipeline. Derive the queueing lag against
        start.
    - vendor: start
      type: timestamp
      description: CEF start key carrying the dataplane generation time
      ecs: '@timestamp'
      status: partial
      transform: >-
        CEF-formatted device-local time; take the offset from the device
        timezone or the syslog header, or recover it from
        PanOSTimeGeneratedHighResolution where the device is missing from the
        timezone enrichment. This key stays @timestamp - the high resolution
        extension is a receive time, not an alternative event time
    - vendor: PanOSTimeGeneratedHighResolution
      type: timestamp
      description: >-
        $high_res_timestamp - time in milliseconds the log was received at the
        management plane, with an explicit UTC offset
      ecs: null
      status: partial
      custom: panw.panos.high_res_timestamp
      notes: >-
        management-plane receive time despite the name, so it does not become
        @timestamp; it is kept for the two things it alone provides - the
        explicit UTC offset that makes the offsetless start= interpretable,
        and the millisecond tiebreak that orders same-second login attempts.
        Empty on devices below PAN-OS 10.0
    - vendor: PanOSSequenceNo
      type: long
      description: 64-bit log entry identifier, incremented sequentially per log type
      ecs: event.sequence
      status: mapped
      notes: per-log-type number space, so gaps are per-feed drop evidence
    - vendor: deviceExternalID
      type: string
      description: firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
      notes: >-
        spelled deviceExternalID in the GlobalProtect schema against
        deviceExternalId in the PAN-OS CEF configuration guide; make the key
        match case-insensitive or the serial silently disappears
    - vendor: dvchost
      type: string
      description: hostname of the firewall that logged the event
      ecs: observer.name
      status: mapped
    - vendor: cs3
      type: string
      description: labelled Virtual System Name - CEF cs3 carrying the vsys NAME on this log type
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_name
      notes: >-
        a genuine trap: on the Traffic and Config templates cs3 carries $vsys,
        but on GlobalProtect it carries the virtual system name, so a shared
        cs3 rule across PAN-OS log types mislabels one of them
    - vendor: PanOSVirtualSystem
      type: string
      description: virtual system associated with the session
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
    - vendor: PanOSVirtualSystemID
      type: long
      description: unique identifier for the virtual system on the firewall
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_id
    - vendor: PanOSLogSubtype
      type: string
      description: log subtype slot; carries 0 on deployed records
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.subtype
    - vendor: PanOSDGHierarchyLevel1
      type: long
      description: >-
        first of four device-group hierarchy levels giving the device group's
        position in the Panorama tree
      ecs: null
      status: unmapped
      custom: panw.panos.device_group_hierarchy
      notes: >-
        PanOSDGHierarchyLevel2 through 4 carry the remaining levels; keep the
        four together as one keyword-mapped object rather than four loose
        integers
    - vendor: PanOSLogForwarded
      type: string
      description: flag indicating the record was forwarded on from the firewall
      ecs: null
      status: unmapped
      custom: panw.panos.action_flags
      notes: >-
        the schema's rendering of the actionflags forwarding bit;
        PanOSLogExported, PanOSIsDuplicateLog, PanOSIsPrismaNetworks and
        PanOSIsPrismaUsers are the same class of bookkeeping and are all drop
        candidates low-side
  - format: syslog-leef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      GlobalProtect: paste the vendor GlobalProtect LEEF 2.0 template
      (LEEF:2.0|Palo Alto Networks|PAN-OS|<ver>|<eventid>| usrName=$srcuser
      PublicIPv4=$public_ip PrivateIPv4=$private_ip
      EndpointDeviceName=$machinename EventStatus=$status ...). As with CEF
      the Custom Log Format is per log type and the profile is attached under
      Device > Log Settings > GlobalProtect. This is the format Palo Alto's
      QRadar app expects, so it is the natural alternate anywhere a
      LEEF-native collector already exists.
    references:
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/network-logs/network-globalprotect-log/network-globalprotect-leef-fields
    - >-
      https://www.ibm.com/docs/en/security-qradar/log-insights/saas?topic=panps-configuring-syslog-leef-events-your-palo-alto-pa-series-device
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (LEEF pre-parse)
      notes: >
        LEEF is a tab-delimited key=value body after the LEEF header; a KV
        parser lifts the attributes and they re-key onto the same ECS and
        custom targets as the CSV map. The Elastic CEF integration does not
        read LEEF, so Cribl (or a QRadar-side re-export) is the practical
        parser. GlobalProtect specifics: the event id is in the LEEF header
        EventID slot rather than an attribute, so event.action is lifted from
        the header; the predefined LEEF cat attribute carries the LOG TYPE
        (GLOBALPROTECT) and not an event category, so a cat handler reused
        from another vendor will mislabel every record; and the LEEF attribute
        names are the vendor's LF 2.0 spellings, several of which (TenantID,
        ProjectName, PlatformType, LogSourceGroupID, ConfigVersion,
        LogSourceTimeZoneOffset, PanoramaSN) are Cortex Data Lake bookkeeping
        a firewall-direct template does not emit. Same post-parse
        normalizations as the other forms: seconds-to-nanoseconds login
        duration, unknown outcome wherever the status attribute is empty,
        public and private addresses to distinct targets.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse LEEF to the same ECS NDJSON as the CSV and CEF routes at the
          edge worker group so no dataset needs a per-format high-side
          pipeline. Lift the header EventID to event.action and copy it to
          event.code, take EventStatus to event.outcome with an explicit
          unknown where it is empty, map PublicIPv4 to source.ip and
          PrivateIPv4 to client.nat.ip - each falling back to its IPv6
          attribute only where the IPv4 one is empty or the literal 0.0.0.0
          and the IPv6 value parses as a real address, since the unused
          address family carries the 0.0.0.0 placeholder rather than nothing -
          and put ConnectionError on event.reason while QuarantineReason stays
          custom. Do not feed the cat attribute to any category logic. Cap
          ConnectionError, Description and AttemptedGateways low-side,
          validate against a Schema Library schema with a dead-letter route,
          and use Persistent Queue backpressure (never Block) ahead of the
          guard destination.
        elastic: >
          Land the pre-shaped documents in logs-panw.globalprotect with
          keyword mappings across the panw.panos.globalprotect.* namespace and
          the client.nat.ip attribution join from traffic's source.ip, and
          keep high-side work to the final normalization pass rather than
          re-parsing LEEF. VirtualSystemName arrives as its own attribute here
          rather than sharing a cs slot, so it maps cleanly to
          panw.panos.vsys_name.
        relay: >
          ECS NDJSON crosses the guard, never the LEEF line - tab-delimited
          key=value is as opaque to a content filter as CEF, and this feed's
          free text is where the delimiters break. Length capping stays
          low-side because the crossing is at-most-once with no return
          channel. Two levels of nesting, short ASCII keys, bounded string
          lengths, AttemptedGateways as one capped string. The filter policy
          must explicitly permit usernames and public client addresses, which
          are this feed's payload. Reconcile counts per (dataset, hour) and
          watch SequenceNo for gaps.
      direct:
        parse_location: low
        cribl: >
          High-side instances reach Elastic without a guard crossing but still
          normalize LEEF to the shared ECS NDJSON at the edge worker group,
          with the same header-EventID lift, EventStatus outcome resolution,
          public/private address split and cat-is-not-a-category rule, and
          Persistent Queue backpressure on the onward Elastic destination.
          Only the guard-driven length capping falls away, so ConnectionError
          and Description can be carried at full vendor length.
        elastic: >
          Land the pre-shaped documents in logs-panw.globalprotect with the
          panw.panos.globalprotect.* keyword mappings and the client.nat.ip
          attribution join, and keep high-side work to the final normalization
          pass rather than re-parsing LEEF.
    fields:
    - vendor: EventID
      type: string
      description: >-
        LEEF header EventID carrying the GlobalProtect event name
        (portal-prelogin, gateway-auth, tunnel-start, ...)
      ecs: event.action
      status: mapped
      transform: >-
        LEEF puts the event name in the header EventID slot; lower-case it
        onto event.action and copy verbatim to event.code, since GlobalProtect
        has no separate action attribute
    - vendor: cat
      type: string
      description: LEEF predefined cat attribute carrying the log type, GLOBALPROTECT
      ecs: null
      status: partial
      notes: >-
        cat is the log type here, NOT an event category - feed it to the
        routing decision and drop it, and keep it away from any category
        parser reused from another vendor. event.dataset comes from the route
        key
    - vendor: usrName
      type: string
      description: LEEF predefined attribute for the account that authenticated
      ecs: user.name
      status: partial
      transform: >-
        also copy to source.user.name and related.user; partial because a
        DOMAIN\ or user@realm qualifier has to be split off into user.domain
        rather than left inside the name
    - vendor: SourceUserInfoDomain
      type: string
      description: parsed domain of the source user
      ecs: user.domain
      status: mapped
    - vendor: SourceUserInfoName
      type: string
      description: parsed account-name portion of the source user
      ecs: source.user.name
      status: mapped
      notes: >-
        duplicates the account part of usrName so the source.* view resolves
        without re-parsing
    - vendor: SourceUserInfoUUID
      type: string
      description: directory UUID of the source user
      ecs: user.id
      status: mapped
      notes: survives account renames, so it is the durable identity join to the directory
    - vendor: PublicIPv4
      type: ip
      description: public IPv4 address the user connected from
      ecs: source.ip
      status: mapped
      notes: >-
        the only address present on a failed authentication, and what geo and
        brute-force detections key on
    - vendor: PublicIPv6
      type: ip
      description: public IPv6 address the user connected from
      ecs: source.ip
      status: partial
      transform: >-
        take it only when it parses as a real IPv6 address AND PublicIPv4 is
        empty or the literal 0.0.0.0 - the unused address family carries the
        0.0.0.0 placeholder, so an emptiness-only test writes it to source.ip;
        the guard also keeps source.ip single-valued
    - vendor: PrivateIPv4
      type: ip
      description: private IPv4 address assigned to the endpoint inside the tunnel
      ecs: client.nat.ip
      status: partial
      notes: >-
        the attribution key later traffic records resolve through; ECS has no
        vpn.* namespace for a concentrator-assigned inner address and
        client.nat.ip is the closest GA field, though it is a tunnel
        assignment rather than a NAT translation. Empty on pre-tunnel stages
    - vendor: PrivateIPv6
      type: ip
      description: private IPv6 address assigned to the endpoint inside the tunnel
      ecs: client.nat.ip
      status: partial
      transform: >-
        take it only when it parses as a real IPv6 address AND PrivateIPv4 is
        empty or the literal 0.0.0.0 - the unused address family carries the
        0.0.0.0 placeholder, so an emptiness-only test makes 0.0.0.0 the
        attribution key
    - vendor: SourceRegion
      type: string
      description: region of the user who initiated the session
      ecs: source.geo.name
      status: partial
      notes: >-
        an ISO 3166 code for built-in regions but an administrator-chosen
        string for custom regions, so it cannot feed
        source.geo.country_iso_code unconditionally
    - vendor: EndpointDeviceName
      type: string
      description: 'name of the user''s machine'
      ecs: host.name
      status: mapped
      transform: lower-case on ingest to keep the endpoint-estate join case-stable
    - vendor: HostID
      type: string
      description: unique host ID GlobalProtect assigns to the endpoint
      ecs: host.id
      status: mapped
    - vendor: EndpointSN
      type: string
      description: 'serial number of the user''s machine or device'
      ecs: null
      status: partial
      custom: panw.panos.globalprotect.endpoint_serial_number
      notes: >-
        ECS device.serial_number is the natural home but is beta in the
        vendored 9.4.0 dictionary, so the value is withheld from ECS on
        purpose; adopt when GA
    - vendor: EndpointOSType
      type: string
      description: endpoint OS type (Windows, Mac, Linux, iOS, Android, Chrome)
      ecs: host.os.family
      status: mapped
      transform: >-
        also lower-case into host.os.type where the value lands in that ECS
        vocabulary; Mac becomes macos and Chrome has no vocabulary value, so
        leave host.os.type unset for it
    - vendor: EndpointOSVersion
      type: string
      description: endpoint OS version string
      ecs: host.os.full
      status: mapped
    - vendor: GlobalProtectClientVersion
      type: string
      description: GlobalProtect app version on the endpoint
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.client_version
      notes: >-
        agent.version models the shipper that delivered the log, not endpoint
        software the log describes; this is the posture field for below-floor
        client detection
    - vendor: Stage
      type: string
      description: stage of the connection (before-login, login, tunnel)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.stage
    - vendor: AuthMethod
      type: string
      description: authentication type used (LDAP, RADIUS, SAML, certificate, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.auth_method
      notes: >-
        ECS has no authentication-mechanism field; keyword-map it for IdP
        versus credential-stuffing separation
    - vendor: TunnelType
      type: string
      description: tunnel type established, SSLVPN or IPSec
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.tunnel_type
      notes: not an ECS-modelled protocol - do not write it to network.protocol
    - vendor: ConnectionMethod
      type: string
      description: how the app connected (on-demand, user-logon, pre-logon)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.connect_method
    - vendor: GatewaySelectionType
      type: string
      description: how the gateway was chosen (manual, preferred, auto)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.selection_type
    - vendor: Portal
      type: string
      description: name of the GlobalProtect portal or gateway
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.portal
      notes: >-
        a firewall configuration object name rather than a resolvable host;
        the firewall itself is DeviceName/observer.name
    - vendor: Gateway
      type: string
      description: name of the gateway specified in the portal configuration
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.gateway
    - vendor: GatewayPriority
      type: long
      description: priority order of the gateway, highest (1) through lowest (5)
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.gateway_priority
    - vendor: AttemptedGateways
      type: string
      description: gateway name, SSL response time and priority for each connection attempt
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.attempted_gateways
      notes: >-
        a repeating composite inside one attribute value and the field most
        likely to carry the tab or equals characters a LEEF KV parser splits
        on; keep it as one capped string
    - vendor: SSLResponseTime
      type: long
      description: >-
        SSL response time of the selected gateway in milliseconds, measured on
        the endpoint
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.ssl_response_time
      notes: milliseconds, and not event.duration - that target carries the login duration
    - vendor: GlobalProtectGatewayLocation
      type: string
      description: administrator-defined location of the portal or gateway
      ecs: observer.geo.name
      status: mapped
      notes: the gateway end of the connection; SourceRegion is the client end
    - vendor: EventStatus
      type: enum
      description: status of the event, success or failure
      ecs: event.outcome
      status: mapped
      transform: >-
        already the ECS vocabulary after lower-casing; the informational
        stages populate it too rather than leaving it empty, so it does not
        separate terminal from non-terminal records. Where the attribute is
        absent or empty, set unknown rather than leaving the field absent
    - vendor: ConnectionError
      type: string
      description: error string describing why the connection or authentication failed
      ecs: event.reason
      status: mapped
      notes: the failure text an analyst reads first; unbounded free text, so cap it low-side
    - vendor: ConnectionErrorID
      type: long
      description: integer error code paired with the connection error string
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.error_code
      notes: >-
        the stable half of the error pair; ECS error.* models a failure of the
        reporting application rather than the firewall's verdict about the
        observed connection
    - vendor: QuarantineReason
      type: string
      description: reason the endpoint was quarantined
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.quarantine_reason
      notes: >-
        the quarantine reason and NOT the authentication failure reason, which
        is ConnectionError
    - vendor: Description
      type: string
      description: additional free-text information about the event
      ecs: message
      status: mapped
      notes: unbounded; cap it low-side alongside the connection error
    - vendor: LoginDuration
      type: long
      description: seconds the user was connected to the gateway
      ecs: event.duration
      status: partial
      transform: >-
        whole seconds; multiply by 1e9 for ECS event.duration nanoseconds.
        Populated only on logout and teardown records
    - vendor: CountOfRepeats
      type: long
      description: number of identical events suppressed into this record
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.repeat_count
      notes: >-
        ECS has no event-count field; rate-based detections must sum this
        rather than count documents
    - vendor: TimeReceived
      type: timestamp
      description: time the log was received at the management plane
      ecs: null
      status: partial
      custom: panw.panos.receive_time
      notes: >-
        management-plane arrival, not event time, and not event.created for
        the same reason as the CSV route - the firewall's management plane is
        neither an agent nor the pipeline. Derive the queueing lag against
        devTime.
    - vendor: devTime
      type: timestamp
      description: LEEF predefined attribute carrying the dataplane generation time
      ecs: '@timestamp'
      status: partial
      transform: >-
        paired with devTimeFormat in the LEEF body; take the offset from the
        device timezone or the syslog header where the format string omits it,
        or recover it from TimeGeneratedHighResolution. This attribute stays
        @timestamp - the high resolution attribute is a receive time, not an
        alternative event time
    - vendor: TimeGeneratedHighResolution
      type: timestamp
      description: >-
        TimeGeneratedHighResolution=$high_res_timestamp - time in milliseconds
        the log was received at the management plane, with an explicit UTC
        offset
      ecs: null
      status: partial
      custom: panw.panos.high_res_timestamp
      notes: >-
        management-plane receive time despite the name, so it does not become
        @timestamp; kept for the explicit UTC offset that makes devTime
        interpretable and for the millisecond tiebreak on same-second login
        attempts. Empty on devices below PAN-OS 10.0
    - vendor: SequenceNo
      type: long
      description: 64-bit log entry identifier, incremented sequentially per log type
      ecs: event.sequence
      status: mapped
      notes: per-log-type number space, so gaps are per-feed drop evidence
    - vendor: DeviceSN
      type: string
      description: firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: DeviceName
      type: string
      description: hostname of the firewall that logged the event
      ecs: observer.name
      status: mapped
    - vendor: VirtualSystem
      type: string
      description: virtual system associated with the session
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
    - vendor: VirtualSystemName
      type: string
      description: name of the virtual system, valid only on multi-vsys firewalls
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_name
      notes: >-
        LEEF gives this its own attribute rather than sharing a numbered slot,
        so the vsys/vsys-name confusion the CEF form carries in cs3 does not
        arise here
    - vendor: VirtualSystemID
      type: long
      description: unique identifier for the virtual system on the firewall
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_id
    - vendor: SubType
      type: string
      description: log subtype slot; carries 0 on deployed records
      ecs: null
      status: unmapped
      custom: panw.panos.globalprotect.subtype
    - vendor: DGHierarchyLevel1
      type: long
      description: >-
        first of four device-group hierarchy levels giving the device group's
        position in the Panorama tree
      ecs: null
      status: unmapped
      custom: panw.panos.device_group_hierarchy
      notes: >-
        DGHierarchyLevel2 through 4 carry the remaining levels; keep the four
        together as one keyword-mapped object
    - vendor: LogForwarded
      type: string
      description: flag indicating the record was forwarded on from the firewall
      ecs: null
      status: unmapped
      custom: panw.panos.action_flags
      notes: >-
        the schema's rendering of the actionflags forwarding bit; LogExported,
        IsDuplicateLog, IsPrismaNetworks and IsPrismaUsers are the same class
        of bookkeeping and are all drop candidates low-side
- id: userid
  name: User-ID log
  description: >
    IP-to-user mapping events (PAN-OS log type USERID): the record the
    firewall writes when it installs, refreshes or clears the binding between
    an address and an account, and - in the datasource columns - how that
    binding was learned, whether from a User-ID agent, directory server
    monitoring, syslog parsing, the XML API, captive portal, GlobalProtect or
    terminal-server port mapping. Every other PAN-OS feed inherits its
    attribution from this one: with no live mapping, source.user.name on the
    traffic and threat logs is empty. The category is iam rather than
    authentication because the record is not an authentication decision - it
    is the lifecycle of an identity assertion about an address - and it is not
    network either, because there is no session, no destination and no
    transport on the record.
  event_categories:
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Receives syslog-csv over TCP from the PAN-OS syslog forwarding
        profile. User-ID logs are selected under Device > Log Settings >
        User-ID, not through the Objects > Log Forwarding profiles that carry
        traffic and threat, so a security-rule forwarding change never affects
        this feed and never repairs it either.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        allow-list on logs-panw.userid destination data stream only; account
        names and User-ID source names are the only free text on the record
        and cross capped at their declared lengths; on the login and logout
        subtypes no record crosses with empty datasource and datasourcetype
        columns, because the provenance is the reason those records cross at
        all. The constraint stops at those two subtypes on purpose:
        register-tag and unregister-tag are dynamic-user-group tag operations
        that carry no User-ID data source, so an unscoped provenance
        precondition would silently drop every tag record on an at-most-once
        crossing with no return channel. Empty provenance on a tag subtype is
        a low-side completeness alert, not a crossing failure
      notes: >
        Same confirmed crossing as the other PAN-OS feeds: today a Cribl
        Syslog Destination on the __syslogout internal field carrying a
        CEF-structured string, with the high side parsing _raw through Extract
        JSON before Cribl fields and Routes; that leg retires in favour of the
        confirmed plan of record, a low-side Cribl HTTP Destination to a
        high-side Cribl HTTP Source carrying NDJSON. Volume is a small
        fraction of the traffic feed, but each record changes who the high
        side believes an address is, so a lost window is not sampling noise -
        it leaves the high side attributing later sessions to a stale account
        or to nobody.
    - hop: cribl
      location: core worker group, Elastic side
      notes: >-
        re-applies the Cribl Pack for final field normalization and carries
        the user/domain split and the panw.panos.userid.* provenance keys
        through unchanged to the Elastic Bulk destination
    - hop: elastic
      data_stream: logs-panw.userid
    direct:
    - hop: cribl
      location: edge Cribl worker group
      notes: >
        Receives syslog-csv over TCP from the PAN-OS syslog forwarding
        profile; User-ID logs are selected under Device > Log Settings >
        User-ID rather than through an Objects > Log Forwarding profile.
    - hop: cribl
      location: core worker group, Elastic side
      notes: >-
        re-applies the Cribl Pack for final field normalization before the
        Elastic Bulk destination
    - hop: elastic
      data_stream: logs-panw.userid
  formats:
  - format: syslog-csv
    recommended: true
    recommended_because: >-
      PAN-OS CSV is the native log format and the Elastic panw integration
      parses it as delivered; CEF requires pasting a custom template per log
      type and moves parsing into a Cribl pack.
    references:
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/user-id-log-fields
    - >-
      https://github.com/elastic/integrations/blob/main/packages/panw/data_stream/panos/elasticsearch/ingest_pipeline/userid.yml
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks
      notes: >
        Positional CSV, and the padding matters: the documented format carries
        a FUTURE_USE column in position 1, a second between Threat/Content
        Type and Generated Time, and a third between Origin Data Source and
        Cluster Name, so a parser that counts only populated columns lands the
        tail of the record one or two positions out and silently reads the
        origin data source as the cluster name. Elastic's panw integration
        parses this log with the shared panos data stream and appends both
        network and iam to event.category; the network half is an artifact of
        one pipeline serving every PAN-OS subtype, not a property of this
        record, and is not carried here. That integration also copies
        beginport/endport to source.port/destination.port and userbysource to
        source.user.name - three mappings this map deliberately does not
        follow, for the reasons recorded on those fields.
    fields:
    - vendor: receive_time
      type: timestamp
      description: time the log was received at the management plane
      ecs: null
      status: partial
      custom: panw.panos.receive_time
      notes: >
        Deliberately withheld from @timestamp, which comes from
        time_generated: receive time is when the firewall's management plane
        wrote the record, and on a loaded management plane it trails the
        binding by seconds. Dating a mapping by it would put the identity
        change after sessions the mapping already explains.
    - vendor: serial
      type: string
      description: serial number of the firewall that generated the log
      ecs: observer.serial_number
      status: mapped
    - vendor: type
      type: string
      description: log type; the value is always USERID
      ecs: null
      status: partial
      notes: >
        The parser branches on this column to select the User-ID grammar and
        then drops it. Withheld from event.dataset, which is set from the
        route rather than copied from the payload, so a truncated or forged
        column cannot redirect a record into another dataset's data stream,
        and given no custom home either: the value is a constant on every
        record in this dataset, so storing it per document buys nothing that
        event.dataset does not already say.
    - vendor: subtype
      type: enum
      description: subtype of the User-ID log - login, logout, register-tag, unregister-tag
      ecs: event.action
      status: mapped
      transform: >
        copied verbatim; login and logout install and clear an IP-to-user
        binding, register-tag and unregister-tag add and remove a
        dynamic-user-group tag against an existing one. No column carries an
        outcome, because every record describes a change PAN-OS actually
        applied - failed identity binding is an authentication log event, not
        a User-ID one - so event.outcome is set to success as a pipeline
        constant and documented as such rather than derived from a field.
    - vendor: time_generated
      type: timestamp
      description: time the log was generated on the dataplane
      ecs: '@timestamp'
      status: partial
      transform: >
        emitted as YYYY/MM/DD HH:MM:SS in the device's local time with no
        offset, so it must be parsed against a per-device timezone from the
        inventory enrichment; an unqualified parse dates every mapping by the
        firewall's UTC offset and destroys the ordering this feed exists to
        provide
      notes: >
        Partial rather than mapped because the column does not carry enough
        information to become a @timestamp on its own: the value needs an
        external per-device timezone before it is a point in time at all, and
        where the inventory has no entry for a serial the fallback is the
        offset-bearing high_res_timestamp.
    - vendor: vsys
      type: string
      description: virtual system associated with the mapping
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
      notes: shares the cross-dataset custom name the traffic and config maps use
    - vendor: ip
      type: ip
      description: >-
        the address the mapping binds; the vendor field description repeats
        the session wording ("original session source IP address") used across
        the other log types
      ecs: source.ip
      status: partial
      notes: >
        The address is the subject of this record, not the source of a
        connection - nothing was sent from it here, PAN-OS is asserting that
        it now belongs to an account. host.ip was rejected: the record carries
        no host identity at all, no hostname, no agent, no os, and populating
        one leaf of host.* invites someone to complete the object from the
        firewall's own identity, which is exactly the aliasing the
        reporting-host convention forbids. A custom-only home was rejected for
        the opposite reason: the whole operational use of this feed is
        pivoting from an address to the sessions around it, every other PAN-OS
        dataset carries that address on source.ip, and a panw.panos.* home
        would mean no ECS query and no correlation rule ever joins a binding
        to the traffic it explains. It lands on source.ip with this caveat and
        is also appended to related.ip so an any-address search finds it
        without asserting a connection endpoint.
    - vendor: user
      type: string
      description: the end user the address is bound to
      ecs: user.name
      status: partial
      transform: >
        arrives in whatever spelling the User-ID source supplied -
        domain\account, account@domain or bare - so split the qualifier into
        user.domain and leave the bare account on user.name, and keep the
        original string in the custom namespace. An unsplit value joins to
        nothing: the traffic feed, the directory and this feed each carry a
        different spelling of the same person.
      notes: >
        This is the account the binding names, and it is the object of the
        action rather than an actor - the actor is a User-ID source, not a
        person. user.target.name is left empty on purpose: ECS uses it when
        one user acts on another, and copying user.name into it to satisfy the
        iam profile would invent a second party the record does not have.
    - vendor: datasourcename
      type: string
      description: User-ID source that sent the IP (Port)-User mapping
      ecs: null
      status: partial
      custom: panw.panos.userid.datasource_name
      notes: >
        Names the specific source that produced the claim - the agent
        instance, the monitored domain controller, the API client.
        event.provider is the field a reader reaches for and is deliberately
        withheld: across this technology event.provider means the subsystem
        that emitted the record, which is always the firewall, and overloading
        it here would make that untrue on the one feed where provenance is the
        payload. Keyword-mapped in the custom namespace, it is the claimant
        identity a spoofed-mapping detection keys on.
    - vendor: eventid
      type: string
      description: string showing the name of the event
      ecs: event.code
      status: mapped
    - vendor: repeatcnt
      type: long
      description: >-
        number of events with the same source IP, destination IP, application
        and subtype seen within five seconds
      ecs: null
      status: unmapped
      custom: panw.panos.userid.repeat_count
      notes: >
        ECS has no event-repeat counter, so any rate detection over this feed
        must sum this column rather than count documents - five seconds of
        re-registration collapses into one record.
    - vendor: timeout
      type: long
      description: timeout after which the IP/user mapping is cleared
      ecs: null
      status: partial
      custom: panw.panos.userid.timeout
      notes: >
        The declared validity of the mapping, and the value that would turn a
        login record into an interval. The unit is undocumented: the vendor
        field table says only that it is the timeout after which the mapping
        is cleared and names no unit anywhere on the page. The evidence reads
        as seconds - sample records carry 2700 and 10800 against PAN-OS's
        45-minute configured default, and 2700 = 45 x 60 - but that is
        inference, not documentation, so confirm the unit against the
        deployment before any detection materialises a validity window from
        this column. Read the wrong way it is out by a factor of 60, which
        turns a 45-minute binding into a day and a half. Carried as the raw
        number with no unit conversion in the pipeline. Deliberately withheld
        from event.end and event.duration for a second reason as well: a
        logout, a re-registration from another source, or a shorter agent-side
        timeout can end the binding early, so a materialized end time would be
        wrong more often than right. Keep it as the declared TTL and resolve
        real validity windows at query time against the next record for the
        same address.
    - vendor: beginport
      type: port
      description: >-
        first port of the port range a multi-user mapping covers; the vendor
        field description carries the generic "source port utilized by the
        session" wording
      ecs: null
      status: partial
      custom: panw.panos.userid.begin_port
      notes: >
        Populated for terminal-server style mappings, where one address serves
        many users and the agent allocates each a port range - the same reason
        the datasourcename column is documented as an "IP (Port)-User
        Mapping". Withheld from source.port, which Elastic's panw integration
        does use: there is no session on this record, and a port-range
        boundary landing in source.port would join to genuine session ports in
        every query that touches both feeds.
    - vendor: endport
      type: port
      description: last port of the port range a multi-user mapping covers
      ecs: null
      status: partial
      custom: panw.panos.userid.end_port
      notes: >
        Withheld from destination.port for the stronger form of the same
        reason: a destination.port here would invent a peer the record never
        describes. Read as a pair with begin_port - a mapping with a range is
        an assertion about one user on a shared host, and attributing that
        host's whole address to the account is the classic User-ID
        over-attribution error.
    - vendor: datasource
      type: string
      description: source from which the mapping information was collected
      ecs: null
      status: unmapped
      custom: panw.panos.userid.datasource
      notes: >
        Half of the provenance pair and the reason this feed is worth crossing
        a guard: it names the class of source that produced the identity
        claim. ECS models who a user is and what a host did, but has no field
        for how an identity was learned, so the pair stays custom rather than
        being forced into a field that means something else. Keyword-mapped
        and kept in the default field set: the detections that matter here are
        shape detections over this column - a server subnet acquiring a
        mapping from a source class that has never served it, or one account
        appearing from two source classes within seconds.
    - vendor: datasourcetype
      type: string
      description: mechanism used to identify the IP/user mapping within a data source
      ecs: null
      status: unmapped
      custom: panw.panos.userid.datasource_type
      notes: >
        The other half: the mechanism, not the source. Only the pair is
        meaningful - the same source class can produce a mapping by reading a
        directory security log, by parsing forwarded syslog, or by an
        operator's XML API call, and those three carry entirely different
        trust. Syslog-parsed and API-supplied mappings are the two an attacker
        can forge without touching the directory, so this column is where an
        abuse detection starts.
    - vendor: seqno
      type: long
      description: monotonic log sequence number assigned by the firewall
      ecs: event.sequence
      status: mapped
      notes: >
        per-device and per-log-type; with an at-most-once crossing it is the
        only way to prove a gap in this feed rather than infer one from volume
    - vendor: actionflags
      type: string
      description: bit field indicating whether the log was forwarded to Panorama
      ecs: null
      status: unmapped
      custom: panw.panos.action_flags
      notes: >
        Unscoped, like vsys: this and the rest of the chassis and record-tail
        columns - the device group hierarchy, vsys_name, vsys_id, cluster_name
        - are the same PAN-OS columns with the same meaning on every log type,
        so they share one home across the datasets and only the
        log-type-specific fields take a panw.panos.userid.* name. One PAN-OS
        column with two homes would make any cross-dataset query pick a side.
    - vendor: dg_hier_level_1 to dg_hier_level_4
      type: long
      description: >-
        device group hierarchy identifiers for the firewall or virtual system
        that generated the log, outermost ancestor first
      ecs: null
      status: unmapped
      custom: panw.panos.device_group_hierarchy
      notes: >
        numeric device group ids, not names; resolving them needs the Panorama
        dg-hierarchy operational command, so carry the numbers and resolve in
        an enrichment lookup rather than pretending the column is
        human-readable
    - vendor: vsys_name
      type: string
      description: name of the virtual system associated with the mapping
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_name
    - vendor: device_name
      type: string
      description: hostname of the firewall on which the mapping was logged
      ecs: observer.name
      status: mapped
      notes: >
        the firewall that learned the mapping, not the endpoint being mapped;
        it is not copied to host.name, which stays empty on this feed
    - vendor: vsys_id
      type: long
      description: unique identifier for the virtual system on the firewall
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_id
    - vendor: factortype
      type: string
      description: vendor used to authenticate the user when multi-factor authentication is present
      ecs: null
      status: unmapped
      custom: panw.panos.userid.factor_type
      notes: >
        ECS has no multi-factor vocabulary at all, so the factor triple (type,
        completion time, number) has no ECS home to argue about; it is
        populated only where an authentication policy with MFA produced the
        mapping, which is exactly the subset a reviewer trusts most
    - vendor: factorcompletiontime
      type: timestamp
      description: time the authentication factor was completed
      ecs: null
      status: partial
      custom: panw.panos.userid.factor_completion_time
      transform: >-
        same offset-less YYYY/MM/DD HH:MM:SS device-local format as
        time_generated and needs the same per-device timezone before it is
        stored as a date
      notes: >
        Withheld from event.end even though the vendor's own CEF template puts
        it in the CEF end slot: it is when a factor completed, not when this
        event stopped, and an event.end derived from it would silently define
        the mapping's validity window as ending at the moment authentication
        succeeded.
    - vendor: factorno
      type: long
      description: primary authentication (1) or an additional factor (2, 3)
      ecs: null
      status: unmapped
      custom: panw.panos.userid.factor_number
    - vendor: ugflags
      type: string
      description: >-
        user group mapping flags - whether a user group was found and whether
        duplicate users were seen; N/A when no user group is found
      ecs: null
      status: partial
      custom: panw.panos.userid.ug_flags
      notes: >
        Split into discrete booleans low-side rather than stored as the joined
        string. Duplicate User is a genuine ambiguity signal - two directory
        objects claiming one account - and it should not take a substring
        match against a flag blob to alert on it.
    - vendor: userbysource
      type: string
      description: >-
        the username as the source reported it through its
        IP-address-to-username mapping
      ecs: null
      status: partial
      custom: panw.panos.userid.user_by_source
      notes: >
        The pre-normalization spelling, and the field to diff against user:
        where they disagree, the firewall rewrote the claim, and a source
        repeatedly supplying a name that does not survive normalization is
        worth seeing. Withheld from source.user.name, where Elastic's panw
        integration puts it - two different account strings on one document
        with no way to tell which binding the firewall actually installed is
        worse than one string and a custom field.
    - vendor: tag_name
      type: string
      description: name of the tag registered against the dynamic user group the user is mapped to
      ecs: null
      status: partial
      custom: panw.panos.userid.tag_name
      notes: >
        Populated on the register-tag and unregister-tag subtypes. Withheld
        from the ECS tags array, which would accept it: tags is the pipeline's
        and the analyst's annotation channel, and mixing a firewall-authored
        dynamic-user-group tag into it makes every tags-based filter ambiguous
        about who asserted the value.
    - vendor: high_res_timestamp
      type: timestamp
      description: >-
        management-plane receive time in milliseconds, ISO 8601 with a
        timezone designator; present in the User-ID field table from PAN-OS
        10.1 and dated to 10.0 on the Traffic page, so treat it as available
        on current releases and confirm against the running version rather
        than assuming a floor
      ecs: null
      status: partial
      custom: panw.panos.high_res_timestamp
      notes: >
        Two obligations. It is the only column on the record with an explicit
        UTC offset, so where a device is missing from the timezone enrichment
        it is the fallback that makes time_generated interpretable - on any
        firewall old enough not to emit it there is no fallback at all, which
        makes the inventory entry mandatory rather than nice to have. And it
        is the tiebreaker when two mappings for one address land in the same
        second, which decides which account the high side believes - ordering,
        not timing, is what this feed sells.
    - vendor: origindatasource
      type: string
      description: source where the User-ID mapping originated
      ecs: null
      status: unmapped
      custom: panw.panos.userid.origin_datasource
      notes: >
        Distinct from datasource wherever User-ID redistribution is in use:
        datasource names the peer that handed this firewall the mapping, this
        column names where the claim was born. A provenance detection keyed on
        datasource alone reads every redistributed mapping as though the peer
        firewall were the identity source.
    - vendor: cluster_name
      type: string
      description: name of the CN-Series firewall cluster (PAN-OS 11.1 and later)
      ecs: null
      status: unmapped
      custom: panw.panos.cluster_name
      notes: >
        a firewall cluster, not an orchestrator's cluster, so
        orchestrator.cluster.name does not fit; empty on hardware and
        VM-Series platforms
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the User-ID CSV low-side into ECS JSON and settle the identity
          normalization before anything leaves the enclave: split
          domain\account and account@domain into user.domain plus user.name,
          keep the original spelling and userbysource in the custom namespace,
          and cap account and datasourcename lengths. Pin any suppression here
          too - machine accounts and service accounts are the bulk of this
          feed's volume on a directory-monitored network, and the crossing is
          at-most-once with no return channel, so a record filtered low-side
          is gone and a record admitted low-side cannot be enriched back. Set
          event.action from subtype and event.outcome to success as a
          documented constant, keep beginport/endport off
          source.port/destination.port, split ugflags into booleans, and count
          the FUTURE_USE padding columns explicitly so the tail of the record
          does not shift. Apply the guard's empty-provenance precondition to
          the login and logout subtypes only, and alert low-side on a login or
          logout arriving without datasource and datasourcetype: register-tag
          and unregister-tag carry no User-ID data source, and a blanket
          provenance filter would drop exactly the tag records the
          out-of-window register-tag detection reads. Validate against a
          Schema Library schema with a dead-letter route ahead of the guard
          destination and run Persistent Queue backpressure, never Block, on
          it. _raw can be dropped once the username split is proven against
          the real domain spellings on this network: the record is short and
          fully columnar, so the parsed document loses nothing.
        elastic: >
          Land in logs-panw.userid with keyword mappings for the whole
          panw.panos.userid.* provenance set - datasource, datasource_type,
          datasource_name and origin_datasource - kept in the default field
          set, because the queries that make this feed worth ingesting
          aggregate over them. Be explicit in the index template that the iam
          profile is only partly satisfiable here: event.action is populated
          from subtype, event.outcome is the pipeline constant, user.name is
          clean only once the domain split runs, and user.target.name and
          host.name stay empty because the record has one party and no host
          document. Do not backfill either from observer.name to make the
          coverage number move. The detections worth building read the
          provenance, not the identity: a mapping for an address from a
          datasource_type that has never served that subnet, one account bound
          to many addresses inside a window, an address rebinding between
          accounts faster than any human login, and register-tag activity
          against dynamic user groups outside a change window. That last one
          reads subtype and tag_name rather than the provenance set, because
          the tag subtypes carry no User-ID data source - which is also why
          the guard's empty-provenance precondition is scoped to login and
          logout.
        relay: >
          Full ECS NDJSON crosses the guard, not CEF and not the raw CSV line,
          held to two levels of nesting with short ASCII keys, no duplicate
          keys and bounded string lengths so the content filter's decisions
          stay deterministic. Every record must carry seqno and the
          high-resolution timestamp: the crossing is at-most-once with no
          acknowledgement and no ordering guarantee, and on this feed order is
          the meaning - two mappings for one address arriving out of order
          make the high side believe the wrong account. Detect loss by
          reconciling low-side and high-side counts per (dataset, hour), and
          reconcile the login minus logout balance per hour as well, because a
          lost login is not a visible gap, it is later sessions attributed to
          a stale account or to nobody. The crossing itself is settled: a
          Cribl Syslog Destination on a CEF-structured __syslogout value
          today, retiring in favour of the confirmed plan of record, a
          low-side Cribl HTTP Destination to a high-side Cribl HTTP Source
          carrying this NDJSON. AST/file drop stays a replay-capable fallback
          for re-sending a missed window, which matters more here than on the
          volume feeds.
      direct:
        parse_location: low
        cribl: >
          Parse the User-ID CSV to ECS JSON at the edge worker group with the
          same identity normalization: split domain\account and account@domain
          into user.domain plus user.name, keep the original spelling and
          userbysource custom, set event.action from subtype and event.outcome
          to the documented success constant, keep beginport/endport off
          source.port/destination.port, split ugflags into booleans, and count
          the FUTURE_USE padding columns so the record tail does not shift.
          Validate against a Schema Library schema with a dead-letter route
          and use Persistent Queue backpressure, never Block, on the onward
          Elastic destination. No content capping is required for a boundary
          on this path, but account suppression decisions still belong at the
          edge where the device inventory lookup lives.
        elastic: >
          Land in logs-panw.userid with keyword mappings for the whole
          panw.panos.userid.* provenance set kept in the default field set.
          The same iam profile honesty applies: event.action from subtype,
          event.outcome as the pipeline constant, user.name clean only after
          the domain split, and user.target.name and host.name deliberately
          empty. Build the provenance detections - unexpected datasource_type
          for a subnet, one account across many addresses, an address
          rebinding between accounts within seconds, out-of-window
          register-tag activity - and a retention floor longer than the
          traffic feed's, because attribution questions are asked about
          sessions long after the mapping that explained them expired.
  - format: syslog-cef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      User-ID: paste the vendor User-ID CEF template (CEF:0|Palo Alto
      Networks|PAN-OS|$sender_sw_version|$subtype|$type|1|
      rt=$cef-formatted-receive_time start=$cef-formatted-time_generated
      deviceExternalId=$serial src=$ip duser=$user cs4=$datasourcename
      cs5=$datasource cs6=$datasourcetype cn3=$timeout cat=$eventid ...). The
      Custom Log Format is per log type, so selecting CEF for User-ID does not
      change Traffic, Threat, System or Config on the same profile - each has
      its own tab. The profile is then selected under Device > Log Settings >
      User-ID; User-ID logs are never carried by an Objects > Log Forwarding
      profile.
    references:
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/network-logs/network-userid-log/network-userid-cef-fields
    - >-
      https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-90-cef-configuration-guide.pdf
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/user-id-log-fields
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (CEF pre-parse)
      notes: >
        The pack's native parser reads the CSV positional line and will not
        decode the CEF envelope, so a CEF/KV parser lifts the keys and re-keys
        them onto the same ECS and custom targets the CSV map uses. Two
        envelope-specific traps on this log type. The cat slot carries
        $eventid here, while on the Traffic log the same slot carries
        $action_source - a shared cat handler reused across PAN-OS datasets
        produces nonsense on one of them. And the CEF end slot carries the
        authentication factor completion time, not the end of an interval, so
        any generic CEF-to-ECS mapper that routes end to event.end has to be
        overridden. The Cortex Data Lake schema this key list follows also
        defines Log Forwarding app plumbing - PanOSCortexDataLakeTenantID,
        LogSourceGroupID, PanOSLogSource, PanOSLogForwarded, PanOSLogExported,
        PanOSIsPrismaNetworks, PanOSIsPrismaUsers, PlatformType,
        PanOSConfigVersion, PanOSPanoramaSN, PanOSLogSourceTimeZoneOffset -
        that a firewall's own template never emits; the pipeline must treat
        all of them as optional.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the User-ID CEF low-side into the same ECS NDJSON the CSV
          route emits so exactly one downstream shape exists whichever format
          an instance is configured for. Override the two envelope traps
          explicitly - cat is the event id, not a category, and end is the
          factor completion time, not an interval end - then split dntdom and
          duser into user.domain and user.name (an on-box template puts the
          whole qualified spelling in duser, while the Cortex schema
          pre-splits it, so handle both), map cs4/cs5/cs6 to the provenance
          customs and cn3 to the declared timeout without converting its
          units. Resolve start against the per-device timezone here as well -
          the $cef-formatted-* variables carry a date but no offset, so this
          route needs the inventory lookup exactly as the CSV route does. Set
          event.outcome to the documented success constant. Cap account and
          source-name lengths, validate against a Schema Library schema with a
          dead-letter route, and use Persistent Queue backpressure, never
          Block, ahead of the guard destination.
        elastic: >
          Land in logs-panw.userid with the same keyword mappings as the CSV
          route for the panw.panos.userid.* provenance set, plus the vsys,
          factor and port-range customs the CEF slots carry. Assert in the
          index template that source.ip is the mapped address rather than a
          connection source, so a dashboard reusing a PAN-OS source.ip panel
          across datasets does not present bindings as sessions.
          user.target.name and host.name stay empty here for the same reason
          as on the CSV route.
        relay: >
          ECS NDJSON crosses the guard, never the CEF string: a CEF line is a
          quote-fragile envelope whose custom-string slots carry different
          meanings per log type, which is precisely what a content filter
          cannot reason about deterministically. Two-level nesting, short
          ASCII keys, bounded lengths, and externalId and the high-resolution
          timestamp on every record so the high side can order two bindings
          for one address. At-most-once crossing with no acknowledgement;
          reconcile counts per (dataset, hour) and the login/logout balance
          alongside them.
      direct:
        parse_location: low
        cribl: >
          Convert CEF to the shared ECS NDJSON at the edge worker group with
          the same overrides - cat is the event id, end is the factor
          completion time - the same dntdom/duser domain handling, the same
          per-device timezone applied to start because the CEF-formatted date
          carries no offset, the provenance customs from cs4/cs5/cs6 and the
          success constant on event.outcome, with Persistent Queue
          backpressure on the onward Elastic destination. No boundary-driven
          capping applies on this path.
        elastic: >
          Land in logs-panw.userid with the provenance, vsys, factor and
          port-range custom mappings, and the same index-template assertion
          that source.ip here is the mapped address rather than a connection
          source. user.target.name and host.name stay empty.
    fields:
    - vendor: subtype
      type: enum
      description: >-
        CEF header Device Event Class ID slot carrying $subtype - login,
        logout, register-tag, unregister-tag
      ecs: event.action
      status: mapped
      transform: >-
        carried in the header, not an extension key; lift it out before the KV
        parse and set event.outcome to the documented success constant, since
        CEF has no outcome key for this log type either. Which header slot
        holds it depends on the envelope: the on-box template in this entry's
        enable: block puts the specific value in slot 5 and the constant $type
        in slot 6, while Cortex Data Lake / LF 2.0 forwarding reverses the
        pair. This entry documents the on-box template.
    - vendor: end
      type: timestamp
      description: CEF end carrying $factorcompletiontime - time the factor completed
      ecs: null
      status: partial
      custom: panw.panos.userid.factor_completion_time
      notes: >
        The single most dangerous key on this envelope: end is the CEF slot
        every generic mapper routes to event.end, and on the User-ID log it
        holds the authentication factor completion time. Override the default
        and keep it custom.
    - vendor: cn1
      type: long
      description: >-
        labelled AuthFactorNo - CEF cn1=$factorno, primary authentication (1)
        or an additional factor (2, 3)
      ecs: null
      status: unmapped
      custom: panw.panos.userid.factor_number
    - vendor: dntdom
      type: string
      description: CEF dntdom - the domain component of the authenticated account
      ecs: user.domain
      status: mapped
      notes: >
        pre-split by the Cortex Data Lake schema; a firewall's own template
        leaves the qualifier inside duser, so the pipeline has to populate
        user.domain from whichever of the two is present
    - vendor: duser
      type: string
      description: CEF duser=$user - the account the address is bound to
      ecs: user.name
      status: partial
      transform: >-
        strip the domain qualifier where dntdom is absent and keep the
        original spelling custom, exactly as on the CSV route
      notes: >
        the object of the mapping, not an actor; user.target.name stays empty
        because the record has one party
    - vendor: duid
      type: string
      description: CEF duid - unique identifier of the authenticated user
      ecs: user.id
      status: partial
      notes: >
        the directory or Cloud Identity Engine identifier for the account,
        populated only where the identity source supplies one; empty from a
        firewall's own template, so no detection may require it
    - vendor: cnt
      type: long
      description: CEF cnt=$repeatcnt - repeat count within the five-second window
      ecs: null
      status: unmapped
      custom: panw.panos.userid.repeat_count
    - vendor: spt
      type: port
      description: 'CEF spt=$beginport - first port of a multi-user mapping''s port range'
      ecs: null
      status: partial
      custom: panw.panos.userid.begin_port
      notes: >
        the CEF key says source port, the value is a range boundary from a
        terminal-server style mapping; withheld from source.port because there
        is no session on this record
    - vendor: dpt
      type: port
      description: 'CEF dpt=$endport - last port of a multi-user mapping''s port range'
      ecs: null
      status: partial
      custom: panw.panos.userid.end_port
      notes: >-
        withheld from destination.port, which would invent a peer the record
        has no notion of
    - vendor: cat
      type: string
      description: CEF cat=$eventid - the name of the User-ID event
      ecs: event.code
      status: mapped
      notes: >
        On the Traffic log the cat slot carries $action_source; here it
        carries the event id. Do not reuse a shared cat handler across PAN-OS
        datasets.
    - vendor: PanOSDGHierarchyLevel1 to PanOSDGHierarchyLevel4
      type: long
      description: >-
        $dg_hier_level_1 to $dg_hier_level_4 - device group hierarchy
        identifiers, outermost ancestor first
      ecs: null
      status: unmapped
      custom: panw.panos.device_group_hierarchy
    - vendor: deviceExternalId
      type: string
      description: $serial - firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: dvchost
      type: string
      description: $device_name - hostname of the firewall that logged the mapping
      ecs: observer.name
      status: mapped
    - vendor: rt
      type: timestamp
      description: CEF rt=$cef-formatted-receive_time - management-plane receive time
      ecs: null
      status: partial
      custom: panw.panos.receive_time
      notes: >
        withheld from @timestamp, which comes from
        start=$cef-formatted-time_generated; rt is when the management plane
        wrote the record and trails the binding under load
    - vendor: cs5
      type: string
      description: >-
        labelled MappingDataSource - CEF cs5=$datasource, the class of source
        the mapping came from
      ecs: null
      status: unmapped
      custom: panw.panos.userid.datasource
      notes: >-
        keep in the default field set; the provenance triple is the detection
        surface of this feed
    - vendor: cs4
      type: string
      description: >-
        labelled MappingDataSourceName - CEF cs4=$datasourcename, the specific
        User-ID source that sent the mapping
      ecs: null
      status: partial
      custom: panw.panos.userid.datasource_name
      notes: >
        withheld from event.provider, which across this technology means the
        subsystem that emitted the record rather than the origin of an
        identity claim
    - vendor: cs6
      type: string
      description: >-
        labelled MappingDataSourceType - CEF cs6=$datasourcetype, the
        mechanism used within that source
      ecs: null
      status: unmapped
      custom: panw.panos.userid.datasource_type
    - vendor: cn3
      type: long
      description: >-
        labelled MappingTimeout - CEF cn3=$timeout, the timeout after which
        the mapping is cleared
      ecs: null
      status: partial
      custom: panw.panos.userid.timeout
      notes: >
        Declared TTL in an undocumented unit - neither the CEF key list nor
        the field table names one - and the sampled values read as seconds
        against PAN-OS's 45-minute default, so confirm the unit against the
        deployment before any detection materialises a validity window from
        it, exactly as on the CSV route. Also withheld from event.end and
        event.duration because a logout or a re-registration can end the
        binding early.
    - vendor: cs1
      type: string
      description: >-
        labelled MFAFactorType - CEF cs1=$factortype, the vendor that
        completed the authentication factor
      ecs: null
      status: unmapped
      custom: panw.panos.userid.factor_type
    - vendor: externalId
      type: string
      description: CEF externalId=$seqno - monotonic log sequence number
      ecs: event.sequence
      status: mapped
    - vendor: src
      type: ip
      description: CEF src=$ip - the address the mapping binds
      ecs: source.ip
      status: partial
      notes: >
        the subject of the record rather than the source of a connection;
        carried on source.ip so the binding joins the sessions it explains,
        and appended to related.ip, with host.ip rejected because the record
        carries no host identity
    - vendor: start
      type: timestamp
      description: >-
        CEF start=$cef-formatted-time_generated - dataplane generation time of
        the mapping event
      ecs: '@timestamp'
      status: partial
      transform: >-
        the $cef-formatted-* variables render MMM dd yyyy HH:mm:ss - an
        explicit date but no offset - so the value is still device-local and
        needs the same per-device timezone from the inventory enrichment as
        the CSV column before it becomes @timestamp; only the date format
        differs between the two forms, not the obligation
    - vendor: PanOSTag
      type: string
      description: $tag_name - tag registered against the dynamic user group
      ecs: null
      status: partial
      custom: panw.panos.userid.tag_name
      notes: >-
        withheld from the ECS tags array, which is the pipeline's and the
        analyst's annotation channel
    - vendor: PanOSTimeGeneratedHighResolution
      type: timestamp
      description: >-
        $high_res_timestamp - millisecond management-plane receive time with a
        timezone designator
      ecs: null
      status: partial
      custom: panw.panos.high_res_timestamp
      notes: the tiebreaker when two bindings for one address land in the same second
    - vendor: PanOSUGFlags
      type: string
      description: $ugflags - user group mapping flags
      ecs: null
      status: partial
      custom: panw.panos.userid.ug_flags
      notes: split into discrete booleans low-side rather than kept as a joined string
    - vendor: PanOSUserGroupFound
      type: string
      description: whether the account resolved to a user group during group mapping
      ecs: null
      status: unmapped
      custom: panw.panos.userid.user_group_found
      notes: >-
        the Cortex schema breaks this out of the flag blob; a firewall's own
        template leaves it inside $ugflags, so populate it from whichever form
        arrives
    - vendor: PanOSIsDuplicateUser
      type: string
      description: whether duplicate users were found during user group mapping
      ecs: null
      status: unmapped
      custom: panw.panos.userid.duplicate_user
      notes: >-
        two directory objects claiming one account; a real ambiguity signal,
        not pipeline noise
    - vendor: PanOSUserIdentifiedBySource
      type: string
      description: $userbysource - the username as the source reported it before normalization
      ecs: null
      status: partial
      custom: panw.panos.userid.user_by_source
      notes: >-
        diff against duser; withheld from source.user.name so one document
        never carries two competing account strings
    - vendor: cs3
      type: string
      description: labelled VirtualLocation - CEF cs3=$vsys, the virtual system
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
    - vendor: cn2
      type: long
      description: labelled VirtualSystemID - CEF cn2=$vsys_id
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_id
    - vendor: PanOSVirtualSystemName
      type: string
      description: $vsys_name - name of the virtual system
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_name
  - format: syslog-leef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      User-ID: paste the vendor LEEF 2.0 User-ID template (LEEF:2.0|Palo Alto
      Networks|PAN-OS|<ver>|<eventid>| src=$ip usrName=$user
      MappingDataSource=$datasource MappingDataSourceName=$datasourcename
      MappingDataSourceType=$datasourcetype MappingTimeout=$timeout ...). As
      with CEF the Custom Log Format is per log type and the profile is
      selected under Device > Log Settings > User-ID. This is the format Palo
      Alto's QRadar app expects, so it is the natural alternate anywhere a
      LEEF-native collector already exists.
    references:
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/network-logs/network-userid-log/network-userid-leef-fields
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/user-id-log-fields
    - >-
      https://knowledgebase.paloaltonetworks.com/KCSArticleDetail?id=kA10g000000ClEcCAK
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (LEEF pre-parse)
      notes: >
        LEEF is a delimited key=value body after the LEEF header; a KV parser
        lifts the attributes and re-keys them onto the same ECS and custom
        targets as the CSV map. The attribute names are spelled out rather
        than positional, which makes this the least fragile of the three
        envelopes for this log type - and unlike the CEF form there is no
        overloaded cat or end slot to override, because LEEF names the mapping
        attributes explicitly. Two spellings still need care: LEEF cat carries
        the log type (USERID) while CEF cat carries the event id, and both
        usrName and AuthenticatedUserName can carry an account, the first from
        a firewall's own template and the second from the Cortex Data Lake
        schema. The Elastic CEF integration does not read LEEF, so Cribl is
        the practical parser. The same Log Forwarding app plumbing attributes
        the CEF form defines - CortexDataLakeTenantID, LogSourceGroupID,
        LogSource, LogForwarded, LogExported, IsPrismaNetworks, IsPrismaUsers,
        PlatformType, ConfigVersion, PanoramaSN, LogSourceTimeZoneOffset - are
        absent from a firewall-emitted line and must be optional.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          KV parse the LEEF body at the edge worker group and emit the same
          ECS NDJSON the CSV and CEF routes emit, so no dataset needs a
          per-format high-side pipeline. Populate user.name and user.domain
          from usrName or AuthenticatedUserName plus AuthenticatedUserDomain,
          whichever the template supplies, map MappingDataSource,
          MappingDataSourceName and MappingDataSourceType onto the provenance
          customs, keep srcPort and dstPort off source.port and
          destination.port, pin the devTime parse to the declared
          devTimeFormat and apply the per-device timezone where that format
          carries no offset, set event.action from the header EventID and
          event.outcome to the documented success constant. Validate against a
          Schema Library schema with a dead-letter route and use Persistent
          Queue backpressure, never Block, ahead of the guard destination.
        elastic: >
          Land in logs-panw.userid with the provenance customs in the default
          field set and the same iam caveats as the other routes:
          event.outcome is a pipeline constant, user.name is clean only after
          the domain split, user.target.name and host.name stay empty. Nothing
          about LEEF changes the field inventory, so the index template and
          the detections are shared with the CSV route rather than duplicated
          per format.
        relay: >
          ECS NDJSON crosses the guard, never the LEEF line. Two-level
          nesting, short ASCII keys, bounded lengths, with SequenceNo and the
          high-resolution timestamp on every record so bindings for one
          address can be ordered high-side. At-most-once crossing; reconcile
          counts per (dataset, hour) and the login/logout balance with them.
      direct:
        parse_location: low
        cribl: >
          KV parse LEEF to the shared ECS NDJSON at the edge worker group with
          the same account and domain handling, the provenance customs, the
          port attributes kept custom, the devTime parse pinned to the
          declared devTimeFormat with the per-device timezone applied where it
          carries no offset, and the success constant on event.outcome, with
          Persistent Queue backpressure on the onward Elastic destination.
        elastic: >
          Land in logs-panw.userid with the provenance customs in the default
          field set and the same iam caveats; the index template and
          detections are shared with the CSV route rather than duplicated per
          format.
    fields:
    - vendor: EventID
      type: enum
      description: >-
        LEEF header EventID carrying $subtype - login, logout, register-tag,
        unregister-tag
      ecs: event.action
      status: mapped
      transform: >-
        lifted from the header before the KV parse; event.outcome is the
        documented success constant, as on the other forms
    - vendor: AuthCompletionTime
      type: timestamp
      description: >-
        LEEF AuthCompletionTime=$factorcompletiontime - time the
        authentication factor completed
      ecs: null
      status: partial
      custom: panw.panos.userid.factor_completion_time
      notes: >-
        withheld from event.end; it is when a factor completed, not when the
        mapping's validity ends
    - vendor: AuthFactorNo
      type: long
      description: >-
        LEEF AuthFactorNo=$factorno - primary authentication (1) or an
        additional factor (2, 3)
      ecs: null
      status: unmapped
      custom: panw.panos.userid.factor_number
    - vendor: AuthenticatedUserDomain
      type: string
      description: LEEF AuthenticatedUserDomain - domain component of the account
      ecs: user.domain
      status: mapped
    - vendor: AuthenticatedUserName
      type: string
      description: LEEF AuthenticatedUserName - the authenticated account name
      ecs: user.name
      status: partial
      notes: >
        the Cortex Data Lake schema's pre-split account name; a firewall's own
        template carries the account in usrName instead, so the pipeline takes
        whichever is present and must not concatenate the two
    - vendor: AuthenticatedUserUUID
      type: string
      description: LEEF AuthenticatedUserUUID - unique identifier of the account
      ecs: user.id
      status: partial
      notes: >-
        populated only where the identity source supplies an identifier; empty
        from a firewall's own template, so no detection may require it
    - vendor: CountofRepeats
      type: long
      description: LEEF CountofRepeats=$repeatcnt - repeat count within five seconds
      ecs: null
      status: unmapped
      custom: panw.panos.userid.repeat_count
    - vendor: srcPort
      type: port
      description: 'LEEF srcPort=$beginport - first port of a multi-user mapping''s port range'
      ecs: null
      status: partial
      custom: panw.panos.userid.begin_port
      notes: withheld from source.port; the record describes no session
    - vendor: dstPort
      type: port
      description: 'LEEF dstPort=$endport - last port of a multi-user mapping''s port range'
      ecs: null
      status: partial
      custom: panw.panos.userid.end_port
      notes: withheld from destination.port; the record describes no peer
    - vendor: DGHierarchyLevel1 to DGHierarchyLevel4
      type: long
      description: LEEF DGHierarchyLevel1 to DGHierarchyLevel4 - device group hierarchy identifiers
      ecs: null
      status: unmapped
      custom: panw.panos.device_group_hierarchy
    - vendor: EventIdName
      type: string
      description: LEEF EventIdName=$eventid - the name of the User-ID event
      ecs: event.code
      status: mapped
    - vendor: IsDuplicateUser
      type: string
      description: LEEF IsDuplicateUser - whether duplicate users were found during group mapping
      ecs: null
      status: unmapped
      custom: panw.panos.userid.duplicate_user
    - vendor: DeviceSN
      type: string
      description: LEEF DeviceSN=$serial - firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: DeviceName
      type: string
      description: LEEF DeviceName=$device_name - firewall hostname
      ecs: observer.name
      status: mapped
    - vendor: TimeReceived
      type: timestamp
      description: LEEF TimeReceived=$receive_time - management-plane receive time
      ecs: null
      status: partial
      custom: panw.panos.receive_time
      notes: withheld from @timestamp, which comes from devTime=$time_generated
    - vendor: cat
      type: string
      description: LEEF cat - the log type, value USERID
      ecs: null
      status: partial
      notes: >
        LEEF cat is the log type; CEF cat on this same log is the event id.
        Read to select the grammar and then dropped, exactly as the CSV type
        column is: withheld from event.dataset, which is set from the route so
        a payload attribute cannot redirect a record, and given no custom home
        because the value is constant across the dataset.
    - vendor: MappingDataSource
      type: string
      description: LEEF MappingDataSource=$datasource - the class of source the mapping came from
      ecs: null
      status: unmapped
      custom: panw.panos.userid.datasource
      notes: keep in the default field set with the rest of the provenance triple
    - vendor: MappingDataSourceName
      type: string
      description: >-
        LEEF MappingDataSourceName=$datasourcename - the specific User-ID
        source that sent the mapping
      ecs: null
      status: partial
      custom: panw.panos.userid.datasource_name
      notes: >-
        withheld from event.provider, which means the subsystem that emitted
        the record across this technology
    - vendor: MappingDataSourceType
      type: string
      description: >-
        LEEF MappingDataSourceType=$datasourcetype - the mechanism used within
        that source
      ecs: null
      status: unmapped
      custom: panw.panos.userid.datasource_type
    - vendor: MappingTimeout
      type: long
      description: LEEF MappingTimeout=$timeout - the timeout after which the mapping is cleared
      ecs: null
      status: partial
      custom: panw.panos.userid.timeout
      notes: >
        Declared TTL in an undocumented unit; the sampled values read as
        seconds against PAN-OS's 45-minute default, so confirm the unit
        against the deployment before a detection materialises a validity
        window from it. Withheld from event.end because the binding can also
        end early.
    - vendor: MFAFactorType
      type: string
      description: LEEF MFAFactorType=$factortype - vendor that completed the authentication factor
      ecs: null
      status: unmapped
      custom: panw.panos.userid.factor_type
    - vendor: SequenceNo
      type: long
      description: LEEF SequenceNo=$seqno - monotonic log sequence number
      ecs: event.sequence
      status: mapped
    - vendor: src
      type: ip
      description: LEEF src=$ip - the address the mapping binds
      ecs: source.ip
      status: partial
      notes: >-
        the subject of the record, not the source of a connection; carried on
        source.ip so the binding joins the sessions it explains, and appended
        to related.ip
    - vendor: Tag
      type: string
      description: LEEF Tag=$tag_name - tag registered against the dynamic user group
      ecs: null
      status: partial
      custom: panw.panos.userid.tag_name
      notes: withheld from the ECS tags array
    - vendor: devTime
      type: timestamp
      description: LEEF devTime=$time_generated - dataplane generation time
      ecs: '@timestamp'
      status: partial
      transform: >-
        LEEF pairs devTime with a devTimeFormat attribute, so pin the parse to
        the declared format rather than guessing, and apply the per-device
        timezone where the format carries no offset
      notes: >
        Partial for the same reason as the CSV time_generated column: the
        declared format has to be read off devTimeFormat and the value still
        needs the per-device timezone from the inventory enrichment before it
        is a point in time.
    - vendor: TimeGeneratedHighResolution
      type: timestamp
      description: >-
        LEEF TimeGeneratedHighResolution=$high_res_timestamp - millisecond
        receive time with a timezone designator
      ecs: null
      status: partial
      custom: panw.panos.high_res_timestamp
      notes: the tiebreaker when two bindings for one address land in the same second
    - vendor: UGFlags
      type: string
      description: LEEF UGFlags=$ugflags - user group mapping flags
      ecs: null
      status: partial
      custom: panw.panos.userid.ug_flags
      notes: split into discrete booleans low-side
    - vendor: usrName
      type: string
      description: LEEF usrName=$user - the account the address is bound to
      ecs: user.name
      status: partial
      transform: >-
        split the domain qualifier into user.domain and keep the original
        spelling custom; a firewall's own template puts the whole qualified
        name here
    - vendor: UserGroupFound
      type: string
      description: LEEF UserGroupFound - whether the account resolved to a user group
      ecs: null
      status: unmapped
      custom: panw.panos.userid.user_group_found
    - vendor: UserIdentifiedBySource
      type: string
      description: >-
        LEEF UserIdentifiedBySource=$userbysource - the username as the source
        reported it before normalization
      ecs: null
      status: partial
      custom: panw.panos.userid.user_by_source
      notes: >-
        diff against usrName; withheld from source.user.name so one document
        never carries two competing account strings
    - vendor: VirtualLocation
      type: string
      description: LEEF VirtualLocation=$vsys - virtual system
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
    - vendor: VirtualSystemID
      type: long
      description: LEEF VirtualSystemID=$vsys_id - virtual system identifier
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_id
    - vendor: VirtualSystemName
      type: string
      description: LEEF VirtualSystemName=$vsys_name - name of the virtual system
      ecs: null
      status: unmapped
      custom: panw.panos.vsys_name
- id: system
  name: System log
  description: >-
    system-level events (HA state changes, link status, daemon restarts,
    license, etc.)
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
    - hop: guard
      device: Everfox High Speed Guard
      constraints: allow-list on logs-panw.system destination data stream only
      notes: >
        Same confirmed crossing as the traffic route: current transport is a
        Cribl Syslog Destination on the __syslogout internal field carrying a
        CEF-structured string, with the high side parsing _raw through Extract
        JSON before Cribl fields and Routes; that leg is being retired in
        favour of the confirmed plan of record, a low-side Cribl HTTP
        Destination to a high-side Cribl HTTP Source carrying NDJSON. The thin
        envelope shipped on this route therefore rides inside the syslog leg
        today and becomes an NDJSON line on the HTTP leg.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-panw.system
    direct:
    - hop: cribl
      location: edge Cribl worker group
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-panw.system
  formats:
  - format: syslog-csv
    recommended: true
    recommended_because: >-
      PAN-OS CSV is the native log format and the Elastic panw integration
      parses it as delivered; CEF requires pasting a custom template per log
      type and moves parsing into a Cribl pack.
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks
    fields:
    - vendor: eventid
      type: string
      description: string showing the name of the system event
      ecs: event.code
      status: mapped
    - vendor: object
      type: string
      description: name of the object associated with the system event
      ecs: null
      status: unmapped
      custom: panw.panos.system.object
      notes: the affected object name (interface, HA peer, license, etc.)
    - vendor: severity
      type: enum
      description: >-
        severity associated with the event, one of
        critical/high/medium/low/informational
      ecs: event.severity
      status: partial
      notes: >-
        same critical/high/medium/low/informational vocabulary as the threat
        log; needs the same numeric lookup transform
    - vendor: opaque
      type: string
      description: detailed description of the event, up to 512 bytes
      ecs: message
      status: mapped
    - vendor: device_name
      type: string
      description: hostname of the firewall on which the event was logged
      ecs: observer.name
      status: mapped
    - vendor: subtype
      type: enum
      description: system daemon that generated the log (ha, ntpd, routing, dhcp, vpn, userid, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.system.subtype
      notes: PAN-OS module that raised the event (e.g. ha, ntpd, routing)
    - vendor: result
      description: >-
        success/failure outcome text some system subtypes embed in the event;
        not a documented system log column
      ecs: event.outcome
      status: partial
      notes: not every system subtype populates a clean success/failure result string
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Ship the thin envelope (_dataId, @timestamp, host, _raw) for this
          low-volume route instead of teaching the low-side pipeline every
          PAN-OS system subtype grammar, with _dataId set to the
          logs-panw.system route key; the 512-byte event description is
          effectively the whole record, so _raw earns its place here. Validate
          the envelope against a Schema Library schema with a dead-letter
          route for failures and use Persistent Queue backpressure on the
          guard destination, and attach the device-to-owner/site enrichment
          low-side where the inventory lookup already lives.
        elastic: >
          Let the Palo Alto integration's system ingest pipeline do the
          extraction and add a logs-panw.system@custom pipeline for the two
          gaps this map records: the severity string to numeric event.severity
          lookup (same table as the threat dataset), and a subtype-conditional
          derivation of event.outcome that leaves the field unset rather than
          guessing for the subtypes that emit no clean success/failure text.
          Map the system object and system subtype custom fields as keyword in
          the custom namespace so HA and interface-flap dashboards can
          aggregate on them.
        relay: >
          Only the thin envelope crosses, so the guard sees one stable JSON
          schema shared with every other dataset on this technology rather
          than a vendor CSV grammar - and no CEF, since the ArcSight-era
          templates are retired low-side. The unbounded free-text description
          carried inside _raw is the sole content-filter exposure: cap the
          _raw length and strip control and non-UTF-8 characters before the
          guard destination. At-most-once crossing; reconcile counts per
          (dataset, hour). The envelope rides the confirmed transport: a Cribl
          Syslog Destination on a CEF-structured __syslogout value today,
          unpacked high-side from _raw by an Extract JSON parser before Cribl
          fields and Routes, moving to the confirmed plan of record of a
          low-side Cribl HTTP Destination to a high-side Cribl HTTP Source
          carrying NDJSON. AST/file drop is a replay-capable fallback only.
      direct:
        parse_location: hybrid
        cribl: >
          High-side instances skip the guard. Ship the thin envelope (_dataId,
          @timestamp, host, _raw) for this low-volume route instead of
          teaching the edge pipeline every PAN-OS system subtype grammar, with
          _dataId set to the logs-panw.system route key; the 512-byte event
          description is effectively the whole record, so _raw earns its place
          here. Validate the envelope against a Schema Library schema with a
          dead-letter route for failures and use Persistent Queue backpressure
          on the onward Elastic destination, and attach the
          device-to-owner/site enrichment at the edge worker group where the
          inventory lookup already lives.
        elastic: >
          Let the Palo Alto integration's system ingest pipeline do the
          extraction and add a logs-panw.system@custom pipeline for the two
          gaps this map records: the severity string to numeric event.severity
          lookup (same table as the threat dataset), and a subtype-conditional
          derivation of event.outcome that leaves the field unset rather than
          guessing for the subtypes that emit no clean success/failure text.
          Map the system object and system subtype custom fields as keyword in
          the custom namespace so HA and interface-flap dashboards can
          aggregate on them.
  - format: syslog-cef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      System: paste the vendor System CEF template (CEF:0|Palo Alto
      Networks|PAN-OS|$sender_sw_version|$subtype|$type|
      $number-of-severity|rt=$cef-formatted-receive_time
      deviceExternalId=$serial cs3=$vsys fname=$object flexString2=$module
      msg=$opaque externalId=$seqno cat=$eventid ...). Per-log-type tab.
      System logs are generated by the firewall itself, so no security-rule
      Log Forwarding Profile is involved - the Syslog profile is selected
      directly under Device > Log Settings > System.
    references:
    - >-
      https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-90-cef-configuration-guide.pdf
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/common-logs/common-system-log/common-system-cef-fields
    parsing:
      mechanism: cribl-pack
      artifact: >-
        Cribl Pack for Palo Alto Networks (CEF pre-parse) OR Elastic Palo Alto
        integration
      notes: >
        Same two paths as the other CEF forms. System specifics: the daemon
        ($subtype) and the severity ($number-of-severity) both live in the CEF
        header rather than an extension key, so both must be lifted from the
        header, and the numeric ECS event.severity lookup runs on the header
        value. Which header slot carries the daemon depends on the envelope,
        and this is a genuine trap: on the on-box template pasted in this
        entry's enable: block $subtype is slot 5, Device Event Class ID, and
        $type (the constant log type SYSTEM) is slot 6, Name; on Cortex Data
        Lake / LF 2.0 forwarding the two are reversed, with Device Event Class
        ID carrying log_type and Name carrying sub_type. This entry documents
        the firewall-direct template, so lift the daemon from Device Event
        Class ID here - the same parser pointed at a Cortex Data Lake feed
        lands the constant SYSTEM in panw.panos.system.subtype. The event id
        is cat=$eventid (an extension), the free-text description is
        msg=$opaque. Because the whole record is effectively the description,
        a thin envelope carrying _raw is a defensible alternative to teaching
        the parser every system subtype grammar.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          For this low-volume route, ship the thin envelope ({_dataId,
          @timestamp, host, _raw}) with _dataId set to the logs-panw.system
          route key rather than teaching the low-side pipeline every subtype
          grammar - the msg=$opaque description is effectively the whole
          record, so _raw earns its place. Lift the header daemon and severity
          into fields even in envelope mode so routing and the
          numeric-severity lookup work. Validate the envelope against a Schema
          Library schema with a dead-letter route and Persistent Queue
          backpressure on the guard destination, and attach the
          device-to-owner/site enrichment low-side.
        elastic: >
          Let the Palo Alto integration's system pipeline (or an @custom
          pipeline) extract cat=$eventid to event.code and msg=$opaque to
          message, run the severity-string-to-numeric lookup shared with the
          threat dataset, and map the object/module/subtype/vsys customs as
          keyword so HA and interface-flap dashboards can aggregate.
        relay: >
          Only the thin envelope crosses, so the guard sees one stable JSON
          schema shared with every other dataset rather than a CEF grammar.
          The unbounded free-text msg=$opaque inside _raw is the sole
          content-filter exposure: cap _raw length and strip control/
          non-UTF-8 characters before the guard destination. At-most-once
          crossing; reconcile counts per (dataset, hour).
      direct:
        parse_location: high
        cribl: >
          High-side instances skip the guard: pass the CEF through with
          Persistent Queue backpressure and let the integration/@custom
          pipeline parse at the core group.
        elastic: >
          Let the Palo Alto integration's system pipeline (or an @custom
          pipeline) extract cat=$eventid to event.code and msg=$opaque to
          message, run the severity-string-to-numeric lookup shared with the
          threat dataset, and map the object/module/subtype/vsys customs as
          keyword so HA and interface-flap dashboards can aggregate.
    fields:
    - vendor: cat
      type: string
      description: CEF cat=$eventid - string name of the system event
      ecs: event.code
      status: mapped
    - vendor: msg
      type: string
      description: CEF msg=$opaque - detailed free-text description of the event (up to 512 bytes)
      ecs: message
      status: mapped
    - vendor: dvchost
      type: string
      description: $device_name - firewall hostname that logged the event
      ecs: observer.name
      status: mapped
    - vendor: deviceExternalId
      type: string
      description: $serial - firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: externalId
      type: string
      description: CEF externalId=$seqno - monotonic log sequence number
      ecs: event.sequence
      status: mapped
    - vendor: subtype
      type: enum
      description: >-
        CEF header slot 5, Device Event Class ID, on the firewall-direct
        template this entry documents, carrying $subtype - the daemon that
        generated the log (ha, ntpd, routing, dhcp, vpn, userid, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.system.subtype
      notes: >-
        carried in the CEF header, not an extension key, and which header slot
        holds it depends on the envelope - a genuine trap: the on-box template
        pasted in this entry's enable: block puts $subtype in slot 5, Device
        Event Class ID, with $type (the constant log type SYSTEM) in slot 6,
        Name, while Cortex Data Lake / LF 2.0 forwarding reverses the pair
        (Device Event Class ID = log_type, Name = sub_type). This entry
        documents the firewall-direct template, so lift from Device Event
        Class ID here; a parser pinned to that slot against a Cortex Data Lake
        feed lands the constant SYSTEM in panw.panos.system.subtype instead of
        the daemon
    - vendor: severity
      type: enum
      description: >-
        CEF header severity carrying $number-of-severity -
        critical/high/medium/low/informational mapped to the 0-10 CEF scale
      ecs: event.severity
      status: partial
      transform: >
        carried in the CEF header severity slot, not an extension key; lift
        from the header and map to the numeric ECS event.severity scale (same
        lookup as the threat dataset)
    - vendor: fname
      type: string
      description: >-
        CEF fname=$object - name of the object associated with the event
        (interface, HA peer, license, ...)
      ecs: null
      status: unmapped
      custom: panw.panos.system.object
    - vendor: flexString2
      type: string
      description: >-
        labelled Module - CEF flexString2=$module, the module within the
        daemon that raised the event
      ecs: null
      status: unmapped
      custom: panw.panos.system.module
    - vendor: cs3
      type: string
      description: labelled Virtual System - CEF cs3=$vsys, vsys context of the event
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
  - format: syslog-leef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      System: paste the vendor LEEF 2.0 System template (header EventID
      carrying the event name, then Severity/SubType/EventDescription/
      DeviceSN/LogSourceName/VirtualLocation/SequenceNo ...). Selected under
      Device > Log Settings > System like the CEF form.
    references:
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/common-logs/common-system-log/common-system-leef-fields
    - >-
      https://knowledgebase.paloaltonetworks.com/KCSArticleDetail?id=kA10g000000ClEcCAK
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (LEEF pre-parse)
      notes: >
        KV parse the LEEF body and re-key to ECS/custom. The documented LEEF
        system key set is the platform-common vocabulary (shared with
        endpoint/agent sources), so the firewall-specific object and module
        values arrive folded into EventComponent/EventDescription rather than
        as discrete Object/Module keys - reported as a field-inventory gap.
        Severity is a discrete Severity key needing the numeric lookup.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Same thin-envelope treatment as the CEF system route for this
          low-volume dataset: ship {_dataId, @timestamp, host, _raw} with the
          header EventID and Severity lifted into fields for routing and the
          numeric-severity lookup, validate against a Schema Library schema
          with a dead-letter route, and use Persistent Queue backpressure on
          the guard destination.
        elastic: >
          Extract EventID to event.code and EventDescription to message in an
          @custom pipeline, run the severity lookup, and map SubType/
          VirtualLocation as keyword customs.
        relay: >
          Only the thin envelope crosses; cap _raw length and strip control/
          non-UTF-8 characters before the guard. At-most-once crossing;
          reconcile counts per (dataset, hour).
      direct:
        parse_location: high
        cribl: >
          High-side instances pass LEEF through with Persistent Queue
          backpressure and parse at the core group.
        elastic: >
          Extract EventID to event.code and EventDescription to message in an
          @custom pipeline, run the severity lookup, and map SubType/
          VirtualLocation as keyword customs.
    fields:
    - vendor: EventID
      type: string
      description: LEEF header EventID carrying the system event name
      ecs: event.code
      status: mapped
    - vendor: EventDescription
      type: string
      description: LEEF EventDescription=$opaque - free-text description of the event
      ecs: message
      status: mapped
    - vendor: Severity
      type: enum
      description: LEEF Severity=$severity - critical/high/medium/low/informational
      ecs: event.severity
      status: partial
      transform: lookup the string vocabulary into the numeric ECS event.severity scale
    - vendor: LogSourceName
      type: string
      description: LEEF LogSourceName=$device_name - firewall hostname
      ecs: observer.name
      status: mapped
    - vendor: DeviceSN
      type: string
      description: LEEF DeviceSN=$serial - firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: SequenceNo
      type: string
      description: LEEF SequenceNo=$seqno - monotonic log sequence number
      ecs: event.sequence
      status: mapped
    - vendor: SubType
      type: enum
      description: LEEF SubType=$subtype - the daemon/log subtype that generated the event
      ecs: null
      status: unmapped
      custom: panw.panos.system.subtype
    - vendor: VirtualLocation
      type: string
      description: LEEF VirtualLocation=$vsys - vsys context of the event
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
- id: config
  name: Configuration log
  description: administrative configuration changes made via CLI, web UI, or API
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
    - hop: guard
      device: Everfox High Speed Guard
      constraints: allow-list on logs-panw.config destination data stream only
      notes: >
        Same confirmed crossing as the traffic route: current transport is a
        Cribl Syslog Destination on the __syslogout internal field carrying a
        CEF-structured string, with the high side parsing _raw through Extract
        JSON before Cribl fields and Routes; that leg is being retired in
        favour of the confirmed plan of record, a low-side Cribl HTTP
        Destination to a high-side Cribl HTTP Source carrying NDJSON.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-panw.config
    direct:
    - hop: cribl
      location: edge Cribl worker group
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-panw.config
  formats:
  - format: syslog-csv
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks
    fields:
    - vendor: admin
      type: string
      description: username of the administrator performing the configuration
      ecs: user.name
      status: mapped
    - vendor: host
      type: string
      description: hostname or IP address of the client machine the administrator connected from
      ecs: source.address
      status: partial
      notes: >-
        client address the admin session originated from; field name collides
        with the ECS host.* namespace so downstream renaming needs care. The
        column holds either form, and source.ip is typed `ip` and rejects a
        hostname, so the value lands on source.address and branches to
        source.ip or source.domain by value shape - the same ruling the config
        syslog-cef `shost` row carries
    - vendor: cmd
      type: enum
      description: >-
        command performed by the administrator (add, clone, commit, delete,
        edit, move, rename, set)
      ecs: event.action
      status: mapped
    - vendor: result
      type: enum
      description: result of the configuration action (Submitted, Succeeded, Failed, Unauthorized)
      ecs: event.outcome
      status: mapped
    - vendor: path
      type: string
      description: path of the configuration command issued, up to 512 bytes
      ecs: null
      status: unmapped
      custom: panw.panos.config.path
      notes: XPath of the changed configuration node
    - vendor: before-change-detail
      type: string
      description: full xpath before the configuration change (custom log format only)
      ecs: null
      status: unmapped
      custom: panw.panos.config.before_change_detail
    - vendor: after-change-detail
      type: string
      description: full xpath after the configuration change (custom log format only)
      ecs: null
      status: unmapped
      custom: panw.panos.config.after_change_detail
    - vendor: device_name
      type: string
      description: hostname of the firewall on which the change was logged
      ecs: observer.name
      status: mapped
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the configuration CSV low-side into ECS JSON and mask before
          anything leaves the enclave: the before/after change-detail columns
          carry raw configuration XML, so redact password, hash, secret and
          API-key nodes and cap each detail blob and the configuration path at
          their documented 512-byte length. Rename the vendor host column
          explicitly to the source address on the way in so it never collides
          with the ECS host.* namespace downstream. Validate against a Schema
          Library schema with a dead-letter route and Persistent Queue
          backpressure ahead of the guard destination, and drop _raw once the
          redaction rules are proven - unredacted configuration commands are
          precisely what must not cross.
        elastic: >
          Land in logs-panw.config with custom-namespace mappings for the
          configuration path and the before/after change-detail fields,
          keeping the two detail blobs out of the default field set given
          their size. Normalize the vendor result vocabulary rather than
          copying it verbatim: only Succeeded and Failed map to the ECS
          event.outcome values, so Submitted and Unauthorized need explicit
          handling (unknown outcome, with the distinction preserved in
          event.action or a custom field) or admin-activity dashboards will
          undercount denied changes.
        relay: >
          Redacted, full ECS JSON crosses the guard - the boundary must never
          see raw before/after configuration XML, which is the least bounded
          and highest-risk content on this technology. Hold the JSON to two
          levels of nesting with short ASCII keys, no duplicate keys and
          bounded string lengths so the content filter's decisions are
          deterministic. Crossing is at-most-once with no acknowledgement:
          reconcile low-side and high-side counts per (dataset, hour), which
          matters more here than elsewhere because config changes are
          low-volume and individually significant. Transport is confirmed: a
          Cribl Syslog Destination on a CEF-structured __syslogout value
          today, with the high side parsing _raw through Extract JSON before
          Cribl fields and Routes, retiring in favour of the confirmed plan of
          record - low-side Cribl HTTP Destination to high-side Cribl HTTP
          Source carrying NDJSON. AST/file drop is a replay-capable fallback
          only.
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard. Parse the configuration CSV into
          ECS JSON at the edge worker group and mask before the record
          persists anywhere: the before/after change-detail columns carry raw
          configuration XML, so redact password, hash, secret and API-key
          nodes and cap each detail blob and the configuration path at their
          documented 512-byte length. Rename the vendor host column explicitly
          to the source address on the way in so it never collides with the
          ECS host.* namespace downstream. Validate against a Schema Library
          schema with a dead-letter route and Persistent Queue backpressure on
          the onward Elastic destination, and drop _raw once the redaction
          rules are proven - unredacted configuration commands must not
          persist anywhere.
        elastic: >
          Land in logs-panw.config with custom-namespace mappings for the
          configuration path and the before/after change-detail fields,
          keeping the two detail blobs out of the default field set given
          their size. Normalize the vendor result vocabulary rather than
          copying it verbatim: only Succeeded and Failed map to the ECS
          event.outcome values, so Submitted and Unauthorized need explicit
          handling (unknown outcome, with the distinction preserved in
          event.action or a custom field) or admin-activity dashboards will
          undercount denied changes.
  - format: syslog-cef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      Config: paste the vendor Config CEF template (CEF:0|Palo Alto
      Networks|PAN-OS|$sender_sw_version|$result|$type|1|
      rt=$cef-formatted-receive_time deviceExternalId=$serial shost=$host
      cs3=$vsys act=$cmd duser=$admin destinationServiceName=$client msg=$path
      externalId=$seqno ... cs1=$before-change-detail
      cs2=$after-change-detail). Per-log-type tab; selected under Device > Log
      Settings > Config. The before/after change-detail slots are only
      populated when the profile template includes them.
    references:
    - >-
      https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-90-cef-configuration-guide.pdf
    - >-
      https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/config-log-fields
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (CEF pre-parse)
      notes: >
        Same two paths as the other CEF forms. Config specifics: the result
        (Submitted/Succeeded/Failed/Unauthorized) is CEF header slot 5, Device
        Event Class ID ($result), and must be lifted from the header to
        event.outcome - slot 6, Name, carries the constant log type CONFIG, so
        a parser that reaches for Name gets the same value on every record;
        cs1/cs2 carry raw before/after configuration XML that must be redacted
        low-side; msg=$path holds the XPath and destinationServiceName
        =$client the connection type (Web/CLI/Panorama). shost=$host is the
        admin's client address and collides with the ECS host.* namespace, so
        rename it explicitly on ingest.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the Config CEF low-side into ECS NDJSON and mask before
          anything leaves the enclave: cs1/cs2 carry raw configuration XML, so
          redact password/hash/secret/api-key nodes and cap each blob and the
          msg=$path XPath at their documented lengths. Lift $result into
          event.outcome off header slot 5, Device Event Class ID, not the Name
          slot, which is the constant CONFIG. Rename shost=$host explicitly to
          the source address so it never collides with the ECS host.*
          namespace downstream. Validate against a Schema Library schema with
          a dead-letter route and Persistent Queue backpressure ahead of the
          guard, and drop _raw once redaction is proven - unredacted config
          commands are exactly what must not cross.
        elastic: >
          Land in logs-panw.config with custom mappings for the XPath and the
          before/after change-detail fields, keeping the two XML blobs out of
          the default field set given their size. Normalize the result
          vocabulary rather than copying it: only Succeeded/Failed map to ECS
          event.outcome values, so Submitted/Unauthorized need explicit
          handling (unknown outcome, distinction preserved in event.action or
          a custom field) or admin-activity dashboards undercount denied
          changes.
        relay: >
          Redacted, full ECS NDJSON crosses the guard - the boundary must
          never see raw before/after configuration XML, the least bounded and
          highest-risk content on this technology. Hold the JSON to two levels
          of nesting with short ASCII keys, no duplicate keys and bounded
          string lengths so content-filter decisions are deterministic.
          At-most-once crossing with no acknowledgement; reconcile counts per
          (dataset, hour), which matters more here because config changes are
          low-volume and individually significant.
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard but still parse CEF to ECS NDJSON
          at the edge with the same XML redaction (unredacted config must not
          persist anywhere) and Persistent Queue backpressure.
        elastic: >
          Land in logs-panw.config with custom mappings for the XPath and the
          before/after change-detail fields, keeping the two XML blobs out of
          the default field set given their size. Normalize the result
          vocabulary rather than copying it: only Succeeded/Failed map to ECS
          event.outcome values, so Submitted/Unauthorized need explicit
          handling (unknown outcome, distinction preserved in event.action or
          a custom field) or admin-activity dashboards undercount denied
          changes.
    fields:
    - vendor: duser
      type: string
      description: CEF duser=$admin - username of the administrator performing the change
      ecs: user.name
      status: mapped
    - vendor: act
      type: enum
      description: >-
        CEF act=$cmd - command performed (add, clone, commit, delete, edit,
        move, rename, set)
      ecs: event.action
      status: mapped
    - vendor: result
      type: enum
      description: >-
        CEF header slot 5, Device Event Class ID, carrying $result - outcome
        of the change (Submitted, Succeeded, Failed, Unauthorized)
      ecs: event.outcome
      status: partial
      transform: >
        carried in the CEF header, not an extension key, and in slot 5 rather
        than slot 6 on the on-box template this entry documents - Name holds
        the constant log type CONFIG there, so a parser that reaches for Name
        stamps every record with the same value, while Cortex Data Lake / LF
        2.0 forwarding reverses the pair; only Succeeded/ Failed map cleanly
        to ECS event.outcome - Submitted/Unauthorized need explicit handling
        to avoid undercounting denied changes
    - vendor: shost
      type: string
      description: >-
        CEF shost=$host - hostname or IP of the client machine the
        administrator connected from
      ecs: source.address
      status: partial
      notes: >
        admin client address; the CEF key is shost (a hostname slot) but the
        value may be an IP, and it collides with the ECS host.* namespace, so
        rename explicitly and route to source.ip vs source.domain by value
        shape
    - vendor: destinationServiceName
      type: string
      description: >-
        CEF destinationServiceName=$client - the interface the change came
        through (Web, CLI, Panorama, XML-API)
      ecs: null
      status: unmapped
      custom: panw.panos.config.client
    - vendor: msg
      type: string
      description: CEF msg=$path - XPath of the changed configuration node (up to 512 bytes)
      ecs: null
      status: unmapped
      custom: panw.panos.config.path
    - vendor: cs1
      type: string
      description: >-
        labelled Before Change Detail - CEF cs1=$before-change-detail,
        configuration XML before the change
      ecs: null
      status: unmapped
      custom: panw.panos.config.before_change_detail
      notes: >-
        raw configuration XML; redact secrets and cap length low-side before
        any crossing
    - vendor: cs2
      type: string
      description: >-
        labelled After Change Detail - CEF cs2=$after-change-detail,
        configuration XML after the change
      ecs: null
      status: unmapped
      custom: panw.panos.config.after_change_detail
      notes: >-
        raw configuration XML; redact secrets and cap length low-side before
        any crossing
    - vendor: externalId
      type: string
      description: CEF externalId=$seqno - monotonic log sequence number
      ecs: event.sequence
      status: mapped
    - vendor: dvchost
      type: string
      description: $device_name - firewall hostname on which the change was logged
      ecs: observer.name
      status: mapped
    - vendor: deviceExternalId
      type: string
      description: $serial - firewall chassis serial number
      ecs: observer.serial_number
      status: mapped
    - vendor: cs3
      type: string
      description: labelled Virtual System - CEF cs3=$vsys, vsys context of the change
      ecs: null
      status: unmapped
      custom: panw.panos.vsys
  - format: syslog-leef
    enable: >
      Device > Server Profiles > Syslog > (profile) > Custom Log Format >
      Config: paste the vendor LEEF 2.0 Config template. Selected under Device
      > Log Settings > Config like the CEF form; the change-detail keys are
      only populated when the template includes them.
    references:
    - >-
      https://docs.paloaltonetworks.com/cortex/cortex-data-lake/log-forwarding-schema-reference/common-logs/common-configuration-log/common-config-leef-fields
    - >-
      https://knowledgebase.paloaltonetworks.com/KCSArticleDetail?id=kA10g000000ClEcCAK
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for Palo Alto Networks (LEEF pre-parse)
      notes: >
        KV parse the LEEF body and re-key to the same ECS/custom targets as
        the Config CEF/CSV forms (admin->user.name, cmd->event.action,
        result->event.outcome, path and before/after change detail to the
        panw.panos.config.* customs). The exact LEEF key spellings for the
        config log were not renderable from the vendor schema reference, so
        the field table is left open and reported as a gap - validate the key
        names against a live device or the QRadar LEEF guide before pinning
        the pipeline. The same XML redaction the CEF form needs applies.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse LEEF to redacted ECS NDJSON low-side with the same masking as
          the Config CEF route (redact secrets in the change-detail XML, cap
          blob and path lengths, lift result to event.outcome), validate
          against a Schema Library schema with a dead-letter route, and use
          Persistent Queue backpressure ahead of the guard. Drop _raw once
          redaction is proven.
        elastic: >
          Land in logs-panw.config with the change-detail and path customs and
          the result-vocabulary normalization, same as the CEF route.
        relay: >
          Redacted ECS NDJSON crosses the guard; raw configuration XML must
          never reach the boundary. Two-level nesting, short ASCII keys,
          bounded lengths. At-most-once crossing; reconcile counts per
          (dataset, hour).
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard but still parse LEEF to redacted
          ECS NDJSON at the edge with Persistent Queue backpressure.
        elastic: >
          Land in logs-panw.config with the change-detail and path customs and
          the result-vocabulary normalization, same as the CEF route.
    fields_omitted: >
      The exact LEEF attribute spellings for the Config log do not render from
      the vendor schema reference, so the key names cannot be pinned here and
      the gap is reported rather than guessed; the values carried are the same
      admin, command, result, path and before/after change details the
      syslog-cef entry inventories.
    fields: []
