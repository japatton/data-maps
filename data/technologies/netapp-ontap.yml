- id: ems
  name: EMS event notifications
  description: >
    Event Management System notifications — ONTAP's cataloged, syslog-based
    messaging facility for system events (hardware, protocol stack,
    replication, and the secd security daemon). Forwarded with `event
    notification destination create -syslog` over UDP, TCP, or from 9.12.1
    TLS. Message names follow a dot-separated tree (kern.uptime.filer,
    secd.auth.noAuthEntry, wafl.vol.full) and the payload is a set of quoted
    key="value" parameters whose keys differ per message definition. EMS
    explicitly does NOT carry command history or administrative auditing —
    that is the audit.log dataset — so this feed is the system-state
    complement, not a substitute.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Receives the EMS notification destination stream.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-netapp_ontap.ems
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Receives the EMS notification destination stream.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-netapp_ontap.ems
  formats:
  - format: syslog-kv
    parsing:
      mechanism: cribl-pipeline
      artifact: custom NetApp ONTAP EMS pipeline
      notes: >
        No Elastic integration and no Cribl pack exists. Two syslog framings
        must be handled — legacy-netapp (<PRIVAL>TIMESTAMP
        [HOSTNAME:Event-name:Event-severity]: MSG) and RFC-5424
        (<PRIVAL>VERSION TIMESTAMP HOSTNAME Event-source - Event-name - MSG) —
        because the format is a per-destination setting.
    fields:
    - vendor: Event-name
      type: string
      description: >-
        dot-separated EMS message name identifying the event definition, e.g.
        secd.auth.noAuthEntry
      ecs: event.code
      status: mapped
      notes: >-
        the stable catalog identifier for the event; the tree prefix (secd.,
        wafl., cifs.) is what should drive event.category assignment
    - vendor: Event-severity
      type: enum
      description: >-
        EMS severity: EMERGENCY, ALERT, CRITICAL, ERROR, WARNING, NOTICE,
        INFORMATIONAL, DEBUG
      ecs: log.level
      status: mapped
      transform: >-
        the eight-value word scale needs an explicit lookup to reach ECS's
        numeric event.severity; the raw word is kept in log.level
    - vendor: node
      type: string
      description: cluster node that generated the event
      ecs: observer.hostname
      status: mapped
      notes: >-
        also copy to observer.name to match the management audit and NAS
        file-audit datasets
    - vendor: time
      type: timestamp
      description: time the event was generated on the node
      ecs: '@timestamp'
      status: mapped
    - vendor: index
      type: integer
      description: per-node monotonically increasing index assigned to each EMS event
      ecs: event.sequence
      status: mapped
      notes: >-
        only monotonic within a node and resets on reboot, so gap detection
        has to be scoped per node rather than per cluster
    - vendor: MSG
      type: string
      description: rendered human-readable event text
      ecs: message
      status: mapped
    - vendor: Event-source
      type: string
      description: >-
        ONTAP subsystem or process that raised the event, carried as the
        RFC-5424 APP-NAME
      ecs: null
      status: partial
      custom: netapp.ontap.ems.source
      notes: >-
        only present in the RFC-5424 framing; the legacy-netapp framing omits
        it entirely, so it cannot be a required field
    - vendor: parameters
      type: string
      description: >-
        quoted key="value" pairs specific to the message definition, e.g.
        replStatus="8", lineNumber="738"
      ecs: null
      status: partial
      custom: netapp.ontap.ems.parameters
      notes: >-
        the key set differs per EMS message definition across thousands of
        definitions, so it must be held as a bounded flattened object rather
        than promoted to top-level fields
    - vendor: PRIVAL
      type: integer
      description: syslog priority value encoding facility and severity in the message header
      ecs: log.syslog.priority
      status: mapped
      transform: >-
        decompose into facility (PRIVAL div 8) and severity (PRIVAL mod 8);
        the syslog severity is a transport artifact and does not always agree
        with the EMS Event-severity
    - vendor: facility
      type: enum
      description: syslog facility configured on the EMS notification destination
      ecs: log.syslog.facility.name
      status: mapped
    - vendor: vserver
      type: string
      description: storage VM the event is scoped to, on SVM-scoped EMS events
      ecs: null
      status: unmapped
      custom: netapp.ontap.svm
      notes: >-
        only cluster-scoped events omit it; the same custom field as the
        management audit dataset so the two join on tenancy
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Detect the framing before parsing, since legacy-netapp buries the
          message name and severity inside the bracketed tag while RFC-5424
          carries them as distinct header fields, then extract the quoted
          key="value" parameter bag. EMS ships thousands of message
          definitions with per-definition parameter keys, so allowlist both
          the message-name prefixes worth forwarding at all (secd., cifs.,
          nblade., audit., wafl.vol., cluster.) and the parameter keys that
          survive extraction — an unbounded key space here becomes an
          unbounded field space in Elastic. Run the destination on Persistent
          Queue backpressure.
        elastic: >
          Own a custom logs-netapp_ontap.ems ingest pipeline that converts the
          EMS severity words (EMERGENCY through DEBUG) into ECS's numeric
          event.severity through an explicit lookup instead of leaving the
          label alone, and assigns event.kind/event.category from the
          message-name prefix so secd.* authentication failures are
          categorized differently from wafl.* capacity events. Map
          netapp.ontap.ems.source and netapp.ontap.svm as keyword and hold the
          parameter bag as a flattened object in the index template, so a new
          message definition cannot cause a mapping explosion, and copy
          observer.hostname to observer.name to match the other two datasets.
        relay: >
          Low-side clusters cross with full ECS-shaped NDJSON (envelope mode
          B) with the parameter bag already flattened and key-allowlisted
          low-side — the guard's NDJSON filtering is likely custom work, and a
          per-message-definition key space is precisely what makes such a
          filter unmaintainable. Keep nesting to two levels, bound the
          rendered message text (EMS event text embeds paths, WWNs and vendor
          strings of unpredictable length), and note that the vendor emits
          syslog rather than CEF so no CEF conversion is involved. Drop _raw
          on this route before the file-audit route only if the parameter
          extraction is proven, since EMS text is the fallback when a new
          message definition is not yet modeled.
      direct:
        parse_location: low
        cribl: >
          Detect the framing before parsing, since legacy-netapp buries the
          message name and severity inside the bracketed tag while RFC-5424
          carries them as distinct header fields, then extract the quoted
          key="value" parameter bag. EMS ships thousands of message
          definitions with per-definition parameter keys, so allowlist both
          the message-name prefixes worth forwarding at all (secd., cifs.,
          nblade., audit., wafl.vol., cluster.) and the parameter keys that
          survive extraction — an unbounded key space here becomes an
          unbounded field space in Elastic. Run the destination on Persistent
          Queue backpressure.
        elastic: >
          Own a custom logs-netapp_ontap.ems ingest pipeline that converts the
          EMS severity words (EMERGENCY through DEBUG) into ECS's numeric
          event.severity through an explicit lookup instead of leaving the
          label alone, and assigns event.kind/event.category from the
          message-name prefix so secd.* authentication failures are
          categorized differently from wafl.* capacity events. Map
          netapp.ontap.ems.source and netapp.ontap.svm as keyword and hold the
          parameter bag as a flattened object in the index template, so a new
          message definition cannot cause a mapping explosion, and copy
          observer.hostname to observer.name to match the other two datasets.
  - format: api-pull
    enable: >
      No notification destination is required; poll `GET
      /api/support/ems/events` against a cluster management LIF with a
      read-only role scoped to the /api/support/ems command directory. Filter
      server-side with the documented query parameters -
      `message.severity=alert|error|...`, `message.name=<prefix>*`,
      `log_message=*<substring>*`, `time=>=<watermark>`, `max_records`, and
      `fields=` to return only the needed keys - and page with the returned
      `next` link. EMS ships thousands of message definitions, so scope the
      poll by message-name prefix (secd.*, cifs.*, nblade.*, audit.*,
      wafl.vol.*, cluster.*) at the API rather than pulling every event. This
      is a distinct control from `event notification destination create
      -syslog`; the two can run concurrently against the same catalog.
    references:
    - https://library.netapp.com/ecmdocs/ECMLP2870387/html/resources/ems_event.html
    - >-
      https://docs.netapp.com/us-en/ontap-restapi/support_ems_events_endpoint_overview.html
    - >-
      https://docs.netapp.com/us-en/ontap-automation/workflows/wf_ems_list_log_events.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom NetApp ONTAP EMS REST-collector pipeline
      notes: >
        No Elastic integration and no Cribl pack, so a Cribl REST Collector
        (or Elastic httpjson custom input) polls the endpoint and a hand-built
        pipeline maps the JSON. The framing-detection work the syslog form
        needs disappears - there is no legacy-netapp vs RFC-5424 header to
        disambiguate - because message name, severity and node arrive as typed
        JSON keys and the per-message parameters arrive as a structured
        {name,value} array rather than a quoted key="value" string that has to
        be tokenized. The remaining work is watermarking on the per-node
        index/time, allowlisting which parameter names survive (an unbounded
        key space is still unbounded in JSON), and the
        severity-word-to-numeric lookup.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Run the REST Collector low-side and allowlist at the API and again
          in the pipeline: scope the poll to the message-name prefixes worth
          forwarding (secd., cifs., nblade., audit., wafl.vol., cluster.) and
          flatten the parameters array to a bounded set of keys, because a
          per-message-definition key space becomes an unbounded field space in
          Elastic. Watermark on (node,index) so a restart does not re-ship,
          and run the Collector on Persistent Queue backpressure. Bound the
          log_message text low-side (EMS text embeds paths, WWNs and vendor
          strings of unpredictable length).
        elastic: >
          Own a custom logs-netapp_ontap.ems ingest pipeline shared with the
          syslog form: convert the EMS severity words (emergency through
          debug) to ECS's numeric event.severity through an explicit lookup,
          and assign event.kind/event.category from the message-name prefix so
          secd.* authentication failures categorize differently from wafl.*
          capacity events. Map netapp.ontap.ems.source and netapp.ontap.svm as
          keyword and hold the parameter bag as a flattened object so a new
          message definition cannot cause a mapping explosion, and copy
          observer.hostname to observer.name to match the other datasets.
        relay: >
          Low-side clusters cross with full ECS-shaped NDJSON (envelope mode
          B) with the parameter array already flattened and key-allowlisted
          low-side - the guard's NDJSON filtering is likely custom work, and a
          per-message-definition key space is exactly what makes such a filter
          unmaintainable. Keep nesting to two levels, bound the rendered
          log_message text, and note the vendor emits JSON here (not CEF) so
          no CEF conversion is involved. With no return channel, reconcile the
          collector's fetched-record count against the high-side ingested
          count per (cluster, hour).
      direct:
        parse_location: high
        cribl: >
          For a high-side cluster, point the REST Collector at the core worker
          group and poll the management LIF directly; keep the message-name
          allowlist so the field space stays bounded even without a boundary.
          Choose the REST poll OR the syslog destination as the authoritative
          EMS feed per cluster to avoid ingesting each event twice.
        elastic: >
          Own a custom logs-netapp_ontap.ems ingest pipeline shared with the
          syslog form: convert the EMS severity words (emergency through
          debug) to ECS's numeric event.severity through an explicit lookup,
          and assign event.kind/event.category from the message-name prefix so
          secd.* authentication failures categorize differently from wafl.*
          capacity events. Map netapp.ontap.ems.source and netapp.ontap.svm as
          keyword and hold the parameter bag as a flattened object so a new
          message definition cannot cause a mapping explosion, and copy
          observer.hostname to observer.name to match the other datasets. The
          advantage of this transport is the structured parameters array and
          the node uuid, which the syslog form does not carry - keep both so
          EMS events survive node renames and stay queryable by parameter
          without re-tokenizing a string.
    fields:
    - vendor: index
      type: integer
      description: per-node index assigned to each EMS event
      ecs: event.sequence
      status: mapped
      notes: >-
        monotonic within a node and resets on reboot, so gap detection has to
        be scoped per node rather than per cluster - the same semantics as the
        syslog form
    - vendor: time
      type: timestamp
      description: timestamp of the event
      ecs: '@timestamp'
      status: mapped
    - vendor: node.name
      type: string
      description: name of the node on which the event occurred
      ecs: observer.hostname
      status: mapped
      notes: >-
        also copy to observer.name to match the management audit and NAS
        file-audit datasets
    - vendor: node.uuid
      type: string
      description: UUID of the node on which the event occurred
      ecs: null
      status: unmapped
      custom: netapp.ontap.node_uuid
      notes: >-
        stable node identity that survives a rename; not carried in the syslog
        form, so it is a reason to prefer this transport for long-term node
        correlation
    - vendor: message.name
      type: string
      description: >-
        dot-separated EMS message name identifying the event definition, e.g.
        secd.auth.noAuthEntry
      ecs: event.code
      status: mapped
      notes: >-
        the stable catalog identifier; the tree prefix (secd., wafl., cifs.)
        is what should drive event.category assignment
    - vendor: message.severity
      type: enum
      description: >-
        severity of the message, as a lowercase word: emergency, alert, error,
        notice, informational, debug
      ecs: log.level
      status: mapped
      transform: >-
        the word scale needs an explicit lookup to reach ECS's numeric
        event.severity; the raw word is kept in log.level
    - vendor: log_message
      type: string
      description: 'formatted human-readable text populated with the event''s parameter details'
      ecs: message
      status: mapped
    - vendor: source
      type: string
      description: ONTAP subsystem or process that raised the event
      ecs: null
      status: partial
      custom: netapp.ontap.ems.source
      notes: >-
        the structured equivalent of the RFC-5424 APP-NAME the syslog form
        carries; kept in the custom namespace alongside the syslog dataset's
        field
    - vendor: parameters
      type: array
      description: >-
        list of {name,value} parameter objects specific to the message
        definition, e.g. name=repl_status value=8
      ecs: null
      status: partial
      custom: netapp.ontap.ems.parameters
      notes: >
        a typed array rather than the syslog form's quoted key="value" string,
        so no tokenizing is needed, but the key set still differs per message
        definition across thousands of definitions - hold it as a bounded
        flattened object rather than promoting to top-level fields
  - format: webhook
    enable: >
      Create a REST-API (webhook) destination and route events to it with a
      filter: `event notification destination create -name <name>
      -rest-api-url https://<receiver>/<path> [-certificate-authority <ca>
      -certificate-serial <serial>]`, then `event notification create
      -filter-name <filter> -destination <name>` where the filter selects the
      message names/severities to forward. ONTAP sends an HTTP POST to that
      URL with the event notification details formatted in XML. Use an
      https:// URL so ONTAP validates the receiver's certificate (and, if OCSP
      is enabled for EMS, checks revocation); a client certificate is
      presented when -certificate-authority/-certificate-serial are set. The
      POST body is XML only - per NetApp KB, the webhook destination does not
      emit JSON - so the receiver must accept and parse XML.
    references:
    - >-
      https://docs.netapp.com/us-en/ontap/error-messages/configure-webhooks-event-notifications-task.html
    - >-
      https://kb.netapp.com/on-prem/ontap/Ontap_OS/OS-KBs/Can_events_be_sent_to_a_webhook_application_in_JSON_format
    - >-
      https://docs.netapp.com/us-en/ontap-cli-9111/event-notification-destination-create.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom NetApp ONTAP EMS webhook pipeline
      notes: >
        A Cribl HTTP source (or any HTTPS listener) terminates the POST and a
        hand-built pipeline parses the XML body, then maps the EMS event
        content to the same ECS shape as the pull API and the syslog form. The
        value over the pull API is that it is push, not poll, so there is no
        watermarking and no collection lag - but it is fire-and-forget over
        HTTP, so a receiver outage drops events with no retry, and the XML
        element names of the body are not publicly documented, so the
        extraction has to be built against a captured sample. Prefer the pull
        API where a documented field contract matters and the webhook where
        near-real-time push is the requirement.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Terminate the POST on a low-side Cribl HTTP source, parse the XML
          body, and shape to the same ECS record as the EMS pull/syslog forms
          before the crossing. Because the push is fire-and-forget, instrument
          the receiver for gaps (a receiver outage silently drops events -
          there is no ONTAP-side retry queue) and, where completeness matters
          more than latency, back the webhook with the pull API as the
          authoritative feed. Allowlist the message-name prefixes at the ONTAP
          filter so only wanted events are POSTed at all, and bound the
          rendered message text low-side.
        elastic: >
          Reuse the custom logs-netapp_ontap.ems ingest pipeline and its
          severity-to-event.severity lookup and flattened-parameter mapping;
          the decoded webhook event is the same EMS record as the pull API, so
          it shares the data stream and mappings. Detect the transport by its
          envelope, not by re-parsing, so all three EMS transports normalize
          to one document shape.
        relay: >
          Cross full ECS-shaped NDJSON (envelope mode B), never the raw XML
          POST body - the parsed, allowlisted record is the shape the guard's
          custom NDJSON filter should inspect and is smaller than the verbose
          XML. Bound the rendered message text and the per-message parameter
          set low-side, keep nesting to two levels, and note the payload is
          XML (not CEF) so no CEF conversion is involved. With no return
          channel and a fire-and-forget source, reconcile per-hour counts
          across the guard and alert on receiver downtime as a collection gap.
      direct:
        parse_location: low
        cribl: >
          For a high-side cluster, terminate the POST on a receiver in the
          core worker group and parse the XML there; parse near the receiver
          because the body is fire-and-forget and cheapest normalized once at
          ingest. Still allowlist at the ONTAP filter and choose one
          authoritative EMS transport per cluster (webhook, pull, or syslog)
          to avoid triple-counting the same event.
        elastic: >
          Reuse the custom logs-netapp_ontap.ems ingest pipeline and its
          severity-to-event.severity lookup and flattened-parameter mapping;
          the decoded webhook event is the same EMS record as the pull API, so
          it shares the data stream and mappings, and all three EMS transports
          normalize to one document shape. With no boundary the webhook's only
          real tradeoff versus the pull API is reliability (no retry) for
          latency (immediate push), so adopt it where near-real-time EMS
          alerting is the driver and keep the pull API as the gap-filling
          reconciliation feed.
    fields_omitted: >
      NetApp documents that the webhook destination POSTs the event
      notification as XML but does not publish the element names of that body,
      so the only sourceable inventory is the EMS event content the syslog-kv
      and api-pull entries on this dataset already cover; the XML element
      names themselves have to be read off a captured POST from the cluster.
    fields: []
