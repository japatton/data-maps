      custom: netapp.ontap.audit.computer_uuid
      notes: >-
        stable identity that survives cluster and SVM renames; keep it as the
        join key when hostnames change
    - vendor: Provider Name
      type: string
      description: >-
        provider subsystem generating the event, always
        NetApp-Security-Auditing, carried as the Name attribute of the
        <Provider> element
      ecs: event.provider
      status: mapped
    - vendor: SubjectIP
      type: ip
      description: IPv4/IPv6 address of the client that initiated the event
      ecs: source.ip
      status: mapped
    - vendor: SubjectUserName
      type: string
      description: username of the user performing the access
      ecs: user.name
      status: mapped
    - vendor: SubjectDomainName
      type: string
      description: >-
        domain the user belongs to; for a local user it contains the SMB/CIFS
        server name
      ecs: user.domain
      status: mapped
      notes: >-
        the value silently changes meaning for local users, so pair it with
        SubjectUserSid before treating it as a directory domain
    - vendor: SubjectUserSid
      type: string
      description: 'the user''s Windows SID as resolved by ONTAP user mapping'
      ecs: user.id
      status: mapped
      notes: >-
        takes user.id because the SID is the canonical identity for SMB access
        and for multiprotocol-mapped NFS access
    - vendor: SubjectUnix
      type: string
      description: UNIX credentials of the user, a composite of UID, GID and a Local flag
      ecs: null
      status: partial
      custom: netapp.ontap.audit.subject_unix
      notes: >
        must be split into its three parts; the GID can go to group.id, but
        user.id is already occupied by the Windows SID, so the UNIX UID has no
        ECS home and stays in the custom namespace - the main identity gap for
        pure-NFS estates
    - vendor: ObjectName
      type: string
      description: >-
        full path of the accessed object relative to the volume, e.g.
        (Vol1);/dir1/file.txt
      ecs: file.path
      status: partial
      transform: >
        strip the leading "(volume);" prefix into netapp.ontap.volume and keep
        the remainder as file.path; on 4656 the path is the alternate data
        stream itself, while on 4663 it is the base file
    - vendor: ObjectType
      type: enum
      description: 'type of object accessed: File, Directory, Symbolic Link, Stream, or Unknown'
      ecs: file.type
      status: partial
      notes: >-
        ECS file.type covers file, dir and symlink; Stream and Unknown have no
        ECS value and must be carried in the custom namespace
    - vendor: HandleId
      type: string
      description: >-
        object handle, formatted
        <volume_identifier>;00;<file_identifier>;;<file_identifier_extended>
      ecs: null
      status: unmapped
      custom: netapp.ontap.audit.handle_id
      notes: >
        identifies the object, not a session or user, and is the only way to
