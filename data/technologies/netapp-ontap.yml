        Audit Success maps to success and Audit Failure to failure; Audit
        Failure here specifically means the operation was denied, not that the
        audit subsystem failed
    - vendor: TimeCreated SystemTime
      type: timestamp
      description: >-
        time the event was generated, carried as the SystemTime attribute of
        the <TimeCreated> element, YYYY-MM-DDThh:mm:ss.sZ in UTC
      ecs: '@timestamp'
      status: mapped
    - vendor: Computer
      type: string
      description: >-
        name of the generating system, formatted as <cluster_name>/<SVM_name>,
        in the <Computer> element
      ecs: observer.hostname
      status: partial
      transform: >-
        split on / - the cluster name becomes observer.hostname/observer.name
        and the SVM name becomes netapp.ontap.svm, so this dataset joins the
        management audit log
    - vendor: ComputerUUID
      type: string
      description: UUID identifier of the generating system, formatted as <cluster_uuid>/<svm_uuid>
