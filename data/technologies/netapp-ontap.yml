      status: mapped
      transform: >-
        SMB/CIFS is lowercased to smb and NFSv3/NFSv4 to nfs, with the version
        retained in the custom namespace
    - vendor: Result
      type: enum
      description: audit event type, Audit Success or Audit Failure, mirroring the Keywords bitmask
      ecs: event.outcome
      status: mapped
