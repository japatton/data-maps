      decision and which of the class/name and requested/granted fields ride
      on it. The decision content is what the `other` entry inventories as
      ACC_ columns, emitted under SDE key names.
    fields: []
- id: racf-command
  name: RACF command audit (SMF 80 events 08-24)
  description: >
    Audit records for RACF administrative commands - PERMIT (event code 19),
    ADDSD (08), ALTDSD (11), ALTUSER (13), CONNECT (14), RDEFINE (21),
    SETROPTS (24) and their siblings. Each command has its own IRRADU00
    column-id prefix (PERM_, AD_, ALD_, ALU_, CON_, RDEF_, SETR_) over the
    same 280-byte common header, so a parser keys off the EVENT_TYPE value in
    positions 1-8 and then applies the matching extension layout. The operands
    the administrator actually typed arrive as three 1,024-byte keyword blobs
    (_SPECIFIED, _FAILED, _IGNORED) whose internal order and format IBM
    explicitly excludes from the programming interface.
  event_categories:
  - iam
  - configuration
  route:
    guarded:
    - hop: other
      name: z/OS SMF dump plus IRRADU00 unload (or IBM Common Data Provider Data Streamer)
      notes: >
        Same delivery mechanism as the other type 80 datasets. Command records
        are low volume and high value, which makes them the worst fit for a
        long batch dump cycle - a privileged ALTUSER should not reach the CSOC
        a day late.
    - hop: cribl
      location: edge worker group, low-side enclave
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_racf.command
    direct:
    - hop: other
      name: z/OS SMF dump plus IRRADU00 unload (or IBM Common Data Provider Data Streamer)
      notes: >
        Same delivery mechanism as the other type 80 datasets. Command records
        are low volume and high value, which makes them the worst fit for a
        long batch dump cycle - a privileged ALTUSER should not reach the CSOC
        a day late.
    - hop: cribl
      location: edge worker group
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_racf.command
  formats:
  - format: other
    parsing:
      mechanism: cribl-pipeline
      artifact: custom IRRADU00 fixed-position pipeline
      notes: >
        Hand-built extraction with one branch per command extension layout; no
        vendor pack tracks new event codes, so unrecognized EVENT_TYPE values
        need an explicit fallback that keeps the common header.
    fields:
    - vendor: <col_id>_EVENT_TYPE
      type: string
      description: >-
        name of the RACF command that was audited (PERMIT, ADDSD, ALTDSD,
        ALTUSER, CONNECT, RDEFINE, SETROPTS, ...)
      ecs: event.action
      status: mapped
      notes: >
        IBM's own notation - <col_id> is replaced by the command's column
        identifier - and the value in positions 1-8 is what tells a parser
        which extension layout follows at position 282
    - vendor: <col_id>_EVENT_QUAL
      type: enum
      description: >-
        qualifier describing the command outcome (SUCCESS, INSAUTH, KEYWVIOL,
        SECLSUCC, SECLFAIL)
      ecs: event.reason
      status: mapped
      notes: >
        KEYWVIOL means the command ran but specific keywords were rejected for
        lack of authority - a partial success that neither success nor failure
        alone describes
    - vendor: <col_id>_VIOLATION
      type: enum
      description: whether this record represents a security violation (YES/NO)
      ecs: event.outcome
      status: mapped
      transform: YES becomes failure and NO becomes success
    - vendor: <col_id>_DATE_WRITTEN / <col_id>_TIME_WRITTEN
      type: timestamp
      description: >-
        date (yyyy-mm-dd) and time (hh:mm:ss) the record was written to SMF,
        in two separate fixed-position columns
      ecs: '@timestamp'
      status: partial
      transform: 'concatenate the two columns and apply the LPAR''s UTC offset'
    - vendor: <col_id>_SYSTEM_SMFID
      type: string
      description: four-character SMF system identifier of the LPAR the command ran on
      ecs: host.name
      status: mapped
    - vendor: <col_id>_EVT_USER_ID
      type: string
      description: RACF user ID of the administrator who issued the command
      ecs: user.name
      status: mapped
    - vendor: <col_id>_EVT_GRP_ID
      type: string
      description: RACF group name in effect when the command was issued
      ecs: user.group.name
      status: mapped
    - vendor: PERM_USER_NAME / AD_USER_NAME / ALD_USER_NAME
      type: string
      description: 20-character user name of the command issuer
      ecs: user.full_name
      status: mapped
    - vendor: PERM_RES_NAME
      type: string
      description: >-
        name of the resource whose access list the PERMIT command changed (up
        to 255 characters)
      ecs: null
      status: unmapped
      custom: racf.resource.name
      notes: >
        the object of the permission change; for general resource classes this
        is not a file path, so it stays custom rather than being forced into
        file.path
    - vendor: AD_DS_NAME / ALD_DS_NAME
      type: string
      description: 44-character data set name the ADDSD or ALTDSD command defined or altered
      ecs: file.path
      status: mapped
      notes: >
        genuinely a data set name on the data-set profile commands, so this is
        the one command field that belongs in file.path without qualification
    - vendor: PERM_CLASS / AD_CLASS
      type: string
      description: RACF class name the command operated in
      ecs: null
      status: unmapped
      custom: racf.resource.class
    - vendor: PERM_OWN_ID / AD_OWN_ID / ALD_OWN_ID
      type: string
      description: user ID or group that owns the profile the command targeted
      ecs: null
      status: unmapped
      custom: racf.profile.owner
    - vendor: PERM_SPECIFIED / AD_SPECIFIED / ALD_SPECIFIED
      type: string
      description: 1,024-byte blob of the keywords and operands specified on the command
      ecs: null
      status: partial
      custom: racf.command.specified
      notes: >
        the only place the target of a PERMIT or CONNECT appears - ID() and
        ACCESS() must be sub-parsed out of this blob to populate
        user.target.name and the granted authority; IBM states the order and
        format of these keyword fields are not part of the programming
        interface, so the sub-parser must fail soft
    - vendor: PERM_FAILED / AD_FAILED / ALD_FAILED
      type: string
      description: 1,024-byte blob of the keywords that failed on the command
      ecs: null
      status: unmapped
      custom: racf.command.failed
      notes: >
        non-empty on KEYWVIOL events; this is what distinguishes a partially
        rejected administrative change from a clean one
    - vendor: PERM_IGNORED / ALD_IGNORED
      type: string
      description: 1,024-byte blob of the keywords that were ignored on the command
      ecs: null
      status: unmapped
      custom: racf.command.ignored
    - vendor: AD_SECL / ALD_OLD_SECL
      type: string
      description: >-
        SECLABEL associated with the profile - the new label on ADDSD, the
        label being removed on ALTDSD
      ecs: null
      status: unmapped
      custom: racf.seclabel.profile
    - vendor: AD_SECL_LINK / ALD_SECL_LINK
      type: string
      description: >-
        16-character key linking the command to the data sets affected by the
        SECLABEL change it caused
      ecs: null
      status: unmapped
      custom: racf.seclabel.link
      notes: >
        the join key to the SMF type 83 (DSAF) records emitted for each
        affected data set; without it a SECLABEL change and its blast radius
        cannot be correlated
    - vendor: <col_id>_TERM
      type: string
      description: terminal the command was issued from (up to 8 characters)
      ecs: null
      status: unmapped
      custom: racf.terminal
    - vendor: >-
        <col_id>_LOG_ALWAYS / <col_id>_LOG_CMDVIOL / <col_id>_LOG_SPECIAL /
        <col_id>_LOG_GLOBAL
      type: enum
      description: >-
        family of YES/NO columns recording why the event was audited
        (always-audited command, CMDVIOL, SPECIAL privilege, GLOBALAUDIT)
      ecs: null
      status: partial
      custom: racf.log_reason
      notes: >
        separate fixed-position YES/NO columns that collapse into one keyword
        array; they explain why RACF chose to log the event, which has no ECS
        analogue but tells an auditor whether coverage is policy-driven or
        incidental
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Branch low-side on the EVENT_TYPE column to pick the right extension
          layout, and sub-parse the _SPECIFIED keyword blob there so
          ID(userid) becomes user.target.name and ACCESS(level) becomes the
          granted authority - a PERMIT with no parsed target is an
          unactionable event, and this is the one place in the RACF feed where
          an ECS-required field has to be manufactured rather than copied.
          Emit an explicit unknown-command fallback that preserves the common
          header instead of dropping the record, since IBM does not commit to
          the keyword blob format and new event codes appear across releases.
          Schema-validate before the forwarding destination, dead-letter the
          failures, alert on the dead-letter rate itself, and use Persistent
          Queue backpressure.
        elastic: >
          Own a custom logs-zos_racf.command ingest pipeline that resolves the
          command event qualifiers (SUCCESS, INSAUTH, KEYWVIOL, SECLFAIL) into
          readable outcomes and sets event.category consistently for
          profile-creation versus permission-change commands, so a PERMIT and
          an ADDSD do not land in the same undifferentiated bucket. Add typed
          custom-namespace index-template mappings for racf.command.specified,
          racf.command.failed and racf.command.ignored as text with a keyword
          subfield, and racf.resource.class, racf.profile.owner,
          racf.seclabel.profile and racf.seclabel.link as keyword - the
          SECLABEL link key is what joins these command records to the SMF
          type 83 data-set records they trigger.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), UTF-8 transcoded
          from EBCDIC and stripped of fixed-width blank padding low-side. The
          content-filter friction here is the worst of any RACF dataset: three
          1,024-byte keyword blobs per record carrying raw administrator
          input, which is unbounded free text by construction. Parse them into
          allow-listed keys low-side and forward the residual raw blob only
          under an explicit length cap with a truncation flag, rather than
          asking the guard's custom filter to reason about 3KB of command
          syntax. No CEF exists on this path. This is the last dataset to drop
          _raw - command records are the RACF equivalent of Windows Security
          events for forensics - and count reconciliation should be per
          (dataset, SMF dump interval) given the batch upstream.
      direct:
        parse_location: low
        cribl: >
          Branch in the edge pipeline on the EVENT_TYPE column to pick the
          right extension layout, and sub-parse the _SPECIFIED keyword blob
          there so ID(userid) becomes user.target.name and ACCESS(level)
          becomes the granted authority - a PERMIT with no parsed target is an
          unactionable event, and this is the one place in the RACF feed where
          an ECS-required field has to be manufactured rather than copied.
          Emit an explicit unknown-command fallback that preserves the common
          header instead of dropping the record, since IBM does not commit to
          the keyword blob format and new event codes appear across releases.
          Schema-validate before the forwarding destination, dead-letter the
          failures, alert on the dead-letter rate itself, and use Persistent
          Queue backpressure.
        elastic: >
          Own a custom logs-zos_racf.command ingest pipeline that resolves the
          command event qualifiers (SUCCESS, INSAUTH, KEYWVIOL, SECLFAIL) into
          readable outcomes and sets event.category consistently for
          profile-creation versus permission-change commands, so a PERMIT and
          an ADDSD do not land in the same undifferentiated bucket. Add typed
          custom-namespace index-template mappings for racf.command.specified,
          racf.command.failed and racf.command.ignored as text with a keyword
          subfield, and racf.resource.class, racf.profile.owner,
          racf.seclabel.profile and racf.seclabel.link as keyword - the
          SECLABEL link key is what joins these command records to the SMF
          type 83 data-set records they trigger.
  - format: syslog-leef
    enable: >
      Configure the zSecure Audit QRadar interface to render the RACF
      administrative-command audit records - SMF type 80 event codes 08-24,
      PERMIT, ADDSD, ALTDSD, ALTUSER, CONNECT, RDEFINE, SETROPTS and their
      siblings - as LEEF events, enriched from the RACF database, and deliver
      them near real time over UNIX syslog or as scheduled LEEF log-file
      pulls. These records are low volume and high value, so the
      near-real-time syslog transport is the strong recommendation: a
      privileged ALTUSER or a rule-weakening PERMIT should not wait for a
      scheduled pull. Confirm with a captured sample which command operands
      the zSecure interface renders as LEEF attributes, since the operands an
      administrator typed are the point of the record.
    references:
    - >-
      https://www.juniper.net/documentation/us/en/software/jsa7.5.0/jsa-dsm/topics/concept/concept-jsa-configuring-dsm-ibm-racf.html
    - https://www.ibm.com/docs/de/dsm?topic=racf
    - https://www.ibm.com/support/pages/setting-data-preparation-qradar-siem
    - >-
      https://www.ibm.com/docs/en/SS2RWS_2.3.1/com.ibm.zsecure.doc_2.3.1/zsec_install.pdf
    parsing:
      mechanism: cribl-pipeline
      artifact: custom RACF command LEEF pipeline
      notes: >
        Custom LEEF pipeline as for the other type 80 datasets. The value of a
        command record is the parsed target and authority - ID() becoming
        user.target.name, ACCESS() becoming the granted level - and whether
        those arrive as discrete LEEF attributes or embedded in a rendered
        operand string depends on the zSecure interface's field selection,
        which is not published; the sub-parser must fail soft against a
        captured sample, and an unrecognized command must keep the common
        header rather than drop.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Terminate the LEEF at the edge and branch on the command name
          attribute to pick the right handling, sub-parsing the operand
          attributes so a PERMIT resolves user.target.name and the granted
          authority - a PERMIT with no parsed target is an unactionable event.
          Preserve the audit-reason and any KEYWVIOL/failed-keyword detail as
          explicit fields, mask new values for password and key operands
          before they leave the enclave, apply the LPAR timezone, and emit an
          explicit unknown-command fallback that keeps the common header.
          Schema-validate before the destination, dead-letter the failures,
          alert on the dead-letter rate itself, and use Persistent Queue
          backpressure.
        elastic: >
          Land in the same custom logs-zos_racf.command pipeline and template
          as the IRRADU00 feed. Resolve the command qualifiers (success,
          insufficient authority, keyword violation, security-label
          success/failure) into readable outcomes, set event.category
          consistently for profile-creation versus permission-change commands
          so a PERMIT and an ADDSD do not share one bucket, and hold
          racf.command.specified/failed/ignored as text with a keyword
          subfield and racf.resource.class, racf.profile.owner,
          racf.seclabel.profile and racf.seclabel.link as keyword so the join
          to the SMF type 83 data-set records survives.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), one administrative
          change per line, UTF-8, LF-terminated, compression disabled, nesting
          depth <=2, with LEEF resolved low-side. The friction is the operand
          content - raw administrator input, unbounded free text a field-aware
          filter cannot allow-list - so parse it into allow-listed keys
          low-side and forward any residual operand string only under an
          explicit length cap with a truncation flag. This is the last dataset
          to shed detail - command records are the RACF equivalent of Windows
          Security events for forensics - and count reconciliation per
          (dataset, hour) matters most here since a missing privilege grant is
          the drop nobody notices.
      direct:
        parse_location: low
        cribl: >
          Terminate the LEEF at the edge and branch on the command name
          attribute to pick the right handling, sub-parsing the operand
          attributes so a PERMIT resolves user.target.name and the granted
          authority - a PERMIT with no parsed target is an unactionable event.
          Preserve the audit-reason and any KEYWVIOL/failed-keyword detail as
          explicit fields, mask new values for password and key operands
          before forwarding, apply the LPAR timezone, and emit an explicit
          unknown-command fallback that keeps the common header. Because the
          feed is low volume and high value, pin it to the near-real-time
          syslog transport rather than a scheduled LEEF file pull wherever the
          site supports it, so an administrative change is visible
          immediately, and key the pipeline on the command-name attribute so a
          syslog and a file-pulled sample resolve identically. Schema-validate
          before the destination, dead-letter the failures, alert on the
          dead-letter rate itself, and use Persistent Queue backpressure.
        elastic: >
          Land in the same custom logs-zos_racf.command pipeline and template
          as the IRRADU00 feed. Resolve the command qualifiers (success,
          insufficient authority, keyword violation, security-label
          success/failure) into readable outcomes, set event.category
          consistently for profile-creation versus permission-change commands
          so a PERMIT and an ADDSD do not share one bucket, and hold
          racf.command.specified/failed/ignored as text with a keyword
          subfield and racf.resource.class, racf.profile.owner,
          racf.seclabel.profile and racf.seclabel.link as keyword so the join
          to the SMF type 83 data-set records survives. Keep the operand
          sub-parse, the outcome derivation and the SECLABEL-link handling
          identical across producers so a grant of SPECIAL or a SETROPTS
          change alerts the same way regardless of encoding.
    fields_omitted: >
      Whether the operands that give a command record its value - ID() as the
      target user, ACCESS() as the granted level - arrive as discrete LEEF
      attributes or embedded in one rendered operand string is decided by the
      zSecure interface's field selection, which IBM does not publish, so the
      attribute shape is settled per site from a capture. The records are the
      SMF 80 event codes 08-24 the `other` entry inventories.
    fields: []
  - format: json
    enable: >
      Add the SMF type 80 data stream to a CDPz System Data Engine policy so
      the administrative-command records stream as JSON off the SMF in-memory
      resource / log stream. Setup is the SDE task, FACILITY-profile READ
      grant and Configuration Tool policy as for the other type 80 streams;
      the Data Streamer emits concatenated JSON to Logstash or JSON to the
      Splunk HEC, EBCDIC already transcoded. Because command records are the
      point at which privilege is granted, confirm the SDE subset renders the
      command operands - the target user id and the granted access level - and
      not only the command name and outcome, since the SDE deliberately
      collects a subset of SMF 80.
    references:
    - https://www.ibm.com/docs/en/z-logdata-analytics/5.1.0?topic=insights-smf-80-data
    - https://www.ibm.com/docs/en/zcdp/5.1.0?topic=engine-smf-data-stream-reference
    - >-
      https://higherlogicdownload.s3.amazonaws.com/IMWUC/UploadedImages/67355206-3a6a-46c5-817d-8fee55ef5e2d/handson_splunk_hec.pdf
    - >-
      https://www.ibm.com/docs/en/z-logdata-analytics/5.1.0?topic=dcfil-deploying-logstash-configuration-files-in-ingestion-kit-raw-data
    parsing:
      mechanism: cribl-pipeline
      artifact: custom CDPz SMF-80 JSON pipeline
      notes: >
        Structured JSON extracted as JSON. The risk specific to commands is
        operand fidelity: if the SDE subset does not carry the parsed operands
        the way the SMF record does, the JSON feed loses the target/authority
        detail that makes a command record actionable, so the pipeline must
        assert those fields are present and treat their absence as a sourcing
        gap. The SDE field names differ from the <col_id>_ columns and are
        publicly documented but were not fetchable here, so the table is
        empty.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Receive the CDPz JSON at the edge and extract it structured, keyed
          on the command-name field. Resolve user.target.name and the granted
          authority from the SDE operand fields - and if the subset does not
          carry them, dead-letter and flag rather than emit a change with no
          target. Preserve the outcome and any keyword-violation detail, mask
          password/key operand values before they leave the enclave, apply the
          LPAR timezone, and schema-validate before the destination on
          Persistent Queue backpressure.
        elastic: >
          Target the shared logs-zos_racf.command pipeline and template so the
          CDPz, LEEF and IRRADU00 encodings converge. Resolve the command
          qualifiers to readable outcomes, set event.category consistently for
          creation versus permission-change commands, keep the racf.command.*
          and racf.seclabel.* keys typed, and hold the CDPz-to-ECS crosswalk
          versioned since the SDE operand fields are the least standard part
          of the record.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), one change per
          line, UTF-8, LF-terminated, compression disabled, nesting depth <=2.
          CDPz's EBCDIC transcode and named JSON help, but the operand content
          is the same free-text friction as the LEEF path - parse to
          allow-listed keys low-side and cap any residual operand string with
          a truncation flag. This is the last dataset to shed detail;
          reconcile counts per (dataset, hour) given the at-most-once
          crossing.
      direct:
        parse_location: low
        cribl: >
          Receive the CDPz JSON at the edge and extract it structured, keyed
          on the command-name field. Resolve user.target.name and the granted
          authority from the SDE operand fields - and if the subset does not
          carry them, dead-letter and flag rather than emit a change with no
          target. Preserve the outcome and any keyword-violation detail, mask
          password/key operand values before forwarding, apply the LPAR
          timezone, and schema-validate before the destination on Persistent
          Queue backpressure. The in-memory stream gives the lowest latency
          for these high-value records, which is exactly where latency
          matters, provided the SDE subset carries the operands; if it does
          not, prefer the LEEF or IRRADU00 feed. Key the pipeline on the
          command-name field so all producers resolve identically.
        elastic: >
          Target the shared logs-zos_racf.command pipeline and template so the
          CDPz, LEEF and IRRADU00 encodings converge. Resolve the command
          qualifiers to readable outcomes, set event.category consistently for
          creation versus permission-change commands, keep the racf.command.*
          and racf.seclabel.* keys typed, and hold the CDPz-to-ECS crosswalk
          versioned since the SDE operand fields are the least standard part
          of the record. Keep the operand handling, the outcome derivation and
          the SECLABEL-link handling identical to the other producers so a
          privilege grant alerts the same way across encodings.
    fields_omitted: >
      IBM's CDPz SMF data stream reference names the SDE keys but could not be
      retrieved for this entry, so no key list is given; because the SDE
      collects only a subset of SMF type 80, whether the command operands -
      target user id and granted access level - survive into the selected data
      stream has to be confirmed against it. The records are the
      administrative commands the `other` entry inventories.
    fields: []
- id: racf-init
  name: RACF initialization (SMF type 81)
  description: >
    One record written at the completion of RACF initialization on each IPL,
    unloaded by IRRADU00 with the RACFINIT event type and the RINI_ prefix. It
    is a configuration snapshot rather than an event - which RACF database is
    in use, which installation exits are active, and which SETROPTS options
    and class-level auditing settings were in effect at IPL. Low volume and
    high value for drift detection. The related type 81 class records (RINC_
    prefix, one per active class) and the type 83 data-set-affected records
    (DSAF_ prefix, emitted when a SECLABEL change ripples to data sets) ride
    the same unload and are follow-on mapping work.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: other
      name: z/OS SMF dump plus IRRADU00 unload (or IBM Common Data Provider Data Streamer)
      notes: >
        Same delivery as the type 80 datasets; type 81 appears only at IPL, so
        a batch dump cycle is acceptable here in a way it is not for command
        or logon records.
    - hop: cribl
      location: edge worker group, low-side enclave
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_racf.init
    direct:
    - hop: other
      name: z/OS SMF dump plus IRRADU00 unload (or IBM Common Data Provider Data Streamer)
      notes: >
        Same delivery as the type 80 datasets; type 81 appears only at IPL, so
        a batch dump cycle is acceptable here in a way it is not for command
        or logon records.
    - hop: cribl
      location: edge worker group
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_racf.init
  formats:
  - format: other
    parsing:
      mechanism: cribl-pipeline
      artifact: custom IRRADU00 fixed-position pipeline
      notes: >
        A separate fixed-position layout from the type 80 records - the type
        81 record has no event qualifier and no user identity, only a reserved
        blank field at positions 10-17 kept for column alignment.
    fields:
    - vendor: RINI_EVENT_TYPE
      type: string
      description: type of the event, always set to RACFINIT
      ecs: event.action
      status: mapped
      notes: >
        the type 81 record has no event qualifier - positions 10-17 are a
        reserved blank field kept only for column alignment with type 80
        records - so there is nothing to map to event.reason
    - vendor: RINI_DATE_WRITTEN / RINI_TIME_WRITTEN
      type: timestamp
      description: >-
        date (yyyy-mm-dd) and time (hh:mm:ss) the record was written to SMF,
        in two separate fixed-position columns
      ecs: '@timestamp'
      status: partial
      transform: 'concatenate the two columns and apply the LPAR''s UTC offset'
    - vendor: RINI_SYSTEM_SMFID
      type: string
      description: four-character SMF system identifier of the LPAR that initialized RACF
      ecs: host.name
      status: mapped
    - vendor: RINI_DATASET_NAME
      type: string
      description: 44-character name of the RACF database data set in use for this IPL
      ecs: file.path
      status: mapped
      notes: >-
        identifies which RACF database an LPAR IPLed against; a swap is a
        first-order security event
    - vendor: RINI_DATASET_VOL
      type: string
      description: volume serial the RACF database data set resides on
      ecs: null
      status: unmapped
      custom: racf.database.volume
    - vendor: RINI_AUDIT_USER / RINI_AUDIT_GROUP / RINI_AUDIT_DATASET
      type: enum
      description: >-
        YES/NO columns recording whether user, group and data set class
        profile changes are being audited
      ecs: null
      status: unmapped
      custom: racf.setropts.audit_classes
      notes: >
        the audit coverage in effect at IPL; collapsing the three columns into
        one keyword array is what makes "auditing was silently turned off"
        detectable
    - vendor: RINI_ADSP
      type: enum
      description: whether automatic data set protection (ADSP) is active (YES/NO)
      ecs: null
      status: unmapped
      custom: racf.setropts.adsp
    - vendor: RINI_TAPEVOL
      type: enum
      description: whether tape volume protection is in effect (YES/NO)
      ecs: null
      status: unmapped
      custom: racf.setropts.tapevol_protection
    - vendor: RINI_DASD
      type: enum
      description: whether DASD volume protection is in effect (YES/NO)
      ecs: null
      status: unmapped
      custom: racf.setropts.dasdvol_protection
    - vendor: >-
        RINI_RACINIT_PRE / RINI_RACINIT_POST / RINI_RACHECK_PRE /
        RINI_RACHECK_POST / RINI_ENCRYPT_EXIT
      type: enum
      description: >-
        YES/NO columns recording which RACF installation exits are active
        (ICHRIX01/02, ICHRCX01/02, ICHDEX01)
      ecs: null
      status: unmapped
      custom: racf.exits_active
      notes: >
        installation exits can override any RACF decision, so the set that is
        loaded is a standing supply-chain question; ECS has no concept of a
        security product's active hook points
    - vendor: RINI_RACINIT_STATS
      type: enum
      description: whether RACINIT (logon) statistics are being recorded (YES/NO)
      ecs: null
      status: unmapped
      custom: racf.setropts.racinit_stats
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Extract the type 81 layout low-side as its own branch keyed on the
          RACFINIT event type, and synthesize the fields the record simply
          does not have: event.outcome is always success because RACF only
          writes this record on successful initialization, and there is no
          user identity at all, so leave user.name empty rather than inventing
          one. Collapse the several dozen YES/NO exit and SETROPTS columns
          into bounded keyword arrays before the crossing so the record stays
          a shallow, short-keyed JSON object instead of eighty booleans.
        elastic: >
          Own a custom logs-zos_racf.init ingest pipeline and treat this
          dataset as configuration drift rather than alerting volume: index
          the SETROPTS and exit-activation arrays as keyword, and build the
          detection as a change-over-time comparison against the previous IPL
          of the same host.name, since a single record carries no notion of
          what changed. Add typed custom-namespace mappings for
          racf.setropts.audit_classes, racf.setropts.adsp,
          racf.setropts.tapevol_protection, racf.setropts.dasdvol_protection
          and racf.database.volume, and document that the configuration
          alerting profile's required user.name is genuinely absent here.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), UTF-8 transcoded
          low-side. This is the easiest RACF dataset for the guard's custom
          filter - a handful of data set names and a bounded set of YES/NO
          flags, no free text at all - provided the boolean columns are
          collapsed into arrays low-side rather than crossing as eighty
          separate keys. No CEF exists on this path. Volume is a few records
          per LPAR per IPL, so count reconciliation is trivial and _raw can be
          carried indefinitely at negligible cost.
      direct:
        parse_location: low
        cribl: >
          Extract the type 81 layout in the edge pipeline as its own branch
          keyed on the RACFINIT event type, and synthesize the fields the
          record simply does not have: event.outcome is always success because
          RACF only writes this record on successful initialization, and there
