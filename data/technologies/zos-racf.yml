          inventing one. Collapse the several dozen YES/NO exit and SETROPTS
          columns into bounded keyword arrays before forwarding so the record
          stays a shallow, short-keyed JSON object instead of eighty booleans.
        elastic: >
          Own a custom logs-zos_racf.init ingest pipeline and treat this
          dataset as configuration drift rather than alerting volume: index
          the SETROPTS and exit-activation arrays as keyword, and build the
          detection as a change-over-time comparison against the previous IPL
          of the same host.name, since a single record carries no notion of
          what changed. Add typed custom-namespace mappings for
          racf.setropts.audit_classes, racf.setropts.adsp,
          racf.setropts.tapevol_protection, racf.setropts.dasdvol_protection
          and racf.database.volume, and document that the configuration
          alerting profile's required user.name is genuinely absent here.
