id: insider-threat-uam
name: Insider Threat User Activity Monitoring
vendor: Everfox/Proofpoint
versions: >-
  Everfox EverShield UAM / Insider Risk Solutions (build not publicly
  versioned; collection is per-deployment policy); Proofpoint ITM v2 API (as
  consumed by the Elastic proofpoint_itm integration)
draft: true
references:
- https://www.elastic.co/docs/reference/integrations/proofpoint_itm
- >-
  https://github.com/elastic/integrations/tree/main/packages/proofpoint_itm/data_stream/report
- https://www.everfox.com/products/insider-risk-solutions/user-activity-monitoring
- >-
  https://assets.everfox.com/app/uploads/2025/09/15161456/EverShieldUAM_Datasheet_v4.0_092025.pdf
- >-
  https://assets.everfox.com/app/uploads/2024/01/14083931/Datasheet_Insider-Risk-Solutions.pdf
- https://www.proofpoint.com/us/products/insider-threat-management
- https://www.dni.gov/files/NCSC/documents/nittf/20181022-UAM-Definition.pdf
- https://www.fortinet.com/resources/cyberglossary/nittf-cnssd-504
- https://www.dni.gov/index.php/ncsc-how-we-work/ncsc-nittf/ncs-nittfassessments
datasets:
- id: activity-alert
  name: Policy-triggered user activity alert
  description: |
    The core UAM feed: one record per monitored end-user action that a collection policy flagged. This is the capability E.O. 13587 and the National Insider Threat Task Force minimum standards mandate, and CNSSD 504 defines it concretely as five technical capabilities — keystroke monitoring, full application content (email, chat, data import, data export), screen capture, file shadowing (tracking a document when its name or location changes), and attribution of all collected data to a specific user. Vendors implement that as a policy-driven endpoint sensor collecting from a set of named channels: Everfox EverShield documents "over 15 channels" and its datasheet diagram names Application, Clipboard, Email, File, Keyboard, Logon, Printer, Process, Registry, System Info, Video, Web, Web UI, Webmail, Event Log and Network. In SOC terms the events that matter are file exfiltration to removable media, cloud upload or print; website and application usage; and the risk score the behavioural-analytics tier assigns to the user.
    SCOPE AND HONESTY WARNING — READ BEFORE USING THIS MAP. This is a CLASS map, not a single-product map. Field names in THIS dataset are real and documented: they are the Proofpoint ITM v2 API JSON keys that the Elastic proofpoint_itm integration's ingest pipeline consumes (json.loginName, json.ruleName, json.risingValue and so on), used here as the class exemplar because they are the only publicly documented UAM field set. Everfox EverShield's field-level documentation is controlled and NOT public — there is no vendor log reference, no Elastic integration and no Cribl pack for it — so an Everfox deployment will emit DIFFERENT names for the same concepts and every name below must be re-confirmed against the deployed product before a parser is built. Fields marked PLACEHOLDER carry no public documentation for either vendor. The other two datasets in this file are placeholder skeletons throughout.
    CAPTURE PAYLOADS DO NOT TRAVEL. Keystroke logs, screen captures and full session video are the product's evidentiary core — Everfox markets "proven authentic, relevant, and original records for use in legal proceedings" and full-context session replay. Those payloads stay inside the UAM enclave under its own chain of custody. What this dataset carries is a REFERENCE to them (playbackUrl, sessionId), which is all a SIEM should ever hold: metadata that lets a cleared investigator pivot into the UAM console, not the capture itself.
  event_categories:
  - file
  - web
  - process
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        The sensors watching the low-side user population feed this low-side
        worker group, whose records cross to the high-side analytic tier.
        Still to confirm, and it is an access-control question rather than a
        routing one: whether the insider-threat program permits the feed to
        reach the general Cribl worker group at all, or whether it requires a
        dedicated worker group with its own operators.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-uam.activity-insider_threat
      notes: >
        Deliberately NOT the default namespace. The Elastic data-stream
        namespace segment is the cheapest available access-control lever:
        landing this in its own namespace lets an index template, an
        index-level role and (if needed) document-level security be scoped to
        insider-threat consumers only. This dataset must not appear in the
        general SOC view — the audience is the insider-threat program's
        cleared analysts, not the CSOC watch floor.
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        UAM sensors on cleared workstations inside the accredited enclave feed
        this edge worker group directly, with no guard in the path. Still to
        confirm, and it is an access-control question rather than a routing
        one: whether the insider-threat program permits the feed to reach the
        general Cribl worker group at all, or whether it requires a dedicated
        worker group with its own operators.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-uam.activity-insider_threat
      notes: >
        Deliberately NOT the default namespace. The Elastic data-stream
        namespace segment is the cheapest available access-control lever:
        landing this in its own namespace lets an index template, an
        index-level role and (if needed) document-level security be scoped to
        insider-threat consumers only. This dataset must not appear in the
        general SOC view — the audience is the insider-threat program's
        cleared analysts, not the CSOC watch floor.
  formats:
  - format: json
    parsing:
      mechanism: cribl-pipeline
      artifact: custom insider-threat UAM pipeline
      notes: >
        An Elastic integration DOES exist for one of the two exemplar products
        — proofpoint_itm, single "report" data stream, collected by API from
        ITM v2 — but it is not the right mechanism here for two reasons: it
        pulls direct from the vendor API into Elastic and so bypasses the
        Cribl (and any guard) path entirely, and it covers nothing on the
        Everfox side. A hand-built Cribl pipeline is the realistic option.
        Mine the integration's ingest pipeline anyway: it is the only
        published ECS mapping for this product class and it supplies both good
        mappings (loginName→user.name, ruleName→ rule.name,
        accessedUrl→url.full, ruleCategoryName→rule.category) and two that
        should NOT be copied, flagged per-field below. The format here is json
        because both exemplars emit JSON — ITM over its v2 API and webhook,
        Everfox over its documented native SIEM integrations; confirm whether
        the deployment instead fronts this with a legacy ArcSight CEF
        connector, in which case the syslog-cef entry applies, CEF parsing
        happens low-side and CEF stops at Cribl.
    fields:
    - vendor: risingValue
      type: timestamp
      description: >-
        collector-assigned time of the monitored activity, used as the
        record's event time
      ecs: '@timestamp'
      status: mapped
      transform: >
        the stock proofpoint_itm pipeline sets @timestamp from this field
        rather than from observedAt or createdAt; confirm the endpoint clock
        is disciplined, because timezoneOffset is carried separately and an
        undisciplined agent clock silently reorders an investigation timeline
    - vendor: id
      type: string
      description: unique identifier of the activity report record
      ecs: event.id
      status: mapped
    - vendor: loginName
      type: string
      description: logged-on account that performed the monitored activity
      ecs: user.name
      status: mapped
      notes: >
        CNSSD 504 requires all collected UAM data be attributable to a
        specific user, so an unpopulated value here is a compliance finding
        rather than a parsing gap; also populate related.user
    - vendor: domainName
      type: string
      description: Windows/directory domain of the account that performed the activity
      ecs: user.domain
      status: partial
      notes: >
        the stock proofpoint_itm ingest pipeline sends this to source.domain,
        which models the domain of a network source rather than the identity
        domain of the acting account; do not copy that mapping — user.domain
        is the correct home and source.domain should be left free
    - vendor: endpointName
      type: string
      description: hostname of the monitored endpoint the agent runs on
      ecs: host.name
      status: mapped
    - vendor: endpointId
      type: string
      description: identifier of the endpoint/agent that produced the record
      ecs: agent.id
      status: partial
      notes: >
        agent.id is the closest GA home and it is what joins this dataset to
        the agent-health dataset below; confirm whether the deployment's value
        identifies the sensor installation or the machine, because the two
        diverge on re-image and only the former is a stable agent.id
    - vendor: os
      type: string
      description: operating system of the monitored endpoint
      ecs: host.os.type
      status: mapped
      transform: >-
        vendor values need normalising to the ECS host.os.type vocabulary
        (windows, macos, linux)
    - vendor: remoteAddress
      type: ip
      description: >-
        address of the remote host involved in the interaction (remote session
        peer or remote share)
      ecs: source.ip
      status: partial
      notes: >
        the stock proofpoint_itm pipeline maps this to host.ip and related.ip;
        host.ip is wrong because it conflates a remote peer with the monitored
        endpoint's own address. source.ip is right when the activity is an
        inbound remote session, but the field is also emitted for outbound
        interactions where destination.ip would be correct, so the mapping
        needs a branch on operationKind rather than a single target
    - vendor: ruleName
      type: string
      description: name of the UAM collection/detection policy rule that flagged the activity
      ecs: rule.name
      status: mapped
      notes: >
        the rule here is a monitoring policy authored in the vendor's policy
        workbench, not a vendor-shipped signature; rule.name and rule.category
        describe the same object so rule.* is the correct namespace, but there
        is no stable rule id in the documented field set, which makes
        rule-level trend alerting depend on an operator-editable string
    - vendor: ruleCategoryName
      type: string
      description: category the triggered policy rule belongs to
      ecs: rule.category
      status: mapped
    - vendor: severity
      type: enum
      description: severity the policy assigned to the triggered activity
      ecs: event.severity
      status: partial
      transform: >
        emitted as a keyword label while ECS event.severity is a long, so it
        needs an explicit label-to-number lookup; the vocabulary is
        policy-authored per deployment, so build the lookup from the site's
        own policy export rather than assuming a low/medium/high/critical
        scale
    - vendor: operationKind
      type: enum
      description: the kind of monitored operation the record describes - the channel discriminator
      ecs: event.action
      status: partial
      transform: >
        this is the single most important field on the dataset: it is what
        separates a file copy to removable media, a print job, a cloud upload,
        a clipboard paste, a website visit and an application launch, and it
        determines which of the other fields are even populated. The emitted
        token set is deployment-specific and needs a site lookup onto a stable
        action vocabulary before any alert content is written against it
    - vendor: originFileName
      type: string
      description: >-
        name of the file the activity originated from, tracked across renames
        by file shadowing
      ecs: file.name
      status: mapped
      notes: >
        the documented field set carries a file NAME and no directory or full
        path, so file.path — which the file alerting profile requires — cannot
        be populated from this feed; confirm whether the deployment emits a
        path field that the public field list omits, because without one a
        file event cannot be tied to a location on disk
    - vendor: targetFileName
      type: string
      description: >-
        name of the destination file the activity wrote to - the
        removable-media, cloud or print target
      ecs: null
      status: partial
      custom: uam.target.file_name
      notes: >
        this is the exfiltration half of the record and has no ECS home: ECS
        models one file per event plus file.target_path for symlink targets,
        neither of which expresses an origin/destination file pair. Keep it
        custom rather than overloading file.name, and treat the pair
        (originFileName, targetFileName) as the primary exfil detection
    - vendor: accessedUrl
      type: string
      description: URL of the website or cloud service the user accessed
      ecs: url.full
      status: mapped
      notes: >
        the web alerting profile requires url.original, source.ip,
        destination.ip and http.request.method; a host-based UAM sensor
        supplies none of the last three and only a rendered URL for the first,
        so web-category coverage on this dataset is structurally thin and
        should lean on the proxy or web-gateway feed instead
    - vendor: processExecutable
      type: string
      description: full path of the executable the monitored activity occurred in
      ecs: process.executable
      status: mapped
    - vendor: windowTitle
      type: string
      description: title-bar text of the window in focus when the activity occurred
      ecs: null
      status: unmapped
      custom: uam.window.title
      notes: >
        the most privacy-sensitive field in the documented set and the one
        most likely to carry classified content: window titles routinely
        contain document titles, mail subject lines, case numbers and patient
        or subject names. Everfox markets granular policy controls and "do not
        collect" policies precisely to minimise collection of PII, passwords
        and privileged communications - confirm what the site policy already
        excludes, and mask or drop this field low-side regardless
    - vendor: sessionId
      type: string
      description: identifier of the monitored user session the activity belongs to
      ecs: null
      status: unmapped
      custom: uam.session.id
      notes: >
        ECS has no generic session identifier (process.entity_id models a
        process, not a user session), so this stays custom; it is the join key
        for reconstructing an activity sequence and for pivoting to session
        replay in the UAM console
    - vendor: playbackUrl
      type: string
      description: >-
        deep link into the UAM console that replays the screen capture or
        session video for this event
      ecs: null
      status: unmapped
      custom: uam.capture.playback_url
      notes: >
        carry the REFERENCE, never the capture. The screen/keystroke payload
        stays in the UAM enclave under its own chain of custody and
        evidentiary handling; this link is what lets a cleared investigator
        pivot without the SIEM ever holding the recording. Confirm the console
        is reachable from the analyst network before relying on it, and note
        that following the link is itself an auditable act recorded by the
        console-audit dataset below
    - vendor: risk_score
      type: integer
      description: >-
        PLACEHOLDER - risk score the behavioural-analytics tier assigns to the
        acting user
      ecs: user.risk.calculated_score
      status: partial
      notes: >
        placeholder name: neither vendor publishes the field. The concept is
        documented on both sides (Everfox EverInsight behavioural analytics,
        Proofpoint ITM risk scoring) and ECS 9.4 has GA homes for it -
        user.risk.calculated_score with user.risk.calculated_score_norm for
        the 0-100 normalised form and user.risk.calculated_level for a band.
        Confirm whether the score rides on each activity record or arrives as
        a separate score-change event, because the two need different
        modelling and only the latter can drive a threshold alert cleanly
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Treat the low-side pipeline as a redaction control, not just a
          parser: enforce the program's "do not collect" policy a second time
          in Cribl by masking or dropping windowTitle and the file-name pair
          before anything is written, because window titles and shadowed file
          names routinely carry document titles, mail subjects and case names
          that are more sensitive than the event itself. Build the
          operationKind and severity lookups here so the channel discriminator
          and a numeric severity exist before routing, and use operationKind
          to branch the record — removable media, print and cloud-upload
          events populate the file pair while web and application events
          populate url.full — rather than emitting one flat shape. Route the
          whole dataset to a dedicated destination with its own Persistent
          Queue and never into the shared SOC path, and assert that capture
          payloads are absent: forward playbackUrl and sessionId as references
          only, and drop any base64 or blob field that appears, since a screen
          capture landing in the SIEM is a chain-of-custody and classification
          incident, not a parsing bug.
        elastic: >
          Own a custom logs-uam.activity-insider_threat ingest pipeline in a
          dedicated namespace with an index template and an index-level role
          scoped to insider-threat analysts, and consider document-level
          security keyed on the monitored user so an analyst cannot query
          their own monitoring record. Fix the two mappings the stock
          proofpoint_itm pipeline gets wrong rather than inheriting them:
          remoteAddress must not land on host.ip (that conflates the remote
          peer with the monitored endpoint's own address) and domainName
          belongs on user.domain rather than source.domain, which models a
          network source. Convert the severity label to ECS's numeric
          event.severity through an explicit lookup, derive event.action from
          the operationKind vocabulary, and add typed custom-namespace
          mappings for uam.window.title, uam.target.file_name, uam.session.id
          and uam.capture.playback_url as keyword so the exfil target and the
          replay reference stay queryable. Set retention on this index
          separately from the SOC default — insider-threat records are
          evidentiary and are governed by the program's own retention rule,
          not by the SIEM's.
        relay: >
          Low-side instances cross the guard, and that changes the design and
          not just the transport: for the low-side monitored population
          feeding the high-side analytic tier, this crosses as full ECS-shaped
          NDJSON (envelope mode B — UTF-8, LF-terminated, compression
          disabled, nesting depth ≤2, allowlisted keys), and the redaction
          above must happen before the crossing rather than after it. The
          content-filter friction is unusually bad here and should be raised
          early: windowTitle, the origin/target file names and accessedUrl are
          unbounded operator- and user-authored free text that can carry
          non-ASCII, kilobyte-scale values and — uniquely on this feed —
          classified content lifted verbatim out of a document title, which a
          hand-written LUA filter handles badly. Cap and allowlist those three
          low-side, do not carry _raw across at all on this dataset (the raw
          record is exactly the unredacted copy the crossing should not see),
          and reconcile low-side against high-side counts per (dataset, hour),
          since the at-most-once path means a silently dropped exfil alert is
          indistinguishable from a quiet day.
      direct:
        parse_location: low
        cribl: >
          Treat the edge pipeline as a redaction control, not just a parser:
          enforce the program's "do not collect" policy a second time in Cribl
          by masking or dropping windowTitle and the file-name pair before
          anything is written, because window titles and shadowed file names
          routinely carry document titles, mail subjects and case names that
          are more sensitive than the event itself. Build the operationKind
          and severity lookups here so the channel discriminator and a numeric
          severity exist before routing, and use operationKind to branch the
          record — removable media, print and cloud-upload events populate the
          file pair while web and application events populate url.full —
          rather than emitting one flat shape. Route the whole dataset to a
          dedicated destination with its own Persistent Queue and never into
          the shared SOC path, and assert that capture payloads are absent:
          forward playbackUrl and sessionId as references only, and drop any
          base64 or blob field that appears, since a screen capture landing in
          the SIEM is a chain-of-custody and classification incident, not a
          parsing bug.
        elastic: >
          Own a custom logs-uam.activity-insider_threat ingest pipeline in a
          dedicated namespace with an index template and an index-level role
          scoped to insider-threat analysts, and consider document-level
          security keyed on the monitored user so an analyst cannot query
          their own monitoring record. Fix the two mappings the stock
          proofpoint_itm pipeline gets wrong rather than inheriting them:
          remoteAddress must not land on host.ip (that conflates the remote
          peer with the monitored endpoint's own address) and domainName
          belongs on user.domain rather than source.domain, which models a
          network source. Convert the severity label to ECS's numeric
          event.severity through an explicit lookup, derive event.action from
          the operationKind vocabulary, and add typed custom-namespace
          mappings for uam.window.title, uam.target.file_name, uam.session.id
          and uam.capture.playback_url as keyword so the exfil target and the
          replay reference stay queryable. Set retention on this index
          separately from the SOC default — insider-threat records are
          evidentiary and are governed by the program's own retention rule,
          not by the SIEM's.
  - format: syslog-cef
    enable: >
      Turn on ITM's ArcSight CEF export: Configuration > Integrations >
      Integrated SIEM > SIEM Log Integration tab, tick "Enable export to
      ArcSight format", and leave "Activity Alerts" selected (it is on by
      default; "Windows and Unix Activity" is the higher-volume raw-activity
      companion). ITM writes CEF records to a file — default
      Observeit_activity_log.cef under C:\Program Files
      (x86)\ObserveIT\NotificationService\LogFiles\ArcSight — rather than
      opening a syslog socket itself, so the transport to Cribl is a
      file-tailing ArcSight SmartConnector or syslog forwarder reading that
      file (Proofpoint documents the ArcSight SmartConnector path directly).
      Each record's signature ID is prefixed by data type, and the 400-series
      identifies Activity Alerts; the CEF header carries Device Vendor/Product
      "ObserveIT", the ITM build as Device Version, the alert name, and a
      numeric 0-10 severity. Confirm the forwarder's file-rotation and replay
      behaviour before relying on it — a tailed file has different loss and
      duplication modes from a live stream.
    references:
    - >-
      https://prod.docs.oit.proofpoint.com/configuration_guide/integration_using_cef_logs.htm
    - >-
      https://prod.docs.oit.proofpoint.com/configuration_guide/configuring_cef_log_integration.htm
    - >-
      https://prod.docs.oit.proofpoint.com/user_guide/integrating_alerts_in_siem_products.htm
    - >-
      https://prod.docs.oit.proofpoint.com/configuration_guide/integrating_observeit_logs_with_the_hp_arcsight_siem_monitoring_software.htm
    - https://docs.cyderes.cloud/parser-knowledge-base/observeit/
    parsing:
      mechanism: cribl-pipeline
      artifact: custom insider-threat UAM pipeline (CEF variant)
      notes: >
        Same hand-built pipeline family as the JSON feed, not the stock
        proofpoint_itm integration — that integration pulls the v2 API
        straight into Elastic and does not parse this CEF stream at all. The
        header and the named extensions (suser, src, shost, dntdom, sproc,
        cat, msg, rt, externalId) map cleanly and are tabled below. The
        material honesty gap is the body: the alert's evidentiary detail — the
        deep-link/playback URL, the window title, the origin/target file pair
        and the accessed URL — rides the labelled cs1..cs6 custom slots, and
        ObserveIT does not publicly document which cs*Label occupies which
        slot, so those must be resolved by reading each cs*Label pair at parse
        time (against a live sample), never by positional guess. Two
        consequences carry over from the JSON feed and one is new: the
        operationKind channel discriminator is NOT a header field, so derive
        the file-vs-url branch from the signature ID plus the resolved cs
        labels; the redaction obligation is identical (window title and the
        file pair must be masked/dropped low-side); and severity, unlike the
        JSON keyword, arrives as a numeric 0-10 in the header, so the
        label-to-number lookup the JSON feed needs is skipped here.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the CEF at the low-side edge group and treat cs*Label
          resolution as the load-bearing step: walk the cs1..cs6 / cs*Label
          pairs to recover the playback URL, window title, origin/target file
          names and accessed URL, because until they are resolved the record
          looks benign while carrying the most sensitive content on the feed.
          Then enforce the program's "do not collect" policy a second time
          here exactly as on the JSON feed — mask or drop the window title and
          the file-name pair before anything is written, since they routinely
          carry document titles, mail subjects and case names. Derive the
          operationKind discriminator from the 400-series signature ID and the
          resolved labels so removable-media/print/cloud-upload events
          populate the file pair while web and application events populate
          url.full, rather than emitting one flat shape. The numeric header
          severity is usable as-is, so skip the JSON feed's label lookup, but
          still route the whole dataset to a dedicated destination with its
          own Persistent Queue and never the shared SOC path, and assert
          capture payloads are absent — forward the playback URL as a
          reference only and drop any blob that appears.
        elastic: >
          Land this in the same restricted logs-uam.activity-insider_threat
          namespace, index template and index-level role as the JSON feed,
          with the same optional document-level security keyed on the
          monitored user. CEF is the chance to avoid the two mismappings the
          stock proofpoint_itm pipeline makes rather than inherit them: map
          src to source.ip with the same inbound/outbound branch caveat (not
          host.ip), and dntdom to user.domain (not source.domain, which models
          a network source). event.severity arrives numeric so no lookup is
          needed, but still derive event.action from the operationKind
          vocabulary you reconstructed low-side, and add the same typed
          custom-namespace mappings — uam.window.title, uam.target.file_name,
          uam.session.id and uam.capture.playback_url as keyword — so the
          exfil target and the replay reference stay queryable once the cs
          labels are resolved. Set retention to the program's evidentiary
          rule, not the SOC default.
        relay: >
          Cross full ECS-shaped NDJSON after the low-side CEF parse — never
          raw CEF and never _raw, because the raw line is exactly the
          unredacted copy the crossing must not see. The content-filter
          friction is the same as the JSON feed and lives in the cs*Label free
          text: the window title, the file names and the accessed URL are
          unbounded operator- and user-authored strings that can carry
          non-ASCII, kilobyte-scale values and — uniquely on this feed —
          classified content lifted verbatim from a document title, so cap and
          allowlist those before the crossing. The file-based emission adds
          one caveat over the JSON path: because a forwarder tails a rotating
          CEF file, a restart can replay or skip lines, so per-(dataset, hour)
          reconciliation between low and high side matters more here, not less
          — a silently dropped exfil alert is indistinguishable from a quiet
          day on an at-most-once path.
      direct:
        parse_location: low
        cribl: >
          High-side instances take the same route without the guard hops, but
          the parse-and-redact obligation at the edge does not relax: resolve
          the cs*Label slots and mask the window title and file pair even with
          no guard in the path, because that masking is the program's
          collection policy enforced in the pipeline, not a crossing artifact.
          Derive the operationKind branch from the signature ID and labels,
          use the numeric header severity directly, and route to the dedicated
          destination with its own Persistent Queue rather than the shared SOC
          path.
        elastic: >
          Land this in the restricted logs-uam.activity-insider_threat
          namespace, index template and index-level role, with the same
          optional document-level security keyed on the monitored user. Take
          the corrected src->source.ip and dntdom->user.domain homes rather
          than the stock proofpoint_itm pipeline's host.ip/source.domain,
          consume the numeric event.severity directly (no label lookup),
          derive event.action from the operationKind vocabulary reconstructed
          at parse time, and add the typed custom-namespace mappings —
          uam.window.title, uam.target.file_name, uam.session.id and
          uam.capture.playback_url as keyword — so the exfil target and the
          replay reference stay queryable once the cs labels are resolved. Tag
          the input so CEF-sourced records are separable from any JSON-sourced
          records of the same alerts in the shared data stream — the two
          renderings carry different field vocabularies and a hand-built CEF
          parse is the more likely of the two to drift. Set retention to the
          program's evidentiary rule, not the SOC default.
    fields:
    - vendor: CEF Device Vendor
      type: string
      description: Static vendor string ObserveIT in the CEF header
      ecs: observer.vendor
      status: mapped
    - vendor: CEF Device Product
      type: string
      description: Static product string ObserveIT in the CEF header
      ecs: observer.product
      status: mapped
    - vendor: CEF Device Version
      type: string
      description: ITM/ObserveIT build that produced the record, from the CEF header
      ecs: observer.version
      status: mapped
    - vendor: CEF Signature ID
      type: integer
      description: >-
        numeric event identifier in the CEF header; the leading digit encodes
        the data type
      ecs: event.code
      status: mapped
      transform: >
        the 400-series prefix denotes the Activity Alerts data type (100 User
        activity, 200 DBA, 300 System events, 400 Alerts, 500 Audit, 600
        In-App); keep the full code as event.code and use the prefix only to
        confirm the record is an activity alert
    - vendor: CEF Name
      type: string
      description: the alert/rule name carried in the CEF header Name field
      ecs: rule.name
      status: partial
      notes: >
        the JSON feed's ruleName equivalent; confirm whether the deployment
        emits the policy rule name here or a static literal such as
        ObserveITAlert per version, because the former is the correlation key
        and the latter carries no rule identity
    - vendor: CEF Severity
      type: integer
      description: CEF header severity, an integer 0-10
      ecs: event.severity
      status: mapped
      transform: >
        already numeric on the wire (unlike the JSON severity keyword, which
        needs a label-to-number lookup), so it maps straight to
        event.severity; confirm the ITM policy-to-CEF-severity scale matches
        the site's policy bands rather than assuming a fixed mapping
    - vendor: suser
      type: string
      description: display name of the monitored user who performed the flagged activity
      ecs: user.name
      status: mapped
      notes: >
        the JSON loginName equivalent and the CNSSD 504 attribution field — an
        unpopulated value is a compliance finding, not a parsing gap; also
        populate related.user
    - vendor: suid
      type: string
      description: identifier of the monitored user account, where emitted
      ecs: user.id
      status: partial
      notes: >-
        present inconsistently in ObserveIT CEF; confirm it carries a stable
        account id before joining on it
    - vendor: src
      type: ip
      description: address of the remote host involved in the interaction
      ecs: source.ip
      status: partial
      notes: >
        the JSON remoteAddress equivalent and carries the same branch problem
        — src is the remote peer, correct as source.ip for an inbound remote
        session but wrong for outbound interactions where destination.ip fits;
        branch on the reconstructed operationKind rather than mapping
        unconditionally, and do NOT copy the stock JSON pipeline's host.ip
        mistake
    - vendor: shost
      type: string
      description: hostname of the source host - the monitored endpoint the sensor runs on
      ecs: host.name
      status: partial
      notes: >
        the JSON endpointName equivalent; confirm it names the monitored
        endpoint and not a remote peer before trusting it as host.name, since
        ObserveIT populates shost from whichever end it treats as the activity
        source
    - vendor: dntdom
      type: string
      description: directory/Windows domain of the account involved in the activity
      ecs: user.domain
      status: partial
      notes: >
        the JSON domainName equivalent; land it on user.domain (the identity
        domain of the acting account), not source.domain which models the
        domain of a network source — the same correction the JSON feed needs
    - vendor: sproc
      type: string
      description: name of the application or process the monitored activity occurred in
      ecs: process.name
      status: partial
      notes: >
        the CEF feed carries a process NAME here, where the JSON feed carries
        a full path in processExecutable, so process.executable cannot be
        populated from sproc alone; confirm whether a companion path field is
        emitted before an executable-path alert is built
    - vendor: cat
      type: string
      description: alert category/classification
      ecs: rule.category
      status: mapped
      notes: >-
        the JSON ruleCategoryName equivalent; rule.category is the correct
        home, consistent with rule.name from the Name header
    - vendor: msg
      type: string
      description: human-readable description of the alert
      ecs: message
      status: mapped
    - vendor: rt
      type: timestamp
      description: event time of the monitored activity, from the CEF rt extension
      ecs: '@timestamp'
      status: mapped
      transform: >
        CEF rt is epoch-milliseconds or a CEF-formatted date string; parse to
        @timestamp (the JSON risingValue equivalent) and, as on the JSON feed,
        confirm the endpoint clock is disciplined so an undisciplined agent
        clock does not silently reorder an investigation timeline
    - vendor: externalId
      type: string
      description: unique identifier of the alert record
      ecs: event.id
      status: mapped
      notes: >-
        the JSON id equivalent; the record's stable key for de-duplication
        across a tailed, replay-prone file
- id: agent-health
  name: Endpoint sensor health and collection coverage
  description: |
    Status and collection-coverage records for the UAM endpoint sensors themselves - which agents are reporting, what version they run, which collection channels their assigned policy has enabled, and whether an agent has been stopped, throttled or tampered with. This is the compliance dataset as much as the security one: the NITTF minimum standards require monitoring of cleared users' workstations, so an agent that has stopped reporting is a coverage gap in a mandated capability, and a deliberately stopped agent is an evasion signal. Two vendor-documented behaviours make silent loss realistic and are the reason this dataset is worth its own index: the sensor self-throttles ("configurable throttling mechanisms regulate CPU utilization and the transfer of collected data"), and it continues "persistent monitoring while off-network", caching locally until the endpoint returns - so a healthy-looking absence of events can mean throttled, offline, or uninstalled, and only this feed distinguishes them.
    FIELD NAMES BELOW ARE PLACEHOLDERS. Neither Everfox nor Proofpoint publishes a field reference for agent status, and the Elastic proofpoint_itm integration has a single report data stream that does not cover it. Confirm every name, type and vocabulary against the deployed console before building anything.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        The low-side monitored endpoint population is inventoried by the
        console on the low side. Agent status is normally retrieved from the
        management console rather than streamed by the endpoints, so the
        practical question for this dataset is which host holds the console
        API credential and whether the insider-threat program will issue one
        to a general-purpose collector at all.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-uam.agent-insider_threat
      notes: >
        Same restricted namespace as the activity dataset. This one is the
        weaker candidate for restriction on its face - an agent inventory
        carries no user content - but it does enumerate exactly which
        endpoints are monitored, which is itself program-sensitive, so keep it
        inside the same boundary.
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        The high-side monitored endpoint population is inventoried by the
        console on the high side. Agent status is normally retrieved from the
        management console rather than streamed by the endpoints, so the
        practical question for this dataset is which host holds the console
        API credential and whether the insider-threat program will issue one
        to a general-purpose collector at all.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-uam.agent-insider_threat
      notes: >
        Same restricted namespace as the activity dataset. This one is the
        weaker candidate for restriction on its face - an agent inventory
        carries no user content - but it does enumerate exactly which
        endpoints are monitored, which is itself program-sensitive, so keep it
        inside the same boundary.
  formats:
  - format: api-pull
    parsing:
      mechanism: cribl-pipeline
      artifact: custom insider-threat UAM pipeline
      notes: >
        No integration and no pack covers agent status for either exemplar
        product, so this is a hand-built Cribl HTTP/REST collector plus
        pipeline. The format is api-pull because a status inventory is a poll,
        not an event stream: the collector snapshots the agent list on a
        schedule and the pipeline turns each snapshot row into a document.
        That has a consequence worth designing for up front - absence is the
        signal, and a poll that fails produces no documents rather than a
        failure document, so the collector's own health must be monitored
        separately.
    fields:
    - vendor: poll_time
      type: timestamp
      description: PLACEHOLDER - time the collector snapshotted the agent inventory
      ecs: '@timestamp'
      status: partial
      notes: >-
        use the poll time as the event time, not the agent's own last_checkin,
        so an absent agent still has a document with a current timestamp
    - vendor: agent_id
      type: string
      description: PLACEHOLDER - identifier of the sensor installation
      ecs: agent.id
      status: partial
      notes: >-
        must be the same value the activity dataset emits as endpointId, or
        the two datasets cannot be joined; confirm this before either pipeline
        is written
    - vendor: agent_version
      type: string
      description: PLACEHOLDER - version of the endpoint sensor build
      ecs: agent.version
      status: partial
    - vendor: endpoint_name
      type: string
      description: PLACEHOLDER - hostname of the monitored endpoint
      ecs: host.name
      status: partial
    - vendor: agent_status
      type: enum
      description: >-
        PLACEHOLDER - reported state of the sensor (running, stopped,
        degraded, uninstalled)
      ecs: service.state
      status: partial
      transform: >
        confirm the emitted vocabulary and derive event.outcome from it as
        well; the state that matters is not "stopped" but the difference
        between an administratively stopped agent and one that stopped itself,
        which the vendor's anti-tampering feature may report as a distinct
        value
    - vendor: last_checkin
      type: timestamp
      description: PLACEHOLDER - last time the sensor contacted the management server
      ecs: null
      status: unmapped
      custom: uam.agent.last_checkin
      notes: >
        ECS has no last-seen concept, so this stays custom; the derived gap
        between it and poll_time is the actual detection value and should be
        computed low-side rather than left to query-time date math
    - vendor: policy_name
      type: string
      description: PLACEHOLDER - collection policy assigned to this endpoint
      ecs: rule.name
      status: partial
      notes: >
        the assigned monitoring policy is a policy rule and rule.name is its
        correct ECS home, consistent with the activity dataset; there is no
        documented policy id, so a rename breaks correlation
    - vendor: policy_version
      type: string
      description: PLACEHOLDER - version or revision of the assigned collection policy
      ecs: null
      status: unmapped
      custom: uam.policy.version
      notes: >-
        needed to tell an endpoint running a stale policy from one running the
        current one; pairs with the console-audit dataset's policy change
        records
    - vendor: channels_enabled
      type: string
      description: >-
        PLACEHOLDER - which collection channels the assigned policy has turned
        on for this endpoint
      ecs: null
      status: unmapped
      custom: uam.agent.channels_enabled
      notes: >
        this is the coverage record and has no ECS equivalent. Everfox
        documents "over 15 channels" (Application, Clipboard, Email, File,
        Keyboard, Logon, Printer, Process, Registry, System Info, Video, Web,
        Web UI, Webmail, Event Log, Network) and its granular policy and "do
        not collect" controls mean any of them may be legitimately off;
        without this field an absent channel is indistinguishable from an
        absent event. Confirm whether it is emitted as a list or a bitmask
    - vendor: throttle_state
      type: enum
      description: >-
        PLACEHOLDER - whether the sensor's self-throttling is currently
        limiting collection or transfer
      ecs: null
      status: unmapped
      custom: uam.agent.throttle_state
      notes: >
        the vendor documents configurable throttling of CPU and of the
        transfer of collected data; a throttled agent is reporting healthy
        while shedding telemetry, which is the most deceptive failure mode on
        this technology and has no ECS home
    - vendor: offline_cache_depth
      type: integer
      description: >-
        PLACEHOLDER - count or size of events cached locally while the
        endpoint is off-network
      ecs: null
      status: unmapped
      custom: uam.agent.offline_cache_depth
      notes: >
        the sensor collects persistently while disconnected, so a growing
        cache is expected for travelling endpoints and a cache that stops
        draining after reconnection is not; confirm whether the console
        reports a count or a byte size
    - vendor: tamper_action
      type: string
      description: >-
        PLACEHOLDER - anti-tampering event recorded against the sensor (stop
        attempt, driver unload, uninstall attempt)
      ecs: event.action
      status: partial
      notes: >
        the vendor documents a "privileged user resilient" endpoint with
        anti-tampering features; any value here is high-severity by
        construction, since the population most able to tamper is the
        privileged population the programme most needs to monitor
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Build this as a scheduled console-API collector and turn each poll
          into an explicit per-agent snapshot document with the poll time
          stamped on it, so a missing agent is detectable as an absent row in
          a present snapshot rather than as silence. Derive a single
          reporting-gap value low-side from last_checkin against the poll time
          and derive event.outcome from agent_status there too, because the
          three ways an agent goes quiet - throttled, off-network with a
          filling cache, and stopped or tampered - look identical downstream
          unless throttle_state and offline_cache_depth are carried alongside.
          Emit a synthetic failure document when the poll itself errors: this
          dataset's whole value is that absence is the signal, and a silently
          failing collector produces exactly the same nothing as a healthy
          fleet.
        elastic: >
          Land this in the same restricted logs-uam.agent-insider_threat
          namespace and index template as the activity dataset, with
          custom-namespace mappings for uam.policy.version,
          uam.agent.channels_enabled, uam.agent.throttle_state and
          uam.agent.last_checkin as keyword and uam.agent.offline_cache_depth
          as long. The alerts to build are coverage-shaped rather than
          event-shaped: agent count dropping against the cleared-endpoint
          roster, any tamper_action record at all, and channels_enabled
          changing on an endpoint without a corresponding policy change in the
          console-audit dataset - which is the signature of a local bypass
          rather than an authorised policy edit. Keep the roster join
          (endpoint to cleared user) high-side and inside the restricted
          index; it is an enumeration of who is monitored.
        relay: >
          Low-side instances cross the guard, and this dataset is the easy one
          to cross - short bounded ASCII values, no user content, no free text
          - so it should cross as full ECS-shaped NDJSON with a small
          allowlisted key set that a simple custom filter can validate. The
          design point to raise with the guard owner is not filtering but
          reliability: on an at-most-once path a dropped snapshot looks
          exactly like a fleet-wide agent outage, so send the poll's own row
          count in every snapshot and reconcile low-side against high-side
          counts per (dataset, hour) before anyone alerts on agent-count
          deltas. Carry no _raw; the snapshot is already the record.
      direct:
        parse_location: low
        cribl: >
          Build this as a scheduled console-API collector and turn each poll
          into an explicit per-agent snapshot document with the poll time
          stamped on it, so a missing agent is detectable as an absent row in
          a present snapshot rather than as silence. Derive a single
          reporting-gap value at the edge from last_checkin against the poll
          time and derive event.outcome from agent_status there too, because
          the three ways an agent goes quiet - throttled, off-network with a
          filling cache, and stopped or tampered - look identical downstream
          unless throttle_state and offline_cache_depth are carried alongside.
          Emit a synthetic failure document when the poll itself errors: this
          dataset's whole value is that absence is the signal, and a silently
          failing collector produces exactly the same nothing as a healthy
          fleet.
        elastic: >
          Land this in the same restricted logs-uam.agent-insider_threat
          namespace and index template as the activity dataset, with
          custom-namespace mappings for uam.policy.version,
          uam.agent.channels_enabled, uam.agent.throttle_state and
          uam.agent.last_checkin as keyword and uam.agent.offline_cache_depth
          as long. The alerts to build are coverage-shaped rather than
          event-shaped: agent count dropping against the cleared-endpoint
          roster, any tamper_action record at all, and channels_enabled
          changing on an endpoint without a corresponding policy change in the
          console-audit dataset - which is the signature of a local bypass
          rather than an authorised policy edit. Keep the roster join
          (endpoint to cleared user) high-side and inside the restricted
          index; it is an enumeration of who is monitored.
- id: console-audit
  name: UAM console operator and investigator audit
  description: |
    The watch-the-watcher feed: an audit record for every action a UAM operator, analyst or investigator takes inside the console - viewing a session replay, searching a monitored user's activity, exporting activity records, opening or updating a case, and modifying a monitoring or "do not collect" policy. Everfox documents this explicitly as a product feature: "immutable audit logs provide a 'watch the watcher' feature to support the independent oversight of the operator's activities within the tool, ensuring that monitoring programs are conducted in accordance with your organization's legal and privacy requirements", alongside role-based access separating operator privileges and "two-person authorization for sensitive functions such as modifying user monitoring policies or exporting activity records".
    This is the dataset that makes the whole technology defensible, and it is the one with the sharpest routing consequence. Its subjects are the insider-threat program's own analysts, and its objects are the employees they looked at - so it must NOT be visible to the analysts it audits. The natural audience is oversight: the program's legal, privacy and inspector-general functions, not the CSOC and not the UAM operators.
    FIELD NAMES BELOW ARE PLACEHOLDERS pending confirmation against the deployed console; no vendor publishes an audit field reference.
  event_categories:
  - configuration
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        One extra confirmation matters more here than anywhere else in the
        catalog: whether this feed should traverse the shared Cribl worker
        group at all. Cribl operators would be able to read, in flight, which
        analyst examined which employee - a disclosure the two-person and
        role-based controls in the product exist specifically to prevent. A
        dedicated worker group, or console-side export straight to the
        restricted index, may be the required design.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-uam.console-insider_threat_oversight
      notes: >
        A SEPARATE namespace from the other two datasets, not merely a
        separate data stream. The audience is oversight (legal, privacy, IG)
        rather than the insider-threat analysts, and those two audiences must
        not be granted by the same role: an analyst who can read this index
        can see who is auditing them.
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        One extra confirmation matters more here than anywhere else in the
        catalog: whether this feed should traverse the shared Cribl worker
        group at all. Cribl operators would be able to read, in flight, which
        analyst examined which employee - a disclosure the two-person and
        role-based controls in the product exist specifically to prevent. A
        dedicated worker group, or console-side export straight to the
        restricted index, may be the required design.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-uam.console-insider_threat_oversight
      notes: >
        A SEPARATE namespace from the other two datasets, not merely a
        separate data stream. The audience is oversight (legal, privacy, IG)
        rather than the insider-threat analysts, and those two audiences must
        not be granted by the same role: an analyst who can read this index
        can see who is auditing them.
  formats:
  - format: json
    parsing:
      mechanism: cribl-pipeline
      artifact: custom insider-threat UAM pipeline
      notes: >
        Hand-built, like the rest of the family. The prior question is not how
        to parse these records but whether they are exported at all - the
        vendor describes the audit trail as immutable and held inside the
        console for oversight, which does not imply a streaming export, and a
        deployment may only offer an operator-initiated report. Confirm the
        export mechanism and its own audit trail before design; if the only
        path out is a manual export, the integrity property that makes this
        dataset worth having does not survive the trip and that is a finding
        to raise, not a pipeline to write.
    fields:
    - vendor: event_time
      type: timestamp
      description: PLACEHOLDER - time the console recorded the operator action
      ecs: '@timestamp'
      status: partial
    - vendor: console_name
      type: string
      description: PLACEHOLDER - hostname of the UAM management server that recorded the action
      ecs: observer.name
      status: partial
    - vendor: operator_name
      type: string
      description: >-
        PLACEHOLDER - analyst, investigator or administrator account that
        performed the console action
      ecs: user.name
      status: partial
      notes: >
        the acting party on this dataset is the watcher, not the monitored
        employee; keeping this on user.name and the subject on
        user.target.name is what makes the dataset answerable, and any
        pipeline that collapses the two silently destroys its purpose
    - vendor: operator_role
      type: string
      description: PLACEHOLDER - role-based access role the operator held when acting
      ecs: null
      status: unmapped
      custom: uam.operator.role
      notes: >
        the vendor documents role-based access enforcing separation of duties
        over operator privileges; carrying the role at action time is what
        detects a privilege that was granted, used and removed inside one
        maintenance window. ECS user.roles exists but models the acting user's
        directory roles rather than the product-internal privilege actually
        exercised, so this stays custom pending confirmation of which the
        console emits
    - vendor: subject_user
      type: string
      description: PLACEHOLDER - the monitored employee whose activity data the operator accessed
      ecs: user.target.name
      status: partial
      notes: >
        user.target.* is GA and is the correct home for a party being acted
        upon; this is the field the entire oversight case rests on, so if the
        console does not emit it - if it records that a search ran but not
        whose data it returned - that is a finding to raise with the vendor
        and the programme, not a mapping gap to work around
    - vendor: console_action
      type: enum
      description: >-
        PLACEHOLDER - the operation performed (search activity, view session
        replay, export records, modify policy, open case)
      ecs: event.action
      status: partial
      transform: >
        the vocabulary is product-internal and needs a site lookup; preserve
        the distinction between reading activity data, replaying a screen or
        keystroke capture, and exporting records, because only the export
        moves evidentiary material outside the product's chain of custody and
        the three carry very different oversight weight
    - vendor: action_result
      type: enum
      description: >-
        PLACEHOLDER - whether the console action succeeded, was denied, or is
        awaiting second approval
      ecs: event.outcome
      status: partial
      transform: >
        confirm the vocabulary; as with the guard's admin audit, an action
        submitted and awaiting its second approval is a third state that must
        not collapse into success or failure, and a denied action is a
        stronger signal than a successful one
    - vendor: second_approver
      type: string
      description: >-
        PLACEHOLDER - second operator account that authorised a sensitive
        action under two-person control
      ecs: null
      status: unmapped
      custom: uam.operator.second_approver
      notes: >
        the vendor documents two-person authorization for sensitive functions
        "such as modifying user monitoring policies or exporting activity
        records"; a record of either action with this absent, or with it equal
        to operator_name, is a direct control bypass and the highest-value
        alert on this technology
    - vendor: policy_object
      type: string
      description: >-
        PLACEHOLDER - the monitoring policy, collection channel or "do not
        collect" rule that was changed
      ecs: null
      status: unmapped
      custom: uam.policy.object
      notes: >
        changes cut both ways and both matter: widening collection on a
        specific individual is potential abuse of the capability, and
        narrowing it - disabling a channel or adding a "do not collect" rule -
        is potential evasion. Correlate against uam.policy.version in the
        agent-health dataset, since a channel that changed on an endpoint with
        no corresponding record here was not changed through the console
    - vendor: export_record_count
      type: integer
      description: PLACEHOLDER - number of activity records included in an export action
      ecs: null
      status: unmapped
      custom: uam.export.record_count
      notes: >
        no ECS equivalent; this is the volume signal that separates a routine
        case lookup from a bulk extraction of monitored-employee data, and it
        only means anything if a per-operator baseline is kept
    - vendor: case_id
      type: string
      description: >-
        PLACEHOLDER - investigation or case reference the console action was
        performed under
      ecs: null
      status: unmapped
      custom: uam.case.id
      notes: >
        the vendor documents centralised case management for governance and
        oversight; an access to monitored data with no case reference is the
        cheapest available proxy for an unauthorised look, so confirm whether
        the console requires one
    - vendor: source_address
      type: ip
      description: PLACEHOLDER - address of the workstation the console session originated from
      ecs: source.ip
      status: partial
      notes: >-
        expect this to be absent or loopback for console-local sessions; do
        not drop such records
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Settle the routing question before the parsing one: confirm whether
          this feed may transit the shared worker group at all, and if it may
          not, design for a dedicated group or a console-side export direct to
          the restricted index rather than retrofitting isolation later. In
          the pipeline, keep operator and subject strictly separated onto
          user.name and user.target.name - collapsing them makes the dataset
          useless for its only purpose - and resolve console_action through a
          site lookup that preserves the distinction between reading activity,
          replaying a capture and exporting records, since only the last
          removes data from the product's chain of custody. Carry
          export_record_count and second_approver untouched and never sample
