  - format: syslog-cef
    enable: >
      The same ITM ArcSight CEF export that carries activity alerts also
      exports the operator-audit log type: on the Configuration > Integrations
      > Integrated SIEM > SIEM Log Integration tab, the Audit data types —
      "Audit Sessions", "Audit Logins" and "Audit Configuration Changes" —
      emit signature 500-series CEF records covering console login, session
      and configuration-change activity, the ObserveIT- exemplar analogue of
      this dataset's "watch the watcher" oversight audit. Records land in the
      same Observeit_activity_log.cef file and are tailed to the collector by
      the same ArcSight SmartConnector or forwarder. This is the ITM exemplar
      only: Everfox EverShield's audit export format is controlled and not
      publicly documented, and the prior question from the json feed still
      stands — the vendor describes the audit trail as immutable and held
      inside the console for oversight, which may mean only an
      operator-initiated report is available rather than a streaming CEF
      export, so confirm the export mechanism and its own audit trail before
      design.
    references:
    - >-
      https://prod.docs.oit.proofpoint.com/configuration_guide/integration_using_cef_logs.htm
    - >-
