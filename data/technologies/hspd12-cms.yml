id: hspd12-cms
name: HSPD-12 Card Management System (USAccess/MyID)
vendor: Multiple
versions: >-
  GSA USAccess (MSO-operated IDMS + CMS; build/version not publicly
  documented), Intercede MyID PIV 12.x as the on-premises class exemplar
draft: true
references:
- https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.201-3.pdf
- https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-79-2.pdf
- https://csrc.nist.gov/pubs/sp/800/79/2/final
- https://www.gsa.gov/federal-credentialing-services/about-usaccess
- https://www.fedidcard.gov/your-credential
- https://hspd12.usda.gov/usaccess.html
- >-
  https://www.usda.gov/about-usda/general-information/staff-offices/departmental-administration/office-safety-security-and-protection-ossp/usda-lincpass-program
- https://forums.intercede.com/myid-sdk/myid-core-api/
- >-
  https://forums.intercede.com/wp-content/uploads/Flare/MyID-v1203-ent/Content/MyID%20Core%20API/Introduction/Introduction.htm
- >-
  https://forums.intercede.com/wp-content/uploads/Flare/MyID-v1107-PIV/Content/Advanced%20Configuration/Database/Archiving%20the%20audit%20trail.htm
- https://www.intercede.com/myid-product-suite/myid-cms-solutions/myid-cms/
datasets:
- id: credential-lifecycle-events
  name: PIV credential lifecycle events
  description: |
    The card management system's own record of the PIV credential lifecycle - the ISSUANCE workflow, not the certificate-validation workflow. One record per lifecycle transition for a cardholder's credential: sponsorship (a role holder attests the applicant needs a credential), enrollment (the applicant appears at a credentialing station and surrenders identity documents, fingerprints and a facial image), adjudication result (the eligibility determination returned to the CMS), issuance/print, activation (the applicant performs a 1:1 biometric match at a station and the card is released), PIN reset and PIN unblock, post-issuance update and certificate update/renewal on the card, reissuance, and revocation/termination. FIPS 201-3 names these as the card lifecycle activities and requires the issuer to maintain the enrollment record (formerly "chain-of-trust") across them, including reflecting termination in both the card management system and the enrollment record; NIST SP 800-79-2 is what obliges a PIV Card Issuer to generate and retain audit records over that workflow at all, which is why this feed exists even where the vendor publishes nothing about it.
    SEPARATION FROM pki-ocsp - READ THIS FIRST. This map is the card management system. The certification authority that mints the PIV Authentication, Card Authentication, Digital Signature and Key Management certificates, and the Online Responder that answers revocation questions about them, are a different catalog row (pki-ocsp) with a wholly different log shape. The CMS is what sponsors, adjudicates, enrolls, prints, activates and terminates the CARD; the CA is what issues and revokes the CERTIFICATES on it. The two feeds join on the PIV Authentication certificate serial number and on the timing of a termination - a CMS termination that is never followed by a CA revocation is precisely the gap a CSOC should be watching for, and it is invisible in either map alone.
    HONESTY WARNING - applies to both datasets. There is no public field-level log or export reference for either class exemplar. USAccess is a GSA MSO-operated shared service whose reporting is portal-based - agencies read credential status and progress through the USAccess portal rather than off a documented log stream - and Intercede publishes audit-trail administration and Core API material but not an audit record schema. Consequently every vendor name below is a PLACEHOLDER CONCEPT NAME for a value the FIPS 201-3 / SP 800-79-2 workflow requires the issuer to hold, not a documented vendor column, and the custom namespace is a deliberate hspd12.cms.* placeholder rather than a vendor-prefixed one. The deployed CMS's actual export - portal report, database view, or MyID Core API response - governs; confirm names, types and vocabularies against it before a parser or an alert is built on anything here.
  event_categories:
  - iam
  - authentication
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        A Cribl REST Collector or database collector polls the CMS on a
        schedule. The credentialing enclave holding the IDMS/CMS is usually
        more tightly held than the general estate, and for USAccess the system
        is not on the agency's own network at all but is a GSA-operated shared
        service reached through the portal, so the "source" may be an
        agency-side collector rather than the CMS itself.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-hspd12_cms.lifecycle
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        A Cribl REST Collector or database collector polls the CMS on a
        schedule. The credentialing enclave holding the IDMS/CMS is usually
        more tightly held than the general estate, and for USAccess the system
        is not on the agency's own network at all but is a GSA-operated shared
        service reached through the portal, so the "source" may be an
        agency-side collector rather than the CMS itself.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-hspd12_cms.lifecycle
  formats:
  - format: api-pull
    parsing:
      mechanism: cribl-pipeline
      artifact: custom HSPD-12 CMS lifecycle audit pipeline
      notes: >
        No Elastic integration and no Cribl pack exists for USAccess or MyID,
        so a hand-built pipeline is the only option. The format is recorded as
        api-pull because that is the realistic acquisition for both exemplars
        - MyID exposes a Core API described as a REST interface to the same
        credential lifecycle operations the Operator Client performs, and
        USAccess exposes agency reporting through the portal - but a scheduled
        CSV/report export or a read-only view over the audit tables (MyID
        keeps current and archived audit in the main database by default,
        optionally in separate databases) is equally likely per deployment and
        would change the format to other without changing the field concepts.
        Step one of any parsing work is to capture a real export and confirm
        the record structure; the list below is a skeleton to plan against,
        not a parser spec.
    fields:
    - vendor: event_time
      type: timestamp
      description: time the CMS recorded the lifecycle transition
      ecs: '@timestamp'
      status: partial
      notes: >
        placeholder name; confirm whether the export renders the credentialing
        station's local time or the CMS server's, and whether a timezone is
        carried at all - an activation timestamp that silently follows the
        station's locale will not line up with the CA's issuance record
    - vendor: event_type
      type: enum
      description: the lifecycle transition this record represents
      ecs: event.action
      status: partial
      transform: >
        normalize the deployment's own vocabulary onto a fixed set -
        sponsored, enrolled, adjudicated, issued/printed, activated,
        pin_reset, pin_unblocked, updated, certificate_updated, reissued,
        suspended, terminated - and keep the raw token alongside; FIPS 201-3
        names the activities but every CMS spells them differently, and the
        iam and authentication profiles both require a populated event.action
    - vendor: event_result
      type: enum
      description: whether the lifecycle step completed, failed, or was rejected
      ecs: event.outcome
      status: partial
      notes: >
        SP 800-79-2 leans on the SP 800-53 AU family, which expects a
        success/failure indicator in the audit record, but a CMS export built
        for credential-status reporting commonly lists only completed steps;
        confirm that failed enrollments, failed biometric matches at
        activation and rejected sponsorships appear at all, and leave
        event.outcome unset rather than defaulting to success where they do
        not - absence of failures here is not evidence there were none
    - vendor: request_id
      type: string
      description: >-
        identifier of the credentialing case that ties one applicant's
        lifecycle steps together
      ecs: null
      status: unmapped
      custom: hspd12.cms.request.id
      notes: >
        the join key that stitches sponsorship, enrollment, adjudication,
        issuance and activation into one story; ECS has no workflow/case-id
        field and this must not be overloaded onto event.id, so it stays
        custom - it is the single most valuable field on the dataset for
        reconstructing how a credential came to exist
    - vendor: cardholder_id
      type: string
      description: >-
        CMS/IDMS person identifier for the applicant or cardholder the
        credential belongs to
      ecs: user.target.id
      status: partial
      notes: >
        placeholder name; confirm what the identifier actually is before
        indexing it - if the deployment uses an SSN-derived or otherwise
        PII-bearing key rather than an opaque IDMS id, it must be hashed
        low-side rather than carried
    - vendor: cardholder_name
      type: string
      description: name of the applicant or cardholder the lifecycle event applies to
      ecs: user.target.name
      status: partial
      notes: >
        the iam alerting profile requires user.target.name, and on this
        dataset the cardholder - not the operator - is the party being acted
        upon; expect a display-name form that needs splitting or normalizing
        before it will join to directory identities
    - vendor: cardholder_agency
      type: string
      description: sponsoring agency or bureau the applicant is credentialed under
      ecs: organization.name
      status: partial
      notes: >
        meaningful on a shared service like USAccess, where one CMS serves
        over a hundred agencies and the agency code is what scopes an
        operator's authority; confirm whether the export carries the agency
        code, the display name, or both
    - vendor: operator_id
      type: string
      description: >-
        role holder who performed the lifecycle step (sponsor, registrar,
        activation operator, security officer)
      ecs: user.name
      status: partial
      notes: >
        the actor, and the field both the iam and authentication profiles read
        as user.name; a lifecycle record with no operator is either a
        system-driven transition (scheduled expiry, batch termination) or a
        gap in the export, and the two must be distinguishable before any "who
        issued this card" question can be answered
    - vendor: operator_role
      type: string
      description: role the operator was acting under for this step
      ecs: user.roles
      status: partial
      notes: >
        separation of duties is the control this dataset exists to evidence -
        the same person sponsoring and activating their own applicant is the
        classic HSPD-12 finding - so the role, not just the account, has to
        survive into Elastic
    - vendor: credential_uuid
      type: string
      description: card UUID/GUID identifying the physical credential the event applies to
      ecs: null
      status: unmapped
      custom: hspd12.cms.credential.uuid
      notes: >
        FIPS 201-3 carries a card UUID alongside the CHUID's FASC-N; ECS 9.4
        has no field for the identity of a credential or token. device.id is
        GA but models the endpoint the event came FROM, not a credential acted
        upon, so it is the wrong home - kept custom deliberately
    - vendor: credential_serial
      type: string
      description: card serial number printed on and encoded in the credential
      ecs: null
      status: unmapped
      custom: hspd12.cms.credential.serial
      notes: >
        ECS 9.4 has beta device.serial_number; adopt when GA. Until then this
        is the value a physical-security desk quotes when reporting a lost or
        stolen card, so it needs to be queryable regardless of where it
        eventually lands
    - vendor: fascn
      type: string
      description: Federal Agency Smart Credential Number encoded in the CHUID
      ecs: null
      status: partial
      custom: hspd12.cms.credential.fascn
      notes: >
        the FASC-N embeds agency code, system code and a person identifier, so
        it is PII and is also the value physical access control systems key on
        - treat it as sensitive rather than as an ordinary identifier, and
        expect the release decision on a guarded route to turn on this field
        specifically
      transform: >
        hash or truncate to the agency/system code low-side unless the full
        value is explicitly authorized; if the full value is carried,
        normalize the separator convention, because PACS exports and CMS
        exports rarely spell it the same way
    - vendor: piv_auth_cert_serial
      type: string
      description: >-
        serial number of the PIV Authentication certificate written to the
        card at issuance
      ecs: file.x509.serial_number
      status: partial
      notes: >
        the only durable join between this map and pki-ocsp - it links a CMS
        issuance or termination to the CA's 4887 issuance and 4870 revocation
        records for the same certificate
      transform: >
        ECS 9.4 requires x509.serial_number to be base-16, uppercase, with no
        colons or spaces; CMS exports commonly render lowercase hex or
        colon-separated, so normalize or the cross-map join silently never
        matches
    - vendor: credential_state
      type: enum
      description: >-
        state of the credential after the transition (pending, issued, active,
        suspended, terminated, destroyed)
      ecs: null
      status: unmapped
      custom: hspd12.cms.credential.state
      notes: >
        the post-transition state, distinct from the transition itself;
        carrying both is what makes a "cards active for separated personnel"
        query possible without replaying every event, and the vocabulary is
        deployment-specific enough that it must be confirmed rather than
        assumed
    - vendor: adjudication_status
      type: enum
      description: >-
        eligibility determination returned to the CMS for the applicant
        (favorable, interim, unfavorable, pending)
      ecs: null
      status: unmapped
      custom: hspd12.cms.adjudication.status
      notes: >
        Privacy Act material about a named individual and the most sensitive
        value in the map - the CSOC's legitimate need is to know that an
        adjudication transition happened and that issuance did not precede it,
        which the event type and timing already give. Default to carrying the
        transition and dropping the determination value, and treat any
        decision to index the value itself as one for the privacy and
        credentialing owners rather than the pipeline
    - vendor: revocation_reason
      type: string
      description: reason recorded for a suspension, termination or card destruction
      ecs: event.reason
      status: partial
      notes: >
        the CMS vocabulary (separation, transfer, lost, stolen, damaged,
        expired, investigation) is broader than the CRLReason codes the CA
        records, so the two will not map one-to-one; lost and stolen are the
        values worth alerting on directly, and a termination for those reasons
        that never produces a CA revocation is the highest -value cross-map
        detection this technology supports
    - vendor: workstation_id
      type: string
      description: >-
        credentialing station, light activation workstation, or kiosk the step
        was performed at
      ecs: host.name
      status: partial
      notes: >
        the iam and authentication profiles both require host.name, but expect
        a station identifier or asset tag rather than a resolvable hostname;
        if it is not resolvable, keep it here anyway and enrich to a real host
        low-side rather than leaving the profile field empty
    - vendor: workstation_ip
      type: ip
      description: network address of the station or client the lifecycle step was performed from
      ecs: source.ip
      status: partial
      notes: >
        required by the authentication profile; on a portal-based shared
        service this may be absent entirely, or may be the address of an
        agency proxy rather than the operator's station, so confirm what it
        actually observes before writing location-based rules on it
    - vendor: site_code
      type: string
      description: credentialing centre, enrollment site or agency location the step occurred at
      ecs: null
      status: unmapped
      custom: hspd12.cms.site.code
      notes: >
        ECS has no site/facility field that is not tied to geo resolution; the
        site is how a credentialing programme is actually managed and is the
        natural aggregation for an "activations at an unexpected site" rule
    - vendor: event_description
      type: string
      description: human-readable text the CMS recorded with the lifecycle event
      ecs: message
      status: partial
      notes: >
        operator-authored comments and rejection reasons land here, so it is
        unbounded free text that may repeat cardholder PII already carried in
        structured fields - cap it and review it before it crosses any
        boundary
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Confirm the real export shape before writing a parser - every vendor
          name here is a placeholder - then do the shaping low-side in the
          REST/database collector's pipeline, because there is no integration
          to inherit and this feed carries PII that should be reduced as near
          the source as possible. Redact or hash the FASC-N and drop the
          adjudication determination value (keep only the fact that an
          adjudication transition occurred) before anything leaves the
          collector, normalize the certificate serial to uppercase base-16
          with no separators so the join to pki-ocsp resolves, and derive a
          deduplication key from the lifecycle request id plus event type plus
          timestamp since a polled collector will re-read overlapping windows.
          Gate the Elastic destination with Persistent Queue backpressure and
          keep the raw polled record until the placeholder names are confirmed
          against a live export.
        elastic: >
          Own a custom logs-hspd12_cms.lifecycle ingest pipeline and explicit
          index-template mappings rather than letting dynamic mapping guess -
          hspd12.cms.credential.uuid, .serial, .fascn and .state,
          hspd12.cms.request.id and hspd12.cms.site.code as keyword. The three
          normalizations worth doing high-side are an event-type lookup that
          populates event.action and event.category consistently across
          sponsorship/enrollment/adjudication/issuance/activation/
          PIN-reset/certificate-update/termination, an explicit event.outcome
          that stays unset rather than defaulting to success when the export
          records only completed steps, and a termination reconciliation:
          alert when a lifecycle termination has no matching AD CS revocation
          (pki-ocsp event 4870) for the same certificate serial inside the
          agreed window. Do not model the cardholder as user.name - the iam
          profile reads user.name as the actor, and on this dataset the actor
          is the role holder while the cardholder is user.target.name.
        relay: >
          Low-side instances cross as full ECS-shaped NDJSON (envelope mode B)
          rather than a thin envelope, because the content decisions on this
          route are field-aware: the FASC-N, cardholder name and adjudication
          determination are the values a release policy will care about, and a
          filter cannot act on them inside an opaque _raw blob. Constrain the
          JSON low-side - nesting depth two, short ASCII keys, bounded string
          lengths - so the custom NDJSON filter can stay simple, and settle
          with the guard owner whether cardholder PII and any adjudication
          field are permitted to traverse at all before assuming they will.
          Nothing CEF-shaped crosses here; the crossing is at-most-once with
          no acknowledgement, and because lifecycle events are low-volume and
          individually significant, per-(dataset, hour) low-side/high-side
          count reconciliation matters more on this route than on a
          high-volume one.
      direct:
        parse_location: low
        cribl: >
          Confirm the real export shape before writing a parser - every vendor
          name here is a placeholder - then do the shaping in the
          REST/database collector's pipeline, because there is no integration
          to inherit and this feed carries PII that should be reduced as near
          the source as possible. Redact or hash the FASC-N and drop the
          adjudication determination value (keep only the fact that an
          adjudication transition occurred) before anything leaves the
          collector, normalize the certificate serial to uppercase base-16
          with no separators so the join to pki-ocsp resolves, and derive a
          deduplication key from the lifecycle request id plus event type plus
          timestamp since a polled collector will re-read overlapping windows.
          Gate the Elastic destination with Persistent Queue backpressure and
          keep the raw polled record until the placeholder names are confirmed
          against a live export.
        elastic: >
          Own a custom logs-hspd12_cms.lifecycle ingest pipeline and explicit
          index-template mappings rather than letting dynamic mapping guess -
          hspd12.cms.credential.uuid, .serial, .fascn and .state,
          hspd12.cms.request.id and hspd12.cms.site.code as keyword. The three
          normalizations worth doing in the ingest pipeline are an event-type
          lookup that populates event.action and event.category consistently
          across sponsorship/enrollment/adjudication/issuance/activation/
          PIN-reset/certificate-update/termination, an explicit event.outcome
          that stays unset rather than defaulting to success when the export
          records only completed steps, and a termination reconciliation:
          alert when a lifecycle termination has no matching AD CS revocation
          (pki-ocsp event 4870) for the same certificate serial inside the
          agreed window. Do not model the cardholder as user.name - the iam
          profile reads user.name as the actor, and on this dataset the actor
          is the role holder while the cardholder is user.target.name.
- id: operator-admin-audit
  name: CMS operator and administrative audit
  description: |
    The card management system administering itself, rather than administering credentials: operator sign-on to the CMS or Operator Client, assignment and removal of credentialing roles and of the agency/site scope an operator may act within, changes to credential profiles and issuance policy, changes to which CA or certificate profile a credential draws from, retrieval of unblock codes and key recovery, configuration of encoders, printers and enrollment stations, and bulk report or data export. This is the smaller and quieter half of the map and the one that answers "who could have issued that card", which is a different question from "who did". The two most alert-worthy things here are an operator being granted sponsor or activation authority outside the normal joiner process, and a bulk export of cardholder records - the CMS holds identity-proofing material for the entire credentialed population, so an export is a privacy incident in a way that a single lifecycle event is not.
    The same honesty warning as the first dataset applies in full: the vendor names are placeholder concept names, the hspd12.cms.* namespace is a placeholder, and the deployed CMS's export governs. For USAccess in particular, an agency may have no visibility into MSO-side administrative actions at all and only into its own role holders' activity - confirm the scope of what the export can even show before treating a quiet feed as a clean one.
  event_categories:
  - iam
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same collector as the lifecycle dataset. The two datasets are almost
        certainly two filters over one audit trail rather than two feeds, so
        they land on the same side of the boundary as each other.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-hspd12_cms.operator_audit
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same collector as the lifecycle dataset. The two datasets are almost
        certainly two filters over one audit trail rather than two feeds, so
        they land on the same side as each other.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-hspd12_cms.operator_audit
  formats:
  - format: api-pull
    parsing:
      mechanism: cribl-pipeline
      artifact: custom HSPD-12 CMS operator audit pipeline
      notes: >
        Same acquisition as the lifecycle dataset and, in both exemplars, very
        likely the same underlying audit store filtered differently - MyID
        keeps its audit trail in the main database by default, and USAccess
        surfaces role-holder activity through portal reporting. Split them
        into two data streams anyway: the retention, the alerting profiles and
        the privacy sensitivity of the two are different, and collapsing them
        makes the iam profile's actor and target semantics inconsistent
        between records.
    fields:
    - vendor: event_time
      type: timestamp
      description: time the CMS recorded the administrative action
      ecs: '@timestamp'
      status: partial
      notes: placeholder name; same clock and timezone confirmation as the lifecycle dataset
    - vendor: admin_action
      type: enum
      description: >-
        administrative operation performed (operator sign-on, role grant, role
        removal, profile change, policy change, export, device configuration)
      ecs: event.action
      status: partial
      transform: >
        normalize the deployment vocabulary onto a fixed set and keep the raw
        token; both the iam and configuration profiles require a populated
        event.action, and the raw token is what distinguishes a role grant
        from a scope change once the vocabulary is collapsed
    - vendor: action_result
      type: enum
      description: >-
        whether the administrative action succeeded, failed, or was denied for
        lack of permission
      ecs: event.outcome
      status: partial
      notes: >
        a denied administrative action is the signal worth having here -
        confirm the export records permission denials at all rather than only
        committed changes, and leave event.outcome unset if it does not
    - vendor: operator_id
      type: string
      description: operator or administrator who performed the action
      ecs: user.name
      status: partial
      notes: >-
        the actor, consistent with the lifecycle dataset; required by both the
        iam and configuration profiles
    - vendor: operator_role
      type: string
      description: role the acting operator held at the time of the action
      ecs: user.roles
      status: partial
    - vendor: target_operator
      type: string
      description: >-
        operator account the administrative action was performed on, for role
        and scope changes
      ecs: user.target.name
      status: partial
      notes: >
        the iam profile requires user.target.name; on this dataset the target
        is another operator, not a cardholder, which is the semantic
        difference from the lifecycle dataset and the reason the two are
        separate data streams
    - vendor: target_role
      type: string
      description: credentialing role granted to or removed from the target operator
      ecs: user.changes.roles
      status: partial
      notes: >
        ECS user.changes.* models the post-change state of a modified user,
        which is the right shape for a grant but not for a removal - carry the
        admin_action token alongside so a revocation is not read as a grant of
        the same role
    - vendor: operator_scope
      type: string
      description: agency, bureau or site scope within which the target operator may act
      ecs: null
      status: unmapped
      custom: hspd12.cms.operator.scope
      notes: >
        on a shared service the scope matters as much as the role - a sponsor
        scoped to the wrong bureau is an authority problem even with a correct
        role - and ECS has no field for the boundary an authorization applies
        within
    - vendor: config_item
      type: string
      description: >-
        credential profile, issuance policy or device configuration item that
        was changed
      ecs: null
      status: unmapped
      custom: hspd12.cms.config.item
      notes: >
        index as a first-class keyword: a change to the credential profile
        that governs which certificate policy or CA a card draws from is the
        CMS equivalent of a certificate-template change on the CA side, and it
        needs to be aggregable per item
    - vendor: config_new_value
      type: string
      description: value the configuration item was changed to
      ecs: null
      status: partial
      custom: hspd12.cms.config.new_value
      notes: >
        confirm whether the export carries the prior value as well; if it
        records only the new one, configuration drift has to be reconstructed
        by ordering successive events per item rather than by diffing a single
        record, and the field can be large enough to need a length cap
    - vendor: export_record_count
      type: integer
      description: number of cardholder records returned by a report or bulk export
      ecs: null
      status: unmapped
      custom: hspd12.cms.export.record_count
      notes: >
        the CMS holds identity-proofing material for the whole credentialed
        population, so a large export is a privacy incident rather than
        routine reporting; alert on any non-trivial value and confirm the
        export is audited at all, since report-running is the administrative
        action most likely to be missing from a vendor audit trail
    - vendor: client_ip
      type: ip
      description: network address the administrative session originated from
      ecs: source.ip
      status: partial
      notes: may be an agency proxy or absent entirely on a portal-based shared service
    - vendor: cms_server
      type: string
      description: CMS application server or portal instance that recorded the action
      ecs: host.name
      status: partial
      notes: >
        required by both profiles; on a GSA-operated shared service this may
        be a service name rather than a host the agency owns, in which case
        populate observer.name as well so the record is not mistaken for
        agency-owned infrastructure
    - vendor: event_description
      type: string
      description: human-readable text the CMS recorded with the administrative action
      ecs: message
      status: partial
      notes: >-
        unbounded operator-authored free text; cap it and review it before it
        crosses any boundary
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Reuse the lifecycle collector and split on event class in the
          pipeline rather than polling twice, and resolve the actor/target
          semantics low-side so they are consistent with the other dataset -
          the operator performing the change is user.name and the operator
          being granted or stripped of a role is user.target.name, never the
          reverse. Cap the configuration new-value blob to a flagged length
          (credential-profile changes can carry large policy documents), drop
          any unblock code or key-recovery material outright rather than
          masking it, and use Persistent Queue backpressure on the Elastic
          destination. Volume here is low enough that keeping the raw polled
          record costs nothing and is worth it until the placeholder names are
          confirmed.
        elastic: >
          Own a custom logs-hspd12_cms.operator_audit ingest pipeline with
          explicit keyword mappings for hspd12.cms.operator.scope,
          hspd12.cms.config.item and hspd12.cms.export.record_count as long,
          and derive event.action from the administrative action vocabulary so
          the configuration profile has something to read. The
          configuration-drift problem is the one to design for: if the export
          records only the new value and never the old, a drift view has to be
          reconstructed by ordering successive events per configuration item,
          so index the item name as a first-class keyword rather than leaving
          it inside free text. Alert on credentialing-role grants that fall
          outside the joiner process and on any export whose record count
          exceeds a small threshold.
        relay: >
          This route crosses as full ECS-shaped NDJSON alongside the lifecycle
          dataset, sharing the same outer envelope keys so the custom filter
          sees one schema for the technology rather than two. The friction
          here is narrower than on the lifecycle route - no FASC-N and no
          adjudication data - but the configuration new-value field is
          unbounded and may carry policy documents or certificate-profile
          content, so cap and flag it low-side with an explicit truncation
          marker rather than letting a hand-written filter reject the very
          record that shows an issuance policy being weakened. At-most-once
          crossing: reconcile counts per (dataset, hour), which matters here
          because the feed is quiet enough that a silent drop looks exactly
          like a normal day.
      direct:
        parse_location: low
        cribl: >
          Reuse the lifecycle collector and split on event class in the
          pipeline rather than polling twice, and resolve the actor/target
          semantics in the collector so they are consistent with the other
          dataset - the operator performing the change is user.name and the
