          never the reverse. Cap the configuration new-value blob to a flagged
          length (credential-profile changes can carry large policy
          documents), drop any unblock code or key-recovery material outright
          rather than masking it, and use Persistent Queue backpressure on the
          Elastic destination. Volume here is low enough that keeping the raw
          polled record costs nothing and is worth it until the placeholder
          names are confirmed.
        elastic: >
          Own a custom logs-hspd12_cms.operator_audit ingest pipeline with
          explicit keyword mappings for hspd12.cms.operator.scope,
          hspd12.cms.config.item and hspd12.cms.export.record_count as long,
          and derive event.action from the administrative action vocabulary so
          the configuration profile has something to read. The
          configuration-drift problem is the one to design for: if the export
          records only the new value and never the old, a drift view has to be
          reconstructed by ordering successive events per configuration item,
          so index the item name as a first-class keyword rather than leaving
          it inside free text. Alert on credentialing-role grants that fall
          outside the joiner process and on any export whose record count
          exceeds a small threshold.
