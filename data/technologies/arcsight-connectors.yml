id: arcsight-connectors
name: ArcSight SmartConnectors / Connector Appliance (transitional)
vendor: OpenText
versions: >-
  SmartConnector 8.2, 8.3, 8.4, 24.x, 25.1; ArcSight Management Center (ArcMC)
  3.x / Connector Host Appliance
draft: true
references:
- >-
  https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-25.1/pdfdoc/SmartConnInstallandUserGuide/SmartConnInstallandUserGuide.pdf
- >-
  https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors/pdfdoc/SmartConnInstallandUserGuide/SmartConnInstallandUserGuide.pdf
- >-
  https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-8.4/pdfdoc/cef-implementation-standard/cef-implementation-standard.pdf
- >-
  https://community.opentext.com/cfs-file/__key/telligent-evolution-components-attachments/00-224-00-00-00-17-64-26/ArcSight_5F00_Audit_5F00_Event_5F00_IDs.pdf
- >-
  https://community.opentext.com/t5/ArcSight-Tips-Information/HOW-TO-Device-Status-Monitoring-with-ESM-Detailed-Explanation/ta-p/1636683
- >-
  https://www.microfocus.com/documentation/arcsight/arcmc-3.1/ArcMC_AdminGuide_3.1.pdf
- >-
  https://www.microfocus.com/documentation/arcsight/arcsight-platform-21.1/as_platform_admin_guide/Content/arcmc/AuditEvents/AuditEventTypesOverview.htm
- https://www.elastic.co/docs/reference/integrations/cef
- https://github.com/criblpacks/cribl-common-event-format
datasets:
- id: device-status
  name: Connector Device Status (agent:043)
  description: |
    The per-device connectivity report a SmartConnector emits about every log source it is receiving events from. The vendor documents it as the Device Status Monitoring feature: set the connector's "Device Status Monitoring" destination parameter to a millisecond interval of 60000 or greater and the connector "generates internal events periodically ... with the status of the devices for which the connector is receiving normal events", named "Connector Device Status" and carrying the DeviceEventClassId agent:043 (AGENT_DEVICE_STATUS_MONITOR). The documented payload is: event name, vendor and product information, source address and host name, zone, last event received, total number of events for the device since the connector started, and the event count since the last call. The default is -1, meaning DISABLED, so on most estates this feed does not exist until somebody turns it on.
    THIS IS THE FEED-PARITY EVIDENCE, AND IT IS THE REASON THIS WHOLE MAP EXISTS. During the ArcSight-to-Cribl cutover the only question that matters operationally is "which of my sources are still flowing through the legacy collection tier, and which have actually moved?" agent:043 answers it per device, from the legacy tier's own mouth: a device that still appears in the connector's status report with a rising deviceCustomNumber1 has NOT been cut over, and a device whose report stops arriving has either moved or gone dark - and those two are not the same thing. Counting documents in Elastic cannot distinguish them, because a source that silently died looks exactly like a source that was successfully migrated.
    Two vendor caveats decide whether the feed is trustworthy. First, the minimum interval is enforced: a value below 60000 produces a warning in agent.log and the connector silently uses 60000, and a non-numeric value produces an error in agent.log and DISABLES the feature outright - the vendor is explicit that "there is no indication on the Console that anything went wrong". Second, the community-documented practice is to set aggregate.internal.events=false in agent.properties, because aggregated internal events collapse per-device reports and destroy the per-device signal this dataset is collected for. Both conditions are only visible in agent.log, which is why the agent-log dataset in this map is a dependency of this one and not a nice-to-have.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Receives CEF over syslog from the SmartConnector's CEF Syslog
        destination, or from an ArcSight destination whose internal events are
        relayed onward.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-arcsight_connectors.device_status
      notes: >
        The stock CEF integration lands everything in logs-cef.log; a reroute
        processor on deviceEventClassId agent:043 must give this dataset its
        own stream, because it is the one feed whose retention has to OUTLIVE
        the connectors - the parity record is the evidence that the
        decommission was safe, and deleting it with the rest of the
        transitional data destroys that evidence.
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Receives CEF over syslog from the SmartConnector's CEF Syslog
        destination, or from an ArcSight destination whose internal events are
        relayed onward.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-arcsight_connectors.device_status
      notes: >
        The stock CEF integration lands everything in logs-cef.log; a reroute
        processor on deviceEventClassId agent:043 must give this dataset its
        own stream, because it is the one feed whose retention has to OUTLIVE
        the connectors - the parity record is the evidence that the
        decommission was safe, and deleting it with the rest of the
        transitional data destroys that evidence.
  formats:
  - format: syslog-cef
    parsing:
      mechanism: elastic-integration
      artifact: Common Event Format (CEF) integration
      notes: >
        No ArcSight-connector-specific Elastic integration exists. The generic
        Elastic CEF integration parses the header and extensions into cef.*
        plus a thin ECS layer, which is enough for a feed with a decommission
        date. The Cribl Pack for Common Event Format is the low-side
        alternative used where the guard forces CEF conversion before the
        boundary. Either way the dataset-specific work is the label
        indirection: the counters arrive in cn1/cn2 and deviceCustomDate1
        named at runtime by their paired Label keys, not in named fields.
    fields:
    - vendor: deviceEventClassId
      type: string
      description: CEF signature-ID header, agent:043 for every Connector Device Status event
      ecs: event.code
      status: mapped
      notes: >
        the vendor appendix names it AGENT_DEVICE_STATUS_MONITOR and describes
        it as occurring "at the specified interval, if Device Status
        Monitoring is enabled"; it is the only reliable selector for this
        dataset, because the events share a syslog listener with every other
        agent:0xx internal event
    - vendor: name
      type: string
      description: CEF Name header - the fixed string "Connector Device Status"
      ecs: event.action
      status: partial
      notes: >-
        a single constant value rather than an action verb; it carries no
        information beyond confirming the event type and should not be
        normalized into a cross-source action vocabulary
    - vendor: src
      type: ip
      description: sourceAddress - the address of the MONITORED DEVICE this status report is about
      ecs: source.ip
      status: mapped
      notes: >
        semantically overloaded: on this dataset source.ip is the log source
        being reported on, not an attacker or a flow origin, so any detection
        that treats source.ip as adversary infrastructure must exclude this
        data stream. It is nonetheless the correct ECS home and the primary
        join key for per-device cutover tracking
    - vendor: shost
      type: string
      description: >-
        sourceHostName - the hostname of the monitored device this status
        report is about
      ecs: null
      status: partial
      custom: arcsight.connector.device.host
      notes: >
        ECS has no source.hostname, and source.domain is where this catalog
        files a CEF shost elsewhere and where the stock CEF integration puts
        sourceHostName. It is deliberately withheld from source.domain here:
        source.* on this dataset already carries the MONITORED DEVICE rather
        than a flow origin (see the src row above), and putting the device
        name there widens exactly the overload that row exists to warn about.
        The documented home is the custom field, copied to related.hosts so
        the migration burndown can be read by name
    - vendor: sourceZoneURI
      type: string
      description: >-
        the ArcSight network zone URI of the monitored device, e.g. /All
        Zones/ArcSight System/Private Address Space Zones/RFC1918
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.zone_uri
      notes: >
        the vendor lists "Zone" among the documented device-status payload; it
        is ArcSight's own network-model taxonomy with no ECS equivalent, and
        it is the cheapest way to slice the burndown by enclave when the
        device inventory is otherwise unowned
    - vendor: cn1 (with cn1Label)
      type: long
      description: >-
        deviceCustomNumber1 - total event count for this device since the
        connector was started
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.event_count_total
      notes: >
        resets to zero on connector restart, so it is a monotonic counter only
        within a connector uptime window; differencing it across a restart
        produces a negative delta that will be silently read as zero traffic
        unless the pipeline detects the reset. Extract by the paired cn1Label
        value, never by slot number
    - vendor: cn2 (with cn2Label)
      type: long
      description: >-
        deviceCustomNumber2 - event count for this device since the previous
        status report (the last timer interval)
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.event_count_interval
      notes: >
        the field the parity comparison actually wants, because it is
        restart-safe and interval-scoped; a value of zero on a device that is
        still configured is the precise signal "this source has gone quiet on
        the legacy tier", which during cutover means either migrated or broken
        and must be adjudicated against the Cribl-side arrival count for the
        same device
    - vendor: deviceCustomDate1 (with deviceCustomDate1Label)
      type: timestamp
      description: the timestamp of the last event received from this device
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.last_event_time
      notes: >
        ECS has no last-seen field for an observed source; event.end and
        event.start both describe the event's own interval, not a device-level
        watermark, so this stays custom. Must be typed as a date in the index
        template or it dynamically maps to a string and the "silent since"
        query becomes impossible
    - vendor: cs1 (with cs1Label)
      type: string
      description: >-
        deviceCustomString1 - label-named custom slot used in the
        device-status alert/notification text
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.custom_string
      notes: >-
        slot assignment varies by connector type and version, so key off the
        cs1Label value rather than the slot number
    - vendor: ahost
      type: string
      description: >-
        agentHostName - the hostname of the SmartConnector that produced this
        device-status report
      ecs: observer.hostname
      status: partial
      notes: >
        the connector IS the observer on its own internal events, unlike the
        ESM map where observer is the Manager and the connector is a relay.
        The stock CEF integration leaves the value in
        cef.extensions.agentHostName and does NOT populate observer.*, so the
        copy has to be made in a custom pipeline or the configuration alerting
        profile never resolves
    - vendor: agt
      type: ip
      description: >-
        agentAddress - the IP address of the SmartConnector that produced this
        device-status report
      ecs: observer.ip
      status: partial
      notes: >-
        same gap as agentHostName - present in cef.extensions.agentAddress but
        not copied to observer.ip by the stock integration
    - vendor: aid
      type: string
      description: 'agentId - the ArcSight connector''s own persistent identifier'
      ecs: null
      status: unmapped
      custom: arcsight.connector.agent_id
      notes: >
        the only identity that survives a connector rename or host move, so it
        is the correct primary key for "which collector owns this device"
        across the cutover. Deliberately NOT mapped to observer.serial_number
        (a software GUID is not a hardware serial) nor to agent.id, which in
        this stack belongs to the Elastic Agent/Cribl shipper and would be
        overwritten
    - vendor: at
      type: string
      description: agentType - the connector type slug, e.g. syslog_file, cisco_asa_syslog_file
      ecs: observer.type
      status: partial
      notes: >
        ECS observer.type is a loose descriptive vocabulary (firewall, ids,
        proxy) and this is a vendor connector-type slug; keeping it here is
        useful for grouping the burndown by collection method, but do not
        build detections on its literal values
    - vendor: av
      type: string
      description: agentVersion - the SmartConnector build version
      ecs: observer.version
      status: mapped
      notes: >-
        worth retaining through the cutover because device-status behaviour
        and the internal-event set both changed across 8.x releases, so a
        parity anomaly is often a connector-version anomaly
    - vendor: rt
      type: timestamp
      description: >-
        deviceReceiptTime - when the connector generated the status report,
        epoch milliseconds
      ecs: '@timestamp'
      status: mapped
      transform: >
        epoch milliseconds; this is the REPORT time, not the time the device
        last sent anything - that is deviceCustomDate1 - so a freshness query
        built on @timestamp measures the connector's liveness rather than the
        device's and will show every dead source as current
    - vendor: severity
      type: integer
      description: CEF severity header - ArcSight agent severity on the 0-10 scale
      ecs: event.severity
      status: partial
      transform: >
        needs the same 0-10 to platform-numeric lookup as the other CEF
        sources in this map set; device-status events are fixed low severity
        regardless of whether the reported device is healthy or silent, so
        never alert on this field for this dataset
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through for content but make it
          the home of the parity arithmetic: split agent:043 off by
          deviceEventClassId onto its own stream, and emit a per-(connector,
          monitored device, hour) rollup of the interval counter alongside the
          raw events so the "still on legacy" list is a cheap lookup rather
          than an aggregation over a firehose. Enrich device identity near the
          source, where the answer is knowable - source address to site, owner
          and planned cutover wave - because the whole point of the dataset is
          to drive a migration burndown, and a device that cannot be
          attributed to an owner cannot be chased. Use Persistent Queue
          backpressure on the Elastic destination and alert on the ABSENCE of
          agent:043 per connector, since a connector that stops reporting
          device status is indistinguishable from an estate that finished
          migrating.
        elastic: >
          Parse with the stock CEF integration and add a
          logs-arcsight_connectors.device_status@custom pipeline that does
          four things the raw feed cannot: lift cn1/cn2 out of their
          label-named slots into typed long fields and deviceCustomDate1 into
          a real date, or the counters arrive as strings and the burndown
          cannot be charted; copy the monitored device's identity from
          source.ip and the sourceHostName slot into
          arcsight.connector.device.* and related.hosts so per-device parity
          queries do not have to know CEF, and clear the source.domain the
          stock integration fills from sourceHostName, because this stream
          keeps the monitored device's name out of source.*; copy
          agentHostName, agentAddress, agentVersion and agentType out of
          cef.extensions.* into observer.hostname, observer.ip,
          observer.version and observer.type, which the stock integration does
          NOT do; and set event.kind to metric, because these are periodic
          status samples and mixing them into event counts poisons every other
          dashboard. Map the arcsight.connector.* namespace explicitly in the
          index template - counters as long, last_event_time as date, the rest
          keyword - and build the cutover view as devices seen on agent:043 in
          the last hour minus devices seen arriving via Cribl directly.
        relay: >
          Low-side instances cross the guard: send the thin envelope (_dataId,
          @timestamp, host, _raw) as NDJSON with _dataId set to the
          logs-arcsight_connectors.device_status route key - a good Elastic
          parser already exists and the records are small, flat and
          machine-generated, so this is the cheapest dataset in the map to
          push across a custom content filter. Content-filter friction is
          genuinely low here: the only free text is the monitored device's
          hostname and its ArcSight zone URI, both of which should be
          length-capped and stripped of control characters low-side so the
          filter rules stay simple. The crossing is at-most-once with no
          return channel, which bites harder on this dataset than any other in
          the map: a dropped agent:043 report reads exactly like a device that
          stopped sending, so the low-side vs high-side count reconciliation
          per (dataset, hour) is not a hygiene control here - it is the
          control that stops a transport gap from being logged as a successful
          migration.
      direct:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through for content but make it
          the home of the parity arithmetic: split agent:043 off by
          deviceEventClassId onto its own stream, and emit a per-(connector,
          monitored device, hour) rollup of the interval counter alongside the
          raw events so the "still on legacy" list is a cheap lookup rather
          than an aggregation over a firehose. Enrich device identity near the
          source, where the answer is knowable - source address to site, owner
          and planned cutover wave - because the whole point of the dataset is
          to drive a migration burndown, and a device that cannot be
          attributed to an owner cannot be chased. Use Persistent Queue
          backpressure on the Elastic destination and alert on the ABSENCE of
          agent:043 per connector, since a connector that stops reporting
          device status is indistinguishable from an estate that finished
          migrating.
        elastic: >
          Parse with the stock CEF integration and add a
          logs-arcsight_connectors.device_status@custom pipeline that does
          four things the raw feed cannot: lift cn1/cn2 out of their
          label-named slots into typed long fields and deviceCustomDate1 into
          a real date, or the counters arrive as strings and the burndown
          cannot be charted; copy the monitored device's identity from
          source.ip and the sourceHostName slot into
          arcsight.connector.device.* and related.hosts so per-device parity
          queries do not have to know CEF, and clear the source.domain the
          stock integration fills from sourceHostName, because this stream
          keeps the monitored device's name out of source.*; copy
          agentHostName, agentAddress, agentVersion and agentType out of
          cef.extensions.* into observer.hostname, observer.ip,
          observer.version and observer.type, which the stock integration does
          NOT do; and set event.kind to metric, because these are periodic
          status samples and mixing them into event counts poisons every other
          dashboard. Map the arcsight.connector.* namespace explicitly in the
          index template - counters as long, last_event_time as date, the rest
          keyword - and build the cutover view as devices seen on agent:043 in
          the last hour minus devices seen arriving via Cribl directly.
  - format: avro-kafka
    enable: >
      Add a Transformation Hub destination to the SmartConnector (agent setup:
      "Add a destination" -> Transformation Hub / Event Broker, supplying the
      Kafka broker list and topic) and set the destination content type to
      Avro rather than CEF. From SmartConnector 8.1 onward the connector
      fetches the ArcSight event Avro schema from the Transformation Hub
      Schema Registry over HTTPS, caches it under user/agent, and publishes
      Avro-serialized events onto a Kafka topic (the product default for Avro
      is th-arcsight-avro). Device Status Monitoring is still turned on
      exactly as for the CEF feed - set the connector's Device Status
      Monitoring destination parameter to a millisecond interval of 60000 or
      greater - and the agent:043 "Connector Device Status" internal events
      flow to this destination alongside every other event. What changes is
      the serialization and the field tokens: the Avro records carry the
      canonical ArcSight event-schema names (deviceEventClassId,
      deviceCustomNumber1, sourceAddress, agentHostName) instead of the CEF
      short keys (cn1, src, ahost), and the label slots arrive as their own
      paired fields (deviceCustomNumber1Label) rather than inline CEF
      extensions. The connector must be able to reach the Schema Registry
      host/port to encode at all, which is a new dependency this destination
      adds.
    references:
    - >-
      https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-25.1/pdfdoc/SmartConnInstallandUserGuide/SmartConnInstallandUserGuide.pdf
    - >-
      https://community.opentext.com/cybersec/threat-detect-response/f/discussions/1953/unable-to-find-schema-registry-host-and-port-for-avro
    - >-
      https://www.microfocus.com/documentation/arcsight/logger-7.2.2/Logger-Admin-Guide/Content/Logger_AdminGuide/Configuration/TH_Destinations.htm
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Transformation Hub Avro Kafka source + decode pipeline
      notes: >
        No Elastic integration consumes the th-arcsight-avro topic - the
        vendor documents it as "for ArcSight product use only" (ESM,
        Investigate, Database) - so there is no stock parser as there is for
        the CEF path. A Cribl Kafka source with a Schema-Registry-aware Avro
        decode (or any Confluent-schema Avro consumer) unwraps the record into
        a flat object of canonical field names; from there the
        dataset-specific work is the SAME label indirection as the CEF feed,
        because deviceCustomNumber1/2 and deviceCustomDate1 are still named at
        runtime by their paired *Label fields, not by a fixed semantic name.
        The upside over CEF is typing: Avro carries the counters as numeric
        and the date as a logical timestamp, so the string-to-long and
        string-to-date coercions the CEF pipeline needs largely disappear.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Subscribe the edge worker group's Kafka source to the Avro topic and
          decode against the Schema Registry there, then run the same parity
          arithmetic the CEF path documents: split agent:043 off by
          deviceEventClassId onto its own stream and emit a per-(connector,
          monitored device, hour) rollup of deviceCustomNumber2 so the "still
          on legacy" list stays a cheap lookup. Enrich device identity near
          the source (sourceAddress to site, owner, planned cutover wave) so
          the burndown can be chased by owner. The one new operational cost is
          the Schema Registry dependency: the connector and the decoder both
          need reachability to it, so in a low-side enclave the registry (or a
          cached copy of the schema) has to live inside the enclave - plan for
          that rather than letting decode fail closed. Alert on the ABSENCE of
          agent:043 per connector exactly as on the CEF feed.
        elastic: >
          There is no CEF integration to lean on here, so do not try to land
          raw Avro in Elasticsearch: decode to NDJSON at Cribl and ship the
          pre-shaped documents into logs-arcsight_connectors.device_status
          behind a custom ingest pipeline and index template. Because Avro
          already types deviceCustomNumber1/2 as long and deviceCustomDate1 as
          a timestamp, the pipeline's job shrinks to copying the label- named
          counters into arcsight.connector.device.* , lifting
          agentHostName/agentAddress/agentVersion/agentType into
          observer.hostname/ip/version/type, and setting event.kind to metric
          so periodic status samples never inflate event counts. Map the
          arcsight.connector.* namespace explicitly - counters as long,
          last_event_time as date, the rest keyword.
        relay: >
          Decode the Avro low-side and cross the guard as the same thin NDJSON
          envelope the CEF feed uses (_dataId, @timestamp, host, plus the
          flattened fields). Binary Avro must NEVER reach the boundary: it is
          framed against an external Schema Registry the high side cannot
          resolve, so a record that crossed as raw Avro would be undecodable
          on the far side - strictly worse than a cut CEF line. The records
          are small, flat and machine-generated once decoded, so this remains
          the cheapest dataset in the map to push across a custom content
          filter; length-cap and strip control characters from the only free
          text (the monitored device hostname and its zone URI) low-side. The
          crossing is at-most-once with no return channel, so keep the
          per-(dataset, hour) low-side/high-side count reconciliation - a
          dropped agent:043 still reads exactly like a device that went quiet.
      direct:
        parse_location: hybrid
        cribl: >
          High-side instances skip the guard hops: subscribe the core worker
          group's Kafka source to the Avro topic, decode against the Schema
          Registry, split agent:043 off by deviceEventClassId onto its own
          stream and emit a per-(connector, monitored device, hour) rollup of
          deviceCustomNumber2 so the "still on legacy" list stays a cheap
          lookup, then ship straight to Elastic. No enclave-local registry
          copy is needed here, but the decoder still depends on registry
          reachability, so treat a schema-fetch failure as a feed-down
          condition and alert on it rather than dropping silently.
        elastic: >
          Consume the decoded NDJSON into
          logs-arcsight_connectors.device_status with a custom ingest pipeline
          and index template. Because Avro already types deviceCustomNumber1/2
          as long and deviceCustomDate1 as a timestamp, the pipeline's job
          shrinks to copying the label-named counters into
          arcsight.connector.device.*, lifting
          agentHostName/agentAddress/agentVersion/agentType into
          observer.hostname/ip/version/type, and setting event.kind to metric
          so periodic status samples never inflate event counts. Map the
          arcsight.connector.* namespace explicitly - counters as long,
          last_event_time as date, the rest keyword. Build the cutover view as
          devices seen on agent:043 in the last hour minus devices seen
          arriving via Cribl directly.
    fields:
    - vendor: deviceEventClassId
      type: string
      description: signature-ID, agent:043 for every Connector Device Status event
      ecs: event.code
      status: mapped
      notes: >-
        the canonical schema name equals the CEF header token; still the only
        reliable selector for this dataset
    - vendor: name
      type: string
      description: event name - the fixed string "Connector Device Status"
      ecs: event.action
      status: partial
      notes: >-
        a constant, not an action verb; do not normalize into a cross-source
        action vocabulary
    - vendor: sourceAddress
      type: ip
      description: address of the MONITORED DEVICE this status report is about (CEF src)
      ecs: source.ip
      status: mapped
      notes: >-
        semantically the observed log source, not an attacker; exclude this
        stream from adversary-infrastructure detections
    - vendor: sourceHostName
      type: string
      description: hostname of the monitored device this report is about (CEF shost)
      ecs: null
      status: partial
      custom: arcsight.connector.device.host
      notes: >
        ECS has no source.hostname, and the value is deliberately withheld
        from source.domain for the same reason as the CEF path: source.* on
        this dataset already carries the monitored device rather than a flow
        origin, so the name is kept in the custom field and copied to
        related.hosts. Nothing fills source.domain by default on this path -
        the Avro decode pipeline is authored end to end - so the withholding
        costs nothing to enforce here.
    - vendor: sourceZoneURI
      type: string
      description: ArcSight network zone URI of the monitored device
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.zone_uri
      notes: >-
        ArcSight network-model taxonomy with no ECS equivalent; the cheapest
        way to slice the burndown by enclave
    - vendor: deviceCustomNumber1 (with deviceCustomNumber1Label)
      type: long
      description: total event count for this device since the connector was started (CEF cn1)
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.event_count_total
      notes: >
        resets to zero on connector restart, so it is monotonic only within an
        uptime window; a restart differences to a negative delta that reads as
        zero traffic unless the reset is detected. Extract by the paired Label
        field, never by slot position - the label indirection survives the
        format change.
    - vendor: deviceCustomNumber2 (with deviceCustomNumber2Label)
      type: long
      description: event count since the previous status report (CEF cn2)
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.event_count_interval
      notes: >-
        the restart-safe, interval-scoped counter the parity comparison
        actually wants; zero on a still-configured device means it has gone
        quiet on the legacy tier
    - vendor: deviceCustomDate1 (with deviceCustomDate1Label)
      type: timestamp
      description: timestamp of the last event received from this device
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.last_event_time
      notes: >-
        Avro carries this as a logical timestamp, so the string-to-date
        coercion the CEF feed needs is avoided; still no ECS last-seen field
        for an observed source
    - vendor: deviceCustomString1 (with deviceCustomString1Label)
      type: string
      description: label-named custom slot used in device-status alert/notification text (CEF cs1)
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.custom_string
      notes: slot assignment varies by connector type/version; key off the Label field
    - vendor: agentHostName
      type: string
      description: hostname of the SmartConnector that produced this report (CEF ahost)
      ecs: observer.hostname
      status: partial
      notes: >
        the connector is the observer on its own internal events; the copy
        into observer.hostname has to be made in the custom pipeline because
        nothing does it automatically on the Avro path either.
    - vendor: agentAddress
      type: ip
      description: IP of the SmartConnector that produced this report (CEF agt)
      ecs: observer.ip
      status: partial
      notes: copy into observer.ip in the custom pipeline
    - vendor: agentId
      type: string
      description: 'the connector''s own persistent identifier (CEF aid)'
      ecs: null
      status: unmapped
      custom: arcsight.connector.agent_id
      notes: >
        the only identity that survives a connector rename or host move, so
        the correct primary key for "which collector owns this device".
        Deliberately NOT mapped to observer.serial_number or agent.id (which
        belongs to the Cribl/Elastic shipper in this stack).
    - vendor: agentType
      type: string
      description: connector type slug, e.g. syslog_file (CEF at)
      ecs: observer.type
      status: partial
      notes: >-
        vendor slug, not the ECS descriptive vocabulary; group the burndown by
        it, do not build detections on its literal values
    - vendor: agentVersion
      type: string
      description: SmartConnector build version (CEF av)
      ecs: observer.version
      status: mapped
      notes: >-
        device-status behaviour changed across 8.x, so a parity anomaly is
        often a connector-version anomaly
    - vendor: deviceReceiptTime
      type: timestamp
      description: when the connector generated the status report (CEF rt)
      ecs: '@timestamp'
      status: mapped
      transform: >-
        epoch milliseconds; this is the REPORT time, not the device's
        last-seen time (that is deviceCustomDate1) - a freshness query on
        @timestamp measures the connector's liveness, not the device's
    - vendor: agentSeverity
      type: integer
      description: normalized ArcSight agent severity on the 0-10 scale
      ecs: event.severity
      status: partial
      transform: >
        the Avro schema exposes agentSeverity (and deviceSeverity) directly
        rather than as the CEF header integer; still needs the 0-10 to
        platform-numeric lookup used across this map set, and it is fixed low
        for device-status regardless of device health, so never alert on it
        here.
    - vendor: baseEventCount
      type: long
      description: >-
        aggregation count carried on every ArcSight event, 1 for a single
        event and greater when the connector aggregated
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.base_event_count
      notes: >
        exposed as a first-class field on the Avro/CSV schema where CEF buries
        it; a value above 1 on an agent:043 record is direct evidence the
        parity feed was aggregated (aggregate.internal.events left true) and
        is degraded.
  - format: csv-file
    enable: >
      Add a CSV File destination (agent setup: "Add a destination" -> CSV
      File) and select the event-schema columns to write; the connector writes
      a rotating CSV file whose first row is a case-sensitive header of
      canonical ArcSight field names, one event per subsequent row. The vendor
      is explicit that the header names are recognized by exact,
      case-sensitive spelling, that header order is not significant, and that
      only the columns you choose are emitted - so, exactly like a hand-built
      Apache JSON template, the deployed destination configuration (not any
      fixed vendor table) is the authoritative column list for a given
      connector. agent:043 internal events are written to the same file unless
      excluded by internal-event routing. Because it is a file, this feed is
      collected from the connector host by a file monitor (Cribl file source /
      Elastic filebeat), not over syslog.
    references:
    - >-
      https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-25.1/pdfdoc/SmartConnInstallandUserGuide/SmartConnInstallandUserGuide.pdf
    - >-
      https://community.microfocus.com/cyberres/arcsight/f/discussions/39430/how-to-define-fields-of-cef-file-destination
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ArcSight CSV File pipeline (header-keyed CSV parse)
      notes: >
        No Elastic integration and no vendor Cribl pack parses ArcSight CSV
        output. A Cribl pipeline keys the parse on the emitted header row and
        maps the canonical column names to ECS; because the column set is
        operator-selected the field list is a SUBSET of the schema below, and
        a pipeline must tolerate columns being present or absent rather than
        assuming a fixed order. The custom-number/custom-string label slots
        are only interpretable if the paired *Label columns were also
        selected, so the destination config must include them or the counter
        semantics are lost.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Do the CSV parse at the edge worker group keyed on the header row,
          coerce deviceCustomNumber1/2 to long and deviceCustomDate1/
          deviceReceiptTime to real timestamps (CSV carries everything as
          text, so this is more work than the Avro path), then run the same
          agent:043 split and per-device interval-counter rollup as the other
          formats. Emit ECS-shaped NDJSON. Validate the parsed record against
          a Schema Library schema with a dead-letter route, since a header
          change on the connector side silently shifts columns; run Persistent
          Queue backpressure on the guard destination.
        elastic: >
          Accept the pre-shaped NDJSON into
          logs-arcsight_connectors.device_status behind a custom ingest
          pipeline and index template rather than re-parsing CSV high-side.
          Copy the label-named counters into arcsight.connector.device.* as
          long, deviceCustomDate1 into a date, lift the agent* columns into
          observer.*, and set event.kind to metric. Map the
          arcsight.connector.* namespace explicitly so a column the edge
          forgot to type does not dynamically map to a string.
        relay: >
          Cross as the same thin NDJSON envelope the CEF and Avro paths use;
          nothing CSV-shaped reaches the boundary. Content-filter friction is
          low - the only free text is the monitored device hostname and zone
          URI - so cap and control-character-strip those low-side. The
          crossing is at-most-once, so keep the per-(dataset, hour) count
          reconciliation; a dropped row reads like a silent device.
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard: file-monitor the CSV on the
          connector host, parse keyed on the header, coerce
          deviceCustomNumber1/2 to long and
          deviceCustomDate1/deviceReceiptTime to real timestamps, split
          agent:043 and ship NDJSON straight to Elastic. Validate the parsed
          record against a Schema Library schema with a dead-letter route,
          since a header change on the connector side silently shifts columns.
        elastic: >
          Land the pre-shaped NDJSON into
          logs-arcsight_connectors.device_status via a custom ingest pipeline.
          Copy the label-named counters into arcsight.connector.device.* as
          long, deviceCustomDate1 into a date, lift the agent* columns into
          observer.*, and set event.kind to metric. Map the
          arcsight.connector.* namespace explicitly so a column the edge
          forgot to type does not dynamically map to a string.
    fields:
    - vendor: deviceEventClassId
      type: string
      description: signature-ID column, agent:043
      ecs: event.code
      status: mapped
    - vendor: name
      type: string
      description: event name column - "Connector Device Status"
      ecs: event.action
      status: partial
      notes: constant string, not an action verb
    - vendor: sourceAddress
      type: ip
      description: monitored device address column
      ecs: source.ip
      status: mapped
      notes: the observed log source, not an attacker
    - vendor: sourceHostName
      type: string
      description: monitored device hostname column
      ecs: null
      status: partial
      custom: arcsight.connector.device.host
      notes: >-
        deliberately withheld from source.domain as on the other formats -
        source.* already carries the monitored device on this dataset - so the
        column is kept custom and copied to related.hosts
    - vendor: sourceZoneURI
      type: string
      description: monitored device ArcSight zone URI column
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.zone_uri
    - vendor: deviceCustomNumber1 (with deviceCustomNumber1Label)
      type: long
      description: total event count since connector start
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.event_count_total
      notes: >-
        text in CSV - coerce to long; resets on restart; both the value and
        Label columns must be selected
    - vendor: deviceCustomNumber2 (with deviceCustomNumber2Label)
      type: long
      description: event count since the previous report
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.event_count_interval
      notes: the parity-critical interval counter; coerce to long
    - vendor: deviceCustomDate1 (with deviceCustomDate1Label)
      type: timestamp
      description: last event received from this device
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.last_event_time
      notes: text in CSV - parse to a date or the "silent since" query is impossible
    - vendor: deviceCustomString1 (with deviceCustomString1Label)
      type: string
      description: custom string slot column
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.custom_string
    - vendor: agentHostName
      type: string
      description: emitting connector hostname column
      ecs: observer.hostname
      status: partial
      notes: copy into observer.hostname
    - vendor: agentAddress
      type: ip
      description: emitting connector IP column
      ecs: observer.ip
      status: partial
    - vendor: agentId
      type: string
      description: connector persistent identifier column
      ecs: null
      status: unmapped
      custom: arcsight.connector.agent_id
      notes: primary key for collector ownership; keep out of agent.id
    - vendor: agentType
      type: string
      description: connector type slug column
      ecs: observer.type
      status: partial
    - vendor: agentVersion
      type: string
      description: connector build version column
      ecs: observer.version
      status: mapped
    - vendor: deviceReceiptTime
      type: timestamp
      description: report-generation time column
      ecs: '@timestamp'
      status: mapped
      transform: rendered per connector settings; report time, not device last-seen
    - vendor: agentSeverity
      type: integer
      description: normalized 0-10 agent severity column
      ecs: event.severity
      status: partial
      transform: >-
        0-10 to platform-numeric lookup; fixed low for device-status, never
        alert on it here
    - vendor: baseEventCount
      type: long
      description: aggregation count column
      ecs: null
      status: unmapped
      custom: arcsight.connector.device.base_event_count
      notes: value above 1 means the parity feed was aggregated and is degraded
- id: connector-audit
  name: SmartConnector audit and cache events (agent:0xx)
  description: |
    The connector's own internal audit events, documented in the SmartConnector Installation and User Guide appendix "SmartConnector Audit Events" as "events generated within the SmartConnector to mark a wide variety of routine actions". The operationally load-bearing ones during a Cribl cutover are the lifecycle and backpressure classes: agent:030 AGENT_STARTED and agent:031 AGENT_SHUTTINGDOWN; the cache trio agent:019 AGENT_CACHE_CACHING ("caching events because they could not be immediately transmitted to the Manager"), agent:020 AGENT_CACHE_EMPTY and agent:029 AGENT_CACHE_DROPPED ("forced to drop some of its cached data"); the device-side collection errors agent:015 AGENT_CONNECTION_DEVICE_FAILURE and agent:016 AGENT_CONNECTION_DEVICE_SUCCESS; the parsing and time-integrity classes agent:042 AGENT_UNPARSED_EVENT, agent:012 AGENT_TIME_DEVICE_FAILURE and agent:035 AGENT_TIME_FAILURE; agent:013 AGENT_DEVICE_FOUND ("noted that a new sensor device is sending events"); agent:028 AGENT_UNEXPECTED_ERROR; agent:049 AGENT_OVERRIDE_MISMATCH, which the vendor documents as a twelve-hourly parser-version report; and agent:050 AGENT_RAWEVENT_STATISTICS. The Manager-side view of the same connectors - agent:101 connected, agent:102 sending events but no heartbeats, agent:103 sending neither, agent:104/:105 unknown connector or bad shared secret - is documented in the ESM Console guide and arrives on this same signature-ID vocabulary.
    READ THIS AS THE LEGACY TIER'S OWN CONFESSION, NOT AS A STRATEGIC SOURCE. agent:029 is the single most important signature in the whole map: it is the connector stating that it discarded events it had already collected. Any cutover parity comparison run over a window containing an agent:029 is comparing against a legacy baseline that is itself incomplete, and a migration that "loses" events in that window may in fact have recovered them. agent:019 and agent:020 bracket the windows where the legacy tier was buffering rather than delivering, and agent:042 marks the events the connector's parser could not understand at all - which is exactly the population most likely to be judged a regression when Cribl parses it differently.
    Note the vendor's own warning about the raw-event field: agent:017 has rawEvent present, but "most of the internal events, such as agent:030, agent:031, or agent:050 do not have the rawEvent field", so raw-event integrity checking and any custom raw-event filter do not apply to this dataset and cannot be used to validate it.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same CEF syslog listener as the device-status dataset, separated by
        signature-ID prefix rather than by a distinct source. Where the
        connectors report to ESM rather than directly to a syslog destination,
        the same events arrive relayed by the Forwarding Connector and the
        ORIGINAL connector's identity must be preserved in the agent fields.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-arcsight_connectors.audit
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same CEF syslog listener as the device-status dataset, separated by
        signature-ID prefix rather than by a distinct source. Where the
        connectors report to ESM rather than directly to a syslog destination,
        the same events arrive relayed by the Forwarding Connector and the
        ORIGINAL connector's identity must be preserved in the agent fields.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-arcsight_connectors.audit
  formats:
  - format: syslog-cef
    parsing:
      mechanism: elastic-integration
      artifact: Common Event Format (CEF) integration
      notes: >
        Parsed by the same generic CEF integration; there is no ArcSight
        connector integration and no vendor Cribl pack for the internal event
        stream. The only dataset-specific parsing work is agent:049, for which
        the vendor publishes an explicit slot table (cs1 Parser file, cs2
        Override status, cs3 Default signature, cs4 Override signature, cs5
        Override Parser file, cs6 Override Parser version) alongside the named
        parserVersion and parserIdentifier keys.
    fields:
    - vendor: deviceEventClassId
      type: string
      description: >-
        CEF signature-ID header carrying the connector audit event class, e.g.
        agent:030, agent:029, agent:042
      ecs: event.code
      status: mapped
      notes: >
        the entire signal in this dataset is the signature-ID vocabulary
        rather than the message text; the vendor publishes the full
        agent:000-agent:108 table with stable symbolic names (AGENT_STARTED,
        AGENT_CACHE_DROPPED, AGENT_UNPARSED_EVENT), which makes it the safe
        field for detections to key on
    - vendor: name
      type: string
      description: >-
        CEF Name header - the human-readable audit event name, e.g. "Connector
        started" or "Connector was forced to drop its cached data"
      ecs: event.action
      status: partial
      notes: >-
        fixed vendor phrasing, not ECS action verbs, and the wording differs
        between the connector-side and Manager-side rendering of the same
        class; normalize off deviceEventClassId instead
    - vendor: cat
      type: string
      description: deviceEventCategory - the ArcSight audit taxonomy path for the event
      ecs: null
      status: unmapped
      custom: arcsight.connector.event_category
      notes: >-
        ECS event.category is a closed vocabulary and this is a vendor
        taxonomy path; it is the cheapest way to group the agent:0xx set into
        connection, exception, registration and cache families
    - vendor: msg
      type: string
      description: >-
        rendered audit message text; on agent:028 and agent:042 this carries
        exception detail and unparsed source-event fragments
      ecs: message
      status: mapped
    - vendor: severity
      type: integer
      description: CEF severity header - ArcSight agent severity on the 0-10 scale
      ecs: event.severity
      status: partial
      transform: >
        needs the same 0-10 to platform-numeric lookup as the other CEF
        sources; note that agent:029 (cache dropped) does not carry a notably
        higher severity than routine lifecycle events, so severity is useless
        for prioritising the one signature that invalidates parity work
    - vendor: rt
      type: timestamp
      description: >-
        deviceReceiptTime - when the connector recorded the audit event, epoch
        milliseconds
      ecs: '@timestamp'
      status: mapped
      transform: >-
        epoch milliseconds, emitted as a bare value; needs an explicit
        timezone assumption, and the connector's own agentTimeZone is the
        authority for it
    - vendor: art
      type: timestamp
      description: agentReceiptTime - when the connector processed the event
      ecs: event.created
      status: partial
      notes: >-
        on internally generated events art and rt are near-identical, so the
        pair is only useful as a forwarding-delay drift check when the events
        are relayed onward through ESM
    - vendor: ahost
      type: string
      description: agentHostName - hostname of the SmartConnector the audit event is about
      ecs: observer.hostname
      status: partial
      notes: >
        the connector is the observer for its own audit events; the stock CEF
        integration leaves the value in cef.extensions.agentHostName without
        populating observer.*, and without the copy the agent:102/:103
        heartbeat-loss events cannot be attributed to a collector and are
        unactionable
    - vendor: agt
      type: ip
      description: agentAddress - IP address of the SmartConnector the audit event is about
      ecs: observer.ip
      status: partial
      notes: same cef.extensions.* gap as agentHostName
    - vendor: aid
      type: string
      description: >-
        agentId - the connector's persistent identifier, stable across rename
        and host move
      ecs: null
      status: unmapped
      custom: arcsight.connector.agent_id
      notes: >-
        the join key between this dataset and the device-status dataset;
        deliberately kept out of agent.id, which belongs to the Elastic
        Agent/Cribl shipper in this stack
    - vendor: at
      type: string
      description: agentType - connector type slug identifying the collection method
      ecs: observer.type
      status: partial
      notes: >-
        vendor slug rather than the ECS descriptive vocabulary; useful for
        grouping, not for detection logic
    - vendor: av
      type: string
      description: agentVersion - SmartConnector build version
      ecs: observer.version
      status: mapped
    - vendor: atz
      type: string
      description: agentTimeZone - the time zone of the connector that produced the event
      ecs: null
      status: unmapped
      custom: arcsight.connector.timezone
      notes: >
        no ECS field models an observer's configured time zone; retain it,
        because it is the only in-band evidence of the assumption needed to
        interpret rt, and connector-host timezone drift is a classic source of
        apparent event loss during a cutover comparison
    - vendor: deviceVendor
      type: string
      description: >-
        CEF Device Vendor header - ArcSight on every internally generated
        connector event
      ecs: observer.vendor
      status: mapped
    - vendor: deviceProduct
      type: string
      description: >-
        CEF Device Product header naming the emitting component; the
        discriminator for separating connector-generated from
        Manager-generated events on a shared listener
      ecs: observer.product
      status: mapped
    - vendor: type
      type: integer
      description: ArcSight event type - 0 base, 1 aggregated, 2 correlation, 3 action
      ecs: null
      status: unmapped
      custom: arcsight.connector.event_type
      notes: >
        load-bearing for this map: a value of 1 means the connector aggregated
        internal events, which collapses per-device device-status reports and
        is why the practice is to set aggregate.internal.events=false. Treat
        any type=1 on an agent:043 as evidence the parity feed is degraded
    - vendor: parserVersion
      type: string
      description: the version of the parser file, reported on agent:049
      ecs: null
      status: unmapped
      custom: arcsight.connector.parser.version
      notes: >-
        the vendor documents agent:049 as generated every twelve hours when
        parser.versioning.identifier.map.enabled is true; parser version is
        the honest explanation for two connectors normalizing the same device
        differently
    - vendor: parserIdentifier
      type: string
      description: the unique id value representing the parser file, reported on agent:049
      ecs: null
      status: unmapped
      custom: arcsight.connector.parser.id
      notes: >-
        joins agent:049 back to the parserIdentifier field carried on ordinary
        security events, which is how a parsing regression is traced to a
        specific parser build during cutover comparison
    - vendor: cs1..cs6 (with paired cs1Label..cs6Label)
      type: string
      description: >-
        generic ArcSight custom string slots; on agent:049 the vendor
        documents cs1 Parser file, cs2 Override status, cs3 Default signature,
        cs4 Override signature, cs5 Override Parser file, cs6 Override Parser
        version
      ecs: null
      status: unmapped
      custom: arcsight.connector.custom_string
      notes: >
        agent:049 is the rare case where ArcSight publishes the slot
        assignment, but it still varies by event class elsewhere in the
        agent:0xx set, so any parser must key off the Label value and never
        off the slot number
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Do not build a low-side ArcSight audit parser - this feed has a
          decommission date and the grammar is plain CEF - but do instrument
          it, because two of these signatures change how every other dataset
          is interpreted. Emit low-side counters for agent:019, agent:029 and
          agent:042 per connector per hour and publish them next to the parity
          numbers, so a cutover comparison can be automatically invalidated
          for any window in which the legacy tier was caching or dropping.
          Rate-limit agent:049, which the vendor generates every twelve hours
          per parser file and which will out-volume the lifecycle events that
          matter, and use Persistent Queue backpressure on the Elastic
          destination - blocking a connector that is already caching is how a
          monitoring feed turns into an outage.
        elastic: >
          Parse with the stock CEF integration into
          logs-arcsight_connectors.audit and add a @custom pipeline that
          derives event.outcome from the signature ID through an explicit
          lookup, since these events carry no outcome column: agent:030,
          agent:016, agent:020, agent:101 and agent:025 are success;
          agent:015, agent:028, agent:029, agent:042, agent:102, agent:103,
          agent:104, agent:105, agent:008, agent:011 and agent:026 are
          failure. Resolve the agent:049 cs1-cs6 slots by their documented
          Label values into arcsight.connector.parser.* so a parser-version
          drift between two connectors collecting the same device type is
          visible, copy the agent* extension fields into observer.hostname,
          observer.ip, observer.type and observer.version because the stock
          integration leaves them in cef.extensions.*, and normalize the 0-10
          agent severity onto the platform numeric convention. Set event.kind
          to event and drive the cutover guardrail off this stream: any
          agent:029 marks its window as unusable for parity comparison.
        relay: >
          Low-side instances cross the guard: ECS-shaped NDJSON crosses rather
          than CEF - the connectors keep emitting CEF and that does not
          change, but the conversion happens low-side so nothing CEF-shaped
          reaches the boundary. Content-filter friction is concentrated in msg
          on agent:028 and agent:042, which carry free-form exception text and
          fragments of the unparsed source event respectively: those can be
          kilobyte-scale, can carry non-ASCII bytes from the original device,
          and must be capped and control-character-stripped low-side so a
          custom NDJSON filter stays simple. Because the crossing is
          at-most-once, note the perverse case: agent:029 is precisely the
          event you cannot afford to lose, so give the cache and error
          signatures their own reconciliation counter rather than folding them
          into the dataset-level (dataset, hour) count.
      direct:
        parse_location: high
        cribl: >
          Do not build a low-side ArcSight audit parser - this feed has a
          decommission date and the grammar is plain CEF - but do instrument
          it, because two of these signatures change how every other dataset
          is interpreted. Emit low-side counters for agent:019, agent:029 and
          agent:042 per connector per hour and publish them next to the parity
          numbers, so a cutover comparison can be automatically invalidated
          for any window in which the legacy tier was caching or dropping.
          Rate-limit agent:049, which the vendor generates every twelve hours
          per parser file and which will out-volume the lifecycle events that
          matter, and use Persistent Queue backpressure on the Elastic
          destination - blocking a connector that is already caching is how a
          monitoring feed turns into an outage.
        elastic: >
          Parse with the stock CEF integration into
          logs-arcsight_connectors.audit and add a @custom pipeline that
          derives event.outcome from the signature ID through an explicit
          lookup, since these events carry no outcome column: agent:030,
          agent:016, agent:020, agent:101 and agent:025 are success;
          agent:015, agent:028, agent:029, agent:042, agent:102, agent:103,
          agent:104, agent:105, agent:008, agent:011 and agent:026 are
          failure. Resolve the agent:049 cs1-cs6 slots by their documented
          Label values into arcsight.connector.parser.* so a parser-version
          drift between two connectors collecting the same device type is
          visible, copy the agent* extension fields into observer.hostname,
          observer.ip, observer.type and observer.version because the stock
          integration leaves them in cef.extensions.*, and normalize the 0-10
          agent severity onto the platform numeric convention. Set event.kind
          to event and drive the cutover guardrail off this stream: any
          agent:029 marks its window as unusable for parity comparison.
  - format: avro-kafka
    enable: >
      The same Transformation Hub destination in Avro content mode that
      carries agent:043 carries the whole agent:0xx internal-event set - the
      lifecycle (agent:030/:031), cache (agent:019/:020/:029), device
      collection (agent:015/:016), parse/time-integrity (agent:042/:012/
      :035), agent:049 parser-version and agent:050 raw-event-statistics
      events, plus the Manager-side agent:101-:105 connector-status events
      where the connectors report through ESM. Enabling is identical to the
      device-status case: add the Transformation Hub destination, set the
      content type to Avro, and the connector fetches the event schema from
      the Schema Registry and publishes Avro records to the Kafka topic. The
      audit events arrive with canonical schema names (deviceEventClassId,
      deviceEventCategory, message, agentReceiptTime, parserVersion) rather
      than CEF short keys, and the agent:049 cs1-cs6 slots arrive as
      deviceCustomString1..6 with their paired Label fields.
    references:
    - >-
      https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-25.1/pdfdoc/SmartConnInstallandUserGuide/SmartConnInstallandUserGuide.pdf
    - https://support.microfocus.com/kb/kmdoc.php?id=KM03767444
    - >-
      https://www.microfocus.com/documentation/arcsight/logger-7.2.2/Logger-Admin-Guide/Content/Logger_AdminGuide/Configuration/TH_Destinations.htm
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Transformation Hub Avro Kafka source + decode pipeline
      notes: >
        No Elastic integration consumes th-arcsight-avro, so a Cribl Kafka
        source with Schema-Registry Avro decode flattens the record and the
        dataset-specific work is the same as the CEF path: derive
        event.outcome from the signature-ID vocabulary (there is no outcome
        column) and resolve the agent:049 deviceCustomString1..6 slots by
        their documented Label values. Avro types agentReceiptTime and
        deviceReceiptTime as timestamps and the event type as an integer, so
        the coercions the CEF pipeline needs are reduced, but the outcome and
        label derivations still have to be authored.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Decode the Avro at the edge and instrument the cache/parse
          signatures exactly as on the CEF path: emit low-side counters for
          agent:019, agent:029 and agent:042 per connector per hour next to
          the parity numbers so a cutover comparison can be invalidated for
          any window where the legacy tier was caching or dropping. Rate-
          limit agent:049 (twelve-hourly per parser file). Provision a Schema
          Registry copy or cached schema inside the enclave so decode never
          fails closed, and run Persistent Queue backpressure rather than
          Block - blocking a connector that is already caching turns a
          monitoring feed into an outage.
        elastic: >
          Ship decoded NDJSON into logs-arcsight_connectors.audit behind a
          custom ingest pipeline and index template. Derive event.outcome from
          the signature ID through an explicit lookup (agent:030/:016/
          :020/:101/:025 success; agent:015/:028/:029/:042/:102/:103/:104/
          :105/:008/:011/:026 failure), resolve deviceCustomString1..6 into
          arcsight.connector.parser.* on agent:049, copy agentHostName/
          agentAddress/agentType/agentVersion into observer.*, and set
          event.kind to event. Drive the cutover guardrail off this stream:
          any agent:029 marks its window unusable for parity comparison.
        relay: >
          Decode low-side and cross as ECS-shaped NDJSON; binary Avro and its
          external Schema Registry framing must never reach the guard.
          Content-filter friction concentrates in message on agent:028 and
          agent:042 (exception text and unparsed source-event fragments,
          kilobyte-scale, possibly non-ASCII), so cap and
          control-character-strip message low-side. Because the crossing is
          at-most-once, give the cache/error signatures their own
          reconciliation counter - agent:029 is precisely the event you cannot
          afford to lose.
      direct:
        parse_location: hybrid
        cribl: >
          High-side instances skip the guard: Kafka source, Schema-Registry
          decode, then emit low-side counters for agent:019, agent:029 and
          agent:042 per connector per hour next to the parity numbers so a
          cutover comparison can be invalidated for any window where the
          legacy tier was caching or dropping, rate-limit agent:049
          (twelve-hourly per parser file), and ship straight to Elastic. Treat
          a schema-fetch failure as feed-down and alert rather than dropping.
        elastic: >
          Land decoded NDJSON into logs-arcsight_connectors.audit behind a
          custom ingest pipeline and index template. Derive event.outcome from
          the signature ID through an explicit lookup
          (agent:030/:016/:020/:101/:025 success;
          agent:015/:028/:029/:042/:102/:103/:104/:105/:008/:011/:026
          failure), resolve deviceCustomString1..6 into
          arcsight.connector.parser.* on agent:049, copy
          agentHostName/agentAddress/agentType/agentVersion into observer.*,
          and set event.kind to event. Drive the cutover guardrail off this
          stream: any agent:029 marks its window unusable for parity
          comparison.
    fields:
    - vendor: deviceEventClassId
      type: string
      description: audit event class, e.g. agent:030, agent:029, agent:042 (CEF deviceEventClassId)
      ecs: event.code
      status: mapped
      notes: >-
        the entire signal is the signature-ID vocabulary; the vendor publishes
        the stable agent:000-:108 symbolic table, so it is the safe field to
        key detections on
    - vendor: name
      type: string
      description: human-readable audit event name (CEF name)
      ecs: event.action
      status: partial
      notes: >-
        fixed vendor phrasing that differs between connector-side and
        Manager-side rendering; normalize off deviceEventClassId
    - vendor: deviceEventCategory
      type: string
      description: ArcSight audit taxonomy path for the event (CEF cat)
      ecs: null
      status: unmapped
      custom: arcsight.connector.event_category
      notes: >-
        vendor taxonomy path, not the closed ECS event.category vocabulary;
        groups the agent:0xx set into connection/exception/registration/cache
        families
    - vendor: message
      type: string
      description: >-
        rendered audit message text; on agent:028 and agent:042 carries
        exception detail and unparsed source-event fragments (CEF msg)
      ecs: message
      status: mapped
    - vendor: agentSeverity
      type: integer
      description: normalized 0-10 agent severity
      ecs: event.severity
      status: partial
      transform: >-
        0-10 to platform-numeric lookup; agent:029 carries no higher severity
        than routine lifecycle events, so severity cannot prioritise the one
        signature that invalidates parity work
    - vendor: deviceReceiptTime
      type: timestamp
      description: when the connector recorded the audit event (CEF rt)
      ecs: '@timestamp'
      status: mapped
      transform: >-
        Avro logical timestamp; the connector's agentTimeZone is the authority
        for the intended zone
    - vendor: agentReceiptTime
      type: timestamp
      description: when the connector processed the event (CEF art)
      ecs: event.created
      status: partial
      notes: >-
        near-identical to deviceReceiptTime on internal events; useful only as
        a forwarding-delay drift check when relayed through ESM
    - vendor: agentHostName
      type: string
      description: hostname of the SmartConnector the audit event is about (CEF ahost)
      ecs: observer.hostname
      status: partial
      notes: >-
        copy into observer.hostname or agent:102/:103 heartbeat-loss events
        cannot be attributed to a collector
    - vendor: agentAddress
      type: ip
      description: IP of the SmartConnector the audit event is about (CEF agt)
      ecs: observer.ip
      status: partial
    - vendor: agentId
      type: string
      description: connector persistent identifier, stable across rename and host move (CEF aid)
      ecs: null
      status: unmapped
      custom: arcsight.connector.agent_id
      notes: the join key to the device-status dataset; kept out of agent.id
    - vendor: agentType
      type: string
      description: connector type slug identifying the collection method (CEF at)
      ecs: observer.type
      status: partial
    - vendor: agentVersion
      type: string
      description: SmartConnector build version (CEF av)
      ecs: observer.version
      status: mapped
    - vendor: agentTimeZone
      type: string
      description: time zone of the connector that produced the event (CEF atz)
      ecs: null
      status: unmapped
      custom: arcsight.connector.timezone
      notes: >-
        no ECS field models an observer's configured time zone; the only
        in-band evidence of the assumption needed to interpret the timestamps
    - vendor: deviceVendor
      type: string
      description: ArcSight on every internally generated connector event (CEF deviceVendor)
      ecs: observer.vendor
      status: mapped
    - vendor: deviceProduct
      type: string
      description: >-
        component that emitted the event; discriminates connector-generated
        from Manager-generated on a shared feed (CEF deviceProduct)
      ecs: observer.product
      status: mapped
    - vendor: type
      type: integer
      description: ArcSight event type - 0 base, 1 aggregated, 2 correlation, 3 action
      ecs: null
      status: unmapped
      custom: arcsight.connector.event_type
      notes: >
        load-bearing: a value of 1 means the connector aggregated internal
        events, which collapses per-device device-status reports and is why
        aggregate.internal.events=false is the documented practice; treat any
        type=1 on an agent:043 as evidence the parity feed is degraded.
    - vendor: parserVersion
      type: string
      description: version of the parser file, reported on agent:049
      ecs: null
      status: unmapped
      custom: arcsight.connector.parser.version
      notes: >-
        the honest explanation for two connectors normalizing the same device
        differently
    - vendor: parserIdentifier
      type: string
      description: unique id of the parser file, reported on agent:049
      ecs: null
      status: unmapped
      custom: arcsight.connector.parser.id
      notes: >-
        joins agent:049 back to the parserIdentifier carried on ordinary
        security events, tracing a parsing regression to a specific parser
        build
    - vendor: deviceCustomString1..6 (with paired deviceCustomString1Label..6Label)
      type: string
      description: >-
        generic custom string slots; on agent:049 the vendor documents cs1
        Parser file, cs2 Override status, cs3 Default signature, cs4 Override
        signature, cs5 Override Parser file, cs6 Override Parser version
      ecs: null
      status: unmapped
      custom: arcsight.connector.custom_string
      notes: >
        agent:049 is the rare case where the slot assignment is published, but
        it varies elsewhere in the agent:0xx set, so key off the Label field
        and never the slot position - the label indirection is identical to
        the CEF cs1..cs6 problem.
    - vendor: baseEventCount
      type: long
      description: aggregation count on the event
      ecs: null
      status: unmapped
      custom: arcsight.connector.base_event_count
      notes: a value above 1 corroborates a type=1 aggregated internal event
  - format: csv-file
    enable: >
      The same CSV File destination that captures agent:043 captures the whole
      agent:0xx internal-event set to a rotating CSV file with a
      case-sensitive header of canonical ArcSight field names. Enabling is
      identical to the device-status CSV case - add a CSV File destination and
      select the columns - and internal audit events are written unless
      excluded by internal-event routing. To keep the agent:049 parser-
      version slots interpretable the deviceCustomString1..6 columns and their
      paired Label columns must be selected. Collected as files from the
      connector host, not over syslog.
    references:
    - >-
      https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-25.1/pdfdoc/SmartConnInstallandUserGuide/SmartConnInstallandUserGuide.pdf
    - >-
      https://community.microfocus.com/cyberres/arcsight/f/discussions/39430/how-to-define-fields-of-cef-file-destination
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ArcSight CSV File pipeline (header-keyed CSV parse)
      notes: >
        Header-keyed CSV parse mapping canonical column names to ECS; the
        column set is operator-selected so the field list is a subset of the
        schema below. The signature-ID outcome derivation and the agent:049
        label-slot resolution are the same as the Avro path, plus CSV-only
        text-to-type coercion for the timestamps and the event type.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the CSV at the edge keyed on the header, coerce the timestamps
          and the event type from text, then emit the same agent:019/:029/:042
          instrumentation counters as the other formats and ECS-shaped NDJSON.
          Guard against silent header drift with a Schema Library validation
          and a dead-letter route; Persistent Queue backpressure, never Block.
        elastic: >
          Accept pre-shaped NDJSON into logs-arcsight_connectors.audit with a
          custom ingest pipeline: the same signature-ID outcome lookup,
          agent:049 parser-slot resolution into arcsight.connector.parser.*,
          observer.* copy and event.kind=event as the Avro path.
        relay: >
          Cross as ECS-shaped NDJSON; nothing CSV-shaped reaches the guard.
          The message column on agent:028/:042 is the friction point - cap and
          control-character-strip it low-side - and give the cache/error
          signatures their own at-most-once reconciliation counter.
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard: file-monitor and header-key
          parse the CSV on the connector host, coerce the timestamps and the
          event type from text, emit low-side counters for agent:019,
          agent:029 and agent:042 per connector per hour, and ship NDJSON to
          Elastic with a dead-letter route guarding against silent header
          drift.
        elastic: >
          Land the pre-shaped NDJSON into logs-arcsight_connectors.audit via a
          custom ingest pipeline. Derive event.outcome from the signature ID
          through an explicit lookup (agent:030/:016/:020/:101/:025 success;
          agent:015/:028/:029/:042/:102/:103/:104/:105/:008/:011/:026
          failure), resolve the agent:049 deviceCustomString1..6 slots into
          arcsight.connector.parser.*, copy the agent* columns into
          observer.*, and set event.kind to event.
    fields:
    - vendor: deviceEventClassId
      type: string
      description: audit event class column, e.g. agent:029
      ecs: event.code
      status: mapped
    - vendor: name
      type: string
      description: audit event name column
      ecs: event.action
      status: partial
      notes: fixed vendor phrasing; normalize off deviceEventClassId
    - vendor: deviceEventCategory
      type: string
      description: ArcSight audit taxonomy path column
      ecs: null
      status: unmapped
      custom: arcsight.connector.event_category
    - vendor: message
      type: string
      description: audit message text column; exception/unparsed fragments on agent:028/:042
      ecs: message
      status: mapped
    - vendor: agentSeverity
      type: integer
      description: normalized 0-10 severity column
      ecs: event.severity
      status: partial
      transform: 0-10 to platform-numeric lookup; useless for prioritising agent:029
    - vendor: deviceReceiptTime
      type: timestamp
      description: audit-record time column
      ecs: '@timestamp'
      status: mapped
      transform: text in CSV - parse against agentTimeZone
    - vendor: agentReceiptTime
      type: timestamp
      description: connector processing time column
      ecs: event.created
      status: partial
    - vendor: agentHostName
      type: string
      description: emitting connector hostname column
      ecs: observer.hostname
      status: partial
    - vendor: agentAddress
      type: ip
      description: emitting connector IP column
      ecs: observer.ip
      status: partial
    - vendor: agentId
      type: string
      description: connector persistent identifier column
      ecs: null
      status: unmapped
      custom: arcsight.connector.agent_id
    - vendor: agentType
      type: string
      description: connector type slug column
      ecs: observer.type
      status: partial
    - vendor: agentVersion
      type: string
      description: connector build version column
      ecs: observer.version
      status: mapped
    - vendor: agentTimeZone
      type: string
      description: connector time zone column
      ecs: null
      status: unmapped
      custom: arcsight.connector.timezone
      notes: the only in-band evidence for interpreting the text timestamps
    - vendor: deviceVendor
      type: string
      description: ArcSight, on every internal event
      ecs: observer.vendor
      status: mapped
    - vendor: deviceProduct
      type: string
      description: emitting component column
      ecs: observer.product
      status: mapped
    - vendor: type
      type: integer
      description: ArcSight event type column (0 base, 1 aggregated, ...)
      ecs: null
      status: unmapped
      custom: arcsight.connector.event_type
      notes: type=1 on agent:043 means the parity feed is degraded
    - vendor: parserVersion
      type: string
      description: parser file version column (agent:049)
      ecs: null
      status: unmapped
      custom: arcsight.connector.parser.version
    - vendor: parserIdentifier
      type: string
      description: parser file id column (agent:049)
      ecs: null
      status: unmapped
      custom: arcsight.connector.parser.id
    - vendor: deviceCustomString1..6 (with paired deviceCustomString1Label..6Label)
      type: string
      description: custom string slot columns; documented cs1-cs6 assignment on agent:049
      ecs: null
      status: unmapped
      custom: arcsight.connector.custom_string
      notes: >-
        key off the Label columns, never the slot; both value and Label
        columns must be selected
    - vendor: baseEventCount
      type: long
      description: aggregation count column
      ecs: null
      status: unmapped
      custom: arcsight.connector.base_event_count
- id: agent-log
  name: agent.log and wrapper log
  description: |
    The SmartConnector's operational text log, written to $ARCSIGHT_HOME/current/logs/agent.log, plus the service/daemon stdout log at $ARCSIGHT_HOME/logs/agent.out.wrapper.log which the vendor directs administrators to read "to verify that a SmartConnector service has started". The format is a positional bracketed line - the vendor's own published excerpt is "[2017-03-24 16:07:54,485][INFO ][default.com.arcsight.agent.loadable._CustomEventsRegexFilter][init] CustomEventsRegexFilter Initialized: Filtering Enabled=true, Exclude Regex=..., Include Regex=" - giving timestamp, level, a destination-prefixed Java logger name, the originating method, and a free-text message.
    THIS DATASET EXISTS BECAUSE THE EVENT FEEDS LIE BY OMISSION. Three conditions that silently destroy the value of the agent:043 parity feed are visible ONLY here. First, a Device Status Monitoring interval below 60000 milliseconds "gets a warning in the log that the minimum is 60000 milliseconds and the system uses the minimum". Second, a non-numeric interval "generates an error in the log that the value could not be parsed. In this case, the feature is disabled (and logged as such)" - and the vendor states plainly that "there is no indication on the Console that anything went wrong because there is no way for the Connector to convey that error". Third, a bad custom-event-filter regex is reported only as an agent.log ERROR, after which filtering is disabled. In all three cases the connector keeps running, the event feed keeps flowing, and the migration dashboard shows a healthy legacy tier that is in fact not reporting what anyone thinks it is.
    DELIBERATELY THIN. This is a file-collected text log with no published format specification beyond the excerpts above, no Elastic integration and no Cribl pack, and it needs a collector on every connector host. For a tier with a decommission date, the justified scope is the startup/configuration window and the error and cache lines - not wholesale DEBUG collection.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, connector hosts
      notes: >
        Collected as files from the connector hosts and Connector
        Appliance/CHA containers rather than received over syslog; on
        appliance form factors the log lives inside the container and is
        reachable through ArcMC rather than on a host filesystem, which is the
        practical constraint on collecting it at all. Multi-line Java stack
        traces must be reassembled at the edge, because a partial trace cannot
        be rebuilt downstream.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-arcsight_connectors.agent_log
    direct:
    - hop: cribl
      location: edge Cribl worker group, connector hosts
      notes: >
        Collected as files from the connector hosts and Connector
        Appliance/CHA containers rather than received over syslog; on
        appliance form factors the log lives inside the container and is
        reachable through ArcMC rather than on a host filesystem, which is the
        practical constraint on collecting it at all. Multi-line Java stack
        traces must be reassembled at the edge, because a partial trace cannot
        be rebuilt downstream.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-arcsight_connectors.agent_log
  formats:
  - format: syslog-raw
    parsing:
      mechanism: cribl-pipeline
      artifact: custom agent.log pipeline
      notes: >
        No Elastic integration and no vendor or community Cribl pack covers
        ArcSight connector logs. A hand-built pipeline handles the bracketed
        four-field prefix plus multi-line continuation for Java stack traces;
        the wrapper log carries JVM stdout with a different, undocumented
        prefix and is best kept as message plus log.file.path rather than
        given a grammar it does not have.
    fields:
    - vendor: timestamp
      type: timestamp
      description: >-
        first bracketed field - local wall-clock time to millisecond
        precision, e.g. 2017-03-24 16:07:54,485
      ecs: '@timestamp'
      status: mapped
      transform: >
        yyyy-MM-dd HH:mm:ss,SSS with NO timezone offset; must be parsed
        against the connector host's configured zone, and the CEF feed's
        agentTimeZone is the only in-band evidence of what that is
    - vendor: level
      type: enum
      description: >-
        second bracketed field - the log4j level, space-padded to a fixed
        width (INFO, WARN, ERROR, DEBUG, TRACE, FATAL)
      ecs: log.level
      status: mapped
      transform: >-
        trim the right-padding before comparison; the padded form ("INFO ")
        will not match an exact-value query
    - vendor: logger
      type: string
      description: >-
        third bracketed field - the destination-prefixed Java logger name,
        e.g. default.com.arcsight.agent.loadable._CustomEventsRegexFilter
      ecs: log.logger
      status: mapped
      notes: >-
        the segment before the first dot is the connector
        destination/container context rather than part of the class name, and
        is worth splitting out separately
    - vendor: method
      type: string
      description: fourth bracketed field - the method the line was emitted from, e.g. init
      ecs: log.origin.function
      status: mapped
    - vendor: message
      type: string
      description: the free-text remainder of the line after the bracketed prefix
      ecs: message
      status: mapped
      notes: >-
        unbounded; carries regex patterns, file paths and exception text, and
        is the only place the vendor-documented silent-failure conditions are
        expressed
    - vendor: destination prefix on the logger name
      type: string
      description: >-
        the leading logger segment identifying which connector destination or
        container emitted the line (for example "default")
      ecs: null
      status: unmapped
      custom: arcsight.connector.log.container
      notes: >-
        on Connector Appliance and CHA form factors a single log file
        interleaves lines from multiple containers, so without this split the
        log cannot be attributed to a connector
    - vendor: exception class in the message body
      type: string
      description: the fully qualified Java exception class named on error lines
      ecs: error.type
      status: partial
      notes: >-
        not a delimited field - it must be extracted from the message text,
        and the pattern differs between connector code and JVM-level wrapper
        output
    - vendor: stack trace continuation lines
      type: string
      description: the untimestamped "at ..." lines that follow an exception line
      ecs: error.stack_trace
      status: partial
      notes: >
        these lines carry no bracketed prefix, so any collector that treats
        each line as an event will emit dozens of prefix-less orphans per
        exception; reassembly must happen at the edge and before any guard hop
    - vendor: log file path
      type: string
      description: >-
        which file the line came from - $ARCSIGHT_HOME/current/logs/agent.log
        or $ARCSIGHT_HOME/logs/agent.out.wrapper.log
      ecs: log.file.path
      status: mapped
      notes: >-
        the only discriminator between the connector's own log and the service
        wrapper's JVM stdout, which have different prefixes and different
        failure vocabularies
    - vendor: CustomEventsRegexFilter Initialized / Events Filtering Disabled
      type: string
      description: >-
        the vendor-documented init lines reporting whether custom event
        filtering is enabled and whether the configured include/exclude regex
        compiled
      ecs: null
      status: unmapped
      custom: arcsight.connector.log.event_filter
      notes: >
        a filter that failed to compile is disabled silently, so the connector
        is forwarding events an operator believes are being dropped - or vice
        versa; this line is the only notice, and it is emitted once at init,
        so retention must cover the whole cutover rather than a rolling few
        days
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Do the line discipline at the edge, because it cannot be recovered
          later: reassemble multi-line Java stack traces into one event before
          anything else touches the stream, split the bracketed prefix into
          timestamp, level, logger and method, and apply the connector host's
          time zone at parse time - agent.log timestamps carry no offset, and
          the connector's own agentTimeZone from the CEF feed is the authority
          for what it should be. Filter hard at the source rather than in
          Elastic: keep WARN and above plus the startup/configuration window
          and the CustomEventsRegexFilter and Device Status Monitoring lines,
          and drop routine INFO, or a per-connector-host DEBUG log will dwarf
          every event feed in this map. Because this is a hand-built parser
          with no pack tracking format changes, gate the destination with
          C.Schema(...).validate plus a dead-letter route that alerts on its
          own rate, and run Persistent Queue backpressure rather than Block.
        elastic: >
          Own a custom logs-arcsight_connectors.agent_log ingest pipeline that
          finishes only what the edge cannot: promote the Java exception class
          out of the message body into error.type and the reassembled trace
          into error.stack_trace, and set event.outcome from the log level so
          an ERROR line is queryable alongside the agent:0xx failure events.
          Add index-template mappings for arcsight.connector.log.* as keyword
          so the container/destination prefix stays aggregatable. The alerting
          value is narrow and specific - build detections on the three
          vendor-documented silent-failure strings: the Device Status
          Monitoring minimum-interval warning, the
          interval-could-not-be-parsed error that disables the feature
          outright, and the "Events Filtering Disabled Due to Syntax Error in
          User Defined Regex" line - because each of them means the parity
          evidence in the device-status dataset is quietly wrong while
          everything else looks healthy.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) - one reassembled
          log event per line, UTF-8, LF-terminated, compression disabled,
          nesting depth two or less - because no Elastic integration exists to
          justify a thin envelope and, more importantly, because a stack trace
          split across the boundary can never be rejoined on an at-most-once
          channel with no return path. This is the worst dataset in the map
          for content-filter friction: messages are unbounded free text
          carrying regex patterns, file paths, exception text and occasional
          device data echoed from the source, so cap message length and strip
          control characters low-side, and expect the custom NDJSON filter
          rules to need an explicit allowance for backslash- and bracket-heavy
          content. Nothing CEF-shaped crosses on this route. Carry _raw for
          ERROR and FATAL lines until the hand-built parser is proven and drop
          it first on routine INFO volume.
      direct:
        parse_location: low
        cribl: >
          Do the line discipline at the edge, because it cannot be recovered
          later: reassemble multi-line Java stack traces into one event before
          anything else touches the stream, split the bracketed prefix into
          timestamp, level, logger and method, and apply the connector host's
          time zone at parse time - agent.log timestamps carry no offset, and
          the connector's own agentTimeZone from the CEF feed is the authority
          for what it should be. Filter hard at the source rather than in
          Elastic: keep WARN and above plus the startup/configuration window
          and the CustomEventsRegexFilter and Device Status Monitoring lines,
          and drop routine INFO, or a per-connector-host DEBUG log will dwarf
          every event feed in this map. Because this is a hand-built parser
          with no pack tracking format changes, gate the destination with
          C.Schema(...).validate plus a dead-letter route that alerts on its
          own rate, and run Persistent Queue backpressure rather than Block.
        elastic: >
          Own a custom logs-arcsight_connectors.agent_log ingest pipeline that
          finishes only what the edge cannot: promote the Java exception class
          out of the message body into error.type and the reassembled trace
          into error.stack_trace, and set event.outcome from the log level so
          an ERROR line is queryable alongside the agent:0xx failure events.
          Add index-template mappings for arcsight.connector.log.* as keyword
          so the container/destination prefix stays aggregatable. The alerting
          value is narrow and specific - build detections on the three
          vendor-documented silent-failure strings: the Device Status
          Monitoring minimum-interval warning, the
          interval-could-not-be-parsed error that disables the feature
          outright, and the "Events Filtering Disabled Due to Syntax Error in
          User Defined Regex" line - because each of them means the parity
          evidence in the device-status dataset is quietly wrong while
          everything else looks healthy.
- id: arcmc-audit
  name: ArcMC / Connector Appliance audit and system health events
  description: |
    ArcSight Management Center - the fleet console for the SmartConnector tier, and the same software that runs on the Connector Host Appliance - emits its own CEF audit events, which the vendor groups as application events (ArcMC functions and configuration changes), platform events (the ArcMC system itself) and system health events (ArcMC hardware and resource health). Documented signatures include the connector-management set (connector:101 register successful, connector:102 removed, connector:103 parameter update successful, connector:104/:105 AUP package create and deploy, connector:201/:202/:203 the corresponding failures), the ArcMC administration set (arcmc:101-:107 backup scheduler and backup lifecycle), the platform set (platform:200-:207 authentication and password events, platform:213 audit forwarding modified, platform:220/:221 certificate install and mismatch, platform:371 restarted OS service, platform:400 ran diagnostic command, platform:407 SSL certificate expiration warning), and the health set (cpu:100/:101, disk:101-:104, hardware:1xx electrical and battery sensors, raid:121/:122/:123 disk OK, rebuilding and failed). The vendor documents the health cadence precisely: an OK event once every ten minutes per sensor, and for Degraded, Rebuilding or Failed one event every minute until the sensor returns to OK.
    WHY A DECOMMISSIONING TIER'S MANAGEMENT PLANE IS WORTH INGESTING AT ALL: the connector:1xx and connector:2xx events are the change record for the legacy collection tier during exactly the period when it is being taken apart. When a source stops appearing in the device-status feed, this dataset answers the question the parity feed cannot - was that device deliberately decommissioned by an engineer, or did the connector break? platform:213 is the sharpest single signature here: audit forwarding being modified means the accountability feed for the decommission was itself reconfigured, which is the one change that must never happen quietly.
    Two hard operational caveats from the vendor. Audit forwarding requires a Syslog Daemon connector installed and configured in an ArcMC container, and "if no Syslog Daemon connector is installed or configured on your local machine, then no audit events will be visible" - so absence of this feed is the default state, not evidence of quiet. And system health events are also published over SNMP traps with an explicitly documented field list, which is the fallback if standing up the forwarding connector on a platform being retired cannot be justified.
  event_categories:
  - configuration
  - authentication
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Receives CEF over syslog from the Syslog Daemon connector deployed
        inside an ArcMC container for audit forwarding; this is a deliberately
        configured feed, not a default one. Note that this route depends on
        the very tier it reports on - the audit events leave ArcMC through a
        SmartConnector - so it goes dark at the moment the connector tier is
        switched off, which is one event too early for a decommission record.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-arcsight_connectors.arcmc
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Receives CEF over syslog from the Syslog Daemon connector deployed
        inside an ArcMC container for audit forwarding; this is a deliberately
        configured feed, not a default one. Note that this route depends on
        the very tier it reports on - the audit events leave ArcMC through a
        SmartConnector - so it goes dark at the moment the connector tier is
        switched off, which is one event too early for a decommission record.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-arcsight_connectors.arcmc
  formats:
  - format: syslog-cef
    parsing:
      mechanism: elastic-integration
      artifact: Common Event Format (CEF) integration
      notes: >
        Same generic CEF integration as the other CEF datasets in this map.
        ArcMC documents the prefix fields it populates (Device Event Class ID,
        Device Severity, Name, Device Event Category) and, for system health
        events, an explicit field list including deviceCustomNumber1 with its
        label and deviceCustomString1 through deviceCustomString6 with theirs
        - so the parsing work is again label indirection rather than grammar.
    fields:
    - vendor: deviceEventClassId
      type: string
      description: >-
        CEF signature-ID header carrying the ArcMC application, platform or
        health event class
      ecs: event.code
      status: mapped
      notes: >
        the vendor names it as one of the four prefix fields an ArcMC audit
        event always contains; the numbering convention is itself the outcome
        signal (connector:101-:105 success, connector:201-:203 the
        corresponding failures), which is the only reliable way to derive
        event.outcome on this dataset
    - vendor: name
      type: string
      description: >-
        CEF Name header - the ArcMC event definition text, e.g. "Register
        connector successful" or "Audit forwarding modified"
      ecs: event.action
      status: partial
      notes: >-
        fixed vendor phrases rather than ECS action verbs; useful verbatim in
        a decommission change record, not for cross-source correlation
    - vendor: cat
      type: string
      description: >-
        deviceEventCategory - ArcMC's taxonomy path, e.g.
        /Connector/Parameter/Update/Success,
        /Platform/Configuration/Global/AuditEvents, /Monitor/RAID/DISK/Failed
      ecs: null
      status: unmapped
      custom: arcsight.arcmc.event_category
      notes: >
        ECS event.category is a closed vocabulary and this is a vendor path,
        so it stays custom - but its /Success and /Fail suffixes are the
        cleanest input to an event.outcome derivation, more reliable than
        parsing the Name text
    - vendor: severity
      type: integer
      description: >-
        Device Severity - ArcMC severity on the ArcSight 0-10 scale,
        documented per signature (most audit events 1, authentication failures
        7, failed hardware sensors 8)
      ecs: event.severity
      status: partial
      transform: >
        needs the same 0-10 to platform-numeric lookup as the other CEF
        sources; unusually for this map set the ArcMC values ARE
        discriminating, because the vendor publishes a severity per signature,
        so a severity-based triage rule is defensible here in a way it is not
        on the connector datasets
    - vendor: dvc
      type: ip
      description: >-
        deviceAddress - address of the ArcMC or Connector Appliance that
        generated the event
      ecs: observer.ip
      status: mapped
    - vendor: dvchost
      type: string
      description: >-
        deviceHostName - hostname of the ArcMC or Connector Appliance that
        generated the event
      ecs: observer.hostname
      status: mapped
    - vendor: dst
      type: ip
      description: >-
        destinationAddress - documented in the system-health field list; the
        address the health event is reported for
      ecs: destination.ip
      status: partial
      notes: >-
        on self-reported health events the destination is the appliance
        itself, so this duplicates deviceAddress rather than describing a flow
    - vendor: deviceVendor
      type: string
      description: CEF Device Vendor header - ArcSight on every ArcMC-generated event
      ecs: observer.vendor
      status: mapped
    - vendor: deviceProduct
      type: string
      description: CEF Device Product header naming the reporting component
      ecs: observer.product
      status: mapped
    - vendor: deviceVersion
      type: string
      description: >-
        deviceVersion - the ArcMC software version, documented in the
        system-health field list
      ecs: observer.version
      status: mapped
    - vendor: cn1 (with cn1Label)
      type: long
      description: >-
        deviceCustomNumber1 - the numeric health measurement on system health
        events (CPU usage, disk bytes read/written, disk space remaining)
      ecs: null
      status: unmapped
      custom: arcsight.arcmc.health.value
      notes: >
        these are metrics wearing a log schema and there is no ECS home for a
        vendor-defined appliance sensor reading; extract by the cn1Label value
        and map as a numeric type, or dynamic mapping makes them strings and
        the appliance capacity trend cannot be charted at all
    - vendor: cs1..cs6 (with paired cs1Label..cs6Label)
      type: string
      description: >-
        generic custom string slots; the vendor's system-health field list
        documents all six with their labels, carrying the sensor and resource
        identity for the reading in cn1
      ecs: null
      status: unmapped
      custom: arcsight.arcmc.custom_string
      notes: >-
        assignment varies by health signature (which disk, which CPU, which
        sensor), so key off the Label value and never the slot number
    - vendor: rt
      type: timestamp
      description: deviceReceiptTime - when ArcMC recorded the event, epoch milliseconds
      ecs: '@timestamp'
      status: mapped
      transform: >-
        epoch milliseconds emitted as a bare value; needs an explicit timezone
        assumption
    - vendor: end
      type: timestamp
      description: >-
        endTime - documented in the system-health field list as the end of the
        measurement interval
      ecs: event.end
      status: mapped
      notes: >-
        on the ten-minutely OK samples this bounds the sample window, which is
        what makes a gap in health events distinguishable from a sensor that
        never reported
    - vendor: duser
      type: string
      description: >-
        destinationUserName - the ArcMC account a platform authentication or
        administration event concerns
      ecs: user.name
      status: partial
      notes: >
        as in the ESM map, ArcMC does not consistently separate the
        administrator performing an action from the account being acted upon,
        so user.target.name is left unpopulated and this feed alone cannot
        answer "who changed whose account" on platform:200-:207
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Split by signature-ID family low-side - connector:, arcmc:,
          platform:, and the health families cpu:/disk:/hardware:/raid: - so
          the change record for the connector tier is never buried under
          ten-minutely sensor telemetry, and rate-limit or sample the OK
          health events, which the vendor generates six times an hour per
          sensor and which will dominate this route by volume while carrying
          almost no information. Keep every platform:213 and every
          connector:2xx failure unsampled. Use Persistent Queue backpressure
          on the Elastic destination, and give this route an explicit shutdown
          filter so the feed can be retired in one place - remembering that it
          dies with the forwarding connector, so the decommission runbook must
          capture the final ArcMC state by another means before the tier is
          stopped.
        elastic: >
          Parse with the stock CEF integration into
          logs-arcsight_connectors.arcmc and add a @custom pipeline that
          derives event.outcome from the signature ID rather than looking for
          an outcome column - the vendor encodes it in the deviceEventCategory
          path suffix (/Success and /Fail) and in the numbering convention
          where connector:1xx is success and connector:2xx is the matching
          failure - and that lifts deviceCustomNumber1 out of its label-named
          slot into a typed long so CPU and disk utilisation are chartable.
          Copy deviceHostName into host.name so the configuration and
          authentication profiles resolve, set event.kind to metric on the
          cpu:/disk:/hardware:/raid: families so sensor samples never inflate
          event counts, and map arcsight.arcmc.* as keyword in the index
          template. Alert narrowly: platform:213 audit-forwarding modified,
          connector:2xx failures during the cutover window, and any device
          that disappears from the device-status dataset WITHOUT a matching
          connector:103 parameter update - that combination is a broken
          collector, not a completed migration.
      direct:
        parse_location: high
        cribl: >
          Split by signature-ID family low-side - connector:, arcmc:,
          platform:, and the health families cpu:/disk:/hardware:/raid: - so
          the change record for the connector tier is never buried under
          ten-minutely sensor telemetry, and rate-limit or sample the OK
          health events, which the vendor generates six times an hour per
          sensor and which will dominate this route by volume while carrying
          almost no information. Keep every platform:213 and every
          connector:2xx failure unsampled. Use Persistent Queue backpressure
          on the Elastic destination, and give this route an explicit shutdown
          filter so the feed can be retired in one place - remembering that it
          dies with the forwarding connector, so the decommission runbook must
          capture the final ArcMC state by another means before the tier is
          stopped.
        elastic: >
          Parse with the stock CEF integration into
          logs-arcsight_connectors.arcmc and add a @custom pipeline that
          derives event.outcome from the signature ID rather than looking for
          an outcome column - the vendor encodes it in the deviceEventCategory
          path suffix (/Success and /Fail) and in the numbering convention
          where connector:1xx is success and connector:2xx is the matching
          failure - and that lifts deviceCustomNumber1 out of its label-named
          slot into a typed long so CPU and disk utilisation are chartable.
          Copy deviceHostName into host.name so the configuration and
          authentication profiles resolve, set event.kind to metric on the
          cpu:/disk:/hardware:/raid: families so sensor samples never inflate
          event counts, and map arcsight.arcmc.* as keyword in the index
          template. Alert narrowly: platform:213 audit-forwarding modified,
          connector:2xx failures during the cutover window, and any device
          that disappears from the device-status dataset WITHOUT a matching
          connector:103 parameter update - that combination is a broken
          collector, not a completed migration.
  - format: avro-kafka
    enable: >
      ArcMC audit forwarding runs through a Syslog Daemon SmartConnector
      deployed in an ArcMC container; that connector is an ordinary
      SmartConnector, so its destination can be a Transformation Hub
      destination in Avro content mode instead of the CEF Syslog. Configure
      the container connector's destination as Transformation Hub, set the
      content type to Avro, and the ArcMC application, platform and
      system-health CEF audit events it receives are re-published as Avro
      records to the Kafka topic under canonical schema names. Two vendor
      caveats persist regardless of format: audit forwarding does not exist at
      all unless that Syslog Daemon connector is installed and configured
      (absence of the feed is the default state), and the ArcMC system- health
      events are ALSO published over SNMP traps with a documented field list -
      a fallback not modelled here because SNMP traps are not consumable by
      this Cribl/Elastic pipeline without a separate trap daemon.
    references:
    - >-
      https://www.microfocus.com/documentation/arcsight/arcmc-3.1/ArcMC_AdminGuide_3.1.pdf
    - >-
      https://www.microfocus.com/documentation/arcsight/arcsight-platform-21.1/as_platform_admin_guide/Content/arcmc/AuditEvents/AuditEventTypesOverview.htm
    - >-
      https://www.microfocus.com/documentation/arcsight/logger-7.2.2/Logger-Admin-Guide/Content/Logger_AdminGuide/Configuration/TH_Destinations.htm
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Transformation Hub Avro Kafka source + decode pipeline
      notes: >
        No Elastic integration consumes the Avro topic, so a Cribl Kafka
        source with Schema-Registry decode flattens the record; the
        dataset-specific work is deriving event.outcome from the ArcMC
        signature-ID numbering (connector:1xx success, connector:2xx failure)
        and the deviceEventCategory /Success and /Fail suffixes, and resolving
        the system-health deviceCustomNumber1 and deviceCustomString1..6 slots
        by their Label fields. Avro types the health measurement as numeric
        where CEF carries it as a labelled string, so the "metrics wearing a
        log schema" typing problem is eased on this path.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Decode the Avro at the edge and split by signature-ID family -
          connector:, arcmc:, platform:, and the health families
          cpu:/disk:/hardware:/raid: - so the change record for the connector
          tier is never buried under ten-minutely sensor telemetry; rate-limit
          or sample the OK health events (six per hour per sensor) and keep
          every platform:213 and connector:2xx unsampled. Provision an
          enclave-local Schema Registry copy so decode cannot fail closed, and
          remember this feed dies with the forwarding connector, so capture
          the final ArcMC state by another means before the tier is stopped.
          Persistent Queue backpressure on the guard destination.
        elastic: >
          Ship decoded NDJSON into logs-arcsight_connectors.arcmc behind a
          custom ingest pipeline and index template. Derive event.outcome from
          the signature-ID numbering and the deviceEventCategory
          /Success//Fail suffix, lift deviceCustomNumber1 out of its
          label-named slot into a typed long so CPU/disk utilisation is
          chartable, copy deviceHostName into observer.hostname (and host.name
          for the config/auth profiles), set event.kind to metric on the
          cpu:/disk:/hardware:/raid: families, and map arcsight.arcmc.* as
          keyword. Alert narrowly: platform:213 audit-forwarding modified,
          connector:2xx failures in the cutover window, and any device that
          leaves the device-status feed WITHOUT a matching connector:103
          parameter update.
        relay: >
          Decode low-side and cross as ECS-shaped NDJSON; binary Avro and its
          Schema Registry framing must not reach the guard. Friction is low on
          the change-record families and concentrated in the free-text
          custom-string health slots and any account name on
          platform:200-:207; cap and control-character-strip those low-side.
          At-most-once crossing, so per-(dataset, hour) reconciliation -
          though note this feed is doubly fragile because it dies with the
          connector tier one event before the decommission completes.
      direct:
        parse_location: hybrid
        cribl: >
          High-side instances skip the guard: Kafka source, Schema-Registry
          decode, split by signature-ID family, sample the OK health events
          and ship straight to Elastic; alert on a schema-fetch failure rather
          than dropping.
        elastic: >
          Land decoded NDJSON into logs-arcsight_connectors.arcmc behind a
          custom ingest pipeline and index template. Derive event.outcome from
          the signature-ID numbering and the deviceEventCategory
          /Success//Fail suffix, lift deviceCustomNumber1 out of its
          label-named slot into a typed long so CPU/disk utilisation is
          chartable, copy deviceHostName into observer.hostname (and host.name
          for the config/auth profiles), set event.kind to metric on the
          cpu:/disk:/hardware:/raid: families, and map arcsight.arcmc.* as
          keyword. Alert narrowly: platform:213 audit-forwarding modified,
          connector:2xx failures in the cutover window, and any device that
          leaves the device-status feed WITHOUT a matching connector:103
          parameter update.
    fields:
    - vendor: deviceEventClassId
      type: string
      description: ArcMC application/platform/health event class (CEF deviceEventClassId)
      ecs: event.code
      status: mapped
      notes: >-
        the numbering convention is itself the outcome signal
        (connector:101-:105 success, connector:201-:203 failure)
    - vendor: name
      type: string
      description: ArcMC event definition text, e.g. "Audit forwarding modified" (CEF name)
      ecs: event.action
      status: partial
      notes: >-
        fixed vendor phrases; useful verbatim in a change record, not for
        cross-source correlation
    - vendor: deviceEventCategory
      type: string
      description: >-
        ArcMC taxonomy path, e.g. /Connector/Parameter/Update/Success,
        /Monitor/RAID/DISK/Failed (CEF cat)
      ecs: null
      status: unmapped
      custom: arcsight.arcmc.event_category
      notes: >-
        vendor path, not the closed ECS vocabulary; its /Success and /Fail
        suffixes are the cleanest input to an event.outcome derivation
    - vendor: deviceSeverity
      type: integer
      description: >-
        ArcMC severity on the 0-10 scale, documented per signature (most audit
        1, auth failures 7, failed sensors 8)
      ecs: event.severity
      status: partial
      transform: >-
        0-10 to platform-numeric lookup; unusually for this map set the values
        ARE discriminating, so a severity-based triage rule is defensible here
    - vendor: deviceAddress
      type: ip
      description: address of the ArcMC/Connector Appliance that generated the event (CEF dvc)
      ecs: observer.ip
      status: mapped
    - vendor: deviceHostName
      type: string
      description: hostname of the ArcMC/Connector Appliance (CEF dvchost)
      ecs: observer.hostname
      status: mapped
    - vendor: destinationAddress
      type: ip
      description: >-
        documented in the system-health field list; the address the health
        event is reported for (CEF dst)
      ecs: destination.ip
      status: partial
      notes: >-
        on self-reported health events this is the appliance itself, so it
        duplicates deviceAddress rather than describing a flow
    - vendor: deviceVendor
      type: string
      description: ArcSight on every ArcMC-generated event
      ecs: observer.vendor
      status: mapped
    - vendor: deviceProduct
      type: string
      description: reporting component name
      ecs: observer.product
      status: mapped
    - vendor: deviceVersion
      type: string
      description: ArcMC software version, documented in the system-health field list
      ecs: observer.version
      status: mapped
    - vendor: deviceCustomNumber1 (with deviceCustomNumber1Label)
      type: long
      description: >-
        numeric health measurement on system-health events (CPU usage, disk
        bytes read/written, disk space remaining)
      ecs: null
      status: unmapped
      custom: arcsight.arcmc.health.value
      notes: >
        metrics wearing a log schema with no ECS home; Avro types this
        numerically where CEF carried it as a labelled string, but extract by
        the Label field and map as a numeric type or the appliance capacity
        trend cannot be charted.
    - vendor: deviceCustomString1..6 (with paired deviceCustomString1Label..6Label)
      type: string
      description: >-
        system-health custom string slots carrying the sensor and resource
        identity for the cn1 reading
      ecs: null
      status: unmapped
      custom: arcsight.arcmc.custom_string
      notes: assignment varies by health signature; key off the Label field, never the slot
    - vendor: deviceReceiptTime
      type: timestamp
      description: when ArcMC recorded the event (CEF rt)
      ecs: '@timestamp'
      status: mapped
      transform: Avro logical timestamp
    - vendor: endTime
      type: timestamp
      description: >-
        end of the measurement interval, documented in the system-health field
        list (CEF end)
      ecs: event.end
      status: mapped
      notes: >-
        bounds the ten-minutely OK sample window, which is what makes a gap in
        health events distinguishable from a sensor that never reported
    - vendor: destinationUserName
      type: string
      description: >-
        the ArcMC account a platform authentication/administration event
        concerns (CEF duser)
      ecs: user.name
      status: partial
      notes: >-
        ArcMC does not consistently separate the actor from the account acted
        upon, so user.target.name is left unpopulated and this feed alone
        cannot answer "who changed whose account" on platform:200-:207
  - format: csv-file
    enable: >
      Because ArcMC audit forwarding runs through an in-container Syslog
      Daemon SmartConnector, that connector's destination can equally be a CSV
      File destination: it writes the ArcMC application, platform and
      system-health audit events to a rotating CSV file with a case- sensitive
      header of canonical ArcSight field names, the columns operator-selected.
      The same two caveats apply - the feed does not exist without the
      forwarding connector, and system-health events are additionally
      available over SNMP traps (not modelled here, not pipeline-consumable
      without a trap daemon). Collected as files from the ArcMC
      container/host, not over syslog.
    references:
    - >-
      https://www.microfocus.com/documentation/arcsight/arcmc-3.1/ArcMC_AdminGuide_3.1.pdf
    - >-
      https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-25.1/pdfdoc/SmartConnInstallandUserGuide/SmartConnInstallandUserGuide.pdf
    - >-
      https://community.microfocus.com/cyberres/arcsight/f/discussions/39430/how-to-define-fields-of-cef-file-destination
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ArcSight CSV File pipeline (header-keyed CSV parse)
      notes: >
        Header-keyed CSV parse mapping canonical column names to ECS; the
        column set is operator-selected. Same signature-ID outcome derivation
        and health-slot label resolution as the Avro path, plus CSV-only
        text-to-numeric coercion for the health measurement and text-to-date
        coercion for the timestamps.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the CSV at the edge keyed on the header, coerce the health
          measurement to numeric and the timestamps to dates, split by
          signature-ID family and sample the OK health events, then emit
          ECS-shaped NDJSON. Guard against silent header drift with a Schema
          Library validation and a dead-letter route; Persistent Queue
          backpressure. Remember the feed dies with the forwarding connector,
          so the decommission runbook must capture final ArcMC state by other
          means.
        elastic: >
          Accept pre-shaped NDJSON into logs-arcsight_connectors.arcmc with a
          custom ingest pipeline: the same signature-ID and /Success//Fail
          outcome derivation, typed health measurement, observer.*/host.name
          copy and event.kind=metric on the health families as the Avro path.
        relay: >
          Cross as ECS-shaped NDJSON; nothing CSV-shaped reaches the guard.
          Friction is low and concentrated in the free-text health custom
          strings and platform account names - cap and control-character-
          strip low-side - with at-most-once per-(dataset, hour)
          reconciliation.
      direct:
        parse_location: low
        cribl: >
          High-side instances skip the guard: file-monitor and header-key
          parse the CSV on the ArcMC host, coerce types, split by family,
          sample OK health events and ship NDJSON to Elastic with the
          header-drift dead-letter guard.
        elastic: >
          Land pre-shaped NDJSON into logs-arcsight_connectors.arcmc via a
          custom ingest pipeline. Derive event.outcome from the signature-ID
          numbering and the deviceEventCategory /Success//Fail suffix, lift
          deviceCustomNumber1 out of its label-named slot into a typed long,
          copy deviceHostName into observer.hostname and host.name, set
          event.kind to metric on the cpu:/disk:/hardware:/raid: families, and
          map arcsight.arcmc.* as keyword.
    fields:
    - vendor: deviceEventClassId
      type: string
      description: ArcMC event class column
      ecs: event.code
      status: mapped
      notes: numbering convention encodes the outcome
    - vendor: name
      type: string
      description: ArcMC event definition text column
      ecs: event.action
      status: partial
    - vendor: deviceEventCategory
      type: string
      description: ArcMC taxonomy path column with /Success//Fail suffix
      ecs: null
      status: unmapped
      custom: arcsight.arcmc.event_category
      notes: the cleanest input to an event.outcome derivation
    - vendor: deviceSeverity
      type: integer
      description: 0-10 severity column, documented per signature
      ecs: event.severity
      status: partial
      transform: 0-10 to platform-numeric lookup; discriminating on this dataset
    - vendor: deviceAddress
      type: ip
      description: ArcMC/Connector Appliance address column
      ecs: observer.ip
      status: mapped
    - vendor: deviceHostName
      type: string
      description: ArcMC/Connector Appliance hostname column
      ecs: observer.hostname
      status: mapped
    - vendor: destinationAddress
      type: ip
      description: system-health destination address column
      ecs: destination.ip
      status: partial
      notes: duplicates deviceAddress on self-reported health events
    - vendor: deviceVendor
      type: string
      description: ArcSight column
      ecs: observer.vendor
      status: mapped
    - vendor: deviceProduct
      type: string
      description: reporting component column
      ecs: observer.product
      status: mapped
    - vendor: deviceVersion
      type: string
      description: ArcMC software version column
      ecs: observer.version
      status: mapped
    - vendor: deviceCustomNumber1 (with deviceCustomNumber1Label)
      type: long
      description: numeric health measurement column
      ecs: null
      status: unmapped
      custom: arcsight.arcmc.health.value
      notes: text in CSV - coerce to numeric; extract by the Label column
    - vendor: deviceCustomString1..6 (with paired deviceCustomString1Label..6Label)
      type: string
      description: system-health sensor/resource identity columns
      ecs: null
      status: unmapped
      custom: arcsight.arcmc.custom_string
      notes: key off the Label columns, never the slot
    - vendor: deviceReceiptTime
      type: timestamp
      description: ArcMC record-time column
      ecs: '@timestamp'
      status: mapped
      transform: text in CSV - parse to a date
    - vendor: endTime
      type: timestamp
      description: measurement-interval end column
      ecs: event.end
      status: mapped
      notes: bounds the ten-minutely OK sample window
    - vendor: destinationUserName
      type: string
      description: ArcMC account column on platform auth/admin events
      ecs: user.name
      status: partial
      notes: actor vs acted-upon not separated, so user.target.name stays unpopulated
