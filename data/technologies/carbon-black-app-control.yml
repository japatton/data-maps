        fields before Routes. Small enough that it is a candidate for a
        stricter, allow-listed content-filter policy than the endpoint feeds
        get.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-carbon_black_app_control.audit
    direct:
    - hop: cribl
