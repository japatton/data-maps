    events that tell you what arrived, which is what a hunt starts from and
    what an approval workflow queues on.
  event_categories:
  - file
  - malware
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Receives CEF over syslog from the App Control Server. New-file
        discovery is the highest-volume App Control feed in an estate that is
        not yet fully approved. CEF rather than the Basic, Enhanced or LEEF
        alternatives, for the reason given on the policy-enforcement dataset:
        it is the only one whose custom extensions the vendor documents.
    - hop: guard
