- id: server-audit
  name: Server, session and policy administration
  description: >
    The administrative record: console logins and logouts, server and database
    configuration, agent lifecycle, and every creation, change or deletion of
    a policy, ban, approval or rule. Policy Management belongs here rather
    than with enforcement because it is a change to the control itself - who
    widened the allow-list is a different question from what the allow-list
    blocked, and it is the one an inspector asks.
  event_categories:
  - iam
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Receives CEF over syslog from the App Control Server. Low volume and
        high value; this feed should not be sampled. CEF rather than the
