id: cisa-pdns
name: CISA Protective DNS Resolver
vendor: CISA
versions: >-
  Protective DNS Resolver service, generally available to FCEB agencies since
  September 2022 (the service is a managed offering with no agency-visible
  version; the agency-facing log push and alert API contracts are not publicly
  documented)
draft: true
references:
- >-
  https://www.cisa.gov/resources-tools/services/protective-domain-name-system-dns-resolver
- >-
  https://www.cisa.gov/sites/default/files/2025-05/CSSO-Protective%20DNS%20Fact%20Sheet%202024.pdf
- >-
  https://www.cisa.gov/sites/default/files/2024-08/Protective%20DNS%20FAQ%20-%20August%202024.pdf
- >-
  https://www.cisa.gov/news-events/news/cisa-launches-its-protective-dns-resolver-general-availability-federal-agencies
- >-
  https://developers.cloudflare.com/reference-architecture/diagrams/sase/gateway-for-protective-dns/
- https://developers.cloudflare.com/logs/reference/log-fields/account/gateway_dns/
- https://developers.cloudflare.com/cloudflare-one/insights/logs/gateway-logs/
- https://www.elastic.co/docs/reference/integrations/cloudflare_logpush
- >-
  https://github.com/elastic/integrations/blob/main/packages/cloudflare_logpush/data_stream/gateway_dns/elasticsearch/ingest_pipeline/default.yml
- >-
  https://www.nextgov.com/cybersecurity/2021/11/cisa-gets-set-deploy-updated-dns-resolver-service-protect-federal-agencies/186963/
datasets:
- id: dns-resolution
  name: DNS resolution and block-verdict records
  description: |
    The per-query record produced by CISA's Protective DNS resolver: one row for every DNS query an FCEB agency's devices, on-premises forwarders and roaming/cloud assets send through the mandated resolver, carrying the question, the answer, and - where a query matched threat intelligence - the block, redirect or sinkhole verdict. CISA's own materials describe the service in three publicly documented pieces: a geographically dispersed DNS Resolver that "logs the resulting DNS traffic data for analysis", a Data Platform (data lake) holding events for six months before three further years in cloud storage, and a Web Application through which agencies "view and download their log records for analysis", configure alerts and run queries. The onboarded-agency document set named in CISA's FAQ includes a "Log Push Guide - instructions to set up DNS log push to a local environment", which is the mechanism this dataset assumes: a push of the agency's own resolution records into an agency-controlled destination, from which Cribl collects.
    HONESTY WARNING - READ BEFORE USING THIS MAP (applies to both datasets). CISA does not publish a field reference for Protective DNS; the User Guide, Transition Guidance and Log Push Guide are released only to onboarded agencies, so THE AUTHORITATIVE SOURCE FOR EVERY NAME BELOW IS THE AGENCY'S OWN PROTECTIVE DNS ONBOARDING DOCUMENTATION, not this file. What is public and load-bearing is the substrate: the resolver under Protective DNS is Cloudflare Gateway, delivered by prime contractor Accenture Federal Services, which built the front-end web application. The vendor field names in this dataset are therefore the REAL, PUBLICLY DOCUMENTED Cloudflare Gateway DNS (gateway_dns) Logpush field names - they are not invented - but whether the agency-facing push delivers those records unmodified, a subset of them, or an AFS-reshaped envelope is UNCONFIRMED and must be settled against the Log Push Guide before any parser is built. Treat this dataset as a defensible skeleton to plan against, and expect to prune fields the CISA tenant does not release rather than to discover new ones.
  event_categories:
  - dns
  - network
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave, collector on the log-push landing zone
      notes: >
        Unusual shape for this estate: the source is a cloud service outside
        the agency perimeter, not an appliance, so there is no syslog sender
        to repoint. Protective DNS pushes the agency's records to an
        agency-owned destination (object store or HTTP endpoint per the Log
        Push Guide) and Cribl collects from there, replacing whatever ArcSight
        connector or manual portal download is in place today. This is a very
        high volume feed (CISA reports an average of 1.6 billion queries
        secured daily across 104-plus onboarded agencies), so a sampling or
        block-only decision belongs at this collection hop. Also confirm
        delivery latency and the replay story with the Protective DNS team:
        the six-month hot / three-year cold retention on CISA's side is the
        backstop for a collection gap, but recovering from it is a portal
        export, not a re-push.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cloudflare_logpush.gateway_dns
      notes: >
        Correct only if the push delivers unmodified Cloudflare gateway_dns
        records; if AFS reshapes them, this becomes a custom
        logs-cisa_pdns.resolution stream and the custom namespace below
        applies instead of cloudflare_logpush.gateway_dns.*.
    direct:
    - hop: cribl
      location: edge worker group, collector on the log-push landing zone
      notes: >
        Unusual shape for this estate: the source is a cloud service outside
        the agency perimeter, not an appliance, so there is no syslog sender
        to repoint. Protective DNS pushes the agency's records to an
        agency-owned destination (object store or HTTP endpoint per the Log
        Push Guide) and Cribl collects from there, replacing whatever ArcSight
        connector or manual portal download is in place today. This is a very
        high volume feed (CISA reports an average of 1.6 billion queries
        secured daily across 104-plus onboarded agencies), so a sampling or
        block-only decision belongs at this collection hop. Also confirm
        delivery latency and the replay story with the Protective DNS team:
        the six-month hot / three-year cold retention on CISA's side is the
        backstop for a collection gap, but recovering from it is a portal
        export, not a re-push.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cloudflare_logpush.gateway_dns
      notes: >
        Correct only if the push delivers unmodified Cloudflare gateway_dns
        records; if AFS reshapes them, this becomes a custom
        logs-cisa_pdns.resolution stream and the custom namespace below
        applies instead of cloudflare_logpush.gateway_dns.*.
  formats:
  - format: json
    parsing:
      mechanism: elastic-integration
      artifact: Cloudflare Logpush integration (cloudflare_logpush), gateway_dns data stream
      notes: >
        The Elastic cloudflare_logpush integration ships a gateway_dns data
        stream whose ingest pipeline already parses exactly these field names
        into ECS plus a cloudflare_logpush.gateway_dns.* namespace, so IF the
        CISA push is pass-through Cloudflare Logpush NDJSON this is free and
        should be used. That conditional is the single biggest unknown in this
        map: step one of onboarding is to capture a real push file and diff
        its keys against the documented gateway_dns field list. If the keys
        match, adopt the integration and confine local work to an @custom
        pipeline; if AFS has reshaped or subset the records, fall back to
        mechanism cribl-pipeline and a hand-built parser, keeping the ECS
        targets below unchanged so detections written now survive the switch.
    fields:
    - vendor: Datetime
      type: timestamp
      description: date and time the DNS request was made, as recorded by the resolver.
      ecs: '@timestamp'
      status: mapped
      transform: >
        emitted as either an RFC3339 string or an epoch integer depending on
        the Logpush timestamp-format setting; confirm which the CISA push
        uses, because an epoch value silently indexes as a number if the
        template is not explicit
    - vendor: QueryID
      type: string
      description: >-
        globally unique identifier the resolver assigns to this query, used to
        correlate a record across the portal and the push feed.
      ecs: event.id
      status: mapped
      notes: >
        deliberately NOT dns.id - this is a service-generated UUID, not the
        16-bit DNS transaction ID from the message header, which the feed does
        not carry at all. It is the join key back to the Protective DNS web
        application when an analyst needs the authoritative record
    - vendor: QueryName
      type: string
      description: the queried domain name.
      ecs: dns.question.name
      status: mapped
      transform: >
        lowercase and strip any trailing dot, then derive
        dns.question.registered_domain, top_level_domain and subdomain with a
        registered-domain processor - the stock integration does not do this,
        and DGA, tunnelling and newly-registered-domain hunting all key on
        registered_domain rather than the full name
    - vendor: QueryTypeName
      type: string
      description: DNS query type as a mnemonic (A, AAAA, TXT, MX, PTR, NULL, SRV).
      ecs: dns.question.type
      status: mapped
      notes: >
        the feed also carries the numeric QueryType alongside it, so unlike
        most DNS sources no code lookup is needed; a spike in TXT or NULL
        against a single registered domain is the classic tunnelling signal
    - vendor: RCode
      type: integer
      description: DNS return code sent back to the client by the resolver.
      ecs: dns.response_code
      status: partial
      transform: >
        numeric code needs the standard lookup to the ECS mnemonic (0 NoError,
        2 ServFail, 3 NXDomain, 5 Refused); the stock integration ships that
        table. CRITICAL: do NOT derive event.outcome from this field, which is
        what the stock pipeline does - a policy block is answered NOERROR with
        a sinkhole or 0.0.0.0 address, so every block indexes as a success.
        RCode is resolution health only; the verdict lives in ResolverDecision
    - vendor: ResolverDecision
      type: enum
      description: >-
        what the resolver actually did with the query - the
        block/allow/override verdict and the single most important field in
        the dataset.
      ecs: event.action
      status: partial
      transform: >
        documented values include blockedByCategory (matched a category in a
        block policy), blockedAlwaysCategory (always blocked by the provider),
        blockedRule (a resolved IP matched a block policy), allowedRule,
        allowedOnNoPolicyMatch (the ordinary case), allowedOnNoLocation (the
        query had no matching DNS location - an onboarding gap, not a security
        event), overrideApplied and overrideForSafeSearch. Map the raw token
        to event.action, derive event.outcome from the blocked/allowed prefix,
        and add event.type: denied for the blocked values. Confirm the CISA
        tenant's value set against the onboarding documentation - a
        service-specific decision such as a sinkhole disposition may be
        present here and is not in the public list
    - vendor: SrcIP
      type: ip
      description: source IP address the resolver saw the DNS query arrive from.
      ecs: source.ip
      status: partial
      notes: >
        the most misleading field in the dataset. For roaming and cloud assets
        this is the device's own public address, but for on-premises traffic
        forwarded from an agency caching resolver it is the agency's egress or
        forwarder address, identical for tens of thousands of clients, so
        per-client attribution is simply not available on those records.
        Location and the device fields are the real attribution keys; treat
        source.ip as an egress point and set related.ip rather than assuming a
        client
    - vendor: Protocol
      type: enum
      description: >-
        protocol the client used to reach the resolver - plain DNS on 53,
        DNS-over-HTTPS or DNS-over-TLS.
      ecs: network.protocol
      status: mapped
      notes: >
        directly measures OMB M-22-09 Network Pillar Action 1 compliance
        (encrypted DNS wherever technically supported), so this field is a
        reporting deliverable as well as a detection input; also set
        network.transport (udp/tcp) from it where the value distinguishes them
    - vendor: ResolvedIPs
      type: ip
      description: the IP addresses returned in the response.
      ecs: dns.resolved_ip
      status: mapped
      notes: >
        on a blocked query this holds the sinkhole or 0.0.0.0 answer rather
        than the real destination, which is a useful secondary block
        indicator; also append to related.ip so this dataset joins to firewall
        and proxy flow data
    - vendor: CNAMEs
      type: string
      description: intermediate CNAME domains traversed while resolving the query, as an array.
      ecs: null
      status: unmapped
      custom: cisa.pdns.cname_chain
      notes: >
        ECS dns.answers.data can hold these but flattens the ordering that
        makes a CNAME chain interpretable; keep the array, since CNAME
        cloaking to a malicious endpoint behind a benign-looking QueryName is
        exactly what the separate CNAMECategoryNames field exists to catch
    - vendor: ResourceRecordsJSON
      type: string
      description: the full answer section as a JSON string of resource-record objects.
      ecs: null
      status: partial
      custom: cisa.pdns.resource_records_json
      notes: >
        the only complete carrier of the answer section, and the route to
        dns.answers.data, dns.answers.ttl and dns.answers.type. It is also the
        largest value on the wire and the one field here with nested
        structure, so it is both the biggest volume decision and the main
        obstacle to a simple guard content filter
    - vendor: PolicyName
      type: string
      description: name of the Protective DNS policy or rule that was applied to the query.
      ecs: rule.name
      status: mapped
      notes: >
        spans both the CISA global baseline policies and the agency's own
        organization-specific policies configured in the web application,
        which is the distinction a CSOC most needs and which no single field
        makes explicit - derive it from the naming convention and confirm that
        convention during onboarding. The stock integration leaves this in the
        custom namespace, so promoting it to rule.name is local work
    - vendor: PolicyID
      type: string
      description: UUID of the policy or rule that was applied.
      ecs: rule.id
      status: mapped
      notes: >
        rule.id is used here per the repo convention because PolicyID and
        PolicyName describe the SAME object; the separate resolver-policy
        identifiers are a different object and stay off rule.*
    - vendor: MatchedCategoryNames
      type: string
      description: >-
        content or threat category names that matched a policy on this query
        (malware, phishing, command and control, spyware), as an array.
      ecs: rule.category
      status: partial
      notes: >
        the threat classification a CSOC triages on, and the field that turns
        a block into an actionable finding. rule.category is the closest GA
        home but is single-valued in spirit while this is an array, so keep
        the full array in the custom namespace too. Note the distinction from
        InitialCategoryNames and QueryCategoryNames, which describe the domain
        regardless of whether a policy matched - only the Matched* fields
        indicate enforcement
    - vendor: MatchedIndicatorFeedNames
      type: string
      description: >-
        names of the threat intelligence feeds whose indicators matched this
        query, as an array.
      ecs: threat.feed.name
      status: partial
      notes: >
        Protective DNS blends CISA-proprietary indicators with commercial
        feeds and agency-furnished feeds, so this is the field that answers
        "was this a CISA indicator or a commercial one", which drives whether
        a block is reportable to CISA or handled locally. threat.feed.name is
        correct here because the value is a TI provider's feed identity, not a
        detection name - the repo convention that keeps signature names off
        threat.indicator.* does not apply. It is emitted as an array while ECS
        models a single feed, so a multi-feed match needs a documented
        collapse rule
    - vendor: Location
      type: string
      description: name of the configured Protective DNS location the query arrived from.
      ecs: null
      status: unmapped
      custom: cisa.pdns.location.name
      notes: >
        an agency-defined registration object (an office, an egress, a DoH/DoT
        hostname) and the primary attribution key for all on-premises
        forwarded traffic, since SrcIP collapses to a NAT address for those
        records. Its usefulness is entirely a function of how granularly the
        agency defined its locations at onboarding, which is worth auditing
        before building any site-level detection on it
    - vendor: DeviceName
      type: string
      description: >-
        name of the enrolled device the query originated from, present only
        for roaming/agent-forwarded traffic.
      ecs: host.name
      status: partial
      notes: >
        populated only where a device agent or user-specific DoH token
        attributes the query; absent on everything forwarded from an
        on-premises resolver, so a detection that requires it silently
        excludes the entire on-premises estate. DeviceID (a stable UUID) is
        the safer join key and belongs on device.id, since device names are
        documented as not guaranteed unique
    - vendor: Email
      type: string
      description: email address of the authenticated user the query is attributed to.
      ecs: user.email
      status: partial
      notes: >
        same coverage caveat as DeviceName - identity is attached only where
        the query carried user authentication, so user-based DNS hunting
        covers the roaming population only. UserID accompanies it and is the
        stable identifier for user.id
    - vendor: EDEErrors
      type: integer
      description: Extended DNS Error codes returned with the response, as an array.
      ecs: null
      status: unmapped
      custom: cisa.pdns.extended_dns_errors
      notes: >
        RFC 8914 codes; EDE 17 (Filtered) and 15 (Blocked) are the on-the-wire
        way a protective resolver signals policy enforcement, so this is the
        independent corroboration of ResolverDecision and the only block
        evidence visible to the client itself. Useful for reconciling what the
        endpoint experienced against what the service logged
    - vendor: ResponseTimeMs
      type: integer
      description: total time the resolver took to answer the query, in milliseconds.
      ecs: event.duration
      status: partial
      transform: >
        ECS event.duration is nanoseconds - multiply by 1,000,000. Mostly an
        availability signal against the service's 99.999 percent uptime claim
        rather than a detection input, but a resolver-latency shift is the
        first symptom of a mandated-dependency problem worth alerting on
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Do the format proof before any pipeline work: pull one real push
          file, diff its keys against the documented gateway_dns field list,
          and let that single answer decide between
          pass-through-to-integration and a hand-built parser. Assuming
          pass-through, keep the collector thin and spend the low-side budget
          on volume and attribution instead - a query-versus-block routing
          split so that blocked and overridden decisions go to a retained
          stream while ordinary NOERROR resolutions can be sampled or
          aggregated, and a Location-to-site plus Location-to-owner lookup
          done here, since that is the only attribution available when SrcIP
          is an agency NAT egress address. Run the Elastic destination on
          Persistent Queue backpressure and cap QueryName length low-side, and
          make the decision on ResourceRecordsJSON explicit rather than
          incidental - it is the largest value on the wire and worth carrying
          only if answer-section detections are actually in scope.
        elastic: >
          Use the stock cloudflare_logpush gateway_dns pipeline as the parser
          and own a logs-cloudflare_logpush.gateway_dns@custom pipeline for
          the one defect that matters: the stock pipeline sets event.outcome
          purely from RCode, so a blocked query - which is answered NOERROR
          with a sinkhole or 0.0.0.0 address - is indexed as event.outcome
          success, and every block-rate metric and block alert built on the
          stock mapping is wrong. Derive event.outcome, event.action and
          event.type from ResolverDecision instead, keeping RCode on
          dns.response_code as resolution health only, and in the same
          pipeline promote PolicyName/PolicyID to rule.name/rule.id and
          MatchedCategoryNames to rule.category, which the stock pipeline
          leaves buried in the custom namespace. Add a registered-domain
          processor on dns.question.name for DGA and newly-registered-domain
          hunting, and map the cisa.pdns.* customs (location.name,
          cname_chain, resource_records_json, extended_dns_errors) as keyword
          in the index template - reconciling that namespace with
          cloudflare_logpush.gateway_dns.* once the pass-through question is
          settled, so the estate does not end up with both.
        relay: >
          Which side this feed lands on is an agency choice, not a given: the
          landing zone can be provisioned on either side, so decide it
          deliberately during onboarding. Low-side landing zones cross a thin
          envelope (_dataId, @timestamp, host, _raw) rather than full ECS so
          the Cloudflare integration pipeline stays the parser, and treat the
          crossing as at-most-once with low-side versus high-side count
          reconciliation per (dataset, hour) - at billions of queries a day,
          silent drops are invisible without it. Two values are real
          content-filter friction and need bounding low-side: QueryName is
          entirely attacker-chosen and can be long, punycode or non-ASCII, and
          ResourceRecordsJSON is a nested JSON blob that violates the
          shallow-nesting constraint outright, so flatten or drop it before
          the guard so a custom NDJSON filter can stay simple.
      direct:
        parse_location: high
        cribl: >
          Do the format proof before any pipeline work: pull one real push
          file, diff its keys against the documented gateway_dns field list,
          and let that single answer decide between
          pass-through-to-integration and a hand-built parser. Assuming
          pass-through, keep the collector thin and spend the budget on volume
          and attribution instead - a query-versus-block routing split so that
          blocked and overridden decisions go to a retained stream while
          ordinary NOERROR resolutions can be sampled or aggregated, and a
          Location-to-site plus Location-to-owner lookup done here, since that
          is the only attribution available when SrcIP is an agency NAT egress
          address. Run the Elastic destination on Persistent Queue
          backpressure and cap QueryName length, and make the decision on
          ResourceRecordsJSON explicit rather than incidental - it is the
          largest value on the wire and worth carrying only if answer-section
          detections are actually in scope.
        elastic: >
          Use the stock cloudflare_logpush gateway_dns pipeline as the parser
          and own a logs-cloudflare_logpush.gateway_dns@custom pipeline for
          the one defect that matters: the stock pipeline sets event.outcome
          purely from RCode, so a blocked query - which is answered NOERROR
          with a sinkhole or 0.0.0.0 address - is indexed as event.outcome
          success, and every block-rate metric and block alert built on the
          stock mapping is wrong. Derive event.outcome, event.action and
          event.type from ResolverDecision instead, keeping RCode on
          dns.response_code as resolution health only, and in the same
          pipeline promote PolicyName/PolicyID to rule.name/rule.id and
          MatchedCategoryNames to rule.category, which the stock pipeline
          leaves buried in the custom namespace. Add a registered-domain
          processor on dns.question.name for DGA and newly-registered-domain
          hunting, and map the cisa.pdns.* customs (location.name,
          cname_chain, resource_records_json, extended_dns_errors) as keyword
          in the index template - reconciling that namespace with
          cloudflare_logpush.gateway_dns.* once the pass-through question is
          settled, so the estate does not end up with both.
- id: threat-alert
  name: Real-time malicious-query alerts
  description: |
    The alert feed, distinct from the bulk resolution log above: CISA's published materials state that when Protective DNS finds a match between a DNS request and a threat intelligence indicator, the service "blocks, redirects, or sinkholes the query response and sends an alert to the origin agency and to CISA", and that the service "leverages an application programming interface (API) to provide real-time updates to participating agencies when potential malicious DNS requests are identified". Agencies additionally configure "actionable email alerts triggered by malicious events" in the web application. This is the low-volume, high-value half of the technology and the feed a CSOC should onboard first.
    FIELD NAMES BELOW ARE PLACEHOLDERS. Unlike the resolution dataset, which rests on the publicly documented Cloudflare Gateway gateway_dns schema, nothing about the alert API's record structure is public: CISA names the capability but publishes no endpoint, schema or sample. The fields here describe what such an alert must carry to be actionable, expressed in a custom cisa.pdns.alert.* namespace, and every one MUST be confirmed against the agency's Protective DNS User Guide and the API documentation released at onboarding. Confirm first whether the alert API is a genuinely separate record type or simply a filtered, pushed view of the resolution records - if it is the latter, delete this dataset and alert off the blocked ResolverDecision values instead rather than maintaining two parsers for one record.
  event_categories:
  - dns
  - malware
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave, REST collector
      notes: >
        Modelled as a Cribl REST collector polling the Protective DNS alert
        API on a schedule with a checkpointed cursor; if the API is in fact
        push-only (webhook), this becomes a Cribl HTTP source instead and the
        collector needs an inbound path from the internet, which is a
        materially different network ask worth settling early. This dataset
        takes the same side as the resolution feed, since both terminate in
        the same landing zone. Email alerts are a parallel delivery path for
        the same events and should NOT be onboarded as a second source; treat
        them as an operator convenience and keep the API as the record of
        truth.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisa_pdns.alert
    direct:
    - hop: cribl
      location: edge worker group, REST collector
      notes: >
        Modelled as a Cribl REST collector polling the Protective DNS alert
        API on a schedule with a checkpointed cursor; if the API is in fact
        push-only (webhook), this becomes a Cribl HTTP source instead and the
        collector needs an inbound path from the internet, which is a
        materially different network ask worth settling early. This dataset
        takes the same side as the resolution feed, since both terminate in
        the same landing zone. Email alerts are a parallel delivery path for
        the same events and should NOT be onboarded as a second source; treat
        them as an operator convenience and keep the API as the record of
        truth.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisa_pdns.alert
  formats:
  - format: api-pull
    parsing:
      mechanism: cribl-pipeline
      artifact: custom CISA Protective DNS alert pipeline
      notes: >
        No Elastic integration and no Cribl pack exists for CISA Protective
        DNS specifically, and the alert API is agency-facing only, so a
        hand-built pipeline is the only option here regardless of how the
        resolution feed is handled. Keep the ECS targets identical to the
        resolution dataset (dns.question.name, rule.name, threat.feed.name,
        source.ip) so alerts and resolutions join on one field set - that join
        is the whole value of running both, since the alert says what CISA saw
        and the resolution log says what else that device asked for around the
        same moment.
    fields:
    - vendor: alert_id
      type: string
      description: unique identifier of the alert record.
      ecs: event.id
      status: partial
      notes: >
        placeholder name; needed for deduplication because a polled collector
        and a webhook can both deliver the same alert twice, and because an
        alert may be reissued as an incident is enriched
    - vendor: alert_time
      type: timestamp
      description: time the service raised the alert.
      ecs: '@timestamp'
      status: partial
      notes: >
        placeholder name; confirm whether this is the alert-generation time or
        the underlying query time - they differ, and only the query time joins
        cleanly to the resolution dataset, so if both are emitted keep the
        query time on @timestamp and the alert time on event.ingested
    - vendor: query_name
      type: string
      description: the malicious domain name that was queried and matched.
      ecs: dns.question.name
      status: partial
      transform: >
        same normalization as the resolution dataset (lowercase, strip
        trailing dot, derive registered_domain) - identical treatment on both
        datasets is what makes the alert-to-resolution join work at all
    - vendor: source_ip
      type: ip
      description: address the offending query originated from.
      ecs: source.ip
      status: partial
      notes: >
        carries the same NAT-collapse caveat as the resolution dataset: for
        on-premises traffic this is an agency egress address, so an alert may
        not identify a device at all and triage has to fall back to the
        resolution log or internal DNS telemetry
    - vendor: device_name
      type: string
      description: enrolled device the query came from, where identity is available.
      ecs: host.name
      status: partial
      notes: >
        placeholder name; populated only for roaming and agent-forwarded
        traffic, so its absence is the norm rather than an anomaly
    - vendor: disposition
      type: enum
      description: what the service did with the matched query - blocked, redirected, or sinkholed.
      ecs: event.action
      status: partial
      transform: >
        CISA's public description names exactly these three outcomes; the
        emitted tokens are not public and need a site lookup. Preserve the raw
        token on event.action and derive event.outcome separately, because a
        sinkhole is operationally very different from a block - it means the
        host may still be talking to a controlled endpoint and there is
        follow-on traffic to hunt for
    - vendor: threat_category
      type: string
      description: >-
        category of the threat that matched - malware, phishing, spyware,
        command and control botnet.
      ecs: rule.category
      status: partial
      notes: >
        the vocabulary should match MatchedCategoryNames on the resolution
        dataset; confirm that it does, because two divergent category
        vocabularies across the two feeds would break every dashboard that
        groups them together
    - vendor: indicator_feed
      type: string
      description: >-
        threat intelligence feed whose indicator matched - CISA-proprietary,
        commercial, or agency-furnished.
      ecs: threat.feed.name
      status: partial
      notes: >
        the field that determines reporting obligation, since a CISA-sourced
        indicator match is a different conversation from a commercial-feed hit
    - vendor: matched_indicator
      type: string
      description: the specific indicator value that matched (domain, hostname or IP).
      ecs: threat.enrichments.indicator.name
      status: partial
      notes: >
        threat.enrichments.* is the correct ECS home for a TI match asserted
        against an event, and is distinct from the repo convention that keeps
        vendor DETECTION names and ids off threat.indicator.* - this value
        genuinely is a threat intelligence provider's indicator. Also set
        threat.enrichments.matched.atomic and .field so it is clear what was
        compared, since the match may be on the query name, a CNAME in the
        chain, or a resolved IP
    - vendor: policy_name
      type: string
      description: policy that produced the alert.
      ecs: rule.name
      status: partial
      notes: >
        keep identical to PolicyName on the resolution dataset so the two
        feeds join on rule.name; if the alert API emits a policy identifier
        too, it goes on rule.id under the same same-object convention
    - vendor: severity
      type: string
      description: severity or confidence the service assigned to the alert.
      ecs: event.severity
      status: partial
      transform: >
        ECS event.severity is a long, so a textual scale needs an explicit
        lookup rather than a cast; confirm the scale's direction before
        writing it, since an inverted severity is the classic silent failure
        in an alert pipeline
    - vendor: sinkhole_address
      type: ip
      description: address the query was redirected or sinkholed to.
      ecs: null
      status: unmapped
      custom: cisa.pdns.alert.sinkhole_address
      notes: >
        deliberately not destination.ip - this is a service-controlled
        disposition target, not a destination the client chose, and mapping it
        as a flow endpoint would contaminate destination-based analytics.
        Worth extracting as a watchlist value so follow-on connections to it
        can be hunted in firewall and proxy data
    - vendor: alert_url
      type: string
      description: deep link into the Protective DNS web application for this alert.
      ecs: event.reference
      status: partial
      notes: >
        placeholder name; if present it is the fastest path from a Kibana
        alert to the authoritative record, and worth surfacing in the
        detection rule investigation guide
    - vendor: raw alert record
      type: string
      description: unparsed API response object retained for reprocessing.
      ecs: event.original
      status: mapped
      notes: >
        retain in full for this dataset - the volume is trivial and every
        field above is a placeholder, so the raw record is the only safe home
        for whatever the API actually returns
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Confirm the delivery model before building anything: a polled REST
          collector with a checkpointed cursor and a push webhook are
          different pipelines and different network asks, and the answer also
          determines whether duplicate suppression is needed on the alert
          identifier. Build the pipeline to emit full ECS-shaped JSON low-side
          since no integration exists to parse it later, deriving
          event.outcome from the disposition token while preserving the raw
          value on event.action so a block, a redirect and a sinkhole stay
          distinguishable, and normalizing whatever severity scale the API
          uses into event.severity through an explicit lookup rather than a
          cast. Alert volume is low enough that nothing should be sampled or
          dropped - run Persistent Queue backpressure, retain _raw in full,
          and treat an empty poll window as a condition to monitor rather than
          a normal result.
        elastic: >
          Own a custom logs-cisa_pdns.alert ingest pipeline and index-template
          mappings for the cisa.pdns.alert.* customs (id, disposition,
          sinkhole_address, url) as keyword, plus
          threat.enrichments.indicator.* so the matched indicator has a stable
          ECS home. The detection worth building the pipeline around is not
          the alert itself - CISA already blocked the query - but what the
          device did next: correlate each alert to the resolution dataset on
          dns.question.name and source.ip within a short window to surface
          retries, fallback domains and the same device reaching other flagged
          names, which is the difference between a blocked query and a
          compromised host. Deduplicate on the alert identifier at ingest, and
          alert on the alert feed going silent, since a mandated control that
          stops reporting is indistinguishable from a quiet week without an
          explicit gap monitor.
        relay: >
          This feed takes the resolution feed's side, and on the low-side
          crossing it gets a dedicated route rather than sharing the bulk
          resolution path - the volume is trivial and these are the records
          that must not be queued behind billions of query rows on an
          at-most-once crossing. Cross as full ECS-shaped NDJSON (envelope
          mode B) since no Elastic integration exists to parse a thin envelope
          on the far side, with short ASCII keys, nesting depth at most two
          and an allowlisted key set. The friction to bound low-side is the
          attacker-chosen query name and any free-text description or
          reference URL the API returns; cap and allowlist them so a custom
          content filter stays simple.
      direct:
        parse_location: low
        cribl: >
          Confirm the delivery model before building anything: a polled REST
          collector with a checkpointed cursor and a push webhook are
          different pipelines and different network asks, and the answer also
          determines whether duplicate suppression is needed on the alert
          identifier. Build the pipeline to emit full ECS-shaped JSON since no
          integration exists to parse it later, deriving event.outcome from
          the disposition token while preserving the raw value on event.action
          so a block, a redirect and a sinkhole stay distinguishable, and
          normalizing whatever severity scale the API uses into event.severity
          through an explicit lookup rather than a cast. Alert volume is low
          enough that nothing should be sampled or dropped - run Persistent
          Queue backpressure, retain _raw in full, and treat an empty poll
          window as a condition to monitor rather than a normal result.
        elastic: >
          Own a custom logs-cisa_pdns.alert ingest pipeline and index-template
          mappings for the cisa.pdns.alert.* customs (id, disposition,
          sinkhole_address, url) as keyword, plus
          threat.enrichments.indicator.* so the matched indicator has a stable
          ECS home. The detection worth building the pipeline around is not
          the alert itself - CISA already blocked the query - but what the
          device did next: correlate each alert to the resolution dataset on
          dns.question.name and source.ip within a short window to surface
          retries, fallback domains and the same device reaching other flagged
          names, which is the difference between a blocked query and a
          compromised host. Deduplicate on the alert identifier at ingest, and
          alert on the alert feed going silent, since a mandated control that
          stops reporting is indistinguishable from a quiet week without an
          explicit gap monitor.
