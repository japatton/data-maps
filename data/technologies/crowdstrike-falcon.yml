    fields: []
  - format: syslog-kv
    enable: >
      With the default config and output_format=syslog the connector flattens
      the audit event types into the same space-separated key=value syslog
      lines it uses for detections, with keys matching the JSON field names
      (OperationName=, ServiceName=, UserId=, UserIp=, Success=, ...). One
