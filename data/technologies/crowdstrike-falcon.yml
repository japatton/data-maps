      records are flattened together.
    references:
    - >-
      https://github.com/mitespsoc/siem/blob/main/crowdstrike_falcon_siem_connector_configuration.md
    - >-
      https://www.crowdstrike.com/wp-content/brochures/falcon-connector/falcon-SIEM-connector-datasheet.pdf
    parsing:
      mechanism: cribl-pipeline
      artifact: KV-extract pipeline mapping flattened audit JSON keys into crowdstrike.falcon.*
      notes: >
        The syslog key=value keys are the flattened JSON audit field names
        already inventoried on the json format, so no separate attribute
        reference exists -- KV extraction recovers the same named fields and
        the ECS mapping is identical to the JSON audit path. The attribute
        table is intentionally empty rather than duplicating the json field
        list; the real work is robust KV tokenisation of the AuditKeyValues
        detail, whose values can contain spaces and secrets.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Run a KV extractor at the low-side edge worker group and re-key into
          crowdstrike.falcon.*; mask the token-bearing operation detail before
          the guard exactly as on the JSON and CEF paths. The flattened
          AuditKeyValues values are the tokenisation hazard, so extract them
          with explicit terminators rather than naive whitespace splitting.
        elastic: >
          Decode with a generic KV ingest processor into
          logs-crowdstrike.falcon@custom, deriving event.category and
          event.outcome as on the JSON audit path; the KV form loses JSON's
          array structure for AuditKeyValues, so the flattened pairs must be
          reassembled into the mapped object explicitly.
        relay: >
          A single flat key=value line crosses a shallow filter easily; the
          secret-bearing audit values must be masked and length-bounded
          low-side before the guard. Reconcile per (eventType, hour) on the
          flattened offset key.
      direct:
        parse_location: hybrid
        cribl: >
          Same-side stacks run a KV extractor at the edge worker group,
          re-keying into crowdstrike.falcon.* and masking the token-bearing
          operation detail before indexing, extracting the AuditKeyValues
          values with explicit terminators. The json audit feed is preferable
          since KV discards the AuditKeyValues array structure.
        elastic: >
          Decode with a generic KV ingest processor into
          logs-crowdstrike.falcon@custom, deriving event.category and
          event.outcome as on the JSON audit path and rebuilding the
          AuditKeyValues object from the flattened pairs.
    fields_omitted: >
      The key=value keys are the flattened JSON audit field names --
      OperationName, ServiceName, UserId, UserIp, Success -- that the json
      entry on this dataset already inventories under the same names;
      flattening only unrolls the AuditKeyValues array into pairs, it
      introduces no keys of its own.
    fields: []
- id: fdr
  name: Falcon Data Replicator telemetry
  description: >
    Thin starter for the raw sensor telemetry feed. FDR replicates gzipped
    NDJSON batches into a CrowdStrike-managed (or customer-managed) S3 bucket
    with SQS notifications; every record is one of several hundred
    event_simpleName schemas (ProcessRollup2, DnsRequest, NetworkConnectIP4,
    UserLogon, ...), each with its own field set. This map documents only the
    envelope fields common to all FDR events plus the ProcessRollup2 subset,
    because the remaining schemas are versioned per sensor release and are
    only reliably enumerable from the tenant's own FDR schema API rather than
    from public documentation. Treat volume as the dominant design constraint:
    FDR is orders of magnitude larger than the detection stream.
  event_categories:
  - process
  - network
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Cribl's CrowdStrike FDR source polls the SQS queue and pulls the
        gzipped NDJSON objects from S3, so the pull happens wherever the
        worker group has AWS reachability. On this guarded path those
        endpoints are reached low-side and the volume problem below becomes a
        boundary-capacity problem.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-crowdstrike.fdr
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Cribl's CrowdStrike FDR source polls the SQS queue and pulls the
        gzipped NDJSON objects from S3, so the pull happens wherever the
        worker group has AWS reachability. Volume is the dominant design
        constraint on this path.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-crowdstrike.fdr
  formats:
  - format: json
    parsing:
      mechanism: cribl-pack
      artifact: Cribl Pack for CrowdStrike
      notes: >
        The pack exists specifically to cut FDR volume - dropping process
        events by hash or name, dropping whole event_simpleName classes,
        sampling ExternalApiEvent, aggregating network events and hex-decoding
        ScriptContentBytes - and the vendor claims up to 80% reduction. The
        Elastic integration's fdr data stream is the alternative and would put
        this on elastic-integration instead, but it does no volume shaping, so
        the pack is the realistic choice while the reduction ruleset is the
        thing under active tuning.
    fields:
    - vendor: event_simpleName
      type: string
      description: >-
        name of the FDR telemetry schema this record conforms to, e.g.
        ProcessRollup2, DnsRequest, NetworkConnectIP4
      ecs: null
      status: unmapped
      custom: crowdstrike.fdr.event_simple_name
      notes: >
        determines every other field on the record; there are several hundred
        values and new ones appear with sensor releases, so it is both the
        parsing discriminator and the correct dimension for volume accounting
    - vendor: aid
      type: string
      description: sensor identifier, unique to each installation of the Falcon sensor
      ecs: agent.id
      status: mapped
      notes: >-
        reinstalling the sensor issues a new aid, so one host maps to several
        agent.id values over its life
    - vendor: aip
      type: ip
      description: 'the sensor''s IP address as seen from the CrowdStrike cloud'
      ecs: host.ip
      status: partial
      notes: >
        this is the egress/public address the cloud observed, not necessarily
        an address configured on the host, so it will disagree with host.ip
        from any on-host collector behind NAT; kept on host.ip as the closest
        fit but consumers must not treat it as a local interface address
    - vendor: cid
      type: string
      description: CrowdStrike customer identifier the sensor is enrolled under
      ecs: organization.id
      status: mapped
    - vendor: ContextTimeStamp
      type: timestamp
      description: time the event occurred on the endpoint, as seen by the sensor
      ecs: '@timestamp'
      status: partial
      transform: >
        epoch value emitted with a fractional component in some schema
        versions and as whole milliseconds in others; normalise before
        indexing and prefer this over the cloud receipt time so endpoint event
        ordering survives replication delay
    - vendor: timestamp
      type: timestamp
      description: time the CrowdStrike cloud received the event from the sensor
      ecs: event.ingested
      status: mapped
      notes: >
        the gap between this and ContextTimeStamp is the sensor-to-cloud delay
        and is worth keeping as a health signal, not as the event time
    - vendor: ComputerName
      type: string
      description: hostname of the endpoint the sensor is installed on
      ecs: host.name
      status: mapped
      notes: >
        not present on every FDR schema - many records carry only aid, which
        is why the aid-to-host lookup has to run somewhere in the pipeline
    - vendor: ImageFileName
      type: string
      description: full path to the executable (PE) file, on ProcessRollup2 records
      ecs: process.executable
      status: mapped
      transform: >-
        emitted in \Device\HarddiskVolumeN form on Windows; rewrite to a drive
        letter to match Windows and Sysmon documents
    - vendor: CommandLine
      type: string
      description: command line used to create the process, on ProcessRollup2 records
      ecs: process.command_line
      status: mapped
    - vendor: RawProcessId
      type: long
      description: 'the operating system''s internal PID, on ProcessRollup2 records'
      ecs: process.pid
      status: mapped
      notes: >-
        this, not TargetProcessId, is the value that matches a Windows or
        Sysmon process.pid
    - vendor: TargetProcessId
      type: string
      description: 'CrowdStrike''s unique identifier for the process, on ProcessRollup2 records'
      ecs: process.entity_id
      status: mapped
      notes: >
        a sensor-assigned 64-bit handle that stays unique across PID reuse; it
        is the correct join key within FDR and the correct occupant of
        process.entity_id, but it is not an OS PID
    - vendor: ParentProcessId
      type: string
      description: >-
        CrowdStrike's unique identifier for the parent process, on
        ProcessRollup2 records
      ecs: process.parent.entity_id
      status: mapped
    - vendor: UserSid
      type: string
      description: >-
        security identifier of the user that executed the command, on
        ProcessRollup2 records
      ecs: user.id
      status: mapped
      notes: >-
        a raw SID; resolving it to an account name needs an enrich policy fed
        from directory data
    - vendor: SHA256HashData
      type: string
      description: SHA-256 hash of the process image file, on ProcessRollup2 records
      ecs: process.hash.sha256
      status: mapped
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Do the volume work on the worker group before anything reaches
          Elastic: run the pack's drop and sample rules keyed on
          event_simpleName, process hash and process name, aggregate the
          network events, and hex-decode the script-content events so the
          reduction is measurable per event class rather than as one aggregate
          number. Emit full ECS-shaped JSON here rather than a passthrough,
          because the per-schema field extraction is already happening as part
          of the reduction pass, and attach the aid-to-host and ComputerName
          enrichment from the lookup the pack provides so downstream joins do
          not depend on a second lookup at index time. Gate the Elastic
          destination with schema validation plus a dead-letter route, and
          alert on the dead-letter rate specifically - a new sensor release
          adding an unrecognised event_simpleName is the expected failure
          mode.
        elastic: >
          Land the pre-shaped documents in logs-crowdstrike.fdr and keep
          high-side work to what the low side cannot do: resolve UserSid to an
          account name through an enrich policy, and reconcile process
          identity so TargetProcessId populates process.entity_id while
          RawProcessId populates process.pid, which is what makes FDR joinable
          against Windows and Sysmon documents. Add explicit custom-namespace
          mappings for crowdstrike.fdr.event_simple_name as keyword so
          per-schema volume queries stay cheap, and size the index template
          and ILM policy for this data stream separately from the detection
          stream - the two differ by orders of magnitude and sharing a policy
          will starve one of them.
        relay: >
          This is the hardest crossing on the technology, and the answer is to
          shrink before the boundary rather than after it: run the pack's
          reduction low-side so only the retained subset is offered to the
          guard, and drop _raw here first - FDR records are machine telemetry
          with low per-record forensic value and the raw gzipped batch is
          exactly what the boundary cannot afford. Full ECS-shaped NDJSON
          crosses (envelope mode B) with nesting held to two levels and
          bounded string lengths, since the free-text exposure is CommandLine
          and decoded script content. At-most-once with no return channel:
          reconcile counts per (event_simpleName, hour), not per dataset, or a
          single schema silently disappearing will hide inside the total.
      direct:
        parse_location: low
        cribl: >
          Do the volume work on the worker group before anything reaches
          Elastic: run the pack's drop and sample rules keyed on
          event_simpleName, process hash and process name, aggregate the
          network events, and hex-decode the script-content events so the
          reduction is measurable per event class rather than as one aggregate
          number. Emit full ECS-shaped JSON here rather than a passthrough,
          because the per-schema field extraction is already happening as part
          of the reduction pass, and attach the aid-to-host and ComputerName
          enrichment from the lookup the pack provides so downstream joins do
          not depend on a second lookup at index time. Gate the Elastic
          destination with schema validation plus a dead-letter route, and
          alert on the dead-letter rate specifically - a new sensor release
          adding an unrecognised event_simpleName is the expected failure
          mode.
        elastic: >
          Land the pre-shaped documents in logs-crowdstrike.fdr and keep
          high-side work to what the low side cannot do: resolve UserSid to an
          account name through an enrich policy, and reconcile process
          identity so TargetProcessId populates process.entity_id while
          RawProcessId populates process.pid, which is what makes FDR joinable
          against Windows and Sysmon documents. Add explicit custom-namespace
          mappings for crowdstrike.fdr.event_simple_name as keyword so
          per-schema volume queries stay cheap, and size the index template
          and ILM policy for this data stream separately from the detection
          stream - the two differ by orders of magnitude and sharing a policy
          will starve one of them.
