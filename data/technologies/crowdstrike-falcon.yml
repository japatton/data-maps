        leef.cfg audit sections are the authoritative attribute map but their
        per-attribute keys are not published in a reachable vendor field
        reference, so the attribute table is empty pending an on-host read;
        the format itself is real and configurable.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Decode audit LEEF at the low-side edge worker group, resolve the
          tab-delimited attributes to named keys, and apply the same
          reveal_token / API-key masking before the guard that the JSON and
          CEF audit paths require. Do not sample this low-volume feed.
        elastic: >
          Land audit LEEF through logs-crowdstrike.falcon@custom, deriving
          event.category (authentication vs iam) from the operation attribute
          and event.outcome from the success attribute, mirroring the JSON
          audit mapping.
        relay: >
          A flat LEEF line crosses a shallow filter comfortably; the same
          secret-bearing operation detail must be masked low-side before the
          guard destination. Keep the full line for forensics and reconcile
          per (eventType, hour).
      direct:
        parse_location: hybrid
        cribl: >
          Same-side stacks decode audit LEEF at the edge worker group,
          resolving the tab-delimited attributes to named keys and applying
          the reveal_token / API-key masking before indexing. The richer json
          audit feed is preferable unless a LEEF-only consumer forces the
          switch.
        elastic: >
          Land audit LEEF through logs-crowdstrike.falcon@custom, deriving
          event.category (authentication vs iam) from the operation attribute
          and event.outcome from the success attribute, with reveal_token
          masking before indexing.
    fields_omitted: >
      The attributes naming the audited operation, actor and outcome come from
