      type: string
      description: >-
        numeric rsyslog error identifier carried in the trailing "try
        https://www.rsyslog.com/e/2007" hint on error messages
      ecs: error.code
      status: partial
      transform: >
        extract the numeric id from the URL and keep it as a short keyword; it
        is the only stable, version-independent identifier on this dataset and
        the right key for a lookup table of causes
    - vendor: action
      type: string
