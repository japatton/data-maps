          Run a custom logs-syslog_relay.daemon ingest pipeline with
          custom-namespace keyword mappings for rsyslog.action.name,
          rsyslog.action.module and syslog_ng.persist_name and long mappings
          for rsyslog.ratelimit.pid, syslog_ng.log_fifo_size and
          syslog_ng.time_reopen, and normalize the daemon into service.type so
          the rsyslog and syslog-ng halves of the tier can be filtered
          together or apart. The detections to build are correlations rather
          than patterns: join an action-suspended record against the impstats
          suspended counter and the low-side Cribl inEvents for the same host
          and alert when a suspension is followed by a step change in arrival
          rate, alert on any configuration reload that is not inside a change
          window - a relay reload can silently re-filter a feed and no other
          log in the estate records it - and alert on the imuxsock rate-limit
          notice by originating pid, since it names the specific application
          whose logs are being discarded. Alert on absence of the periodic
          startup/heartbeat pattern per host as well, for the same reason as
          the counter datasets.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) with the parsed
          fields plus a capped message body, UTF-8, LF-terminated, compression
          disabled, nesting depth at most two. This is the one dataset on the
          technology that is genuinely hostile to a simple hand-written
          content filter: the message body is unbounded operator- and
          library-generated text that can carry file paths, configuration
          fragments, peer addresses and non-ASCII characters, and error
          messages from output modules can embed remote server responses
          verbatim. Cap it to a flagged length and strip control characters
          low-side rather than asking a custom LUA rule to cope, confirm with
          the guard owner that destination hostnames and enclave peer
          addresses in the connection-broken records may traverse, and keep
          configuration content itself off the crossing - forward the fact
          that a reload happened, never the config that was loaded. Volume is
          low, so carry _raw across permanently and reconcile counts per
          (dataset, hour); a single lost record here loses a whole boundary
          configuration event. Transport is confirmed: a Cribl Syslog
          Destination on a CEF-structured __syslogout value today, with the
          high side parsing _raw through Extract JSON before Cribl fields and
          Routes, retiring in favour of the confirmed plan of record - a
          low-side Cribl HTTP Destination to a high-side Cribl HTTP Source
          carrying this NDJSON. The cap on the message body should be set
          against the syslog leg's per-message limit while that leg is live,
          since silent truncation there would be indistinguishable from a
          laconic daemon. AST/file drop is a replay-capable fallback only.
