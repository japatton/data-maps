          and daemon pid instead of regexing the message body, split
          syslog-ng's key='value' tail into typed fields, extract the numeric
          rsyslog error id out of the trailing rsyslog.com/e/NNNN hint into
          error.code, and set event.outcome from the action verb so suspended,
          resumed and reload-failure states are queryable without text search.
