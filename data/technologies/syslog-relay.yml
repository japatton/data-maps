  - format: json
    enable: >
      Bind a JSON template on the action that forwards the daemons' own
      messages. rsyslog: enable internal messages as regular logs
      (`global(processInternalMessages="on")`) and forward them with a
      template such as `template(name="daemonJSON" type="list") {
      property(name="timereported" dateFormat="rfc3339" format="jsonf"
      outname="@timestamp") property(name="hostname" format="jsonf")
      property(name="syslogfacility" format="jsonf")
      property(name="syslogseverity" format="jsonf")
      property(name="programname" format="jsonf")
      property(name="structured-data" format="jsonf") property(name="msg"
      format="jsonf") }`. The dateFormat="rfc3339" is the point: it emits a
      full ISO 8601 timestamp with year and offset, removing the RFC 3164
      guess, and the structured-data property carries rsyslog's origin block
      (software="rsyslogd" swVersion="..." x-pid="...") as a typed key instead
      of text embedded in msg. syslog-ng's internal() messages take the
      equivalent format-json() / value-pairs destination template.
    references:
    - https://docs.rsyslog.com/doc/configuration/templates.html
    - https://docs.rsyslog.com/doc/configuration/properties.html
    - https://syslog-ng.github.io/admin-guide/150_Statistics_of_syslog-ng/README.html
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        custom relay daemon operational pipeline (JSON-envelope variant,
        feeding logs-syslog_relay.daemon)
      notes: >
        No integration or pack covers these in any form. The json template
        restructures only the envelope, so the work that remains is identical
        to the syslog-raw feed: a bounded set of message-form patterns pinned
        to a lookup (rsyslog's action-suspended/resumed and imuxsock
        rate-limit forms, syslog-ng's reload/connection-broken/queue-full
        forms) applied to the still-opaque msg. The gain is real but bounded -
        the yearless timestamp and the regex-out-of-body extraction of
        software, swVersion and x-pid both disappear because Extract JSON
        yields them typed - while the message wording is not a stable API
        across releases, so the pattern set must still be version-tested
        rather than trusted.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Extract JSON low-side and take @timestamp straight from the rfc3339
          property instead of reconciling a yearless RFC 3164 stamp against
          the worker clock. Parse the structured-data key for software,
          swVersion and x-pid rather than regexing the body, then still derive
          event.action from the pinned lookup of the documented message forms
          - "action 'x' suspended" and "action 'x' resumed" differ by one word
          and mean opposite things, and a match on "drop" hits both the
          imuxsock rate-limit notice and the syslog-ng queue-full notice.
          Extract the numeric rsyslog error id from the trailing
          rsyslog.com/e/NNNN hint into error.code. This is the one dataset
          with genuinely unbounded free text, so cap and
          control-character-strip the msg body before the guard.
        elastic: >
          Run a custom logs-syslog_relay.daemon ingest pipeline with
          custom-namespace keyword mappings for rsyslog.action.name,
          rsyslog.action.module and syslog_ng.persist_name and long mappings
          for rsyslog.ratelimit.pid, syslog_ng.log_fifo_size and
          syslog_ng.time_reopen, normalizing the daemon into service.type. On
          the json path the date and structured-data processors become no-ops
          - validate @timestamp, service.version and process.pid arrive
          already populated and stop the pipeline from overwriting them. The
          detections are correlations: join an action-suspended record against
          the impstats suspended counter, alert on any configuration reload
          outside a change window, and alert on the imuxsock rate-limit notice
          by originating pid.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) with the parsed
          fields plus a capped msg body, UTF-8, LF-terminated, compression
          disabled, nesting depth at most two. This is the dataset most
          hostile to a simple content filter even in json form: the msg value
          is unbounded operator- and library-generated text that can carry
          file paths, config fragments, peer addresses and non-ASCII, and
          output-module errors can embed remote server responses verbatim - so
          cap it to a flagged length and strip control characters low-side
          rather than asking a LUA rule to cope, and keep configuration
          content itself off the crossing (forward that a reload happened,
          never the config that loaded). Carry _raw across permanently and
          reconcile per (dataset, hour) via the confirmed low-side to
          high-side Cribl HTTP NDJSON path; a single lost record here loses a
          whole boundary configuration event.
      direct:
        parse_location: hybrid
        cribl: >
          High-side concentrators Extract JSON, take @timestamp from the
          rfc3339 property, parse the structured-data key for software,
          swVersion and x-pid, and derive event.action from the pinned lookup
          of the documented message forms on the core worker group with no
          guard crossing; the msg cap still applies for downstream hygiene,
          and the daemon identity and action name are stamped so these records
          join the counter datasets on host and action name.
        elastic: >
          Run a custom logs-syslog_relay.daemon pipeline with the same
          custom-namespace keyword and long mappings the fields need, and on
          the json path validate that @timestamp, service.version and
          process.pid arrive already populated rather than overwriting them.
          Build the reload, suspension-correlation and rate-limit-by-pid
          detections here too, and alert on absence of the periodic
          startup/heartbeat pattern per host.
    fields:
    - vendor: timereported
      type: timestamp
      description: >-
        operational message time as an rfc3339 property, carrying year and
        timezone offset
      ecs: '@timestamp'
      status: mapped
      transform: >
        emitted by dateFormat="rfc3339", which removes the RFC 3164 yearless
        guess the syslog-raw feed has to reconcile against the receiving
        worker's clock
    - vendor: hostname
      type: string
      description: hostname of the concentrator that emitted the operational message
      ecs: host.name
      status: mapped
      notes: same relay-versus-relayed-device distinction as the counter datasets
    - vendor: syslogfacility
      type: integer
      description: numeric syslog facility of the operational message
      ecs: log.syslog.facility.code
      status: mapped
      notes: >
        emitted as a decimal number by the jsonf template, removing the PRI/8
        math the syslog-raw feed needs to recover facility
    - vendor: syslogseverity
      type: integer
      description: numeric syslog severity of the operational message
      ecs: log.syslog.severity.code
      status: mapped
      notes: >
        the cheapest triage axis - the messages that matter (queue full, rate
        limiting, action suspended, connection broken) are warning or error
        while routine lifecycle records are info
    - vendor: programname
      type: string
      description: emitting daemon - rsyslogd or syslog-ng
      ecs: log.syslog.appname
      status: mapped
      notes: >
        the branch discriminator for the whole pipeline, since the two daemons
        share nothing in message form beyond the syslog envelope
    - vendor: msg
      type: string
      description: >-
        free-text body of the operational message, still one opaque field
        inside the JSON envelope
      ecs: message
      status: mapped
      transform: >
        the sole source of event.action and event.outcome; the json template
        types the envelope but leaves the body untouched, so pin the
        documented message forms to a lookup rather than substring matching
        and version-test it, exactly as the syslog-raw feed must
    - vendor: software
      type: string
      description: >-
        emitting software name from rsyslog's structured-data property, origin
        software="rsyslogd"
      ecs: service.type
      status: partial
      notes: >
        constant per daemon so it carries no per-record information, but it is
        the reliable discriminator between the rsyslog and syslog-ng halves of
        a mixed tier and should be set deliberately for syslog-ng records too
    - vendor: swVersion
      type: string
      description: >-
        daemon version from rsyslog's structured-data swVersion attribute (or
        syslog-ng's "starting up; version='...'" record)
      ecs: service.version
      status: mapped
      notes: >
        the inventory of what runs on the legacy tier, otherwise undocumented;
        counter availability is version-dependent on both daemons, so this
        field decides which counters a host can even be expected to emit
    - vendor: x-pid
      type: integer
      description: 'daemon process id from rsyslog''s structured-data x-pid attribute'
      ecs: process.pid
      status: mapped
      notes: >
        a change in this value between records without an intervening start
        message is an unlogged daemon restart, one of the few ways a relay can
        lose in-memory queued messages without any counter recording it
