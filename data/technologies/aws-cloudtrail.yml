id: aws-cloudtrail
name: AWS GovCloud CloudTrail
vendor: Amazon Web Services
versions: >-
  CloudTrail record eventVersion 1.08 - 1.11 (AWS GovCloud US, us-gov-west-1 /
  us-gov-east-1)
draft: true
references:
- >-
  https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
- >-
  https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html
- >-
  https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
- https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-ct.html
- https://www.elastic.co/docs/reference/integrations/aws/cloudtrail
- >-
  https://github.com/elastic/integrations/blob/main/packages/aws/data_stream/cloudtrail/fields/fields.yml
datasets:
- id: management-events
  name: Management events
  description: >
    Control-plane API activity for the GovCloud accounts - every AwsApiCall /
    AwsConsoleAction / AwsServiceEvent record written by the account or
    organization trail. CloudTrail writes gzipped JSON objects containing a
    Records[] array to the trail's S3 bucket; each array element is one event.
    This is the primary CloudTrail feed for the CSOC (IAM changes, trail and
    logging tampering, KMS and security-group changes, STS role assumption).
    GovCloud specifics that matter for parsing: awsRegion is always
    us-gov-west-1 or us-gov-east-1, and every ARN carries the aws-us-gov
    partition rather than aws, so any regex or lookup written against
    commercial ARNs will silently miss.
  event_categories:
  - iam
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Cribl Amazon S3 source subscribed to the S3 event-notification SQS
        queue on the trail bucket (SQS mode, not bucket polling) using the
        standard sqs.us-gov-west-1.amazonaws.com endpoint - the FIPS SQS
        variant does not resolve in that region, while the S3 side can use
        s3-fips.us-gov-west-1.amazonaws.com.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-aws.cloudtrail
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Cribl Amazon S3 source subscribed to the S3 event-notification SQS
        queue on the trail bucket (SQS mode, not bucket polling) using the
        standard sqs.us-gov-west-1.amazonaws.com endpoint - the FIPS SQS
        variant does not resolve in that region, while the S3 side can use
        s3-fips.us-gov-west-1.amazonaws.com.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-aws.cloudtrail
  formats:
  - format: json
    recommended: true
    recommended_because: >-
      the AWS integration reads CloudTrail directly; the OCSF route depends on
      standing up Amazon Security Lake in the GovCloud Regions first.
    parsing:
      mechanism: elastic-integration
      artifact: Elastic AWS integration, cloudtrail data stream
      notes: >
        The integration normally owns the S3/SQS input itself; here Cribl
        reads the bucket instead and delivers to the Elastic Bulk destination,
        so the events must be tagged with the aws.cloudtrail route key
        (_dataId) for the integration's ingest pipeline to run.
    fields:
    - vendor: eventTime
      type: timestamp
      description: >-
        UTC date and time the request completed, from the host serving the
        service API endpoint
      ecs: '@timestamp'
      status: mapped
    - vendor: eventName
      type: string
      description: >-
        the requested action - the API operation name for that service, e.g.
        CreateUser or StopLogging
      ecs: event.action
      status: mapped
    - vendor: eventSource
      type: string
      description: the service the request was made to, e.g. iam.amazonaws.com or ec2.amazonaws.com
      ecs: event.provider
      status: mapped
    - vendor: eventID
      type: string
      description: GUID generated by CloudTrail that uniquely identifies this event record
      ecs: event.id
      status: mapped
    - vendor: eventType
      type: enum
      description: >-
        type of event that generated the record - AwsApiCall, AwsServiceEvent,
        AwsConsoleAction, AwsConsoleSignIn, AwsVpceEvents
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.event_type
      notes: >
        the closest ECS field, event.kind, holds a fixed vocabulary
        (event/alert/signal) that this value does not belong in; keep it
        custom and use it as the dataset discriminator
    - vendor: awsRegion
      type: string
      description: >-
        AWS Region the request was made to - us-gov-west-1 or us-gov-east-1
        for GovCloud accounts
      ecs: cloud.region
      status: mapped
    - vendor: sourceIPAddress
      type: string
      description: >-
        IP address the request was made from; for AWS services this is a DNS
        name, and for AWS-originated events it is 'AWS Internal/N'
      ecs: source.ip
      status: partial
      notes: >
        documented as a string, not an address - a straight copy into the
        ip-typed source.ip drops or errors on the DNS-name and 'AWS
        Internal/N' forms, which are common on service-initiated calls; needs
        a conditional split to source.address/source.domain
    - vendor: userAgent
      type: string
      description: >-
        agent through which the request was made - console, an AWS SDK, the
        AWS CLI, or a calling service's event source
      ecs: user_agent.original
      status: mapped
      notes: >-
        capped at 1 KB by CloudTrail and truncated beyond that, so long
        CLI/SDK strings are not byte-faithful
    - vendor: userIdentity.type
      type: enum
      description: >-
        type of identity that made the request - Root, IAMUser, AssumedRole,
        Role, FederatedUser, AWSAccount, AWSService, IdentityCenterUser,
        SAMLUser, WebIdentityUser, Unknown
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.user_identity.type
      notes: >-
        principal-class discriminator with no ECS equivalent; drives whether
        user.name is a human, a role session, or a service principal
    - vendor: userIdentity.userName
      type: string
      description: >-
        friendly name of the identity that made the call, interpreted
        according to userIdentity.type
      ecs: user.name
      status: partial
      notes: >
        absent for AssumedRole calls (the role session name lives in
        principalId instead) and set to the literal
        HIDDEN_DUE_TO_SECURITY_REASONS on console sign-in failures, which must
        be scrubbed rather than indexed as a username
    - vendor: userIdentity.principalId
      type: string
      description: >-
        unique identifier of the calling entity; for temporary credentials
        this appends the role session name after a colon
      ecs: user.id
      status: mapped
    - vendor: userIdentity.arn
      type: string
      description: >-
        ARN of the principal that made the call, in the aws-us-gov partition
        for GovCloud
      ecs: null
      status: partial
      custom: aws.cloudtrail.user_identity.arn
      notes: >
        ECS 9.4 has no ARN field; the trailing user-or-role segment is what
        feeds user.name for AssumedRole calls, so keep the full ARN custom and
        derive the name rather than mapping the ARN itself
    - vendor: userIdentity.accountId
      type: string
      description: account that owns the entity that granted permissions for the request
      ecs: null
      status: partial
      custom: aws.cloudtrail.user_identity.account_id
      notes: >
        deliberately not cloud.account.id - on cross-account access this is
        the caller's account while recipientAccountId is the account that
        received the event; collapsing the two misattributes cross-account
        activity
    - vendor: userIdentity.sessionContext.sessionIssuer.userName
      type: string
      description: >-
        name of the IAM role or user that issued the temporary credentials
        used for this call
      ecs: null
      status: partial
      custom: aws.cloudtrail.user_identity.session_context.session_issuer.user_name
      notes: >
        the real answer to "which role did this" for AssumedRole activity; ECS
        user.roles models role membership at event time rather than the
        session-issuing role, so this stays custom
    - vendor: userIdentity.sessionContext.attributes.mfaAuthenticated
      type: string
      description: >-
        'true' if the principal that obtained the temporary credentials also
        authenticated with MFA
      ecs: null
      status: partial
      custom: aws.cloudtrail.user_identity.session_context.mfa_authenticated
      transform: >-
        emitted as the string "true"/"false" and must be converted to boolean
        before it can be used in alert logic
      notes: no ECS field models MFA usage; a core CSOC signal that stays custom
    - vendor: errorCode
      type: string
      description: >-
        AWS service error returned for the request, e.g. AccessDenied,
        UnauthorizedOperation, VpceAccessDenied
      ecs: error.code
      status: mapped
      transform: >
        presence of errorCode (or errorMessage) is the only outcome indicator
        in the record - there is no status field - so event.outcome must be
        derived as failure when either is set and success otherwise
    - vendor: errorMessage
      type: string
      description: service-supplied description of the error, including authorization-failure text
      ecs: error.message
      status: mapped
      notes: >-
        capped at 1 KB; some services report errors inside responseElements
        instead of here, so outcome logic cannot rely on this field alone
    - vendor: readOnly
      type: boolean
      description: >-
        true when the operation is read-only (Describe/Get/List), false for
        mutating operations
      ecs: null
      status: partial
      custom: aws.cloudtrail.read_only
      transform: >-
        should drive ECS event.type (access for true, change for false) rather
        than being carried only as a raw boolean
    - vendor: recipientAccountId
      type: string
      description: >-
        account ID that received this event - the authoritative owning account
        for the record
      ecs: cloud.account.id
      status: mapped
    - vendor: requestParameters
      type: string
      description: >-
        free-form object holding the parameters sent with the request, shaped
        by the individual service API
      ecs: null
      status: partial
      custom: aws.cloudtrail.flattened.request_parameters
      notes: >
        up to 100 KB and omitted entirely when it exceeds that; keys vary per
        API so it cannot be statically mapped, but the IAM-relevant keys
        (userName, roleName, groupName, policyArn) are what user.target.name
        has to be derived from
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Do the two things the integration cannot do from a Cribl-fed stream:
          explode the gzipped Records[] array into one event per record, and
          stamp _dataId with the aws.cloudtrail route key so the stock ingest
          pipeline still fires. Keep the rest of the worker group a
          pass-through with _raw intact - CloudTrail is the account's audit
          record of last resort - and use Persistent Queue backpressure on the
          Elastic destination plus SQS message-age monitoring, since a stalled
          queue is the only symptom of collection loss on this route.
        elastic: >
          Let the AWS integration's cloudtrail pipeline parse, then layer a
          logs-aws.cloudtrail@custom pipeline that fixes the three documented
          gaps: route sourceIPAddress conditionally into source.ip versus
          source.address/source.domain (it carries DNS names and "AWS
          Internal/N" for AWS-originated calls, which fail ip-typed indexing),
          derive event.outcome from errorCode/errorMessage presence and
          event.type read/change from readOnly, and populate user.target.name
          from the requestParameters userName/roleName/ groupName keys so IAM
          events satisfy the iam alerting profile. Map the aws.cloudtrail.*
          custom fields as keyword in the index template and
          requestParameters/responseElements as flattened, and confirm
          cloud.account.id is fed from recipientAccountId rather than
          userIdentity.accountId so cross-account events attribute correctly.
        relay: >
          Low-side instances cross the guard: cross as a thin envelope
          (_dataId, @timestamp, host, _raw) and keep the integration as the
          parser - the record is already JSON, so there is no CEF conversion
          to do low-side. The content filter's real problem is
          requestParameters and responseElements: free-form, arbitrarily
          nested, up to 100 KB per field, with API-shaped keys no allow-list
          can enumerate. Flatten them to a single bounded string (or strip
          them to a size-capped subset) before the guard destination and
          validate the envelope with C.Schema(...).validate plus a low-side
          dead-letter route, so the custom NDJSON filter stays simple enough
          to certify.
      direct:
        parse_location: high
        cribl: >
          Do the two things the integration cannot do from a Cribl-fed stream:
          explode the gzipped Records[] array into one event per record, and
          stamp _dataId with the aws.cloudtrail route key so the stock ingest
          pipeline still fires. Keep the rest of the worker group a
          pass-through with _raw intact - CloudTrail is the account's audit
          record of last resort - and use Persistent Queue backpressure on the
          Elastic destination plus SQS message-age monitoring, since a stalled
          queue is the only symptom of collection loss on this route.
        elastic: >
          Let the AWS integration's cloudtrail pipeline parse, then layer a
          logs-aws.cloudtrail@custom pipeline that fixes the three documented
          gaps: route sourceIPAddress conditionally into source.ip versus
          source.address/source.domain (it carries DNS names and "AWS
          Internal/N" for AWS-originated calls, which fail ip-typed indexing),
          derive event.outcome from errorCode/errorMessage presence and
          event.type read/change from readOnly, and populate user.target.name
          from the requestParameters userName/roleName/ groupName keys so IAM
          events satisfy the iam alerting profile. Map the aws.cloudtrail.*
          custom fields as keyword in the index template and
          requestParameters/responseElements as flattened, and confirm
          cloud.account.id is fed from recipientAccountId rather than
          userIdentity.accountId so cross-account events attribute correctly.
  - format: eventbridge
    enable: >
      Any account or organization trail that is logging management events also
      delivers those events to the default EventBridge event bus in the same
      Region - there is no separate "send to EventBridge" switch on the trail;
      delivery is a property of the account once a trail is logging. Create an
      EventBridge rule on the default bus in each GovCloud Region
      (us-gov-west-1, us-gov-east-1) with the event pattern
      {"source":["aws.cloudtrail"],"detail-type":["AWS API Call via
      CloudTrail"]}, optionally narrowing on detail.eventSource /
      detail.eventName, and point the rule at a target the collector can drain
      - an SQS queue, a Kinesis Data Stream, or a Firehose delivery stream.
      Write (mutating) management events match a rule in the default ENABLED
      state; read-only management events (Describe/Get/List) are delivered
      only to rules created with state
      ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS, so a rule that must see
      read activity has to set that state explicitly.
    references:
    - >-
      https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
    - https://docs.aws.amazon.com/eventbridge/latest/ref/events-ref-cloudtrail.html
    - >-
      https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        custom EventBridge-unwrap pipeline feeding the Elastic AWS cloudtrail
        data stream
      notes: >
        The envelope's detail object is the same CloudTrail record the json
        feed carries, field-for-field, so the parse is a two-step: strip the
        EventBridge envelope and promote detail to the event root (or route
        detail as _raw), then hand the inner record to the stock Elastic AWS
        integration cloudtrail pipeline exactly as the S3 feed does. The stock
        integration does NOT understand the envelope, so the unwrap must
        happen upstream of the ingest pipeline. Because EventBridge delivers
        one event per message (never the Records[] array), the array-explode
        the S3 feed needs is not required here - but read-only-event delivery
        must be enabled on the rule or the feed silently omits
        Describe/Get/List activity that the S3 feed contains.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Treat EventBridge as a latency alternative to the S3 feed, not a
          second copy to merge: pick one authoritative transport per instance
          or you will double-count every management call. If EventBridge is
          chosen for its near-real-time delivery, drain the rule target
          (Kinesis or SQS) with a Cribl source, unwrap the envelope, and keep
          detail intact as _raw so the record stays the audit-of-last-resort
          artifact. Stamp _dataId with the aws.cloudtrail route key so the
          stock ingest pipeline fires, and back the Elastic destination with
          Persistent Queue - a stalled EventBridge target has the same silent
          collection-loss failure mode as a stalled SQS notification queue.
        elastic: >
          The same logs-aws.cloudtrail@custom pipeline the json feed uses
          applies unchanged once the envelope is stripped, because the inner
          record is identical: conditional sourceIPAddress split into
          source.ip vs source.address/source.domain, event.outcome derived
          from errorCode/errorMessage presence, event.type read/change from
          readOnly, and user.target.name lifted from the requestParameters
          userName/roleName/groupName keys. Keep the envelope's own account
          and region only as a sanity cross-check against detail's
          recipientAccountId and awsRegion; do not let the envelope override
          the authoritative in-record values.
        relay: >
          If the low side collects via EventBridge, what crosses the guard is
          the unwrapped inner record, never the EventBridge envelope - strip
          version/id/detail-type/source and the computed resources[] array
          low-side so the crossing shape matches the S3-fed NDJSON exactly and
          only one content-filter policy has to be certified. The unbounded,
          content-inspection-relevant payload is the same
          requestParameters/responseElements free-form nesting the json feed
          carries; flatten it to a bounded string or strip it to a size-capped
          subset before the guard destination, validate the envelope with
          C.Schema(...).validate, and route failures to a low-side dead-letter
          queue.
      direct:
        parse_location: high
        cribl: >
          For a high-side instance with no guard, the choice between
          EventBridge and the S3 feed is purely operational: EventBridge buys
          near-real-time delivery of individual events at the cost of a
          Kinesis/SQS target to manage and read-only-event rule state to get
          right, while the S3 feed is simpler and already deployed. If
          EventBridge is used, unwrap in Cribl and pass through with detail as
          _raw; there is no low-side shaping to apply, so the worker group
          stays a thin envelope-stripper in front of the Elastic destination.
        elastic: >
          Run the stock cloudtrail pipeline plus the
          logs-aws.cloudtrail@custom fixes on the unwrapped record -
          conditional sourceIPAddress split into source.ip vs
          source.address/source.domain, event.outcome from
          errorCode/errorMessage presence, event.type read/change from
          readOnly, and user.target.name lifted from the requestParameters
          userName/roleName/groupName keys - and confirm cloud.account.id is
          fed from the in-record recipientAccountId rather than the envelope
          account so cross-account events attribute to the receiving account.
    fields:
    - vendor: version
      type: string
      description: schema version of the EventBridge envelope, currently 0
      ecs: null
      status: unmapped
      custom: aws.eventbridge.version
    - vendor: id
      type: string
      description: UUID EventBridge assigns to the delivered event
      ecs: null
      status: unmapped
      custom: aws.eventbridge.event_id
      notes: >-
        distinct from the CloudTrail eventID inside detail; this is
        EventBridge's own delivery identifier and must not be used as
        event.id, which comes from detail.eventID
    - vendor: detail-type
      type: string
      description: >-
        'AWS API Call via CloudTrail' for management (and data) API events
        delivered from CloudTrail
      ecs: null
      status: unmapped
      custom: aws.eventbridge.detail_type
      notes: >-
        the envelope-level discriminator; management API events, read-only and
        write, share this value with data events, so it does not by itself
        separate the datasets - detail.eventSource/eventName and the
        ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS rule state do
    - vendor: source
      type: string
      description: >-
        originating service partition on the bus - aws.cloudtrail for
        CloudTrail-delivered management events
      ecs: null
      status: unmapped
      custom: aws.eventbridge.source
    - vendor: account
      type: string
      description: 12-digit account the event is associated with
      ecs: cloud.account.id
      status: partial
      notes: >-
        the envelope account equals the record's recipientAccountId; keep
        detail.recipientAccountId authoritative and use this only as a
        cross-check, since on cross-account access the in-record fields carry
        the caller/recipient distinction the envelope does not
    - vendor: time
      type: timestamp
      description: time EventBridge received the event
      ecs: event.created
      status: partial
      transform: >-
        this is the bus-delivery time, not the API completion time - map
        @timestamp from detail.eventTime and keep this only as event.created
        so delivery latency is measurable
    - vendor: region
      type: string
      description: Region the event originated in - us-gov-west-1 or us-gov-east-1
      ecs: cloud.region
      status: mapped
    - vendor: resources
      type: array
      description: >-
        ARNs EventBridge computed for the event; frequently empty for
        CloudTrail-delivered events
      ecs: null
      status: unmapped
      custom: aws.eventbridge.resources
      notes: >-
        an EventBridge-computed array, not the CloudTrail record's own
        resources[] block, which lives inside detail
    - vendor: detail
      type: object
      description: >-
        the complete CloudTrail management-event record, byte-identical to one
        Records[] element of the json feed
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.flattened.detail
      notes: >
        every json-format field (eventTime, eventName, eventSource,
        userIdentity.*, sourceIPAddress, errorCode, requestParameters,
        recipientAccountId, readOnly, ...) appears here unchanged; the four
        fields below are the representative ECS anchors the unwrap must
        preserve, and the full inventory is the json field list
    - vendor: detail.eventTime
      type: timestamp
      description: >-
        UTC time the API request completed - the authoritative event time
        inside the envelope
      ecs: '@timestamp'
      status: mapped
    - vendor: detail.eventName
      type: string
      description: the API operation name, e.g. CreateUser or StopLogging
      ecs: event.action
      status: mapped
    - vendor: detail.eventSource
      type: string
      description: the service the request was made to, e.g. iam.amazonaws.com
      ecs: event.provider
      status: mapped
    - vendor: detail.sourceIPAddress
      type: string
      description: IP address or AWS service DNS name the request came from
      ecs: source.ip
      status: partial
      notes: >-
        carries the same string-not-address and 'AWS Internal/N' forms as the
        json feed and needs the identical conditional split to
        source.address/source.domain
  - format: ocsf
    enable: >
      Enable Amazon Security Lake in the GovCloud Region(s) - it is available
      at securitylake.us-gov-west-1.amazonaws.com and
      securitylake.us-gov-east-1.amazonaws.com - and add "CloudTrail
      management events" as an ingested AWS log source (sourceName
      CLOUD_TRAIL_MGMT). Security Lake pulls management events directly from
      CloudTrail through its own duplicated stream (it does not read the
      trail's S3 bucket and does not change the existing trail), normalizes
      each record to the OCSF 1.1.0 API Activity class, and writes Parquet
      objects partitioned by time/region/account to the Security Lake managed
      S3 bucket. Create a subscriber with data-access (S3/SQS) so a collector
      can consume the objects: Security Lake writes an object to S3 and emits
      an SQS notification the subscriber drains. Collecting management events
      requires at least one multi-Region organization trail logging read and
      write management events.
    references:
    - >-
      https://docs.aws.amazon.com/security-lake/latest/userguide/cloudtrail-event-logs.html
    - >-
      https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-query-examples2.html
    - https://docs.aws.amazon.com/general/latest/gr/securitylake.html
    - >-
      https://github.com/ocsf/examples/tree/main/mappings/markdown/AWS/v1.1.0/CloudTrail/API%20Activity
    - https://www.elastic.co/docs/reference/integrations/amazon_security_lake
    parsing:
      mechanism: elastic-integration
      artifact: Elastic Amazon Security Lake integration (OCSF), S3/SQS input
      notes: >
        The Elastic Amazon Security Lake integration reads the OCSF Parquet
        objects from the subscriber bucket in S3-polling or S3-SQS mode and
        ships them through its own ingest pipeline - this is a different
        integration from the AWS cloudtrail data stream, and it expects OCSF
        field names (api.operation, actor.user.uid, src_endpoint.ip), not the
        native CloudTrail record. The reshape is lossy in one direction and
        richer in another: OCSF splits the native sourceIPAddress into
        src_endpoint.ip vs src_endpoint.domain for you, but collapses the
        arbitrary requestParameters/responseElements into api.request.data /
        api.response.data maps and drops anything without an OCSF home into a
        flat unmapped object. Management events land in the
        cloud_trail_mgmt_2_0 table.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          This path is worth adopting only where OCSF is already the house
          schema on the low side; otherwise it adds an OCSF-to-ECS translation
          on top of the reshape CloudTrail-to-OCSF already did. If used, drain
          the subscriber SQS with a Cribl S3 source, keep the Parquet-decoded
          OCSF record as _raw, and do not attempt to reconstruct the native
          record - carry the OCSF field names across and let Elastic's
          Security Lake integration own the OCSF-to-ECS mapping. Because
          Security Lake runs its own duplicated stream, reconcile counts
          against the S3 trail feed per (account, hour) so a divergence
          between the two AWS collection paths is visible rather than assumed
          equal.
        elastic: >
          Use the stock Amazon Security Lake integration rather than the AWS
          cloudtrail integration for this feed, then layer a custom pipeline
          that restores the CSOC-critical signals OCSF buries: derive
          event.outcome from status/status_id (Success/Failure) since OCSF
          carries no errorCode-presence rule, keep actor.session.is_mfa and
          actor.user.account.uid as typed aws.securitylake.* keywords for the
          MFA and cross-account alerting profiles, and map the flat unmapped
          object to a flattened field so per-API keys that OCSF did not model
          remain searchable. Confirm cloud.account.uid feeds cloud.account.id
          and that actor.user.account.uid (the caller account) is not
          collapsed into it.
        relay: >
          What crosses the guard is OCSF JSON decoded from Parquet, not the
          native record and not the Parquet container. The unbounded,
          content-inspection-relevant values are api.request.data,
          api.response.data and the unmapped catch-all object - all free-form
          maps of arbitrary API keys - so flatten and size-cap them low-side
          exactly as requestParameters/responseElements are capped on the
          native feed, hold the OCSF record to a declared nesting depth, and
          treat the crossing as at-most-once with per-(account, hour)
          reconciliation rather than acknowledgements.
      direct:
        parse_location: high
        cribl: >
          High side with no guard: drain the subscriber SQS with a Cribl S3
          source and pass the OCSF record through with minimal shaping, or
          skip Cribl entirely and let an Elastic Agent run the Security Lake
          integration's S3-SQS input directly. The one decision that matters
          is deduplication against any co-collected S3 trail feed for the same
          accounts - Security Lake is an independent duplicated stream, so key
          on metadata.uid (the native eventID) to avoid double-counting.
        elastic: >
          Use the stock Amazon Security Lake integration rather than the AWS
          cloudtrail integration, layering a custom pipeline that restores the
          CSOC-critical signals OCSF buries: event.outcome from
          status/status_id (Success/Failure), actor.session.is_mfa and
          actor.user.account.uid as typed aws.securitylake.* keywords, and the
          flat unmapped object mapped to a flattened field. Confirm
          cloud.account.uid feeds cloud.account.id and that
          actor.user.account.uid (the caller account) is not collapsed into
          it. Because there is no boundary, retain api.request.data and
          api.response.data for hunting rather than capping them, and treat
          this feed as complementary to - not a replacement for - the native
          cloudtrail feed, which preserves the raw
          requestParameters/responseElements shape the OCSF reshape flattens.
    fields:
    - vendor: time
      type: timestamp
      description: event time in epoch milliseconds, from the native eventTime
      ecs: '@timestamp'
      status: mapped
      notes: >-
        OCSF also carries time_dt as an ISO string and uses time_dt for
        S3/Iceberg partitioning
    - vendor: metadata.uid
      type: string
      description: unique event identifier, from the native eventID
      ecs: event.id
      status: mapped
    - vendor: metadata.product.name
      type: string
      description: 'constant ''CloudTrail'' identifying the producing product'
      ecs: observer.product
      status: mapped
    - vendor: class_uid
      type: integer
      description: OCSF class identifier - 6003 (API Activity) for CloudTrail management events
      ecs: null
      status: unmapped
      custom: aws.securitylake.class_uid
      notes: >-
        the OCSF-schema discriminator; distinct from ECS
        event.category/event.kind, which have their own closed vocabularies
        and must not be fed from this integer
    - vendor: activity_name
      type: string
      description: OCSF activity, derived from eventName (Create/Read/Update/Delete/...)
      ecs: null
      status: unmapped
      custom: aws.securitylake.activity_name
      notes: >-
        kept custom to avoid a second write into event.action, which is fed
        from api.operation below
    - vendor: api.operation
      type: string
      description: the API operation, from the native eventName
      ecs: event.action
      status: mapped
    - vendor: api.service.name
      type: string
      description: the service the request was made to, from the native eventSource
      ecs: event.provider
      status: mapped
    - vendor: api.request.data
      type: string
      description: the request parameters, from the native requestParameters
      ecs: null
      status: partial
      custom: aws.securitylake.api.request
      notes: >-
        OCSF collapses the arbitrary requestParameters object into this
        free-form map; the IAM-relevant keys (userName, roleName, groupName)
        that feed user.target.name have to be lifted from here just as on the
        native feed
    - vendor: api.response.error
      type: string
      description: service error code for the request, from the native errorCode
      ecs: error.code
      status: mapped
      transform: >-
        OCSF has no status field derived from error presence, so event.outcome
        must be derived from status/status_id below and cross-checked against
        this
    - vendor: api.response.message
      type: string
      description: service error description, from the native errorMessage
      ecs: error.message
      status: mapped
    - vendor: actor.user.uid
      type: string
      description: ARN of the calling principal, from userIdentity.arn
      ecs: null
      status: unmapped
      custom: aws.securitylake.actor.user_arn
      notes: >-
        ECS 9.4 has no ARN field; the trailing user-or-role segment is what
        feeds user.name for AssumedRole calls, as on the native feed
    - vendor: actor.user.uid_alt
      type: string
      description: unique principal identifier, from userIdentity.principalId
      ecs: user.id
      status: mapped
    - vendor: actor.user.name
      type: string
      description: friendly name of the calling identity, from userIdentity.userName
      ecs: user.name
      status: partial
      notes: >-
        carries the same AssumedRole-absent and HIDDEN_DUE_TO_SECURITY_REASONS
        caveats as the native userName and must be scrubbed the same way
    - vendor: actor.user.type
      type: string
      description: >-
        principal class, from userIdentity.type (IAMUser, AssumedRole, Root,
        AWSService, ...)
      ecs: null
      status: unmapped
      custom: aws.securitylake.actor.user_type
    - vendor: actor.user.account.uid
      type: string
      description: account that owns the calling identity, from userIdentity.accountId
      ecs: null
      status: partial
      custom: aws.securitylake.actor.account_uid
      notes: >-
        the caller account on cross-account access; deliberately not
        cloud.account.id, which is fed from cloud.account.uid (the receiving
        account) below
    - vendor: actor.session.is_mfa
      type: boolean
      description: >-
        whether the temporary credentials were obtained with MFA, from
        sessionContext.attributes.mfaAuthenticated
      ecs: null
      status: unmapped
      custom: aws.securitylake.actor.session.is_mfa
      notes: >-
        OCSF has already converted the native string 'true'/'false' to a
        boolean, so unlike the native feed no cast is needed; a core CSOC
        signal with no ECS home
    - vendor: src_endpoint.ip
      type: ip
      description: client IP, from sourceIPAddress when it is an address
      ecs: source.ip
      status: partial
      notes: >-
        OCSF splits the native string field for you - a DNS name or 'AWS
        Internal/N' goes to src_endpoint.domain instead of here, so this is
        safe to index as ip, but the domain form must be picked up from
        src_endpoint.domain
    - vendor: src_endpoint.domain
      type: string
      description: >-
        client hostname, from sourceIPAddress when it is a DNS name rather
        than an address
      ecs: source.domain
      status: mapped
    - vendor: http_request.user_agent
      type: string
      description: the requesting agent, from the native userAgent
      ecs: user_agent.original
      status: mapped
    - vendor: cloud.region
      type: string
      description: Region the request was made to, from awsRegion
      ecs: cloud.region
      status: mapped
    - vendor: cloud.provider
      type: string
      description: 'constant ''AWS'''
      ecs: cloud.provider
      status: mapped
    - vendor: cloud.account.uid
      type: string
      description: >-
        account that received the event, from recipientAccountId - the
        authoritative owning account
      ecs: cloud.account.id
      status: mapped
    - vendor: status_id
      type: integer
      description: >-
        OCSF status - 1 Success, 2 Failure - normalized from the presence of
        errorCode/errorMessage
      ecs: event.outcome
      status: partial
      transform: >-
        map status_id 1/2 (or the status string Success/Failure) to the ECS
        success/failure vocabulary; this is the OCSF equivalent of the native
        errorCode-presence outcome rule
    - vendor: unmapped
      type: string
      description: >-
        OCSF catch-all object holding native fields with no OCSF home (e.g.
        readOnly, eventType, vpcEndpointId)
      ecs: null
      status: unmapped
      custom: aws.securitylake.unmapped
      notes: >-
        map as flattened; readOnly lands here, so the event.type read/change
        derivation the native feed does from readOnly must reach into this
        object on the OCSF feed
- id: data-events
  name: Data events
  description: >
    Object-level and function-level activity recorded when data event
    selectors are enabled - S3 GetObject/PutObject/DeleteObject against
    selected buckets and Lambda Invoke against selected functions. Same S3
    delivery path and record envelope as management events, distinguished by
    eventCategory "Data". Volume is one to three orders of magnitude above
    management events and per-record forensic value is far lower, so this
    dataset is where selector scope and low-side shaping matter more than
    mapping depth.
  event_categories:
  - file
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same Cribl S3 source and SQS notification queue as the management
        event feed - data events land in the same trail bucket and are
        separated by eventCategory, not by transport.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-aws.cloudtrail
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same Cribl S3 source and SQS notification queue as the management
        event feed - data events land in the same trail bucket and are
        separated by eventCategory, not by transport.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-aws.cloudtrail
  formats:
  - format: json
    recommended: true
    recommended_because: >-
      the AWS integration reads CloudTrail directly; the OCSF route depends on
      standing up Amazon Security Lake in the GovCloud Regions first.
    parsing:
      mechanism: elastic-integration
      artifact: Elastic AWS integration, cloudtrail data stream
      notes: >-
        the cloudtrail data stream handles management and data events with one
        pipeline; there is no separate data-event integration
    fields:
    - vendor: eventTime
      type: timestamp
      description: UTC date and time the data-plane request completed
      ecs: '@timestamp'
      status: mapped
    - vendor: eventCategory
      type: enum
      description: >-
        event category - 'Data' for this dataset, 'Management' for
        control-plane events, 'NetworkActivity' for VPC endpoint events
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.event_category
      notes: >
        the discriminator that separates this dataset from management events
        in the shared data stream; distinct from ECS event.category, which is
        a closed ECS vocabulary and must not be fed from this value
    - vendor: eventName
      type: string
      description: data-plane action - GetObject, PutObject, DeleteObject, HeadObject, or Invoke
      ecs: event.action
      status: mapped
    - vendor: eventSource
      type: string
      description: >-
        service the data event was recorded for - s3.amazonaws.com or
        lambda.amazonaws.com
      ecs: event.provider
      status: mapped
    - vendor: awsRegion
      type: string
      description: GovCloud Region the data-plane request was made to
      ecs: cloud.region
      status: mapped
    - vendor: sourceIPAddress
      type: string
      description: IP address or AWS service DNS name the object or function request came from
      ecs: source.ip
      status: partial
      notes: >-
        same string-not-address problem as the management dataset;
        service-initiated object access reports a DNS name rather than an IP
    - vendor: requestParameters.bucketName
      type: string
      description: name of the S3 bucket the object-level request targeted
      ecs: null
      status: unmapped
      custom: aws.s3.bucket.name
      notes: >-
        ECS 9.4 has no bucket/container-name field; matches the field name the
        Elastic AWS integration already uses
    - vendor: requestParameters.key
      type: string
      description: S3 object key the request targeted
      ecs: file.path
      status: partial
      notes: >
        an object key is a bucket-relative name, not a filesystem path -
        mapped to file.path so the file alerting profile resolves, but
        file.name still has to be derived from the last slash-delimited
        segment
    - vendor: requestParameters.functionName
      type: string
      description: name or ARN of the Lambda function targeted by an Invoke data event
      ecs: faas.name
      status: mapped
    - vendor: resources.ARN
      type: string
      description: ARN of the resource the data event acted on, in the aws-us-gov partition
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.resources.arn
      notes: >-
        array element; no ECS ARN field exists, and this is the only
        fully-qualified resource identity on the record
    - vendor: resources.type
      type: string
      description: resource type identifier in AWS::service::datatype form, e.g. AWS::S3::Object
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.resources.type
    - vendor: additionalEventData.bytesTransferredIn
      type: long
      description: bytes sent from the caller to S3 for this object-level request
      ecs: source.bytes
      status: partial
      transform: >-
        emitted inside the variable additionalEventData object and must be
        extracted and typed as a number before use
    - vendor: additionalEventData.bytesTransferredOut
      type: long
      description: bytes returned from S3 to the caller for this object-level request
      ecs: destination.bytes
      status: partial
      transform: >-
        same extraction from additionalEventData; the exfiltration-volume
        signal for object reads
    - vendor: additionalEventData.AuthenticationMethod
      type: string
      description: >-
        how the object-level request was authenticated, e.g. AuthHeader or
        QueryString (presigned URL)
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.additional_eventdata.authentication_method
      notes: >-
        QueryString indicates a presigned-URL access, which has no other
        marker on the record
    - vendor: vpcEndpointId
      type: string
      description: >-
        VPC endpoint the request traversed, when the call came from a VPC
        rather than the public endpoint
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.vpc_endpoint_id
    - vendor: recipientAccountId
      type: string
      description: account ID that received the data event record
      ecs: cloud.account.id
      status: mapped
    - vendor: readOnly
      type: boolean
      description: true for object reads (GetObject, HeadObject), false for writes and deletes
      ecs: null
      status: partial
      custom: aws.cloudtrail.read_only
      transform: >-
        should drive event.type access versus change, and is the primary
        selector for low-side read-noise suppression
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          This is the volume problem on the CloudTrail route, so put the
          shaping here: after the Records[] explode, apply a bucket and
          function allow-list plus suppression of the high-cardinality read
          noise (readOnly GetObject/HeadObject from known service principals)
          before the Elastic destination, and drop _raw on this dataset first
          - it is the highest-volume, lowest-forensic-value of the three. Keep
          an unsuppressed count per (bucket, hour) as a metric so a
          suppression rule that is too broad is visible.
        elastic: >
          The stock cloudtrail pipeline parses these records; extend
          logs-aws.cloudtrail@custom to split requestParameters.key into
          file.name and file.path instead of leaving the S3 object key as an
          opaque string, and to convert the additionalEventData byte counters
          into typed source.bytes/destination.bytes so transfer-volume
          alerting works. Map aws.cloudtrail.resources.* and
          aws.s3.bucket.name as keyword in the index template, and set an ILM
          policy for this dataset separate from management events, since the
          retention case for object-level reads is much shorter.
        relay: >
          On the low-side crossing this dataset is the one to constrain
          hardest: S3 object keys are attacker-controlled free text up to 1024
          bytes and can carry unicode, path traversal sequences, and embedded
          newlines that will break a line-delimited NDJSON crossing. Normalize
          and length-cap the key low-side, hold the envelope to two levels of
          nesting with short ASCII keys, and treat the crossing as
          at-most-once with low-side/high-side reconciliation per (bucket,
          hour) rather than acknowledgements.
      direct:
        parse_location: high
        cribl: >
          This is the volume problem on the CloudTrail route, so put the
          shaping here: after the Records[] explode, apply a bucket and
          function allow-list plus suppression of the high-cardinality read
          noise (readOnly GetObject/HeadObject from known service principals)
          before the Elastic destination, and drop _raw on this dataset first
          - it is the highest-volume, lowest-forensic-value of the three. Keep
          an unsuppressed count per (bucket, hour) as a metric so a
          suppression rule that is too broad is visible.
        elastic: >
          The stock cloudtrail pipeline parses these records; extend
          logs-aws.cloudtrail@custom to split requestParameters.key into
          file.name and file.path instead of leaving the S3 object key as an
          opaque string, and to convert the additionalEventData byte counters
          into typed source.bytes/destination.bytes so transfer-volume
          alerting works. Map aws.cloudtrail.resources.* and
          aws.s3.bucket.name as keyword in the index template, and set an ILM
          policy for this dataset separate from management events, since the
          retention case for object-level reads is much shorter.
  - format: eventbridge
    enable: >
      A trail configured to log S3 object-level and/or Lambda data events also
      delivers those data events to the default EventBridge event bus. Create
      a rule on the default bus with the pattern {"source":["aws.s3"] or
      ["aws.lambda"],"detail-type":["AWS API Call via CloudTrail"]}, narrowing
      on detail.eventName (GetObject, PutObject, DeleteObject, Invoke) and,
      for object-level noise control, detail.requestParameters.bucketName.
      Data events are matched by a rule in the default ENABLED state - no
      special rule state is needed as for read-only management events - but
      the trail must be configured with the specific data event selectors
      (bucket/prefix or function scope) first, or nothing is delivered. Point
      the rule at an SQS queue, Kinesis Data Stream, or Firehose stream for
      the collector to drain.
    references:
    - >-
      https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
    - >-
      https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
    - >-
      https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        custom EventBridge-unwrap pipeline feeding the Elastic AWS cloudtrail
        data stream
      notes: >
        As with management events, detail is the native CloudTrail data-event
        record unchanged, so the unwrap-then-hand-to-integration flow is
        identical. The reason EventBridge is a poor fit for THIS dataset is
        volume: object-level events are one to three orders of magnitude
        heavier than management events, and an EventBridge rule fans every
        matching event into the target with no server-side sampling, so the
        bucket/function allow-listing and read-noise suppression the S3 feed
        does after the Records[] explode has to happen just as aggressively on
        the drained EventBridge stream, only now per-event rather than per-S3-
        object.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          If EventBridge is used for object-level events, put the volume
          controls on the drained stream before anything else: bucket and
          function allow-list on detail.requestParameters.bucketName /
          functionName, suppress readOnly GetObject/HeadObject from known
          service principals, and drop detail as _raw last since this is the
          highest-volume lowest-forensic-value feed. Prefer scoping the trail
          data-event selectors tightly over relying on the EventBridge rule
          pattern alone, because a too-broad selector floods the rule target
          and the target's own throughput becomes the collection bottleneck.
          Keep an unsuppressed count per (bucket, hour) as a metric.
        elastic: >
          Once unwrapped, the same logs-aws.cloudtrail@custom extensions the
          S3-fed data-event feed uses apply: split
          detail.requestParameters.key into file.name and file.path, and
          convert the detail.additionalEventData byte counters into typed
          source.bytes/destination.bytes. Set an ILM policy for this dataset
          separate from management events, since object-level reads have a
          much shorter retention case.
        relay: >
          The crossing is the unwrapped native data-event record, and the same
          hard constraint applies as on the S3 feed: S3 object keys are
          attacker-controlled free text up to 1024 bytes with unicode, path
          traversal, and embedded newlines that break a line-delimited NDJSON
          crossing. Normalize and length-cap the key low-side, strip the
          EventBridge envelope so only the native record crosses, hold the
          envelope to two levels of nesting with short ASCII keys, and treat
          the crossing as at-most-once with per-(bucket, hour) reconciliation.
      direct:
        parse_location: high
        cribl: >
          High side with no guard: the trade is the same as for management
          events but the volume penalty is larger, so EventBridge is only
          worth it here if near-real-time object-level alerting (e.g.
          immediate DeleteObject on a sensitive bucket) is a requirement the
          S3 feed's delivery latency cannot meet. If adopted, do the
          allow-list and read-noise suppression in Cribl before the Elastic
          destination and drop _raw first.
        elastic: >
          Split detail.requestParameters.key into file.name and file.path and
          convert the detail.additionalEventData byte counters into typed
          source.bytes/destination.bytes; keep aws.s3.bucket.name and
          aws.cloudtrail.resources.* as keyword in the index template so the
          object-level aggregations do not depend on dynamic mapping.
    fields:
    - vendor: detail-type
      type: string
      description: >-
        'AWS API Call via CloudTrail' - data events share this detail-type
        with management events
      ecs: null
      status: unmapped
      custom: aws.eventbridge.detail_type
      notes: >-
        data events are separated from management events by detail.eventSource
        (s3.amazonaws.com / lambda.amazonaws.com) and detail.eventCategory
        'Data', not by the envelope detail-type
    - vendor: source
      type: string
      description: aws.s3 or aws.lambda for data events delivered from CloudTrail
      ecs: null
      status: unmapped
      custom: aws.eventbridge.source
    - vendor: account
      type: string
      description: 12-digit account the data event is associated with
      ecs: cloud.account.id
      status: partial
      notes: cross-check only; detail.recipientAccountId is authoritative
    - vendor: region
      type: string
      description: GovCloud Region the data-plane request was made to
      ecs: cloud.region
      status: mapped
    - vendor: detail
      type: object
      description: >-
        the complete CloudTrail data-event record, byte-identical to one
        Records[] element of the json feed
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.flattened.detail
      notes: >-
        the full json data-event inventory (eventCategory,
        requestParameters.bucketName/key, resources[], additionalEventData
        byte counters, readOnly) appears here unchanged; the fields below are
        the representative anchors the unwrap must preserve
    - vendor: detail.eventTime
      type: timestamp
      description: UTC time the data-plane request completed
      ecs: '@timestamp'
      status: mapped
    - vendor: detail.eventName
      type: string
      description: data-plane action - GetObject, PutObject, DeleteObject, HeadObject, or Invoke
      ecs: event.action
      status: mapped
    - vendor: detail.eventSource
      type: string
      description: >-
        service the data event was recorded for - s3.amazonaws.com or
        lambda.amazonaws.com
      ecs: event.provider
      status: mapped
    - vendor: detail.requestParameters.key
      type: string
      description: S3 object key the request targeted
      ecs: file.path
      status: partial
      notes: >-
        same bucket-relative-name-not-a-path caveat as the json feed;
        file.name is derived from the last slash-delimited segment
    - vendor: detail.requestParameters.functionName
      type: string
      description: name or ARN of the Lambda function targeted by an Invoke data event
      ecs: faas.name
      status: mapped
  - format: ocsf
    enable: >
      With Amazon Security Lake enabled in the GovCloud Region(s), add "S3
      data events" (sourceName S3_DATA) and/or "Lambda data events"
      (sourceName LAMBDA_EXECUTION) as ingested AWS log sources - these are
      separate Security Lake sources from CloudTrail management events, each
      with its own OCSF table. Security Lake pulls the data events directly
      from CloudTrail's duplicated stream, normalizes them to the OCSF 1.1.0
      API Activity class, and writes Parquet to the subscriber bucket; S3 data
      events land in the s3_data_2_0 table and Lambda data events in the
      lambda_execution_2_0 table. As with management events the underlying
      trail must be logging the corresponding data event selectors.
    references:
    - >-
      https://docs.aws.amazon.com/security-lake/latest/userguide/cloudtrail-event-logs.html
    - >-
      https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-query-examples2.html
    - >-
      https://github.com/ocsf/examples/tree/main/mappings/markdown/AWS/v1.1.0/CloudTrail/API%20Activity
    - https://www.elastic.co/docs/reference/integrations/amazon_security_lake
    parsing:
      mechanism: elastic-integration
      artifact: Elastic Amazon Security Lake integration (OCSF), S3/SQS input
      notes: >
        Same OCSF API Activity reshape and same Elastic Security Lake
        integration as management events, but for object-level activity the
        OCSF flattening bites harder: the S3 bucket/key and the byte counters
        that the native feed carries as first-class requestParameters/
        additionalEventData fields land inside api.request.data and the
        unmapped object, so the file-path split and transfer-volume typing
        have to reach into those maps rather than reading named fields. Volume
        is the same order-of-magnitude problem as on every data-event
        transport - scope the Security Lake source and the underlying trail
        selectors tightly.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Only adopt where OCSF is the low-side house schema. Drain the
          subscriber SQS, keep the OCSF record as _raw, and apply the same
          bucket/function allow-list and readOnly read-noise suppression the
          native data-event feed uses - readOnly is inside the OCSF unmapped
          object here, so the suppression predicate reads
          unmapped.readOnly/activity_name rather than a top-level field.
          Reconcile per (bucket, hour) against any co-collected native feed.
        elastic: >
          Use the Amazon Security Lake integration and extend it to lift the
          S3 object key out of api.request.data into file.name/file.path and
          the byte counters out of the unmapped object into
          source.bytes/destination.bytes. Map aws.securitylake.* and the S3
          bucket name as keyword, and set this dataset's ILM separate from
          management events.
        relay: >
          The crossing is OCSF JSON decoded from Parquet. The object key -
          attacker-controlled free text up to 1024 bytes - now lives inside
          api.request.data rather than a named field, so normalize and
          length-cap it there low-side, flatten and size-cap the unmapped
          catch-all, and treat the crossing as at-most-once with per-(bucket,
          hour) reconciliation.
      direct:
        parse_location: high
        cribl: >
          High side with no guard: run the Security Lake integration's S3-SQS
          input directly or drain via Cribl with light shaping, and dedupe
          against any co-collected native data-event feed on metadata.uid.
        elastic: >
          Use the Amazon Security Lake integration and extend it to lift the
          S3 object key out of api.request.data into file.name/file.path and
          the byte counters out of the unmapped object into
          source.bytes/destination.bytes, mapping aws.securitylake.* and the
          S3 bucket name as keyword. Because there is no boundary, retain
          api.request.data for hunting rather than capping it, and treat this
          feed as complementary to the native feed, which preserves the named
          requestParameters.key/bucketName the OCSF reshape buries.
    fields:
    - vendor: time
      type: timestamp
      description: data-event time in epoch milliseconds, from eventTime
      ecs: '@timestamp'
      status: mapped
    - vendor: metadata.uid
      type: string
      description: unique event identifier, from eventID
      ecs: event.id
      status: mapped
    - vendor: class_uid
      type: integer
      description: OCSF class - 6003 (API Activity) for data events too
      ecs: null
      status: unmapped
      custom: aws.securitylake.class_uid
    - vendor: api.operation
      type: string
      description: >-
        the data-plane action, from eventName - GetObject, PutObject,
        DeleteObject, Invoke
      ecs: event.action
      status: mapped
    - vendor: api.service.name
      type: string
      description: >-
        service the data event was recorded for, from eventSource -
        s3.amazonaws.com or lambda.amazonaws.com
      ecs: event.provider
      status: mapped
    - vendor: api.request.data
      type: string
      description: >-
        request parameters, from the native requestParameters - carries the S3
        bucketName and object key for object-level events
      ecs: null
      status: partial
      custom: aws.securitylake.api.request
      notes: >-
        the object key and bucket name are inside this map on the OCSF feed
        rather than named fields; file.name/file.path must be lifted from
        here, and it is the free-text field to length-cap before any guard
        crossing
    - vendor: actor.user.uid
      type: string
      description: ARN of the calling principal, from userIdentity.arn
      ecs: null
      status: unmapped
      custom: aws.securitylake.actor.user_arn
    - vendor: actor.user.uid_alt
      type: string
      description: unique principal identifier, from userIdentity.principalId
      ecs: user.id
      status: mapped
    - vendor: actor.user.name
      type: string
      description: friendly name of the calling identity, from userIdentity.userName
      ecs: user.name
      status: partial
      notes: >-
        for service-initiated object access this is frequently a service
        principal rather than a human, as on the native feed
    - vendor: src_endpoint.ip
      type: ip
      description: client IP, from sourceIPAddress when it is an address
      ecs: source.ip
      status: partial
      notes: >-
        service-initiated object access reports a DNS name that OCSF routes to
        src_endpoint.domain instead
    - vendor: src_endpoint.domain
      type: string
      description: client hostname, from sourceIPAddress when it is a DNS name
      ecs: source.domain
      status: mapped
    - vendor: cloud.region
      type: string
      description: GovCloud Region the data-plane request was made to, from awsRegion
      ecs: cloud.region
      status: mapped
    - vendor: cloud.provider
      type: string
      description: 'constant ''AWS'''
      ecs: cloud.provider
      status: mapped
    - vendor: cloud.account.uid
      type: string
      description: account that received the data event, from recipientAccountId
      ecs: cloud.account.id
      status: mapped
    - vendor: status_id
      type: integer
      description: OCSF status - 1 Success, 2 Failure
      ecs: event.outcome
      status: partial
      transform: map 1/2 (or Success/Failure) to the ECS success/failure vocabulary
    - vendor: unmapped
      type: string
      description: >-
        OCSF catch-all holding native fields with no OCSF home - readOnly, the
        additionalEventData byte counters (bytesTransferredIn/Out),
        AuthenticationMethod, vpcEndpointId, resources[]
      ecs: null
      status: unmapped
      custom: aws.securitylake.unmapped
      notes: >
        map as flattened; the transfer-volume signal (bytesTransferredIn/Out)
        and the read/write discriminator (readOnly) that the native feed
        exposes as named fields are inside this object on the OCSF feed, so
        the source.bytes/destination.bytes typing and the low-side read-noise
        suppression must reach into unmapped rather than reading top-level
        fields
- id: console-signin
  name: Console sign-in events
  description: >
    thin starter - AWS Management Console authentication activity (eventSource
    signin.amazonaws.com, eventType AwsConsoleSignIn). These arrive in the
    same trail objects as the rest of the management events but carry a
    different field shape: the outcome lives in responseElements.ConsoleLogin
    and the MFA and target-console details live in additionalEventData. Broken
    out because it is the only CloudTrail authentication surface a CSOC alerts
    on directly, and because in GovCloud the sign-in events for a GovCloud
    account are recorded in the GovCloud partition only.
  event_categories:
  - authentication
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same Cribl S3 source and SQS notification queue as the management
        event feed.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-aws.cloudtrail
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same Cribl S3 source and SQS notification queue as the management
        event feed.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-aws.cloudtrail
  formats:
  - format: json
    parsing:
      mechanism: elastic-integration
      artifact: Elastic AWS integration, cloudtrail data stream
    fields:
    - vendor: eventTime
      type: timestamp
      description: UTC date and time of the console sign-in attempt
      ecs: '@timestamp'
      status: mapped
    - vendor: eventName
      type: string
      description: sign-in action - ConsoleLogin, CheckMfa, GetSigninToken, SwitchRole, or ExitRole
      ecs: event.action
      status: mapped
    - vendor: eventSource
      type: string
      description: always signin.amazonaws.com for console authentication events
      ecs: event.provider
      status: mapped
    - vendor: responseElements.ConsoleLogin
      type: enum
      description: result of the sign-in attempt - Success or Failure
      ecs: event.outcome
      status: mapped
      transform: >
        Success/Failure lowercased to the ECS success/failure vocabulary;
        this, not errorCode presence, is the authoritative outcome for sign-in
        events
      notes: >
        the responseElements key is named after the action, so CheckMfa and
        GetSigninToken carry their result under responseElements.CheckMfa /
        responseElements.GetSigninToken instead - outcome derivation has to
        read the key matching eventName, not a fixed ConsoleLogin path
    - vendor: additionalEventData.MFAUsed
      type: string
      description: '''Yes'' when the sign-in was completed with a multi-factor authentication device'
      ecs: null
      status: partial
      custom: aws.cloudtrail.console_login.additional_eventdata.mfa_used
      transform: Yes/No string that must be converted to boolean; no ECS field models MFA usage
    - vendor: additionalEventData.LoginTo
      type: string
      description: console URL the user was signing in to
      ecs: url.original
      status: partial
      notes: >-
        a console destination URL rather than a requested resource URL; useful
        for spotting sign-ins targeting unusual consoles, but it is not
        web-traffic telemetry
    - vendor: additionalEventData.MobileVersion
      type: string
      description: '''Yes'' when the sign-in came from the AWS Console mobile app'
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.console_login.additional_eventdata.mobile_version
    - vendor: userIdentity.userName
      type: string
      description: >-
        name of the account or IAM user signing in; the account alias when
        userIdentity.type is Root
      ecs: user.name
      status: partial
      notes: >
        set to the literal HIDDEN_DUE_TO_SECURITY_REASONS when the sign-in
        failed because of a bad username, since the typed value may be a
        password or other secret - scrub rather than index
    - vendor: userIdentity.type
      type: enum
      description: identity class signing in - Root, IAMUser, AssumedRole, or IdentityCenterUser
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.user_identity.type
      notes: >-
        Root sign-ins are the highest-priority alert on this dataset and are
        only distinguishable by this value
    - vendor: sourceIPAddress
      type: string
      description: IP address the sign-in attempt originated from
      ecs: source.ip
      status: partial
      notes: >-
        same string-not-address caveat as the other datasets, though console
        sign-ins almost always carry a real client IP
    - vendor: userAgent
      type: string
      description: browser or client user agent string for the sign-in attempt
      ecs: user_agent.original
      status: mapped
    - vendor: errorMessage
      type: string
      description: 'failure reason for an unsuccessful sign-in, typically ''Failed authentication'''
      ecs: error.message
      status: mapped
    - vendor: recipientAccountId
      type: string
      description: GovCloud account ID the sign-in was made against
      ecs: cloud.account.id
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Lowest volume and highest value of the three datasets, so make it
          the last place _raw is ever dropped and give it its own route with
          Persistent Queue backpressure ahead of the bulkier data-event
          traffic. The only low-side work worth doing is scrubbing the
          HIDDEN_DUE_TO_SECURITY_REASONS username sentinel, which can contain
          a password a user typed into the wrong field, before it is persisted
          anywhere downstream.
        elastic: >
          Extend logs-aws.cloudtrail@custom so event.outcome comes from
          responseElements.ConsoleLogin (Success/Failure) rather than the
          errorCode-presence rule used for API events, convert the
          additionalEventData MFAUsed and MobileVersion Yes/No strings to
          booleans, reading the responseElements key that matches eventName
          (ConsoleLogin, CheckMfa, GetSigninToken) rather than a fixed path so
          failed-sign-in alerting has one outcome field to count on. Map the
          aws.cloudtrail.console_login.* custom fields as keyword and drop the
          sentinel username at ingest so failed sign-ins do not inflate
          user.name cardinality.
      direct:
        parse_location: high
        cribl: >
          Lowest volume and highest value of the three datasets, so make it
          the last place _raw is ever dropped and give it its own route with
          Persistent Queue backpressure ahead of the bulkier data-event
          traffic. Scrub the HIDDEN_DUE_TO_SECURITY_REASONS username sentinel,
          which can contain a password a user typed into the wrong field,
          before it is persisted anywhere downstream.
        elastic: >
          Extend logs-aws.cloudtrail@custom so event.outcome comes from
          responseElements.ConsoleLogin (Success/Failure) rather than the
          errorCode-presence rule used for API events, convert the
          additionalEventData MFAUsed and MobileVersion Yes/No strings to
          booleans, reading the responseElements key that matches eventName
          (ConsoleLogin, CheckMfa, GetSigninToken) rather than a fixed path so
          failed-sign-in alerting has one outcome field to count on. Map the
          aws.cloudtrail.console_login.* custom fields as keyword and drop the
          sentinel username at ingest so failed sign-ins do not inflate
          user.name cardinality.
  - format: eventbridge
    enable: >
      Console authentication events are delivered to the default EventBridge
      event bus by any trail that is logging management events - no separate
      switch. Create a rule with the pattern
      {"source":["aws.signin"],"detail-type":["AWS Console Sign In via
      CloudTrail"]} (the sign-in service also emits ConsoleLogin under the
      "AWS API Call via CloudTrail" detail-type with detail.eventSource
      signin.amazonaws.com, so a robust rule matches source aws.signin rather
      than a single detail-type), and target an SQS queue or Kinesis stream.
      In GovCloud the sign-in events for a GovCloud account are recorded in
      the GovCloud partition only, so the rule must exist in the GovCloud
      Region.
    references:
    - >-
      https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
    - https://docs.aws.amazon.com/eventbridge/latest/ref/events-ref-signin.html
    - >-
      https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        custom EventBridge-unwrap pipeline feeding the Elastic AWS cloudtrail
        data stream
      notes: >
        detail is the native console sign-in record unchanged - the outcome in
        responseElements.ConsoleLogin, the MFA and target-console fields in
        additionalEventData, the sentinel username on failed sign-ins - so the
        unwrap-then-integration flow and every sign-in-specific parsing caveat
        of the json feed carry over verbatim. EventBridge's advantage here is
        real: this is the lowest-volume highest-value dataset, and
        near-real-time delivery of a Root sign-in or a burst of failed
        sign-ins is worth more on this feed than on the other two.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Give the drained sign-in stream its own route with Persistent Queue
          backpressure ahead of any bulkier traffic, and scrub the
          HIDDEN_DUE_TO_SECURITY_REASONS username sentinel low-side before it
          is persisted anywhere - on a failed sign-in that field can contain a
          password a user typed into the wrong box. Strip the EventBridge
          envelope so only the native record crosses; there is otherwise no
          shaping to do on this low-volume feed.
        elastic: >
          Once unwrapped, apply the sign-in-specific
          logs-aws.cloudtrail@custom extensions: event.outcome from the
          responseElements key that matches eventName
          (ConsoleLogin/CheckMfa/GetSigninToken) rather than the
          errorCode-presence rule, additionalEventData MFAUsed/MobileVersion
          Yes/No strings to booleans, and the sentinel username dropped at
          ingest so failed sign-ins do not inflate user.name cardinality.
        relay: >
          The crossing is the unwrapped native sign-in record. It is small and
          bounded, so the crossing discipline is light - strip the envelope,
          scrub the sentinel username low-side (do not let a possible
          plaintext secret cross), and validate the envelope against a schema
          with a dead-letter route. Reconcile per (account, hour) against the
          S3 feed.
      direct:
        parse_location: high
        cribl: >
          High side with no guard: EventBridge is a good fit for this dataset
          specifically because its near-real-time delivery serves Root-sign-in
          and failed-sign-in alerting better than the S3 feed's latency.
          Unwrap in Cribl, scrub the sentinel username, and pass through.
        elastic: >
          Apply the sign-in-specific logs-aws.cloudtrail@custom extensions
          once unwrapped: event.outcome from the responseElements key that
          matches eventName (ConsoleLogin/CheckMfa/GetSigninToken) rather than
          the errorCode-presence rule, and the additionalEventData
          MFAUsed/MobileVersion Yes/No strings converted to booleans. Map the
          aws.cloudtrail.console_login.* custom fields as keyword and drop the
          sentinel username at ingest.
    fields:
    - vendor: detail-type
      type: string
      description: '''AWS Console Sign In via CloudTrail'' for console authentication events'
      ecs: null
      status: unmapped
      custom: aws.eventbridge.detail_type
      notes: >-
        the sign-in service can also deliver ConsoleLogin under 'AWS API Call
        via CloudTrail'; match on source aws.signin to catch both
    - vendor: source
      type: string
      description: aws.signin for console authentication events
      ecs: null
      status: unmapped
      custom: aws.eventbridge.source
    - vendor: region
      type: string
      description: GovCloud Region the sign-in was recorded in
      ecs: cloud.region
      status: mapped
    - vendor: detail
      type: object
      description: the complete console sign-in record, byte-identical to the json feed
      ecs: null
      status: unmapped
      custom: aws.cloudtrail.flattened.detail
      notes: >-
        the full json sign-in inventory (responseElements.ConsoleLogin,
        additionalEventData.MFAUsed/LoginTo/MobileVersion,
        userIdentity.type/userName) appears here unchanged; the anchors below
        are what the unwrap must preserve
    - vendor: detail.eventTime
      type: timestamp
      description: UTC time of the console sign-in attempt
      ecs: '@timestamp'
      status: mapped
    - vendor: detail.eventName
      type: string
      description: sign-in action - ConsoleLogin, CheckMfa, GetSigninToken, SwitchRole, ExitRole
      ecs: event.action
      status: mapped
    - vendor: detail.responseElements.ConsoleLogin
      type: string
      description: result of the sign-in attempt - Success or Failure
      ecs: event.outcome
      status: partial
      transform: >-
        lowercase Success/Failure to the ECS success/failure vocabulary; the
        authoritative outcome for sign-in events, read from the
        responseElements key matching eventName
    - vendor: detail.additionalEventData.MFAUsed
      type: string
      description: '''Yes'' when the sign-in completed with MFA'
      ecs: null
      status: partial
      custom: aws.cloudtrail.console_login.additional_eventdata.mfa_used
      transform: Yes/No string converted to boolean; no ECS field models MFA usage
    - vendor: detail.userIdentity.userName
      type: string
      description: >-
        name of the account or IAM user signing in; the account alias when
        userIdentity.type is Root
      ecs: user.name
      status: partial
      notes: >-
        set to HIDDEN_DUE_TO_SECURITY_REASONS on a bad-username failure and
        must be scrubbed rather than indexed, exactly as on the json feed
  - format: ocsf
    enable: >
      Console sign-in events are CloudTrail management events (eventSource
      signin.amazonaws.com), so they are ingested by the same Security Lake
      "CloudTrail management events" source (sourceName CLOUD_TRAIL_MGMT) and
      land in the cloud_trail_mgmt_2_0 table - but Security Lake maps them to
      the OCSF 1.1.0 Authentication class (class_uid 3002) rather than API
      Activity, because they are authentication rather than a service API
      call. No additional source configuration beyond enabling CloudTrail
      management events in Security Lake; the underlying trail must be logging
      management events in the GovCloud Region.
    references:
    - >-
      https://docs.aws.amazon.com/security-lake/latest/userguide/cloudtrail-event-logs.html
    - >-
      https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-query-examples2.html
    - >-
      https://github.com/ocsf/examples/blob/main/mappings/markdown/AWS/v1.1.0/CloudTrail/Authentication/README.md
    - https://www.elastic.co/docs/reference/integrations/amazon_security_lake
    parsing:
      mechanism: elastic-integration
      artifact: Elastic Amazon Security Lake integration (OCSF), S3/SQS input
      notes: >
        The OCSF Authentication reshape is where this feed differs most from
        the native sign-in record: the outcome is carried as OCSF status
        (derived from responseElements.ConsoleLogin), MFA as is_mfa (from
        additionalEventData.MFAUsed), and the console-target and mobile-app
        details that the native feed exposes as additionalEventData.LoginTo /
        MobileVersion fall into the OCSF unmapped object. The high-value Root
        sign-in discriminator lives in actor.user.type, and the sentinel
        username on a failed sign-in still appears in actor.user.name and
        still must be scrubbed.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Only where OCSF is the low-side house schema. Drain the subscriber
          SQS, and scrub the HIDDEN_DUE_TO_SECURITY_REASONS sentinel out of
          actor.user.name low-side before persistence just as on the native
          feed. Reconcile per (account, hour) against any co-collected native
          sign-in feed on metadata.uid, since Security Lake is an independent
          duplicated stream.
        elastic: >
          Use the Amazon Security Lake integration and derive event.outcome
          from the OCSF status/status_id (which Security Lake has already
          resolved from responseElements.ConsoleLogin), keep
          aws.securitylake.is_mfa and actor.user.type as typed keywords for
          the MFA-gap and Root-sign-in alerting profiles, and map the unmapped
          object as flattened so LoginTo/MobileVersion remain searchable. Drop
          the sentinel username at ingest.
        relay: >
          The crossing is a small, bounded OCSF Authentication record, so the
          discipline is light: scrub the sentinel username low-side, flatten
          and cap the unmapped catch-all, validate against a schema with a
          dead-letter route, and reconcile per (account, hour).
      direct:
        parse_location: high
        cribl: >
          High side with no guard: run the Security Lake integration's S3-SQS
          input directly or drain via Cribl, scrub the sentinel username, and
          dedupe against any native sign-in feed on metadata.uid.
        elastic: >
          Use the Amazon Security Lake integration, derive event.outcome from
          the OCSF status/status_id (already resolved from
          responseElements.ConsoleLogin), keep aws.securitylake.is_mfa and
          actor.user.type as typed keywords for the MFA-gap and Root-sign-in
          alerting profiles, and map the unmapped object as flattened. Drop
          the sentinel username at ingest, and treat this feed as
          complementary to the native sign-in feed, which still exposes
          LoginTo and the per-action responseElements keys the OCSF reshape
          pushes into unmapped.
    fields:
    - vendor: time
      type: timestamp
      description: sign-in time in epoch milliseconds, from eventTime
      ecs: '@timestamp'
      status: mapped
    - vendor: metadata.uid
      type: string
      description: unique event identifier, from eventID
      ecs: event.id
      status: mapped
    - vendor: class_uid
      type: integer
      description: OCSF class - 3002 (Authentication) for console sign-in events
      ecs: null
      status: unmapped
      custom: aws.securitylake.class_uid
      notes: >-
        the value that separates sign-in events (Authentication) from the API
        Activity class the rest of the management events map to in the same
        cloud_trail_mgmt_2_0 table
    - vendor: activity_name
      type: string
      description: OCSF authentication activity, derived from eventName (Logon, etc.)
      ecs: event.action
      status: mapped
    - vendor: actor.user.name
      type: string
      description: name of the identity signing in, from userIdentity.userName
      ecs: user.name
      status: partial
      notes: >-
        set to HIDDEN_DUE_TO_SECURITY_REASONS on a bad-username failure and
        must be scrubbed rather than indexed, as on the native feed
    - vendor: actor.user.uid
      type: string
      description: ARN of the identity signing in, from userIdentity.arn
      ecs: null
      status: unmapped
      custom: aws.securitylake.actor.user_arn
    - vendor: actor.user.type
      type: string
      description: >-
        identity class signing in, from userIdentity.type - Root, IAMUser,
        AssumedRole, IdentityCenterUser
      ecs: null
      status: unmapped
      custom: aws.securitylake.actor.user_type
      notes: >-
        Root sign-ins are the highest-priority alert on this dataset and are
        only distinguishable by this value, as on the native feed
    - vendor: actor.user.account.uid
      type: string
      description: account the signing-in identity belongs to, from userIdentity.accountId
      ecs: null
      status: unmapped
      custom: aws.securitylake.actor.account_uid
    - vendor: src_endpoint.ip
      type: ip
      description: client IP of the sign-in attempt, from sourceIPAddress
      ecs: source.ip
      status: mapped
      notes: >-
        console sign-ins almost always carry a real client IP, so the
        string-not-address caveat rarely bites here and OCSF indexes it as ip
    - vendor: http_request.user_agent
      type: string
      description: browser or client user agent for the sign-in, from userAgent
      ecs: user_agent.original
      status: mapped
    - vendor: status_id
      type: integer
      description: OCSF status - 1 Success, 2 Failure - resolved from responseElements.ConsoleLogin
      ecs: event.outcome
      status: partial
      transform: >-
        map 1/2 (or the status string) to the ECS success/failure vocabulary;
        this is the OCSF-resolved equivalent of the native
        responseElements.ConsoleLogin outcome
    - vendor: is_mfa
      type: boolean
      description: whether the sign-in completed with MFA, from additionalEventData.MFAUsed
      ecs: null
      status: unmapped
      custom: aws.securitylake.is_mfa
      notes: >-
        OCSF has already converted the native Yes/No string to a boolean; a
        core CSOC signal with no ECS home
    - vendor: cloud.region
