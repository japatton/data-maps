id: zos-acf2
name: z/OS ACF2/Top Secret
vendor: Broadcom
versions: ACF2 for z/OS 16.0, 17.0; Top Secret for z/OS 16.0
draft: true
references:
- >-
  https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-acf2-for-z-os/16-0/reporting/acfrptpw-invalid-password-authority-log.html
- >-
  https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-acf2-for-z-os/16-0/reporting/acfrptrv-resource-event-log.html
- >-
  https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-acf2-for-z-os/16-0/reporting/acfrptds-data-set-program-event-log.html
- >-
  https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-acf2-for-z-os/17-0/reporting/acfrptll-logonid-modification-log.html
- >-
  https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-acf2-for-z-os/16-0/reporting/acfrptrl-rule-id-modification-log.html
- >-
  https://knowledge.broadcom.com/external/article/195450/acf2-smf-record-numbers-for-logging-or-d.html
- >-
  https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-top-secret-for-z-os/16-0/reporting/tssutil-utility.html
- >-
  https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-top-secret-for-z-os/16-0/reporting/tssutil-utility/earlout-record-format.html
- >-
  https://www.juniper.net/documentation/us/en/software/jsa7.5.0/jsa-dsm/topics/concept/concept-jsa-dsm-ca-acf2.html
datasets:
- id: logon-events
  name: System entry validation events
  description: >
    z/OS system-entry (logon) validation for the two non-RACF external
    security managers. ACF2 writes every validation to its COMMON SMF record —
    type 230 by default, site-configurable via the ACF2= SMF option — and the
    denied/logged subset is surfaced by the ACFRPTPW Invalid
    Password/Authority Log; successful logons appear as the high-volume
    "validation update" entries in ACFRPTLL, normally suppressed there by the
    NOUPDATE default. Top Secret records the equivalent as user-initiation
    ("IN") and user-termination ("TR") entries in the Audit/Tracking File,
    extracted by TSSUTIL into the fixed-position EARLOUT record. Fields below
    are the documented report/EARLOUT column names; the exact column names
    produced by a site's own zSecure, IBM Common Data Provider or Vanguard
    unload are NOT public and must be confirmed against a real sample before
    the pipeline is built.
  event_categories:
  - authentication
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, mainframe enclave
      notes: >
        Receives fixed-column ACFRPTxx print-line images (or the
        pipe-delimited zSecure/CDP unload, which prefixes each record with a
        record descriptor, date and time) shipped off-platform by an FTP/SFTP
        drop or a syslog forwarder. EBCDIC transcoding and record reassembly
        happen here, before the crossing.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_acf2.logon_events
    direct:
    - hop: cribl
      location: edge Cribl worker group, mainframe enclave
      notes: >
        Receives fixed-column ACFRPTxx print-line images (or the
        pipe-delimited zSecure/CDP unload, which prefixes each record with a
        record descriptor, date and time) shipped off-platform by an FTP/SFTP
        drop or a syslog forwarder. EBCDIC transcoding and record reassembly
        happen here at the edge.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_acf2.logon_events
  formats:
  - format: syslog-raw
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ACF2/Top Secret system-entry pipeline
      notes: >
        No Elastic integration and no Cribl pack exists for ACF2 or Top
        Secret; the only shipped normalizations are QRadar/JSA LEEF via IBM
        zSecure (QexACF2) and Chronicle's CA ACF2 default parser, and neither
        is reusable here. Column-positional parsing of report line images, or
        field-splitting of the pipe-delimited unload.
    fields:
    - vendor: DATE
      type: string
      description: Julian and Gregorian date on which the job or session was validated (ACFRPTPW)
      ecs: '@timestamp'
      status: partial
      transform: >
        combine with the TIME column and convert the Julian yyddd form to an
        ISO timestamp; the report carries no timezone, so the LPAR local
        offset must be supplied from a CPU/SYSID lookup
    - vendor: TIME
      type: string
      description: >-
        time of day the validation occurred, HH.MM / HH.MM.SS / HH.MM.SS.TH
        depending on the TIME() report parameter
      ecs: '@timestamp'
      status: partial
      notes: the second half of the timestamp; carries no date and no timezone on its own
    - vendor: LID
      type: string
      description: ACF2 logonid under which the job or session was validated
      ecs: user.name
      status: mapped
    - vendor: JNAME
      type: string
      description: name of the job or started task associated with the system entry attempt
      ecs: process.name
      status: partial
      notes: >
        a z/OS jobname is a unit of work, not a UNIX process; mapped to
        process.name so SOC pivots work, but it will not have a pid, command
        line or parent
    - vendor: 'SUBMIT''R'
      type: string
      description: >-
        logonid that submitted the job when the job ran under a different
        (invalid) logonid
      ecs: null
      status: unmapped
      custom: acf2.submitter_lid
      notes: >
        ECS has no submitter concept distinct from the validated identity;
        user.effective.* models privilege assumption rather than job
        submission, so this stays custom
    - vendor: SOURCE
      type: string
      description: >-
        logical input source (terminal, LU or source-group name) through which
        entry was attempted
      ecs: source.address
      status: mapped
      notes: >-
        an 8-character logical source name, not an IP; SNA/3270 entry points
        have no source.ip at all
    - vendor: PROGRAM
      type: string
      description: name of the load module that performed the job submission
      ecs: null
      status: unmapped
      custom: acf2.program
      notes: >-
        a load-module name, not a filesystem path, so process.executable would
        misrepresent it
    - vendor: RC
      type: integer
      description: ACF2 reason code explaining why the system entry attempt was denied or logged
      ecs: event.code
      status: mapped
      transform: >
        numeric reason code (4 = logonid does not exist, 11/13 = suspended or
        cancelled, 12 = invalid password, 17 = expired password, plus
        shift/source and authorization ranges); needs a lookup table to
        produce a readable event.reason
    - vendor: L
      type: string
      description: >-
        asterisk when the access was permitted but logged, blank when the
        access was denied
      ecs: event.outcome
      status: mapped
      transform: >-
        asterisk translates to success (permitted, logged), blank to failure;
        this flag, not RC, is the outcome source
    - vendor: CPU
      type: string
      description: SMF name (SMFID) of the LPAR on which the validation occurred
      ecs: host.name
      status: mapped
    - vendor: AUTH
      type: string
      description: name of the user authentication device attribute used, when one applied
      ecs: null
      status: unmapped
      custom: acf2.system_entry.auth_source
      notes: >-
        names the authenticator (passticket, certificate, MFA device); ECS 9.4
        has no GA authentication-method field
    - vendor: APPLID
      type: string
      description: >-
        VTAM APPLID of the application the user attempted to enter (ACF2
        16.0.01 and later)
      ecs: null
      status: unmapped
      custom: acf2.applid
      notes: >
        identifies the target subsystem (a TSO or CICS region); left custom
        because service.name in this pipeline names the security manager, not
        the entry subsystem
    - vendor: ACID NAME
      type: string
      description: Top Secret accessor id (ACID) validated on entry, EARLOUT positions 14-21
      ecs: user.name
      status: mapped
      notes: >-
        the Top Secret equivalent of the ACF2 LID; both products land on
        user.name so one rule covers the estate
    - vendor: TERMINAL ID
      type: string
      description: >-
        terminal for an online user, or the reader through which a batch job
        was submitted, EARLOUT positions 54-61
      ecs: source.address
      status: mapped
      notes: internal-reader submissions are literally "INTRDR" rather than a terminal name
    - vendor: FACILITY NAME
      type: string
      description: >-
        Top Secret facility through which entry occurred (TSO, CICS, BATCH,
        IMS), EARLOUT positions 70-77
      ecs: null
      status: unmapped
      custom: tss.facility
      notes: the entry subsystem; no ECS field models a mainframe logon facility
    - vendor: RETURN CODE
      type: string
      description: two-character Top Secret return code for the validation, EARLOUT positions 82-83
      ecs: event.outcome
      status: partial
      transform: >-
        zero translates to success and non-zero to failure; the specific
        failure meaning lives in the detail reason code, not here
    - vendor: DETAIL REASON CODE
      type: string
      description: >-
        three-character Top Secret detail reason code refining the return
        code, EARLOUT positions 84-86
      ecs: null
      status: partial
      custom: tss.drc
      notes: >
        resolved through the Detailed Violation Error Reason Code Legend; the
        resolved text is what belongs in event.reason, the raw code is kept
        for exact matching
    - vendor: SYSID
      type: string
      description: >-
        system id of the Top Secret system that recorded the event, EARLOUT
        positions 111-114
      ecs: host.name
      status: mapped
    - vendor: RECORD TYPE
      type: enum
      description: EARLOUT variable-field record descriptor identifying the kind of audited event
      ecs: event.action
      status: mapped
      transform: >
        two-character descriptor (IN = user initiation, TR = user termination,
        RE = resource validation, DS = data set validation, MD =
        parameter/modify, LG = installation logging) translated to a readable
        action; IN/TR are the logon and logoff events for this dataset
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Do the column-positional work at the edge worker group, where the
          report layout is known: join the separate DATE and TIME columns into
          one UTC @timestamp (ACF2 dates are Julian yyddd, EARLOUT dates are
          packed YYDDDF, and neither carries a timezone, so the LPAR offset
          has to be applied from a lookup keyed on CPU/SYSID), resolve the
          ACF2 RC and the Top Secret return/detail-reason codes through a
          lookup table into a readable event.reason, and derive event.outcome
          from the ACF2 "L" flag and the EARLOUT return code rather than from
          any single column. Emit one full ECS-shaped JSON record per event
          with EBCDIC already transcoded to UTF-8 and trailing blanks
          stripped, gate the downstream destination with
          C.Schema(...).validate plus a dead-letter route, and run it on
          Persistent Queue backpressure.
        elastic: >
          Own a custom logs-zos_acf2.logon_events ingest pipeline that
          finishes only what the edge cannot: enrich the LPAR SMFID carried in
          host.name with site/owner context, and set event.category/event.type
          consistently for the ACF2 and Top Secret variants so one
          authentication rule covers both products. Add explicitly typed
          custom-namespace index-template mappings for acf2.submitter_lid,
          acf2.applid, acf2.program and tss.facility as keyword and tss.drc as
          keyword, and publish a saved lookup of the ACF2 RC values (4 =
          logonid does not exist, 11/13 = suspended or cancelled, 12 = invalid
          password, 17 = expired password) so analysts are not decoding
          integers by hand.
        relay: >
          Low-side instances cross the guard: full ECS-shaped NDJSON crosses
          (envelope mode B) — one validation event per line, UTF-8,
          LF-terminated, compression disabled, nesting depth <=2 — because no
          Elastic integration exists to finish a thin envelope on the high
          side. The content-filter friction to settle with the guard owner is
          small here: every field is short, fixed-width and ASCII after
          transcoding, which is exactly the constrained shape a custom NDJSON
          (LUA-rule) filter can police cheaply, so resist adding free-text.
          The vendor feed is report text rather than CEF, so nothing
          CEF-shaped crosses; carry _raw for this dataset until the
          column-positional parser is proven, and reconcile low-side and
          high-side counts per (dataset, hour) to detect silent drops.
      direct:
        parse_location: low
        cribl: >
          Do the column-positional work at the edge worker group, where the
          report layout is known: join the separate DATE and TIME columns into
          one UTC @timestamp (ACF2 dates are Julian yyddd, EARLOUT dates are
          packed YYDDDF, and neither carries a timezone, so the LPAR offset
          has to be applied from a lookup keyed on CPU/SYSID), resolve the
          ACF2 RC and the Top Secret return/detail-reason codes through a
          lookup table into a readable event.reason, and derive event.outcome
          from the ACF2 "L" flag and the EARLOUT return code rather than from
          any single column. Emit one full ECS-shaped JSON record per event
          with EBCDIC already transcoded to UTF-8 and trailing blanks
          stripped, gate the downstream destination with
          C.Schema(...).validate plus a dead-letter route, and run it on
          Persistent Queue backpressure.
        elastic: >
          Own a custom logs-zos_acf2.logon_events ingest pipeline that
          finishes only what the edge cannot: enrich the LPAR SMFID carried in
          host.name with site/owner context, and set event.category/event.type
          consistently for the ACF2 and Top Secret variants so one
          authentication rule covers both products. Add explicitly typed
          custom-namespace index-template mappings for acf2.submitter_lid,
          acf2.applid, acf2.program and tss.facility as keyword and tss.drc as
          keyword, and publish a saved lookup of the ACF2 RC values (4 =
          logonid does not exist, 11/13 = suspended or cancelled, 12 = invalid
          password, 17 = expired password) so analysts are not decoding
          integers by hand.
  - format: syslog-leef
    enable: >
      Route the ACF2 system-entry validations (and the Top Secret user
      initiation/termination events) through CA Compliance Event Manager
      rather than the ACFRPTxx/EARLOUT report drop. In CEM, define a SIEM
      destination on the SIEM Settings page, then create a SIEM Action
      (Actions > Create SIEM Action) whose event criteria select the Sign On
      (System Access) event category and whose message text is the QRadar LEEF
      sample - a LEEF:1.0|... header followed by "|"-delimited key=value pairs
      built from percent-wrapped substitution variables (for example %SYSID%,
      %DATE%, %TIME%, %USERID%, %JOBNAME%). Attach the action to a policy so
      every sign-on event that matches is pushed in real time over the
      destination's TCP transport; a Splunk destination takes the same events
      over a TCP input or the HTTP event collector, and the shipped sample
      renders distributed (UNIX) syslog when the SIEM type is not QRadar.
      Equivalently, on the QRadar/JSA route a zSecure process runs the QexACF2
      exit over the daily SMF dump and emits the same LEEF, sent near real
      time over UNIX syslog or retrieved by the Log File protocol
      (SFTP/FTP/SCP) on a polling interval. Either way the encoding on the
      wire is LEEF with named attributes, not the fixed-column report line
      image.
    references:
    - >-
      https://www.juniper.net/documentation/us/en/software/jsa7.5.0/jsa-dsm/topics/concept/concept-jsa-dsm-ca-acf2.html
    - >-
      https://www.ibm.com/support/knowledgecenter/SS42VS_DSM/com.ibm.dsm.doc/c_DSM_guide_CA_ACF2_intro.html
    - >-
      https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-compliance-event-manager/6-0/using/manage-policy-actions/create-a-siem-policy-action.html
    - >-
      https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-compliance-event-manager/6-0/using/event-substitution-variables-and-criteria.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ACF2/Top Secret system-entry LEEF pipeline
      notes: >
        No Elastic integration and no Cribl pack normalizes ACF2 or Top Secret
        in any encoding, so LEEF is parsed by a custom pipeline that branches
        off the "LEEF:" banner. LEEF is materially easier than the report feed
        in that it carries named attributes and pre-joined date/time rather
        than positional columns split across a fixed print layout, so the
        column-positional grammar is not needed here; the attribute NAMES,
        however, are set per CEM event category (or per zSecure event) and are
        not published, so the pipeline must be built against a captured sample
        from the site's own CEM action or zSecure process. The expensive
        normalizations still run: resolve the ACF2 RC and the Top Secret
        return/detail-reason codes to a readable event.reason, derive
        event.outcome from the LEEF outcome attribute rather than any single
        code, and reconcile that the security manager behind the feed (ACF2 vs
        Top Secret) is tagged so one rule spans both.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Terminate the LEEF stream on the edge worker group in the mainframe
          enclave and split it on the "|" delimiter into named attributes,
          keyed on the LEEF banner so a site that flips a CEM action between
          the UNIX-syslog and QRadar-LEEF samples, or moves from zSecure
          syslog to a CEM push, is absorbed without a downstream change.
          LEEF's devTime-style attribute is already a joined date/time, but it
          is naive local time with no offset, so apply the LPAR timezone from
          a CPU/SYSID lookup exactly as the report feed does. Translate the
          ACF2 reason code and the Top Secret return/detail-reason codes
          through a lookup into event.reason, derive event.outcome from the
          LEEF outcome attribute, and emit one ECS-shaped JSON record per
          validation with EBCDIC already transcoded to UTF-8. Gate the
          destination with C.Schema(...).validate plus a dead-letter route and
          run on Persistent Queue backpressure.
        elastic: >
          Land in the same custom logs-zos_acf2.logon_events ingest pipeline
          and index template that the report feed targets so the encoding a
          site chooses does not fork the schema: LEEF-sourced and
          report-sourced records must resolve to identical ECS fields. Finish
          only what the edge cannot - enrich the LPAR SMFID in host.name with
          site/owner context and set event.category/event.type consistently
          across the ACF2 and Top Secret variants so one authentication rule
          covers the estate. Keep the ACF2 RC lookup (4 = logonid does not
          exist, 11/13 = suspended or cancelled, 12 = invalid password, 17 =
          expired password) published as a saved enrichment, and hold the
          custom-namespace keys (acf2.submitter_lid, acf2.applid,
          acf2.program, tss.facility, tss.drc) as explicitly typed keyword so
          a template flip does not silently dynamic-map them.
        relay: >
          Low-side instances cross the Everfox guard as full ECS-shaped NDJSON
          (envelope mode B) - one validation event per line, UTF-8,
          LF-terminated, compression disabled, nesting depth <=2 - because no
          Elastic integration exists to finish a thin envelope on the high
          side, so LEEF is resolved low-side and never itself reaches the
          boundary. The content-filter friction here is small: sign-on
          attributes are short, fixed-width and ASCII after transcoding,
          exactly the constrained shape a custom NDJSON (LUA-rule) filter can
          police cheaply, so resist letting free-text ride along. Nothing
          LEEF-shaped crosses the guard; reconcile low-side and high-side
          counts per (dataset, hour) since the crossing is at-most-once with
          no return channel.
      direct:
        parse_location: low
        cribl: >
          High-side instances with no guard parse the LEEF stream at the edge
          worker group into ECS JSON and take it straight to Elastic (cribl ->
          elastic direct). The operational decision that matters is producer
          choice: a CEM SIEM Action gives a near-real-time push of only the
          events a policy selects and is the Broadcom-native path, while the
          zSecure/QexACF2 route is batch-oriented (a daily SMF dump feeding
          syslog or a Log File pull) and is the one the QRadar/JSA DSM
          assumes. Standardize the parser on the LEEF banner so either
          producer lands in the same pipeline rather than pinning the feed to
          one.
        elastic: >
          Land in a custom logs-zos_acf2.logon_events ingest pipeline and
          index template, enriching the LPAR SMFID in host.name with
          site/owner context and setting event.category/event.type
          consistently across the ACF2 and Top Secret variants so one
          authentication rule covers the estate. Tag the input so LEEF-sourced
          records stay separable from report-sourced ones if a site runs both
          during a migration, and keep the RC lookup and the outcome
          derivation identical across producers so dashboards do not shift
          when a site moves from report text to a CEM push.
    fields_omitted: >
      The LEEF attribute names for the Sign On (System Access) category are
      set by the site's own CA Compliance Event Manager SIEM Action or zSecure
      process and are not published by the vendor, so there is no fixed list
      to inventory; the values are the system-entry validation details the
      syslog-raw entry inventories, with date and time pre-joined instead of
      split across print columns.
    fields: []
- id: resource-violations
  name: Resource and data set access events
  description: >
    Access decisions for data sets, programs and generalized resources. ACF2
    records four kinds of resource event — loggings, violations, MLS seclabel
    audit and traces — in the COMMON SMF record, surfaced by ACFRPTRV
    (Resource Event Log) for generalized resources and ACFRPTDS (Data
    Set/Program Event Log) for data set and program access. Top Secret records
    the same decisions as RE (non-data set resource) and DS (data set) entries
    in the Audit/Tracking File, reported by TSSUTIL EVENT(VIOL) and
    EVENT(AUDIT). Column names below come from the published report layouts; a
    site's zSecure, CDP or Vanguard unload may rename them and must be sampled
    first.
  event_categories:
  - file
  - process
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, mainframe enclave
      notes: >
        Same drop as the system-entry feed — fixed-column report line images
        or the pipe-delimited unload. This is the highest-volume ACF2 feed
        because rule-driven loggings (REC=LOG) vastly outnumber violations, so
        volume shaping belongs here rather than after the crossing.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_acf2.resource_events
    direct:
    - hop: cribl
      location: edge Cribl worker group, mainframe enclave
      notes: >
        Same drop as the system-entry feed — fixed-column report line images
        or the pipe-delimited unload. This is the highest-volume ACF2 feed
        because rule-driven loggings (REC=LOG) vastly outnumber violations, so
        volume shaping belongs here at the edge.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_acf2.resource_events
  formats:
  - format: syslog-raw
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ACF2/Top Secret resource-event pipeline
      notes: >
        No vendor pack or Elastic integration exists. ACFRPTRV and ACFRPTDS
        have different column layouts and must be parsed as two sub-grammars
        into one dataset, and the Top Secret RE/DS records are fixed-position
        rather than columnar.
    fields:
    - vendor: DATE
      type: string
      description: Julian or Gregorian date on which the access was attempted
      ecs: '@timestamp'
      status: partial
      transform: >-
        combine with TIME and apply the LPAR timezone offset; the report
        itself is timezone-free
    - vendor: TIME
      type: string
      description: time of day the access attempt occurred
      ecs: '@timestamp'
      status: partial
      notes: second half of the timestamp, format controlled by the TIME() report parameter
    - vendor: JNAME
      type: string
      description: name of the job under which the access request was issued
      ecs: process.name
      status: partial
      notes: >-
        z/OS jobname, mapped to process.name for pivoting; the executed
        program name is carried separately in PGM
    - vendor: LID
      type: string
      description: logonid of the user issuing the resource or data set request
      ecs: user.name
      status: mapped
    - vendor: UID
      type: string
      description: 'requester''s ACF2 user identification string'
      ecs: null
      status: unmapped
      custom: acf2.uid_string
      notes: >
        a site-defined concatenation of logonid fields (commonly department,
        location, then logonid) used as the rule-matching key; its substrings
        are site-specific so it is kept whole
    - vendor: NAME
      type: string
      description: name of the user making the request
      ecs: user.full_name
      status: mapped
    - vendor: SOURCE
      type: string
      description: logical input source where the resource request was issued
      ecs: source.address
      status: mapped
    - vendor: CPU
      type: string
      description: SMF name (SMFID) of the LPAR that validated this request
      ecs: host.name
      status: mapped
    - vendor: REQUESTED RESOURCE
      type: string
      description: name of the resource access was requested for, reported as class-type-name
      ecs: null
      status: partial
      custom: acf2.resource.name
      notes: >
        a single column holding three concatenated values (resource class,
        type code and name); must be split before the class can be filtered on
        independently as acf2.resource.class
    - vendor: LOOKUP-KEY
      type: string
      description: name of the rule set used to validate the request
      ecs: rule.name
      status: mapped
      notes: >
        the ACF2 rule set that produced the decision, so rule.name is the
        right home; there is no separate numeric rule id in this report, so
        rule.id is deliberately left empty
    - vendor: REC
      type: enum
      description: >-
        three-character code indicating whether the record is a logging,
        violation or trace record
      ecs: event.outcome
      status: mapped
      transform: >-
        VIO translates to failure, LOG to success, TRACE to unknown;
        violations are flagged with an asterisk in the printed report
    - vendor: SERV
      type: enum
      description: type of service requested against the resource (READ, ADD, DEL, UPDT)
      ecs: event.action
      status: mapped
      transform: >-
        normalize the four-value vendor vocabulary to lowercase actions shared
        with the Top Secret access levels
    - vendor: DISP
      type: string
      description: disposition element that determined the outcome of the request
      ecs: null
      status: partial
      custom: acf2.disposition
      notes: >
        the rule disposition (allow, prevent, log) before exits; DSPMOD
        records which exit or condition subsequently modified it, so DISP
        alone is not the final answer
    - vendor: FIN
      type: integer
      description: final return code from the ACF2 resource validation function (0, 4, 8, 12, 16)
      ecs: event.code
      status: mapped
      notes: >-
        the authoritative return code; PRE, RMC, INT and PST are the per-stage
        codes that fed it
    - vendor: DSN
      type: string
      description: fully qualified data set name the access was attempted against (ACFRPTDS)
      ecs: file.path
      status: mapped
      notes: >
        a z/OS data set name is not a POSIX path, but it is the complete
        canonical identifier for the object, so file.path is the correct home
        and the last qualifier is not a meaningful file.name
    - vendor: VOL
      type: string
      description: DASD volume serial the data set resides on (ACFRPTDS)
      ecs: null
      status: unmapped
      custom: acf2.volume
      notes: >-
        six-character volser; ECS has no volume concept, and it is needed to
        disambiguate uncataloged data sets
    - vendor: PGM
      type: string
      description: name of the program or load module whose use was logged or violated (ACFRPTDS)
      ecs: process.executable
      status: partial
      notes: >-
        a load-module name rather than a full path; the containing library is
        carried separately in LIB
    - vendor: LIB
      type: string
      description: name of the library the program was loaded from (ACFRPTDS)
      ecs: null
      status: unmapped
      custom: acf2.program_library
      notes: combined with PGM this is the closest thing to a full executable path on z/OS
    - vendor: RESOURCE NAME
      type: string
      description: Top Secret resource name on an EARLOUT RE record, up to 256 bytes
      ecs: null
      status: unmapped
      custom: tss.resource.name
      notes: >
        the Top Secret analogue of REQUESTED RESOURCE, kept in its own
        namespace because the eight-character resource type is a separate
        leading field rather than part of the name
    - vendor: REQUESTED ACCESS LEVEL
      type: string
      description: access level requested on a Top Secret EARLOUT RE or DS record
      ecs: null
      status: partial
      custom: tss.access.requested
      notes: >
        paired in the record with the allowed access level; the two together
        explain a violation, and the requested level needs normalizing onto
        the same action vocabulary as the ACF2 SERV column
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the ACFRPTRV and ACFRPTDS layouts as two sub-grammars into one
          normalized shape at the edge, split the class-type-name REQUESTED
          RESOURCE triplet into separate class and name fields, and derive
          event.outcome from the three-character REC code (VIO to failure, LOG
          to success, TRACE to unknown) rather than from the five separate
          return codes. Normalize SERV (READ/ADD/DEL/UPDT) and the Top Secret
          requested access level onto one action vocabulary so a single rule
          covers both products, and shed volume here: rule-driven REC=LOG
          entries dominate this feed, so sample or suppress them low-side and
          never drop REC=VIO. Schema-validate before the destination with a
          dead-letter route, and use Persistent Queue backpressure.
        elastic: >
          A custom logs-zos_acf2.resource_events ingest pipeline should enrich
          rather than parse: resolve the LOOKUP-KEY rule set carried in
          rule.name against a rule-owner enrich policy, and set event.category
          to file for DSN-bearing records and process for program-access
          records so the two sub-grammars stay separable after merge. Map
          acf2.resource.name, acf2.resource.class, acf2.uid_string,
          acf2.volume, acf2.program_library and tss.resource.name as keyword
          in the custom-namespace index template, keep acf2.disposition as
          keyword, and document that the ACF2 UID string is a site-defined
          concatenation whose substrings (department, location) are worth
          breaking out per site.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), one access
          decision per line, UTF-8, LF-terminated, compression disabled,
          nesting depth <=2. The real content-filter friction is resource
          names: Top Secret carries up to 248 characters of resource name and
          ACF2 data set names reach 44 characters plus volume, all site-chosen
          free-text that a custom NDJSON (LUA-rule) filter cannot cheaply
          allow-list, so agree a bounded length and an explicit truncation
          flag low-side rather than letting the guard cut silently. Nothing
          CEF-shaped crosses; drop _raw on this dataset first because it is
          the highest-volume and lowest-forensic-value ACF2 feed, and
          reconcile counts per (dataset, hour) since the crossing is
          at-most-once with no return channel.
      direct:
        parse_location: low
        cribl: >
          Parse the ACFRPTRV and ACFRPTDS layouts as two sub-grammars into one
          normalized shape at the edge, split the class-type-name REQUESTED
          RESOURCE triplet into separate class and name fields, and derive
          event.outcome from the three-character REC code (VIO to failure, LOG
          to success, TRACE to unknown) rather than from the five separate
          return codes. Normalize SERV (READ/ADD/DEL/UPDT) and the Top Secret
          requested access level onto one action vocabulary so a single rule
          covers both products, and shed volume here: rule-driven REC=LOG
          entries dominate this feed, so sample or suppress them at the edge
          and never drop REC=VIO. Schema-validate before the destination with
          a dead-letter route, and use Persistent Queue backpressure.
        elastic: >
          A custom logs-zos_acf2.resource_events ingest pipeline should enrich
          rather than parse: resolve the LOOKUP-KEY rule set carried in
          rule.name against a rule-owner enrich policy, and set event.category
          to file for DSN-bearing records and process for program-access
          records so the two sub-grammars stay separable after merge. Map
          acf2.resource.name, acf2.resource.class, acf2.uid_string,
          acf2.volume, acf2.program_library and tss.resource.name as keyword
          in the custom-namespace index template, keep acf2.disposition as
          keyword, and document that the ACF2 UID string is a site-defined
          concatenation whose substrings (department, location) are worth
          breaking out per site.
  - format: syslog-leef
    enable: >
      Forward the ACF2 resource and data set loggings/violations (and the Top
      Secret RE/DS decisions) through CA Compliance Event Manager instead of
      ACFRPTRV/ACFRPTDS report text. Create a SIEM Action whose criteria
      select the Object Access event category and, for a data set feed, the
      data set access events, then set the message text to the QRadar LEEF
      sample (LEEF:1.0|... with "|"-delimited key=value pairs from
      percent-wrapped substitution variables) or accept the shipped
      distributed (UNIX) syslog sample for a Splunk/generic destination.
      Attach it to a policy so each matching access decision is pushed in real
      time over the destination TCP transport (Splunk TCP input or HTTP event
      collector, QRadar syslog). Because rule-driven loggings dominate this
      event class, scope the CEM policy criteria tightly at source so the
      action does not push the full logging volume. The zSecure QexACF2 route
      emits the same LEEF for the same SMF resource/data set records - data
      set loggings, access violations and program-use loggings and violations
      - over UNIX syslog or Log File pull, which is what the QRadar/JSA CA
      ACF2 DSM ingests.
    references:
    - >-
      https://www.juniper.net/documentation/us/en/software/jsa7.5.0/jsa-dsm/topics/concept/concept-jsa-dsm-ca-acf2.html
    - >-
      https://www.ibm.com/support/knowledgecenter/SS42VS_DSM/com.ibm.dsm.doc/c_DSM_guide_CA_ACF2_intro.html
    - >-
      https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-compliance-event-manager/6-0/using/manage-policy-actions/create-a-siem-policy-action.html
    - >-
      https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-compliance-event-manager/6-0/using/event-substitution-variables-and-criteria.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ACF2/Top Secret resource-event LEEF pipeline
      notes: >
        No vendor pack or Elastic integration parses ACF2 in any encoding.
        LEEF collapses the two report sub-grammars (ACFRPTRV generalized
        resource and ACFRPTDS data set/program) into one attribute list, so
        the two-layout column parser is not needed; the class/name split and
        the outcome derivation still are. As with the sign-on feed the
        attribute names are per CEM event category or per zSecure event and
        are not published, so build against a captured sample. Distinguish
        file (DSN-bearing) from process (program-access) records after the
        merge so the dataset stays separable downstream.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the LEEF attribute list at the edge into one normalized shape,
          splitting the resource identity into class and name and deriving
          event.outcome from the LEEF outcome attribute (violation to failure,
          logging to success, trace to unknown) rather than from the several
          per-stage return codes. Normalize the access-type attribute
          (read/add/delete/update on ACF2, the requested access level on Top
          Secret) onto one action vocabulary so a single rule covers both
          products, and shed volume here: rule-driven loggings dominate this
          event class, so scope the CEM policy tightly at source and, for any
          residual logging volume, sample low-side while never dropping a
          violation. Schema-validate before the destination with a dead-letter
          route and use Persistent Queue backpressure.
        elastic: >
          A custom logs-zos_acf2.resource_events ingest pipeline - the same
          one the report feed targets - should enrich rather than re-parse:
          resolve the rule set carried in rule.name against a rule-owner
          enrich policy and set event.category to file for DSN-bearing records
          and process for program-access records so the two grammars stay
          separable after merge. Hold acf2.resource.name, acf2.resource.class,
          acf2.uid_string, acf2.volume, acf2.program_library and
          tss.resource.name as keyword in the custom-namespace template, keep
          acf2.disposition as keyword, and document that the ACF2 UID string
          is a site-defined concatenation whose substrings are worth breaking
          out per site.
        relay: >
          Full ECS-shaped NDJSON crosses the guard (envelope mode B), one
          access decision per line, UTF-8, LF-terminated, compression
          disabled, nesting depth <=2; LEEF is resolved low-side and does not
          reach the boundary. The real content-filter friction is resource
          names - Top Secret carries up to 248 characters of resource name and
          ACF2 data set names reach 44 characters plus volume, all site-chosen
          text a custom NDJSON (LUA-rule) filter cannot cheaply allow-list -
          so agree a bounded length and an explicit truncation flag low-side
          rather than letting the guard cut silently. This is the
          highest-volume ACF2 feed, so shed logging volume before the
          crossing, and reconcile counts per (dataset, hour) since the
          crossing is at-most-once with no return channel.
      direct:
        parse_location: low
        cribl: >
          High-side instances with no guard parse the LEEF stream at the edge
          worker group into ECS JSON and take it direct to Elastic. The
          producer decision is the same as on the sign-on feed - a CEM SIEM
          Action pushes only policy-selected events in near real time (and is
          the better fit for this feed precisely because the policy criteria
          can suppress logging volume at source), while the zSecure route
          delivers the full daily SMF-derived set over syslog or Log File
          pull. Key the parser on the LEEF banner so either producer lands in
          the same pipeline.
        elastic: >
          A custom logs-zos_acf2.resource_events ingest pipeline enriches
          rather than re-parses: resolve the rule set in rule.name against a
          rule-owner enrich policy and set event.category to file for
          DSN-bearing records and process for program-access records so the
          two grammars stay separable. Tag the input so LEEF-sourced records
          stay separable from report-sourced ones during a migration, and keep
          the class/name split and outcome derivation identical across
          producers so file-vs-process categorization does not drift when a
          site changes encoding.
    fields_omitted: >
      The attribute names for the Object Access category come from the site's
      own Compliance Event Manager SIEM Action or zSecure process and are
      unpublished, so the list has to be built from a captured sample rather
      than a vendor reference; the content is the ACFRPTRV
      generalized-resource and ACFRPTDS data set fields the syslog-raw entry
      inventories, collapsed into one attribute list.
    fields: []
- id: security-admin-changes
  name: Security administration changes
  description: >
    Changes to the security databases themselves. ACFRPTLL (Logonid
    Modification Log) reports INSERT/CHANGE/DELETE maintenance against logonid
    records — with old and new values per field when DETAIL is requested —
    while ACFRPTRL (Rule-ID Modification Log) reports rule database updates
    and ACFRPTEL covers infostorage updates. Top Secret logs TSS command
    activity via CLASS(O) and records parameter/modify activity as MD entries
    in the Audit/Tracking File. This is the lowest-volume and highest-value
    ACF2 feed: it is where privilege grants and rule weakening become visible.
  event_categories:
  - iam
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, mainframe enclave
      notes: >
        Same drop as the other two ACF2 feeds. ACFRPTLL DETAIL output is
        multi-line — a header line per change followed by one indented line
        per modified field — so records arrive as line groups rather than
        single lines, and that reassembly must complete here, before the
        crossing: the guard has no way to rejoin a split record.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_acf2.admin_changes
    direct:
    - hop: cribl
      location: edge Cribl worker group, mainframe enclave
      notes: >
        Same drop as the other two ACF2 feeds. ACFRPTLL DETAIL output is
        multi-line — a header line per change followed by one indented line
        per modified field — so records arrive as line groups rather than
        single lines, and that reassembly must complete here at the edge.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_acf2.admin_changes
  formats:
  - format: syslog-raw
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ACF2/Top Secret administration pipeline
      notes: >
        No vendor pack or Elastic integration exists. The pipeline must
        reassemble ACFRPTLL DETAIL line groups into one event carrying an
        array of field/old/new triples, and must merge the separate ACFRPTLL,
        ACFRPTRL and Top Secret MD grammars.
    fields:
    - vendor: DATE
      type: string
      description: Julian and Gregorian date on which the database update was made
      ecs: '@timestamp'
      status: partial
      transform: combine with TIME and apply the LPAR timezone offset
    - vendor: TIME
      type: string
      description: time the update was made, format controlled by the TIME() report parameter
      ecs: '@timestamp'
      status: partial
      notes: second half of the timestamp
    - vendor: LOGONID
      type: string
      description: logonid record that was inserted, changed or deleted
      ecs: user.target.name
      status: mapped
    - vendor: NAME
      type: string
      description: full name recorded on the logonid being modified
      ecs: user.target.full_name
      status: mapped
    - vendor: CHANGER
      type: string
      description: logonid of the administrator who issued the change request
      ecs: user.name
      status: mapped
    - vendor: CHANGER NAME
      type: string
      description: full name of the administrator who issued the change
      ecs: user.full_name
      status: mapped
    - vendor: CHANGE
      type: enum
      description: type of modification performed (INSERT, CHANGE, DELETE or UPDATE)
      ecs: event.action
      status: mapped
      transform: >
        normalize to lowercase actions shared with the rule and Top Secret
        grammars; UPDATE marks the automatic validation refresh of access
        counts and timestamps rather than an administrative act
    - vendor: JOBNAME
      type: string
      description: name of the job under which the updates were made
      ecs: process.name
      status: partial
      notes: >-
        z/OS jobname, mapped for pivoting only; interactive TSO changes carry
        the administrator's TSO jobname
    - vendor: CPU
      type: string
      description: SMF CPU id (SMFID) of the LPAR on which the change was made
      ecs: host.name
      status: mapped
    - vendor: USING
      type: string
      description: >-
        logonid of the model record referenced when a new logonid was created
        from a template
      ecs: null
      status: unmapped
      custom: acf2.model_logonid
      notes: >-
        present only on INSERT; the model determines the initial privilege
        set, so it is material to a grant review
    - vendor: FIELD
      type: string
      description: name of the logonid attribute that was modified (DETAIL format only)
      ecs: null
      status: unmapped
      custom: acf2.change.field
      notes: >
        one row per modified attribute; privileged attributes such as
        SECURITY, ACCOUNT and NON-CNCL are the ones worth alerting on
    - vendor: OLD VALUE
      type: string
      description: prior value of the modified field (DETAIL format only)
      ecs: null
      status: partial
      custom: acf2.change.old_value
      notes: >
        may be the sentinel ---NULLS---, ---NON PRINTABLE--- or ---NOT AUTH---
        rather than a value; these must stay distinguishable from a literal
        string of the same text
    - vendor: NEW VALUE
      type: string
      description: updated value of the modified field (DETAIL format only)
      ecs: null
      status: partial
      custom: acf2.change.new_value
      notes: >-
        same sentinel handling as OLD VALUE; password and key fields must be
        masked before this leaves the enclave
    - vendor: SIGNAL
      type: string
      description: >-
        IBM type 71 RACF ENF signal indicator showing whether change
        notification succeeded
      ecs: null
      status: unmapped
      custom: acf2.enf_signal
      notes: >-
        a failed ENF signal means listeners never saw the change, which is an
        integrity signal in its own right
    - vendor: RULE-ID
      type: string
      description: identifier of the rule set that was updated (ACFRPTRL)
      ecs: rule.name
      status: mapped
      notes: >
        names the rule set being administered, consistent with the LOOKUP-KEY
        mapping on the resource dataset; no numeric rule id exists, so rule.id
        stays empty
    - vendor: ELEVATE
      type: boolean
      description: >-
        "@" prefix on the CHANGER value marking a change permitted only
        because the changer was elevated at the time
      ecs: null
      status: unmapped
      custom: acf2.elevated_change
      notes: >
        reported as a prefix character rather than its own column; must be
        lifted into a boolean low-side so the changer name stays clean and
        elevation is filterable
    - vendor: ACID NAME
      type: string
      description: >-
        Top Secret accessor id that issued the administrative command, EARLOUT
        positions 14-21
      ecs: user.name
      status: mapped
      notes: the Top Secret analogue of CHANGER; both products land on user.name
    - vendor: MD RECORD DATA
      type: string
      description: >-
        parameter and modify option text captured on a Top Secret EARLOUT MD
        record, up to 256 bytes
      ecs: null
      status: unmapped
      custom: tss.admin.command
      notes: >
        the closest Top Secret equivalent to the ACF2 field/old/new triples,
        but delivered as unparsed command text; needs its own sub-parser and
        length cap before it crosses any relay
    - vendor: RETURN CODE
      type: string
      description: >-
        two-character Top Secret return code for the administrative action,
        EARLOUT positions 82-83
      ecs: event.outcome
      status: partial
      transform: >
        zero translates to success, non-zero to failure; the ACF2 reports have
        no equivalent column because they only record changes that were
        applied
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Reassemble ACFRPTLL DETAIL line groups at the edge — the header line
          plus its indented field/old-value/new-value lines become one event
          with a bounded array of change triples — because a line group split
          across a one-way hop can never be completed downstream. Normalize
          the three grammars (logonid, rule-id, Top Secret MD) onto one action
          vocabulary from the CHANGE column, preserve the "@" prefix on
          CHANGER as an explicit elevated-authority boolean instead of leaving
          it in the name, and keep the ---NULLS---, ---NON PRINTABLE--- and
          ---NOT AUTH--- sentinels distinguishable from real values. Mask new
          values for password and key fields before they leave the enclave,
          schema-validate with a dead-letter route, and use Persistent Queue
          backpressure.
        elastic: >
          A custom logs-zos_acf2.admin_changes ingest pipeline should set
          event.outcome to success for ACF2 entries — the reports only record
          applied changes, so absence of an outcome column is not absence of
          an outcome — while taking it from the return code on Top Secret MD
          entries, and should populate event.action from the normalized CHANGE
          verb. Map acf2.change.field, acf2.change.old_value,
          acf2.change.new_value, acf2.model_logonid, acf2.enf_signal and
          tss.admin.command as keyword in the custom-namespace index template
          (old and new values as keyword with ignore_above, not text), and add
          an enrich policy resolving privileged logonid attributes such as
          SECURITY, ACCOUNT and NON-CNCL so a grant of one alerts on its own.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), one administrative
          change per line with the change triples as a shallow bounded array
          (nesting depth <=2), UTF-8, LF-terminated, compression disabled. The
          friction to settle with the guard owner is the old/new value pairs:
          they are arbitrary logonid field content and Top Secret MD records
          carry up to 256 bytes of command text, so cap and flag them low-side
          and confirm the custom NDJSON (LUA-rule) filter tolerates an array
          rather than only flat keys. Nothing CEF-shaped crosses; this is the
          last dataset to drop _raw because it is the lowest volume and the
          highest forensic value, and count reconciliation per (dataset, hour)
          matters most here — a missing privilege grant is the drop nobody
          notices.
      direct:
        parse_location: low
        cribl: >
          Reassemble ACFRPTLL DETAIL line groups at the edge — the header line
          plus its indented field/old-value/new-value lines become one event
          with a bounded array of change triples — because shipping a split
          line group downstream to Elastic would leave the change unparsed.
          Normalize the three grammars (logonid, rule-id, Top Secret MD) onto
          one action vocabulary from the CHANGE column, preserve the "@"
          prefix on CHANGER as an explicit elevated-authority boolean instead
          of leaving it in the name, and keep the ---NULLS---, ---NON
          PRINTABLE--- and ---NOT AUTH--- sentinels distinguishable from real
          values. Mask new values for password and key fields before they
          leave the enclave, schema-validate with a dead-letter route, and use
          Persistent Queue backpressure.
        elastic: >
          A custom logs-zos_acf2.admin_changes ingest pipeline should set
          event.outcome to success for ACF2 entries — the reports only record
          applied changes, so absence of an outcome column is not absence of
          an outcome — while taking it from the return code on Top Secret MD
          entries, and should populate event.action from the normalized CHANGE
          verb. Map acf2.change.field, acf2.change.old_value,
          acf2.change.new_value, acf2.model_logonid, acf2.enf_signal and
          tss.admin.command as keyword in the custom-namespace index template
          (old and new values as keyword with ignore_above, not text), and add
          an enrich policy resolving privileged logonid attributes such as
          SECURITY, ACCOUNT and NON-CNCL so a grant of one alerts on its own.
  - format: syslog-leef
    enable: >
      Forward security-database maintenance - ACF2 logonid, rule and
      infostorage updates, and Top Secret command/parameter activity - through
      CA Compliance Event Manager rather than the ACFRPTLL/ACFRPTRL report
      text. Create a SIEM Action whose criteria select the Administration
      event category, set the message text to the QRadar LEEF sample
      (LEEF:1.0|... with "|"-delimited key=value pairs from percent-wrapped
      substitution variables) or accept the distributed (UNIX) syslog sample
      for a Splunk/generic destination, and attach it to a policy so each
      administrative change is pushed in real time over the destination TCP
      transport. This is the lowest-volume, highest-value feed - where
      privilege grants and rule weakening become visible - so it is the
      strongest case for the CEM push, which surfaces an administrative event
      as a single structured record at the moment it happens instead of
      waiting for the next report run. Coverage of the old-value/new-value
      field detail that ACFRPTLL DETAIL carries depends on which substitution
      variables the site's Administration-event action renders, and those
      per-event variable names are not published, so the action's field set
      must be confirmed against a captured sample before the pipeline is
      built.
    references:
    - >-
      https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-compliance-event-manager/6-0/using/manage-policy-actions/create-a-siem-policy-action.html
    - >-
      https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-compliance-event-manager/6-0/using/manage-actions/create-a-siem-action.html
    - >-
      https://techdocs.broadcom.com/us/en/ca-mainframe-software/security/ca-compliance-event-manager/6-0/using/event-substitution-variables-and-criteria.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ACF2/Top Secret administration LEEF pipeline
      notes: >
        No vendor pack or Elastic integration parses ACF2 administration in
        any encoding. A CEM Administration event arrives as one LEEF line per
        change rather than the multi-line ACFRPTLL DETAIL group, so the
        line-group reassembly the report feed needs is avoided; whether each
        LEEF line still carries the per-attribute old/new detail depends on
        the site's chosen substitution variables, which are not published. The
        pipeline must merge the ACF2 (logonid, rule) and Top Secret command
        grammars onto one action vocabulary and preserve elevated-authority
        and privileged-attribute signals as explicit fields.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Terminate the LEEF stream at the edge and normalize the three
          administration grammars (ACF2 logonid, ACF2 rule-id, Top Secret
          command) onto one CHANGE-verb action vocabulary. Preserve the
          elevated-authority marker as an explicit boolean rather than leaving
          it embedded in the changer name, keep any ---NULLS---, ---NON
          PRINTABLE--- and ---NOT AUTH--- sentinels distinguishable from real
          values, and mask new values for password and key fields before they
          leave the enclave. If the site's Administration action does not
          render the per-attribute old/new detail, treat that as a sourcing
          gap to close against the CEM action definition rather than silently
          emitting a change with no field detail. Schema-validate with a
          dead-letter route and use Persistent Queue backpressure.
        elastic: >
          A custom logs-zos_acf2.admin_changes ingest pipeline - shared with
          the report feed - should set event.outcome to success for ACF2
          entries (the audit only records applied changes) while taking it
          from the return code on Top Secret command entries, and populate
          event.action from the normalized CHANGE verb. Hold
          acf2.change.field, acf2.change.old_value, acf2.change.new_value,
          acf2.model_logonid, acf2.enf_signal and tss.admin.command as keyword
          in the custom-namespace template (old/new values as keyword with
          ignore_above, not text), and add an enrich policy resolving
          privileged logonid attributes such as SECURITY, ACCOUNT and NON-CNCL
          so a single grant alerts on its own.
        relay: >
          Full ECS-shaped NDJSON crosses the guard (envelope mode B), one
          administrative change per line with any change detail as a shallow
          bounded array (nesting depth <=2), UTF-8, LF-terminated, compression
          disabled. The friction to settle with the guard owner is the old/new
          value pairs and Top Secret command text - arbitrary content a
          field-aware NDJSON filter cannot allow-list - so cap and flag them
          low-side and confirm the custom LUA-rule filter tolerates a small
          array rather than only flat keys. LEEF is resolved low-side and
          nothing LEEF-shaped crosses; this is the last dataset to shed detail
          because it is the lowest volume and highest forensic value, and
          count reconciliation per (dataset, hour) matters most here - a
          missing privilege grant is the drop nobody notices.
      direct:
        parse_location: low
        cribl: >
          High-side instances with no guard parse the LEEF stream at the edge
          worker group into ECS JSON and take it direct to Elastic. Because
          this feed is low volume and high value, the CEM SIEM Action's
          near-real-time push is the preferred producer where available - an
          administrative change is visible as a structured record immediately
          rather than at the next report run - with the zSecure/report path as
          the fallback. Key the parser on the LEEF banner so either producer
          lands in the same pipeline.
        elastic: >
          A custom logs-zos_acf2.admin_changes ingest pipeline sets
          event.outcome to success for ACF2 entries (the audit only records
          applied changes) while taking it from the return code on Top Secret
          command entries, and populates event.action from the normalized
          CHANGE verb. Tag the input so LEEF-sourced records stay separable
          from report-sourced ones during a migration, and keep the
          privileged-attribute enrichment identical across producers so a
          grant of SECURITY, ACCOUNT or NON-CNCL alerts the same way
          regardless of encoding.
    fields_omitted: >
      The Administration-category attributes depend on the substitution
      variables the site picks for its Compliance Event Manager SIEM Action,
      which the vendor does not publish, and that choice also decides whether
      each one-line LEEF record carries the per-attribute old/new detail at
      all; the change content itself is what the syslog-raw entry inventories
      from the ACFRPTLL DETAIL groups and Top Secret command activity.
    fields: []
