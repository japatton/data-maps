id: vtc-systems
name: VTC Systems
vendor: Multiple
versions: >-
  Cisco Expressway/VCS X14.x, X15.x; Cisco Meeting Server 3.x; Cisco RoomOS /
  Collaboration Endpoint 9.x-11.x; Poly VideoOS 3.x/4.x
draft: true
references:
- >-
  https://www.cisco.com/c/en/us/td/docs/voice_ip_comm/expressway/admin_guide/X14-2/exwy_b_cisco-expressway-administrator-guide-x142/exwy_m_reference-material-x142.html
- >-
  https://www.cisco.com/c/en/us/td/docs/voice_ip_comm/expressway/admin_guide/X15-2/exwy_b_cisco-expressway-administrator-guide-x152/exwy_m_reference-material.html
- >-
  https://www.cisco.com/c/dam/en/us/td/docs/conferencing/ciscoMeetingServer/Reference_Guides/Version-3-11/Cisco-Meeting-Server-CDR-Guide-3-11.pdf
- https://cloud.google.com/chronicle/docs/ingestion/default-parsers/cisco-vcs
- https://github.com/ciscocms/cdr-receiver-db
- >-
  https://www.cisco.com/c/en/us/td/docs/telepresence/system_messages/ct_sys_message2/cts_syslog_by_type.html
- >-
  https://docs.poly.com/bundle/polyvideomode-ag-4-1-0/page/poly-video-mode-4-1-0-administrator-guide.html
datasets:
- id: call-signaling
  name: Call signaling events (Expressway/VCS event log)
  description: >
    Call setup, connect, teardown, rejection and search events from the Cisco
    Expressway / TelePresence Video Communication Server event log — the
    SIP/H.323 call-control plane for the whole VTC estate, and the one place
    where an external video call to or from the enterprise is attributable to
    an address, an IP and a time. Expressway writes its event log in an
    extension of UNIX syslog: for every message from the tvcs process the
    message body is a run of human-readable name=value pairs, the first always
    Event= and the last always Level=. The vendor field names below are those
    documented name elements and are used here as the class exemplar. The
    event CLASSES are universal across VTC call-control products — Poly's
    RealPresence/Clariti infrastructure and the SBC or CUCM in front of it
    emit the same substance (attempt, connect, disconnect, reject, with remote
    party and protocol) — but the FIELD NAMES are not portable. Where a site
    fronts its video estate with something other than Expressway, treat the
    vendor column as Expressway-shaped and re-key it against that product's
    own log reference before this map leaves draft.
  event_categories:
  - network
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Expressway-C and Expressway-E forward the event log to the configured
        remote syslog servers over UDP/TCP/TLS; the edge worker group is the
        syslog receiver. Because Expressway-E sits in a DMZ and Expressway-C
        inside the enclave, the two halves of one call can arrive from
        different sides of the boundary and must be correlated after the
        crossing rather than before it.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-vtc.call_signaling
    direct:
    - hop: cribl
      location: edge Cribl worker group
      notes: >
        Expressway-C and Expressway-E forward the event log to the configured
        remote syslog servers over UDP/TCP/TLS; the edge worker group is the
        syslog receiver and forwards to the core worker group and Elastic.
        Because Expressway-E sits in a DMZ and Expressway-C inside the
        enclave, the two halves of one call can arrive separately and must be
        correlated in the pipeline.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-vtc.call_signaling
  formats:
  - format: syslog-kv
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Expressway event-log pipeline
      notes: >
        No Elastic integration and no Cribl pack exists for Expressway/VCS.
        The only public parser of this format is Google SecOps' CISCO_VCS
        default parser, which confirms the name=value grammar and the
        Src-ip/Dst-ip/Local-ip/Response-code/Detail field names but normalizes
        to UDM, not ECS. The pipeline is therefore hand-built.
    fields:
    - vendor: Event
      type: string
      description: >-
        the event that generated the log message, always the first name=value
        pair on a tvcs line
      ecs: event.action
      status: mapped
      transform: >
        documented event strings (Call Attempted, Call Connected, Call
        Disconnected, Call Rejected, Call Diverted, Call Rerouted, Search
        Attempted, Search Completed) are lowercased and underscored into a
        stable event.action; the Accepted/Rejected/Failure sense of the same
        string, combined with Response-code, is what drives event.outcome
    - vendor: Service
      type: enum
      description: >-
        the signaling protocol the message belongs to - H.323, SIP, H.225,
        H.245, LDAP, Q.931, NeighbourGatekeeper, Clustering, ConferenceFactory
      ecs: network.protocol
      status: mapped
      transform: 'vendor values are lowercased to match ECS''s lowercase protocol-name convention'
    - vendor: Protocol
      type: enum
      description: the transport used for the communication - TCP, UDP or TLS
      ecs: network.transport
      status: partial
      notes: >
        TCP and UDP map cleanly; TLS is a session-layer fact rather than a
        transport, so it should be normalized to tcp with the encryption fact
        preserved separately instead of putting "tls" in network.transport
    - vendor: Src-ip
      type: ip
      description: IPv4/IPv6 address of the device attempting to establish communications
      ecs: source.ip
      status: mapped
    - vendor: Src-port
      type: port
      description: IP port of the device attempting to establish communications
      ecs: source.port
      status: mapped
    - vendor: Dst-ip
      type: ip
      description: IPv4/IPv6 address of the destination of the communication attempt
      ecs: destination.ip
      status: mapped
    - vendor: Dst-port
      type: port
      description: IP port of the destination of the communication attempt
      ecs: destination.port
      status: mapped
    - vendor: Src-alias
      type: string
      description: the first H.323 or E.164 alias associated with the originator of the message
      ecs: source.user.name
      status: partial
      notes: >
        a dialed SIP/H.323/E.164 alias, not a directory account - the scheme
        prefix must be stripped and user@domain split into source.user.name
        and source.domain, and the value must not be joined to identity data
        without an explicit directory lookup
    - vendor: Dst-alias
      type: string
      description: the first H.323 or E.164 alias associated with the recipient of the message
      ecs: destination.user.name
      status: partial
      notes: same alias-not-account caveat as Src-alias; split user@domain before use
    - vendor: Call-serial-number
      type: string
      description: >-
        local call serial number common to all protocol messages for one call
        on this Expressway
      ecs: null
      status: unmapped
      custom: vtc.call.serial_number
      notes: >-
        primary intra-node call-correlation key; ECS models no call
        identifier, so this stays custom
    - vendor: Tag
      type: string
      description: >-
        tag common to all searches and protocol messages across an Expressway
        network for all forks of a call
      ecs: null
      status: unmapped
      custom: vtc.call.tag
      notes: >-
        cross-node and cross-fork correlation key - the only field that
        stitches one call across Expressway-C and Expressway-E
    - vendor: Call-id
      type: string
      description: >-
        the SIP Call-ID header, uniquely identifying an invitation or all
        registrations of a particular client
      ecs: null
      status: unmapped
      custom: vtc.sip.call_id
      notes: 'the join key to Cisco Meeting Server''s sipCallId in the CDR dataset below'
    - vendor: Method
      type: string
      description: the SIP method - INVITE, BYE, UPDATE, REGISTER, SUBSCRIBE and so on
      ecs: null
      status: unmapped
      custom: vtc.sip.method
      notes: >-
        ECS http.request.method models HTTP only; a SIP method must not be
        forced into it
    - vendor: Response-code
      type: integer
      description: >-
        SIP response code, or a SIP-equivalent response code for H.323 and
        interworked calls
      ecs: null
      status: partial
      custom: vtc.sip.response_code
      notes: >
        no ECS field models a SIP response code; the value is the primary
        input to a lookup deriving event.outcome (2xx success, 4xx/5xx/6xx
        failure) and should be carried as a long, not a string
    - vendor: Reason
      type: string
      description: >-
        textual reason information associated with the event, e.g. the H.225
        additional cause text on Call Rejected
      ecs: event.reason
      status: mapped
    - vendor: Detail
      type: string
      description: descriptive detail of the event
      ecs: message
      status: partial
      notes: >
        free-text explanation of the Event; if the raw syslog line is also
        retained, only one of the two should populate message so the same text
        is not indexed twice
    - vendor: Auth
      type: enum
      description: whether the call attempt has been authenticated successfully
      ecs: event.outcome
      status: partial
      transform: vendor yes/no is translated to success/failure
      notes: >
        only present on call-attempt events; for every other event in this
        dataset event.outcome has to be derived from the Event string and
        Response-code instead
    - vendor: Num-bytes
      type: integer
      description: the number of bytes sent or received in the signaling message
      ecs: null
      status: unmapped
      custom: vtc.message.bytes
      notes: >
        the size of a single signaling message, not media volume - mapping it
        to network.bytes would make call-volume dashboards wrong
    - vendor: Level
      type: integer
      description: >-
        the Expressway event-log level of the event, 1 (least verbose) to 4
        (most verbose)
      ecs: log.level
      status: partial
      notes: >
        an Expressway verbosity level, not a syslog severity - do not copy it
        into log.syslog.severity.code; the syslog PRI on the wire is the only
        real severity for this feed
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Split the name=value body on the edge worker group into ECS-shaped
          JSON, and do the two things that are only cheap near the source:
          normalize the Protocol value (TCP/UDP/TLS) into a real ECS transport
          plus a separate encryption fact, and split the Src-alias/Dst-alias
          SIP and H.323 URIs into user and domain parts so downstream queries
          are not string-matching on "sip:" prefixes. Derive event.outcome
          here from the Event string plus the Response-code lookup rather than
          leaving it to a consumer, keep only one of Detail or the raw line as
          message so the same text is not stored twice, and validate against a
          Schema Library schema (C.Schema(...).validate) with a dead-letter
          route before the destination, which runs on Persistent Queue
          backpressure and never Block.
        elastic: >
          Own a custom logs-vtc.call_signaling ingest pipeline — there is no
          stock integration to override — and keep its work to what the low
          side cannot finish: enriching Call-serial-number and Tag with the
          Expressway node that emitted them so a call forked across
          Expressway-C and Expressway-E stitches into one trace. Declare
          explicit custom-namespace index-template mappings for
          vtc.call.serial_number, vtc.call.tag and vtc.sip.call_id as keyword
          and vtc.sip.response_code as long, because those four carry every
          call-correlation query and must not be left to dynamic mapping.
          Assert in the template that event.action is populated for every
          documented Event value, so a new Expressway release adding an event
          string shows up as a mapping gap rather than silently landing
          unclassified.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) — one event per
          line, UTF-8, LF-terminated, compression disabled, nesting depth two
          or less — because no Elastic integration exists to finish a thin
          envelope on the high side. The friction to settle with the guard
          owner is the Detail element: unbounded free text that on Decode
          Error and Protocol-buffer events can carry an entire undecodable SIP
          or H.323 message, including non-ASCII bytes, so it must be
          length-capped and flagged low-side to a bound the custom content
          filter accepts. The vendor feed is name=value syslog rather than
          CEF, so nothing CEF-shaped crosses; with no return channel, detect
          silent drops by reconciling low-side and high-side counts per
          (dataset, hour), and carry _raw only until the hand-built parser is
          proven against a full release's worth of Event values.
      direct:
        parse_location: low
        cribl: >
          Split the name=value body on the edge worker group into ECS-shaped
          JSON, and do the two things that are only cheap near the source:
          normalize the Protocol value (TCP/UDP/TLS) into a real ECS transport
          plus a separate encryption fact, and split the Src-alias/Dst-alias
          SIP and H.323 URIs into user and domain parts so downstream queries
          are not string-matching on "sip:" prefixes. Derive event.outcome
          here from the Event string plus the Response-code lookup rather than
          leaving it to a consumer, keep only one of Detail or the raw line as
          message so the same text is not stored twice, and validate against a
          Schema Library schema (C.Schema(...).validate) with a dead-letter
          route before the destination, which runs on Persistent Queue
          backpressure and never Block.
        elastic: >
          Own a custom logs-vtc.call_signaling ingest pipeline — there is no
          stock integration to override — and keep its work to what the edge
          worker group cannot finish: enriching Call-serial-number and Tag
          with the Expressway node that emitted them so a call forked across
          Expressway-C and Expressway-E stitches into one trace. Declare
          explicit custom-namespace index-template mappings for
          vtc.call.serial_number, vtc.call.tag and vtc.sip.call_id as keyword
          and vtc.sip.response_code as long, because those four carry every
          call-correlation query and must not be left to dynamic mapping.
          Assert in the template that event.action is populated for every
          documented Event value, so a new Expressway release adding an event
          string shows up as a mapping gap rather than silently landing
          unclassified.
- id: device-admin-auth
  name: Device administration and registration authentication
  description: >
    Administrator logons, configuration changes and endpoint
    registration/authentication decisions from the same Expressway event log —
    the accountability feed for the VTC infrastructure itself, as opposed to
    the calls flowing through it. Carries Admin Session Start / Finish / Login
    Failure, Admin Session CBA Authorization Failure, Authorization Failure,
    System Configuration Changed, Security Alert, Message Rejected, and the
    Registration Requested / Accepted / Rejected / Refresh / Removed family.
    Registration events belong here rather than with call signaling because a
    rejected registration is an authentication decision: Expressway rejects a
    REGISTER when an endpoint supplies no credentials or credentials that do
    not match, which is the VTC estate's equivalent of a failed logon and the
    signal a CSOC watches for rogue-endpoint and credential-stuffing
    behaviour. The same event classes exist on codec endpoints and on Poly
    VideoOS systems, which log their own admin sessions locally; those are
    covered by the thin endpoint dataset below.
  event_categories:
  - authentication
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Same remote-syslog forwarding configuration and same edge receiver as
        the call-signaling dataset - the two are one physical feed split on
        the Event value.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-vtc.device_admin
    direct:
    - hop: cribl
      location: edge Cribl worker group
      notes: >
        Same remote-syslog forwarding configuration and same edge receiver as
        the call-signaling dataset - the two are one physical feed split on
        the Event value.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-vtc.device_admin
  formats:
  - format: syslog-kv
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Expressway event-log pipeline (admin/registration branch)
      notes: >
        Shares the hand-built name=value parser with the call-signaling
        dataset; the split into two data streams happens on the Event value
        after extraction. No integration or pack exists for either branch.
    fields:
    - vendor: Event
      type: string
      description: >-
        the event that generated the log message - the admin-session,
        authorization, configuration-change and registration event families
      ecs: event.action
      status: mapped
      transform: >
        documented event strings (Admin Session Start, Admin Session Login
        Failure, Authorization Failure, CBA Authorization Failure, System
        Configuration Changed, Registration Accepted, Registration Rejected,
        Registration Removed, Security Alert) are lowercased and underscored;
        the Accepted/Rejected/Failure suffix is also the source of
        event.outcome for this dataset
    - vendor: User
      type: string
      description: the username entered when a login attempt was made
      ecs: user.name
      status: mapped
    - vendor: ipaddr
      type: ip
      description: the source IP address of the user who has logged in
      ecs: source.ip
      status: mapped
      notes: >
        lowercase element name, and it appears only on admin-session events;
        registration events carry the source address as Src-ip instead, so the
        pipeline must accept either
    - vendor: Src-ip
      type: ip
      description: source IP address of the endpoint making the registration or message attempt
      ecs: source.ip
      status: mapped
      notes: same ECS target as ipaddr - whichever element is present on the event wins
    - vendor: Src-alias
      type: string
      description: the first H.323 or E.164 alias associated with the registering endpoint
      ecs: null
      status: partial
      custom: vtc.registration.alias
      notes: >
        kept custom rather than on source.user.name because on this dataset
        the alias identifies a device registration, not the human in the Admin
        Session events that share the stream - overloading one field with both
        would make user-scoped queries wrong
    - vendor: AOR
      type: string
      description: the address of record for the REGISTER request
      ecs: null
      status: unmapped
      custom: vtc.sip.aor
    - vendor: Contact
      type: string
      description: the Contact header from the REGISTER request
      ecs: null
      status: unmapped
      custom: vtc.sip.contact
      notes: >-
        the endpoint's reachable contact URI - the field that changes when a
        registration is hijacked to a new location
    - vendor: Duration
      type: integer
      description: the requested or granted registration expiry duration
      ecs: null
      status: unmapped
      custom: vtc.registration.expiry_seconds
      notes: >
        a registration expiry, NOT a call duration - it must not be mapped to
        event.duration, which would corrupt any call-length aggregation that
        spans datasets
    - vendor: Response-code
      type: integer
      description: >-
        SIP response code on the registration or authentication outcome, e.g.
        401 or 403 on rejection
      ecs: null
      status: partial
      custom: vtc.sip.response_code
      notes: >-
        same custom namespace as the call-signaling dataset so one query
        resolves response codes across both
    - vendor: Reason
      type: string
      description: >-
        textual reason associated with the event - on Registration Removed one
        of Authentication change, Conflicting zones, Operator forced removal,
        Registration superseded
      ecs: event.reason
      status: mapped
    - vendor: Detail
      type: string
      description: >-
        descriptive detail of the event - on System Configuration Changed it
        holds the name of the changed configuration item and its new value
      ecs: message
      status: partial
      notes: >
        the configuration-change payload is packed into this one free-text
        element; it has to be split into a setting name and a new value before
        configuration alerting or change review is possible
    - vendor: Auth
      type: enum
      description: whether the attempt has been authenticated successfully
      ecs: event.outcome
      status: partial
      transform: vendor yes/no is translated to success/failure
      notes: >-
        absent on most events in this dataset - the Event string is the
        reliable source of event.outcome here
    - vendor: Service
      type: enum
      description: the protocol the message belongs to - SIP, H.323, LDAP, Clustering and so on
      ecs: network.protocol
      status: mapped
      transform: vendor values are lowercased
      notes: >-
        LDAP here means the admin authentication went to a remote directory,
        which is what makes Authorization Failure meaningful
    - vendor: Method
      type: string
      description: >-
        the SIP method - REGISTER or SUBSCRIBE on the registration events in
        this dataset
      ecs: null
      status: unmapped
      custom: vtc.sip.method
    - vendor: Level
      type: integer
      description: >-
        the Expressway event-log level of the event, 1 (least verbose) to 4
        (most verbose)
      ecs: log.level
      status: partial
      notes: >-
        an Expressway verbosity level rather than a syslog severity; admin and
        registration events are almost all level 1
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Branch this dataset off the shared Expressway parser on the edge
          worker group by Event value, and do the normalization that the event
          grammar makes awkward: collapse the two different source-address
          elements (lowercase ipaddr on admin-session events, Src-ip on
          registration events) onto one source.ip so an analyst does not have
          to know which event family they are querying, and derive
          event.outcome from the Accepted/Rejected/Failure sense of the Event
          string rather than from Auth, which is absent on most events here.
          Split the Detail element on System Configuration Changed into a
          setting-name and new-value pair while the vendor's own formatting is
          still in front of you, and gate the destination with
          C.Schema(...).validate plus a dead-letter route, on Persistent Queue
          backpressure.
        elastic: >
          Own a custom logs-vtc.device_admin ingest pipeline and confine it to
          the enrichment the low side cannot do: resolving the Expressway
          hostname to the site and device owner, and joining registration
          rejections to the endpoint inventory so a rejected alias is
          attributable to a room. Map vtc.sip.aor, vtc.sip.contact and
          vtc.registration.alias as keyword and
          vtc.registration.expiry_seconds and vtc.sip.response_code as long in
          the custom-namespace index template. Assert that user.name is
          populated on every Admin Session event and that event.outcome is
          populated on every event whose Event value ends in Rejected, Failure
          or Removed, so a parser regression surfaces as an empty required
          field rather than as a quietly missing alert.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), same envelope keys
          as the call-signaling dataset so the guard sees one JSON schema for
          both branches of the Expressway feed rather than two grammars. This
          is the lowest-volume and highest-forensic-value VTC dataset, so it
          is the last one to have _raw dropped and the first to justify the
          low-side count reconciliation per (dataset, hour) that substitutes
          for acknowledgement across a one-way hop. Content-filter friction is
          concentrated in Detail on System Configuration Changed, which embeds
          arbitrary configuration values including URLs and certificate
          material - split it low-side so the filter inspects a bounded
          setting-name and value rather than one unbounded string.
      direct:
        parse_location: low
        cribl: >
          Branch this dataset off the shared Expressway parser on the edge
          worker group by Event value, and do the normalization that the event
          grammar makes awkward: collapse the two different source-address
          elements (lowercase ipaddr on admin-session events, Src-ip on
          registration events) onto one source.ip so an analyst does not have
          to know which event family they are querying, and derive
          event.outcome from the Accepted/Rejected/Failure sense of the Event
          string rather than from Auth, which is absent on most events here.
          Split the Detail element on System Configuration Changed into a
          setting-name and new-value pair while the vendor's own formatting is
          still in front of you, and gate the destination with
          C.Schema(...).validate plus a dead-letter route, on Persistent Queue
          backpressure.
        elastic: >
          Own a custom logs-vtc.device_admin ingest pipeline and confine it to
          the enrichment the edge worker group cannot do: resolving the
          Expressway hostname to the site and device owner, and joining
          registration rejections to the endpoint inventory so a rejected
          alias is attributable to a room. Map vtc.sip.aor, vtc.sip.contact
          and vtc.registration.alias as keyword and
          vtc.registration.expiry_seconds and vtc.sip.response_code as long in
          the custom-namespace index template. Assert that user.name is
          populated on every Admin Session event and that event.outcome is
          populated on every event whose Event value ends in Rejected, Failure
          or Removed, so a parser regression surfaces as an empty required
          field rather than as a quietly missing alert.
- id: cms-cdr
  name: Meeting Server call detail records
  description: >
    Conference-level call detail records pushed by the Cisco Meeting Server
    Call Bridge — who joined which meeting space, from what address and
    device, for how long, over encrypted or unencrypted media, and why the leg
    ended. This is the meeting-attendance record that Expressway signaling
    cannot give you: Expressway sees a call to a conference alias, CMS sees
    the individual participants inside it. Records are emitted as XML <record>
    items inside a <records> element, pushed by the Call Bridge to a
    configured receiver URI over HTTP(S); the receiver must answer 200 OK or
    the Call Bridge resends, which makes the feed at-least-once and
    duplicate-prone by design. Field names below are the CMS 3.x CDR guide's
    documented record parameters. The class analogue on the Poly side is the
    RealPresence/Clariti conference CDR export, which carries the same
    substance through entirely different names.
  event_categories:
  - network
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        A Cribl HTTP/S source acts as the CDR receiver named in the Call
        Bridge's cdrReceiver configuration; it must return 200 OK per batch or
        the Call Bridge will resend the same records. That acknowledgement
        cannot come from across the guard, so for low-side Call Bridges the
        receiver has to sit in the same enclave as the Call Bridge and push
        onward.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-vtc.cms_cdr
    direct:
    - hop: cribl
      location: edge Cribl worker group
      notes: >
        A Cribl HTTP/S source acts as the CDR receiver named in the Call
        Bridge's cdrReceiver configuration; it must return 200 OK per batch or
        the Call Bridge will resend the same records, so the receiver sits
        alongside the Call Bridge and pushes onward to the core worker group
        and Elastic.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-vtc.cms_cdr
  formats:
  - format: other
    parsing:
      mechanism: cribl-pipeline
      artifact: custom CMS CDR pipeline
      notes: >
        No Elastic integration and no Cribl pack exists for Meeting Server.
        The reference implementations are Cisco's own sample CDR receivers
        (ciscocms/cdr-receiver-db and the example script in the CDR guide),
        which confirm the record types and attribute names but only persist
        them to a local database. The XML-to-JSON flattening and the ECS
        shaping are both hand-built.
    fields:
    - vendor: '@type'
      type: enum
      description: >-
        the record type attribute on each <record> element - callStart,
        callEnd, callLegStart, callLegEnd, callLegUpdate,
        participantInfoStart, recordingStart, recordingEnd, streamingStart,
        streamingEnd
      ecs: event.action
      status: mapped
      transform: >-
        the record type becomes the event.action verb; it also decides which
        of the parameters below are present at all
    - vendor: time
      type: timestamp
      description: >-
        RFC 3339 / ISO 8601 time at which the record was generated on the
        Meeting Server, always supplied in UTC
      ecs: '@timestamp'
      status: mapped
    - vendor: session
      type: string
      description: >-
        GUID unique to the Call Bridge session, created when the Call Bridge
        restarts and constant until it restarts again
      ecs: null
      status: unmapped
      custom: vtc.cms.session_guid
      notes: >-
        with correlatorIndex this is what identifies a record uniquely, and
        therefore what duplicate detection keys on
    - vendor: correlatorIndex
      type: integer
      description: >-
        record index incrementing by one per record, starting at 0 for the
        first record after Call Bridge boot
      ecs: null
      status: unmapped
      custom: vtc.cms.correlator_index
      notes: >
        a gap in this sequence means the Meeting Server discarded records it
        could not deliver; it is the only in-band evidence of CDR loss and has
        to be monitored as a counter, not just stored
    - vendor: id
      type: string
      description: >-
        identifier of the object the record describes - the call id inside a
        <call> tag, the call leg id inside a <callLeg> tag, the recording id
        inside a <recording> tag
      ecs: null
      status: partial
      custom: vtc.cms.object_id
      notes: >
        polymorphic - its meaning depends on the enclosing tag, so the
        pipeline must resolve it into separate call-id and call-leg-id fields
        instead of indexing one overloaded value
    - vendor: callCorrelator
      type: string
      description: >-
        identifier shared by call legs of the same call even when they are
        distributed across multiple Call Bridges
      ecs: null
      status: unmapped
      custom: vtc.cms.call_correlator
      notes: >-
        constant for the lifetime of a coSpace but regenerated per ad hoc
        call, so it is not a stable per-meeting key
    - vendor: direction
      type: enum
      description: >-
        incoming if the remote SIP device initiated the connection to the
        Meeting Server, outgoing if the Meeting Server established the leg
      ecs: network.direction
      status: mapped
      transform: vendor incoming/outgoing are translated to ECS inbound/outbound
    - vendor: type
      type: enum
      description: >-
        the type of call leg - sip for a SIP connection or acano for a Cisco
        Meeting App connection
      ecs: null
      status: unmapped
      custom: vtc.cms.call_leg_type
      notes: >-
        a child element of <callLeg>, distinct from the record-type attribute
        above despite the identical name
    - vendor: remoteParty
      type: string
      description: >-
        the address of the remote party of this call leg; for outgoing calls
        this is the output of the dial transform and may not contain a domain
      ecs: null
      status: unmapped
      custom: vtc.call.remote_party
      notes: >
        the highest-value pivot field in the dataset, but it is both
        direction-dependent and post-dial-transform, so pinning it to source.*
        or destination.* would be wrong as often as right - ECS has no
        telephony/call-address field to hold it
    - vendor: remoteAddress
      type: string
      description: >-
        for SIP calls, the remote URI relevant to the call leg - the source
        URI on incoming legs, the destination URI on outgoing legs
      ecs: source.user.name
      status: partial
      notes: >
        the direction field must decide whether this lands on source.* or
        destination.*; the user@domain URI should be split so the domain is
        queryable separately from the user part
    - vendor: localAddress
      type: string
      description: >-
        the local destination the caller connected to on incoming legs, or the
        caller ID presented on outgoing legs
      ecs: destination.user.name
      status: partial
      notes: >
        the mirror of remoteAddress and equally direction-dependent; it is
        absent entirely in some scenarios, such as dialing out to a Meeting
        App user from a coSpace with no defined URIs
    - vendor: displayName
      type: string
      description: >-
        the friendly name of a SIP endpoint, the real name of a Meeting App
        user, or whatever a web-client guest typed
      ecs: user.full_name
      status: partial
      notes: >
        far-end supplied and unauthenticated - it is blank when the far end
        provides nothing and attacker-controlled when it does not, so it must
        not be treated as identity
    - vendor: sipCallId
      type: string
      description: >-
        the unique SIP Call-ID header value, present when the call leg is a
        SIP connection
      ecs: null
      status: unmapped
      custom: vtc.sip.call_id
      notes: >-
        the join key back to the Expressway Call-id element, and the only way
        to follow one call from the edge into the conference
    - vendor: durationSeconds
      type: integer
      description: the length of time in seconds that the call or call leg was active
      ecs: event.duration
      status: mapped
      transform: >-
        seconds must be multiplied by 1e9 - ECS event.duration is expressed in
        nanoseconds
    - vendor: reason
      type: string
      description: 'the reason the call leg ended, from the CDR guide''s reason-code table'
      ecs: event.reason
      status: mapped
    - vendor: remoteTeardown
      type: boolean
      description: >-
        true if the remote party initiated the end of this call leg, false if
        the Meeting Server did
      ecs: null
      status: unmapped
      custom: vtc.cms.remote_teardown
    - vendor: encryptedMedia
      type: boolean
      description: presence or absence of encrypted media during the lifetime of the call leg
      ecs: null
      status: partial
      custom: vtc.media.encrypted
      notes: >
        the companion unencryptedMedia element reports the same for
        unencrypted media and the two are independent; an absent element means
        that media type was not present at all, which is not the same as false
        and must not be defaulted to one
    - vendor: ipAddress
      type: ip
      description: >-
        the IP address of the device the participant used to join the meeting
        (participantInfoStart records)
      ecs: source.ip
      status: mapped
      notes: >-
        documented as supported on IPv4 devices only, so participants joining
        over IPv6 have no address in the CDR at all
    - vendor: deviceType
      type: string
      description: >-
        the device details of the participant - browser name and version for
        web app participants, device name for SIP participants
      ecs: null
      status: partial
      custom: vtc.endpoint.device_type
      notes: >
        ECS user_agent.original would fit the web-app values but not the SIP
        device names sharing the same element, so the field stays custom until
        the pipeline can split the two cases
    - vendor: tenant
      type: string
      description: the tenant this call belongs to in a multi-tenant deployment
      ecs: organization.id
      status: mapped
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Flatten the XML on the edge worker group into one JSON document per
          <record>, and deduplicate there on the (session GUID,
          correlatorIndex) pair — the Call Bridge resends any batch it did not
          see acknowledged, so duplicates are normal and are cheapest to drop
          before they are multiplied by the rest of the pipeline. Resolve the
          polymorphic id attribute into explicit call-id and call-leg-id
          fields based on its enclosing tag, convert durationSeconds to
          nanoseconds for event.duration, and normalize direction to ECS
          inbound/outbound. Emit a correlatorIndex-gap counter as its own
          metric: a gap is the only evidence that the Meeting Server discarded
          records, and it is invisible once the documents are in Elastic.
        elastic: >
          Own a custom logs-vtc.cms_cdr ingest pipeline and keep it to the
          cross-record work the low side cannot do statelessly: joining
          callLegEnd records back to their callLegStart and
          participantInfoStart siblings by call-leg id so one participant is
          one queryable session rather than three disconnected documents, and
          enriching the reason value with the CDR guide's reason-code table.
          Declare custom-namespace index-template mappings for
          vtc.cms.session_guid, vtc.cms.call_correlator, vtc.cms.object_id,
          vtc.sip.call_id and vtc.endpoint.device_type as keyword and
          vtc.cms.correlator_index as long. Assert that vtc.media.encrypted is
          only populated when the vendor element was actually present, because
          an absent encryptedMedia element means the media type was not
          present at all and must not become a false.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) — the XML is
          flattened low-side and never crosses as XML, which also sidesteps
          the entity-expansion and nesting risks that make raw XML a poor
          thing to hand a content filter. Constrain the flattened shape to
          depth two by promoting the rxAudio/txAudio/rxVideo/txVideo codec and
          resolution elements into flat keys rather than nesting them, so the
          custom NDJSON filter stays simple. The friction to settle with the
          guard owner is displayName and remoteParty: far-end-supplied free
          text and URIs that can carry unicode and arbitrary length, which
          should be capped and flagged low-side. Because the crossing is
          at-most-once while the CMS feed itself is at-least-once, reconcile
          on the deduplicated low-side count per (dataset, hour), not on the
          raw received count.
      direct:
        parse_location: low
        cribl: >
          Flatten the XML on the edge worker group into one JSON document per
          <record>, and deduplicate there on the (session GUID,
          correlatorIndex) pair — the Call Bridge resends any batch it did not
          see acknowledged, so duplicates are normal and are cheapest to drop
          before they are multiplied by the rest of the pipeline. Resolve the
          polymorphic id attribute into explicit call-id and call-leg-id
          fields based on its enclosing tag, convert durationSeconds to
          nanoseconds for event.duration, and normalize direction to ECS
          inbound/outbound. Emit a correlatorIndex-gap counter as its own
          metric: a gap is the only evidence that the Meeting Server discarded
          records, and it is invisible once the documents are in Elastic.
        elastic: >
          Own a custom logs-vtc.cms_cdr ingest pipeline and keep it to the
          cross-record work the edge worker group cannot do statelessly:
          joining callLegEnd records back to their callLegStart and
          participantInfoStart siblings by call-leg id so one participant is
          one queryable session rather than three disconnected documents, and
          enriching the reason value with the CDR guide's reason-code table.
          Declare custom-namespace index-template mappings for
          vtc.cms.session_guid, vtc.cms.call_correlator, vtc.cms.object_id,
          vtc.sip.call_id and vtc.endpoint.device_type as keyword and
          vtc.cms.correlator_index as long. Assert that vtc.media.encrypted is
          only populated when the vendor element was actually present, because
          an absent encryptedMedia element means the media type was not
          present at all and must not become a false.
  - format: api-pull
    enable: >
      Besides pushing XML CDRs to a configured cdrReceiver, the Cisco Meeting
      Server exposes call and participant state through its HTTPS Management
      API on the Web Admin interface. A collector authenticating as an
      API/administrator user over HTTP Basic can GET /api/v1/calls to
      enumerate the active calls and GET /api/v1/callLegs (and GET
      /api/v1/callLegs/<id> for per-leg detail) to walk the individual legs
      inside them; the API returns XML by default and honours an Accept:
      application/json request for JSON. This is a genuine alternate transport
      for the same call/participant substance, but it is a poll of CURRENT
      active state rather than a record of completed calls: a leg that has
      ended is gone from the API, so the pushed CDR remains the only source of
      completed-call detail (durationSeconds, end reason, the callLegEnd
      record). The API is therefore a real-time supplement and a recovery path
      when the CDR receiver is unavailable, collected by a scheduled poller
      rather than by being a passive push target.
    references:
    - >-
      https://www.cisco.com/c/dam/en/us/td/docs/conferencing/ciscoMeetingServer/Reference_Guides/Version-3-11/Cisco-Meeting-Server-API-Reference-Guide-3-11.pdf
    - https://developer.cisco.com/docs/cisco-meeting-server/
    - >-
      https://www.cisco.com/c/en/us/support/conferencing/meeting-server/products-programming-reference-guides-list.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom CMS Management-API poll pipeline, distinct from the CDR pipeline
      notes: >
        No Elastic integration and no Cribl pack covers the Meeting Server
        Management API. Unlike the CUCM CDRonDemand case, this is NOT a
        byte-identical re-collection of the CDR payload: the API's <call> and
        <callLeg> object model uses different element names from the CDR
        record schema, so it needs its own field inventory. That inventory
        could not be sourced for this file - the Cisco Meeting Server API
        Reference Guide is served only from cisco.com hosts that return HTTP
        403 to automated fetchers, and the DevNet primer does not enumerate
        the object elements. The empty fields list below is a declared
        research gap to close on-site against the API Reference Guide, not an
        assertion that the objects carry no fields.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Treat the Management API as a real-time supplement to the CDR feed,
          not a replacement: the API shows only active legs, so completed-call
          detail still has to come from the cdrReceiver push and the two must
          not be conflated. Run a bounded-interval poller on the edge worker
          group authenticated as a read-only API user, walk GET
          /api/v1/callLegs and follow /api/v1/callLegs/<id> for the legs of
          interest, and deduplicate on the callLeg id so a leg seen across
          successive polls becomes one document rather than one per poll.
          Because the poll needs Management-API credentials, keep the
          collector and its secret inside the enclave and let only results
          cross. Prefer the JSON representation (Accept: application/json) so
          the pipeline is not parsing XML on the edge, gate the destination
          with C.Schema(...).validate plus a dead-letter route, and run on
          Persistent Queue backpressure, never Block.
        elastic: >
          Own a custom logs-vtc.cms_cdr ingest pipeline branch for the polled
          state, and keep it separate in intent from the historical CDR
          documents even though both land in the same data stream: the API
          sample is a liveness snapshot and must not be aggregated as if it
          were a completed-call record, or call-duration and call-volume
          dashboards built on the CDR will double-count. Reuse the CDR
          dataset's custom-namespace keyword/long mappings
          (vtc.cms.session_guid, vtc.sip.call_id, vtc.cms.correlator_index)
          where the API exposes the same identifiers so one query resolves a
          call across both the pushed record and the polled state.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) - the poll runs
          low-side because it carries credentials and returns XML/JSON that
          must be decoded next to the collector, so only the flattened result
          crosses and nothing API-shaped is handed to the guard. The
          reconciliation story differs from the CDR's by design: the API
          returns live state, so its per-(dataset, hour) counts will NOT match
          the CDR's completed-record counts and must be reconciled against
          each other only on the shared call/leg identifiers, not on raw
          volume. displayName and remoteParty carry the same far-end free-text
          and URI content-filter friction the CDR relay already flags, so cap
          and flag them low-side.
      direct:
        parse_location: low
        cribl: >
          Run a scheduled GET /api/v1/callLegs poll on the edge worker group
          authenticated as a read-only API user, deduplicate on the callLeg id
          so a leg seen across successive polls becomes one document, and feed
          the custom CMS pipeline. Choose the API poll over the CDR push only
          where live active-call visibility or a CDR-receiver-outage recovery
          path is the need; the CDR push remains the authoritative
          completed-call feed and is simpler where only history matters. Keep
          the collector's API credentials scoped read-only and run the
          destination on Persistent Queue backpressure.
        elastic: >
          Own the custom logs-vtc.cms_cdr ingest pipeline branch for the
          polled state and keep it separate in intent from the historical CDR
          documents even though both land in the same data stream: the API
          sample is a liveness snapshot and must not be aggregated as if it
          were a completed-call record, or call-duration and call-volume
          dashboards built on the CDR will double-count. Reuse the CDR
          dataset's custom-namespace mappings (vtc.cms.session_guid,
          vtc.sip.call_id, vtc.cms.correlator_index) where the API exposes the
          same identifiers so one query resolves a call across both the pushed
          record and the polled state. The pull transport leaves no
          distinguishing fingerprint on the ingested documents, so no separate
          index template is warranted.
    fields_omitted: >
      The Management API's <call> and <callLeg> objects use different element
      names from the CDR record schema, so the "other" entry's cdrReceiver
      inventory does not carry over to this entry. Cisco enumerates those
      object elements only in the Meeting Server API Reference Guide PDF,
      which cisco.com serves only to interactive clients (automated fetches
      are refused), and the DevNet primer does not list them.
    fields: []
- id: endpoint-syslog
  name: Codec endpoint syslog
  description: >
    Thin starter - remote syslog from the room codecs themselves: Cisco RoomOS
    / Collaboration Endpoint devices (the Tandberg-lineage SX, MX, Room Kit
    and Webex Room families, configured through xConfiguration Logging
    External Mode/Protocol/Server Address) and Poly VideoOS systems such as
    the G7500 and Studio X series, configured under Diagnostics > Logs >
    Enable Remote Logging. Both ship over UDP, TCP or TLS to a syslog
    collector. This dataset is deliberately unfinished: neither Cisco nor Poly
    publishes a field reference for the endpoint syslog body the way Cisco
    does for the Expressway event log, so only the syslog envelope fields
    below are firmly documented and the body fields are PLACEHOLDERS. They are
    named as such and parked under vtc.endpoint.* so they are visibly
    provisional. Before this dataset leaves draft, capture a sample from each
    deployed codec model and replace the placeholders with the real message
    grammar - the substance to look for is the call attempt/connect/disconnect
    trio, the far-end address, and the local admin/web-interface session
    outcome, all of which the Expressway and CMS datasets already model
    properly for the infrastructure tier.
  event_categories:
  - network
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Codecs live on the user-facing video VLANs rather than in the
        infrastructure enclave, so this is the VTC feed most likely to arrive
        from a different security domain than the Expressway and CMS feeds for
        the same call.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-vtc.endpoint
    direct:
    - hop: cribl
      location: edge Cribl worker group
      notes: >
        Codecs live on the user-facing video VLANs rather than in the
        infrastructure enclave, so this feed reaches the edge worker group
        from the room-system network, separate from the Expressway and CMS
        infrastructure that carries the same call.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-vtc.endpoint
  formats:
  - format: syslog-raw
    parsing:
      mechanism: cribl-pipeline
      artifact: custom endpoint syslog pipeline (per-model grammar, not yet written)
      notes: >
        No integration and no pack exists, and unlike Expressway there is no
        third-party parser to borrow a grammar from either. The pipeline has
        to be built per codec model from captured samples; until then the
        realistic ingest is envelope extraction with the body left in message.
    fields:
    - vendor: HOSTNAME
      type: string
      description: syslog header hostname of the codec or Poly system that emitted the line
      ecs: host.name
      status: mapped
    - vendor: APP-NAME
      type: string
      description: >-
        syslog header application/process tag identifying the codec subsystem
        that logged the line
      ecs: log.syslog.appname
      status: mapped
      notes: >-
        present on RFC 5424 output; BSD-format senders put the equivalent tag
        at the head of the message body instead
    - vendor: PRI
      type: integer
      description: >-
        syslog priority value from which the facility and severity of the line
        are derived
      ecs: log.syslog.severity.code
      status: partial
      transform: >-
        severity = PRI mod 8, facility = PRI div 8; only the severity half
        belongs in this field
    - vendor: MSG
      type: string
      description: >-
        the free-text message body, vendor-specific and not documented as a
        field grammar by either Cisco or Poly
      ecs: message
      status: mapped
    - vendor: (placeholder) call event token
      type: string
      description: the call attempt/connect/disconnect verb carried inside the message body
      ecs: null
      status: unmapped
      custom: vtc.endpoint.event
      notes: >
        PLACEHOLDER - no published field name exists; replace with the real
        token once samples are captured from each deployed RoomOS and VideoOS
        model
    - vendor: (placeholder) remote party address
      type: string
      description: the far-end SIP URI, H.323 alias or E.164 number carried inside the message body
      ecs: null
      status: unmapped
      custom: vtc.call.remote_party
      notes: >
        PLACEHOLDER - shares the namespace with the CMS remoteParty field so
        the two resolve in one query once the endpoint grammar exists
    - vendor: (placeholder) admin session result
      type: string
      description: the outcome of a local web-interface or SSH administration session on the codec
      ecs: null
      status: unmapped
      custom: vtc.endpoint.admin_outcome
      notes: >
        PLACEHOLDER - endpoint-local admin logons are not visible in the
        Expressway feed, so this is a real coverage gap and not merely a
        naming one
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Until the per-model grammar exists, treat this as an envelope-only
          route on the edge worker group: extract the syslog PRI, hostname and
          app-name, leave the body intact in message, and enrich host to room
          and site from the codec inventory, which is the one thing that makes
          an unparsed endpoint line useful at all. Stand up a sampling route
          that captures a bounded number of distinct message shapes per model
          per day into a side index so the real grammar can be written from
          evidence rather than guessed, and run the destination on Persistent
          Queue backpressure. Because endpoints are the noisiest and least
          structured VTC source, this is also the first place to apply a
          low-side severity floor.
        elastic: >
          Keep a minimal custom logs-vtc.endpoint ingest pipeline that does no
          speculative field extraction - a wrong grok here would silently
          misattribute room-system activity. Derive log.level from the syslog
          severity and set event.category from the data stream, and map
          vtc.endpoint.event, vtc.call.remote_party and
          vtc.endpoint.admin_outcome as keyword in the custom-namespace index
          template now, so the placeholders have somewhere real to land the
          day the grammar is written. Treat the unmapped body as this
          dataset's declared coverage gap rather than as finished work.
        relay: >
          Thin envelope crosses (envelope mode A) - {_dataId, @timestamp,
          host, _raw} with the body carried whole - because there is no
          low-side parser worth running yet and shipping the raw line
          preserves the ability to write the grammar later from data already
          collected. This makes the dataset the worst fit for a content filter
          on the estate: the body is unbounded, unallowlisted vendor free
          text, so the guard owner should expect either a permissive rule for
          this data stream or a hard length cap applied low-side. Carry _raw
          here longer than anywhere else in this map, since _raw is currently
          the entire value of the feed.
      direct:
        parse_location: low
        cribl: >
          Until the per-model grammar exists, treat this as an envelope-only
          route on the edge worker group: extract the syslog PRI, hostname and
          app-name, leave the body intact in message, and enrich host to room
          and site from the codec inventory, which is the one thing that makes
          an unparsed endpoint line useful at all. Stand up a sampling route
          that captures a bounded number of distinct message shapes per model
          per day into a side index so the real grammar can be written from
          evidence rather than guessed, and run the destination on Persistent
          Queue backpressure. Because endpoints are the noisiest and least
          structured VTC source, this is also the first place to apply a
          severity floor at the edge worker group.
        elastic: >
          Keep a minimal custom logs-vtc.endpoint ingest pipeline that does no
          speculative field extraction - a wrong grok here would silently
          misattribute room-system activity. Derive log.level from the syslog
          severity and set event.category from the data stream, and map
          vtc.endpoint.event, vtc.call.remote_party and
          vtc.endpoint.admin_outcome as keyword in the custom-namespace index
          template now, so the placeholders have somewhere real to land the
          day the grammar is written. Treat the unmapped body as this
          dataset's declared coverage gap rather than as finished work.
  - format: webhook
    enable: >
      Cisco RoomOS / Collaboration Endpoint devices can push structured xAPI
      feedback to an HTTP(S) server instead of relying only on the opaque
      remote-syslog body. The codec is registered with xCommand HttpFeedback
      Register, whose parameters are FeedbackSlot (1-4, required - avoid slot
      3 where Cisco TMS is present), ServerUrl (the HTTP(S) endpoint the codec
      POSTs to, required), Format (XML or JSON; XML is the default, JSON is
      preferred here), and up to fifteen Expression paths naming the parts of
      the Status, Configuration and Event trees to monitor. Registering
      Expression /Status/Call and Expression /Event/CallDisconnect makes the
      codec POST a document every time a call changes state or tears down;
      every POST also carries an Identification block naming the emitting
      device (SystemName, MACAddress, IPAddress, SerialNumber) so one
      collector serves many codecs. Unlike the syslog body, these xAPI Status
      and Event objects have a published field schema, which is why this is
      the format to prefer for the call attempt/connect/disconnect substance
      the syslog dataset can only carry as free text. The POST is
      fire-and-forget - the codec does not retry or wait for an
      acknowledgement - so a receiver outage silently drops feedback, which
      shapes the reliability handling below. This alternate is
      RoomOS-specific: Poly VideoOS systems expose only a REST API that
      downloads the same syslog archive and a live-state REST interface,
      neither a documented structured event push, so Poly endpoints stay on
      the syslog route.
    references:
    - https://roomos.cisco.com/xapi/Command.HttpFeedback.Register/
    - https://github.com/cisco-ce/roomos.cisco.com
    - https://roomos.cisco.com/xapi/Event.CallDisconnect/
    - https://roomos.cisco.com/xapi/Status.Call%5Bn%5D.Status/
    - >-
      https://www.cisco.com/c/dam/en/us/td/docs/telepresence/endpoint/roomos-1124/api-reference-guide-roomos-1124.pdf
    parsing:
      mechanism: cribl-pipeline
      artifact: custom RoomOS HttpFeedback pipeline
      notes: >
        No Elastic integration and no Cribl pack ingests RoomOS xAPI
        HttpFeedback to ECS. The field names below are taken from the public
        RoomOS xAPI schema (cisco-ce/roomos.cisco.com, schema 11.24.4.1) for
        the Event CallDisconnect object and the Status Call[n] tree, plus the
        Identification envelope the codec adds to every POST. Because the
        registered Expression set decides which of these are present in a
        given document, the pipeline keys on the object type (a CallDisconnect
        Event versus a Call Status change) rather than assuming a fixed record
        shape, and it should register scoped Expressions rather than the whole
        Status tree to avoid drowning the call events in room-analytics and
        peripheral noise.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Receive the POSTs on an HTTP(S) source on the edge worker group and,
          when the codecs are registered with Format JSON, Extract JSON
          directly; where a codec still emits XML, convert to JSON at the edge
          so one downstream shape serves both. Key each document on its xAPI
          object - a CallDisconnect Event versus a Call Status transition -
          and use the Identification block (SystemName, SerialNumber) to
          enrich host to room and site from the codec inventory, which is the
          single enrichment that makes an endpoint event attributable.
          Normalize Duration from seconds to nanoseconds for event.duration,
          split RemoteURI / RemoteNumber into user and domain parts,
          lower-case Protocol into a real ECS protocol name, and translate
          Direction / OrigCallDirection to ECS inbound/outbound. Deduplicate a
          call across its Status transitions and its final CallDisconnect on
          CallId. Because HttpFeedback is fire-and-forget, run the source on
          Persistent Queue and treat a gap as lost rather than recoverable;
          validate against a Schema Library schema with a dead-letter route
          before the destination.
        elastic: >
          Own the custom logs-vtc.endpoint ingest pipeline and confine it to
          enrichment the low side cannot do: resolving the emitting codec to a
          room and owner and joining a CallDisconnect back to the Call Status
          transitions that preceded it by CallId so one call is one queryable
          session. Map vtc.endpoint.event, vtc.call.remote_party and
          vtc.endpoint.call_id as keyword and vtc.call.disconnect_cause_code
          as long in the custom-namespace index template - these are the
          placeholders the syslog dataset declared, now landing on real
          sourced fields. Assert that event.action is populated for every
          CallDisconnect and Call Status document so a RoomOS release adding a
          call state surfaces as a mapping gap rather than an unclassified
          event.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) - and this is the
          one endpoint feed worth finishing low-side rather than shipping as a
          thin envelope, because the xAPI objects, unlike the syslog body,
          have a bounded documented schema the pipeline can fully parse before
          the crossing. Prefer JSON HttpFeedback low-side so no XML is handed
          to the content filter. DisplayName and RemoteURI remain the filter
          friction - far-end-supplied, unauthenticated free text and URIs that
          can carry unicode and arbitrary length - so cap and flag them
          low-side. Because HttpFeedback is at-most-once with no retry,
          reconcile low-side and high-side counts per (dataset, hour) to
          detect silent drops, exactly as the syslog route does.
      direct:
        parse_location: low
        cribl: >
          Receive the codec POSTs on an HTTP(S) source, extract JSON, enrich
          host to room from the codec inventory, and feed the custom
          logs-vtc.endpoint pipeline. Prefer HttpFeedback over the raw syslog
          route wherever the codecs can reach the collector, since it delivers
          a parseable call record instead of an unparsed line; keep the syslog
          route only for Poly endpoints and for codecs that cannot register
          feedback. Run the source on Persistent Queue and treat a gap as
          lost, since the codec will not resend.
        elastic: >
          Own the custom logs-vtc.endpoint ingest pipeline: resolve the
          emitting codec to a room and owner, stitch each CallDisconnect back
          to the Call Status transitions that preceded it by CallId so one
          call is one queryable session, and own the vtc.endpoint.* and
          vtc.call.* custom mappings. One pipeline serves both the syslog and
          HttpFeedback origins, since the transport leaves no distinguishing
          fingerprint on the ingested documents.
    fields:
    - vendor: Identification.SystemName
      type: string
      description: >-
        configured system name of the emitting codec, present in the
        Identification block on every HttpFeedback POST
      ecs: host.name
      status: mapped
    - vendor: Identification.MACAddress
      type: string
      description: MAC address of the emitting codec, from the POST Identification block
      ecs: host.mac
      status: mapped
    - vendor: Identification.IPAddress
      type: ip
      description: IP address of the emitting codec, from the POST Identification block
      ecs: host.ip
      status: mapped
    - vendor: Identification.SerialNumber
      type: string
      description: hardware serial number of the emitting codec, from the POST Identification block
      ecs: observer.serial_number
      status: mapped
    - vendor: Status/Call[n]/Status
      type: enum
      description: >-
        the call state on a Call status change - Idle, Dialling, Ringing,
        Connecting, EarlyMedia, Connected, OnHold, Preserved, RemotePreserved,
        Disconnecting
      ecs: null
      status: partial
      custom: vtc.endpoint.event
      notes: >
        this is the real token the syslog dataset carried only as a
        placeholder; the Dialling/Ringing/Connected/Disconnecting progression
        is the endpoint's call attempt/connect/disconnect trio, and the
        Connected/Disconnecting sense also feeds a derived event.action rather
        than being copied verbatim
    - vendor: Status/Call[n]/Direction
      type: enum
      description: call direction on a Call status object - Incoming or Outgoing
      ecs: network.direction
      status: mapped
      transform: vendor Incoming/Outgoing are translated to ECS inbound/outbound
    - vendor: Status/Call[n]/Protocol
      type: enum
      description: signaling protocol of the call - Unknown, H323, SIP, Spark or WebRTC
      ecs: network.protocol
      status: mapped
      transform: 'vendor values are lowercased to match ECS''s lowercase protocol-name convention'
    - vendor: Status/Call[n]/CallType
      type: enum
      description: >-
        media type of the call - Audio, AudioCanEscalate, Video,
        ForwardAllCall or Unknown
      ecs: null
      status: unmapped
      custom: vtc.call.media_type
      notes: an audio-vs-video classification of the call, which ECS has no field to hold
    - vendor: Status/Call[n]/RemoteNumber
      type: string
      description: the far-end number or URI of the call as presented to the codec
      ecs: null
      status: partial
      custom: vtc.call.remote_party
      notes: >
        shares the namespace with the CMS remoteParty field so the two resolve
        in one query; it is a dialed address, not a directory account, and the
        user@domain form should be split before use
    - vendor: Status/Call[n]/CallbackNumber
      type: string
      description: the address a user would dial to call the far end back
      ecs: null
      status: unmapped
      custom: vtc.call.callback_number
    - vendor: Status/Call[n]/DisplayName
      type: string
      description: the friendly name presented for the far end of the call
      ecs: user.full_name
      status: partial
      notes: >
        far-end supplied and unauthenticated - blank when the far end provides
        nothing and attacker-controlled when it does, so it must not be
        treated as identity
    - vendor: Status/Call[n]/AnswerState
      type: enum
      description: how the call was answered - Answered, Autoanswered, Ignored or Unanswered
      ecs: null
      status: unmapped
      custom: vtc.call.answer_state
      notes: >-
        an Ignored or Unanswered state on an incoming call is the
        endpoint-side signal of a missed or refused call
    - vendor: Status/Call[n]/Encryption/Type
      type: string
      description: the media encryption type in force on the call
      ecs: null
      status: partial
      custom: vtc.media.encryption
      notes: >
        a string encryption descriptor rather than a boolean; an absent or
        empty value means encryption state was not reported and must not be
        defaulted to unencrypted
    - vendor: Status/Call[n]/Duration
      type: integer
      description: elapsed duration of the call in seconds, as reported on the Call status object
      ecs: event.duration
      status: mapped
      transform: >-
        seconds must be multiplied by 1e9 - ECS event.duration is expressed in
        nanoseconds
    - vendor: Event/CallDisconnect/CallId
      type: integer
      description: >-
        local numeric identifier of the call that disconnected, correlating
        the CallDisconnect event to the Call status transitions for the same
        call
      ecs: null
      status: unmapped
      custom: vtc.endpoint.call_id
      notes: >-
        endpoint-local call id - the join key between a CallDisconnect and its
        preceding Call status objects within one codec, not portable across
        codecs
    - vendor: Event/CallDisconnect/CauseType
      type: string
      description: the category of the disconnect cause, e.g. a local versus remote teardown
      ecs: null
      status: partial
      custom: vtc.call.disconnect_cause_type
      notes: >-
        the human-facing sense of why the leg ended; combined with CauseString
        it is the endpoint analogue of the CMS reason field
    - vendor: Event/CallDisconnect/CauseString
      type: string
      description: human-readable text describing why the call disconnected
      ecs: event.reason
      status: mapped
    - vendor: Event/CallDisconnect/CauseCode
      type: integer
      description: numeric disconnect cause code accompanying the cause string
      ecs: null
      status: unmapped
      custom: vtc.call.disconnect_cause_code
      notes: carried as a long, not a string, so cause-code aggregation is possible
    - vendor: Event/CallDisconnect/CauseOrigin
      type: enum
      description: >-
        the layer that originated the disconnect cause - Internal, SIP, Q850,
        Spark or WebRTC
      ecs: null
      status: unmapped
      custom: vtc.call.disconnect_cause_origin
      notes: >-
        names which signaling layer the CauseCode belongs to, so a SIP 4xx and
        a Q.850 cause are not conflated
    - vendor: Event/CallDisconnect/OrigCallDirection
      type: enum
      description: the original direction of the call that disconnected - Incoming or Outgoing
      ecs: network.direction
      status: partial
      transform: vendor Incoming/Outgoing are translated to ECS inbound/outbound
      notes: >-
        the direction as established at call setup; where a Call status
        Direction is also present for the same CallId they should agree, and
        this one is authoritative for the completed leg
    - vendor: Event/CallDisconnect/Protocol
      type: enum
      description: >-
        signaling protocol of the disconnected call - Unknown, H323, SIP,
        Spark or WebRTC
      ecs: network.protocol
      status: mapped
      transform: vendor values are lowercased
    - vendor: Event/CallDisconnect/Duration
      type: integer
      description: total duration of the call leg in seconds at the point of disconnect
      ecs: event.duration
      status: partial
      transform: seconds must be multiplied by 1e9 for ECS event.duration in nanoseconds
      notes: >-
        the completed-leg duration; where a Call status Duration was also
        carried for the same CallId, the CallDisconnect value is the final
        authoritative one
    - vendor: Event/CallDisconnect/RemoteURI
      type: string
      description: the far-end SIP URI, H.323 alias or number of the call that disconnected
      ecs: null
      status: partial
      custom: vtc.call.remote_party
      notes: >-
        same namespace and same alias-not-account and user@domain-split
        caveats as the Call status RemoteNumber
    - vendor: Event/CallDisconnect/RequestedURI
      type: string
      description: >-
        the URI originally requested for the call, before any redirection or
        transform, as recorded on disconnect
      ecs: null
      status: unmapped
      custom: vtc.call.requested_uri
      notes: >-
        differs from RemoteURI when the call was forwarded or transformed, so
        both are kept to expose the redirection
    - vendor: Event/CallDisconnect/DisplayName
      type: string
      description: the friendly name of the far end of the disconnected call
      ecs: user.full_name
      status: partial
      notes: same far-end-supplied, unauthenticated caveat as the Call status DisplayName
    - vendor: Event/CallDisconnect/Encryption
      type: string
      description: the media encryption state of the call leg at disconnect
      ecs: null
      status: partial
      custom: vtc.media.encryption
      notes: >-
        same string-not-boolean caveat as the Call status Encryption Type; an
        absent value is not a report of unencrypted media
