id: everfox-hsg
name: Everfox High Speed Guard Audit
vendor: Everfox
versions: >-
  High Speed Guard and High Speed Guard SP (build/version not publicly
  documented; audit configuration is per-deployment)
draft: true
references:
- https://www.everfox.com/products/cross-domain-solutions/high-speed-guard
- >-
  https://assets.everfox.com/app/uploads/2025/10/03102214/HighSpeedGuard_Datasheet_v1.0_092025.pdf
- >-
  https://assets.everfox.com/app/uploads/2024/03/19161733/Datasheet_High_Speed_Guard-en-031224.pdf
- https://www.everfox.com/products/cross-domain-solutions
- >-
  https://www.glasswall.com/blog/raise-the-bar-sets-high-standards-for-cross-domain-solutions-5-key-challenges-for-cds-vendors
datasets:
- id: transfer-audit
  name: Transfer and filter-verdict audit
  description: |
    The cross-domain guard appliance itself as a LOG SOURCE - its own data transfer logging, one record per cross-domain transfer attempt (file, stream, message or web-service request) with the Rule Engine / Filtering Engine verdict and the disposition of any object that failed validation. This is the highest-value guard feed for a SOC: it is where a blocked transfer, a dirty-word or format-validation failure, and an object diverted to the problem/trouble queue become visible.
    HONESTY WARNING - READ BEFORE USING THIS MAP (applies to all three datasets). Everfox High Speed Guard field-level documentation is controlled and is NOT public: there is no vendor log/field reference, no Elastic integration and no Cribl pack for this product. The vendor names in this file are therefore PLACEHOLDER CONCEPT NAMES describing what each audit record is expected to carry, not documented vendor column names, and every field is deliberately marked partial or unmapped rather than mapped. The datasheet is explicit that each deployment is enhanced with auditing specific to that deployment's data flows and security policies, driven by the site's own Rule and Filtering Engines - so the record layout is genuinely site-specific, not merely undocumented. Every vendor name, type and vocabulary here MUST be confirmed against the deployed guard's local documentation (site audit configuration, Rule/Filter Engine policy, and Administration Server audit settings) before any parser or alert is built on it. What IS vendor-documented is the shape of the feed: HSG runs on a hardened Red Hat Enterprise Linux + SELinux base and supports local and remote log consolidation of the standard operating system syslog, binary auditing, and data transfer logging, with all log and audit data collected, parsed and reduced for immediate administrator notification and streamable in real time to a collection server.
    CROSSING TRANSPORT - CONFIRMED BY THE DEPLOYMENT OWNER, and it resolves for the SIEM log flow the question of which HSG transfer mechanism carries our traffic (it does not resolve the audit record layout above, which stays per-deployment). CURRENT: the low-side Cribl ships through a Cribl Syslog Destination, using the __syslogout internal field whose value is a CEF-structured string; the high-side Cribl receives each message as _raw containing a JSON object string, runs a Parser function (Extract JSON) over _raw, adds Cribl fields, and ships to Routes. So the mechanism in use today is the messaging/syslog path, not AST file drop. PLANNED (go-forward, and the plan of record): low-side Cribl HTTP Destination -> guard -> high-side Cribl HTTP Source, retiring the syslog/CEF leg entirely and confirming the HTTP-style (SOA web services) mechanism for this flow, which is what the NDJSON doctrine in every relay recommendation across these maps assumes. OPEN SUB-QUESTION for the guard owner: the current leg is emitted CEF-shaped and arrives JSON-shaped, so something between the two re-envelopes it - whether the guard re-serializes into a JSON envelope or the low side wraps before the syslog destination is NOT established and must be confirmed rather than guessed.
  event_categories:
  - file
  - network
  route:
    direct:
    - hop: cribl
      location: core worker group, Elastic side
      notes: >
        The guard IS the source of this dataset, not a hop on it, so no guard
        hop is drawn on its own routes. HSG streams its own audit and transfer
        logs in real time to a collection server / Audit Review System, which
        forwards to Cribl; NCDSMO Raise-the-Bar expects an active CDS to
        deliver its audit trail to defensive-cyber monitoring, so this feed is
        mandatory rather than optional. The HIGH-side guard's audit egresses
        on the Elastic side and reaches Cribl direct, crossing no additional
        guard. The LOW-side guard's audit is itself a low-side source - its
        records cross the boundary through the very device they describe, on
        the same crossing every other low-side technology uses.
    - hop: elastic
      data_stream: logs-everfox_hsg.transfer
  formats:
  - format: syslog-raw
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Everfox HSG audit pipeline
      notes: >
        No Elastic integration and no Cribl pack exists for Everfox High Speed
        Guard, so a hand-built pipeline is the only option. The format is
        recorded as syslog-raw deliberately: the vendor documents remote
        consolidation of syslog/binary/transfer audit but publishes no on-wire
        record structure, and the deployment may well emit key=value or
        delimited text instead. Step one of any parsing work is to capture
        real records off the collection server and confirm the actual
        delimiter, field order and vocabularies against the deployed guard's
        local documentation; the field list below is a skeleton to plan
        against, not a parser spec. Scope that uncertainty correctly: it
        applies to the guard's OWN audit records, not to the crossing, which
        is confirmed - a Cribl Syslog Destination on __syslogout carrying a
        CEF-structured string today, with the high side parsing _raw through
        Extract JSON before Cribl fields and Routes, moving to Cribl HTTP
        Destination -> guard -> Cribl HTTP Source. The one piece still open on
        the current leg is where the JSON envelope the high side sees is
        created (guard re-serialization versus low-side wrapping), which the
        guard owner has to answer.
    fields:
    - vendor: event_time
      type: timestamp
      description: time the guard recorded the transfer attempt
      ecs: '@timestamp'
      status: partial
      notes: >
        placeholder name; confirm the emitted format and whether the guard
        clock is UTC before trusting it over the syslog envelope timestamp
        added on receipt
    - vendor: guard_name
      type: string
      description: hostname or configured name of the guard instance that processed the transfer
      ecs: observer.name
      status: partial
      notes: >
        placeholder name; a single Administration Server fronts ten or more
        guards, so this discriminator must be present or derived from the
        collection-server source address
    - vendor: transfer_mechanism
      type: enum
      description: which HSG transfer mechanism handled the object
      ecs: null
      status: unmapped
      custom: everfox.hsg.transfer.mechanism
      notes: >
        the documented mechanisms are Automated Secure Transfer (AST, SCP/FTP
        drop-box), High-Performance File Streaming (JAS/DTP), SOA web services
        (SOAP/HTTP), streaming video (MPEG transport stream), adaptable
        lightweight UDP/TCP messaging, and cross-domain SNMP; the emitted
        token for each is deployment-specific and must be confirmed. Which
        mechanism carries the SIEM log flow is no longer open, though: it is
        the messaging/syslog path today (Cribl Syslog Destination on
        __syslogout) and the HTTP/SOA web-services path once the confirmed
        HTTP Destination -> HTTP Source plan lands, so the tokens for those
        two are the ones to confirm first if this dataset is used to reconcile
        our own crossing
    - vendor: transfer_id
      type: string
      description: identifier correlating the records emitted for a single transfer attempt
      ecs: null
      status: unmapped
      custom: everfox.hsg.transfer.id
      notes: >
        expected to tie the accept/inspect/deliver (or reject) records of one
        object together; no ECS equivalent, and its existence and name must be
        confirmed per deployment
    - vendor: source_domain
      type: string
      description: name of the network/enclave the object was received from
      ecs: observer.ingress.zone
      status: partial
      notes: >
        the low/high side identity is the single most important triage field
        on this dataset; expect a site-defined enclave label rather than
        anything standard
    - vendor: destination_domain
      type: string
      description: name of the network/enclave the object was released to
      ecs: observer.egress.zone
      status: partial
      notes: >
        a single input can be sent to multiple destinations across multiple
        networks, so this may repeat per destination or appear as a list -
        confirm cardinality before mapping
    - vendor: source_address
      type: ip
      description: address of the sending system or source file server on the origin network
      ecs: source.ip
      status: partial
      notes: >
        may be emitted as a hostname rather than an address for the AST
        drop-box mechanism; use source.address instead if so
    - vendor: destination_address
      type: ip
      description: address of the receiving system on the destination network
      ecs: destination.ip
      status: partial
      notes: same hostname-versus-address caveat as source_address
    - vendor: object_name
      type: string
      description: name of the transferred object
      ecs: file.name
      status: partial
      notes: >
        only file-like for the AST and JAS/DTP mechanisms; for streaming
        video, messaging and web-service flows this position is expected to
        carry a stream, topic or endpoint identifier instead, so file.name is
        wrong for those subtypes and they likely need a separate mapping
        branch
    - vendor: object_size
      type: bytes
      description: size in bytes of the object presented for transfer
      ecs: file.size
      status: partial
      notes: >
        for continuous streaming flows a byte count for the interval
        (network.bytes) is a better target than file.size; confirm which
        semantics the deployment emits
    - vendor: filter_name
      type: string
      description: >-
        name of the Rule Engine rule or Filtering Engine filter that evaluated
        the object
      ecs: rule.name
      status: partial
      notes: >
        the two documented engines (Rule Engine and Filtering Engine) are
        separately configured, so expect either two fields or an engine
        discriminator alongside this one
    - vendor: verdict
      type: enum
      description: 'the guard''s decision on the object - released, blocked, or failed validation'
      ecs: event.outcome
      status: partial
      transform: >
        the verdict vocabulary is defined by the deployment's security policy,
        not by the product, so it needs a site-specific lookup to ECS
        success/failure; the raw token should also be preserved on
        event.action because "blocked by filter" and "delivery failed" are
        operationally very different and both collapse to failure
    - vendor: failure_reason
      type: string
      description: >-
        why the object was rejected - format validation, dirty-word/content
        check, size, or unsupported type
      ecs: event.reason
      status: partial
      notes: >
        expected to be free text; this is the field CSOC content will lean on
        hardest, and it is the one most likely to be length-capped or reduced
        by the guard's own log-reduction stage
    - vendor: disposition
      type: string
      description: what happened to an object that failed validation
      ecs: null
      status: unmapped
      custom: everfox.hsg.transfer.disposition
      notes: >
        the datasheet documents that failed files can be automatically
        redirected to another guard (e.g. Everfox Trusted Gateway System) or
        placed in a problem/trouble queue on the source system for review; a
        sudden rise in queue dispositions is a real detection opportunity
    - vendor: content_label
      type: string
      description: classification and release-caveat metadata extracted from the object
      ecs: null
      status: unmapped
      custom: everfox.hsg.content.classification
      notes: >
        documented for the streaming-video mechanism, where the guard
        extracts, audits and validates STANAG 4609 key-length-value metadata
        including classification and release caveats; treat the value itself
        as sensitive and confirm it is permitted to land in the SIEM before
        mapping it
    recommendations:
      direct:
        parse_location: low
        cribl: >
          Do not write a parser first: capture real records off the collection
          server and confirm delimiter, field order and vocabularies against
          the deployed guard's local documentation, then build the low-side
          pipeline against confirmed names only — every field below is a
          placeholder and a parser built on guesses will silently mis-map.
          Once names are confirmed, the low-side work is a site-specific
          verdict lookup that derives event.outcome while preserving the raw
          token on event.action (a filter block and a delivery failure must
          stay distinguishable), a branch on transfer_mechanism so file-like
          flows populate file.name while stream, topic and endpoint
          identifiers do not, and deriving the guard discriminator from the
          collection-server source address when the record omits it. Gate the
          Elastic destination with Persistent Queue backpressure, cap the
          free-text failure_reason to a flagged length, and make the decision
          to forward or drop content_label explicit in the pipeline rather
          than incidental, since classification and release caveats may not be
          permitted to land in the SIEM.
        elastic: >
          No integration exists, so own a custom logs-everfox_hsg.transfer
          ingest pipeline and explicit custom-namespace index-template
          mappings — everfox.hsg.transfer.mechanism, .id and .disposition and
          everfox.hsg.content.classification as keyword, object_size as long —
          because dynamic mapping on a skeleton this uncertain will lock in
          wrong types before the field names are even confirmed. This dataset
          is the observability backbone of the whole relay doctrine: it is the
          guard-side record of what actually crossed, so build the
          per-(dataset, hour) reconciliation view here — guard-reported
          released counts against low-side sent and high-side received counts
          — since the crossing is at-most-once with no acknowledgement and
          this feed is the only independent truth about silent drops for every
          other technology. Alert on disposition shifting toward the
          problem/trouble queue and on blocked verdicts by
          (observer.ingress.zone, rule.name).
- id: system-audit
  name: Guard operating-system and integrity audit
  description: >
    The guard platform's own security audit - hardened RHEL/SELinux syslog
    plus binary (kernel) auditing, service state, and the file-system
    integrity checking and local configuration monitoring the guard runs
    against itself. Integrity failure is the critical event here: the
    datasheet states it can halt the server outright or terminate services so
    that transfer mechanisms stop. FIELD NAMES BELOW ARE PLACEHOLDERS pending
    confirmation against the deployed guard's local documentation.
  event_categories:
  - process
  - configuration
  route:
    direct:
    - hop: cribl
      location: core worker group, Elastic side
      notes: >
        Same shape as the transfer audit above - the guard is the source, so
        no guard hop is drawn on its own route. The high-side guard's platform
        audit reaches Cribl direct and crosses no additional guard; the
        LOW-side guard's platform audit is a low-side source whose records
        cross the boundary through the device they describe.
    - hop: elastic
      data_stream: logs-everfox_hsg.system
  formats:
  - format: syslog-raw
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Everfox HSG audit pipeline
      notes: >
        The platform is derived from Red Hat Enterprise Linux with SELinux
        modules, so the binary-auditing portion is expected to be
        auditd-shaped and the existing linux-auditd pipeline should be
        evaluated for reuse before anything bespoke is written. The guard is
        deliberately minimized and locked down, so do NOT assume a stock RHEL
        record set - confirm against the local documentation which record
        types the audit configuration actually emits.
    fields:
    - vendor: event_time
      type: timestamp
      description: time the guard platform recorded the event
      ecs: '@timestamp'
      status: partial
      notes: placeholder name; same clock/timezone confirmation as the transfer audit
    - vendor: hostname
      type: string
      description: hostname of the guard platform that emitted the record
      ecs: host.name
      status: partial
      notes: >
        placeholder name; also populate observer.name for consistency with the
        transfer audit so both datasets pivot on one field
    - vendor: audit_record_type
      type: string
      description: type of the binary-audit record, driving which other fields are present
      ecs: null
      status: unmapped
      custom: everfox.hsg.audit.record_type
      notes: >
        expected to be auditd-like (SYSCALL/USER_AUTH/AVC and guard-specific
        types) given the RHEL+SELinux base, but the minimized build's actual
        record set must be confirmed
    - vendor: service_name
      type: string
      description: guard daemon or transfer service the record concerns
      ecs: service.name
      status: partial
      notes: >
        transfer-mechanism service names are deployment-specific; needed to
        tell an integrity-driven service stop from a routine restart
    - vendor: process_name
      type: string
      description: name of the process that generated or is the subject of the record
      ecs: process.name
      status: partial
    - vendor: process_id
      type: integer
      description: process id of the subject process
      ecs: process.pid
      status: partial
    - vendor: user_name
      type: string
      description: account the audited action ran as or was performed by
      ecs: user.name
      status: partial
      notes: >
        may be emitted as a numeric uid rather than a name on binary-audit
        records; if so map to user.id and enrich
    - vendor: severity
      type: enum
      description: syslog-style severity of the record
      ecs: log.level
      status: partial
      transform: >
        if emitted as a numeric syslog priority it needs decoding to a level
        name for log.level, and a separate lookup if event.severity is also
        wanted for alert thresholds
    - vendor: integrity_check_result
      type: enum
      description: outcome of a file-system integrity check or local configuration-monitoring pass
      ecs: event.outcome
      status: partial
      transform: >
        integrity validation runs on a customer-defined interval (typically
        twice a day per the datasheet), so a failure value here is both rare
        and high-severity; confirm the emitted vocabulary and alert on any
        non-success
    - vendor: integrity_target
      type: string
      description: file or configuration object whose integrity check failed
      ecs: file.path
      status: partial
      notes: >
        expected only on failing checks; confirm whether a hash is also
        emitted, in which case file.hash.sha256 becomes available
    - vendor: alert_type
      type: string
      description: category of the real-time administrator notification the guard raised
      ecs: null
      status: unmapped
      custom: everfox.hsg.alert.type
      notes: >
        the guard collects, parses and reduces its own audit data to notify
        administrators immediately of security events; that reduction stage is
        expected to stamp a notification category worth carrying through as a
        triage key
    - vendor: message
      type: string
      description: rendered text of the platform audit record
      ecs: message
      status: partial
      notes: >
        keep the raw record verbatim in message until the record set is
        confirmed - it is the only safe home for the fields this skeleton has
        guessed wrong
    recommendations:
      direct:
        parse_location: low
        cribl: >
          Before writing anything bespoke, diff the guard's record set against
          the existing linux-auditd pipeline and reuse it for the binary-audit
          half — the RHEL/SELinux base means SYSCALL, USER_AUTH and AVC
          records are likely already handled, and only the guard-specific
          record types and the minimized build's omissions need new work.
          Low-side, decode the numeric syslog priority into a log.level name
          and keep a separate lookup for event.severity if alert thresholds
          want it, normalize numeric uids to user.id with enrichment deferred
          high-side, and populate host.name and observer.name from the same
          value so this dataset pivots against the transfer audit. Keep the
          full raw record verbatim in message throughout the confirmation
          phase — it is the only safe home for fields this skeleton has
          guessed wrong — and run the destination on Persistent Queue
          backpressure so integrity-failure records are never the ones shed.
        elastic: >
          Run a custom logs-everfox_hsg.system ingest pipeline, cloning the
          linux-auditd normalization where the record set matches rather than
          duplicating it, and map everfox.hsg.audit.record_type and
          everfox.hsg.alert.type as keyword in a custom-namespace index
          template so triage can pivot on the guard's own notification
          category. Assert integrity_check_result onto event.outcome through a
          confirmed site vocabulary and alert on any non-success: the check
          runs on a defined interval (roughly twice daily) and can halt the
          server or stop transfer services outright, so a single failure is
          both rare and a boundary-down event. Add file.hash.sha256 to the
          template now in case the deployment emits a hash alongside
          integrity_target, and treat absence of these records entirely as a
          finding rather than as quiet.
- id: admin-audit
  name: Administration Server audit
  description: >
    Administrative and configuration-management activity on the separate
    Administration Server that fronts the guards - login, configuration change
    against the controlled baseline, two-person integrity approval,
    backup/restore, and administrator account management. A single
    Administration Server supports ten or more guards, so one compromised
    admin session has enterprise-wide reach. FIELD NAMES BELOW ARE
    PLACEHOLDERS pending confirmation against the deployed guard's local
    documentation.
  event_categories:
  - configuration
  - iam
  route:
    direct:
    - hop: cribl
      location: core worker group, Elastic side
      notes: >
        The Administration Server sits on separate hardware from the guard's
        data path and is the source of this dataset, so no guard hop is drawn
        on its own route. A high-side Administration Server reaches Cribl
        direct and crosses no additional guard; a low-side one is a low-side
        source whose audit crosses the boundary on the same crossing every
        other low-side technology uses. Still to confirm locally: whether the
        Administration Server's audit egresses on the same collection-server
        path as the guard platform audit.
    - hop: elastic
      data_stream: logs-everfox_hsg.admin
  formats:
  - format: syslog-raw
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Everfox HSG audit pipeline
      notes: >
        Same hand-built pipeline family as the other two datasets. The
        Administration Server's audit settings are themselves
        administrator-configurable, so confirm what is enabled locally before
        assuming any of these records are emitted at all.
    fields:
    - vendor: event_time
      type: timestamp
      description: time the Administration Server recorded the action
      ecs: '@timestamp'
      status: partial
    - vendor: admin_server_name
      type: string
      description: hostname of the Administration Server that recorded the action
      ecs: observer.name
      status: partial
    - vendor: managed_guard_name
      type: string
      description: which guard instance the administrative action was directed at
      ecs: host.target.name
      status: partial
      custom: everfox.hsg.admin.managed_guard
      notes: >
        one Administration Server manages ten or more guards, so without this
        discriminator a config change cannot be attributed to a boundary; if
        the record does not carry it, that is itself a finding to raise with
        the device owner. ECS 9.4 promotes host.target.* to GA and that is the
        correct home for this concept - the administered guard is the host
        being acted upon, not the host emitting the record (the Administration
        Server, which stays on observer.name). It remains partial and keeps
        the custom key because the vendor name here is still a placeholder and
        the field's existence is unconfirmed; host.target.id or host.target.ip
        are available too if the record carries a guard identifier or address
        instead of a name.
    - vendor: admin_user
      type: string
      description: administrator account that performed the action
      ecs: user.name
      status: partial
    - vendor: admin_action
      type: enum
      description: >-
        administrative operation performed - configuration change, backup,
        restore, account management, audit-setting change
      ecs: event.action
      status: partial
      transform: >
        the documented administrative functions are backup, restoration,
        configuration, logging, auditing, real-time alerting and administrator
        account management; the emitted tokens are not public and need a site
        lookup to a stable action vocabulary
    - vendor: action_result
      type: enum
      description: whether the administrative action succeeded
      ecs: event.outcome
      status: partial
      transform: >
        confirm the success/failure vocabulary; note that a change can be
        submitted and still be pending its second approval, which is a third
        state that does not collapse cleanly to success/failure
    - vendor: config_object
      type: string
      description: configuration item changed, relative to the controlled baseline
      ecs: null
      status: unmapped
      custom: everfox.hsg.config.object
      notes: >
        the configuration manager preserves a controlled baseline of all guard
        configurations; a change to a Rule or Filter Engine object is the
        single highest-value alert on this technology
    - vendor: baseline_version
      type: string
      description: configuration baseline or version identifier before/after the change
      ecs: null
      status: unmapped
      custom: everfox.hsg.config.baseline_version
      notes: >
        configuration management enforces retention of prior configuration
        versions; confirm whether one field or a before/after pair is emitted
    - vendor: second_approver
      type: string
      description: second administrator account that approved the change under two-person control
      ecs: null
      status: unmapped
      custom: everfox.hsg.admin.second_approver
      notes: >
        the datasheet states configuration management ensures strict adherence
        to two-person integrity controls; a change recorded without a distinct
        second approver is a direct detection opportunity, so confirm this
        field exists and is populated
    - vendor: source_address
      type: ip
      description: address of the workstation the administrative session originated from
      ecs: source.ip
      status: partial
      notes: >
        the Administration Server can be accessed directly at the console or
        remotely depending on customer configuration; expect this to be absent
        or loopback for console sessions
    recommendations:
      direct:
        parse_location: low
        cribl: >
          First confirm with the Administration Server owner which audit
          settings are actually enabled — the settings are themselves
          administrator- configurable, so the prior question is not how to
          parse these records but whether they are emitted at all, and any gap
          (especially a missing managed_guard_name or second_approver) is a
          finding to raise rather than a parsing problem. Low-side, carry a
          site lookup mapping the emitted admin_action tokens onto a stable
          action vocabulary and resolve action_result into event.outcome while
          preserving the raw token, because a change awaiting its second
          approval is a third state that must not collapse into success or
          failure. Populate host.target.name from the administered guard and
          keep observer.name on the Administration Server itself so config
          changes attribute to a boundary, and tolerate an absent or loopback
          source_address for console sessions instead of dropping the record.
        elastic: >
          Own a custom logs-everfox_hsg.admin ingest pipeline and add
          custom-namespace index-template mappings for
          everfox.hsg.config.object, .config.baseline_version,
          .admin.second_approver and .admin.managed_guard as keyword, plus
          host.target.name/.id/.ip per ECS 9.4 so the administered-guard
          concept has a stable GA home. The two detections worth building the
          pipeline around are a configuration change touching a Rule or Filter
          Engine object — the highest-value alert on this technology — and any
          change recorded with a missing second_approver or with
          second_approver equal to admin_user, which is a direct
          two-person-integrity bypass. Model baseline_version as a
          before/after pair from the start so a change can be diffed even if
          the deployment turns out to emit only one field.
