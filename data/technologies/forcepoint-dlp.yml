id: forcepoint-dlp
name: Forcepoint DLP
vendor: Forcepoint
versions: >-
  8.5.x, 9.0, 10.0–10.4 (on-prem Forcepoint Security Manager, Data Security
  module); audit-log and system-log syslog channels require 10.2+
draft: true
references:
- >-
  https://help.forcepoint.com/dlp/10.3.0/dlphelp/B9749178-B5F4-4096-B122-2D4D312B4FFF.html
- >-
  https://help.forcepoint.com/dlp/10.4.0/dlphelp/4A2A1968-75E6-45B3-B409-6EE4115CB493.html
- >-
  https://help.forcepoint.com/dlp/10/dlphelp/BF6F5020-4416-47D7-A746-0EA8BDD2873A.html
- >-
  https://help.forcepoint.com/dlp/10/dlphelp/E3547D70-A432-45B8-B365-333844B3AC72.html
- >-
  https://help.forcepoint.com/dlp/90/dlphelp/16D78CD9-26FF-43C7-A052-7A55E2069CB9.html
- >-
  https://help.forcepoint.com/dlp/10.2.0/release-notes/guid-bccde6d3-db0d-4455-9a91-4a38062ebbdb.html
- >-
  https://help.forcepoint.com/dlp/10/dlphelp/B3E8968C-3243-4141-95F2-C2D600321611.html
- >-
  https://help.forcepoint.com/dlp/90/dlphelp/D4D53F72-6D36-4D3A-8219-8D8F761E6685.html
- https://library.humio.com/integrations/integrations-forcepoint-dlp.html
- >-
  https://docs.cloud.google.com/chronicle/docs/ingestion/default-parsers/forcepoint-dlp
datasets:
- id: incident
  name: DLP incident (policy violation)
  description: >
    One record per data loss policy violation detected by a policy engine —
    the Forcepoint DLP core stream and the only reason a SOC ingests this
    product. The Data Security module of the Forcepoint Security Manager emits
    it over syslog when a policy's action plan selects "Audit Incident > Send
    Syslog Message"; the syslog server and port are set once at Settings >
    General > Remediation. Two predefined format strings exist — plain
    syslog/CEF (the ArcSight form, modelled here because that is what the
    legacy ArcSight SmartConnector already receives) and the ArcSight "Audit
    Quality SIEM" form, which is the same CEF record with severityType,
    sourceHost, productVersion, maxMatches, timeStamp, destinationHosts and
    apVersion appended. Field names below are the CEF extension keys, with the
    vendor's template variable in parentheses. Important scoping note: the
    sourceServiceName (channel) key spans network, email, web, discovery AND
    endpoint channels — Endpoint Printing, Endpoint Removable Media, Endpoint
    Application, Endpoint LAN — so records from this single stream blur into
    the endpoint category even though the catalog places the technology under
    web-mail-gateway; alert content should branch on channel rather than
    assume a gateway. Coverage caveat for the SOC: syslog is a per-action-plan
    opt-in, so any policy whose action plan omits the syslog action is
    silently absent from this feed.
  event_categories:
  - file
  - web
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Receives the Security Manager's syslog/CEF stream on a Cribl Syslog
        source (UDP/514 by default, configured at Settings > General >
        Remediation). The low-side crossing is the one to scrutinize here,
        because DLP incident details carry excerpts of the matched sensitive
        content itself.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_dlp.incident
      notes: >
        Custom data stream — no Elastic integration exists for Forcepoint DLP
        (the shipped forcepoint_web package covers Web Security only), so the
        data stream, index template and ingest pipeline are all local work.
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Receives the Security Manager's syslog/CEF stream on a Cribl Syslog
        source (UDP/514 by default, configured at Settings > General >
        Remediation) and forwards to Elastic on the same side with no guard in
        the path.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_dlp.incident
      notes: >
        Custom data stream — no Elastic integration exists for Forcepoint DLP
        (the shipped forcepoint_web package covers Web Security only), so the
        data stream, index template and ingest pipeline are all local work.
  formats:
  - format: syslog-cef
    recommended: true
    recommended_because: >-
      the CEF push is the SIEM-integration path Forcepoint documents and needs
      no REST service or application-administrator account; it is parsed low-
      side, so the guard crossing still carries NDJSON. The REST collector
      adds one field for a scheduled poll and a custom pipeline.
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Forcepoint DLP CEF pipeline
      notes: >
        No Elastic integration and no vendor Cribl pack exists for Forcepoint
        DLP. Plan is a Cribl pipeline built on the generic CEF parser (the
        Cribl Pack for Syslog Input handles the syslog framing) that branches
        on the CEF Name header, which is the only discriminator between the
        three message families sharing this transport: "DLP Syslog" (incidents
        and risk-ranking cases), "DLP Audit Log" and "DLP System Log".
        Incidents and cases share the "DLP Syslog" name, so the pipeline must
        additionally test for the presence of riskScore to split them. Several
        keys (duser, destinationHosts, cat, fname) are comma-separated lists
        packed into one CEF value and have to be split into arrays before they
        are usable.
    fields:
    - vendor: Signature ID (id)
      type: string
      description: Incident (event) ID assigned by the Security Manager, carried in the CEF header.
      ecs: event.id
      status: mapped
      notes: >
        the stable join key back to the incident record in the Security
        Manager and to the eventIDs list in the risk-ranking-case dataset; the
        CEF header Signature ID is the incident id here, not a detection-rule
        signature, so it must not be written to rule.id
    - vendor: severity (CEF header)
      type: integer
      description: >-
        CEF header severity for the incident, derived by the product from the
        incident's severity level.
      ecs: event.severity
      status: partial
      transform: >
        a coarse restatement of severityType (low/medium/high), not an
        independent risk score; keep it for CEF fidelity but drive alert
        thresholds from severityType or riskScore instead
    - vendor: severityType
      type: enum
      description: Incident severity as shown in the console — LOW, MEDIUM or HIGH.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.severity_type
      notes: >
        only present in the ArcSight Audit Quality SIEM format string, not in
        the plain syslog/CEF string — confirm which predefined format the
        deployment selected, because choosing the plain one also costs
        sourceHost, maxMatches, timeStamp and destinationHosts. This is the
        authoritative severity the analyst sees; ECS has no severity-label
        field, so it stays custom alongside the numeric event.severity
    - vendor: act (action)
      type: enum
      description: >-
        Action the action plan applied to the transaction — permitted,
        blocked, quarantined, encrypted, and so on.
      ecs: event.action
      status: mapped
      transform: >
        also drives event.outcome: blocked, quarantined and encrypted are
        successful policy enforcements and must map to success with a
        distinguishing action, never failure. There is no separate outcome key
        in either predefined format string.
    - vendor: sourceServiceName (channel)
      type: string
      description: >-
        Channel the violating transaction travelled over — e.g. SMTP,
        HTTP/HTTPS, FTP, Endpoint Printing, Endpoint Removable Media, Endpoint
        Application, Endpoint Email, Discovery.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.channel
      notes: >
        the single most important Forcepoint-specific field and the one with
        no ECS home. It decides how suser, duser and destinationHosts should
        be interpreted, and it is what makes this technology straddle two
        catalog categories — the Endpoint* values are endpoint-agent events
        arriving on a web-mail-gateway-classified feed. Store a coarse derived
        facet (network / email / web / endpoint / discovery) next to the raw
        value so dashboards do not have to enumerate vendor strings.
    - vendor: analyzedBy (policyEngineName)
      type: string
      description: >-
        Name of the policy engine / sensor that analyzed the traffic and
        raised the incident.
      ecs: observer.name
      status: mapped
      notes: >
        identifies the analyzing component (protector, Security Manager policy
        engine, endpoint agent), not the host the data loss happened on —
        host.* is reserved for sourceHost
    - vendor: cat (policyCategories)
      type: string
      description: Policy categories the violated policy belongs to.
      ecs: rule.category
      status: partial
      transform: >
        comma-separated list packed into one CEF value; split into an array
        before alerting on a category. rule.name is deliberately left empty in
        the predefined string — the specific policy and rule names are only
        obtainable via a Custom format string, so push for one if the SOC
        needs per-rule alerting.
    - vendor: suser (source)
      type: string
      description: Incident source — the user, address, or share the sensitive data came from.
      ecs: source.user.name
      status: partial
      transform: >
        channel-dependent: an email address on SMTP/Endpoint Email, a
        directory user on web and endpoint channels, and a machine or UNC
        share path on discovery. The pipeline must branch on sourceServiceName
        and route the non-user forms to source.address rather than indexing a
        share path as a username.
    - vendor: loginName
      type: string
      description: Login name or sAMAccountName of the user associated with the incident.
      ecs: user.name
      status: mapped
      notes: >
        the clean directory join key of the two identity fields and the one to
        build user-centric alerting on; empty when the source could not be
        resolved to a directory account (common on unauthenticated
        network-channel incidents)
    - vendor: duser (destinations)
      type: string
      description: >-
        Incident destinations — recipients, URLs, printers, or devices the
        data was headed to.
      ecs: destination.user.name
      status: partial
      transform: >
        comma-separated list, and only actually a user on the email channels;
        on web it is a URL, on Endpoint Printing a printer name, on Endpoint
        Removable Media a device identifier. Split into an array and route
        channel-aware — a printer name in destination.user.name poisons any
        recipient-based alert.
    - vendor: destinationHosts
      type: string
      description: Hostnames, IP addresses, or URLs of the incident destinations.
      ecs: destination.address
      status: partial
      transform: >
        comma-separated mixed list (e.g. "ACCOUNTS.GOOGLE.COM,10.0.17.2");
        split, then type-test each element so IPs also populate destination.ip
        and names also populate destination.domain. Audit Quality SIEM format
        only.
    - vendor: sourceIp
      type: ip
      description: IP address of the machine where the data loss is occurring.
      ecs: source.ip
      status: mapped
    - vendor: sourceHost
      type: string
      description: Hostname or IP address of the incident source machine.
      ecs: host.name
      status: partial
      transform: >
        may hold either a hostname or an IP, so it needs a conditional split
        to host.name vs host.ip. This is the endpoint or server the violation
        occurred on — distinct from analyzedBy, which is the component that
        inspected it. Audit Quality SIEM format only.
    - vendor: fname (attachments)
      type: string
      description: Names of the files attached to or transferred in the violating transaction.
      ecs: file.name
      status: partial
      transform: >
        comma-separated list of file names; split into an array. Empty on
        channels that carry no files (web form posts, LAN control), and
        populated with the discovered file path on discovery incidents.
    - vendor: msg (details)
      type: string
      description: Free-text incident details describing what was detected and why.
      ecs: message
      status: mapped
      notes: >
        the field that carries excerpts of the matched sensitive content
        itself, which makes it simultaneously the most useful triage field and
        the one most likely to be truncated, redacted, or rejected by a
        cross-domain content filter
    - vendor: maxMatches
      type: integer
      description: >-
        Highest number of violations triggered by any single rule in the
        incident — the detected-values count.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.max_matches
      notes: >
        the volume signal the SOC actually triages on (one credit card number
        versus four thousand). ECS has no match-count field — event.count does
        not exist in the 9.4 dictionary — so it stays custom, and it must be
        mapped as a long so range queries and threshold rules work. Audit
        Quality SIEM format only.
    - vendor: timeStamp
      type: timestamp
      description: Date and time of the incident, formatted "2015-03-11 16:33:48.333".
      ecs: '@timestamp'
      status: partial
      transform: >
        carries no timezone offset; the pipeline must apply the Security
        Manager's configured timezone (third-party parsers assume UTC, which
        is wrong for any non-UTC deployment). Audit Quality SIEM format only —
        with the plain CEF string the only time available is the syslog
        header, so the format choice directly determines event-time fidelity.
    - vendor: productVersion
      type: string
      description: Version number of the Forcepoint DLP product that produced the record.
      ecs: observer.version
      status: mapped
    - vendor: apVersion
      type: string
      description: Forcepoint version number reported alongside productVersion.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.ap_version
      notes: >
        documented separately from productVersion but observed to carry the
        same value; kept custom rather than fighting observer.version for the
        same slot, and useful as a format-string sanity check during
        onboarding
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Build the CEF exit on the core worker group: the generic CEF parser
          plus a branch on the Name header to separate incidents from
          risk-ranking cases, audit records and system records that share this
          transport. Do the list explosion here — duser, destinationHosts, cat
          and fname are all comma-separated lists inside single CEF values and
          are useless until split — and derive event.outcome from act so
          blocked, quarantined and encrypted register as successful policy
          enforcement rather than failure. Apply the Security Manager timezone
          to timeStamp (the record carries no offset), route suser and duser
          channel-aware off sourceServiceName so email addresses, directory
          users and printer/device names do not all pile into the same user
          field, then validate with C.Schema(...).validate before the guard
          destination with a dead-letter route and Persistent Queue
          backpressure (never Block). Keep _raw across the crossing: this is a
          low-volume, high-forensic-value stream and the parser is unproven.
        elastic: >
          Nothing ships for Forcepoint DLP, so stand up a custom ingest
          pipeline and index template for logs-forcepoint_dlp.incident that
          accepts pre-shaped documents instead of re-parsing CEF, with
          custom-namespace keyword mappings for forcepoint.dlp.channel,
          severity_type and max_matches (long) and a keyword mapping for the
          exploded file name array. Normalize the two severity representations
          into one — the CEF header integer is derived from severityType, so
          pick severityType as the authoritative low/medium/ high and document
          that the header number is not a risk score — and add a runtime or
          enrich lookup that resolves channel into a coarse
          network/email/web/endpoint/discovery facet the SOC can pivot on.
          Assert in the template that event.action, event.outcome and
          forcepoint.dlp.channel are populated on every document, since the
          alerting content depends on all three.
        relay: >
          Full ECS-shaped JSON crosses the guard, not CEF: the Security
          Manager keeps emitting its syslog/CEF string and that does not
          change, but the conversion happens low-side so no CEF reaches the
          boundary or Elastic. This is the dataset a cross-domain content
          filter will scrutinize hardest, because msg (incident details) is
          free text containing excerpts of the very sensitive data that
          triggered the violation, and fname carries user-supplied file names
          with arbitrary unicode — cap both to declared lengths low-side, set
          an explicit truncation flag when you do, and consider a redaction
          rule on msg if the guard owner will not pass content excerpts at
          all. Hold the document to two levels of nesting with short ASCII
          allowlisted keys so a custom NDJSON filter rule stays tractable,
          treat the crossing as at-most-once, and reconcile low-side and
          high-side counts per (dataset, hour) — a dropped DLP incident is an
          undetected exfiltration.
      direct:
        parse_location: low
        cribl: >
          Build the CEF exit on the core worker group: the generic CEF parser
          plus a branch on the Name header to separate incidents from
          risk-ranking cases, audit records and system records that share this
          transport. Do the list explosion here — duser, destinationHosts, cat
          and fname are all comma-separated lists inside single CEF values and
          are useless until split — and derive event.outcome from act so
          blocked, quarantined and encrypted register as successful policy
          enforcement rather than failure. Apply the Security Manager timezone
          to timeStamp (the record carries no offset), and route suser and
          duser channel-aware off sourceServiceName so email addresses,
          directory users and printer/device names do not all pile into the
          same user field. Validate with C.Schema(...).validate and send parse
          failures to a dead-letter output before delivering straight to
          Elastic on the same side. Keep _raw: this is a low-volume,
          high-forensic-value stream and the parser is unproven.
        elastic: >
          Nothing ships for Forcepoint DLP, so stand up a custom ingest
          pipeline and index template for logs-forcepoint_dlp.incident that
          accepts pre-shaped documents instead of re-parsing CEF, with
          custom-namespace keyword mappings for forcepoint.dlp.channel,
          severity_type and max_matches (long) and a keyword mapping for the
          exploded file name array. Normalize the two severity representations
          into one — the CEF header integer is derived from severityType, so
          pick severityType as the authoritative low/medium/ high and document
          that the header number is not a risk score — and add a runtime or
          enrich lookup that resolves channel into a coarse
          network/email/web/endpoint/discovery facet the SOC can pivot on.
          Assert in the template that event.action, event.outcome and
          forcepoint.dlp.channel are populated on every document, since the
          alerting content depends on all three.
  - format: api-pull
    enable: >
      Turn on the REST API service on the Forcepoint Security Manager and
      create an Application administrator account (Settings > General >
      Administrators; the Application administrator type is the only type
      allowed to request a refresh token). A collector authenticates in two
      steps: POST /dlp/rest/v1/auth/refresh-token with the Application
      administrator username/password to obtain a refresh-token JWT (valid 1
      day), then POST that to the access-token API to obtain an access-token
      JWT (valid 15 minutes), and calls POST https://<DLP Manager
      IP>:<port>/dlp/rest/v1/incidents with an Authorization: Bearer <access
      token> header. The request body selects "type": "INCIDENTS" and either
      an "ids" list (up to 1,000) or a "from_date"/"to_date" window in
      "dd/MM/yyyy HH:mm:ss" form, optionally narrowed by channel, action,
      severity, status, policies, source, destination, assigned_to or tag;
      each response returns up to 10,000 incident objects. This is a poll
      model, not a push stream, so the collector windows by insert/event date,
      sorts by DATE, and dedupes on event_id across overlapping windows. The
      API is the way to obtain policy names and the incident workflow state
      (status, assigned_to) that the predefined CEF strings never carry.
    references:
    - >-
      https://help.forcepoint.com/dlp/10/restapi/7DAC5768-4C59-492A-B7F5-AD75D349215F.html
    - >-
      https://help.forcepoint.com/dlp/90/restapi/53F5E3C6-4E20-478E-9CD5-EB4A02DDFE35.html
    - >-
      https://help.forcepoint.com/dlp/90/restapi/7A771619-6756-4BCD-B525-1D42A85FAC2F.html
    - https://help.forcepoint.com/docs/data/v89/rest_api/DLP%20REST%20API%20Guide.pdf
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        Cribl REST Collector (scheduled) + custom Forcepoint DLP incidents
        pipeline; no Elastic integration exists
      notes: >
        No Elastic integration and no vendor Cribl pack covers Forcepoint DLP,
        so the pull is a scheduled Cribl REST Collector that runs the two-step
        JWT handshake, POSTs a rolling date window, and paginates by advancing
        from_date. The response is already structured JSON, so there is no CEF
        decode -- the pipeline maps the flat incident object plus its nested
        source object into the same logs-forcepoint_dlp.incident shape the
        syslog/CEF path targets, so API-sourced and CEF-sourced incidents are
        one queryable corpus. A high-side tenant could pull the same endpoint
        with an Elastic httpjson input instead, but the JWT refresh/access
        token rotation is fiddlier in httpjson than in a Cribl Collector, so
        the Collector is the primary artifact.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Run the REST Collector on the low-side edge worker group that can
          reach the DLP Manager, because the JWT handshake and the incident
          excerpts must not cross the guard as an authenticated pull. Store
          the Application administrator credential in the worker group's
          secret store, not the pipeline, and keep the 15-minute access-token
          refresh inside the Collector so no long-lived token is persisted.
          Shape low-side: split policies on its semicolons into a rule.name
          array, derive event.outcome from action (BLOCKED, QUARANTINED,
          ENCRYPTED are successful enforcements, not failures), route the
          nested source fields channel-aware off channel so email addresses,
          login names and host names land in the right ECS slots, strip the "
          - 1.09 KB" size suffix off file_name, and apply the Security Manager
          timezone to event_time (the "dd/MM/yyyy HH:mm:ss" values carry no
          offset). Cap and, if the guard owner requires it, redact the details
          excerpt low-side and set a truncation flag, then validate with
          C.Schema(...).validate and a dead-letter route before the guard
          destination with Persistent Queue backpressure. Keep _raw across the
          crossing: low volume, high forensic value.
        elastic: >
          Land pre-shaped documents into the custom
          logs-forcepoint_dlp.incident data stream rather than re-parsing --
          the API path shares the ingest pipeline and index template with the
          CEF path. The API adds fields the CEF forms lack, so add
          custom-namespace mappings for forcepoint.dlp.incident_status
          (keyword), forcepoint.dlp.assigned_to, forcepoint.dlp.detected_by,
          forcepoint.dlp.transaction_size (long),
          forcepoint.dlp.violation_triggers (long), and the source-directory
          enrichment (forcepoint.dlp.source.manager, .department,
          .business_unit, .risk_level). Because policies here populates
          rule.name -- which the predefined CEF string leaves empty --
          per-rule alerting becomes possible on API-sourced incidents, so
          assert rule.name is present and index it. Normalize the severity
          label (forcepoint.dlp.severity_type) as the authoritative
          low/medium/high and keep the numeric event.severity for CEF parity
          only.
        relay: >
          Structured JSON crosses the guard, not the raw API response: the
          conversion to ECS-shaped NDJSON happens low-side so no credentialed
          pull and no CEF reaches the boundary. This is the dataset a content
          filter scrutinizes hardest because details carries excerpts of the
          very sensitive data that triggered the violation and file_name
          carries arbitrary-unicode user file names -- cap both to declared
          lengths low-side, set an explicit truncation flag, and consider a
          redaction rule on details if the guard owner will not pass content
          excerpts. Hold the document to two levels of nesting (flatten the
          source object into short ASCII allowlisted keys) so a custom NDJSON
          filter rule stays tractable, treat the crossing as at-most-once, and
          reconcile low-side and high-side counts per (dataset, hour) on
          event_id -- a dropped DLP incident is an undetected exfiltration.
      direct:
        parse_location: low
        cribl: >
          For a high-side instance whose Elastic stack is on the same side,
          run the REST Collector and pipeline straight to Elastic with no
          guard to clear: two-step JWT auth, rolling date window, dedupe on
          event_id, split policies into rule.name, derive event.outcome from
          action, and apply the Security Manager timezone to event_time. The
          decision that matters here is cadence -- a short poll interval keeps
          detection latency low but multiplies token refreshes and 10,000-row
          responses, so size the window against incident volume rather than
          polling aggressively.
        elastic: >
          Land pre-shaped documents into the custom
          logs-forcepoint_dlp.incident ingest pipeline and index template,
          with custom-namespace mappings for forcepoint.dlp.incident_status
          (keyword), assigned_to, detected_by, transaction_size (long) and
          violation_triggers (long), plus the source-directory enrichment
          (forcepoint.dlp.source.manager, .department, .business_unit,
          .risk_level). Because policies populates rule.name here -- which the
          predefined CEF string leaves empty -- assert rule.name is present
          and index it so per-rule alerting works on API-sourced incidents.
          Prefer this API feed over the CEF syslog stream where per-rule
          alerting or incident-workflow filtering (false-positive, escalated,
          assigned) matters, since those fields are simply absent from the
          predefined CEF strings; keep the CEF stream only where a real-time
          push is required, because the API is a poll and carries inherent
          latency.
    fields:
    - vendor: id
      type: integer
      description: >-
        Internal incident record id, used together with partition_index to
        update or remediate the incident.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.incident_id
      notes: >
        the partition-scoped database row id and the update key, distinct from
        event_id; keep it for round-tripping remediation calls but do not use
        it as the cross-dataset join key
    - vendor: event_id
      type: string
      description: Event ID number -- the stable identifier of the underlying violation event.
      ecs: event.id
      status: mapped
      notes: >
        the join key equivalent to the CEF header id and to the eventIDs list
        on the risk-ranking-case dataset; a large numeric identifier carried
        as a string in the JSON response
    - vendor: severity
      type: enum
      description: Incident severity -- HIGH, MEDIUM or LOW.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.severity_type
      notes: >
        the authoritative severity label the analyst sees; ECS event.severity
        is numeric so the label stays custom in the same slot as the CEF
        severityType, and it should drive alert thresholds
    - vendor: action
      type: enum
      description: >-
        Action applied to the transaction -- AUDITED, QUARANTINED, BLOCKED,
        ENCRYPTED, RELEASED, ESG_ACTION, QUARANTINE_WITH_NOTE,
        UNSHARE_EXTERNAL, UNSHARE_ALL, UNSHARE_INTERNAL.
      ecs: event.action
      status: mapped
      transform: >
        also drives event.outcome -- BLOCKED, QUARANTINED and ENCRYPTED are
        successful policy enforcements and must map to success with a
        distinguishing action, never failure; there is no separate outcome key
        in the response
    - vendor: status
      type: enum
      description: >-
        Incident workflow status -- NEW, IN_PROCESS, CLOSE, FALSE_POSITIVE,
        ESCALATED, or a custom status.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.incident_status
      notes: >
        triage state absent from every syslog/CEF form; lets the SOC filter
        out false-positive and closed incidents and surface escalated ones,
        which the CEF stream cannot express
    - vendor: tag
      type: string
      description: Free-text incident tag applied by an administrator.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.tag
    - vendor: assigned_to
      type: string
      description: Administrator name the incident ticket is assigned to.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.assigned_to
      notes: >
        workflow ownership, not an actor in the violation -- do not route to
        user.name; useful for per-analyst queue dashboards
    - vendor: details
      type: string
      description: Free-text incident details describing what was detected.
      ecs: message
      status: mapped
      notes: >
        carries excerpts of the matched sensitive content, the same payload as
        the CEF msg, so it is both the most useful triage field and the one
        most likely to be capped, redacted or rejected at the guard
    - vendor: channel
      type: enum
      description: >-
        Channel the violation travelled over -- EMAIL, ENDPOINT_EMAIL, FTP,
        HTTP, HTTPS, ENDPOINT_HTTP, ENDPOINT_HTTPS, ENDPOINT_PRINTING,
        ENDPOINT_APPLICATION, ENDPOINT_REMOVABLE_MEDIA, ENDPOINT_LAN,
        ENDPOINT_DISCOVERY, CASB_REAL_TIME, CASB_NEAR_REAL_TIME,
        CASB_DISCOVERY.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.channel
      notes: >
        the Forcepoint-specific field with no ECS home and the discriminator
        for how source and destination should be interpreted. Unlike the
        free-text CEF sourceServiceName this is a closed enum, so a lookup to
        the coarse network/email/web/endpoint/discovery facet is clean; the
        CASB_* values appear only in this API form
    - vendor: policies
      type: string
      description: Names of the policies that triggered the incident, e.g. "Credit Cards; PCI".
      ecs: rule.name
      status: partial
      transform: >
        semicolon-separated list; split into an array. This is the API's key
        value-add over the predefined CEF string, which leaves rule.name empty
        -- the API exposes policy names without authoring a Custom format
        string, so per-rule alerting is possible here
    - vendor: maximum_matches
      type: integer
      description: Highest number of matches triggered by any single rule in the incident.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.max_matches
      notes: >
        the volume signal the SOC triages on; map as a long so range and
        threshold queries work
    - vendor: transaction_size
      type: integer
      description: Size of the analyzed transaction in bytes.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.transaction_size
      notes: >
        not carried in either CEF predefined string; map as a long. Returned
        on by-ID lookups
    - vendor: analyzed_by
      type: string
      description: >-
        Name/ID of the policy engine that analyzed the traffic, e.g. "Policy
        Engine 1272021".
      ecs: observer.name
      status: mapped
      notes: >
        the analyzing component, the same object the CEF analyzedBy carries;
        not the host the data loss happened on
    - vendor: detected_by
      type: string
      description: >-
        The sensor or agent kind that detected the violation, e.g. "Endpoint
        Agent", "Crawler 100190120a", "Protector on 1272021".
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.detected_by
      notes: >
        distinguishes the detecting sensor class from the analyzing policy
        engine; not present in the predefined CEF strings, useful for grouping
        endpoint-agent versus network-protector incidents
    - vendor: ignored_incidents
      type: boolean
      description: Whether the incident is flagged as ignored.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.ignored
    - vendor: released_incident
      type: boolean
      description: Whether the incident was released from quarantine/hold.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.released
    - vendor: event_time
      type: timestamp
      description: Date and time the violation event occurred, formatted "dd/MM/yyyy HH:mm:ss".
      ecs: '@timestamp'
      status: partial
      transform: >
        day-first format with no timezone offset; apply the Security Manager's
        configured timezone. This is the real event time -- prefer it over
        incident_time as @timestamp
    - vendor: incident_time
      type: timestamp
      description: Date and time the incident record was created.
      ecs: event.created
      status: partial
      transform: >
        same day-first, no-offset format as event_time; keep it as the
        record-creation time on event.created, distinct from the event time
    - vendor: partition_index
      type: integer
      description: Database partition the incident lives in, a yyyyMMdd-derived shard key.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.partition_index
      notes: >
        required together with id to update or remediate an incident; a
        date-derived shard key, not event data, but worth keeping for
        round-tripping remediation calls
    - vendor: endpoint_type
      type: enum
      description: Type of endpoint the incident originated on -- LAPTOP, DESKTOP, or NA.
      ecs: host.type
      status: partial
      notes: >
        a constrained vendor vocabulary; NA when the incident did not
        originate on an endpoint (network/discovery channels)
    - vendor: violation_triggers
      type: integer
      description: Number of violation triggers in the incident.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.violation_triggers
      notes: map as a long; returned on by-ID lookups
    - vendor: file_name
      type: string
      description: Name of the file involved, with an appended size, e.g. "visa.txt - 1.09 KB".
      ecs: file.name
      status: partial
      transform: >
        a single string with a " - <size>" suffix appended; strip the suffix
        before mapping. Unlike the CEF fname this is one value, not a
        comma-separated list
    - vendor: destination
      type: string
      description: The incident destination, e.g. "aaa@aaa.net" or "Windows Portable Device (WPD)".
      ecs: destination.address
      status: partial
      transform: >
        channel-dependent -- an email address on the email channels, a URL on
        web, a device name on removable-media; route email forms to
        destination.user.name and hostnames/IPs to destination.address /
        destination.ip. A single value here rather than the CEF comma list
    - vendor: source.ip_address
      type: ip
      description: IP address of the incident source machine (nested in the source object).
      ecs: source.ip
      status: mapped
    - vendor: source.host_name
      type: string
      description: Hostname of the incident source machine (nested in the source object).
      ecs: host.name
      status: partial
      notes: the source machine the violation occurred on; returned on by-ID lookups
    - vendor: source.login_name
      type: string
      description: >-
        Login name / sAMAccountName of the user associated with the incident
        (nested in the source object).
      ecs: user.name
      status: mapped
      notes: >
        the clean directory identity join key, the same object as the CEF
        loginName; empty when the source could not be resolved to a directory
        account
    - vendor: source.email_address
      type: string
      description: Email address of the incident source user (nested in the source object).
      ecs: source.user.email
      status: mapped
    - vendor: source.nt_domain
      type: string
      description: NT/AD domain of the incident source user (nested in the source object).
      ecs: source.user.domain
      status: mapped
    - vendor: source.dn
      type: string
      description: >-
        LDAP distinguished name of the incident source user (nested in the
        source object).
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.source.dn
    - vendor: source.manager
      type: string
      description: Directory manager of the incident source user (nested in the source object).
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.source.manager
      notes: >
        directory enrichment not present in any syslog form; useful for
        routing insider-risk alerts up a reporting chain
    - vendor: source.department
      type: string
      description: Directory department of the incident source user (nested in the source object).
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.source.department
    - vendor: source.business_unit
      type: string
      description: Business unit of the incident source user (nested in the source object).
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.source.business_unit
    - vendor: source.risk_level
      type: integer
      description: >-
        Insider risk level of the incident source user; set only when greater
        than 0 (nested in the source object).
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.source.risk_level
      notes: >
        a source-user risk level, distinct from the case riskScore; ECS
        event.risk_score models event risk rather than actor risk, so it stays
        custom
  - format: csv-file
    enable: >
      On the Security Manager go to the Data Security module, Settings >
      General > Incident Export, select "Export incidents to a file", set a
      storage path (default C:/Program Files (x86)/Websense/Data Security/
      incidents-export), a filename, the number of files to retain (1-20,
      default 5) and the rotation trigger -- either a file-size threshold (1-5
      MB) or the start of a new day. The Security Manager then writes incident
      rows to a rotating CSV on the appliance filesystem; a collector tails
      that directory. The exported column set is fixed (Incident ID, Insert
      date, Source hostname/IP/full name/email/DN, Destinations list, Channel
      name, Max action taken, Urgency, Policy category, Filenames plus a
      trimmed flag, and Breached contents plus a trimmed flag) rather than a
      chooseable template. It is a batch export, so it carries only the insert
      date -- no separate detection time -- and truncates the file-name and
      breached-content columns with explicit "trimmed" flags.
    references:
    - >-
      https://help.forcepoint.com/dlp/10/dlphelp/B0104738-5533-457E-8812-A0CD04EEE6B3.html
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        Cribl filesystem/monitor collector + CSV-parse pipeline into
        logs-forcepoint_dlp.incident
      notes: >
        No Elastic integration exists, so a Cribl filesystem collector tails
        the rotating export directory and a pipeline parses the fixed header
        row and maps the columns into the same logs-forcepoint_dlp.incident
        shape the CEF and API paths target. The two "trimmed" boolean columns
        are truncation flags for the file-name and breached-content columns
        and must be preserved so a capped list is not read as complete. This
        is the lowest-fidelity of the three incident feeds -- it lacks event
        time, source directory enrichment and the workflow/status fields -- so
        it is a fallback for a deployment that cannot enable the REST API or
        syslog.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Tail the export directory with a filesystem collector on the
          low-side edge worker group, parse the fixed CSV header, and shape
          low-side before the guard: split Destinations list and Policy
          category and Filenames on their delimiters into arrays, derive
          event.outcome from Max action taken, map Urgency to the severity
          label, and carry the Filenames trimmed and Breached content trimmed
          booleans through as truncation flags. Cap and, if required, redact
          the Breached contents column low-side -- it is the raw sensitive
          excerpt -- and set a truncation flag when you do. Apply the Security
          Manager timezone to Insert date (it carries no offset) and note in
          the record that it is an insertion, not a detection, time. Validate
          with C.Schema(...).validate and a dead-letter route before the guard
          destination with Persistent Queue backpressure; keep _raw.
        elastic: >
          Land pre-shaped documents into logs-forcepoint_dlp.incident through
          the shared ingest pipeline and index template, with the file-name
          array as a keyword and the two truncation booleans mapped so a
          dashboard can show that a Filenames or Breached contents value was
          capped. Because the CSV maps Insert date onto @timestamp as its only
          time, document that event-time fidelity is lower than the API and
          CEF feeds and that the analyst is seeing insertion time. Policy
          category maps to rule.category, not rule.name, so per-rule alerting
          is not available from this feed -- prefer the API where policy names
          matter.
        relay: >
          Structured records cross the guard, converted low-side from CSV. The
          hard content constraint is the Breached contents column, which is
          the matched sensitive excerpt in free text and the field a
          cross-domain content filter scrutinizes hardest -- cap it to a
          declared length low-side, set an explicit truncation flag, and
          consider a redaction rule if the guard owner will not pass excerpts
          at all. Filenames can carry arbitrary unicode, so bound it too. Hold
          the record to two levels of nesting with short ASCII allowlisted
          keys, treat the crossing as at-most-once, and reconcile counts per
          (dataset, hour) on Incident ID.
      direct:
        parse_location: low
        cribl: >
          For a same-side stack, run the filesystem collector and CSV parse
          straight to Elastic with no guard to clear: split the delimited
          columns into arrays, derive event.outcome from Max action taken, and
          apply the Security Manager timezone to Insert date. The operative
          decision is whether to use this feed at all -- the REST API is
          strictly richer (event time, workflow state, policy names, directory
          enrichment), so the CSV export is justified only where API access
          cannot be granted.
        elastic: >
          Land pre-shaped documents into the shared
          logs-forcepoint_dlp.incident pipeline and template. Since the export
          drops event time, the source directory attributes and the incident
          workflow fields, treat this as a reduced-fidelity incident record
          and lean on the API or CEF feeds for anything that needs those
          fields.
    fields:
    - vendor: Incident ID
      type: string
      description: Incident (event) identifier -- the CSV join key.
      ecs: event.id
      status: mapped
    - vendor: Insert date
      type: timestamp
      description: Date and time the incident row was inserted into the export.
      ecs: '@timestamp'
      status: partial
      transform: >
        the export's only timestamp and a database insertion time, not the
        detection time; carries no timezone offset, so apply the Security
        Manager timezone and document that event-time fidelity is lower than
        the API and CEF feeds
    - vendor: Source hostname
      type: string
      description: Hostname of the incident source machine.
      ecs: host.name
      status: mapped
    - vendor: Source IP
      type: ip
      description: IP address of the incident source machine.
      ecs: source.ip
      status: mapped
    - vendor: Source full name
      type: string
      description: Display / full name of the incident source user.
      ecs: user.full_name
      status: mapped
    - vendor: Source email
      type: string
      description: Email address of the incident source user.
      ecs: source.user.email
      status: mapped
    - vendor: Source DN
      type: string
      description: LDAP distinguished name of the incident source user.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.source.dn
    - vendor: Destinations list
      type: string
      description: >-
        Delimited list of the incident destinations -- recipients, URLs, hosts
        or devices.
      ecs: destination.address
      status: partial
      transform: >
        comma-separated mixed list; split, then type-test each element so IPs
        also populate destination.ip and names also populate
        destination.domain, and route email recipients to
        destination.user.name channel-aware
    - vendor: Channel name
      type: string
      description: Channel the violating transaction travelled over.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.channel
      notes: >
        the same Forcepoint-specific channel field as the other feeds; store a
        coarse network/email/web/endpoint/discovery facet beside the raw value
    - vendor: Max action taken
      type: string
      description: Highest-precedence action the action plan applied to the transaction.
      ecs: event.action
      status: mapped
      transform: >
        drives event.outcome as on the other feeds -- blocked, quarantined and
        encrypted are successful enforcements, not failures
    - vendor: Urgency
      type: enum
      description: >-
        Incident severity as labelled in the export (the console
        "Urgency"/severity value).
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.severity_type
      notes: >
        "Urgency" is the export's label for severity (low/medium/high); it
        belongs in the same custom slot as the CEF severityType and is the
        authoritative severity the analyst sees
    - vendor: Policy category
      type: string
      description: Policy categories the violated policy belongs to.
      ecs: rule.category
      status: partial
      transform: >
        delimited list; split into an array. Note this is the category, not
        the policy name -- unlike the REST API's policies field, this export
        does not carry rule.name
    - vendor: Filenames
      type: string
      description: Names of the files attached to or transferred in the violating transaction.
      ecs: file.name
      status: partial
      transform: delimited list of file names; split into an array
    - vendor: Filenames trimmed
      type: boolean
      description: Flag indicating the Filenames column was truncated.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.filenames_trimmed
      notes: >
        surface it so a capped file-name list is not read as the complete set
        of files in the incident
    - vendor: Breached contents
      type: string
      description: Excerpt of the matched sensitive content that triggered the violation.
      ecs: message
      status: mapped
      notes: >
        the raw forensic excerpt and the field a cross-domain content filter
        scrutinizes hardest; cap and, if required, redact it low-side before
        the guard
    - vendor: Breached content trimmed
      type: boolean
      description: Flag indicating the Breached contents column was truncated.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.breached_content_trimmed
      notes: surface it so a capped excerpt is not read as the full matched content
- id: risk-ranking-case
  name: Incident Risk Ranking case
  description: >
    Analytics output rather than a raw detection: the Incident Risk Ranking
    engine groups related incidents into a "case" that may indicate a specific
    breach, scores it 0 (lowest) to 10 (highest), and can emit the case over
    the same syslog/CEF channel as individual incidents. Cases are the
    product's own attempt at insider-threat correlation and are far lower
    volume and far higher signal than the incident stream, which makes them
    good alerting material — but the case record is a summary, so it must be
    joined back to the incident dataset via eventIDs to be actionable. Case
    records reuse the "DLP Syslog" CEF Name header, so they are only
    distinguishable from ordinary incidents by the presence of the riskScore
    key.
  event_categories:
  - file
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Arrives on the same Cribl Syslog source and the same destination
        IP/port as the incident feed — there is one Remediation syslog target
        for the Data Security module, not one per message type, so the split
        happens in the pipeline and not at the source.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_dlp.case
      notes: custom data stream; no integration covers Forcepoint DLP risk ranking
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Arrives on the same Cribl Syslog source and the same destination
        IP/port as the incident feed — there is one Remediation syslog target
        for the Data Security module, not one per message type, so the split
        happens in the pipeline and not at the source.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_dlp.case
      notes: custom data stream; no integration covers Forcepoint DLP risk ranking
  formats:
  - format: syslog-cef
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Forcepoint DLP CEF pipeline (case branch)
      notes: >
        Same pipeline as the incident dataset with a branch keyed on the
        presence of riskScore, since the CEF Name header says "DLP Syslog" for
        both. The two date formats in this product differ: cases use
        caseDateAndTime ("07 Jul. 2016, 9:33:18 AM", with an abbreviated month
        carrying a trailing period) while incidents use timeStamp ("2015-03-11
        16:33:48.333") — one pipeline must handle both, and the case format
        defeats strict date processors.
    fields:
    - vendor: Signature ID (id)
      type: string
      description: Case ID assigned by the analytics engine, carried in the CEF header.
      ecs: event.id
      status: mapped
    - vendor: severity (CEF header)
      type: integer
      description: CEF header severity for the case record.
      ecs: event.severity
      status: partial
      transform: >
        observed as a low constant on case records and unrelated to riskScore;
        do not alert on it — riskScore is the analytic signal in this dataset
    - vendor: riskScore
      type: float
      description: Analytics risk score for the case, 0 (lowest risk) to 10 (highest risk).
      ecs: event.risk_score
      status: mapped
      notes: >
        vendor-native 0–10 range maps cleanly onto ECS event.risk_score; leave
        event.risk_score_norm to Elastic's own normalization rather than
        rescaling here
    - vendor: caseClassification
      type: enum
      description: >-
        What the analytics engine believes the case represents — e.g.
        suspected data theft, or uncategorized/unknown.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.case.classification
      notes: >
        a vendor verdict taxonomy with no ECS equivalent; deliberately not
        mapped to threat.* , which models TI-provider indicator identity
        rather than a local analytic conclusion
    - vendor: caseDescription
      type: string
      description: One-line description of what the case represents.
      ecs: message
      status: mapped
    - vendor: caseSummary
      type: string
      description: >-
        Semicolon-separated list of the factors that drove the case's risk
        score, e.g. "Low risk content;Number of files in case (46);Destination
        is unusual;PII breach (1 match);Possible false positive (23%)".
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.case.summary
      notes: >
        the explanation of the score and the most useful field for an analyst
        deciding whether to open the case; split on the semicolons into an
        array so individual factors are searchable
    - vendor: caseDateAndTime
      type: timestamp
      description: Date and time the case was raised, formatted "07 Jul. 2016, 9:33:18 AM".
      ecs: '@timestamp'
      status: partial
      transform: >
        non-ISO format with an abbreviated month carrying a trailing period
        and a 12-hour clock; needs an explicit custom date pattern.
        Third-party parsers treat it as UTC — confirm against the Security
        Manager's configured timezone before trusting it.
    - vendor: numberOfIncidents
      type: integer
      description: Number of incidents grouped into the case.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.case.incident_count
      notes: >
        may exceed the number of entries in eventIDs because that list is
        capped; the two disagreeing is the signal that the case is truncated,
        not a parsing error
    - vendor: eventIDs
      type: string
      description: Incident IDs belonging to the case — the join key back to the incident dataset.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.case.event_ids
      notes: >
        the vendor caps this at 20 IDs or 1024 characters and appends an
        ellipsis when more exist, so the case-to-incident join is lossy by
        design; set an explicit truncation flag when the ellipsis is present
        rather than letting analysts read a capped list as complete
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Branch this out of the shared CEF pipeline on the presence of
          riskScore, because the Name header cannot tell cases from incidents,
          and parse caseDateAndTime with an explicit custom format — the
          abbreviated month with a trailing period ("07 Jul. 2016, 9:33:18
          AM") defeats strict date processors and will silently fall back to
          ingest time if unhandled. Split caseSummary on its semicolons into
          an array of contributing factors and split eventIDs into an array
          while setting an explicit truncation flag when the vendor's
          20-id/1024-character cap is hit, so the lossy case-to-incident join
          is visible rather than assumed complete. Keep _raw across the
          crossing — this stream is tiny and each record is an insider-threat
          lead.
        elastic: >
          Give logs-forcepoint_dlp.case its own index template with
          event.risk_score as a scaled float and custom-namespace mappings for
          forcepoint.dlp.case.classification, summary (keyword array),
          incident_count (long) and event_ids (keyword array). The high-value
          work is the join: build the enrich or runtime linkage from
          forcepoint.dlp.case.event_ids to the incident dataset's event.id so
          an analyst opening a case sees its member incidents, and surface the
          truncation flag in that view so nobody reads a capped list as the
          full case. Give this data stream a longer retention than the
          incident stream — it is small, and a case is the artifact an
          investigation is built on.
        relay: >
          Full ECS-shaped JSON crosses, not CEF, with the conversion done
          low-side. caseDescription and caseSummary are analyst-facing free
          text that can name the data involved, so bound their length
          low-side, and keep the exploded event_ids array flat rather than
          nested so the custom NDJSON guard filter stays a simple key
          allowlist. Volume here is negligible, so the Persistent Queue can be
          sized generously and count reconciliation per (dataset, hour) is
          cheap and should be treated as a hard alarm — losing one case record
          loses a whole correlated breach narrative, not one event.
      direct:
        parse_location: low
        cribl: >
          Branch this out of the shared CEF pipeline on the presence of
          riskScore, because the Name header cannot tell cases from incidents,
          and parse caseDateAndTime with an explicit custom format — the
          abbreviated month with a trailing period ("07 Jul. 2016, 9:33:18
          AM") defeats strict date processors and will silently fall back to
          ingest time if unhandled. Split caseSummary on its semicolons into
          an array of contributing factors and split eventIDs into an array
          while setting an explicit truncation flag when the vendor's
          20-id/1024-character cap is hit, so the lossy case-to-incident join
          is visible rather than assumed complete. Keep _raw — this stream is
          tiny and each record is an insider-threat lead.
        elastic: >
          Give logs-forcepoint_dlp.case its own index template with
          event.risk_score as a scaled float and custom-namespace mappings for
          forcepoint.dlp.case.classification, summary (keyword array),
          incident_count (long) and event_ids (keyword array). The high-value
          work is the join: build the enrich or runtime linkage from
          forcepoint.dlp.case.event_ids to the incident dataset's event.id so
          an analyst opening a case sees its member incidents, and surface the
          truncation flag in that view so nobody reads a capped list as the
          full case. Give this data stream a longer retention than the
          incident stream — it is small, and a case is the artifact an
          investigation is built on.
- id: audit-log
  name: DLP audit log
  description: >
    Administrator accountability trail for the Data Security module of the
    Forcepoint Security Manager — logons and logoffs, policy and rule changes,
    incident-management actions such as releasing or deleting an incident,
    reporting, archiving, and system module changes. Available as a syslog/CEF
    feed from Forcepoint DLP 10.2 onward (before that it is console-only),
    sharing the Remediation syslog target with the incident feed and
    distinguished by the "DLP Audit Log" CEF Name header. This is the stream
    that answers who changed a DLP policy or who dismissed an incident, so it
    is the compliance record for the product itself rather than a detection
    feed.
  event_categories:
  - configuration
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same Cribl Syslog source and same destination as the incident feed —
        the Data Security module has one syslog target, so separation is a
        pipeline concern.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_dlp.audit
      notes: >-
        custom data stream; no Elastic integration covers the Forcepoint DLP
        audit channel
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same Cribl Syslog source and same destination as the incident feed —
        the Data Security module has one syslog target, so separation is a
        pipeline concern.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_dlp.audit
      notes: >-
        custom data stream; no Elastic integration covers the Forcepoint DLP
        audit channel
  formats:
  - format: syslog-cef
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Forcepoint DLP CEF pipeline (audit branch)
      notes: >
        Branch of the shared CEF pipeline keyed on the "DLP Audit Log" Name
        header. Note the CEF key reuse across message families is a trap: cat
        is a policy-category list on incidents but the audit Topic here, act
        is the enforcement action on incidents but the administrator's Action
        Performed here, and suser is the incident source on incidents but the
        administrator here — every branch must map these independently or the
        three streams will cross-contaminate a shared field.
    fields:
    - vendor: Signature ID (id)
      type: string
      description: Action ID — the unique identifier of the audit log entry.
      ecs: event.id
      status: mapped
    - vendor: severity (CEF header)
      type: integer
      description: >-
        CEF header severity for the audit record, derived from the audit log
        severity (low, medium, high).
      ecs: event.severity
      status: partial
      transform: >
        coarse three-valued label rendered as a CEF number; useful for
        filtering noisy read-only actions out, not as a risk score
    - vendor: act (message)
      type: string
      description: >-
        Action Performed — the administrator action that was recorded, e.g.
        log on, log off, add policy, delete incident.
      ecs: event.action
      status: mapped
      transform: >
        free-text rather than a closed vocabulary, so alert content must match
        on substrings or a normalization lookup should map the observed
        strings onto a stable set before rules are built
    - vendor: msg (details)
      type: string
      description: Supplementary detail about what the administrator action changed.
      ecs: message
      status: mapped
    - vendor: timeStamp
      type: timestamp
      description: Date and time the administrator action occurred.
      ecs: '@timestamp'
      status: partial
      transform: >
        local Security Manager time with no offset in the record; the pipeline
        must apply the configured timezone, and component clocks must be
        synchronized or the audit ordering is wrong
    - vendor: suser (adminName)
      type: string
      description: Name and username of the administrator who performed the action.
      ecs: user.name
      status: partial
      transform: >
        the console renders this column as display name plus username, so
        split before use — an unsplit "Jane Doe (jdoe)" will not join against
        directory data
    - vendor: role (roleName)
      type: string
      description: Access role held by the administrator who performed the action.
      ecs: user.roles
      status: mapped
      notes: >
        unlike the Forcepoint Web audit feed — where the Role column describes
        the changed object and must be kept out of user.roles — this really is
        the acting administrator's role, so user.roles is the correct home;
        emit it as a single-element array
    - vendor: cat (topic)
      type: enum
      description: >-
        Topic of the action — Administration, Log on/Log out, Status, Policy
        management, Reporting, Incident management, Archiving, or System
        modules.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.audit.topic
      notes: >
        the discriminator that decides whether a record is an iam event (Log
        on/Log out) or a configuration event (everything else) within this
        single stream; note the CEF key cat carries policy categories on the
        incident stream, so the two must be mapped independently
    - vendor: modifiedItm (incidentId)
      type: string
      description: >-
        Modified Item — the object the action changed, including incident IDs
        or task numbers where applicable.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.audit.modified_item
      notes: >
        the vendor format string names the variable incidentId, but the
        console column is the general changed object, so treat it as an opaque
        identifier and do not assume it joins to the incident dataset without
        testing the deployed output
    - vendor: apVersion
      type: string
      description: Forcepoint DLP version reported in the CEF header.
      ecs: observer.version
      status: mapped
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Split this branch on the "DLP Audit Log" Name header and map cat,
          act and suser independently from the incident branch — the same CEF
          keys carry entirely different objects across the three message
          families, and a shared mapping silently cross-contaminates the
          streams. Apply the Security Manager's configured timezone to
          timeStamp since the record carries no offset, and drive the
          iam-versus-configuration split off the Topic value in the pipeline
          so the routing decision is made once. Validate with
          C.Schema(...).validate plus a dead-letter route before the guard
          destination with Persistent Queue backpressure, and keep _raw: this
          is low-volume, forensically valuable, and the parser is unproven.
        elastic: >
          Stand up a custom ingest pipeline and index template for
          logs-forcepoint_dlp.audit with custom-namespace keyword mappings for
          forcepoint.dlp.audit.topic and modified_item. Drive event.category
          off the Topic discriminator so Log on/Log out lands in iam and
          policy, reporting and system-module changes land in configuration
          within this one stream, and set event.outcome to success for
          completed audit actions since the record has no outcome key. Unlike
          the sibling Forcepoint Web audit feed, role here really is the
          acting administrator's access role, so user.roles is correct and
          should be indexed for administrator-privilege queries; give this
          data stream a long retention because it is the compliance record for
          the DLP deployment itself.
        relay: >
          Full ECS-shaped JSON crosses, not CEF, converted low-side. The msg
          details blob is unbounded free text and can quote policy content or
          incident excerpts in incident-management actions, so cap it
          low-side, flag truncation explicitly, and hold the record to two
          levels of nesting with short ASCII allowlisted keys. At-most-once
          delivery is a real problem for an accountability trail: reconcile
          counts per (dataset, hour) and alarm on any low-side/high-side
          mismatch rather than treating it as noise, and confirm whether the
          console's own retention outlives the crossing window before relying
          on replay from the product.
      direct:
        parse_location: low
        cribl: >
          Split this branch on the "DLP Audit Log" Name header and map cat,
          act and suser independently from the incident branch — the same CEF
          keys carry entirely different objects across the three message
          families, and a shared mapping silently cross-contaminates the
          streams. Apply the Security Manager's configured timezone to
          timeStamp since the record carries no offset, and drive the
          iam-versus-configuration split off the Topic value in the pipeline
          so the routing decision is made once. Validate with
          C.Schema(...).validate and route failures to a dead-letter output
          before delivering to Elastic, and keep _raw: this is low-volume,
          forensically valuable, and the parser is unproven.
        elastic: >
          Stand up a custom ingest pipeline and index template for
          logs-forcepoint_dlp.audit with custom-namespace keyword mappings for
          forcepoint.dlp.audit.topic and modified_item. Drive event.category
          off the Topic discriminator so Log on/Log out lands in iam and
          policy, reporting and system-module changes land in configuration
          within this one stream, and set event.outcome to success for
          completed audit actions since the record has no outcome key. Unlike
          the sibling Forcepoint Web audit feed, role here really is the
          acting administrator's access role, so user.roles is correct and
          should be indexed for administrator-privilege queries; give this
          data stream a long retention because it is the compliance record for
          the DLP deployment itself.
- id: system-log
  name: DLP system log
  description: >
    Component health and operational status from the Data Security module —
    service start/stop, policy engine and protector status, endpoint agent
    connectivity and update state, and discovery task progress and failures,
    all reported by the DLP components back to the Security Manager. Available
    as a syslog/CEF feed from Forcepoint DLP 10.2 onward, sharing the
    Remediation syslog target with the incident and audit feeds and
    distinguished by the "DLP System Log" CEF Name header. Not a detection
    stream, but the only way to notice that a policy engine or an endpoint
    agent stopped analyzing — a silent DLP sensor is an availability gap in
    the control, so the SOC should alert on absence here.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same Cribl Syslog source and destination as the incident and audit
        feeds. Of the four datasets here this is the one most safely left
        low-side if guard bandwidth is contended, since it carries no
        sensitive content.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_dlp.system
      notes: custom data stream; no Elastic integration covers the Forcepoint DLP system log
    direct:
    - hop: cribl
      location: edge worker group
      notes: Same Cribl Syslog source and destination as the incident and audit feeds.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_dlp.system
      notes: custom data stream; no Elastic integration covers the Forcepoint DLP system log
  formats:
  - format: syslog-cef
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Forcepoint DLP CEF pipeline (system branch)
      notes: >
        Branch of the shared CEF pipeline keyed on the "DLP System Log" Name
        header. This message family carries two times: timeStamp is the
        insertion time into the DLP database and localTime is the generation
        time with a timezone, so localTime is the correct @timestamp and
        timeStamp belongs on event.ingested. Note the vendor's own field table
        and format string disagree about srcType — the table calls it the name
        of the server while the template variable is SourceType — so verify
        against live output during onboarding before writing any lookup
        against it.
    fields:
    - vendor: severity (CEF header)
      type: integer
      description: >-
        CEF header severity for the system log record, derived from the system
        log severity (low, medium, high).
      ecs: event.severity
      status: partial
      transform: >
        three-valued vendor label rendered as a CEF number; the high-severity
        band is what an availability alert should key on
    - vendor: msg (message)
      type: string
      description: Free-text description of the system condition being reported.
      ecs: message
      status: mapped
    - vendor: localTime (generationTime)
      type: timestamp
      description: Local date and time the condition was generated, including timezone.
      ecs: '@timestamp'
      status: mapped
      notes: >
        the only time value in this product's syslog output that carries a
        timezone, which makes it the correct @timestamp source for this
        dataset
    - vendor: timeStamp (insertionTime)
      type: timestamp
      description: Date and time the record was inserted into the Forcepoint DLP database.
      ecs: event.ingested
      status: partial
      transform: >
        product-side insertion time, not event time; keeping it on
        event.ingested rather than @timestamp preserves the
        generation-to-insertion lag, which is itself a useful health signal
        when components are backing up
    - vendor: cat (topicName)
      type: string
      description: Topic of the system log entry.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.system.topic
      notes: >-
        same CEF key as the incident policy categories and the audit topic;
        map independently per branch
    - vendor: src (sourceName)
      type: string
      description: Reporter — the component or server that raised the system log entry.
      ecs: observer.name
      status: partial
      notes: >
        despite the CEF key src this is not a network source address; a
        generic CEF parser that types src as an IP will mangle it, so the
        branch must override the default handling
    - vendor: component (sourceSubType)
      type: string
      description: Component within the reporting source that the entry concerns.
      ecs: service.name
      status: partial
      notes: >
        the field that identifies which DLP service (policy engine, crawler,
        endpoint agent, protector) is reporting, and the one absence-detection
        rules should group by
    - vendor: code
      type: integer
      description: Server code identifying the specific system condition.
      ecs: event.code
      status: partial
      transform: >
        numeric only; needs a vendor code lookup to become meaningful, and
        Forcepoint does not publish a complete table — build the lookup
        empirically from observed codes during onboarding and treat unmapped
        codes as a review queue
    - vendor: srcType (SourceType)
      type: string
      description: Type or name of the reporting server.
      ecs: null
      status: unmapped
      custom: forcepoint.dlp.system.source_type
      notes: >
        the vendor field table describes this as the name of the server while
        the format string's variable is SourceType; verify against live output
        before building any lookup or dashboard grouping on it
    - vendor: apVersion
      type: string
      description: Forcepoint DLP version reported in the CEF header.
      ecs: observer.version
      status: mapped
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Branch on the "DLP System Log" Name header and get the two
          timestamps right at the source: localTime carries a timezone and is
          the real event time, while timeStamp is the database insertion time
          and belongs on event.ingested — inverting them makes every
          availability alert late by the database lag. Verify srcType against
          live output before writing lookups against it, since the vendor's
          field table and format string disagree about what it holds. This is
          the dataset to drop _raw on first if guard bandwidth is contended:
          it carries no sensitive content and the parsed form loses nothing.
        elastic: >
          A small custom ingest pipeline and index template for
          logs-forcepoint_dlp.system with custom-namespace keyword mappings
          for forcepoint.dlp.system.topic and source_type, plus a lookup that
          resolves the numeric code into a human-readable condition so
          analysts are not reading raw server codes. The real deliverable here
          is absence detection rather than field fidelity: build the SOC rule
          on the gap — alert when a policy engine, protector, or endpoint
          agent that normally reports stops appearing — and keep this stream
          on a short retention since its value is operational, not forensic.
      direct:
        parse_location: low
        cribl: >
          Branch on the "DLP System Log" Name header and get the two
          timestamps right at the source: localTime carries a timezone and is
          the real event time, while timeStamp is the database insertion time
          and belongs on event.ingested — inverting them makes every
          availability alert late by the database lag. Verify srcType against
          live output before writing lookups against it, since the vendor's
          field table and format string disagree about what it holds. This is
          a safe dataset to drop _raw on: it carries no sensitive content and
          the parsed form loses nothing.
        elastic: >
          A small custom ingest pipeline and index template for
          logs-forcepoint_dlp.system with custom-namespace keyword mappings
          for forcepoint.dlp.system.topic and source_type, plus a lookup that
          resolves the numeric code into a human-readable condition so
          analysts are not reading raw server codes. The real deliverable here
          is absence detection rather than field fidelity: build the SOC rule
          on the gap — alert when a policy engine, protector, or endpoint
          agent that normally reports stops appearing — and keep this stream
          on a short retention since its value is operational, not forensic.
