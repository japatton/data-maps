    - vendor: threatsInfoMap.threatStatus
      type: enum
      description: current disposition of the threat (active, falsePositive, cleared)
      ecs: null
      status: unmapped
      custom: proofpoint_tap.message.threat.status
      notes: >-
        mutable - a later poll can retract an active verdict to falsePositive
        or cleared, so an append-only index keeps alerting on withdrawn
        verdicts
    - vendor: messageParts.sha256
      type: string
      description: >-
        SHA-256 of a message part (body or attachment), flattened from the
        messageParts array
      ecs: email.attachments.file.hash.sha256
      status: mapped
      notes: >-
        the malware alerting profile reads file.hash.sha256, which needs an
        explicit copy because ECS keeps attachment hashes under
        email.attachments.*
- id: tap-clicks
  name: TAP SIEM API URL click events
  description: >
    URL Defense click events pulled from the SIEM API v2
    (/v2/siem/clicks/blocked and /v2/siem/clicks/permitted). One JSON object
    per click on a rewritten URL that TAP had condemned, recording who
    clicked, from what address and user agent, when the URL was first
    identified as a threat, and whether the click was intercepted or allowed
    through. Clicks permitted are the operationally urgent half: they mean a
    user reached a known-malicious destination, usually because the verdict
    landed after delivery.
  event_categories:
  - web
  - malware
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same REST Collector poll as the message events - clicks and messages
        come from the same API and the same credential pair - and the guarded
        path keeps the outbound-polling collector on the low side.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-proofpoint_tap.clicks_permitted
      notes: >
        clicks_blocked and clicks_permitted are separate data streams with
        identical field sets; the integration sets event.action to denied on
        the blocked stream and allowed on the permitted stream, so the two
        streams are the only carrier of that distinction
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same REST Collector poll as the message events - clicks and messages
        come from the same API and the same credential pair - so the click
        collector shares that poll rather than running a second one.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-proofpoint_tap.clicks_permitted
      notes: >
        clicks_blocked and clicks_permitted are separate data streams with
        identical field sets; the integration sets event.action to denied on
        the blocked stream and allowed on the permitted stream, so the two
        streams are the only carrier of that distinction
  formats:
  - format: api-pull
    parsing:
      mechanism: elastic-integration
      artifact: Proofpoint TAP integration (clicks_blocked / clicks_permitted data streams)
      notes: >
        The integration URL-decodes the URL Defense rewrite into url.full,
        geo-enriches the clicker address, and sets @timestamp to the later of
        clickTime and threatTime. Custom field names below use a single
        proofpoint_tap.clicks.* namespace; the stock integration splits them
        across proofpoint_tap.clicks_blocked.* and
        proofpoint_tap.clicks_permitted.*.
    fields:
    - vendor: id
      type: string
      description: unique identifier for this click event
      ecs: event.id
      status: mapped
    - vendor: GUID
      type: string
      description: identifier of the message within PPS that carried the clicked URL
      ecs: null
      status: unmapped
      custom: proofpoint_tap.guid
      notes: >-
        joins the click back to the TAP message event and to the PPS filter
        log record for the same message
    - vendor: clickTime
      type: timestamp
      description: time the user clicked the rewritten URL
      ecs: null
      status: partial
      custom: proofpoint_tap.clicks.click_time
      transform: >
        the integration sets @timestamp to the later of clickTime and
        threatTime, so the click time must be kept as its own field or the
        post-delivery detection gap (threatTime minus clickTime) cannot be
        measured
    - vendor: threatTime
      type: timestamp
      description: time Proofpoint identified the URL as a threat
      ecs: null
      status: partial
      custom: proofpoint_tap.clicks.threat.time
      notes: >
        on the permitted stream this is routinely later than clickTime - the
        difference is the exposure window and is the most useful derived
        metric on this dataset
    - vendor: clickIP
      type: ip
      description: external IP address of the user who clicked the link
      ecs: destination.ip
      status: partial
      notes: >
        the Elastic integration puts the clicking user in destination.ip and
        the message sender in source.ip, orienting the event around the email
        rather than the HTTP request; the web alerting profile reads source.ip
        for the client, so this inversion has to be resolved explicitly or
        every click rule will read the wrong end
    - vendor: senderIP
      type: ip
      description: IP address the message carrying the URL was sent from
      ecs: source.ip
      status: mapped
    - vendor: sender
      type: string
      description: envelope sender of the message carrying the URL, with the user part hashed
      ecs: email.sender.address
      status: partial
      notes: >-
        the hashed local part makes this unusable for joining to sender-based
        detections; the click events carry no unhashed header From
    - vendor: recipient
      type: string
      description: email address of the user who clicked the URL
      ecs: email.to.address
      status: mapped
      notes: >
        this is also the identity that needs response action; consider copying
        it to user.target.email so identity-centric rules resolve without
        parsing the email object
    - vendor: url
      type: string
      description: the malicious URL that was clicked
      ecs: url.original
      status: partial
      notes: >
        the integration writes the URL-decoded value to url.full only; the web
        alerting profile requires url.original, so a copy is needed, and the
        URL Defense rewrite wrapper should be preserved separately from the
        decoded target
    - vendor: userAgent
      type: string
      description: 'User-Agent header from the clicking user''s HTTP request'
      ecs: user_agent.original
      status: mapped
    - vendor: messageID
      type: string
      description: RFC 5322 Message-ID of the message that carried the clicked URL
      ecs: email.message_id
      status: mapped
    - vendor: classification
      type: enum
      description: threat category of the malicious URL (Malware, Phish, Spam)
      ecs: null
      status: unmapped
      custom: proofpoint_tap.clicks.classification
      notes: vendor URL threat taxonomy, narrower than the message-event classification list
    - vendor: threatID
      type: string
      description: unique identifier for the threat, usable against the Forensics and Campaign APIs
      ecs: null
      status: unmapped
      custom: proofpoint_tap.clicks.threat.id
      notes: >
        detection identity, not indicator identity - deliberately not
        threat.indicator.id, which models an id issued by a threat-intel
        provider for an indicator document
    - vendor: threatStatus
      type: enum
      description: current state of the threat (active, falsePositive, cleared)
      ecs: null
      status: unmapped
      custom: proofpoint_tap.clicks.threat.status
      notes: >-
        same retraction problem as the message events - the verdict can be
        revised after the click event is indexed
    - vendor: campaignId
      type: string
      description: identifier of the campaign the threat belongs to, when known at query time
      ecs: null
      status: unmapped
      custom: proofpoint_tap.clicks.campaign_id
      notes: >
        often absent at click time and populated only on a later query of the
        Campaign API, so it cannot be treated as a stable grouping key at
        ingest
    - vendor: threatURL
      type: string
      description: link to the entry for this threat on the TAP dashboard
      ecs: null
      status: unmapped
      custom: proofpoint_tap.clicks.threat.url
      notes: >
        an analyst pivot link into the TAP console, not an observed URL - it
        must never populate url.original or threat.indicator.url.original or
        URL-based detections will fire on the vendor's own domain
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Share the message-event collector rather than running a second poll,
          deduplicate on the click id across overlapping windows, and stamp
          the PPS cluster identity so host.name is populated - the payload
          names no host and the malware alerting profile requires one. Keep
          the raw rewritten URL Defense link alongside the decoded target so
          the rewrite itself stays available for abuse investigation, and use
          Persistent Queue backpressure on the destination.
        elastic: >
          Run the stock clicks pipelines and add a @custom pipeline that
          copies url.full into url.original, because the web alerting profile
          reads url.original and the integration only writes url.full. Decide
          and document the clicker-address orientation: the integration places
          the clicking user's IP in destination.ip and the message sender's IP
          in source.ip, which is coherent for an email-centric view but
          inverts what every web-category rule expects, so either re-orient in
          the custom pipeline or write the click rules against destination.ip
          deliberately. Map the threat id, campaign id and classification as
          keyword, and drive alert priority off the permitted-versus-blocked
          stream rather than off any field in the document.
        relay: >
          The feed is already JSON, so the standard NDJSON envelope crosses
          with nothing CEF-shaped involved. The clicked URL is the content
          filter's whole problem here: percent-encoded, base64-bearing,
          kilobyte-scale attacker-controlled text that must be length-capped
          and unicode-normalized low-side, and the URL Defense wrapper should
          be decoded before the crossing so the filter inspects one canonical
          form rather than two. Volume is low enough that carrying the raw
          record across is affordable until the click rules are proven.
      direct:
        parse_location: high
        cribl: >
          Share the message-event collector rather than running a second poll,
          deduplicate on the click id across overlapping windows, and stamp
          the PPS cluster identity so host.name is populated - the payload
          names no host and the malware alerting profile requires one. Keep
          the raw rewritten URL Defense link alongside the decoded target so
          the rewrite itself stays available for abuse investigation, and use
          Persistent Queue backpressure on the destination.
        elastic: >
          Run the stock clicks pipelines and add a @custom pipeline that
          copies url.full into url.original, because the web alerting profile
          reads url.original and the integration only writes url.full. Decide
          and document the clicker-address orientation: the integration places
          the clicking user's IP in destination.ip and the message sender's IP
          in source.ip, which is coherent for an email-centric view but
          inverts what every web-category rule expects, so either re-orient in
          the custom pipeline or write the click rules against destination.ip
          deliberately. Map the threat id, campaign id and classification as
          keyword, and drive alert priority off the permitted-versus-blocked
          stream rather than off any field in the document.
  - format: syslog-kv
    enable: >
      Add &format=syslog to the same clicks poll the api-pull feed uses (for
      example
      https://tap-api-v2.proofpoint.com/v2/siem/clicks/permitted?format=syslog&sinceSeconds=3600,
      or /v2/siem/all), with the Service-Principal / Secret pair. The response
      is RFC 5424 syslog, one line per click event, carrying the fields in a
      [tapclk@21139 ...] structured-data block. It remains an outbound HTTPS
      pull - the same transport as the JSON feed - so the collector placement
      is unchanged from the api-pull feed; only the response serialization
      changes.
    references:
    - https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/SIEM_API
    - https://docs.rapid7.com/insightidr/proofpoint-tap/
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        hand-built RFC 5424 SD parser emitting the proofpoint_tap clicks shape
        (the stock integration ingests JSON, not this form)
      notes: >
        format=syslog forgoes the packaged clicks_blocked / clicks_permitted
        pipelines, which expect JSON. A hand-built pipeline must parse the RFC
        5424 header and the tapclk@21139 SD-PARAMs, then populate the same
        url.*, source.ip / destination.ip and proofpoint_tap.clicks.* fields
        the JSON path produces. The permitted-versus-blocked distinction the
        JSON integration carries in two data streams must be reconstructed
        from the endpoint (or eventTypeString) the line came from, since one
        syslog stream carries both. Field homes below match the api-pull
        because the content is identical.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the RFC 5424 SD low-side and emit structured NDJSON - do not
          relay raw click lines. Decode the tapclk@21139 SD-PARAMs, carry the
          blocked-versus-permitted disposition explicitly (the two JSON data
          streams collapse into one syslog stream, so derive it from the
          endpoint or eventTypeString), dedup on the click id across
          overlapping windows, and stamp the PPS cluster identity so host.name
          is populated. Keep the raw URL Defense rewrite alongside the decoded
          target and cap/normalize the clicked URL before the destination,
          since it is the whole content-filter problem here.
        elastic: >
          With the stock clicks pipelines bypassed, land the parsed events on
          a custom ingest pipeline: url to url.original with a copy to
          url.full, userAgent to user_agent.original, senderIP to source.ip,
          recipient to email.to.address, messageID to email.message_id, and id
          to event.id. Decide and document the clicker-address orientation -
          the JSON integration puts the clicking user in destination.ip and
          the sender in source.ip, which inverts what web rules expect - and
          either re-orient here or write click rules against destination.ip
          deliberately. Preserve clickTime and threatTime as their own fields
          so the post-delivery exposure window (threatTime minus clickTime)
          stays measurable, and handle threatStatus retractions with
          update-by-query.
        relay: >
          Cross the low-side-parsed NDJSON, never the RFC 5424 line. The
          clicked URL is the content filter's whole problem - percent-encoded,
          base64-bearing, kilobyte-scale attacker-controlled text - so decode
          the URL Defense wrapper and length-cap and unicode-normalize the
          target low-side before the guard destination, so the filter inspects
          one canonical form. Volume is low enough that carrying the record
          across is affordable until the click rules are proven; dedup on the
          click id and reconcile counts per (dataset, hour).
      direct:
        parse_location: low
        cribl: >
          High-side collector with no guard: prefer the JSON feed, but if
          syslog is the only form, parse the RFC 5424 SD at the collector,
          reconstruct the blocked/permitted disposition from the endpoint, and
          dedup on the click id in one hand-built pipeline.
        elastic: >
          With the stock clicks pipelines bypassed, land the parsed events on
          a custom ingest pipeline: url to url.original with a copy to
          url.full, userAgent to user_agent.original, senderIP to source.ip,
          recipient to email.to.address, messageID to email.message_id, and id
          to event.id. Decide and document the clicker-address orientation -
          the JSON integration puts the clicking user in destination.ip and
          the sender in source.ip, which inverts what web rules expect - and
          either re-orient here or write click rules against destination.ip
          deliberately. Preserve clickTime and threatTime as their own fields
          so the post-delivery exposure window (threatTime minus clickTime)
          stays measurable, and handle threatStatus retractions with
          update-by-query. Treat this as a fallback: the JSON feed retains the
          stock clicks_blocked / clicks_permitted pipelines and the
          event.action (denied/allowed) they set per stream, which the single
          syslog stream makes you reconstruct by hand.
