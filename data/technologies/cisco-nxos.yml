id: cisco-nxos
name: Cisco Nexus NX-OS
vendor: Cisco
versions: NX-OS 7.x, 9.3(x), 10.x (Nexus 3000/5000/6000/7000/9000)
draft: true
references:
- >-
  https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus5600/sw/system_messages/reference/sl_nxos_book/sl_intro.html
- >-
  https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/102x/configuration/system-management/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-102x/m-configuring-system-message-logging-10x.html
- >-
  https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus5600/sw/qos/7x/b_5600_QoS_Config_7x/configuring_acl_logging.html
- >-
  https://www.cisco.com/c/en/us/support/docs/switches/nexus-7000-series-switches/118907-configure-nx7k-00.html
- >-
  https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus3000/sw/security/7x/b_Cisco_n3k_Security_Config_7x/b_Cisco_n3k_Security_Config_7x_chapter_010.html
- >-
  https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/106x/system-messages/n9k-syslogs-10-6-2-f.html
- https://www.elastic.co/docs/reference/integrations/cisco_nexus
- >-
  https://github.com/elastic/integrations/blob/main/packages/cisco_nexus/data_stream/log/elasticsearch/ingest_pipeline/default.yml
- >-
  https://github.com/elastic/integrations/blob/main/packages/cisco_nexus/data_stream/log/elasticsearch/ingest_pipeline/pipeline_extract_message.yml
- >-
  https://github.com/elastic/integrations/blob/main/packages/cisco_nexus/data_stream/log/fields/fields.yml
datasets:
- id: acl-logging
  name: ACL logging
  description: >
    Flow records emitted by the NX-OS ACL logging cache for ACEs carrying the
    `log` keyword: %ACLLOG-6-ACLLOG_NEW_FLOW when a flow is first seen,
    %ACLLOG-6-ACLLOG_FLOW_INTERVAL at the end of every cache interval with
    that interval's hit count, and %ACLLOG-3-ACLLOG_MAXFLOW_REACHED when the
    cache fills. Unlike IOS, NX-OS does not print a free-form sentence — it
    prints a labelled comma-separated tuple, and it names the ACL and the ACE
    action explicitly. TWO label dialects exist and they are not
    interchangeable: the long form on Nexus 5000/6000 (`Source IP: ...,
    Destination IP: ..., Source Port: ..., Destination Port: ..., Source
    Interface : ..., protocol: "ICMP"(1), Hit-count = 5`, note the space
    before the colon on `Source Interface` and the `=` on Hit-count) and the
    abbreviated detailed/OAL form on Nexus 7000/9000 (`Src IP: ..., Dst IP:
    ..., Src Port: ..., Dst Port: ..., Src Intf: ..., Protocol: "ICMP"(1), ACL
    Name: test1, ACE Action: Permit, Appl Intf: Ethernet4/5, Hit-count: 69`).
    Highest-volume dataset in this file.
  event_categories:
  - network
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Receives NX-OS syslog from the device `logging server` configuration.
        Note that NX-OS does NOT support cleartext TCP syslog on 9.2(1) and
        later — the listener is UDP/514 or TLS, which is a sizing and a
        firewall question before it is a parsing one. All four datasets in
        this file share one syslog listener and one Elastic data stream.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_nexus.log
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Receives NX-OS syslog from the device `logging server` configuration.
        Note that NX-OS does NOT support cleartext TCP syslog on 9.2(1) and
        later — the listener is UDP/514 or TLS, which is a sizing and a
        firewall question before it is a parsing one. All four datasets in
        this file share one syslog listener and one Elastic data stream.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_nexus.log
  formats:
  - format: syslog-raw
    parsing:
      mechanism: elastic-integration
      artifact: Cisco Nexus integration (cisco_nexus), data stream logs-cisco_nexus.log
      notes: >
        MAJOR GAP — the cisco_nexus integration ships one ingest pipeline and
        one data stream, and its message-body pipeline branches on roughly
        twenty-one mnemonics (the ETHPORT/IF_* family, VSHD_SYSLOG_CONFIG_I,
        UPDOWN, LINEPROTO, LOGIN_SUCCESS, SYSTEM_MSG, L2FM_MAC_MOVE2 and
        friends). ACLLOG is NOT among them. Every field below therefore
        arrives with the header parsed (event.code, cisco_nexus.log.facility,
        cisco_nexus.log.severity) and the entire flow tuple sitting unparsed
        in cisco_nexus.log.description / message. There is no source.ip, no
        destination.ip and no rule.name on this dataset out of the box.
        Because the tuple is labelled and comma-delimited it is cheap to
        extract, but the two label dialects above need two patterns, not one.
    fields:
    - vendor: facility
      type: string
      description: >-
        Subsystem that raised the message, the first token of the
        %FACILITY-SEVERITY-MNEMONIC header
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.facility
      notes: >
        ACLLOG for this whole dataset. Deliberately NOT mapped to
        log.syslog.facility.name — that ECS field means the RFC 3164 numeric
        facility (local7 etc.), which the integration derives separately from
        the priority number. NX-OS uses a facility vocabulary of its own
        (ACLLOG, ETHPORT, VSHD, AUTHPRIV, VPC, L2FM), not the IOS one.
    - vendor: severity
      type: integer
      description: Single digit 0-7 in the message header indicating message importance
      ecs: event.severity
      status: partial
      notes: >
        Cisco severity is INVERTED relative to ECS convention — 0 is emergency
        and 7 is debug. The integration copies the digit verbatim into
        event.severity and separately derives log.level from a lookup array
        (emergency/alert/critical/error/warning/notification/informational/
        debugging). ACLLOG_NEW_FLOW and ACLLOG_FLOW_INTERVAL are severity 6 on
        Nexus 7000/9000 but appear at 3 on some Nexus 5000 builds, so severity
        is not a stable discriminator between the two dialects either.
    - vendor: mnemonic
      type: string
      description: Message code identifying the specific ACL logging record
      ecs: event.code
      status: mapped
      transform: >
        ACLLOG_NEW_FLOW / ACLLOG_FLOW_INTERVAL / ACLLOG_MAXFLOW_REACHED. The
        integration extracts it as cisco_nexus.log.type and copies it to
        event.code without the facility prefix. It is the primary key for all
        downstream parsing, and NEW_FLOW vs FLOW_INTERVAL is what tells an
        analyst whether Hit-count is 1-by-definition or a real interval count.
    - vendor: Src IP / Source IP
      type: ip
      description: Address the logged flow was sent from
      ecs: source.ip
      status: partial
      notes: >
        Nothing in the stock pipeline extracts this — it survives only inside
        cisco_nexus.log.description. Status is unmapped rather than mapped
        because source.ip is genuinely absent today; source.ip is the correct
        destination once the custom ACLLOG branch is written.
    - vendor: Dst IP / Destination IP
      type: ip
      description: Address the logged flow was sent to
      ecs: destination.ip
      status: partial
      notes: >-
        same unparsed situation as the source address; the two labels differ
        between the abbreviated and long dialects and both must be handled
    - vendor: Src Port / Source Port
      type: port
      description: Source port of the logged flow
      ecs: source.port
      status: partial
      notes: >
        NX-OS prints a literal 0 for protocols with no ports (ICMP, GRE, ESP)
        rather than omitting the label, so a naive extraction produces
        source.port=0 on a large fraction of records. Suppress the zero rather
        than indexing it, or port-based aggregations will be dominated by it.
    - vendor: Dst Port / Destination Port
      type: port
      description: Destination port of the logged flow
      ecs: destination.port
      status: partial
      notes: same zero-for-portless-protocols behaviour as the source port
    - vendor: Src Intf / Source Interface
      type: string
      description: Interface the logged packet arrived on
      ecs: observer.ingress.interface.name
      status: partial
      notes: >
        e.g. Ethernet2/10. The long dialect prints `Source Interface :` with a
        space before the colon, which breaks a dissect written against the
        abbreviated form. observer.ingress.interface.name is the right ECS
        home here (the packet genuinely ingressed), unlike the interface-state
        dataset where nothing ingresses; the integration's own
        cisco_nexus.log.interface.name is populated only for ETHPORT
        mnemonics, so do not expect it here.
    - vendor: protocol
      type: string
      description: Quoted transport protocol name printed by the ACL logging cache
      ecs: network.transport
      status: partial
      transform: >
        printed as `Protocol: "ICMP"(1)` (abbreviated dialect) or `protocol:
        "ICMP"(1)` — note the lowercase label — with the quotes as part of the
        value. Strip the quotes and lowercase before writing
        network.transport, whose ECS convention is lowercase.
    - vendor: protocol number
      type: integer
      description: IANA protocol number printed in parentheses after the protocol name
      ecs: network.iana_number
      status: partial
      notes: >
        the `(1)` in `"ICMP"(1)`. Unlike IOS, NX-OS prints BOTH the name and
        the number on every record rather than switching templates, so
        network.iana_number can be populated unconditionally — a genuine
        improvement over the cisco-ios ACL dataset.
    - vendor: ACL Name
      type: string
      description: Name of the access list whose ACE matched the flow
      ecs: rule.name
      status: partial
      notes: >
        present only in the abbreviated detailed/OAL dialect on Nexus
        7000/9000 (`logging ip access-list detailed`); the Nexus 5000/6000
        dialect omits it entirely, so roughly half the estate cannot attribute
        a deny to an ACL at all. rule.name is the right home and rule.id has
        no source — NX-OS names the list but not the individual ACE, so two
        different deny reasons inside one ACL are indistinguishable.
    - vendor: ACE Action
      type: enum
      description: Whether the matched ACE permitted or denied the flow
      ecs: event.action
      status: partial
      transform: >
        `Deny` becomes event.action=deny with event.type=[denied], `Permit`
        becomes event.action=allow with event.type=[allowed]. Detailed-dialect
        only. NX-OS emits no outcome token, so event.outcome stays null across
        the dataset and detections must key on event.action. Note that the
        cache logs denies by default; permits appear only where an operator
        put `log` on a permit ACE, and those are the high-volume ones.
    - vendor: Appl Intf
      type: string
      description: Interface the matching access list is applied to
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.applied_interface
      notes: >
        usually but not always equal to Src Intf — they diverge for ACLs
        applied on an SVI or in the egress direction. Kept custom because
        observer.egress.interface.name would be semantically wrong (a denied
        packet never egressed) and observer.ingress.interface.name is already
        taken by Src Intf.
    - vendor: Hit-count
      type: long
      description: Number of packets matching the flow during the logging cache interval
      ecs: source.packets
      status: partial
      transform: >
        printed as `Hit-count: 69` in the abbreviated dialect and `Hit-count =
        5` in the long one. Always 1 on ACLLOG_NEW_FLOW by definition; the
        real counts arrive on ACLLOG_FLOW_INTERVAL, and the counter resets to
        zero each interval. Because one line represents many packets, naive
        event counting UNDERCOUNTS denies — volumetric detections (scan,
        sweep, brute force) must sum this field. Copy it to network.packets as
        well so cross-vendor content works.
    - vendor: sequence_number
      type: long
      description: >-
        Per-device monotonic message counter emitted when `logging message
        sequence-number` is configured
      ecs: event.sequence
      status: mapped
      notes: >-
        extracted by the header grok; gaps in this sequence are the cleanest
        available detector for dropped UDP syslog between the switch and
        Cribl, and are the only in-band cross-check on the guard
        reconciliation described above
    - vendor: switch_name
      type: string
      description: Device name carried in the syslog header
      ecs: observer.name
      status: mapped
      notes: >
        a real improvement over cisco_ios — the nexus pipeline DOES populate
        observer.name (and host.hostname and related.hosts) from this token,
        along with observer.vendor=Cisco, observer.product=Nexus and
        observer.type=switches. The header grok accepts either a name or an IP
        in this position and routes an IP to cisco_nexus.log.ip_address /
        observer.ip instead, so device identity is split across two fields
        depending on the device's `logging source-interface` configuration.
    - vendor: priority_number
      type: integer
      description: RFC 3164 PRI value at the head of the syslog line
      ecs: log.syslog.priority
      status: mapped
      notes: >-
        the integration decomposes it into log.syslog.facility.code and
        log.syslog.severity.code; the syslog severity derived here and the
        NX-OS severity digit above are independent values and routinely
        disagree
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through and rely on the
          device-side cache controls (`logging ip access-list cache interval`,
          `entries`, `threshold`) rather than adding Cribl sampling, since
          NX-OS already aggregates a flow into one line per interval and
          Cribl-side sampling would silently bias hit counts. Attach
          ACL-name-to-owning-fabric and device-to-owner lookups low-side while
          the operator-chosen ACL names still resolve, and set observer.name
          from the syslog input metadata for the sources whose header carries
          an IP rather than a switch name. This is the file's highest-volume,
          lowest-forensic-value dataset, so drop _raw here first once the
          tuple extraction is proven, and run the Elastic destination on
          Persistent Queue backpressure, never Block.
        elastic: >
          Own a logs-cisco_nexus.log@custom pipeline that adds the ACLLOG
          branch the stock integration lacks, with two dissect/grok variants
          keyed on event.code — one for the long `Source IP:`/`Hit-count =`
          dialect and one for the abbreviated `Src IP:`/`ACL Name:`/`ACE
          Action:` detailed dialect — writing source.ip, destination.ip,
          source.port, destination.port, rule.name and event.action rather
          than leaving the tuple in message. Split the `"ICMP"(1)` token into
          network.transport (lowercased, quotes stripped) and
          network.iana_number, derive event.severity from the Cisco digit by
          lookup instead of keeping the verbatim inverted copy, and map
          Hit-count to source.packets as a long so volumetric detections sum
          matches instead of counting documents. Add custom-namespace index
          template mappings for the applied-interface and slot/standby fields,
          and give ACLLOG_MAXFLOW_REACHED its own low-noise monitor — it is
          the only signal that the flow cache overflowed and denies went
          unlogged.
        relay: >
          Low-side instances cross the guard: send the thin envelope
          ({_dataId, @timestamp, host, _raw}) with hybrid parsing behind a
          Persistent Queue and a low-side dead-letter route rather than Block.
          The content-filter friction is the operator-defined ACL and
          interface names, which in a data-centre fabric encode tenant and
          enclave topology directly — bound their length and constrain them to
          ASCII low-side so a simple custom NDJSON filter can pass them. Given
          the volume this is the first dataset to drop _raw from the crossing,
          and because the crossing is at-most-once, reconcile low-side against
          high-side counts per (dataset, hour) — an unreconciled gap here is
          indistinguishable from a flow-cache overflow.
      direct:
        parse_location: high
        cribl: >
          Keep the core worker group a pass-through and rely on the
          device-side cache controls (`logging ip access-list cache interval`,
          `entries`, `threshold`) rather than adding Cribl sampling, since
          NX-OS already aggregates a flow into one line per interval and
          Cribl-side sampling would silently bias hit counts. Attach
          ACL-name-to-owning-fabric and device-to-owner lookups on the core
          worker group while the operator-chosen ACL names still resolve, and
          set observer.name from the syslog input metadata for the sources
          whose header carries an IP rather than a switch name. This is the
          file's highest-volume, lowest-forensic-value dataset, so trim
          event.original retention here first once the tuple extraction is
          proven, and run the Elastic destination on Persistent Queue
          backpressure, never Block.
        elastic: >
          Own a logs-cisco_nexus.log@custom pipeline that adds the ACLLOG
          branch the stock integration lacks, with two dissect/grok variants
          keyed on event.code — one for the long `Source IP:`/`Hit-count =`
          dialect and one for the abbreviated `Src IP:`/`ACL Name:`/`ACE
          Action:` detailed dialect — writing source.ip, destination.ip,
          source.port, destination.port, rule.name and event.action rather
          than leaving the tuple in message. Split the `"ICMP"(1)` token into
          network.transport (lowercased, quotes stripped) and
          network.iana_number, derive event.severity from the Cisco digit by
          lookup instead of keeping the verbatim inverted copy, and map
          Hit-count to source.packets as a long so volumetric detections sum
          matches instead of counting documents. Add custom-namespace index
          template mappings for the applied-interface and slot/standby fields,
          and give ACLLOG_MAXFLOW_REACHED its own low-noise monitor — it is
          the only signal that the flow cache overflowed and denies went
          unlogged.
  - format: snmp-trap
    enable: >
      Enable the syslog notification with `snmp-server enable traps syslog`
      (the `message-generated` sub-option selects clogMessageGenerated),
      supported on NX-OS 7.1 and later, and add the manager as a receiver with
      `snmp-server host <manager-ip> traps {version 2c <community> | version 3
      {auth|priv} <user>} udp-port <port>`. The trapped severity floor is the
      CISCO-SYSLOG-MIB clogMaxSeverity object, which must include
      informational because the ACL records are severity 6; confirm the
      device's logging level for the acllog facility is high enough that the
      records are generated at all. Prefer SNMPv3 auth+priv because the
      trapped ACL records disclose operator-chosen access-list names and
      internal addresses. This trap set is a distinct control from the
      `logging server` syslog destination; a device can run both, but see the
      double-counting caveat in the direct recommendation.
    references:
    - >-
      https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/102x/configuration/system-management/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-102x/m-configuring-snmp-10x.html
    - https://web.mit.edu/outland/share/snmp/mibs/CISCO-SYSLOG-MIB.my
    - https://github.com/cisco/cisco-mibs/blob/main/schema/CISCO-SYSLOG-MIB.schema
    parsing:
      mechanism: cribl-pipeline
      artifact: custom NX-OS SNMP-trap (CISCO-SYSLOG-MIB) reparse pipeline
      notes: >
        Neither the stock cisco_nexus integration nor any Cribl pack ingests
        SNMP traps: a trap receiver (snmptrapd or an equivalent SNMP source)
        must terminate the PDU and expose the varbinds first. The pipeline
        then copies clogHistMsgText into event.original and runs the SAME
        per-dialect ACLLOG dissect the stock integration lacks - one variant
        for the long `Source IP:` / `Hit-count =` form and one for the
        abbreviated `Src IP:` / `ACL Name:` / `ACE Action:` detailed form -
        because the trap only re-transports the body, it does not structure
        it. The varbinds are a convenience (facility, mnemonic and severity
        arrive broken out of the header) but remove none of the body-parsing
        work, and the 255-byte clogHistMsgText cap can clip the longer
        detailed-dialect records past the ACL name and hit count.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Terminate the trap on a low-side SNMP receiver, decode the varbinds,
          and map clogHistMsgText to event.original before the crossing - a
          CDS cannot inspect an opaque SNMP PDU, and traps are unacknowledged
          UDP, so decode and validate low-side. This is the highest-volume,
          lowest-forensic-value dataset in the file and a trap-per-record is
          costly, so lean on the device's own cache controls (`logging ip
          access-list cache interval/entries/threshold`) rather than Cribl
          sampling, attach the ACL-name-to-fabric and device-to-owner lookups
          low-side while the names still resolve, and set observer.name from
          the receiver metadata because the trap carries no observer identity.
          Persistent Queue on the Elastic destination, never Block.
        elastic: >
          A custom logs-cisco_nexus.log@custom-compatible pipeline that parses
          clogHistMsgText with the two dialect variants, then applies the same
          derivations the syslog dataset needs: split `"ICMP"(1)` into
          network.transport (lowercased, dequoted) and network.iana_number,
          suppress the literal zero port on portless protocols, copy the
          parsed ACL name into rule.name and set event.action from the ACE
          action, and map Hit-count to source.packets as a long so volumetric
          detections sum rather than count documents. Convert clogHistSeverity
          (the 1-8 MIB enum) by subtracting one to recover the Cisco 0-7
          digit, which is still INVERTED versus ECS, so reuse the severity
          lookup from the syslog feed instead of thresholding the raw value.
          Give ACLLOG_MAXFLOW_REACHED its own low-noise monitor.
        relay: >
          Cross decoded NDJSON, never the raw trap PDU. The content-inspection
          friction is identical to the syslog feed - the operator-defined ACL
          and interface names encode enclave and tenant topology - so bound
          their length and constrain them to ASCII low-side, and add the
          varbind envelope to the fields the guard sees. Given the volume this
          is the dataset to drop event.original from the crossing first once
          the per-dialect reparse is proven. Persistent Queue plus a low-side
          dead-letter route rather than Block, and reconcile low-side against
          high-side counts per (dataset, hour) since both the crossing and the
          trap transport are at-most-once - an unreconciled gap here is
          indistinguishable from a flow-cache overflow.
      direct:
        parse_location: high
        cribl: >
          For a high-side switch with no guard, terminate the trap on an SNMP
          receiver and forward the decoded varbinds to the core worker group;
          there is little advantage over plain syslog for the ACL family and a
          real per-record PDU cost at this volume, so adopt it only where SNMP
          is the existing collection path. Do not run the syslog trap and the
          `logging server` feed as dual authoritative sources for the same ACL
          family on one switch - pick one to avoid double-counting flows.
        elastic: >
          A custom logs-cisco_nexus.log@custom-compatible pipeline that parses
          clogHistMsgText with the two dialect variants, splits `"ICMP"(1)`
          into network.transport (lowercased, dequoted) and
          network.iana_number, suppresses the literal zero port on portless
          protocols, copies the parsed ACL name into rule.name, sets
          event.action from the ACE action, and maps Hit-count to
          source.packets as a long so volumetric detections sum rather than
          count documents. Convert clogHistSeverity by subtracting one to
          recover the Cisco 0-7 digit, still INVERTED versus ECS, and drive
          log.level from the shared severity lookup. With no boundary the
          tradeoff to accept is the 255-byte truncation on the longer
          detailed-dialect records - alert on clipped records so an analyst
          sees when an ACL match arrived truncated, and treat the trap as
          strictly inferior to syslog-raw for full-fidelity ACL forensics.
    fields:
    - vendor: clogHistMsgText
      type: string
      description: >-
        CISCO-SYSLOG-MIB - full text of the ACLLOG record; SnmpAdminString
        capped at 255 bytes, so longer detailed-dialect records are clipped.
      ecs: event.original
      status: partial
      notes: >
        carries the whole labelled flow tuple in whichever of the two dialects
        the platform emits; every address, port, the `"ICMP"(1)` token, the
        ACL name, the ACE action and the Hit-count still have to be parsed out
        of it with the same per-dialect grammar as syslog-raw. The abbreviated
        detailed dialect is the record most likely to be clipped by the
        255-byte cap.
    - vendor: clogHistMsgName
      type: string
      description: CISCO-SYSLOG-MIB - message name (the bare mnemonic), SIZE 1..30.
      ecs: event.code
      status: mapped
      transform: >
        ACLLOG_NEW_FLOW / ACLLOG_FLOW_INTERVAL / ACLLOG_MAXFLOW_REACHED,
        supplied without the facility prefix - matching the syslog-raw feed's
        event.code convention - so a rule keyed on event.code still matches.
        NEW_FLOW versus FLOW_INTERVAL is what tells an analyst whether
        Hit-count is 1-by-definition or a real interval count.
    - vendor: clogHistFacility
      type: string
      description: >-
        CISCO-SYSLOG-MIB - name of the facility that generated the message
        (here 'ACLLOG'), SIZE 1..20.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.facility
      notes: >
        Deliberately NOT mapped to log.syslog.facility.name - that ECS field
        means the RFC 3164 numeric facility (local7 etc.), a different thing
        from the NX-OS subsystem name. Takes the same custom namespace as the
        syslog dataset's facility field.
    - vendor: clogHistSeverity
      type: integer
      description: CISCO-SYSLOG-MIB - SyslogSeverity enum emergency(1)..debug(8).
      ecs: event.severity
      status: partial
      transform: >
        the MIB enum is 1-8, offset by one from the raw Cisco 0-7 syslog
        digit; subtract one to recover the digit the syslog feed carries. That
        digit is still INVERTED relative to ECS (0 is most severe), so drive
        log.level and thresholds from the shared lookup, not the raw value.
        NEW_FLOW/FLOW_INTERVAL are severity 6 on Nexus 7000/9000.
    - vendor: clogHistTimestamp
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - value of sysUpTime (device-uptime ticks) when the
        message was generated.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.snmp.sysuptime
      notes: >
        device-uptime ticks, NOT wall-clock, so it cannot populate @timestamp
        directly; @timestamp must come from the trap-receiver arrival time or
        be reconstructed from sysUpTime plus agent boot time.
    - vendor: clogHistIndex
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - monotonically increasing index of the message in
        the syslog history table, carried in the varbind OID instance.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.snmp.history_index
      notes: >
        the syslog-history table row index; gaps or duplicates in it are the
        trap-transport analogue of the syslog sequence number and the only way
        to detect dropped traps, since they are unacknowledged UDP.
  - format: api-pull
    enable: >
      Turn on the on-box HTTP server with `feature nxapi` (prefer `nxapi https
      port 443` with a real certificate and disable the cleartext `nxapi
      http`), and create a least-privilege local account for the poller.
      Retrieve the buffer by POSTing a show command to the `/ins` endpoint -
      either the JSON-RPC 2.0 body
      `{"jsonrpc":"2.0","method":"cli","params":{"cmd":"show logging
      logfile","version":1},"id":1}` with Content-Type application/json-rpc,
      or the ins_api envelope with `output_format` set to json. The pull
      targets are `show logging logfile`, `show logging last <n>` and `show
      logging nvram`; size and persist the on-box file with `logging logfile
      <name> <level> size <bytes>` so a full poll interval of ACL records
      survives between fetches. Keep `logging ip access-list cache
      interval/entries/threshold` as the real volume control - polling does
      not reduce what the cache emits. Because the pulled lines carry the
      operator-chosen ACL and interface names verbatim, treat the NX-API
      account and transport with the same care as the syslog path.
    references:
    - >-
      https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/programmability/guide/b_Cisco_Nexus_9000_Series_NX-OS_Programmability_Guide_7x/NX_API.html
    - >-
      https://developer.cisco.com/docs/cisco-nexus-9000-series-nx-api-cli-reference/latest/logging-commands/
    - >-
      https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/102x/configuration/system-management/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-102x/m-configuring-system-message-logging-10x.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Cribl REST Collector + logs-cisco_nexus.log reparse pipeline
      notes: >
        Neither the stock cisco_nexus Elastic integration nor any Cribl pack
        polls NX-API - a Cribl REST/API Collector must fetch `/ins`, walk the
        `TABLE_*/ROW_*` array and lift each `log` string out as
        event.original, after which the SAME per-mnemonic parsing the syslog
        feed lacks for ACLLOG must run: the two label dialects (the long
        `Source IP:` / `Hit-count =` form and the abbreviated `Src IP:` / `ACL
        Name:` / `ACE Action:` detailed form) both arrive as opaque raw text
        here, just as on the wire. NX-API adds no structure to the body at
        all, so the pull buys nothing for parsing and costs the
        buffer-turnover data loss described above.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          If NX-API is polled at all for this dataset it must be done low-side
          on the collector reaching into the switch, then the decoded records
          cross the guard exactly like the syslog feed. Run a Cribl REST
          Collector against `/ins`, unwrap the ROW_.log lines to
          event.original, and deduplicate on the embedded sequence number
          before anything leaves the enclave, because overlapping polls of a
          fast-turning ACL buffer will re-present records. Attach the
          ACL-name-to-fabric and device-to-owner lookups low-side while the
          names still resolve, set observer.name from the poll target (the
          NX-API envelope carries no device identity), and run the Elastic
          destination on Persistent Queue, never Block. Given the volume and
          the guaranteed buffer loss, prefer the syslog listener and treat
          this pull as a fallback only.
        elastic: >
          Reuse the same logs-cisco_nexus.log@custom pipeline the syslog path
          needs - the ACLLOG branch with two dissect variants keyed on
          event.code, the `"ICMP"(1)` split into network.transport and
          network.iana_number, the zero-port suppression and the Hit-count to
          source.packets mapping - because the body grammar is byte-identical
          once event.original is recovered from the JSON row. Add nothing
          NX-API-specific beyond a tag recording that the record was pulled
          rather than received, so an analyst can tell a poll-gap loss from a
          flow-cache overflow.
        relay: >
          Cross decoded NDJSON, never the raw NX-API JSON blob - a CDS cannot
          usefully inspect a TABLE_/ROW_ envelope. The content-filter friction
          is identical to the syslog feed: the operator-defined ACL and
          interface names encode tenant and enclave topology, so bound their
          length and constrain them to ASCII low-side. This is the first
          dataset to drop event.original from the crossing given the volume,
          and because both the crossing and the pull are lossy, reconcile
          low-side against high-side counts per (dataset, hour) - here an
          unreconciled gap could be a poll-gap, a buffer overrun OR a
          flow-cache overflow, so keep the pull cadence and buffer size in the
          reconciliation metadata.
      direct:
        parse_location: high
        cribl: >
          For a high-side switch with no guard, a REST Collector against
          `/ins` forwards decoded ROW_.log lines straight to the core worker
          group. There is no fidelity advantage over syslog for the ACL family
          and a real buffer-turnover loss at this volume, so adopt the pull
          only where syslog cannot reach the collector, and never run the pull
          and the `logging server` feed as dual authoritative sources for one
          switch or every interval record double-counts.
        elastic: >
          A logs-cisco_nexus.log@custom ACLLOG branch with two dissect
          variants keyed on event.code, the `"ICMP"(1)` split into
          network.transport and network.iana_number, the zero-port suppression
          and the Hit-count-to-source.packets summation - the body grammar is
          byte-identical once event.original is recovered from the JSON row.
          Alert on gaps in the embedded sequence number, which on the pull
          transport is the only signal that the on-box logfile rotated between
          polls and denies went uncollected.
    fields:
    - vendor: ROW_logfile.log / ROW_nvram.log
      type: string
      description: >-
        NX-API - one buffered syslog record returned as a whole raw ASCII line
        inside the TABLE_/ROW_ array of a `show logging` response.
      ecs: event.original
      status: partial
      notes: >
        carries the entire %ACLLOG record - both label dialects, the flow
        tuple, the `"ICMP"(1)` token and the Hit-count - as undecomposed text.
        NX-API breaks out none of it, so every field the syslog dataset
        extracts must be parsed out of this line with the identical
        per-mnemonic grammar; the pull only reframes the record, it does not
        structure it.
    - vendor: mnemonic (embedded)
      type: string
      description: The ACLLOG message code, present only inside the raw ROW_.log line
      ecs: event.code
      status: partial
      notes: >
        ACLLOG_NEW_FLOW / ACLLOG_FLOW_INTERVAL / ACLLOG_MAXFLOW_REACHED. Not a
        distinct NX-API field - unlike the IOS SNMP trap's clogHistMsgName,
        which supplies the mnemonic alone, here it survives only inside
        event.original and is recovered by the same header parse the syslog
        feed uses.
    - vendor: sequence_number (embedded)
      type: long
      description: >-
        Per-device monotonic message counter inside the raw line when `logging
        message sequence-number` is set
      ecs: event.sequence
      status: partial
      notes: >
        on the pull transport this does double duty - it is both the dedup key
        for overlapping polls and the only detector for records lost when the
        bounded on-box logfile rotates between fetches. Absent unless the
        device is configured to emit it, so a pull deployment should require
        that command.
    - vendor: switch_name (embedded)
      type: string
      description: Device name at the head of the raw syslog line
      ecs: observer.name
      status: partial
      notes: >
        the NX-API response envelope carries no device identity of its own, so
        observer.name must come either from this embedded token (parsed the
        same way as the syslog feed) or from the poll target address; set it
        explicitly on the collector rather than trusting the pulled text.
- id: login-aaa
  name: Login and AAA authentication
  description: >
    Management-plane authentication. NX-OS runs a Linux userspace, so unlike
    IOS the bulk of this dataset is PAM output re-emitted through the syslog
    facilities AUTHPRIV, DAEMON and USER under the single catch-all mnemonic
    SYSTEM_MSG: `%AUTHPRIV-3-SYSTEM_MSG: pam_aaa:Authentication failed for
    user admin from 10.1.1.1 - sshd[17590]`, the pam_unix key=value form
    `%AUTHPRIV-5-SYSTEM_MSG: pam_unix(aaa:auth): authentication failure;
    logname= uid=0 euid=0 tty= ruser= rhost= - aaad`, and
    `%DAEMON-3-SYSTEM_MSG: error: PAM: Authentication failure for illegal user
    USERID from 10.1.1.1 - dcos_sshd[12345]`. Alongside these sit the
    Cisco-native %SECURITYD-5-LOGIN_SUCCESS / LOGOUT records and the
    RADIUS/TACACS server-state messages. This is the dataset a SOC watches for
    credential attacks against the fabric.
  event_categories:
  - authentication
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same syslog listener as the ACL dataset; separated only by facility
        and message shape, not by transport. Administrator usernames and
        management-station source addresses in this dataset are the most
        likely candidates for guard-side redaction rules.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_nexus.log
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same syslog listener as the ACL dataset; separated only by facility
        and message shape, not by transport.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_nexus.log
  formats:
  - format: syslog-raw
    parsing:
      mechanism: elastic-integration
      artifact: Cisco Nexus integration (cisco_nexus), data stream logs-cisco_nexus.log
      notes: >
        This is the family the cisco_nexus integration covers best, but its
        coverage is shallow and in one place actively wrong. The SYSTEM_MSG
        branch groks four failure templates and a `authentication failure; <kv
        tail>` pattern feeding a key=value split into
        cisco_nexus.log.{logname,uid,euid,tty,ruser,rhost,pwd,command,terminal},
        and the LOGIN_SUCCESS/LOGOUT branch extracts user.name, source.ip and
        a port. Two problems: the failure groks write the daemon name (sshd,
        dcos_sshd) into ECS network.protocol, which is not a network protocol
        and will collide with real values on other datasets; and the
        LOGIN_SUCCESS grok writes the device-side `localport` into source.port
        rather than destination.port. Both need correcting in a custom
        pipeline before this dataset can back cross-source identity content.
    fields:
    - vendor: mnemonic
      type: string
      description: Message code identifying which authentication event occurred
      ecs: event.code
      status: partial
      notes: >
        The critical difference from IOS: most of this dataset carries the
        single mnemonic SYSTEM_MSG, shared by AUTHPRIV, DAEMON and USER and
        used for successes, failures and unrelated daemon chatter alike. Only
        the Cisco-native records (LOGIN_SUCCESS, LOGOUT, LOGOUT_C6K) have a
        meaningful code. Detections must key on facility plus a body pattern,
        not event.code alone — the inverse of the cisco-ios guidance.
    - vendor: facility
      type: string
      description: Subsystem that raised the message
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.facility
      notes: >
        AUTHPRIV for PAM/AAA output, DAEMON for sshd/dcos_sshd, USER for some
        shell paths, SECURITYD for the Cisco-native login records, AAA /
        RADIUS / TACACS for server-state messages. Because SYSTEM_MSG is
        shared, this field is the primary discriminator for the whole dataset.
    - vendor: severity
      type: integer
      description: Single digit 0-7 in the message header indicating message importance
      ecs: event.severity
      status: partial
      notes: >
        Same inverted 0-7 scale as the other datasets. Authentication failures
        are 3 on AUTHPRIV/DAEMON but the pam_unix key=value variant is 5, and
        on some releases the whole family moves when `logging level auth` is
        set instead of `logging level authpriv` — so severity is a filter that
        silently drops records when the device configuration changes.
    - vendor: for user <name> / user=
      type: string
      description: Account name presented on the login attempt
      ecs: user.name
      status: partial
      notes: >
        The integration writes user.name from three different grok variants
        plus the key=value tail, and the templates disagree: `for user admin`,
        `for illegal user USERID`, `Login failed for user admin`. The literal
        token "illegal" is part of the template, not the name, but a loose
        pattern will capture it. related.user is not populated by the stock
        pipeline and needs a copy step.
    - vendor: from <ip>
      type: ip
      description: Address the management session originated from
      ecs: source.ip
      status: partial
      notes: >
        Present on the sshd-sourced failures and on LOGIN_SUCCESS. Absent
        entirely on the pam_unix key=value variant, where the equivalent
        rhost= is usually empty because the switch's own aaad daemon is the
        caller — so a meaningful fraction of authentication failures have no
        source address at all and a "failed login from unexpected address"
        detection must handle null explicitly.
    - vendor: rhost=
      type: string
      description: Remote host recorded by pam_unix on the failing authentication
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.rhost
      notes: >
        The integration keeps this as a keyword rather than converting it to
        source.ip, which is defensible because pam can put a hostname, an IP
        or an empty string here. Promote it to source.ip only after a
        successful IP conversion, and leave the keyword copy in place.
    - vendor: ruser=
      type: string
      description: Requesting (calling) user recorded by pam_unix
      ecs: source.user.name
      status: partial
      notes: >
        The account that invoked the authentication, distinct from the target
        account in user=. Meaningful on su/sudo-style escalations inside the
        NX-OS shell; empty on ordinary SSH logins.
    - vendor: uid= / euid=
      type: string
      description: Linux real and effective user ids of the process that called PAM
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.euid
      notes: >
        Almost always 0 because aaad and dcos_sshd run as root — these are the
        ids of the PAM CALLER, not of the account being authenticated, so
        mapping either to user.id would be actively misleading. Kept custom
        and typed keyword by the integration.
    - vendor: logname=
      type: string
      description: Login name recorded by pam_unix
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.logname
      notes: >-
        routinely empty on NX-OS; retained because on the sudo/su paths it is
        the only record of the original authenticated identity behind an
        escalation
    - vendor: tty=
      type: string
      description: Terminal the authentication was attempted on
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.tty
      notes: >
        /dev/pts/N for network sessions, empty for daemon-initiated
        authentication. ECS has no terminal fieldset (there is no
        user.terminal), so this and cisco_nexus.log.terminal both stay custom;
        decide which of the two the content uses, because the pipeline
        populates them from different templates.
    - vendor: sshd[<pid>] / dcos_sshd[<pid>]
      type: string
      description: Daemon name and process id trailing the PAM failure message
      ecs: process.pid
      status: partial
      notes: >
        The integration extracts the pid to process.pid correctly, but writes
        the daemon NAME into ECS network.protocol — a genuine mapping error
        that puts "sshd" and "dcos_sshd" into a field otherwise holding http,
        dns and the like. Move it to process.name in a custom pipeline before
        any content queries network.protocol across data sources. dcos_sshd is
        the NX-OS-native sshd; plain sshd appears on the management VRF path.
    - vendor: 'Login Success [user: ...]'
      type: enum
      description: Result phrase opening the Cisco-native SECURITYD login record
      ecs: event.outcome
      status: partial
      notes: >
        Only the LOGIN_SUCCESS template carries an explicit result phrase; the
        PAM-sourced majority of the dataset carries none, and no stock
        processor sets event.outcome at all. Derive outcome from the facility
        plus template shape rather than from any single token.
    - vendor: '[localport: <n>]'
      type: port
      description: Device-side TCP port the management session arrived on
      ecs: destination.port
      status: partial
      notes: >
        22 for SSH, 23 for telnet — the cleanest available signal that telnet
        is still enabled somewhere in the fabric. The stock pipeline writes it
        to source.port, which is wrong (it is the port on the switch, not on
        the client) and will corrupt any source-port analytics that spans
        datasets; correct it to destination.port in a custom pipeline.
    - vendor: AAA server address
      type: ip
      description: Address of the RADIUS or TACACS+ server named in an AAA state-change message
      ecs: server.address
      status: partial
      notes: >
        From the %RADIUS-3-RADIUS_ERROR_MESSAGE / %TACACS-3-
        TACACS_ERROR_MESSAGE family. Nothing in the stock pipeline extracts
        it. server.address is the truest ECS fit — the AAA back end is not the
        thing the administrator connected to, so host.target.* and
        destination.* are both wrong — but it is a keyword field and needs a
        server.ip copy for range queries. These messages matter because AAA
        going dead silently fails logins over to the local admin account.
    - vendor: sequence_number
      type: long
      description: >-
        Per-device monotonic message counter emitted when `logging message
        sequence-number` is configured
      ecs: event.sequence
      status: mapped
      notes: >-
        a gap spanning a burst of authentication failures is the difference
        between "the spray stopped" and "we stopped seeing it"
    - vendor: switch_name
      type: string
      description: Device name carried in the syslog header
      ecs: observer.name
      status: mapped
      notes: >-
        populated by the stock pipeline together with host.hostname and
        related.hosts, so unlike cisco_ios this dataset can be joined to a
        CMDB without extra enrichment — provided the device sends a name
        rather than an IP in the header
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the listener a pass-through and keep _raw — credential-attack
          evidence is forensically load-bearing and the volume is modest —
          while limiting low-side work to device-to-owner enrichment and
          Persistent Queue backpressure on the Elastic destination. Do add one
          low-side drop rule: the pam_unix key=value tail routinely arrives
          with every value empty (`logname= uid=0 euid=0 tty= ruser= rhost=`),
          and forwarding those as parsed fields creates empty-string keyword
          cardinality for no analytic gain, so strip empty keys before they
          reach the pipeline.
        elastic: >
          Add a logs-cisco_nexus.log@custom pipeline that first repairs the
          stock mappings — move the daemon name out of network.protocol into
          process.name, and move the LOGIN_SUCCESS localport from source.port
          to destination.port — then derives event.outcome and event.action
          from the message shape by lookup rather than by parsing result
          phrases, since AUTHPRIV, DAEMON and USER all share the mnemonic
          SYSTEM_MSG and event.code alone cannot separate a success from a
          failure. Populate user.name and related.user for cross-source
          identity pivots, copy the AAA server address into server.ip
          alongside the keyword server.address so range queries work, and add
          custom-namespace mappings for the pam_unix tail (logname, uid, euid,
          tty, ruser, rhost) as keywords plus the reused severity lookup from
          the ACL dataset.
        relay: >
          On the low-side crossing this is the dataset that flips to full
          ECS-shaped JSON built low-side (parse_location: low) rather than the
          thin envelope, because administrator usernames and
          management-station addresses are the flagged redaction targets and
          the guard cannot make field-aware decisions against an opaque _raw.
          Build that JSON shallow (nesting no deeper than two), ASCII-keyed
          and length-bounded, validate it with C.Schema(...).validate
          immediately before the guard destination with a dead-letter route
          for failures, and reconcile counts per hour across the boundary — a
          silent drop here reads as a quiet period in a brute-force timeline.
      direct:
        parse_location: high
        cribl: >
          Keep the listener a pass-through and keep _raw — credential-attack
          evidence is forensically load-bearing and the volume is modest —
          while limiting worker-group work to device-to-owner enrichment and
          Persistent Queue backpressure on the Elastic destination. Do add one
          drop rule: the pam_unix key=value tail routinely arrives with every
          value empty (`logname= uid=0 euid=0 tty= ruser= rhost=`), and
          forwarding those as parsed fields creates empty-string keyword
          cardinality for no analytic gain, so strip empty keys before they
          reach the pipeline.
        elastic: >
          Add a logs-cisco_nexus.log@custom pipeline that first repairs the
          stock mappings — move the daemon name out of network.protocol into
          process.name, and move the LOGIN_SUCCESS localport from source.port
          to destination.port — then derives event.outcome and event.action
          from the message shape by lookup rather than by parsing result
          phrases, since AUTHPRIV, DAEMON and USER all share the mnemonic
          SYSTEM_MSG and event.code alone cannot separate a success from a
          failure. Populate user.name and related.user for cross-source
          identity pivots, copy the AAA server address into server.ip
          alongside the keyword server.address so range queries work, and add
          custom-namespace mappings for the pam_unix tail (logname, uid, euid,
          tty, ruser, rhost) as keywords plus the reused severity lookup from
          the ACL dataset.
  - format: snmp-trap
    enable: >
      Enable the syslog notification with `snmp-server enable traps syslog`
      (`message-generated` selects clogMessageGenerated), supported on NX-OS
      7.1 and later, and add the receiver with `snmp-server host <manager-ip>
      traps version 3 priv <user> udp-port <port>`. Set the clogMaxSeverity
      floor to include the failure severities (3 and 5), and keep the device's
      `logging level authpriv/auth` configuration high enough that the records
      are generated - the trap can only carry what the logging subsystem
      produces. Strongly prefer SNMPv3 auth+priv because the trapped records
      carry administrator usernames, management-station source addresses and
      rejection reasons in clear text inside clogHistMsgText.
    references:
    - >-
      https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/102x/configuration/system-management/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-102x/m-configuring-snmp-10x.html
    - https://web.mit.edu/outland/share/snmp/mibs/CISCO-SYSLOG-MIB.my
    - https://github.com/cisco/cisco-mibs/blob/main/schema/CISCO-SYSLOG-MIB.schema
    parsing:
      mechanism: cribl-pipeline
      artifact: custom NX-OS SNMP-trap (CISCO-SYSLOG-MIB) reparse pipeline
      notes: >
        A trap receiver terminates the PDU; the pipeline copies
        clogHistMsgText to event.original and must run the same body parsing
        the syslog path needs, including the corrections the stock integration
        lacks - move the daemon name (sshd/dcos_sshd) out of network.protocol
        into process.name, and move the LOGIN_SUCCESS localport from
        source.port to destination.port. The trap breaks out clogHistFacility,
        which is the one genuine advantage on this dataset because SYSTEM_MSG
        is shared across AUTHPRIV/DAEMON/USER; the body tokens (user.name,
        source.ip, the pam_unix key=value tail, the AAA server address) still
        sit unstructured inside clogHistMsgText.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          This dataset flips to full ECS-shaped JSON built low-side rather
          than a thin envelope, because the trap PDU is opaque to the guard
          and the flagged redaction targets - administrator usernames and
          management-station source addresses - are field-aware decisions the
          guard cannot make against binary varbinds. Terminate the trap on a
          low-side receiver, decode the varbinds, reparse clogHistMsgText into
          the account, source address, local port and rejection reason, strip
          the routinely-empty pam_unix key=value tail, mask or tag usernames
          per policy, and set observer.name from the receiver metadata. Keep
          event.original - credential-attack evidence is forensically
          load-bearing and the volume is modest.
        elastic: >
          A logs-cisco_nexus.log@custom pipeline that repairs the
          network.protocol and source.port mis-mappings, derives event.outcome
          and event.action from clogHistFacility plus message shape rather
          than from the shared SYSTEM_MSG code, populates user.name and
          related.user for cross-source identity pivots, and copies the AAA
          server address into server.ip alongside server.address. Apply the
          clogHistSeverity minus-one conversion and reuse the
          inverted-severity lookup; add custom mappings for the pam_unix tail
          (logname, uid, euid, tty, ruser, rhost) as keywords.
        relay: >
          Build the low-side JSON shallow (nesting no deeper than two),
          ASCII-keyed and length-bounded, validate it with
          C.Schema(...).validate immediately before the guard destination with
          a dead-letter route for failures, and reconcile counts per hour
          across the boundary. Length-cap the AAA reason phrase specifically -
          it is the record most likely to hit the 255-byte clogHistMsgText cap
          - and alert on clipped records so a truncated credential record is
          visible as a collection gap rather than read as the spray having
          stopped.
      direct:
        parse_location: high
        cribl: >
          For a high-side switch, terminate the trap on an SNMP receiver and
          forward the decoded varbinds; keep the whole message grammar in one
          reparse pipeline high-side and add no field extraction beyond the
          varbind decode. Do not run the syslog trap and the `logging server`
          feed as dual authoritative sources for one switch, or every login
          event double-counts.
        elastic: >
          A logs-cisco_nexus.log@custom pipeline that repairs the
          network.protocol and source.port mis-mappings, derives event.outcome
          and event.action from clogHistFacility plus message shape rather
          than from the shared SYSTEM_MSG code, populates user.name and
          related.user, copies the AAA server address into server.ip alongside
          server.address, and applies the clogHistSeverity minus-one
          conversion through the shared inverted-severity lookup. Retain full
          usernames; accept that the 255-byte truncation is unavoidable in
          this transport and alert on clipped records so an analyst knows a
          long AAA reason was cut.
    fields:
    - vendor: clogHistMsgText
      type: string
      description: >-
        CISCO-SYSLOG-MIB - full text of the authentication message;
        SnmpAdminString capped at 255 bytes.
      ecs: event.original
      status: partial
      notes: >
        carries the whole SYSTEM_MSG / LOGIN_SUCCESS / RADIUS-TACACS sentence
        - the `for user`, `from <ip>`, `[localport:]` and pam_unix key=value
        tokens - all still to be parsed out of it. Populated on failure too
        (NX-OS does not mask the username), which keeps password-spraying
        detectable through the trap once the SYSTEM_MSG reparse branches
        exist.
    - vendor: clogHistMsgName
      type: string
      description: CISCO-SYSLOG-MIB - message name (the bare mnemonic), SIZE 1..30.
      ecs: event.code
      status: partial
      transform: >
        mostly SYSTEM_MSG (shared by AUTHPRIV/DAEMON/USER for successes,
        failures and daemon chatter alike); only the Cisco-native
        LOGIN_SUCCESS / LOGOUT records carry a meaningful code, so detections
        must key on clogHistFacility plus a body pattern, not this field
        alone.
    - vendor: clogHistFacility
      type: string
      description: >-
        CISCO-SYSLOG-MIB - facility name (AUTHPRIV, DAEMON, USER, SECURITYD,
        AAA, RADIUS, TACACS), SIZE 1..20.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.facility
      notes: >
        the primary discriminator for the whole dataset because SYSTEM_MSG is
        shared - the trap breaking it out as its own varbind is the one real
        structural win here. Not mapped to log.syslog.facility.name for the
        same reason as the other datasets.
    - vendor: clogHistSeverity
      type: integer
      description: CISCO-SYSLOG-MIB - SyslogSeverity enum emergency(1)..debug(8).
      ecs: event.severity
      status: partial
      transform: >
        subtract one to recover the Cisco 0-7 digit (failures 3 on
        AUTHPRIV/DAEMON, 5 for the pam_unix variant); the digit is inverted
        versus ECS, so drive log.level and thresholds from the shared lookup.
    - vendor: clogHistTimestamp
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - value of sysUpTime (device-uptime ticks) when the
        message was generated.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.snmp.sysuptime
      notes: >
        uptime ticks, not wall-clock; @timestamp must come from the
        trap-receiver arrival time, distinct from any device-local timestamp
        the SEC/LOGIN body itself may carry inside clogHistMsgText.
    - vendor: clogHistIndex
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - monotonically increasing index of the message in
        the syslog history table, carried in the varbind OID instance.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.snmp.history_index
      notes: >-
        gap/duplicate detection only, the trap analogue of the syslog sequence
        number; a gap spanning a burst of failures is the difference between
        "the spray stopped" and "we stopped seeing it"
  - format: api-pull
    enable: >
      Enable `feature nxapi` on HTTPS with a real certificate and a
      least-privilege poller account, then POST `show logging logfile` or
      `show logging last <n>` to `/ins` (JSON-RPC 2.0 body, Content-Type
      application/json-rpc, or the ins_api envelope with output_format json).
      Persist the on-box file with `logging logfile <name> <level> size
      <bytes>` sized for the poll interval, and keep `login on-failure log` /
      `login on-success log` equivalents and the `logging level authpriv/auth`
      settings the syslog path relies on, since the pull collects whatever the
      buffer holds and cannot recover a record the device never wrote. Because
      the pulled lines carry administrator usernames and management-station
      addresses verbatim, terminate the pull on an account and transport as
      tightly controlled as the syslog feed.
    references:
    - >-
      https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/programmability/guide/b_Cisco_Nexus_9000_Series_NX-OS_Programmability_Guide_7x/NX_API.html
    - >-
      https://developer.cisco.com/docs/cisco-nexus-9000-series-nx-api-cli-reference/latest/logging-commands/
    - >-
      https://developer.cisco.com/docs/cisco-nexus-3000-and-9000-series-nx-api-rest-sdk-user-guide-and-api-reference-release-9-3x/logging-system-messages-to-a-file/
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Cribl REST Collector + logs-cisco_nexus.log reparse pipeline
      notes: >
        A Cribl REST Collector fetches `/ins`, walks the TABLE_/ROW_ array and
        lifts each `log` line to event.original; the stock cisco_nexus
        integration's SYSTEM_MSG and LOGIN_SUCCESS/LOGOUT groks then apply
        unchanged, along with the same corrections the syslog path needs (move
        the daemon name out of network.protocol into process.name, move the
        LOGIN_SUCCESS localport from source.port to destination.port). NX-API
        adds no structure to the PAM key=value tail or the result phrase, so
        the pull neither closes nor widens the parsing gap - it only changes
        how the record arrives.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          This dataset flips to full ECS-shaped JSON built low-side rather
          than a thin envelope, because administrator usernames and
          management-station addresses are the flagged redaction targets and
          the guard cannot make field-aware decisions against an opaque line.
          Run the REST Collector low-side, unwrap ROW_.log to event.original,
          reparse into user.name, source.ip, destination.port and the outcome,
          dedup on the embedded sequence number, strip the routinely-empty
          pam_unix key=value tail, and set observer.name from the poll target.
          Keep event.original - credential-attack evidence is forensically
          load-bearing and the volume is modest.
        elastic: >
          Reuse the logs-cisco_nexus.log@custom pipeline the syslog path
          needs: repair the network.protocol and source.port mis-mappings,
          derive event.outcome and event.action from facility plus message
          shape rather than event.code (AUTHPRIV/DAEMON/USER all share
          SYSTEM_MSG), populate related.user, and copy the AAA server address
          into server.ip alongside server.address. Add only a tag marking the
          record as pulled so a poll-gap is distinguishable from a genuine
          quiet period in a brute-force timeline.
        relay: >
          Build the low-side JSON shallow (nesting no deeper than two),
          ASCII-keyed and length-bounded, validate it with
          C.Schema(...).validate immediately before the guard destination with
          a dead-letter route for failures, and reconcile counts per hour
          across the boundary. Because the pull is itself lossy at buffer
          turnover, fold the poll cadence and buffer size into the
          reconciliation so a silent drop is not read as the spray having
          stopped when it was merely not collected.
      direct:
        parse_location: high
        cribl: >
          For a high-side switch, a REST Collector against `/ins` forwards
          decoded ROW_.log lines to the core worker group; keep the whole
          message grammar in one reparse pipeline and add no field extraction
          beyond the JSON unwrap and sequence-number dedup. Do not run the
          pull and the `logging server` feed as dual authoritative sources for
          one switch or every login event double-counts.
        elastic: >
          A logs-cisco_nexus.log@custom pipeline that repairs the
          network.protocol and source.port mis-mappings, derives event.outcome
          and event.action from facility plus message shape rather than
          event.code (AUTHPRIV/DAEMON/USER all share SYSTEM_MSG), populates
          related.user, and copies the AAA server address into server.ip
          alongside server.address. Retain full usernames, and alert on
          embedded-sequence gaps so a clipped or rotated buffer that dropped a
          burst of failures is visible as a collection gap rather than a lull.
    fields:
    - vendor: ROW_logfile.log / ROW_nvram.log
      type: string
      description: >-
        NX-API - one buffered authentication record returned as a whole raw
        ASCII line inside the TABLE_/ROW_ array of a `show logging` response.
      ecs: event.original
      status: partial
      notes: >
        carries the whole SYSTEM_MSG / LOGIN_SUCCESS / RADIUS-TACACS sentence
        - the `for user`, `from <ip>`, `[localport:]` and pam_unix key=value
        tokens - as undecomposed text. Every field the syslog dataset writes
        (user.name, source.ip, destination.port, the AAA server address) must
        be parsed out of this line; NX-API structures none of it.
    - vendor: for user <name> (embedded)
      type: string
      description: Account presented on the login attempt, inside the raw ROW_.log line
      ecs: user.name
      status: partial
      notes: >
        recovered by the same three grok variants the syslog feed uses (`for
        user admin`, `for illegal user USERID`, `Login failed for user
        admin`); the literal token "illegal" is template, not name. Not an
        NX-API field - it survives only inside event.original.
    - vendor: from <ip> (embedded)
      type: ip
      description: Address the management session originated from, inside the raw line
      ecs: source.ip
      status: partial
      notes: >
        present on the sshd-sourced failures and on LOGIN_SUCCESS, absent on
        the pam_unix key=value variant just as on the wire feed, so a
        meaningful fraction of pulled failures still carry no source address
        and a detection must handle null explicitly.
    - vendor: sequence_number (embedded)
      type: long
      description: >-
        Per-device monotonic counter inside the raw line when `logging message
        sequence-number` is set
      ecs: event.sequence
      status: partial
      notes: >-
        dedup key for overlapping polls and the only detector for a buffer
        rotation that dropped authentication records between fetches; require
        the emitting command on any pull deployment
    - vendor: switch_name (embedded)
      type: string
      description: Device name at the head of the raw syslog line
      ecs: observer.name
      status: partial
      notes: >-
        the NX-API envelope carries no device identity, so set observer.name
        from the poll target or the embedded token rather than trusting the
        pulled text alone
- id: config-accounting
  name: Configuration change and command accounting
  description: >
    NX-OS change tracking, which splits across two very different records.
    %VSHD-5-VSHD_SYSLOG_CONFIG_I is the session-level notice — `Configured
    from vty by admin on 10.1.1.1@pts/0`, or `on console0` / `on vsh.bin` for
    local and script-driven changes — and it says only THAT a change happened.
    %AAA-6-AAA_ACCOUNTING_MESSAGE is the per-command record and carries the
    command text itself: `update:10.1.1.1@pts/0:admin:configure terminal ;
    interface Ethernet1/1 (SUCCESS)`, with start/stop variants bracketing the
    shell session. Alongside these sit %VSHD-5-CFGWRITE_STARTED for
    copy-running-config and the %PLATFORM / %SYSMGR reload records. Low
    volume, high value — the change-control and anti-tamper dataset.
  event_categories:
  - configuration
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same syslog listener as the other datasets. The command strings inside
        AAA_ACCOUNTING_MESSAGE are unbounded operator free text and will need
        length capping and secret masking before crossing, in the same way
        linux-auditd EXECVE arguments do.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_nexus.log
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same syslog listener as the other datasets.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_nexus.log
  formats:
  - format: syslog-raw
    parsing:
      mechanism: elastic-integration
      artifact: Cisco Nexus integration (cisco_nexus), data stream logs-cisco_nexus.log
      notes: >
        Half covered. The stock pipeline has a VSHD_SYSLOG_CONFIG_I grok —
        `Configured from vty by %{USERNAME:user.name} on
        %{IP:source.ip}@%{DATA:cisco_nexus.log.terminal}` — and a
        CFGWRITE_STARTED branch that pulls out a PID, but nothing at all for
        AAA_ACCOUNTING_MESSAGE, which is where the actual command text lives.
        Note also that the VSHD grok requires an IP before the `@`: the
        console and vsh.bin variants (`Configured from vty by admin on
        console0`) do not match it and land wholly in message, so the records
        representing local, non-attributable changes are exactly the ones that
        fail to parse. Extracting AAA_ACCOUNTING_MESSAGE is the highest
        value-per-effort parsing work in this file.
    fields:
    - vendor: mnemonic
      type: string
      description: Message code identifying which change event occurred
      ecs: event.code
      status: mapped
      transform: >
        VSHD_SYSLOG_CONFIG_I / AAA_ACCOUNTING_MESSAGE / CFGWRITE_STARTED /
        PFM_SYSTEM_RESET. Unlike the authentication dataset these mnemonics
        are genuinely distinct, so event.code is a usable primary filter here;
        it drives event.action by lookup since VSHD carries no action token.
    - vendor: facility
      type: string
      description: Subsystem that raised the message
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.facility
      notes: >-
        VSHD for the virtual-shell config notice, AAA for command accounting,
        SYSMGR and PLATFORM for restarts; note VSHD is NX-OS-specific and has
        no IOS counterpart
    - vendor: severity
      type: integer
      description: Single digit 0-7 in the message header indicating message importance
      ecs: event.severity
      status: partial
      notes: >-
        the whole family sits at 5 or 6, so severity carries no triage signal
        here — the same inverted-scale caveat applies but is moot for this
        dataset
    - vendor: Configured from vty by <user>
      type: string
      description: Account credited with the configuration-mode session
      ecs: user.name
      status: mapped
      notes: >
        Extracted by the stock VSHD grok. A real improvement over IOS, which
        prints a line name here when AAA accounting is off — NX-OS names the
        authenticated account. Note the message fires per configuration
        session, not per command, and NX-OS 8.2.2 has a known cosmetic defect
        (CSCvk00945) that emits it repeatedly for non-changes, so a naive
        "config changed" alert on this mnemonic alone will be noisy.
    - vendor: on <ip>@<tty>
      type: ip
      description: Address of the management station that made the change
      ecs: source.ip
      status: partial
      notes: >
        The IP half of the `@`-joined token. Absent for console and
        script-driven changes, which print `on console0` or `on vsh.bin`
        instead and do not match the stock grok at all — so the local,
        least-attributable changes are precisely the ones with no source.ip. A
        "config change from unexpected address" detection must treat null as
        suspicious rather than excluding it.
    - vendor: terminal
      type: string
      description: Pseudo-terminal or console the configuration session used
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.terminal
      notes: >
        pts/0, console0, vsh.bin. ECS has no terminal fieldset, and this is
        the only join key between a VSHD config notice and the matching
        AAA_ACCOUNTING_MESSAGE commands; NX-OS reuses pts numbers quickly, so
        the join is only safe within a short window on one device.
    - vendor: accounting record type
      type: enum
      description: Whether the accounting record opens, updates or closes a shell session
      ecs: event.action
      status: partial
      transform: >
        the leading token of AAA_ACCOUNTING_MESSAGE — `start:` on shell login,
        `update:` for each executed command, `stop:` on logout. Normalize to
        session-started / command-executed / session-ended. No stock processor
        reads it, so it exists only inside message today.
    - vendor: accounting command string
      type: string
      description: The configuration or exec command as entered, from the accounting record
      ecs: process.command_line
      status: partial
      notes: >
        The payload of AAA_ACCOUNTING_MESSAGE, e.g. `configure terminal ;
        interface Ethernet1/1 ; shutdown` — NX-OS joins a whole config-mode
        burst into ONE record with ` ; ` separators, which is why splitting it
        matters more here than on IOS where each command is its own message.
        Mapping to process.command_line is a convenience so existing
        command-line detection content is reusable; no OS process exists, so
        event.category stays configuration. Carries plaintext credentials
        where the device is not configured to hide them, making this a
        guard-policy concern as much as a mapping one.
    - vendor: (SUCCESS) / (FAILURE)
      type: enum
      description: Whether the accounted command was accepted or rejected
      ecs: event.outcome
      status: partial
      transform: >
        the parenthesised trailer on AAA_ACCOUNTING_MESSAGE. This is the only
        place in the whole file where NX-OS states an outcome explicitly, and
        it is unparsed today — a FAILURE trailer on an authorization-denied
        command is one of the better privilege-probing signals available from
        a switch.
    - vendor: accounting user
      type: string
      description: Account credited with the accounted command
      ecs: user.name
      status: partial
      notes: >
        the third colon-delimited field of AAA_ACCOUNTING_MESSAGE. Duplicated
        conceptually with the VSHD `by <user>` above but sourced from a
        different record, so both write user.name and one of them will be
        absent on any given event; content must not assume which.
    - vendor: CFGWRITE_STARTED PID
      type: integer
      description: Process id of the configuration-write operation
      ecs: process.pid
      status: mapped
      notes: >
        extracted by the stock `(PID %{NUMBER:process.pid:long})` grok. Fires
        on copy-running-config; a write nobody scheduled, especially one not
        preceded by a VSHD config notice, is worth a low-noise alert because
        it is how an unauthorized change is made persistent.
    - vendor: reload reason
      type: string
      description: Documented reason the switch or a module reset
      ecs: event.reason
      status: partial
      notes: >
        from the %PLATFORM-2-PFM_SYSTEM_RESET / %SYSMGR family. Unparsed by
        the stock pipeline. An unexpected reason such as a watchdog or
        power-on reset on a switch nobody touched is the alertable case; a
        reload immediately following an accounted `reload` command is not.
    - vendor: sequence_number
      type: long
      description: >-
        Per-device monotonic message counter emitted when `logging message
        sequence-number` is configured
      ecs: event.sequence
      status: mapped
      notes: >-
        for this dataset specifically, a gap spanning a VSHD config notice is
        the difference between "we saw the change" and "we saw a change"
    - vendor: switch_name
      type: string
      description: Device name carried in the syslog header
      ecs: observer.name
      status: mapped
      notes: >-
        populated by the stock pipeline; combined with the terminal join key
        above it is what lets a change be attributed to a device and a session
        rather than just a timestamp
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Mask key material low-side before anything leaves the fabric —
          command accounting captures `username ... password ...` and SNMP
          community strings verbatim unless the device is configured to hide
          them — and cap the command field's length so a pasted banner or
          certificate cannot produce a kilobyte-wide value. Keep _raw (this is
          the anti-tamper record and the volume is trivial) and route the
          `stop:` accounting records and any logging-destination change onto a
          priority stream, since those are the switch announcing that a
          session ended or that it is about to go dark.
        elastic: >
          Extend the logs-cisco_nexus.log@custom pipeline with an
          AAA_ACCOUNTING_MESSAGE branch that dissects the colon-delimited
          `<type>:<ip>@<tty>:<user>:<command> (RESULT)` shape into
          event.action, source.ip, user.name, process.command_line and
          event.outcome, and widen the stock VSHD grok so the console0 and
          vsh.bin variants parse instead of falling through. Split the
          semicolon-separated command list into individually queryable
          commands rather than indexing one long string, keep event.category
          as configuration even though the text lands in process.command_line,
          and add custom-namespace mappings for terminal, accounting record
          type and reload reason. Run a sequence-gap integrity check spanning
          VSHD_SYSLOG_CONFIG_I events — a missing change record is the one
          loss in this file that cannot be reconstructed later.
        relay: >
          The unbounded operator free text in the accounting command field is
          the hardest content-filter problem in this file, in the same way
          linux-auditd EXECVE arguments are: cap length, strip non-ASCII and
          mask secrets low-side before the crossing rather than relying on
          guard-side rejection, since a custom NDJSON filter on the guard is
          bespoke work and should be kept simple. Low-side instances cross
          with the thin envelope and hybrid parsing behind a Persistent Queue
          and a dead-letter route; make this the LAST dataset to lose _raw at
          the crossing — the volume is trivial and the record is the
          change-control evidence.
      direct:
        parse_location: high
        cribl: >
          Mask key material before anything leaves the fabric — command
          accounting captures `username ... password ...` and SNMP community
          strings verbatim unless the device is configured to hide them — and
          cap the command field's length so a pasted banner or certificate
          cannot produce a kilobyte-wide value. Keep _raw (this is the
          anti-tamper record and the volume is trivial) and route the `stop:`
          accounting records and any logging-destination change onto a
          priority stream, since those are the switch announcing that a
          session ended or that it is about to go dark.
        elastic: >
          Extend the logs-cisco_nexus.log@custom pipeline with an
          AAA_ACCOUNTING_MESSAGE branch that dissects the colon-delimited
          `<type>:<ip>@<tty>:<user>:<command> (RESULT)` shape into
          event.action, source.ip, user.name, process.command_line and
          event.outcome, and widen the stock VSHD grok so the console0 and
          vsh.bin variants parse instead of falling through. Split the
          semicolon-separated command list into individually queryable
          commands rather than indexing one long string, keep event.category
          as configuration even though the text lands in process.command_line,
          and add custom-namespace mappings for terminal, accounting record
          type and reload reason. Run a sequence-gap integrity check spanning
          VSHD_SYSLOG_CONFIG_I events — a missing change record is the one
          loss in this file that cannot be reconstructed later.
  - format: snmp-trap
    enable: >
      Enable the syslog notification with `snmp-server enable traps syslog`
      (`message-generated` selects clogMessageGenerated), supported on NX-OS
      7.1 and later, and add the receiver with `snmp-server host <manager-ip>
      traps version 3 priv <user> udp-port <port>`. Set the clogMaxSeverity
      floor to include the severity-5/6 VSHD, AAA and reload records, and keep
      the device's command-accounting configuration in place, since the trap
      carries only records the logging subsystem generates. Because
      AAA_ACCOUNTING_MESSAGE echoes `username ... password ...` and SNMP
      community strings verbatim on devices without key hiding, use SNMPv3
      auth+priv so the trap contents are encrypted in transit, and apply the
      same low-side command redaction the syslog path uses.
    references:
    - >-
      https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/102x/configuration/system-management/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-102x/m-configuring-snmp-10x.html
    - https://web.mit.edu/outland/share/snmp/mibs/CISCO-SYSLOG-MIB.my
    - https://github.com/cisco/cisco-mibs/blob/main/schema/CISCO-SYSLOG-MIB.schema
    parsing:
      mechanism: cribl-pipeline
      artifact: custom NX-OS SNMP-trap (CISCO-SYSLOG-MIB) reparse pipeline
      notes: >
        A trap receiver terminates the PDU; the pipeline copies
        clogHistMsgText to event.original and reparses the body, which is
        net-new work here - no stock cisco_nexus branch parses
        AAA_ACCOUNTING_MESSAGE, where the command text lives. Dissect the
        colon-delimited `<type>:<ip>@<tty>:<user>:<command> (RESULT)` shape
        into event.action, source.ip, user.name, process.command_line and
        event.outcome, split the ` ; `-joined command list, and widen the VSHD
        grok so the console0 and vsh.bin variants parse. The broken-out
        varbinds resolve the header, but the command payload stays raw inside
        clogHistMsgText and is the field most exposed to the 255-byte cap.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Terminate the trap low-side, decode the varbinds and reparse
          clogHistMsgText. Mask key material low-side before anything leaves
          the enclave - devices without key hiding emit plaintext secrets
          inside the command string - and cap that field's length so a pasted
          banner or certificate cannot produce a kilobyte-wide value (the
          trap's own 255-byte cap will already have clipped it, itself a
          fidelity loss to flag). Keep event.original (this is the anti-tamper
          record and the volume is trivial), set observer.name from the
          receiver metadata, and route the `stop:` accounting records and any
          logging-destination change onto a priority stream.
        elastic: >
          Extend the reparse with the AAA_ACCOUNTING_MESSAGE branch that
          dissects the colon-delimited shape into event.action, source.ip,
          user.name, process.command_line and event.outcome, widen the VSHD
          grok for the console0/vsh.bin variants, and split the
          semicolon-separated command list into individually queryable
          commands. Keep event.category as configuration even though the text
          lands in process.command_line, apply the clogHistSeverity minus-one
          conversion (the whole family sits at 5-6 so severity carries no
          triage signal), and run a history-index gap check spanning
          VSHD_SYSLOG_CONFIG_I events.
        relay: >
          The unbounded command free text is the hardest content-filter
          problem in this file, as with linux-auditd EXECVE arguments: cap
          length, strip non-ASCII and mask secrets low-side before the
          crossing rather than relying on guard-side rejection. Cross the
          decoded record behind a Persistent Queue and a dead-letter route;
          make this the last dataset to lose event.original at the crossing -
          the volume is trivial and the record is the change-control evidence
          - and alert on 255-byte-clipped command lines so a truncated command
          is visible as a gap.
      direct:
        parse_location: high
        cribl: >
          For a high-side switch, terminate the trap on an SNMP receiver and
          forward decoded varbinds. Given the truncation risk on command
          strings, adopt the trap for this dataset only where SNMP is the
          existing collection path; otherwise the syslog-raw feed is strictly
          better for the AAA_ACCOUNTING_MESSAGE records. Do not run trap and
          the `logging server` feed as dual authoritative sources for one
          switch.
        elastic: >
          A reparse pipeline with the AAA_ACCOUNTING_MESSAGE branch that
          dissects the colon-delimited shape into event.action, source.ip,
          user.name, process.command_line and event.outcome, widens the VSHD
          grok for the console0/vsh.bin variants, and splits the
          semicolon-separated command list into individually queryable
          commands, with event.action driven by the event.code lookup since
          VSHD carries no action token. Retain full command lines where they
          fit; alert on clipped records so an analyst knows a logged command
          was cut by the 255-byte cap - for this dataset that clip lands
          squarely on the forensic payload.
    fields:
    - vendor: clogHistMsgText
      type: string
      description: >-
        CISCO-SYSLOG-MIB - full text of the change/accounting record;
        SnmpAdminString capped at 255 bytes, frequently clipping the command
        strings.
      ecs: event.original
      status: partial
      notes: >
        contains the whole VSHD_SYSLOG_CONFIG_I or AAA_ACCOUNTING_MESSAGE
        sentence, including the ` ; `-joined command list and the `(SUCCESS)`
        / `(FAILURE)` trailer. The 255-byte cap frequently clips the unbounded
        command strings, the single biggest fidelity loss of this transport
        for this dataset.
    - vendor: clogHistMsgName
      type: string
      description: CISCO-SYSLOG-MIB - message name (the bare mnemonic), SIZE 1..30.
      ecs: event.code
      status: mapped
      transform: >
        VSHD_SYSLOG_CONFIG_I / AAA_ACCOUNTING_MESSAGE / CFGWRITE_STARTED /
        PFM_SYSTEM_RESET - genuinely distinct here, so event.code is a usable
        primary filter and drives event.action by lookup since VSHD carries no
        action token.
    - vendor: clogHistFacility
      type: string
      description: CISCO-SYSLOG-MIB - facility name (VSHD, AAA, SYSMGR, PLATFORM), SIZE 1..20.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.facility
      notes: >-
        VSHD for the config notice, AAA for command accounting,
        SYSMGR/PLATFORM for restarts; not mapped to log.syslog.facility.name
        for the same reason as the other datasets.
    - vendor: clogHistSeverity
      type: integer
      description: CISCO-SYSLOG-MIB - SyslogSeverity enum emergency(1)..debug(8).
      ecs: event.severity
      status: partial
      transform: >-
        subtract one to recover the Cisco 0-7 digit; the whole family sits at
        5 or 6 so severity carries no triage signal here, but the inverted
        scale still requires the shared lookup rather than a raw threshold.
    - vendor: clogHistTimestamp
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - value of sysUpTime (device-uptime ticks) when the
        message was generated.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.snmp.sysuptime
      notes: >-
        uptime ticks, not wall-clock; @timestamp must come from the
        trap-receiver arrival time.
    - vendor: clogHistIndex
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - monotonically increasing index of the message in
        the syslog history table, carried in the varbind OID instance.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.snmp.history_index
      notes: >
        for this dataset a gap spanning a VSHD_SYSLOG_CONFIG_I is the
        difference between "we saw the change" and "we saw a change" - worth a
        dedicated integrity check, the trap equivalent of the syslog
        sequence-gap check.
  - format: api-pull
    enable: >
      Enable `feature nxapi` on HTTPS with a real certificate and a
      least-privilege poller account, then POST `show logging logfile` or
      `show logging last <n>` to `/ins` (JSON-RPC 2.0 body, Content-Type
      application/json-rpc, or the ins_api envelope with output_format json).
      Persist the on-box file with `logging logfile <name> <level> size
      <bytes>` sized generously for the poll interval, and keep the device's
      command-accounting and key-hiding configuration in place, since the pull
      collects only what the buffer already holds and cannot mask a secret the
      device wrote in clear. Because AAA_ACCOUNTING_MESSAGE captures operator
      command lines verbatim - including `username ... password ...` and SNMP
      community strings on devices without key hiding - the pull account and
      transport must be treated as carrying sensitive material.
    references:
    - >-
      https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/programmability/guide/b_Cisco_Nexus_9000_Series_NX-OS_Programmability_Guide_7x/NX_API.html
    - >-
      https://developer.cisco.com/docs/cisco-nexus-9000-series-nx-api-cli-reference/latest/logging-commands/
    - >-
      https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/102x/configuration/system-management/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-102x/m-configuring-system-message-logging-10x.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Cribl REST Collector + logs-cisco_nexus.log reparse pipeline
      notes: >
        A Cribl REST Collector fetches `/ins` and lifts each ROW_.log line to
        event.original; the stock cisco_nexus VSHD_SYSLOG_CONFIG_I grok
        applies, and the net-new AAA_ACCOUNTING_MESSAGE branch the syslog path
        needs - dissecting `<type>:<ip>@<tty>:<user>:<command> (RESULT)` into
        event.action, source.ip, user.name, process.command_line and
        event.outcome, and splitting the ` ; `-joined command list - runs
        unchanged on the pulled text. NX-API does not structure the command
        string, so the highest value-per-effort parsing work is identical to
        the syslog feed; the pull only changes the transport.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Run the REST Collector low-side, unwrap ROW_.log to event.original,
          and mask key material and cap the command field's length BEFORE
          anything leaves the enclave - command accounting captures plaintext
          secrets where the device does not hide them, and a pasted banner or
          certificate can produce a kilobyte-wide value. Dedup on the embedded
          sequence number, keep event.original (this is the anti-tamper record
          and the volume is trivial), set observer.name from the poll target,
          and route the `stop:` accounting records and any logging-destination
          change onto a priority stream.
        elastic: >
          Reuse the logs-cisco_nexus.log@custom AAA_ACCOUNTING_MESSAGE branch,
          the widened VSHD grok that also matches the console0 and vsh.bin
          variants, and the semicolon-split of the command list. Keep
          event.category as configuration even though the text lands in
          process.command_line, run a sequence-gap check spanning
          VSHD_SYSLOG_CONFIG_I events, and tag the record as pulled so a poll
          gap is not mistaken for an absence of change.
        relay: >
          The unbounded operator command free text is the hardest
          content-filter problem in this file, as with linux-auditd EXECVE
          arguments: cap length, strip non-ASCII and mask secrets low-side
          before the crossing rather than relying on guard-side rejection.
          Cross the decoded record behind a Persistent Queue and a dead-letter
          route; make this the last dataset to lose event.original at the
          crossing - the volume is trivial and the record is the
          change-control evidence - and fold the poll cadence into the hourly
          reconciliation because a missing change record cannot be
          reconstructed later.
      direct:
        parse_location: high
        cribl: >
          For a high-side switch, a REST Collector against `/ins` forwards
          decoded ROW_.log lines to the core worker group; given that the
          command strings are the forensic payload, adopt the pull only where
          syslog cannot reach the collector, and never run the pull and the
          `logging server` feed as dual authoritative sources for one switch.
        elastic: >
          A logs-cisco_nexus.log@custom AAA_ACCOUNTING_MESSAGE branch that
          dissects the colon-delimited shape into event.action, source.ip,
          user.name, process.command_line and event.outcome, the widened VSHD
          grok that also matches the console0 and vsh.bin variants, and the
          semicolon-split of the command list, keeping event.category as
          configuration even though the text lands in process.command_line.
          Alert on embedded-sequence gaps spanning a VSHD config notice - on
          the pull transport that gap is the difference between "we collected
          the change" and "the buffer rotated before we polled it."
    fields:
    - vendor: ROW_logfile.log / ROW_nvram.log
      type: string
      description: >-
        NX-API - one buffered change/accounting record returned as a whole raw
        ASCII line inside the TABLE_/ROW_ array of a `show logging` response.
      ecs: event.original
      status: partial
      notes: >
        carries the whole VSHD_SYSLOG_CONFIG_I or AAA_ACCOUNTING_MESSAGE
        sentence, including the ` ; `-joined command list and the `(SUCCESS)`
        / `(FAILURE)` trailer, as undecomposed text. Every field the syslog
        dataset writes must be parsed out of this line; NX-API structures none
        of the command payload.
    - vendor: accounting command string (embedded)
      type: string
      description: The configuration or exec command as entered, inside the raw ROW_.log line
      ecs: process.command_line
      status: partial
      notes: >
        the payload of AAA_ACCOUNTING_MESSAGE, e.g. `configure terminal ;
        interface Ethernet1/1 ; shutdown`; split on ` ; ` after recovery from
        event.original. Carries plaintext credentials where the device is not
        configured to hide them, making it a guard-policy and pull-account
        concern as much as a mapping one.
    - vendor: (SUCCESS) / (FAILURE) (embedded)
      type: enum
      description: Whether the accounted command was accepted or rejected, inside the raw line
      ecs: event.outcome
      status: partial
      transform: >
        the parenthesised trailer on AAA_ACCOUNTING_MESSAGE - the only place
        in the whole file where NX-OS states an outcome explicitly, and
        unparsed by any stock processor whether the record is pulled or
        received.
    - vendor: sequence_number (embedded)
      type: long
      description: >-
        Per-device monotonic counter inside the raw line when `logging message
        sequence-number` is set
      ecs: event.sequence
      status: partial
      notes: >-
        dedup key for overlapping polls and, for this dataset specifically,
        the detector for a buffer rotation that dropped a change record before
        it could be pulled - the one loss in this file that cannot be
        reconstructed
    - vendor: switch_name (embedded)
      type: string
      description: Device name at the head of the raw syslog line
      ecs: observer.name
      status: partial
      notes: >-
        set observer.name from the poll target or the embedded token, since
        the NX-API envelope carries no device identity of its own
- id: interface-vpc-state
  name: Interface, vPC and fabric state
  description: >
    Control-plane and physical-layer state, which on a data-centre switch
    carries more weight than on an access router. The ETHPORT family reports
    interface transitions with the REASON encoded in the mnemonic rather than
    the body — %ETHPORT-5-IF_DOWN_LINK_FAILURE, IF_DOWN_ADMIN_DOWN,
    IF_DOWN_INITIALIZING, IF_UP, IF_ADMIN_UP — plus SPEED, IF_DUPLEX and the
    flow-control and transceiver-warning records. %LINK-3-UPDOWN and
    %LINEPROTO-5-UPDOWN appear as on IOS. The NX-OS-specific additions are the
    vPC family (%VPC-2-PEER_KEEP_ALIVE_RECV_FAIL, %VPC-2-PEER_LINK_DOWN,
    %VPC-5-PEER_KEEP_ALIVE_RECV_SUCCESS), which is what tells a SOC whether a
    whole fabric leg went away, and %L2FM-4-L2FM_MAC_MOVE2, which is the
    closest thing NX-OS has to an ARP/MAC-spoofing indicator.
  event_categories:
  - network
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same syslog listener as the other datasets. Interface names, VLAN
        identifiers and vPC domain numbers in this family disclose fabric
        topology and tenancy directly and are a plausible target for guard
        filtering.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_nexus.log
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same syslog listener as the other datasets.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_nexus.log
  formats:
  - format: syslog-raw
    parsing:
      mechanism: elastic-integration
      artifact: Cisco Nexus integration (cisco_nexus), data stream logs-cisco_nexus.log
      notes: >
        Best stock coverage in the file — dedicated groks pull
        cisco_nexus.log.interface.name out of the IF_* family, the mode out of
        `is up in mode access`, the operational speed/duplex/flow-control
        values, the LINEPROTO and UPDOWN state, and the moved MAC out of
        L2FM_MAC_MOVE2. Two gaps remain. First, the generic `interface %{DATA}
        is %{GREEDYDATA}` pattern DISCARDS the down reason, so `(Link
        failure)` versus `(Administratively down)` survives only in
        event.code, not as a queryable reason. Second, there is no vPC branch
        at all — the domain number and the peer state stay in message. A
        flapping port emits LINK and LINEPROTO pairs at high rate, so cost a
        Cribl-side suppression step before enabling this estate-wide.
    fields:
    - vendor: mnemonic
      type: string
      description: Message code identifying the state-change type
      ecs: event.code
      status: mapped
      transform: >
        IF_UP / IF_ADMIN_UP / IF_DOWN_LINK_FAILURE / IF_DOWN_ADMIN_DOWN /
        IF_DOWN_INITIALIZING / SPEED / IF_DUPLEX / IF_XCVR_WARNING / UPDOWN /
        LINEPROTO / PEER_KEEP_ALIVE_RECV_FAIL / L2FM_MAC_MOVE2. Structurally
        different from IOS: NX-OS encodes the DOWN REASON in the mnemonic
        itself, so event.code carries information that on IOS lives in the
        message body — which is why the reason is recoverable here even though
        the body grok discards it.
    - vendor: facility
      type: string
      description: Subsystem that raised the message
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.facility
      notes: >
        ETHPORT, ETH_PORT_CHANNEL, LINK, LINEPROTO, VPC, L2FM, SPANNING_TREE.
        As on IOS, LINK-3-UPDOWN and LINEPROTO-5-UPDOWN share the mnemonic
        UPDOWN, so event.code alone cannot tell a physical-layer failure from
        a protocol-layer one and every query must filter on facility too.
    - vendor: severity
      type: integer
      description: Single digit 0-7 in the message header indicating message importance
      ecs: event.severity
      status: partial
      notes: >
        Inverted 0-7 scale. The vPC records are severity 2 while an ordinary
        port going down is 5, so on this dataset the Cisco digit does carry
        real triage signal once the lookup inverts it — which is the strongest
        argument in the file for building that lookup rather than thresholding
        event.severity directly.
    - vendor: interface name
      type: string
      description: Name of the interface whose state changed
      ecs: observer.ingress.interface.name
      status: partial
      notes: >
        e.g. Ethernet1/19, port-channel10. The integration defines and
        populates its own cisco_nexus.log.interface.name; ECS still has no
        plain interface.name fieldset, and observer.ingress.interface.name is
        the nearest ECS home but is semantically wrong for a state change
        (nothing ingressed). Pick one and populate only one — the same
        decision the cisco-ios map defers.
    - vendor: interface mode
      type: string
      description: Layer-2 mode the interface came up in
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.interface.mode
      notes: >
        from `interface Ethernet1/1 is up in mode access`; values access,
        trunk, fex-fabric. NX-OS-specific and genuinely useful — a port that
        comes back up in trunk mode when it previously came up in access mode
        is a configuration-drift or VLAN-hopping indicator with no IOS
        equivalent in the syslog stream.
    - vendor: changed state to <up|down>
      type: enum
      description: The new state of the link or line protocol
      ecs: event.action
      status: partial
      transform: >
        the integration stores it verbatim in cisco_nexus.log.state (UPDOWN)
        and cisco_nexus.log.line_protocol_state (LINEPROTO) and sets no ECS
        event.action at all. Normalize to interface-up / interface-down, and
        keep the administrative case as its own value so maintenance shutdowns
        do not alert. ECS service.state is a tempting alternative but is
        scoped to services, not interfaces.
    - vendor: down reason
      type: string
      description: Parenthesised reason an interface went down
      ecs: event.reason
      status: partial
      notes: >
        `(Link failure)`, `(Administratively down)`, `(SFP not inserted)`,
        `(Error disabled. Reason: ...)`. The stock `interface %{DATA} is
        %{GREEDYDATA}` grok throws it away, so today it is recoverable only
        from event.code (which encodes the coarse reason) or from message. The
        error-disabled sub-reason in particular has no mnemonic of its own and
        is lost entirely.
    - vendor: operational speed
      type: string
      description: Negotiated interface speed reported by %ETHPORT-5-SPEED
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.operational.speed
      notes: >
        printed as a human string such as `10 Gbps`, not a number, so it
        cannot go to a numeric ECS field without parsing. A data-centre uplink
        renegotiating downward is a physical-tamper and optics-failure
        indicator; the companion duplex and flow-control fields
        (cisco_nexus.log.operational.duplex_mode, .receive_flow_control_state,
        .transmit_flow_control_state) follow the same pattern.
    - vendor: vPC domain
      type: integer
      description: vPC domain identifier named in a peer-state message
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.vpc.domain
      notes: >
        from `In domain 100, VPC peer keep-alive receive has failed`. No stock
        branch parses the vPC family at all. ECS has no fabric or
        peer-relationship concept, so it stays custom. This is the
        highest-value low-volume record in the dataset: a keepalive failure
        followed by a peer-link down means a whole fabric leg is isolated, and
        it is the state a CSOC needs in order to read a simultaneous gap in
        every other dataset as a network event rather than an attack.
    - vendor: moved MAC address
      type: mac
      description: MAC address the forwarding manager observed moving between interfaces
      ecs: source.mac
      status: partial
      notes: >
        from `%L2FM-4-L2FM_MAC_MOVE2: Mac 0000.1111.2222 in vlan 10 has moved
        from Eth1/1 to Eth1/2`. The integration extracts the MAC via CISCOMAC
        but discards the from/to interfaces behind GREEDYDATA, which is the
        half that makes it an indicator — a repeated flap of one MAC between
        two ports is the NX-OS-visible signature of MAC spoofing or a
        duplicate-IP condition.
    - vendor: MAC move interfaces
      type: string
      description: The interface pair a moving MAC oscillated between
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.mac_move.interfaces
      notes: >
        the `from Eth1/1 to Eth1/2` tail, discarded by the stock grok. The
        integration's cisco_nexus.log.network.ingress_interface /
        .egress_interface pair is populated only for the duplex and
        native-VLAN mismatch messages, not for this one, so a separate custom
        field is the honest place for it until a branch is written.
    - vendor: VLAN id
      type: integer
      description: VLAN the moved MAC or the mismatched trunk belongs to
      ecs: network.vlan.id
      status: partial
      notes: >
        from L2FM_MAC_MOVE2 and NATIVE_VLAN_MISMATCH. Unparsed today.
        network.vlan.id is a keyword in ECS despite holding a number, so index
        it as the string form and do not expect numeric range queries.
    - vendor: slot_number / standby
      type: string
      description: Line-card slot or standby-supervisor marker inserted into the message header
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.slot_number
      notes: >
        NX-OS-specific and absent from IOS entirely — the documented header is
        %FACILITY-SEVERITY-MNEMONIC but also %FACILITY-SLOTnumber-SEVERITY-
        MNEMONIC and %FACILITY-STANDBY-SEVERITY-MNEMONIC, so the same ETHPORT
        message can arrive with an extra token in the middle depending on
        whether the active supervisor, a line card or the standby supervisor
        raised it. The integration's header grok handles all three; any
        hand-written Cribl regex must too, or line-card-sourced records will
        fail header extraction and lose event.code.
    - vendor: '%$ VDC-<n> %$ prefix'
      type: string
      description: >-
        Virtual device context marker prefixed to the message body on
        VDC-capable platforms
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.vdc
      notes: >
        Nexus 7000 with VDCs enabled prefixes the body with `%$ VDC-1 %$`
        before the %FACILITY header. The integration's body pattern anchors
        the header at the start of the body, so verify against real N7k
        traffic whether VDC-prefixed messages still yield facility, severity
        and event.code — if they do not, an entire platform's records degrade
        to header-only. The VDC name is also tenancy-revealing and is a
        natural guard-filter target.
    - vendor: sequence_number
      type: long
      description: >-
        Per-device monotonic message counter emitted when `logging message
        sequence-number` is configured
      ecs: event.sequence
      status: mapped
    - vendor: switch_name
      type: string
      description: Device name carried in the syslog header
      ecs: observer.name
      status: mapped
      notes: >-
        populated by the stock pipeline along with observer.type=switches, so
        this dataset needs no CMDB enrichment to attribute a port flap to a
        device
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Cost and build a low-side suppression or aggregation step before
          enabling this fabric-wide — a flapping port emits ETHPORT, LINK and
          LINEPROTO records in bursts — collapsing repeated transitions on one
          interface into a windowed summary instead of forwarding every one.
          Drop _raw first on this dataset (lowest forensic value in the file),
          attach the interface-to-tenant and interface-to-site lookups while
          the port names still have local meaning, and exempt the vPC and
          MAC-move records from the suppression entirely, since those are
          low-volume and each one is individually meaningful.
        elastic: >
          Extend the logs-cisco_nexus.log@custom pipeline with a vPC branch
          extracting the domain number and peer-keepalive state, and with a
          reason-capturing rewrite of the ETHPORT pattern so the parenthesised
          down reason reaches event.reason instead of being swallowed by
          GREEDYDATA. Derive event.action from the mnemonic by lookup —
          interface-up / interface-down / interface-admin-down — keeping the
          administrative case distinct so maintenance shutdowns do not alert,
          and key any UPDOWN query on facility as well as event.code because
          LINK and LINEPROTO share the mnemonic. Settle the interface-name
          home on the integration's cisco_nexus.log.interface.name or on
          observer.ingress.interface.name and populate only one, and add
          custom-namespace mappings for the vPC domain, operational
          speed/duplex and the MAC-move interface pair.
        relay: >
          On the low-side crossing, interface names, VLAN ids and vPC domain
          numbers are the disclosure risk here, so constrain them low-side —
          and consider dropping the transceiver and flow-control telemetry
          from the crossing entirely rather than relying on guard-side
          filtering to catch topology leakage. Cross with the thin envelope
          behind a Persistent Queue and a dead-letter route, and drop _raw
          from the crossing on this dataset first, since the low-side
          aggregation already reduces each record to what the CSOC needs for
          attributing gaps in the other datasets.
      direct:
        parse_location: high
        cribl: >
          Cost and build a suppression or aggregation step before enabling
          this fabric-wide — a flapping port emits ETHPORT, LINK and LINEPROTO
          records in bursts — collapsing repeated transitions on one interface
          into a windowed summary instead of forwarding every one. Drop _raw
          first on this dataset (lowest forensic value in the file), attach
          the interface-to-tenant and interface-to-site lookups while the port
          names still have local meaning, and exempt the vPC and MAC-move
          records from the suppression entirely, since those are low-volume
          and each one is individually meaningful.
        elastic: >
          Extend the logs-cisco_nexus.log@custom pipeline with a vPC branch
          extracting the domain number and peer-keepalive state, and with a
          reason-capturing rewrite of the ETHPORT pattern so the parenthesised
          down reason reaches event.reason instead of being swallowed by
          GREEDYDATA. Derive event.action from the mnemonic by lookup —
          interface-up / interface-down / interface-admin-down — keeping the
          administrative case distinct so maintenance shutdowns do not alert,
          and key any UPDOWN query on facility as well as event.code because
          LINK and LINEPROTO share the mnemonic. Settle the interface-name
          home on the integration's cisco_nexus.log.interface.name or on
          observer.ingress.interface.name and populate only one, and add
          custom-namespace mappings for the vPC domain, operational
          speed/duplex and the MAC-move interface pair.
  - format: snmp-trap
    enable: >
      Enable the syslog notification with `snmp-server enable traps syslog`
      (`message-generated` selects clogMessageGenerated), supported on NX-OS
      7.1 and later, and add the receiver with `snmp-server host <manager-ip>
      traps {version 2c <community> | version 3 priv <user>} udp-port <port>`.
      Set the clogMaxSeverity floor to notification (5) so the LINEPROTO,
      ETHPORT and L2FM records enter alongside the severity-2/3 LINK and vPC
      records. Interface names, VLAN identifiers and vPC domain numbers in
      this family disclose fabric topology, so use SNMPv3 on any device whose
      trap path leaves a trusted segment. Do not confuse this syslog
      notification with the dedicated `snmp-server enable traps link` IF-MIB
      linkUp/linkDown traps - those are a different notification with an
      ifIndex-keyed shape, not the %LINK/%LINEPROTO syslog message this
      dataset covers.
    references:
    - >-
      https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/102x/configuration/system-management/cisco-nexus-9000-series-nx-os-system-management-configuration-guide-102x/m-configuring-snmp-10x.html
    - https://web.mit.edu/outland/share/snmp/mibs/CISCO-SYSLOG-MIB.my
    - https://github.com/cisco/cisco-mibs/blob/main/schema/CISCO-SYSLOG-MIB.schema
    parsing:
      mechanism: cribl-pipeline
      artifact: custom NX-OS SNMP-trap (CISCO-SYSLOG-MIB) reparse pipeline
      notes: >
        A trap receiver terminates the PDU; the pipeline copies
        clogHistMsgText to event.original and reparses it. The reparse
        branches must key on clogHistFacility as well as clogHistMsgName
        because LINK and LINEPROTO share the UPDOWN mnemonic, and the two gaps
        the stock integration has - the discarded parenthesised down reason
        and the absent vPC branch - remain because the trap does not structure
        the body. The `%$ VDC-n %$` body prefix and the
        %FACILITY-SLOTn-SEVERITY header variants still ride inside
        clogHistMsgText, so the reparse header handling must match the syslog
        feed's. A Cribl-side suppression step in front of the reparse is worth
        costing before this dataset is trapped estate-wide.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Cost and build a low-side suppression or aggregation step before
          enabling this over the trap estate-wide - a flapping port emits
          ETHPORT, LINK and LINEPROTO trap PDUs in bursts - collapsing
          repeated transitions on one interface into a windowed summary, and
          exempt the low-volume vPC and MAC-move records from the suppression
          entirely. Terminate the trap low-side, decode the varbinds, reparse
          the interface name and state, drop event.original first on this
          dataset (lowest forensic value in the file), attach the
          interface-to-tenant lookup while the names still resolve, and set
          observer.name from the receiver metadata.
        elastic: >
          Extend the reparse with a vPC branch extracting the domain number
          and peer-keepalive state, a reason-capturing ETHPORT rewrite so the
          parenthesised down reason reaches event.reason instead of being
          swallowed, and event.action by mnemonic lookup with the
          administrative case kept distinct. Key any UPDOWN query on
          clogHistFacility as well as event.code, apply the clogHistSeverity
          minus-one conversion (vPC=2 versus port-down=5 is the clearest case
          for the inverted-scale lookup), and add custom mappings for the vPC
          domain, operational speed/duplex and the MAC-move interface pair.
        relay: >
          Interface names, VLAN ids and vPC domain numbers are the disclosure
          risk, so constrain them low-side and consider dropping the
          transceiver and flow-control telemetry from the crossing entirely
          rather than relying on guard-side filtering. Cross the decoded
          record behind a Persistent Queue and a dead-letter route, drop
          event.original first on this dataset, and reconcile per hour since
          the low-side aggregation already reduces each record to what the
          CSOC needs for attributing gaps in the other datasets.
      direct:
        parse_location: high
        cribl: >
          For a high-side switch, terminate the trap on an SNMP receiver and
          forward decoded varbinds through the aggregation step. The trap adds
          nothing over plain syslog for interface state and carries real
          per-transition PDU overhead at flap volume, so adopt it only where
          SNMP is the existing path. Do not run trap and the `logging server`
          feed as dual authoritative sources for one switch.
        elastic: >
          A reparse pipeline with a vPC branch extracting the domain number
          and peer-keepalive state, a reason-capturing ETHPORT rewrite so the
          parenthesised down reason reaches event.reason instead of being
          swallowed, and event.action by mnemonic lookup with the
          administrative case kept distinct; key any UPDOWN query on
          clogHistFacility as well as event.code because LINK and LINEPROTO
          share the mnemonic, and apply the clogHistSeverity minus-one
          conversion through the inverted-scale lookup (vPC=2 versus
          port-down=5). The messages are short, so the 255-byte truncation is
          a non-issue for this family; treat the trap purely as a transport
          choice, not a fidelity improvement over syslog.
    fields:
    - vendor: clogHistMsgText
      type: string
      description: >-
        CISCO-SYSLOG-MIB - full text of the state-change message;
        SnmpAdminString capped at 255 bytes, but this family is short enough
        that truncation rarely bites.
      ecs: event.original
      status: partial
      notes: >
        carries the whole ETHPORT / LINK / LINEPROTO / VPC / L2FM_MAC_MOVE2
        record - the interface name, the `changed state to` token, the
        parenthesised down reason, the vPC domain and the moved MAC with its
        from/to interfaces - as undecomposed text, including any `%$ VDC-n %$`
        prefix.
    - vendor: clogHistMsgName
      type: string
      description: CISCO-SYSLOG-MIB - message name (the bare mnemonic), SIZE 1..30.
      ecs: event.code
      status: mapped
      transform: >
        IF_UP / IF_DOWN_LINK_FAILURE / IF_DOWN_ADMIN_DOWN / SPEED / UPDOWN /
        LINEPROTO / PEER_KEEP_ALIVE_RECV_FAIL / L2FM_MAC_MOVE2. NX-OS encodes
        the DOWN REASON in the mnemonic, so event.code carries information
        that on IOS lives in the body; UPDOWN is shared by LINK and LINEPROTO,
        so every query must also filter on clogHistFacility.
    - vendor: clogHistFacility
      type: string
      description: >-
        CISCO-SYSLOG-MIB - facility name (ETHPORT, LINK, LINEPROTO, VPC, L2FM,
        SPANNING_TREE), SIZE 1..20.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.facility
      notes: >
        LINK-3-UPDOWN and LINEPROTO-5-UPDOWN share the UPDOWN mnemonic, so
        this separately-carried facility varbind is what tells a
        physical-layer failure from a protocol-layer one - one place the
        trap's broken-out facility is genuinely convenient. Not mapped to
        log.syslog.facility.name.
    - vendor: clogHistSeverity
      type: integer
      description: CISCO-SYSLOG-MIB - SyslogSeverity enum emergency(1)..debug(8).
      ecs: event.severity
      status: partial
      transform: >
        subtract one to recover the Cisco 0-7 digit; vPC records are 2 while
        an ordinary port down is 5, so on this dataset the digit carries real
        triage signal once the shared inverted-scale lookup is applied.
    - vendor: clogHistTimestamp
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - value of sysUpTime (device-uptime ticks) when the
        message was generated.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.snmp.sysuptime
      notes: >-
        uptime ticks, not wall-clock; @timestamp must come from the
        trap-receiver arrival time. On this dataset the ticks also cheaply
        distinguish a real link-down from a device reboot (the value resets to
        near zero).
    - vendor: clogHistIndex
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - monotonically increasing index of the message in
        the syslog history table, carried in the varbind OID instance.
      ecs: null
      status: unmapped
      custom: cisco_nexus.log.snmp.history_index
      notes: >-
        gap/duplicate detection only, the trap analogue of the syslog sequence
        number; useful for spotting traps lost during a flap storm.
  - format: api-pull
    enable: >
      Enable `feature nxapi` on HTTPS with a real certificate and a
      least-privilege poller account, then POST `show logging logfile` or
      `show logging last <n>` to `/ins` (JSON-RPC 2.0 body, Content-Type
      application/json-rpc, or the ins_api envelope with output_format json).
      Persist the on-box file with `logging logfile <name> <level> size
      <bytes>` sized for a flap burst, and keep the device-side interface and
      vPC logging configuration the syslog path relies on. On VDC-capable
      Nexus 7000 the pulled lines still carry the `%$ VDC-n %$` body prefix
      and the %FACILITY-SLOTn-SEVERITY-MNEMONIC header variants, so the
      collector's reparse must handle them exactly as the syslog header grok
      does.
    references:
    - >-
      https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7-x/programmability/guide/b_Cisco_Nexus_9000_Series_NX-OS_Programmability_Guide_7x/NX_API.html
    - >-
      https://developer.cisco.com/docs/cisco-nexus-9000-series-nx-api-cli-reference/latest/logging-commands/
    - >-
      https://developer.cisco.com/docs/cisco-nexus-3000-and-9000-series-nx-api-rest-sdk-user-guide-and-api-reference-release-9-3x/logging-system-messages-to-a-file/
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Cribl REST Collector + logs-cisco_nexus.log reparse pipeline
      notes: >
        A Cribl REST Collector fetches `/ins` and lifts each ROW_.log line to
        event.original; the stock cisco_nexus ETHPORT/LINK/LINEPROTO and
        L2FM_MAC_MOVE2 groks apply, and the two gaps the syslog path has - the
        discarded parenthesised down reason and the missing vPC branch -
        remain because NX-API does not structure the body. Reparse branches
        must still key on facility as well as event.code (LINK and LINEPROTO
        share UPDOWN), so the pull changes nothing about the parsing; it only
        substitutes a poll for the wire.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          A flapping port overruns both the pull cadence and the bounded
          buffer, so cost a low-side suppression or windowed-aggregation step
          before polling this fabric-wide, and exempt the low-volume vPC and
          MAC-move records from suppression since each is individually
          meaningful. Run the REST Collector low-side, unwrap ROW_.log to
          event.original, dedup on the embedded sequence number, drop
          event.original first on this dataset (lowest forensic value in the
          file), attach the interface-to-tenant lookup while the names still
          resolve, and set observer.name from the poll target.
        elastic: >
          Reuse the logs-cisco_nexus.log@custom pipeline the syslog path
          needs: the vPC branch extracting the domain number and
          peer-keepalive state, the reason-capturing ETHPORT rewrite that
          saves the parenthesised down reason to event.reason, and
          event.action by mnemonic lookup with the administrative case kept
          distinct. Settle the interface-name home on one field and populate
          only one, and tag the record as pulled so a suppression-window gap
          is distinguishable from a poll gap.
        relay: >
          Interface names, VLAN ids and vPC domain numbers are the disclosure
          risk, so constrain them low-side and consider dropping the
          transceiver and flow-control telemetry from the crossing entirely
          rather than relying on guard-side filtering. Cross the decoded
          record behind a Persistent Queue and a dead-letter route, drop
          event.original first on this dataset, and fold the poll cadence into
          the hourly reconciliation since the low-side aggregation already
          reduces each record to what the CSOC needs for attributing gaps
          elsewhere.
      direct:
        parse_location: high
        cribl: >
          For a high-side switch, a REST Collector against `/ins` forwards
          decoded ROW_.log lines through the aggregation step to the core
          worker group. The pull adds nothing over syslog for interface state
          and loses records during a flap storm, so adopt it only where syslog
          cannot reach the collector, and never run it alongside the `logging
          server` feed as a dual authoritative source for one switch.
        elastic: >
          A logs-cisco_nexus.log@custom pipeline with the vPC branch
          extracting the domain number and peer-keepalive state, the
          reason-capturing ETHPORT rewrite that saves the parenthesised down
          reason to event.reason, event.action by mnemonic lookup with the
          administrative case kept distinct, facility-plus-code branching
          (LINK and LINEPROTO share UPDOWN) and MAC-move interface-pair
          recovery. Alert on embedded-sequence gaps, which on this dataset
          most often mean a flap storm rotated the buffer between polls rather
          than a genuine quiet interface.
    fields:
    - vendor: ROW_logfile.log / ROW_nvram.log
      type: string
      description: >-
        NX-API - one buffered state-change record returned as a whole raw
        ASCII line inside the TABLE_/ROW_ array of a `show logging` response.
      ecs: event.original
      status: partial
      notes: >
        carries the whole ETHPORT / LINK / LINEPROTO / VPC / L2FM_MAC_MOVE2
        record - the interface name, the `changed state to` token, the
        parenthesised down reason, the vPC domain and the moved MAC with its
        from/to interfaces - as undecomposed text, including any `%$ VDC-n %$`
        prefix and slot/standby header variant. NX-API structures none of it.
    - vendor: interface name (embedded)
      type: string
      description: Name of the interface whose state changed, inside the raw ROW_.log line
      ecs: observer.ingress.interface.name
      status: partial
      notes: >
        e.g. Ethernet1/19, port-channel10; recovered by the same grok the
        syslog feed uses. ECS still has no plain interface fieldset and the
        integration's own cisco_nexus.log.interface.name is the alternative
        home - pick one and populate only one, exactly the decision the wire
        feed faces.
    - vendor: changed state to <up|down> (embedded)
      type: enum
      description: The new state of the link or line protocol, inside the raw line
      ecs: event.action
      status: partial
      transform: >
        normalise to interface-up / interface-down and keep the administrative
        case distinct so maintenance shutdowns do not alert; no stock
        processor sets event.action whether the record is pulled or received,
        so this is custom-pipeline work either way.
    - vendor: sequence_number (embedded)
      type: long
      description: >-
        Per-device monotonic counter inside the raw line when `logging message
        sequence-number` is set
      ecs: event.sequence
      status: partial
      notes: >-
        dedup key for overlapping polls and the detector for a flap storm that
        rotated the bounded buffer between fetches; require the emitting
        command on any pull deployment
    - vendor: switch_name (embedded)
      type: string
      description: Device name at the head of the raw syslog line
      ecs: observer.name
      status: partial
      notes: >-
        set observer.name from the poll target or the embedded token, since
        the NX-API response envelope carries no device identity of its own
