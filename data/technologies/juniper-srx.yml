  - format: other
    enable: >
      The same stream-wide setting as the other two datasets: `set security
      log mode stream` with `set security log stream <name> format binary` (or
      `format protobuf`) and `set security log stream <name> host
      <collector-ip> port <port>`. Because the format is a property of the
      stream and not of the message tag, the RT_UTM WEBFILTER_*,
      AV_VIRUS_DETECTED_MT, CONTENT_FILTERING_* and ANTISPAM_* records are all
      re-encoded into the binary frame; JSA maps them onto its content-
      security categories on ingest. Streamed over UDP to the JSA binary port
      (default 40798).
    references:
    - >-
      https://www.juniper.net/documentation/us/en/software/junos/utm/topics/ref/statement/security-edit-format-logging-format-2.html
    - >-
      https://www.juniper.net/documentation/us/en/software/junos/network-mgmt/topics/topic-map/system-logging-for-a-security-device.html
    - >-
      https://www.juniper.net/documentation/us/en/software/jsa7.5.0/jsa-dsm/topics/concept/concept-jsa-dsm-juniper-networks-security-binary-log.html
    parsing:
      mechanism: none
      notes: >
        No Elastic integration, Elastic ingest processor, or Cribl function
        decodes the Juniper binary/protobuf format; only JSA / QRadar reads it
        via the Security Binary Log Collector protocol. The field set is the
        same RT_UTM inventory as the sd-syslog form (the split url/obj URL
        parts, category, action, profile, antivirus signature name, session
        id), but there is no published third-party binary schema, so it is
        recorded as a gap. The RT_UTM tags already differ in their attribute
        spellings between message tags; the binary form offers no relief there
        because it is un-parseable on our side at all.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          No Cribl decoder exists for the binary/protobuf frame. Do not select
          binary for an Elastic-bound UTM feed; keep RT_UTM on sd-syslog so
          the utm sub-pipeline (and the low-side profile-name/source-zone-name
          normalization the deployed map calls for) can run. Reserve binary
          for a JSA/QRadar consumer, running a parallel sd-syslog stream where
          both are needed.
        elastic: >
          The juniper_srx utm sub-pipeline expects sd-syslog text and cannot
          read binary/protobuf; the URL-reassembly and category work the
          deployed map specifies all depend on the parsed sd-syslog fields.
          Keep the UTM feed on sd-syslog.
        relay: >
          Do not cross the binary/protobuf stream - it is opaque to the
          content filter and un-parseable high-side. This dataset already has
          the worst content-filter profile (kilobyte-scale, attacker-
          influenced URLs and filenames); an opaque binary frame removes the
          ability to cap and normalize that content low-side, which the
          deployed relay depends on. Relay the sd-syslog form as the thin
          NDJSON envelope instead.
      direct:
        parse_location: low
        cribl: >
          No decoder in the Cribl/Elastic stack reads the binary/protobuf
          frame, so keep RT_UTM on sd-syslog and use binary only for a
          JSA/QRadar destination.
        elastic: >
          No Elastic-side parse is possible; sd-syslog is the only
          Elastic-consumable option for the UTM dataset.
    fields_omitted: >
      The binary/protobuf frame carries the same RT_UTM content the syslog-kv
      (sd-syslog) entry inventories - the split url/obj URL parts, category,
      action, profile, antivirus signature name and session id - but Junos
      publishes no third-party schema for it, and only JSA/QRadar reads it
      over the Security Binary Log Collector protocol, so there are no per-tag
      key names to list.
    fields: []
