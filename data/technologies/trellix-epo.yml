id: trellix-epo
name: Trellix ePO (HBSS/ESS)
vendor: Trellix
versions: McAfee ePO 5.9/5.10, Trellix ePO 5.10.x/5.11 (on-prem)
draft: true
references:
- https://docs.nxlog.co/integrate/trellix-epo.html
- >-
  https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors/pdfdoc/mcafee-epo/mcafee-epo.pdf
- https://www.elastic.co/docs/reference/integrations/trellix_epo_cloud
- >-
  https://helpcenter.threatq.com/Integration_Documentation/cdf/Trellix_ePO_Events_CDF.htm
- >-
  https://learn.microsoft.com/en-us/azure/sentinel/data-connectors/mcafee-epolicy-orchestrator-epo
- >-
  https://docs.cloud.google.com/chronicle/docs/ingestion/default-parsers/mcafee-dlp
- https://kcm.trellix.com/corporate/index?page=content&id=KB91194
- https://qmasters.co/mcafee-dlp-events-support/
- >-
  https://www.commoncriteriaportal.org/files/epfiles/383-4-477%20MFE%20DLP%2011-1%20ST%2010%20(190508).pdf
datasets:
- id: ens-threat
  name: Endpoint Security threat event
  description: >
    Malware and threat detections raised by managed products (ENS Threat
    Prevention, Adaptive Threat Protection, legacy VirusScan Enterprise) and
    rolled up to the ePO server, then forwarded off-box by the registered
    syslog server feature. This is the ESS/HBSS event stream a government SOC
    actually watches.
  event_categories:
  - malware
  - file
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        ePO's registered syslog server forwards threat events as CEF over
        TLS/TCP (6514 by default) to a Cribl syslog source.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-trellix_epo.threat
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        ePO's registered syslog server forwards threat events as CEF over
        TLS/TCP (6514 by default) to a Cribl syslog source.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-trellix_epo.threat
  formats:
  - format: syslog-cef
    recommended: true
    recommended_because: >-
      the CEF syslog push is the feed the ArcSight connectors consume today,
      so migration is a re-point rather than a new collector; it is parsed
      low-side, so the guard crossing still carries NDJSON. The web-API poll
      adds one field for an ePO API user and a polling schedule.
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Trellix ePO CEF pipeline
      notes: >
        No Cribl pack ships for ePO, and Elastic's trellix_epo_cloud
        integration is an API collector for ePO SaaS only (it explicitly does
        not support on-prem installations), so the CEF header plus the ePO
        threat-event extension keys are extracted by a hand-built Cribl
        pipeline. The legacy path was the ArcSight McAfee ePO DB
        SmartConnector reading dbo.EPOEvents directly; the column names below
        are the ones that connector exposed and the ones the syslog CEF
        extension carries.
    fields:
    - vendor: DetectedUTC
      type: timestamp
      description: UTC time at which the managed product detected the threat on the endpoint
      ecs: '@timestamp'
      status: mapped
      transform: >
        emitted as epoch milliseconds by the ePO event API and as an ISO UTC
        string in the CEF extension; normalize to @timestamp rather than using
        the syslog receipt time, which can lag by an agent upload interval
    - vendor: ReceivedUTC
      type: timestamp
      description: UTC time the ePO server received the event from the McAfee Agent
      ecs: event.created
      status: partial
      notes: >
        server-side receipt time, not ingest time; kept so the gap between
        DetectedUTC and ReceivedUTC (agent-to-server upload lag, often tens of
        minutes on ASCI-throttled endpoints) stays visible to analysts
    - vendor: ThreatEventID
      type: integer
      description: >-
        numeric ePO event id identifying the specific detection type (e.g.
        1278 for an on-access file detection)
      ecs: event.code
      status: mapped
      transform: >-
        numeric id is stringified into event.code; the human-readable event
        name lives in the ePO EPOEventFilterDesc table and needs a lookup to
        become event.action-quality text
    - vendor: ThreatName
      type: string
      description: >-
        detection name assigned by the scanning engine (e.g. "EICAR test
        file", "Trojan-FSGX!...")
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.name
      notes: >
        the single most alert-relevant value in the record and it has no ECS
        home - Elastic's own trellix_epo_cloud integration also leaves
        threatname in the vendor namespace. Settled per the repository's
        mapping convention: this is the engine's verdict about what it found,
        not a rule that fired, so it stays in the vendor namespace and never
        goes to rule.name. The hips-intrusion dataset in this same map is the
        other half of that rule - SignatureName and SignatureID describe one
        configured signature and do take rule.name / rule.id.
    - vendor: ThreatType
      type: string
      description: >-
        coarse classification of the detection (test, trojan, pup, exploit,
        access protection, ...)
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.type
    - vendor: ThreatCategory
      type: string
      description: ePO threat taxonomy bucket, e.g. av.detect, access.protection, hip.sig, policy
      ecs: null
      status: partial
      custom: trellix.epo.threat.category
      notes: >
        this is the field that actually discriminates AV detections from
        Access Protection and Host IPS records inside one syslog stream; it
        drives routing/event.category selection in the pipeline but cannot
        itself be written to event.category, which is a closed ECS vocabulary
    - vendor: ThreatSeverity
      type: integer
      description: ePO severity of the detection, 0-7
      ecs: event.severity
      status: partial
      transform: >
        the ePO scale is inverted relative to intuition (0-2 = critical/ high,
        3-4 = medium, 5-7 = informational); a lookup must invert and rescale
        it before threshold-based alerting is safe
    - vendor: ThreatActionTaken
      type: string
      description: >-
        response the product took on the threat, emitted as a localization key
        such as IDS_ALERT_ACT_TAK_DEL or IDS_ALERT_ACT_TAK_CLE
      ecs: event.action
      status: partial
      transform: >
        values are IDS_ALERT_ACT_TAK_* resource keys, not English; a lookup
        table (deleted, cleaned, denied access, continued, quarantined, none)
        is required before event.action is readable or groupable
    - vendor: ThreatHandled
      type: boolean
      description: whether the managed product successfully remediated the threat
      ecs: event.outcome
      status: mapped
      transform: >
        boolean true/false is translated to success/failure; this is the only
        clean outcome signal in the record - ThreatActionTaken alone does not
        say whether the action succeeded
    - vendor: AnalyzerName
      type: string
      description: >-
        name of the managed product that made the detection (Trellix Endpoint
        Security, VirusScan Enterprise, ...)
      ecs: observer.product
      status: mapped
    - vendor: AnalyzerDetectionMethod
      type: string
      description: >-
        how the threat was found (On-Access Scan, On-Demand Scan, Real
        Protect, Exploit Prevention, ...)
      ecs: null
      status: unmapped
      custom: trellix.epo.analyzer.detection_method
      notes: >-
        scan engine / detection technique; drives triage priority but has no
        ECS equivalent
    - vendor: AnalyzerDATVersion
      type: string
      description: signature (DAT) content version loaded on the endpoint at detection time
      ecs: null
      status: unmapped
      custom: trellix.epo.analyzer.dat_version
      notes: >-
        also the practical way to spot endpoints running stale content, an ESS
        compliance question in its own right
    - vendor: SourceIPV4
      type: ip
      description: IPv4 address the threat originated from
      ecs: source.ip
      status: partial
      transform: >
        the ePO database stores this as a signed 32-bit integer offset by
        2^31; the syslog/CEF path emits a dotted quad. Pipelines fed from the
        legacy ArcSight DB connector still need the integer-to-IP conversion,
        the syslog path does not
    - vendor: SourceProcessName
      type: string
      description: >-
        full path of the process that triggered the detection, e.g.
        C:\Windows\explorer.exe
      ecs: process.executable
      status: mapped
    - vendor: SourceUserName
      type: string
      description: account the source process was running as
      ecs: source.user.name
      status: mapped
    - vendor: TargetHostName
      type: string
      description: hostname of the endpoint the threat was found on
      ecs: host.name
      status: mapped
    - vendor: TargetIPV4
      type: ip
      description: IPv4 address of the affected endpoint
      ecs: host.ip
      status: partial
      notes: >
        CEF carries this in the destination (dst) slot, but for endpoint
        detections the target IS the managed host, so it is mapped to host.ip
        rather than destination.ip; ArcSight-era content that keyed on
        destinationAddress needs reverting when it is ported
    - vendor: TargetUserName
      type: string
      description: account associated with the affected file or process, e.g. WINDOWS-NEW\Admin
      ecs: user.name
      status: partial
      transform: >-
        arrives as DOMAIN\user and must be split into user.domain plus
        user.name; unqualified local accounts appear without a domain
    - vendor: TargetFileName
      type: string
      description: full path of the file the detection fired on
      ecs: file.path
      status: mapped
    - vendor: TargetHash
      type: string
      description: MD5 hash of the detected file
      ecs: file.hash.md5
      status: mapped
      notes: >
        ePO threat events carry MD5 only. The malware alerting profile
        requires file.hash.sha256, so this dataset cannot satisfy it without a
        downstream hash-enrichment lookup
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Own the whole parse here: CEF header plus the ePO threat extension
          keys, branching on ThreatCategory so av.detect records leave on this
          route and hip.sig records leave on the HIPS one, and emit full
          ECS-shaped JSON — no integration exists for on-prem ePO, so there is
          nothing downstream to hand a raw payload to. Do the normalizations
          low-side where the reference data is closest: invert and rescale the
          0-7 ePO severity, resolve IDS_ALERT_ACT_TAK_* into readable
          event.action text through a lookup, translate ThreatHandled into
          event.outcome, split DOMAIN\user into user.domain plus user.name,
          and key @timestamp off DetectedUTC rather than syslog receipt time
          so agent upload lag does not silently backdate detections. Carry a
          ThreatEventID→event-name lookup exported from EPOEventFilterDesc
          alongside the pipeline, then Schema-Library validate
          (C.Schema(...).validate) with a dead-letter route immediately before
          the destination and Persistent Queue backpressure rather than Block;
          keep _raw, since malware detections are the forensic class and this
          hand-built parser is unproven.
        elastic: >
          The trellix_epo_cloud integration is an ePO SaaS API collector and
          does not apply, so stand up a custom ingest pipeline and index
          template for logs-trellix_epo.threat that accepts the pre-shaped
          documents instead of re-parsing them, with custom-namespace keyword
          mappings for trellix.epo.threat.name, .type, .category and
          trellix.epo.analyzer.detection_method and .dat_version. Keep
          ThreatName in the vendor namespace per the repository's mapping
          convention — it is the engine's verdict, not a rule that fired, so
          CSOC content keys on trellix.epo.threat.name and not rule.name — and
          assert in the template that ThreatCategory never reaches the closed
          event.category vocabulary. Record the profile gap explicitly: this
          feed carries MD5 only, so either add a hash-enrichment lookup that
          resolves file.hash.sha256 or accept that the malware alerting
          profile is unsatisfiable from this dataset alone, and validate that
          TargetIPV4 lands in host.ip so ported ArcSight content keyed on
          destinationAddress is caught.
        relay: >
          The appliance keeps emitting CEF over syslog and that does not
          change, but the conversion happens on the low-side worker, so full
          ECS-shaped JSON crosses the guard and no CEF reaches the boundary or
          Elastic. The content-inspection friction here is operator- and
          attacker-influenced free text — ThreatName strings, long Windows
          file paths with unicode and backslash escaping, and DOMAIN\user
          values — so normalize to UTF-8, strip control characters and enforce
          declared length caps before the guard destination, and hold the
          document to two levels of nesting with short ASCII allowlisted keys
          so a custom NDJSON filter can stay simple. Treat the crossing as
          at-most-once with no return channel: Persistent Queue on the guard
          destination and per (dataset, hour) low-side/high-side count
          reconciliation are the only drop detectors.
      direct:
        parse_location: low
        cribl: >
          Own the whole parse here: CEF header plus the ePO threat extension
          keys, branching on ThreatCategory so av.detect records leave on this
          route and hip.sig records leave on the HIPS one, and emit full
          ECS-shaped JSON — no integration exists for on-prem ePO, so there is
          nothing downstream to hand a raw payload to. Do the normalizations
          at parse time where the reference data is closest: invert and
          rescale the 0-7 ePO severity, resolve IDS_ALERT_ACT_TAK_* into
          readable event.action text through a lookup, translate ThreatHandled
          into event.outcome, split DOMAIN\user into user.domain plus
          user.name, and key @timestamp off DetectedUTC rather than syslog
          receipt time so agent upload lag does not silently backdate
          detections. Carry a ThreatEventID→event-name lookup exported from
          EPOEventFilterDesc alongside the pipeline, then Schema-Library
          validate (C.Schema(...).validate) with a dead-letter route
          immediately before the destination and Persistent Queue backpressure
          rather than Block; keep _raw, since malware detections are the
          forensic class and this hand-built parser is unproven.
        elastic: >
          The trellix_epo_cloud integration is an ePO SaaS API collector and
          does not apply, so stand up a custom ingest pipeline and index
          template for logs-trellix_epo.threat that accepts the pre-shaped
          documents instead of re-parsing them, with custom-namespace keyword
          mappings for trellix.epo.threat.name, .type, .category and
          trellix.epo.analyzer.detection_method and .dat_version. Keep
          ThreatName in the vendor namespace per the repository's mapping
          convention — it is the engine's verdict, not a rule that fired, so
          CSOC content keys on trellix.epo.threat.name and not rule.name — and
          assert in the template that ThreatCategory never reaches the closed
          event.category vocabulary. Record the profile gap explicitly: this
          feed carries MD5 only, so either add a hash-enrichment lookup that
          resolves file.hash.sha256 or accept that the malware alerting
          profile is unsatisfiable from this dataset alone, and validate that
          TargetIPV4 lands in host.ip so ported ArcSight content keyed on
          destinationAddress is caught.
  - format: jdbc-sql
    enable: >
      No console toggle is involved: the dbo.EPOEvents view exists as soon as
      ePO is installed and holds every managed-product event the agents roll
      up, joined at query time to the product-specific extension tables
      (EPExtendedEvent / the threat-event extension the ENS and VirusScan
      modules write). Create a read-only SQL Server login and grant it SELECT
      on dbo.EPOEvents (and the extension views) in the ePO_<servername>
      database, then point a JDBC/ODBC collector at the ePO SQL Server. Filter
      on ThreatCategory / ThreatType server-side so the AV-detect rows leave
      on this route and HIPS rows leave on the intrusion one, and page on the
      monotonically increasing AutoID high-water mark so each row is read
      exactly once. This is the ePO 'epo'/'endpointsecurity' device-type path
      the ArcSight McAfee ePO DB SmartConnector implemented.
    references:
    - >-
      https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors/pdfdoc/mcafee-epo/mcafee-epo.pdf
    - https://docs.nxlog.co/integrate/trellix-epo.html
    parsing:
      mechanism: cribl-pipeline
      artifact: Cribl Database Collector against dbo.EPOEvents plus a normalization pipeline
      notes: >
        No Cribl pack or Elastic integration covers on-prem ePO, so a
        scheduled Database Collector reads the view and a hand-built pipeline
        normalizes the columns. The DB view carries two conversions the CEF
        path does not: the IPv4 columns (ThreatSourceIPv4, IPv4) are stored as
        signed 32-bit integers offset by 2^31 and must be turned back into
        dotted quads, and the timestamps are DB-native datetimes rather than
        the ISO strings the syslog extension emits. Because the column set is
        a superset of what the CEF stream forwards, this path recovers
        detection detail (attack-vector type, per-action status, file
        access/modify times, source and target hashes) the registered syslog
        feed drops.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Run the Database Collector low-side next to the ePO SQL Server,
          keyed on the AutoID high-water mark, and own the whole normalize
          here because there is nothing downstream to hand a raw row to. Do
          the DB-specific fixes first: convert the signed-integer IPv4 columns
          to dotted quads, invert and rescale the 0-7 ThreatSeverity (0-2
          critical/high, 3-4 medium, 5-7 informational) before any threshold
          alerting, resolve ThreatAction and the First/Second ActionStatus
          codes into readable event.action text through a lookup, split the
          DOMAIN\\user UserName values into user.domain plus user.name, and
          key @timestamp off GeneratedTime rather than collector poll time so
          agent upload lag does not backdate detections. Carry the
          ThreatEventID->event-name lookup exported from EPOEventFilterDesc
          alongside the pipeline, Schema-Library validate with a dead-letter
          route before the destination, and use Persistent Queue backpressure
          rather than Block. Keep _raw while this hand-built parser is
          unproven - malware detections are the forensic class.
        elastic: >
          Stand up a custom ingest pipeline and index template for
          logs-trellix_epo.threat that accepts the pre-shaped documents
          instead of re-parsing them, with custom-namespace keyword mappings
          for trellix.epo.threat.name, .type, .category, .family and
          trellix.epo.analyzer.detection_method and .dat_version. Keep
          ThreatName in the vendor namespace per the repository's mapping
          convention - it is the engine's verdict, not a rule that fired, so
          CSOC content keys on trellix.epo.threat.name and not rule.name - and
          assert in the template that ThreatCategory never reaches the closed
          event.category vocabulary. This DB path carries only TargetHash
          (MD5), so either add a hash-enrichment lookup that resolves
          file.hash.sha256 or accept that the malware alerting profile is
          unsatisfiable from this dataset alone, and validate that the target
          IPv4 lands in host.ip so ported ArcSight content keyed on
          destinationAddress is caught.
        relay: >
          The collector and its AutoID high-water mark must live low-side - a
          database connection cannot cross a one-way guard - so the crossing
          carries emitted NDJSON, never a SQL session and never CEF. The
          content-inspection friction is operator- and attacker-influenced
          free text: ThreatName strings, long Windows file paths with unicode
          and backslash escaping, Description text and DOMAIN\\user values.
          Normalize to UTF-8, strip control characters and enforce declared
          length caps before the guard destination, and hold the document to
          two levels of nesting with short ASCII allowlisted keys so a custom
          NDJSON filter stays simple. Treat the crossing as at-most-once with
          no return channel: Persistent Queue on the guard destination and per
          (dataset, hour) low-side/high-side row-count reconciliation are the
          only drop detectors, and the high side can never tell the collector
          to re-read an AutoID window.
      direct:
        parse_location: low
        cribl: >
          For a high-side ePO whose SQL Server is reachable without the guard,
          the Database Collector and the same normalizations apply without the
          length-capping and dead-letter discipline the crossing forces. The
          decision that matters here is deduplication against any CEF syslog
          feed collected from the same ePO: key on ThreatEventID with
          GeneratedTime and the target host so a detection seen on both the DB
          read and the registered-syslog stream is recognized as one event
          rather than double-counted, and retain the richer DB-only columns
          (attack-vector type, action statuses, file times) for hunting since
          there is no boundary to strip them for.
        elastic: >
          Stand up a custom ingest pipeline and index template for
          logs-trellix_epo.threat that accepts the pre-shaped documents, with
          custom-namespace keyword mappings for trellix.epo.threat.name,
          .type, .category, .family and trellix.epo.analyzer.detection_method
          and .dat_version, keeping ThreatName on trellix.epo.threat.name per
          the repository's mapping convention so CSOC content keys on the
          vendor namespace rather than rule.name. With no boundary, keep the
          source and target hashes and the full timestamp set the DB view
          carries and treat this feed as the authoritative detail source where
          the syslog CEF stream is the low-latency alerting feed - reconcile
          observer.product from DetectingProductName/AnalyzerName so both
          feeds line up for the same endpoint estate.
    fields:
    - vendor: GeneratedTime
      type: timestamp
      description: DB-native time the managed product generated the detection on the endpoint
      ecs: '@timestamp'
      status: mapped
      transform: >
        the DB equivalent of the CEF DetectedUTC; key @timestamp off it rather
        than collector poll time, which lags by an agent upload interval
    - vendor: ReceivedTime
      type: timestamp
      description: time the ePO server received the event from the McAfee Agent
      ecs: event.created
      status: partial
      notes: >-
        server-side receipt time, not ingest time; kept so the agent-to-server
        upload gap stays visible
    - vendor: ThreatEventID
      type: integer
      description: numeric ePO event id identifying the specific detection type
      ecs: event.code
      status: mapped
      transform: >-
        stringified into event.code; the human-readable name lives in
        EPOEventFilterDesc and needs a lookup to become event.action-quality
        text
    - vendor: Name
      type: string
      description: >-
        resolved event name for the detection (the EPOEventFilterDesc label
        for the ThreatEventID)
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.event_name
      notes: >-
        the readable event name the DB view joins in; distinct from the
        free-text Description in message
    - vendor: ThreatName
      type: string
      description: detection name assigned by the scanning engine (e.g. "EICAR test file")
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.name
      notes: >
        the single most alert-relevant value in the record and it has no ECS
        home. Settled per the repository's mapping convention: a detection
        verdict stays in the vendor namespace, and rule.* is reserved for a
        configured rule - on this technology that is the hips-intrusion
        signature, not an AV detection name.
    - vendor: FamilyName
      type: string
      description: malware family the detection was classified under
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.family
      notes: a grouping key the registered-syslog CEF stream does not forward
    - vendor: ThreatType
      type: string
      description: >-
        coarse classification of the detection (test, trojan, pup, exploit,
        access protection, ...)
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.type
    - vendor: ThreatCategory
      type: string
      description: ePO threat taxonomy bucket, e.g. av.detect, access.protection, hip.sig, policy
      ecs: null
      status: partial
      custom: trellix.epo.threat.category
      notes: >
        the field that discriminates AV detections from Access Protection and
        Host IPS rows inside the one view; it drives route and event.category
        selection but cannot itself be written to event.category, a closed ECS
        vocabulary
    - vendor: ThreatSeverity
      type: integer
      description: ePO severity of the detection, 0-7
      ecs: event.severity
      status: partial
      transform: >
        the ePO scale is inverted relative to intuition (0-2 critical/ high,
        3-4 medium, 5-7 informational); a lookup must invert and rescale it
        before threshold-based alerting is safe
    - vendor: ThreatAction
      type: string
      description: response the product took on the threat
      ecs: event.action
      status: partial
      transform: >-
        emitted as a numeric/enum action code in the view rather than English;
        a lookup is required before event.action is readable or groupable
    - vendor: FirstActionStatus
      type: integer
      description: status of the first remediation action the product attempted
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.first_action_status
      notes: >-
        pairs with SecondActionStatus to say whether the attempted action
        succeeded; the DB view keeps both, the CEF stream collapses them
    - vendor: SecondActionStatus
      type: integer
      description: status of the second remediation action the product attempted
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.second_action_status
    - vendor: AttackVectorType
      type: integer
      description: >-
        numeric code for the vector by which the threat arrived (file, web,
        email, network, ...)
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.attack_vector_type
      notes: >-
        DB-only enrichment absent from the syslog CEF extension; drives triage
        but has no ECS equivalent
    - vendor: AnalyzerDetectionMethod
      type: string
      description: >-
        how the threat was found (On-Access Scan, On-Demand Scan, Real
        Protect, Exploit Prevention, ...)
      ecs: null
      status: unmapped
      custom: trellix.epo.analyzer.detection_method
    - vendor: DATVersion
      type: string
      description: signature (DAT) content version loaded on the endpoint at detection time
      ecs: null
      status: unmapped
      custom: trellix.epo.analyzer.dat_version
      notes: >-
        also the practical way to spot endpoints running stale content, an ESS
        compliance question in its own right
    - vendor: DetectingProductID
      type: string
      description: internal id of the managed product that made the detection
      ecs: null
      status: unmapped
      custom: trellix.epo.analyzer.product_id
    - vendor: AgentGUID
      type: string
      description: GUID of the McAfee Agent that reported the event
      ecs: null
      status: unmapped
      custom: trellix.epo.agent_guid
      notes: the stable per-endpoint agent identity; the join key back to the System Tree
    - vendor: DetectingProductHostName
      type: string
      description: hostname of the endpoint running the detecting product
      ecs: observer.hostname
      status: mapped
    - vendor: DetectingProductVersion
      type: string
      description: version of the managed product that made the detection
      ecs: observer.version
      status: mapped
    - vendor: DetectingProductMAC
      type: string
      description: MAC address of the endpoint running the detecting product
      ecs: observer.mac
      status: mapped
    - vendor: Description
      type: string
      description: free-text summary the product wrote for the detection
      ecs: message
      status: mapped
    - vendor: TargetHash
      type: string
      description: MD5 hash of the detected file
      ecs: file.hash.md5
      status: mapped
      notes: >-
        ePO threat events carry MD5 only; the malware alerting profile
        requires file.hash.sha256, so this dataset cannot satisfy it without a
        downstream hash-enrichment lookup
    - vendor: SourceHash
      type: string
      description: hash of the source process/file that triggered the detection
      ecs: null
      status: unmapped
      custom: trellix.epo.source.hash
      notes: >-
        algorithm not declared in the column, so it cannot go into a typed
        file.hash.* field without probing the digest length
    - vendor: TargetFileSize
      type: long
      description: size in bytes of the file the detection fired on
      ecs: file.size
      status: mapped
    - vendor: FilePath
      type: string
      description: full path of the file the detection fired on
      ecs: file.path
      status: mapped
    - vendor: TargetAccessTime
      type: timestamp
      description: time the target file was last accessed
      ecs: file.accessed
      status: mapped
    - vendor: TargetModifyTime
      type: timestamp
      description: time the target file was last modified
      ecs: file.mtime
      status: mapped
    - vendor: ThreatSourceURL
      type: string
      description: URL the threat originated from, on web-borne detections
      ecs: url.full
      status: partial
      notes: populated only for web/download vectors; empty on file-system detections
    - vendor: ThreatSourceIPv4
      type: ip
      description: IPv4 address the threat originated from
      ecs: source.ip
      status: partial
      transform: >-
        stored in the DB as a signed 32-bit integer offset by 2^31; convert to
        a dotted quad before writing source.ip
    - vendor: ThreatSourceHostName
      type: string
      description: hostname the threat originated from
      ecs: source.domain
      status: partial
      notes: commonly empty for local file-system detections
    - vendor: ThreatSourceMAC
      type: string
      description: MAC address of the source of the threat
      ecs: source.mac
      status: mapped
    - vendor: SourcePort
      type: port
      description: source port on network-borne detections
      ecs: source.port
      status: mapped
    - vendor: ThreatSourceProcessName
      type: string
      description: full path of the process that triggered the detection
      ecs: process.executable
      status: mapped
    - vendor: ThreatSourceUserName
      type: string
      description: account the source process was running as
      ecs: source.user.name
      status: mapped
    - vendor: IPv4
      type: ip
      description: IPv4 address of the affected endpoint (the detection target)
      ecs: host.ip
      status: partial
      transform: >
        stored as a signed 32-bit integer offset by 2^31; convert to a dotted
        quad. For endpoint detections the target IS the managed host, so it
        maps to host.ip not destination.ip - ArcSight-era content keyed on
        destinationAddress needs reverting when ported
    - vendor: HostName
      type: string
      description: hostname of the affected endpoint
      ecs: host.name
      status: mapped
    - vendor: MAC
      type: string
      description: MAC address of the affected endpoint
      ecs: host.mac
      status: mapped
    - vendor: UserName
      type: string
      description: account associated with the affected file or process
      ecs: user.name
      status: partial
      transform: >-
        arrives as DOMAIN\\user and must be split into user.domain plus
        user.name; unqualified local accounts appear without a domain
    - vendor: NetworkProtocol
      type: string
      description: transport protocol on network-borne detections
      ecs: network.transport
      status: partial
      transform: emitted upper-case; lower-case it before writing network.transport
  - format: api-pull
    enable: >
      The ePO Web API exposes the same events over an authenticated HTTPS
      remote command instead of a direct database connection. POST or GET the
      core.executeQuery command against the ePO console port, e.g.
      https://<epo-server>:8443/remote/core.executeQuery, with an ePO user
      that holds query permission (HTTP Basic auth over TLS), passing
      target=EPOEvents, a select clause enumerating the EPOEvents columns
      (select=(select EPOEvents.AutoID EPOEvents.DetectedUTC
      EPOEvents.ThreatName EPOEvents.ThreatCategory EPOEvents.ThreatSeverity
      EPOEvents.ThreatActionTaken ...)), a where clause bounding the window
      (where=(where (newerThan EPOEvents.DetectedUTC 3600000))) and
      &:output=json to get a JSON result set (xml, terse and verbose are the
      other output modes). Page on AutoID or DetectedUTC to avoid re-reading
      rows. This needs no SQL login or direct DB network path - only the ePO
      console's HTTPS port - which is why it is the transport of choice when
      the collector cannot reach SQL Server directly.
    references:
    - >-
      https://communitym.trellix.com/t5/ePolicy-Orchestrator-ePO/ePO-API-Scripting-Guide/td-p/424176
    - >-
      https://community.mcafee.com/t5/ePolicy-Orchestrator-ePO/ePolicy-Orchestrator-web-API-JSON/m-p/693323
    - https://kcm.trellix.com/corporate/index?page=content&id=KB81322
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        Cribl REST Collector against core.executeQuery plus the shared
        EPOEvents normalization pipeline
      notes: >
        A REST Collector polls core.executeQuery and a pipeline unwraps the
        JSON result array into one NDJSON row per record. The returned
        properties are the EPOEvents query-table columns
        (EPOEvents.ThreatName, EPOEvents.ThreatCategory, ...), the same
        vocabulary the direct dbo.EPOEvents read exposes, so once unwrapped
        the rows feed the identical normalization branch as the jdbc-sql path
        - the same severity inversion, DOMAIN\\user split and event-name
        lookup apply. The trade against the direct DB read is throughput and
        query cost: the API is a point-in-time query bounded by the ePO
        server's own load, so it suits gap-fill and lower-volume estates
        rather than a firehose. The one shape difference is that the Web API
        returns the IPv4 columns already rendered as dotted quads, so the
        signed-integer conversion the DB view needs does not apply here.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Run the REST Collector low-side against the ePO console's HTTPS
          port, checkpoint on the maximum DetectedUTC (or AutoID) seen, and
          unwrap the JSON results array into one NDJSON line per row with a
          fixed EPOEvents _dataId so the high side selects the threat branch.
          Push the window and column projection into the select/where clause
          because the API bills the ePO server's CPU, unlike the DB read where
          filtering is a SQL predicate. From there apply the same
          normalizations as the direct-read path - severity inversion, action
          lookup, DOMAIN\\user split, @timestamp off DetectedUTC - then
          Schema-Library validate with a dead-letter route and run the Elastic
          and guard destinations on Persistent Queue backpressure.
        elastic: >
          Feed the same custom logs-trellix_epo.threat pipeline and template
          the jdbc-sql path uses; the documents are identical once the
          collector has unwrapped the result set, so the ThreatName mapping
          decision, the closed-vocabulary event.category assertion and the
          MD5-only hash-profile gap all apply unchanged. Record which
          collection transport produced a given document in the pipeline so an
          operator can tell the API-pull feed from a DB-read or CEF feed when
          reconciling counts.
        relay: >
          NDJSON crosses, never a database session or an HTTPS query -
          core.executeQuery is polled low-side and only the emitted documents
          reach the guard. The content-filter friction is the same free text
          as the DB path (ThreatName, long file paths, DOMAIN\\user,
          Description), so cap and UTF-8-normalize those low-side and keep the
          document shallow with short ASCII allowlisted keys. Treat the
          crossing as at-most-once; because the poller keeps its DetectedUTC
          high-water mark low-side, per (dataset, hour) count reconciliation
          is the only drop detector and the high side can never ask for a
          window to be re-queried.
      direct:
        parse_location: low
        cribl: >
          For a high-side ePO reachable without the guard, the REST Collector
          and unwrap are identical without the capping and dead-letter
          discipline. The governing decision is query scheduling against the
          ePO server's load: stagger and scope the queries so a backfill does
          not starve the console, and dedupe against any CEF or DB-read feed
          from the same ePO by keying on ThreatEventID with DetectedUTC and
          the target host.
        elastic: >
          Feed the same custom logs-trellix_epo.threat pipeline and template
          the jdbc-sql path uses; the documents are identical once the
          collector has unwrapped the result set, so the ThreatName mapping
          decision, the closed-vocabulary event.category assertion and the
          MD5-only hash-profile gap all apply. With no boundary, widen the
          select clause to carry the DB-only detail columns (attack-vector
          type, action statuses, file times) for hunting, and treat this
          transport as the credential-light alternative to a direct SQL login
          where security policy forbids opening a database path to the
          collector.
    fields:
    - vendor: EPOEvents.AutoID
      type: long
      description: >-
        monotonically increasing unique id of the event row, used as the query
        high-water mark
      ecs: event.id
      status: mapped
    - vendor: EPOEvents.DetectedUTC
      type: timestamp
      description: UTC time the managed product detected the threat on the endpoint
      ecs: '@timestamp'
      status: mapped
      transform: >-
        returned as an ISO UTC string by the JSON output; key @timestamp off
        it rather than poll time
    - vendor: EPOEvents.ReceivedUTC
      type: timestamp
      description: UTC time the ePO server received the event from the agent
      ecs: event.created
      status: partial
      notes: server receipt time, kept so agent-to-server upload lag stays visible
    - vendor: EPOEvents.ThreatEventID
      type: integer
      description: numeric ePO event id identifying the detection type
      ecs: event.code
      status: mapped
    - vendor: EPOEvents.ThreatName
      type: string
      description: detection name assigned by the scanning engine
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.name
      notes: >
        same no-ECS-home detection verdict as on the other transports; settled
        to the vendor namespace per the repository's mapping convention, never
        rule.name
    - vendor: EPOEvents.ThreatType
      type: string
      description: coarse classification of the detection
      ecs: null
      status: unmapped
      custom: trellix.epo.threat.type
    - vendor: EPOEvents.ThreatCategory
      type: string
      description: >-
        ePO threat taxonomy bucket that discriminates AV, access-protection
        and HIPS rows
      ecs: null
      status: partial
      custom: trellix.epo.threat.category
      notes: >-
        drives route/event.category selection but cannot be written to the
        closed event.category vocabulary
    - vendor: EPOEvents.ThreatSeverity
      type: integer
      description: ePO severity of the detection, 0-7
      ecs: event.severity
      status: partial
      transform: inverted 0-7 scale; a lookup must invert and rescale before threshold alerting
    - vendor: EPOEvents.ThreatActionTaken
      type: string
      description: >-
        response the product took, emitted as a localization key such as
        IDS_ALERT_ACT_TAK_DEL
      ecs: event.action
      status: partial
      transform: >-
        IDS_ALERT_ACT_TAK_* resource keys, not English; a lookup table is
        required before event.action is readable
    - vendor: EPOEvents.ThreatHandled
      type: boolean
      description: whether the managed product successfully remediated the threat
      ecs: event.outcome
      status: mapped
      transform: boolean true/false translated to success/failure
    - vendor: EPOEvents.AnalyzerName
      type: string
      description: name of the managed product that made the detection
      ecs: observer.product
      status: mapped
    - vendor: EPOEvents.AnalyzerDetectionMethod
      type: string
      description: how the threat was found (On-Access Scan, Real Protect, Exploit Prevention, ...)
      ecs: null
      status: unmapped
      custom: trellix.epo.analyzer.detection_method
    - vendor: EPOEvents.AnalyzerDATVersion
      type: string
      description: signature (DAT) content version loaded at detection time
      ecs: null
      status: unmapped
      custom: trellix.epo.analyzer.dat_version
    - vendor: EPOEvents.SourceIPV4
      type: ip
      description: IPv4 address the threat originated from
      ecs: source.ip
      status: partial
      notes: >-
        the JSON output renders this as a dotted quad, so the signed-integer
        conversion the direct DB read needs does not apply here
    - vendor: EPOEvents.SourceProcessName
      type: string
      description: full path of the process that triggered the detection
      ecs: process.executable
      status: mapped
    - vendor: EPOEvents.SourceUserName
      type: string
      description: account the source process was running as
      ecs: source.user.name
      status: mapped
    - vendor: EPOEvents.TargetHostName
      type: string
      description: hostname of the endpoint the threat was found on
      ecs: host.name
      status: mapped
    - vendor: EPOEvents.TargetIPV4
      type: ip
      description: IPv4 address of the affected endpoint
      ecs: host.ip
      status: partial
      notes: the target is the managed host, so it maps to host.ip not destination.ip
    - vendor: EPOEvents.TargetUserName
      type: string
      description: account associated with the affected file or process
      ecs: user.name
      status: partial
      transform: arrives as DOMAIN\\user and must be split into user.domain plus user.name
    - vendor: EPOEvents.TargetFileName
      type: string
      description: full path of the file the detection fired on
      ecs: file.path
      status: mapped
    - vendor: EPOEvents.TargetHash
      type: string
      description: MD5 hash of the detected file
      ecs: file.hash.md5
      status: mapped
      notes: >-
        MD5 only, as on the other transports; the malware alerting profile
        needs a downstream sha256 enrichment
- id: hips-intrusion
  name: Host IPS intrusion event
  description: >
    Host Intrusion Prevention signature and firewall events (HIPS 8.0 and the
    ENS Firewall/Exploit Prevention successors) rolled up to ePO -
    buffer-overflow, illegal API use, service/registry protection, and
    blocked-connection records.
  event_categories:
  - network
  - process
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same registered-syslog CEF stream as the threat dataset, split out in
        the pipeline on ThreatCategory.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-trellix_epo.hips
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Same registered-syslog CEF stream as the threat dataset, split out in
        the pipeline on ThreatCategory.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-trellix_epo.hips
  formats:
  - format: syslog-cef
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Trellix ePO CEF pipeline
      notes: >-
        HIPS records reuse the threat-event envelope and add
        signature/connection extension keys, so they are branched off the same
        pipeline rather than given a separate source
    fields:
    - vendor: SignatureID
      type: integer
      description: numeric id of the Host IPS signature that fired
      ecs: rule.id
      status: mapped
    - vendor: SignatureName
      type: string
      description: human-readable name of the Host IPS signature
      ecs: rule.name
      status: mapped
    - vendor: SigRuleClass
      type: string
      description: >-
        signature rule class (Buffer Overflow, Files, Registry, Services,
        HTTP, Program, ...)
      ecs: rule.category
      status: mapped
    - vendor: ThreatEventID
      type: integer
      description: numeric ePO event id for the intrusion record
      ecs: event.code
      status: mapped
    - vendor: EventPolicyType
      type: integer
      description: >-
        numeric code for which HIPS policy family raised the event (IPS,
        firewall, application blocking)
      ecs: null
      status: unmapped
      custom: trellix.epo.hips.policy_type
    - vendor: ThreatSeverity
      type: integer
      description: severity of the intrusion event, 0-7
      ecs: event.severity
      status: partial
      transform: >-
        same inverted 0-7 ePO scale as the threat dataset; needs the same
        lookup before threshold alerting
    - vendor: ThreatAction
      type: enum
      description: what HIPS did with the matching activity (Blocked, Permitted, Block)
      ecs: event.action
      status: mapped
      transform: >
        the vendor value is copied to event.action verbatim and also drives
        event.outcome - Blocked/Block become success (the control worked),
        Permitted becomes success with a log-only reaction; there is no
        separate outcome column
    - vendor: Direction
      type: enum
      description: direction of the connection or activity relative to the protected host
      ecs: network.direction
      status: partial
      transform: >-
        vendor inbound/outbound values must be normalized to ECS's
        ingress/egress vocabulary
    - vendor: LocalIPAddress
      type: ip
      description: address of the protected endpoint on the intercepted connection
      ecs: host.ip
      status: mapped
    - vendor: LocalPort
      type: port
      description: port on the protected endpoint side of the intercepted connection
      ecs: source.port
      status: partial
      notes: >
        the ArcSight-era mapping treated the local endpoint as the source
        regardless of Direction; for inbound intrusions this is really the
        destination port, so Direction has to be consulted before the
        source/destination pair is trustworthy for network alerting
    - vendor: RemotePort
      type: port
      description: port on the peer side of the intercepted connection
      ecs: destination.port
      status: partial
      notes: same Direction-dependent inversion as LocalPort
    - vendor: NetworkProtocol
      type: string
      description: transport protocol of the intercepted connection (TCP, UDP, ICMP)
      ecs: network.transport
      status: partial
      transform: >-
        emitted upper-case and occasionally as a numeric IANA value;
        lower-case it and resolve numerics before writing network.transport
    - vendor: ThreatSourceIPv4
      type: ip
      description: IPv4 address of the remote peer that triggered the signature
      ecs: source.ip
      status: mapped
    - vendor: ThreatSourceHostName
      type: string
      description: hostname of the remote peer that triggered the signature
      ecs: source.domain
      status: partial
      notes: >-
        only resolved when HIPS has a name for the peer; commonly empty on raw
        network signatures
    - vendor: ProcessName
      type: string
      description: full path of the local process whose activity matched the signature
      ecs: process.executable
      status: mapped
    - vendor: AppHash
      type: string
      description: hash of the application binary HIPS blocked or observed
      ecs: null
      status: partial
      custom: trellix.epo.hips.app_hash
      notes: >-
        the algorithm is not declared in the record (MD5 on HIPS 8.0,
        SHA-1/SHA-256 on newer ENS builds), so it cannot be written into a
        typed file.hash.* field without probing the digest length
    - vendor: AppSigner
      type: string
      description: code-signing subject of the application involved in the event
      ecs: process.code_signature.subject_name
      status: mapped
    - vendor: EventUserName
      type: string
      description: account under which the intercepted activity occurred
      ecs: user.name
      status: mapped
    - vendor: DetectingProductName
      type: string
      description: name of the reporting HIPS/ENS product
      ecs: observer.product
      status: mapped
    - vendor: DetectingProductHostName
      type: string
      description: hostname of the endpoint running the detecting product
      ecs: observer.hostname
      status: mapped
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Reuse the threat CEF header parser but give the intrusion branch its
          own extension stage for the signature and connection keys, and emit
          full ECS-shaped JSON with the same inverted 0-7 severity lookup
          applied. The network normalizations belong here, not downstream:
          consult Direction before assigning the source/destination pair, so
          an inbound intrusion puts LocalPort in destination.port instead of
          inheriting the ArcSight-era assumption that the protected host is
          always the source, map inbound/outbound to the ECS ingress/egress
          vocabulary, lower-case NetworkProtocol and resolve numeric IANA
          values, and derive event.outcome from ThreatAction while retaining
          the raw verb (Blocked/Block is the control working, Permitted is
          log-only). Probe the AppHash digest length to decide whether it can
          be typed, Schema-Library validate with a dead-letter route before
          the destination, use Persistent Queue rather than Block, and keep
          _raw — IDS-class records are forensically valuable.
        elastic: >
          No integration covers on-prem ePO, so logs-trellix_epo.hips needs
          its own custom ingest pipeline and index template that accepts
          pre-shaped documents, with custom-namespace keyword mappings for
          trellix.epo.hips.policy_type and trellix.epo.hips.app_hash. Assert
          at the template level that network.direction only ever holds
          ingress/egress and that the source/destination port pair arrives
          already Direction-corrected, since silently accepting the legacy
          orientation is what will make ported ArcSight network content match
          backwards. Leave AppHash in the vendor namespace unless the low-side
          digest-length probe is in place — writing an undeclared algorithm
          into a typed file.hash.* field is worse than not mapping it — and
          confirm rule.name/rule.category carry the signature name and rule
          class before detection rules key on them.
        relay: >
          Same crossing shape as the threat dataset — CEF is parsed low-side
          and only full ECS JSON reaches the guard — and because both streams
          arrive on one syslog source they must be split before the guard
          destination so each dataset can be counted and reconciled on its
          own. Signature names, full process paths and code-signing subject
          strings are the unbounded free-text fields a content filter will
          reject or truncate, so cap them and keep the document shallow with
          short ASCII allowlisted keys. Persistent Queue backpressure and per
          (dataset, hour) count reconciliation stand in for the
          acknowledgements the one-way path cannot provide.
      direct:
        parse_location: low
        cribl: >
          Reuse the threat CEF header parser but give the intrusion branch its
          own extension stage for the signature and connection keys, and emit
          full ECS-shaped JSON with the same inverted 0-7 severity lookup
          applied. The network normalizations belong here, not downstream:
          consult Direction before assigning the source/destination pair, so
          an inbound intrusion puts LocalPort in destination.port instead of
          inheriting the ArcSight-era assumption that the protected host is
          always the source, map inbound/outbound to the ECS ingress/egress
          vocabulary, lower-case NetworkProtocol and resolve numeric IANA
          values, and derive event.outcome from ThreatAction while retaining
          the raw verb (Blocked/Block is the control working, Permitted is
          log-only). Probe the AppHash digest length to decide whether it can
          be typed, Schema-Library validate with a dead-letter route before
          the destination, use Persistent Queue rather than Block, and keep
          _raw — IDS-class records are forensically valuable.
        elastic: >
          No integration covers on-prem ePO, so logs-trellix_epo.hips needs
          its own custom ingest pipeline and index template that accepts
          pre-shaped documents, with custom-namespace keyword mappings for
          trellix.epo.hips.policy_type and trellix.epo.hips.app_hash. Assert
          at the template level that network.direction only ever holds
          ingress/egress and that the source/destination port pair arrives
          already Direction-corrected, since silently accepting the legacy
          orientation is what will make ported ArcSight network content match
          backwards. Leave AppHash in the vendor namespace unless the
          parse-time digest-length probe is in place — writing an undeclared
          algorithm into a typed file.hash.* field is worse than not mapping
          it — and confirm rule.name/rule.category carry the signature name
          and rule class before detection rules key on them.
  - format: jdbc-sql
    enable: >
      Read dbo.EPOEvents joined to the Host IPS extension view from the ePO
      SQL Server with a read-only SQL login, exactly as for the threat feed,
      and select the intrusion rows by ThreatCategory (hip.sig and the
      firewall/application-blocking categories). There is no separate console
      step - the HIPS module writes into the same event view - so the same
      Database Collector and AutoID high-water mark serve both datasets;
      branch on ThreatCategory in the collector query so intrusion records
      leave on this route.
    references:
    - >-
      https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors/pdfdoc/mcafee-epo/mcafee-epo.pdf
    - https://docs.nxlog.co/integrate/trellix-epo.html
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        Cribl Database Collector against dbo.EPOEvents (HIPS extension) plus
        the shared normalization pipeline
      notes: >
        HIPS rows reuse the threat-event envelope and add signature and
        connection columns, so they branch off the same collector and pipeline
        rather than getting a separate source. The same DB-native conversions
