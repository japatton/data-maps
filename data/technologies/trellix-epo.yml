        severity - plus the network-orientation work the CEF path also needs:
        Direction must be consulted before the source/destination port pair is
        trustworthy, and NetworkProtocol must be lower-cased and numeric IANA
        values resolved.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
