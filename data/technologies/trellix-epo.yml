    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Run the Database Collector against dbo.OrionAuditLog on the low side
          next to the ePO SQL Server, keyed on the AutoID high-water mark, and
          emit full ECS-shaped JSON — the rows arrive already structured, so
          the work is normalization rather than parsing. Do three fixes here:
          collapse the three shapes Success is emitted in (1/0, "Success",
          "Failed") into a single event.outcome, invert the 1-8 Priority scale
          through a lookup instead of copying it into event.severity, and
          bound or mask DetailMessage, which carries failure reasons and
          policy payloads that can include credentials. Validate against a
          Schema Library schema with a dead-letter route before the
          destination and use Persistent Queue backpressure; _raw adds little
          here beyond a duplicate of the already-structured row, so drop it
          once the collector's column mapping is proven.
        elastic: >
          Build a custom ingest pipeline and index template for
          logs-trellix_epo.audit — the trellix_epo_cloud integration does not
          cover on-prem — with a keyword mapping for trellix.epo.tenant_id,
          which is the join key when several ePO instances are merged even
          though it is constant in single-tenant deployments. Assert the admin
          session orientation the map chose: RemoteAddress in source.ip and
          LocalAddress in destination.ip, the reverse of the ArcSight DB
          connector, so ported content keyed on destinationAddress is caught
          rather than quietly matching the wrong host. Keep @timestamp on
          StartTime with EndTime in event.end so action duration stays
          derivable, and note in the template that event.url points at a
          low-side ePO console URI that a high-side analyst cannot follow.
        relay: >
          This is the dataset that cannot cross as-is: a scheduled SQL poller
          is a poor fit for a one-way relay, so the collector and its AutoID
          high-water mark must live low-side, with the crossing carrying
          emitted NDJSON rather than any database connection. Prefer the
          Filesystem → Automated Secure Transfer drop-box → Filesystem
          collector variant for this feed, since a batch-shaped source is the
          one with a real replay story under an at-most-once crossing, and
          remember the high side can never tell the poller to re-read a
          window. DetailMessage is the content-filter risk — unbounded free
          text, sometimes kilobyte policy detail — so cap it low-side and
          reconcile row counts per (dataset, hour) to detect silent drops.
