datasets:
- id: cdr
  name: Call detail records (CDR)
  description: >
    One end-of-call record per call leg, written by the CallManager service
    and delivered as comma-separated flat files: the CDR Repository Manager
    pushes completed files over SFTP (FTP where still configured) to up to
    three billing/collection servers on a fixed interval. This is a file drop,
    not a syslog stream, and the file layout is unusual - line 1 is the quoted
    field-name header, line 2 is the field-type header (INTEGER, VARCHAR(50),
    ...), and only line 3 onward is data, so a naive CSV reader ingests two
    junk records per file. Records carry 100+ columns, most empty for a normal
    phone-to-phone call. Security value here is toll fraud, after-hours and
    long-duration calling patterns, unexpected external redirection, and
    media-encryption downgrades - not the billing use case the feed was built
    for. Columns present but not yet mapped below include authCodeDescription
    and authorizationLevel (Forced Authorization Codes), clientMatterCode, the
    huntPilot* columns, and the free-text comment column. The companion
    CMR/diagnostic records (jitter, latency, pktsLost) arrive in the same
    repository as separate files and are out of scope for this dataset.
  event_categories:
  - network
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Collected as files, not syslog: CUCM's CDR Repository Manager SFTPs
        finished CDR files to a collection host, and a Cribl Filesystem or
        SFTP-backed collector picks them up on the edge worker group. There is
        no push-to-Cribl option on the CUCM side, so the collector's schedule
        and the repository's delete-after-push behaviour together define the
        retry window. The collection host and collector sit in the voice
        enclave and push across the guard.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_cucm.cdr
    direct:
    - hop: cribl
      location: edge Cribl worker group
      notes: >
        Collected as files, not syslog: CUCM's CDR Repository Manager SFTPs
        finished CDR files to a collection host, and a Cribl Filesystem or
        SFTP-backed collector picks them up on the edge worker group. There is
        no push-to-Cribl option on the CUCM side, so the collector's schedule
        and the repository's delete-after-push behaviour together define the
        retry window.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_cucm.cdr
  formats:
  - format: other
    parsing:
      mechanism: cribl-pipeline
      artifact: custom CUCM CDR pipeline
      notes: >
        No Elastic integration and no Cribl pack covers CUCM. The public prior
        art is billing-oriented (CAR, third-party billing collectors) or
        hand-rolled Logstash configs, none of which produce ECS, so the
        pipeline is hand-built: skip the two header lines, position-or-name
        map the columns, and convert the epoch, integer-IP and Q.850 values
        before anything is ECS-shaped.
    fields:
    - vendor: cdrRecordType
      type: integer
      description: identifies the record as a CDR end-of-call record or a CMR diagnostic record
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.record_type
      notes: >
        1 marks a CDR end-of-call record and 2 a CMR (diagnostic/quality)
        record; the value also appears in the file's field-type header line,
        so the parser must skip lines 1 and 2 before branching on it
    - vendor: globalCallID_callId
      type: integer
      description: call identifier assigned by the CallManager node, unique within that node
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.global_call_id
      notes: >
        only unique in combination with globalCallID_callManagerId and
        globalCallId_ClusterID - the three columns together form the
        cluster-wide call key, and a bare callId collides across nodes. ECS
        has no telephony call-identifier field
    - vendor: origLegCallIdentifier
      type: integer
      description: identifier of the originating call leg, unique within the cluster
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.orig_leg_call_identifier
      notes: >
        stays constant while the leg persists across subcalls, so it is the
        key that stitches the multiple CDRs a transfer or conference produces
        back into one call; destLegIdentifier is its terminating-side
        counterpart
    - vendor: dateTimeOrigination
      type: integer
      description: time the calling party went off-hook or the call was otherwise originated
      ecs: '@timestamp'
      status: mapped
      transform: >
        UTC epoch seconds as a decimal integer; multiply to milliseconds and
        render as UTC. Prefer this over collection time - CDR files are pushed
        on an interval, so arrival can trail the call by many minutes
    - vendor: dateTimeConnect
      type: integer
      description: time the call was actually connected (answer supervision)
      ecs: event.start
      status: partial
      notes: >
        UTC epoch seconds, but 0 is the sentinel for a call that was never
        answered; converting blindly yields a 1970 timestamp on every
        unanswered call, so the sentinel must become null
    - vendor: dateTimeDisconnect
      type: integer
      description: time the call was torn down, regardless of whether it ever connected
      ecs: event.end
      status: mapped
      transform: >-
        UTC epoch seconds to UTC; unlike dateTimeConnect this is populated
        even for unanswered calls
    - vendor: duration
      type: integer
      description: number of seconds the call was connected
      ecs: event.duration
      status: partial
      transform: >
        vendor value is whole seconds; ECS event.duration is nanoseconds, so
        multiply by 1e9. A 0 here means the call never connected rather than a
        zero-length call, and should not be conflated with a short call
    - vendor: callingPartyNumber
      type: string
      description: directory number of the device that originated the call
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.calling_party_number
      notes: >
        ECS has no telephony directory-number field and a DN identifies a line
        rather than a person, so this is kept custom instead of being forced
        onto source.user.*; it is nonetheless the primary correlation key for
        this dataset and PII-adjacent
    - vendor: callingPartyUnicodeLoginUserID
      type: string
      description: CUCM end user ID logged in to the originating device
      ecs: source.user.name
      status: partial
      notes: >
        the only column that ties a call to an account, but it is populated
        only where Extension Mobility or a device/user association exists -
        empty on most shared and common-area phones, so alerting must not
        assume it
    - vendor: originalCalledPartyNumber
      type: string
      description: directory number the calling party originally dialed, before any redirection
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.original_called_party_number
      notes: >-
        same no-ECS-home reasoning as callingPartyNumber; differs from
        finalCalledPartyNumber whenever forwarding or a hunt pilot intervened
    - vendor: finalCalledPartyNumber
      type: string
      description: directory number the call actually terminated on after all redirection
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.final_called_party_number
      notes: >
        the toll-fraud field: an internal original-called number that resolves
        to an external final-called number is the classic call-forward-out
        abuse pattern
    - vendor: finalCalledPartyUnicodeLoginUserID
      type: string
      description: CUCM end user ID associated with the device that answered
      ecs: destination.user.name
      status: partial
      notes: >-
        same population caveat as the calling-side login user ID; blank on
        gateways, voicemail ports and unassociated devices
    - vendor: lastRedirectDn
      type: string
      description: directory number of the last device to redirect the call
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.last_redirect_dn
      notes: >-
        identifies which extension forwarded the call, which is what turns a
        suspicious final-called number into an attributable configuration
        change
    - vendor: origDeviceName
      type: string
      description: CUCM device name of the endpoint or gateway that originated the call
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.orig_device_name
      notes: >
        SEP-prefixed phone names embed the endpoint MAC (SEP<MAC>) and can be
        transformed into source.mac low-side; trunk and gateway names follow
        no such convention, so the derivation must be conditional. ECS has no
        source-side device-identity field to map the raw name onto
    - vendor: destDeviceName
      type: string
      description: CUCM device name of the endpoint or gateway that terminated the call
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.dest_device_name
      notes: >-
        same SEP<MAC> convention as origDeviceName; a gateway or trunk name
        here is what distinguishes an off-net call from an internal one
    - vendor: origIpAddr
      type: integer
      description: IPv4 address of the originating device, in the legacy integer encoding
      ecs: source.ip
      status: partial
      transform: >
        stored as a signed 32-bit integer holding the address in reverse byte
        order, so negative values are normal and must be read as two's
        complement before the octets are reversed. Where the release emits
        origIpv4v6Addr, prefer that string column - it carries IPv6 as well
        and needs no decoding
    - vendor: destIpv4v6Addr
      type: string
      description: IP address of the terminating device in string form, IPv4 or IPv6
      ecs: destination.ip
      status: mapped
      notes: >-
        added alongside the legacy integer destIpAddr column, which carries
        the same reverse-byte-order signed-integer encoding as origIpAddr
    - vendor: origCause_value
      type: integer
      description: cause code recorded when the originating party cleared the call
      ecs: event.reason
      status: partial
      transform: >
        numeric ITU Q.850 cause code (16 is normal clearing) that needs a
        lookup table to become a readable reason string; the same lookup is
        the only source for event.outcome on this dataset, since no CDR column
        carries a success/failure value
    - vendor: destCause_value
      type: integer
      description: cause code recorded when the terminating party cleared or rejected the call
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.dest_cause_value
      notes: >
        the two cause columns are populated according to which side cleared,
        so outcome derivation has to consider the pair rather than either
        column alone; kept custom because event.reason is already occupied by
        the originating-side cause
    - vendor: callSecuredStatus
      type: integer
      description: media security status the call reached
      ecs: null
      status: unmapped
      custom: cisco.cucm.cdr.call_secured_status
      notes: >
        documented as 0 for a non-secure call, 1 for authenticated and 2 for
        encrypted; a call between two devices in an encrypted security profile
        that lands at 0 is the media-downgrade signal, and ECS models no
        equivalent
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Do the whole conversion on the edge worker group, because almost
          every column needs decoding before it means anything: drop the two
          header lines, split CDR from CMR records on cdrRecordType, convert
          the dateTime* columns from epoch seconds to UTC while mapping the
          sentinel 0 to null rather than 1970, decode the legacy integer IP
          columns (signed 32-bit, reverse byte order) or prefer the
          origIpv4v6Addr/destIpv4v6Addr string columns where the release emits
          them, and derive event.outcome from the
          origCause_value/destCause_value pair through a Q.850 lookup since no
          vendor column carries an outcome. Normalize directory numbers to a
          single dialing convention here, where the site's translation
          patterns are known, prune the ~100 columns that are empty on a
          normal call, and deduplicate on (globalCallId_ClusterID,
          globalCallID_callManagerId, globalCallID_callId,
          origLegCallIdentifier) because a re-pushed or re-collected file
          replays whole records. Gate the destination with
          C.Schema(...).validate plus a dead-letter route, and run it on
          Persistent Queue backpressure, never Block.
        elastic: >
          Own a custom logs-cisco_cucm.cdr ingest pipeline - there is no stock
          integration to override - and keep it to what the low side cannot
          finish: asserting event.duration arrived in nanoseconds rather than
          the vendor's seconds, populating related.user from the two Unicode
          login user IDs so a call is joinable to an account, and setting
          event.kind and event.category consistently for a session-style
          record. Declare explicit custom-namespace index-template mappings
          for the directory number fields
          (cisco.cucm.cdr.calling_party_number, .original_called_party_number,
          .final_called_party_number, .last_redirect_dn) and the device names
          as keyword, and for .global_call_id, .orig_leg_call_identifier,
          .dest_cause_value and .call_secured_status as long, so toll-fraud
          and encryption-downgrade queries do not depend on dynamic mapping.
        relay: >
          Low-side instances cross the guard: full ECS-shaped NDJSON crosses
          (envelope mode B) - one call record per line, UTF-8, LF-terminated,
          compression disabled, nesting depth at most two - because the
          decoding above has to happen next to the collector and a thin
          envelope would push a two-header CSV grammar at the guard's content
          filter. Nothing CEF-shaped crosses: this feed is a file drop today,
          not a syslog or ArcSight stream. The filter friction to settle with
          the guard owner is the free-text comment column and the directory
          numbers themselves, which are PII-adjacent and should be
          length-capped and allow-listed low-side rather than assumed
          inspectable. The file-drop origin gives an unusually good replay
          story for an at-most-once crossing - keep the source files on the
          low side for a retention window and reconcile low-side and high-side
          record counts per (dataset, hour) to detect silent drops.
      direct:
        parse_location: low
        cribl: >
          Do the whole conversion on the edge worker group, because almost
          every column needs decoding before it means anything: drop the two
          header lines, split CDR from CMR records on cdrRecordType, convert
          the dateTime* columns from epoch seconds to UTC while mapping the
          sentinel 0 to null rather than 1970, decode the legacy integer IP
          columns (signed 32-bit, reverse byte order) or prefer the
          origIpv4v6Addr/destIpv4v6Addr string columns where the release emits
          them, and derive event.outcome from the
          origCause_value/destCause_value pair through a Q.850 lookup since no
          vendor column carries an outcome. Normalize directory numbers to a
          single dialing convention here, where the site's translation
          patterns are known, prune the ~100 columns that are empty on a
          normal call, and deduplicate on (globalCallId_ClusterID,
          globalCallID_callManagerId, globalCallID_callId,
          origLegCallIdentifier) because a re-pushed or re-collected file
          replays whole records. Gate the destination with
          C.Schema(...).validate plus a dead-letter route, and run it on
          Persistent Queue backpressure, never Block.
        elastic: >
          Own a custom logs-cisco_cucm.cdr ingest pipeline - there is no stock
          integration to override - and keep it to what the edge Cribl parse
          does not finish: asserting event.duration arrived in nanoseconds
          rather than the vendor's seconds, populating related.user from the
          two Unicode login user IDs so a call is joinable to an account, and
          setting event.kind and event.category consistently for a
          session-style record. Declare explicit custom-namespace
          index-template mappings for the directory number fields
          (cisco.cucm.cdr.calling_party_number, .original_called_party_number,
          .final_called_party_number, .last_redirect_dn) and the device names
          as keyword, and for .global_call_id, .orig_leg_call_identifier,
          .dest_cause_value and .call_secured_status as long, so toll-fraud
          and encryption-downgrade queries do not depend on dynamic mapping.
  - format: api-pull
    enable: >
      Besides the CDR Repository Manager's scheduled SFTP push, CUCM exposes
      the same completed CDR (and companion CMR) files through the CDRonDemand
      SOAP/HTTPS service, so a collector can request them on its own schedule
      instead of being a passive SFTP destination. The service is not enabled
      by default on Release 12.x and later: activate "Cisco SOAP - CDRonDemand
      Service" under Cisco Unified Serviceability > Tools > Service Activation
      on the CDR Repository (publisher) node. The WSDL is served at
      https://<server>/CDRonDemandService2/services/CDRonDemandService?wsdl
      and requests authenticate as a CUCM application user over HTTP Basic. It
      is a two-call flow: get_file_list returns the CDR/CMR filenames for a
      requested time interval (the interval may not exceed one hour and a
      response is capped at 1300 filenames, so a day's collection is many
      paged calls), then get_file asks the node to deliver one named file -
      crucially, delivery is still over SFTP or FTP to a destination host,
      username, password and directory the caller supplies in the request. The
      API therefore replaces the push-target model with a pull-driven
      discovery step; the bytes that land are the identical CDR flat file
      (quoted field-name header line, field-type header line, then records),
      not a new schema.
    references:
    - https://developer.cisco.com/docs/sxml/cdrondemand-api/
    - https://developer.cisco.com/site/sxml/learn/getting-started/cdr-on-demand/
    - >-
      https://www.cisco.com/c/en/us/td/docs/voice_ip_comm/cucm/service/12_5_1/cdrdef/cucm_b_cdr-admin-guide-1251/cucm_b_cdr-admin-guide-1251_chapter_01.html
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        same custom CUCM CDR pipeline, fronted by a scheduled SOAP discovery
        step (Cribl script/webhook collector calling get_file_list) plus the
        SFTP-backed file collector get_file delivers into
      notes: >
        No Elastic integration and no Cribl pack covers CUCM by either
        transport, so the handler is the hand-built CDR pipeline with a
        different front door. The record payload is byte-identical to the
        SFTP-push flat file - same two junk header lines to skip, same 100+
        columns, same epoch / integer-IP / Q.850 decoding - so no new field
        inventory is emitted and the fields list below is intentionally empty
        rather than a re-listing of the CDR columns. What changes is
        orchestration: a get_file_list poll bounded to <=1 hour windows and
        <=1300 filenames per response, paged forward, with the actual file
        still arriving over SFTP to a caller-named directory the file
        collector then reads.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          For low-side instances, treat CDRonDemand as an alternative
          collection front-end to the CDR pipeline, not a reason to move
          parsing: the two header lines, dateTime* epoch-to-UTC conversion
          with the sentinel-0-to-null rule, the reverse-byte-order integer-IP
          decode, the Q.850 outcome derivation and the four-part deduplication
          key all still belong on the edge worker group. The collection change
          is a scheduled SOAP job that walks get_file_list in <=1-hour windows
          and reconciles the returned filename set against what get_file has
          already delivered, so a paging gap or a >1300-file hour is detected
          rather than silently short. Because get_file still delivers over
          SFTP, keep the same delete-after-collect discipline and Persistent
          Queue backpressure the push flow uses, and gate the destination with
          C.Schema(...).validate plus a dead-letter route.
        elastic: >
          Nothing changes for the high side relative to the CDR feed: the same
          custom logs-cisco_cucm.cdr ingest pipeline finishes what the low
          side cannot - asserting event.duration in nanoseconds, populating
          related.user from the Unicode login user IDs, and setting event.kind
          / event.category for a session-style record - and the same
          custom-namespace keyword/long mappings for directory numbers, device
          names and the cause/secured-status columns apply. The transport
          switch is invisible above the parse, so there is no reason to keep a
          second high-side pipeline for it.
        relay: >
          The crossing shape is identical to the file feed - full ECS-shaped
          NDJSON crosses (envelope mode B), one call record per line, because
          the two-header CSV grammar must be decoded next to the collector and
          a thin envelope would push that grammar at the guard's content
          filter. CDRonDemand actually strengthens the replay story an
          at-most-once crossing wants: get_file can re-request any named file
          from the repository within its retention, so low-side and high-side
          record counts can be reconciled per (dataset, hour) and any gap
          re-pulled by filename rather than waiting for a re-push. The
          free-text comment column and the directory numbers remain the filter
          friction to settle with the guard owner - length-capped and
          allow-listed low-side, not assumed inspectable.
      direct:
        parse_location: low
        cribl: >
          High-side instances pull without any guard hops: a scheduled
          get_file_list / get_file job on the core-adjacent edge worker group,
          authenticated as a read-only CUCM application user, feeding the CDR
          pipeline. Prefer this over the SFTP push only where a self-scheduled
          pull fits the collector better than being a fixed push destination;
          otherwise the push flow is simpler and carries no per-request
          interval cap. Run the discovery poll on Persistent Queue and
          reconcile returned-versus-collected filenames so a paging or
          1300-file truncation is surfaced.
        elastic: >
          Identical to the high-side handling - the custom logs-cisco_cucm.cdr
          pipeline owns nanosecond duration, related.user population and the
          custom-namespace mappings for the telephony columns ECS has no home
          for. The api-pull origin leaves no high-side fingerprint, so no
          separate template or pipeline is warranted.
    fields_omitted: >
      get_file delivers the same CDR flat file the `other` entry inventories -
      the two header lines, the 100+ columns, the epoch timestamps,
      reverse-byte-order integer IPs and Q.850 cause codes - so that column
      list stands for this entry too. CDRonDemand changes only discovery:
      hour-bounded, 1300-filename-capped get_file_list paging in front of the
      same SFTP delivery.
    fields: []
- id: audit
  name: Application audit log
  description: >
    The Cisco Unified Serviceability application audit log (AuditApp) -
    administrative configuration changes, administrator and end-user logins
    and logouts, role and permission changes, password changes, and CLI
    activity across CUCM Administration, Serviceability, RTMT, the Disaster
    Recovery System and the AXL/API surface. Written locally to activelog
    audit/AuditApp and, once Tools > Audit Log Configuration names a Remote
    Syslog Server, emitted as CiscoLog-format syslog with a %UC_AUDITLOG
    mnemonic and a bracketed key=value payload. This is the more
    security-relevant of the two CUCM feeds and the one an accreditation body
    asks for, even though CDR is the row the catalog names. Two caveats for
    deployment: enabling Detailed Audit Logging widens the feed from change
    events to read/GET events as well and multiplies volume, and phone
    registration and device authentication failures are NOT AuditApp events -
    they are raised by the CallManager service as %UC_CALLMANAGER alarms
    (DeviceTransientConnection, DeviceUnregistered, and the
    authentication-failure alarms) on the separate application syslog feed,
    which has to be enabled in its own right. The database audit (Informix)
    and OS/vos audit streams are likewise separate.
  event_categories:
  - configuration
  - authentication
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Each CUCM node forwards to the Remote Syslog Server configured under
        Cisco Unified Serviceability > Tools > Audit Log Configuration; that
        target is a Cribl syslog source on the edge worker group. A node's
        audit feed follows the same side as that node's CDR feed, so the two
        stay joinable per instance.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_cucm.audit
    direct:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Each CUCM node forwards to the Remote Syslog Server configured under
        Cisco Unified Serviceability > Tools > Audit Log Configuration; that
        target is a Cribl syslog source on the edge worker group. A node's
        audit feed follows the same side as that node's CDR feed, so the two
        stay joinable per instance.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_cucm.audit
  formats:
  - format: syslog-kv
    parsing:
      mechanism: cribl-pipeline
      artifact: custom CUCM audit-log pipeline
      notes: >
        No Elastic integration and no Cribl pack parses the CiscoLog
        %UC_AUDITLOG format. The bracketed payload is key=value but not
        cleanly so - the emitted keys carry inconsistent whitespace around the
        delimiter (" UserID =administrator" against
        "ResourceAccessed=CUCMAdmin", and "App ID"/"Cluster ID"/"Node ID" with
        embedded spaces) - so a stock kv function needs an explicit
        key-cleanup step rather than being pointed at the line as-is.
    fields:
    - vendor: '%UC_AUDITLOG-<severity>-<mnemonic>'
      type: string
      description: >-
        CiscoLog message name preceding the payload, e.g.
        %UC_AUDITLOG-5-AdministrativeEvent
      ecs: event.code
      status: partial
      notes: >
        the mnemonic names the audit event class and repeats what
        AuditCategory carries rather than identifying the specific event, so
        it is a coarse event.code; the embedded digit is the syslog severity
        and duplicates the Severity field
    - vendor: UserID
      type: string
      description: account name of the administrator or end user that performed the action
      ecs: user.name
      status: mapped
      notes: >-
        local CUCM, LDAP-synchronized or application-user account name; the
        account is the subject of the event, not its target
    - vendor: ClientAddress
      type: ip
      description: IP address of the client machine the user acted from
      ecs: source.ip
      status: mapped
      notes: >
        empty for events not raised through a client session (scheduled and
        service-internal actions), so an absent value is normal rather than a
        parse failure and must not be coerced to 0.0.0.0
    - vendor: Severity
      type: integer
      description: syslog severity assigned to the audit event
      ecs: event.severity
      status: partial
      notes: >
        syslog severity semantics - lower is more severe, and routine
        administrative events sit at 5 (notice) - which is the inverse of how
        ECS event.severity is normally read, so a direction convention has to
        be chosen and documented rather than copying the number through
    - vendor: EventType
      type: string
      description: the class of action performed, e.g. GeneralConfigurationUpdate or UserLogging
      ecs: event.action
      status: mapped
      notes: >-
        the primary alerting key on this dataset; the value vocabulary is
        release-dependent and should be enumerated per deployment rather than
        assumed
    - vendor: EventStatus
      type: enum
      description: whether the audited action succeeded or failed
      ecs: event.outcome
      status: mapped
      transform: >-
        vendor values Success and Failure are lowercased to the ECS
        success/failure vocabulary; a missing value maps to unknown rather
        than failure
    - vendor: ResourceAccessed
      type: string
      description: the CUCM interface or resource the action was performed against, e.g. CUCMAdmin
      ecs: null
      status: unmapped
      custom: cisco.cucm.audit.resource_accessed
      notes: >-
        distinguishes web-admin activity from Serviceability, RTMT, DRS and
        AXL/API activity, which is how API-driven changes are separated from
        console ones
    - vendor: AuditCategory
      type: string
      description: audit category the event belongs to, e.g. AdministrativeEvent or UserAccess
      ecs: null
      status: unmapped
      custom: cisco.cucm.audit.category
      notes: >
        not mappable to ECS event.category, which is a closed vocabulary this
        vendor taxonomy does not align with; kept custom and used to drive the
        event.category assignment rather than being written into it
    - vendor: CompulsoryEvent
      type: boolean
      description: whether the event is one that cannot be disabled by audit configuration
      ecs: null
      status: unmapped
      custom: cisco.cucm.audit.compulsory_event
      transform: >-
        emitted as the strings Yes and No; convert to boolean so the
        non-disableable events can be filtered as a set
    - vendor: ComponentID
      type: string
      description: CUCM component that generated the audit event, e.g. Cisco CUCM Administration
      ecs: service.name
      status: mapped
      notes: >-
        names the CUCM service or web application recording the event, which
        is the closest thing this dataset has to an emitting service identity
    - vendor: AuditDetails
      type: string
      description: free-text description of what changed, naming the table and key field affected
      ecs: message
      status: mapped
      notes: >
        the only place the substance of a change is recorded - table name, key
        field value and the operation - and it is unbounded operator-facing
        text that can carry credential values on password and application-user
        updates, so it needs masking and a length cap before it is indexed or
        crosses a boundary
    - vendor: App ID
      type: string
      description: application process that emitted the event, e.g. Cisco Tomcat
      ecs: null
      status: unmapped
      custom: cisco.cucm.audit.app_id
      notes: >-
        coarser than ComponentID and mostly constant per interface; the key
        contains a space and needs renaming before it can be a field name
    - vendor: Cluster ID
      type: string
      description: identifier of the CUCM cluster the node belongs to
      ecs: null
      status: unmapped
      custom: cisco.cucm.cluster_id
      notes: >
        frequently emitted empty even on clustered deployments, so it cannot
        be relied on as a tenancy or routing key; the same cluster identity
        appears as globalCallId_ClusterID on the CDR dataset, which is where a
        join between the two feeds has to be anchored
    - vendor: Node ID
      type: string
      description: hostname of the CUCM node that generated the audit event
      ecs: observer.hostname
      status: mapped
      notes: >
        the publisher or subscriber that recorded the event, not the host the
        administrator connected from - that is ClientAddress. Audit events are
        node-local, so a change made on one node appears only in that node's
        feed and every node must forward
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the bracketed payload on the edge worker group with an
          explicit key-normalization step that trims the inconsistent
          whitespace around the delimiters and collapses the spaced keys (App
          ID, Cluster ID, Node ID) to snake_case, then strip the trailing
          "Audit Event is generated by this application" boilerplate and treat
          the routinely empty Cluster ID as null rather than an empty keyword.
          Fold EventStatus into event.outcome and pull the severity out of the
          %UC_AUDITLOG-N- mnemonic as a cross-check on the Severity field.
          Redact before anything leaves the enclave: AuditDetails is free text
          that names the table and key field changed and can carry credential
          and API-key values on password and application-user updates, so mask
          those patterns and cap its length. Validate against a Schema Library
          schema with a dead-letter route and run the destination on
          Persistent Queue backpressure, never Block.
        elastic: >
          Own a custom logs-cisco_cucm.audit ingest pipeline and use it for
          what the low side cannot settle: mapping EventType onto stable ECS
          event.category and event.type values so login, logout, configuration
          update and role-change events land in the right alerting profile,
          and extracting the changed table and key-field name out of
          AuditDetails into queryable fields so admin-activity dashboards do
          not grep free text. Fix the severity direction explicitly - the
          vendor value is a syslog severity where lower means more severe, the
          inverse of how ECS event.severity is usually read - and record the
          chosen convention in the index template. Map
          cisco.cucm.audit.category, .resource_accessed and .app_id as keyword
          and .compulsory_event as boolean so the compulsory (non-disableable)
          events stay filterable.
        relay: >
          Low-side instances cross the guard: full ECS-shaped NDJSON crosses -
          the redaction of credential-bearing AuditDetails has to happen
          inside the enclave, so a thin envelope carrying raw _raw is not
          acceptable on this feed regardless of volume. This is not a CEF
          source today, so nothing CEF-shaped reaches the boundary.
          AuditDetails is the whole content-filter problem here: unbounded
          operator-facing free text containing device names, table names and
          user-supplied values, which should be length-capped and
          control-character-stripped low-side rather than assumed inspectable
          by a custom NDJSON filter. The dataset is low-volume and
          individually significant, so carry _raw across until the hand-built
          parser is proven and reconcile low-side and high-side counts per
          (dataset, hour) to detect silent drops on an at-most-once crossing.
      direct:
        parse_location: low
        cribl: >
          Parse the bracketed payload on the edge worker group with an
          explicit key-normalization step that trims the inconsistent
          whitespace around the delimiters and collapses the spaced keys (App
          ID, Cluster ID, Node ID) to snake_case, then strip the trailing
          "Audit Event is generated by this application" boilerplate and treat
          the routinely empty Cluster ID as null rather than an empty keyword.
          Fold EventStatus into event.outcome and pull the severity out of the
          %UC_AUDITLOG-N- mnemonic as a cross-check on the Severity field.
          Redact at the edge parse before anything is queued or indexed:
          AuditDetails is free text that names the table and key field changed
          and can carry credential and API-key values on password and
          application-user updates, so mask those patterns and cap its length.
          Validate against a Schema Library schema with a dead-letter route
          and run the destination on Persistent Queue backpressure, never
          Block.
        elastic: >
          Own a custom logs-cisco_cucm.audit ingest pipeline and use it for
          what the edge Cribl parse cannot settle: mapping EventType onto
          stable ECS event.category and event.type values so login, logout,
          configuration update and role-change events land in the right
          alerting profile, and extracting the changed table and key-field
          name out of AuditDetails into queryable fields so admin-activity
          dashboards do not grep free text. Fix the severity direction
          explicitly - the vendor value is a syslog severity where lower means
          more severe, the inverse of how ECS event.severity is usually read -
          and record the chosen convention in the index template. Map
          cisco.cucm.audit.category, .resource_accessed and .app_id as keyword
          and .compulsory_event as boolean so the compulsory (non-disableable)
          events stay filterable.
  - format: api-pull
    enable: >
      Besides forwarding %UC_AUDITLOG events to a Remote Syslog Server, CUCM
      lets a collector retrieve the underlying AuditApp log files directly
      through the SOAP Log Collection service, which pulls complete files
      rather than depending on a lossy syslog UDP stream. Activate "Cisco SOAP
      - Log Collection APIs" under Cisco Unified Serviceability > Tools >
      Service Activation on each node whose audit log you want (audit events
      are node-local, so every publisher and subscriber must be collected).
      The WSDL is at
      https://<cucm>:8443/logcollectionservice2/services/LogCollectionPortTypeService?wsdl
      with binary file retrieval via
      https://<cucm>:8443/logcollectionservice/services/DimeGetFileService?wsdl,
      and requests authenticate as a CUCM application user over HTTP Basic.
      The flow is: listNodeServiceLogs enumerates the collectable services,
      selectLogFiles takes a FileSelectionCriteria (service, time window,
      optional SFTP delivery) to list matching files, and GetOneFile returns a
      single named file - for the audit feed that is
      /var/log/active/audit/AuditApp/Audit00000001.log - encapsulated in DIME
      as an application/octet-stream binary body the collector must unwrap.
      The retrieved lines are the same CiscoLog audit records the syslog feed
      carries, so this is a transport and completeness change, not a new field
      schema.
    references:
    - https://developer.cisco.com/docs/sxml/log-collection-api/
    - https://developer.cisco.com/site/sxml/learn/getting-started/log-collection/
    - >-
      https://www.cisco.com/c/en/us/td/docs/voice_ip_comm/cucm/service/12_5_1/rtmt/cucm_b_cisco-unified-rtmt-administration-1251/cucm_mp_t52b2b22_00_traces-and-logs.html
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        same custom CUCM audit-log pipeline, fronted by a SOAP Log Collection
        collector (selectLogFiles/GetOneFile) with a DIME-unwrap and file-tail
        step
      notes: >
        No Elastic integration and no Cribl pack parses the CiscoLog
        %UC_AUDITLOG format by either transport. The pulled AuditApp file
        holds the identical bracketed key=value payload the syslog feed
        carries - the same inconsistent whitespace around delimiters and the
        spaced keys (App ID, Cluster ID, Node ID) that force an explicit
        key-cleanup step - so the field inventory does not differ and the
        fields list below is intentionally empty rather than a re-listing of
        the audit columns. The added handling is upstream of the parse: unwrap
        the DIME/octet-stream body, de-duplicate against already-collected
        line offsets so a re-pulled rolling file does not replay events, and
        only then hand whole lines to the key-normalization pipeline.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          For low-side instances, keep the whole parse on the edge worker
          group exactly as the syslog feed does - key-normalization to trim
          delimiter whitespace and collapse the spaced keys, EventStatus into
          event.outcome, the severity cross-check off the %UC_AUDITLOG-N-
          mnemonic - and add only the collection front-end: a scheduled
          selectLogFiles/GetOneFile job per node, a DIME-unwrap, and a
          file-offset de-duplication so re-collecting a still-growing AuditApp
          file does not double-count. The AuditDetails redaction is
          non-negotiable and must still happen inside the enclave here:
          because file pull retrieves complete history rather than a live
          tail, a first collection can sweep in months of credential-bearing
          password-change and application-user AuditDetails at once, so mask
          those patterns and cap length before anything is queued. Validate
          against the Schema Library schema with a dead-letter route and run
          the destination on Persistent Queue, never Block.
        elastic: >
          Unchanged from the audit feed: the custom logs-cisco_cucm.audit
          ingest pipeline maps EventType to stable ECS event.category /
          event.type, extracts the changed table and key field out of
          AuditDetails into queryable fields, fixes the inverted
          syslog-severity direction explicitly, and maps
          cisco.cucm.audit.category, .resource_accessed and .app_id as keyword
          with .compulsory_event as boolean. The pull transport leaves no
          high-side fingerprint, so the same pipeline serves both.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) - the
          credential-bearing AuditDetails redaction has to complete inside the
          enclave, so a thin envelope carrying raw file bytes is not
          acceptable on this feed regardless of volume. The file-pull origin
          improves the at-most-once reconciliation story: because GetOneFile
          can re-request the exact AuditApp file by name, low-side and
          high-side counts can be reconciled per (dataset, hour) and any gap
          re-pulled rather than lost the way a dropped syslog datagram is.
          AuditDetails remains the whole content-filter problem - unbounded
          operator-facing free text with device, table and user-supplied
          values - so length-cap and control-character-strip it low-side
          rather than assume the guard can inspect it.
      direct:
        parse_location: low
        cribl: >
          High-side instances collect without any guard hops: a scheduled
          selectLogFiles/GetOneFile job per node authenticated as a read-only
          application user, DIME-unwrapped and de-duplicated on file offset,
          feeding the audit pipeline. Choose file pull over remote syslog
          where syslog UDP loss or historical back-collection matters; it
          costs an extra activated service and a binary-unwrap step but
          delivers complete files. Keep Persistent Queue backpressure, and
          mask the credential-bearing AuditDetails at the edge parse before
          anything is queued.
        elastic: >
          Identical to the high-side handling - the custom
          logs-cisco_cucm.audit pipeline owns the EventType-to-ECS mapping,
          the AuditDetails field extraction and the severity-direction fix. No
          separate template or pipeline is warranted for the pulled transport.
    fields_omitted: >
      The AuditApp file GetOneFile returns carries the same bracketed
      %UC_AUDITLOG key=value records the syslog-kv entry inventories, down to
      the inconsistent delimiter whitespace and the spaced App ID / Cluster ID
      / Node ID keys, so that table stands for this entry too. What the SOAP
      pull adds sits before the parse - a DIME/octet-stream unwrap and
      file-offset de-duplication - not new fields.
    fields: []
- id: app-alarms
  name: CallManager application alarms
  description: >
    Real-time device and service state from the Cisco CallManager service,
    raised as Cisco Unified Serviceability alarms and delivered to a remote
    syslog server in CiscoLog format. This is the third and least-collected of
    the three CUCM feeds, and the division of labour between them is strict:
    CDR answers who called whom and for how long, and arrives late as an SFTP
    file drop; the application audit log answers who changed or logged into
    the cluster, and is administrative; this feed answers which endpoint is on
    the network right now and whether it authenticated. It is the only one of
    the three that sees a phone register, fail to register or drop off, and so
    the only one that shows a rogue or spoofed device presenting itself to the
    cluster. The record is a syslog line carrying two stacked envelopes - an
    RFC 3164 header (facility local6, tag ccm) and then the CiscoLog header
    "<SEQNUM>: <HOST>: <TIMESTAMP>: %<APPNAME>-<SEVERITY>-<MSGNAME>:" - in
    front of a bracketed name=value payload, e.g.
    %UC_CALLMANAGER-6-EndPointUnregistered: %[DeviceName=SEP...][IPAddress=
    198.51.100.117][Protocol=SIP][DeviceType=622][Reason=28][AppID=Cisco
    CallManager][ClusterID=...][NodeID=cucmsub]: An endpoint has unregistered.
    The alarms that carry the security weight are the registration family -
    DeviceRegistered and EndPointRegistered, DeviceUnregistered and
    EndPointUnregistered, DeviceTransientConnection and
    EndPointTransientConnection, where the EndPoint* variants are the
    phone-specific forms and the Device* variants cover gateways, trunks and
    media devices. Device authentication failures are NOT separate mnemonics:
    they are reason codes on the transient-connection alarms, drawn from the
    registration-failure cause space the CISCO-CCM-MIB publishes as
    CcmDevRegFailCauseCode, in which authenticationError(10),
    invalidX509NameInCertificate(11), invalidTLSCipher(12),
    authenticatedDeviceAlreadyExists(17) and securityMismatch(28) are the
    security-relevant values. Anything alerting on device authentication
    failure alerts on Reason, not on the alarm name - and the unregistration
    alarms number their reasons from a different space (CcmDevUnregCauseCode),
    so the same integer means different things on a transient-connection alarm
    and on an unregistration alarm and the two must never share one lookup
    table. Deployment: alarm severity and destination are set per service in
    Cisco Unified Serviceability > Alarm > Configuration, remote syslog is
    disabled by default, and the default Alarm Event Level is Error - which
    delivers a fraction of this feed rather than none of it. An alarm is sent
    when its severity is equal to or lower than the configured level, and the
    registration family does not sit at one severity: EndPointUnregistered and
    EndPointTransientConnection are Error (3), DeviceUnregistered and
    DeviceTransientConnection are Warning (4), EndPointRegistered is Notice
    (5) and DeviceRegistered is Informational (6). So the default threshold
    keeps the endpoint failures and drops everything else, which is the worst
    of both worlds: the failures arrive with no successful-registration
    baseline to read them against, and an operator who checks only for
    DeviceRegistered concludes the feed is dead. The feed needs Remote Syslogs
    enabled with a Server Name and the Alarm Event Level set to Informational
    on the Cisco CallManager service with Apply to All Nodes. Certificate
    lifecycle is a different service with its own alarm configuration - the
    Cisco Certificate Expiry Monitor raises %UC_CERT-4-CertValidLessThanMonth
    and %UC_CERT-2-CertValidfor7days - and ITL/TVS trust failures have no
    alarm of their own at all; they surface here as the certificate and TLS
    reason codes above, which is the only place a cluster-wide ITL break is
    visible as an event rather than as a help-desk call. The catalog also
    carries LastOutOfServiceInformation, posted by a recovered phone over SIP
    REFER, whose parameters (DeviceName, DeviceIPv4Address,
    IPv4DefaultGateway, ModelNumber, NeighborDeviceID, ReasonForOutOfService,
    LastProtocolEventSent, LastProtocolEventReceived) are a different shape
    from the registration family and are not inventoried below. What this feed
    does not carry: no destination address, port or transport, and no call
    content or dialled digits - it is endpoint identity and state telemetry,
    not flow telemetry. That is why the dataset claims authentication only and
    not network: the addresses here say which endpoint spoke to the cluster,
    never which two parties spoke to each other, and declaring the network
    profile would report coverage the feed cannot deliver.
  event_categories:
  - authentication
  route:
    guarded:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Each CUCM node forwards to the Server Name configured under Cisco
        Unified Serviceability > Alarm > Configuration for the Cisco
        CallManager service; that target is a Cribl syslog source on the edge
        worker group. Alarm configuration is per service and per node unless
        Apply to All Nodes is set, and a node only reports the devices
        registered to it, so a node's alarm feed follows the same side as that
        node's CDR and audit feeds and every node must forward or the
        registration picture has holes.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_cucm.app_alarms
    direct:
    - hop: cribl
      location: edge Cribl worker group, on-prem enclave
      notes: >
        Each CUCM node forwards to the Server Name configured under Cisco
        Unified Serviceability > Alarm > Configuration for the Cisco
        CallManager service; that target is a Cribl syslog source on the edge
        worker group. Alarm configuration is per service and per node unless
        Apply to All Nodes is set, and a node only reports the devices
        registered to it, so a node's alarm feed follows the same side as that
        node's CDR and audit feeds and every node must forward or the
        registration picture has holes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-cisco_cucm.app_alarms
  formats:
  - format: syslog-kv
    parsing:
      mechanism: cribl-pipeline
      artifact: custom CUCM CallManager alarm pipeline
      notes: >
        No Elastic integration and no Cribl pack parses the CiscoLog
        %UC_CALLMANAGER format, and this feed is harder to parse than the
        audit feed rather than easier. Three problems have to be handled
        before a kv function is useful. First, two envelopes are stacked: an
        RFC 3164 header whose timestamp has no year and is written in the
        node's local time, then the CiscoLog header whose timestamp carries
        the year, milliseconds and an explicit timezone - the second is the
        one to use for @timestamp and the first should be discarded rather
        than reconciled. Second, the payload key spelling is not stable across
        releases: 11.5 and later emit compact keys (DeviceName, IPAddress,
        ConnectingPort, Reason, IPAddrAttributes, AppID, ClusterID, NodeID)
        while older releases and the Serviceability alarm definitions render
        the same parameters spaced (Device name, Device IP address, Connecting
        Port, Reason Code, App ID, Cluster ID, Node ID), and the IPv6
        parameters are inconsistently cased even within one release's
        documentation (IPv6Address against IPV6Address), so the pipeline needs
        a spelling-normalization table rather than a direct key copy. Third,
        malformed tags are emitted in the field: lines carrying
        [UNKNOWN_PARAMNAME:LastSignalReceived=StationClose] are normal output
        from some device types, so the parser must strip an UNKNOWN_PARAMNAME:
        prefix off a key instead of dead-lettering the record. The alarm
        payload is otherwise well behaved - no embedded unescaped brackets in
        the values seen - so a bracket-split followed by a first-equals split
        is a safe tokenizer.
    fields:
    - vendor: <SEQNUM>
      type: integer
      description: CiscoLog per-process sequence number preceding the host field
      ecs: event.sequence
      status: partial
      notes: >
        a per-process counter that increments on every log entry and wraps at
        2^32; it is the only drop detector this feed has, because remote
        syslog is UDP and a lost registration alarm is otherwise invisible. It
        resets when the CallManager service restarts, so a gap alert has to
        tolerate a reset rather than treat every restart as loss, and the
        counter is per node and per process so it is only monotonic within a
        (NodeID, service) pair
    - vendor: <HOST>
      type: string
      description: node identifier in the CiscoLog header, an FQDN or IP address
      ecs: host.name
      status: mapped
      notes: >
        names the same CUCM node the payload's NodeID names but in a different
        form - the CiscoLog specification allows an FQDN, a hostname or an
        IPv4/IPv6 literal here, while NodeID carries the configured node name
        - so both are kept: this one fills host.name and NodeID fills
        observer.hostname, and a mismatch between them is worth alerting on
        because it means the syslog header is being rewritten in transit
    - vendor: '%UC_CALLMANAGER-<SEVERITY>-<MSGNAME>'
      type: string
      description: >-
        CiscoLog message name preceding the payload, e.g.
        %UC_CALLMANAGER-6-EndPointUnregistered
      ecs: event.code
      status: mapped
      notes: >
        the whole tag is the stable event identity on this feed and is what a
        detection should pin to; APPNAME is %UC_CALLMANAGER for the
        CallManager service specifically, which is how alarms from this
        service are separated from %UC_AUDITLOG, %UC_CTI, %UC_CERT and the
        other catalogs arriving on the same syslog listener
    - vendor: <MSGNAME>
      type: string
      description: alarm mnemonic inside the tag, e.g. EndPointTransientConnection
      ecs: event.action
      status: mapped
      notes: >
        the mnemonic alone is the action, and unlike the audit feed there is
        no separate EventType parameter to carry it - the alarm name is the
        only statement of what happened, which is why the pipeline has to
        split the tag rather than store it whole. It is also the only input to
        event.outcome: the transient-connection mnemonics are failures, the
        registration mnemonics are successes, and the unregistration mnemonics
        are neither and should be left unknown rather than forced
    - vendor: <SEVERITY>
      type: integer
      description: severity digit embedded in the CiscoLog tag
      ecs: event.severity
      status: partial
      notes: >
        syslog severity semantics - lower is more severe - which is the
        inverse of how ECS event.severity is normally read, exactly as on the
        audit dataset, so the same direction convention has to be chosen for
        both CUCM feeds and documented once. It is also the field the whole
        feed's existence depends on: the Alarm Event Level threshold in
        Serviceability filters on this number, and at the default level of
        Error nothing at severity 6 is ever sent
    - vendor: ConnectingPort
      type: integer
      description: TCP port associated with the registration attempt
      ecs: source.port
      status: partial
      notes: >
        appears only on the transient-connection alarms. Observed values are
        not consistently one thing - captured lines carry both the well-known
        listener ports (2000 for SCCP, 5060 for SIP) and ephemeral client
        ports such as 50538 - so it cannot be relied on as the source port or
        as the destination port. It is mapped to source.port because the
        endpoint is the connecting party, but a detection must not infer the
        protocol from it; Protocol is the field for that
    - vendor: DeviceName
      type: string
      description: CUCM device name of the endpoint, e.g. SEP<MAC> for a phone
      ecs: device.id
      status: mapped
      notes: >
        the cluster-unique device identity and the join key back to the CUCM
        device configuration; for phones it is the literal string SEP followed
        by the MAC address, for gateways and trunks it is the administratively
        chosen name. It is emitted empty on some transient-connection alarms -
        a device that never got far enough to name itself, which is precisely
        the rogue-connection case - so an empty value is signal rather than a
        parse failure and must not be dropped. device.id is preferred over
        host.name here because the endpoint is the subject of the event and
        host.name is already taken by the reporting CUCM node
    - vendor: MACAddress
      type: string
      description: MAC address of the endpoint, without separators
      ecs: source.mac
      status: mapped
      transform: >-
        emitted as bare hex with no separators (0DD3B4E90000); ECS expects
        colon-separated upper-case, so it needs reformatting rather than a
        copy
      notes: >-
        the endpoint is the connecting party, so source.mac rather than
        host.mac; on phones this is the same value embedded in DeviceName and
        the two should be cross-checked, because a mismatch means a device is
        registering under a name that is not its own
    - vendor: IPAddress
      type: ip
      description: IPv4 address the endpoint connected from
      ecs: source.ip
      status: mapped
      notes: >-
        the address of the phone or gateway, not of the CUCM node; this is the
        field a rogue-device detection pivots on, joined against DHCP and
        switch-port data to place the endpoint physically
    - vendor: IPv6Address
      type: ip
      description: IPv6 address the endpoint connected from
      ecs: source.ip
      status: partial
      notes: >
        present only on dual-stack and IPv6-only deployments and empty
        otherwise. Cisco's own alarm definitions spell it inconsistently
        across alarms (IPv6Address on the transient-connection alarms,
        IPV6Address on the unregistration alarms), so the normalization table
        must accept both. It targets the same source.ip as IPAddress because
        the two never both describe the connection in use; which one is live
        is stated by IPAddrAttributes
    - vendor: IPAddrAttributes
      type: integer
      description: 'bitfield saying which of the device''s addresses is active'
      ecs: null
      status: unmapped
      custom: cisco.cucm.app_alarms.ip_addr_attributes
      notes: >-
        numeric and undocumented in the alarm definition beyond its presence;
        kept custom because it is the only statement of whether the IPv4 or
        the IPv6 address is the one the registration actually used, which the
        pipeline needs in order to decide what to write into source.ip on a
        dual-stack endpoint
    - vendor: Protocol
      type: string
      description: signalling protocol the endpoint registered with, SIP or SCCP
      ecs: network.protocol
      status: mapped
      notes: >-
        an application protocol, so network.protocol rather than
        network.transport, which this feed never states; the value is also the
        strongest cheap filter for third-party SIP devices, which register
        over SIP and never over SCCP
    - vendor: DeviceType
      type: integer
      description: numeric CUCM model code for the endpoint, e.g. 622 for a 7841
      ecs: device.model.identifier
      status: mapped
      notes: >
        a machine-readable model code, not a name, and the code-to-model table
        is release-dependent and not published as a stable list, so the lookup
        has to be built per deployment from the CUCM device type table rather
        than assumed. device.model.identifier is the correct target precisely
        because it is the machine-readable identifier; device.model.name is
        left empty rather than filled with a guessed marketing name
    - vendor: Description
      type: string
      description: administrator-set description of the device from CUCM configuration
      ecs: null
      status: unmapped
      custom: cisco.cucm.app_alarms.device_description
      notes: >
        free text an administrator typed into the device configuration and
        commonly carrying an owner name, a room number or a desk location, so
        it is the one field on this feed with personal-data exposure and needs
        a length cap. Kept custom rather than folded into message, which the
        trailing alarm text already owns, and not mapped to device.model.name
        because it describes the deployment of the device rather than the
        model
    - vendor: Reason
      type: integer
      description: numeric cause code for the registration failure or the unregistration
      ecs: event.reason
      status: partial
      notes: >
        the single most important field on the feed and the only carrier of
        device authentication failure. On the transient-connection alarms it
        is a CcmDevRegFailCauseCode, where authenticationError(10),
        invalidX509NameInCertificate(11), invalidTLSCipher(12),
        authenticatedDeviceAlreadyExists(17) and securityMismatch(28) are the
        security-relevant values; on the unregistration alarms it is a
        CcmDevUnregCauseCode, an entirely different numbering in which the
        same integers mean unrelated things (10 is deviceUnregistered, 11 is
        malformedRegisterMsg, 28 is fallbackInitiated). Resolution therefore
        has to be keyed on the mnemonic as well as the number, and a single
        flat lookup table is a correctness bug. event.reason is a keyword, so
        the resolved name is written there and the raw integer kept alongside
    - vendor: RegisteringSIPUser
      type: string
      description: SIP username the endpoint presented at registration
      ecs: user.name
      status: partial
      notes: >
        appears on the transient-connection alarms and is the authentication
        identity a failed registration actually claimed, which makes it the
        field a credential-stuffing or spoofed-device detection counts by. The
        parameter is confirmed in Cisco's alarm definitions, which render it
        spaced as "Registering SIP User"; captured lines from releases that
        use compact keys have not been sighted with a value in it, so the
        normalization table must accept both spellings rather than assume one.
        It is empty for SCCP devices, which do not present a user at all
    - vendor: UserID
      type: string
      description: CUCM end user the device is owned by or logged in as
      ecs: user.name
      status: mapped
      notes: >
        appears on the successful-registration alarms and names the configured
        owner or the Extension Mobility user currently logged into the device.
        It targets the same user.name as RegisteringSIPUser deliberately: the
        two never appear on the same alarm - one is on the success, the other
        on the failure - so a single user.name is unambiguous per event, and
        folding them keeps a per-user registration-failure ratio computable in
        one query
    - vendor: PerfMonObjType
      type: integer
      description: performance-monitor object class the registered device belongs to
      ecs: null
      status: unmapped
      custom: cisco.cucm.app_alarms.perfmon_obj_type
      notes: >-
        a coarse device class (phone, gateway, media resource) used by the
        CUCM performance counters; kept custom because it is a vendor taxonomy
        with no ECS counterpart, and useful as a cheap way to separate phone
        registrations from gateway and trunk registrations without a
        DeviceType lookup
    - vendor: LoadID
      type: string
      description: firmware load the device reports at registration
      ecs: null
      status: unmapped
      custom: cisco.cucm.app_alarms.load_id
      notes: >-
        the firmware version string, e.g. sip8961.9-4-1-9; there is no ECS
        field for the software version of a device that is not the host, so it
        stays custom. It is the only place a fleet-wide phone firmware
        inventory can be derived from log data, which is what makes a
        downgraded or unexpected load visible
    - vendor: ActiveLoadId
      type: string
      description: firmware load currently running on the device
      ecs: null
      status: unmapped
      custom: cisco.cucm.app_alarms.active_load_id
      notes: >-
        emitted alongside LoadID on the registration alarms and normally
        identical to it; a divergence means the device has a pending upgrade
        it has not applied, which is worth surfacing as its own condition
    - vendor: AssociatedDNs
      type: string
      description: comma-separated directory numbers configured on the device
      ecs: null
      status: unmapped
      custom: cisco.cucm.app_alarms.associated_dns
      transform: >-
        emitted as one comma-separated string with a trailing comma on some
        releases; split to an array and drop the empty trailing element
      notes: >
        directory numbers are telephone numbers and ECS has no field for them,
        so this stays custom; it is also the highest-value join to the CDR
        dataset, whose callingPartyNumber and originalCalledPartyNumber are
        the same numbering plan, and the only way to answer "which extension
        was this endpoint carrying when it disappeared". Treat it as personal
        data for retention purposes
    - vendor: LastSignalReceived
      type: string
      description: last protocol message CUCM received before the connection failed
      ecs: null
      status: unmapped
      custom: cisco.cucm.app_alarms.last_signal_received
      notes: >-
        values such as SIPRegisterInd or StationClose; a protocol-state detail
        with no ECS counterpart, and the field most often emitted with the
        malformed UNKNOWN_PARAMNAME: prefix, so the key-cleanup step has to
        run before it can be read at all
    - vendor: StationState
      type: string
      description: CUCM-side registration state machine position when the attempt failed
      ecs: null
      status: unmapped
      custom: cisco.cucm.app_alarms.station_state
      notes: >-
        values such as wait_register or wait_capabilities; together with
        LastSignalReceived it says how far a failed registration got, which
        separates a device rejected at authentication from one that never
        presented credentials
    - vendor: CallState
      type: string
      description: call state the device was in when it unregistered
      ecs: null
      status: unmapped
      custom: cisco.cucm.app_alarms.call_state
      notes: >-
        appears on unregistration alarms raised mid-call and carries a call
        reference and state name; kept custom because it is neither an event
        outcome nor a CDR call identifier and cannot be joined to the CDR
        globalCallId columns without a lookup that CUCM does not publish
    - vendor: AppID
      type: string
      description: application that raised the alarm, constant "Cisco CallManager" on this feed
      ecs: service.name
      status: mapped
      notes: >-
        effectively constant here, but it is the value that distinguishes
        alarms of the CallManager service from the other catalogs sharing the
        syslog listener, so it is kept and asserted rather than dropped; note
        the compact spelling AppID on this feed against the spaced "App ID" on
        the audit feed
    - vendor: ClusterID
      type: string
      description: identifier of the CUCM cluster the node belongs to
      ecs: null
      status: unmapped
      custom: cisco.cucm.cluster_id
      notes: >
        deliberately the same custom field the audit dataset uses, so the
        three CUCM feeds share one cluster key; like there it is frequently
        emitted empty or as the placeholder StandAloneCluster even on
        clustered deployments, so it cannot be relied on as a tenancy key, and
        the CDR globalCallId_ClusterID column remains the anchor for a
        cross-feed join
    - vendor: NodeID
      type: string
      description: configured name of the CUCM node that raised the alarm
      ecs: observer.hostname
      status: mapped
      notes: >
        the subscriber or publisher the device was registering to, not the
        device itself. Registration alarms are node-local and a phone only
        appears in the feed of the node it homed to, so an apparent
        disappearance is often a rehome to another node and correlation across
        every node's feed is required before an unregistration is treated as a
        device going away. Paired with the CiscoLog <HOST> field, which
        carries the same node in FQDN form and fills host.name
    - vendor: <MESSAGE>
      type: string
      description: trailing prose after the payload, e.g. "An endpoint has unregistered"
      ecs: message
      status: partial
      notes: >-
        fixed boilerplate determined entirely by the mnemonic and carrying no
        per-event information, unlike the audit feed's AuditDetails; it is
        mapped for readability but is the first thing to drop if the feed
        needs trimming, and nothing should ever be extracted from it by regex
        when the mnemonic states the same thing exactly
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse on the edge worker group. Strip the RFC 3164 header without
          reading its timestamp, take @timestamp from the CiscoLog timestamp
          instead because that is the one carrying the year, milliseconds and
          an explicit timezone, and split the tag into event.code, the
          mnemonic and the severity digit in one operation. Normalize the
          payload keys through an explicit spelling table before any kv
          function sees them - compact against spaced (DeviceName / Device
          name, ConnectingPort / Connecting Port, Reason / Reason Code, AppID
          / App ID) and the IPv6Address / IPV6Address casing - and strip a
          leading UNKNOWN_PARAMNAME: from any key rather than dead-lettering
          the record, because that malformation is normal output from some
          device types. Resolve Reason against the mnemonic, not against a
          single table: the transient-connection alarms number from
          CcmDevRegFailCauseCode and the unregistration alarms from
          CcmDevUnregCauseCode, and the same integer means different things in
          each. Reformat MACAddress from bare hex into colon-separated form,
          split AssociatedDNs on commas and drop the trailing empty element,
          and cap the length of Description, which is administrator-typed free
          text that routinely names a person or a room. Keep event.sequence
          and reconcile it per (NodeID, hour) so UDP loss is detectable.
          Validate against a Schema Library schema with a dead-letter route
          and run the destination on Persistent Queue backpressure, never
          Block: registration storms after a cluster restart are the volume
          spike this feed produces and they are exactly when it must not be
          dropped.
        elastic: >
          Own a custom logs-cisco_cucm.app_alarms ingest pipeline for the
          parts that need cluster-wide state. Derive event.outcome from the
          mnemonic - transient-connection is failure, registration is success,
          unregistration is left unknown rather than forced into either - and
          set event.category and event.type so the authentication profile
          picks the feed up. Copy host.name into related.hosts and source.ip
          into related.ip so a device can be pivoted on from either identity.
          Map the custom namespace explicitly:
          cisco.cucm.app_alarms.device_description, .last_signal_received,
          .station_state and .call_state as keyword, .ip_addr_attributes and
          .perfmon_obj_type as long, .associated_dns as keyword array, and the
          three load-id fields as keyword so a firmware inventory aggregates.
          Fix the severity direction the same way the audit dataset does and
          record the convention in the index template rather than deciding it
          twice. The correlation this pipeline cannot do at ingest and a rule
          must do at search time is the rehome case: an EndPointUnregistered
          on one NodeID followed by an EndPointRegistered for the same
          DeviceName on another is a normal rehome and must not alert.
        relay: >
          Low-side instances cross the guard: full ECS-shaped NDJSON crosses,
          not a thin envelope. The reason is the parse, not redaction - the
          Reason resolution has to be keyed on the mnemonic and against two
          different cause-code tables, and that logic belongs in one place
          rather than being repeated on both sides of the boundary - and the
          Description length cap and the AssociatedDNs handling are the
          personal-data controls, which are pinned low-side by doctrine. This
          is not a CEF source today, so nothing CEF-shaped reaches the
          boundary. The content-filter problem here is narrower than on the
          audit feed: every field is short and structurally constrained except
          Description, which is unbounded operator-typed text, so cap and
          control-character-strip that one field low-side and the rest of the
          record is inspectable as fixed-shape NDJSON. Volume is the real
          friction: a cluster restart or a WAN outage produces a registration
          storm of one alarm per endpoint, so size the crossing for the burst
          rather than the mean and reconcile low-side and high-side counts per
          (dataset, hour) using event.sequence, which gives this feed a drop
          detector the audit feed does not have.
      direct:
        parse_location: low
        cribl: >
          Parse on the edge worker group exactly as the guarded side does -
          RFC 3164 header discarded in favour of the CiscoLog timestamp, tag
          split into event.code plus mnemonic plus severity, key-spelling
          normalization before the kv function, UNKNOWN_PARAMNAME: prefixes
          stripped, Reason resolved against the mnemonic-selected cause-code
          table, MACAddress reformatted, AssociatedDNs split, Description
          capped. Parse low rather than high because there is no Elastic
          integration for this format on either side, so nothing is gained by
          shipping raw and the storm-shaped volume is cheaper to shape at the
          edge. Keep event.sequence for per-node loss detection, and keep
          Persistent Queue backpressure so a registration storm queues rather
          than drops.
        elastic: >
          Identical to the guarded side: the custom logs-cisco_cucm.app_alarms
          pipeline derives event.outcome from the mnemonic, sets
          event.category and event.type for the authentication profile, fills
          related.hosts and related.ip, maps the cisco.cucm.app_alarms
          namespace with the types listed there, and applies the same
          severity-direction convention as the audit dataset. No separate
          template or pipeline is warranted for the direct side; the
          cross-node rehome correlation is a search-time rule here too.
