  - format: windows-event
    enable: >
      The same diagnostic events that go to the ULS trace log can be reported
      to the Windows event log at a separately configured severity. In Central
      Administration > Monitoring > Reporting > Configure diagnostic logging,
      each category carries a "Least critical event to report to the event
      log" level (None, Critical, Error, Warning, Information, Verbose)
      alongside its trace-log level; the PowerShell equivalent is
      Set-SPLogLevel -EventSeverity. Matching events are written to the
      Windows Application event log using the SharePoint Area as the event
      source name (e.g. "SharePoint Foundation"), with some components also
      writing to dedicated channels - Microsoft-SharePoint Products-Shared/
      Operational and .../Audit, and Microsoft-Office Server-Search/
      Operational. Enable Event Log Flood Protection to suppress repeats. This
      is deliberately a SUBSET of the trace log - only events at or above the
      configured event-log level cross - and it uses the Windows five-level
      severity scale and numeric Windows event ids, not the ULS six-level
      scale or the four-character ULS tag.
    references:
    - >-
      https://learn.microsoft.com/en-us/sharepoint/administration/configure-diagnostic-logging
    - https://docs.nxlog.co/integrate/sharepoint.html
    parsing:
      mechanism: elastic-integration
      artifact: >-
        Elastic Windows integration (logs-windows.* / winlogbeat) subscribed
        to the Application and SharePoint operational channels
      notes: >
        Unlike the tab-delimited trace file this needs no custom delimited
        parser - the shipped Elastic Windows integration renders each event
        record to ECS on the agent. The SharePoint-specific detail sits in
        winlog.* (channel, record id, keywords, task) which the integration
        populates natively but which is outside the ECS core dictionary, so
        those keys are carried on a sharepoint.uls custom namespace here. The
        trade is coverage: the event log only ever holds the subset of events
        configured above its event-log level, so it cannot replace the trace
        feed for VerboseEx-era exploitation forensics.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Let the Elastic Agent on each SharePoint server render Windows event
          records to ECS at the edge and subscribe explicitly to the channels
          that matter - Application (source = the SharePoint Area),
          Microsoft-SharePoint Products-Shared/Operational and .../Audit, and
          Microsoft-Office Server-Search/Operational - rather than the whole
          Application log. Because this is already structured ECS, the
          crossing payload is NDJSON with no _raw text line to disambiguate.
          Mask nothing beyond the message body, which can carry stack detail;
          keep the record id so gaps are detectable, and run Persistent Queue
          backpressure rather than Block.
        elastic: >
          Convert the numeric Windows Level (1-5) to event.severity with a
          Windows-scale lookup - do NOT reuse the ULS Level lookup, since the
          event-log scale (Critical, Error, Warning, Information, Verbose) is
          a different and naturally-ordered scale from the ULS six-level trace
          scale. Keep the numeric Windows EventID on event.code and the Area
          on event.provider, and note that this EventID does not correlate
          with the four-character ULS tag on the trace feed. The ULS
          Correlation GUID is not a structured field on the event record -
          when present it is embedded in the message text - so pair this feed
          with the trace or IIS map for request-level correlation rather than
          expecting trace.id from it. Declare sharepoint.uls event_channel and
          event_record_id as keyword in the index template.
        relay: >
          Cross one ECS NDJSON object per event record so the event-log feed
          presents the same schema as the other SharePoint streams to the
          content filter. The single unbounded, attacker-influenced value is
          the rendered message (which may carry stack traces and reflected
          input); cap it at a declared length and normalise its encoding
          low-side. This is a small crossing surface - the structured System
          fields are bounded. Treat the crossing as at-most-once and reconcile
          counts per (Computer, hour) using TimeCreated; the per-channel
          record id gives an independent gap check.
      direct:
        parse_location: low
        cribl: >
          High-side farms run the same agent-side channel subscription with no
          guard hops, shipping rendered ECS straight into the core worker
          group. Subscribe to the named SharePoint channels rather than the
          whole Application log so search and BCS operational noise does not
          swamp the security-relevant records.
        elastic: >
          Convert the numeric Windows Level to event.severity with a
          Windows-scale lookup, keep the numeric EventID on event.code and the
          Area on event.provider; the Correlation GUID remains
          message-embedded, so cross-server correlation still comes from the
          trace or IIS feeds.
    fields:
    - vendor: TimeCreated
      type: timestamp
      description: 'SystemTime the event record was written, from the event''s System block'
      ecs: '@timestamp'
      status: mapped
      transform: >-
        rendered as UTC in the event XML, so it needs no per-server zone
        constant unlike the trace file's local Timestamp
    - vendor: Provider Name
      type: string
      description: >-
        event source that raised the record - the SharePoint Area registered
        as the Windows event source, e.g. "SharePoint Foundation"
      ecs: event.provider
      status: mapped
      notes: >
        the Area doubles as the event source name here, so a single field
        carries what the trace file splits into Area and its throttling unit
    - vendor: EventID
      type: integer
      description: numeric Windows event identifier for the record
      ecs: event.code
      status: mapped
      notes: >
        a numeric Windows event id, NOT the four-character alphanumeric ULS
        tag on the trace log; the two identifier spaces do not correlate, so a
        rule written against ULS EventID will not match here
    - vendor: Level
      type: integer
      description: Windows severity - Critical, Error, Warning, Information, Verbose (1-5)
      ecs: log.level
      status: mapped
      notes: >
        derive event.severity from this numeric Windows level with a
        Windows-scale lookup; do not reuse the ULS Level lookup, because the
        event-log scale is a different and naturally-ordered set from the
        six-level ULS trace scale
    - vendor: Task
      type: string
      description: Windows Task Category for the record, a component sub-classification
      ecs: null
      status: unmapped
      custom: sharepoint.uls.event_task
      notes: >
        carried natively as winlog.task, which is outside the ECS core
        dictionary; a coarse grouping below Provider, kept for filtering
    - vendor: Computer
      type: string
      description: name of the farm server that logged the event, from the System block
      ecs: host.name
      status: mapped
      transform: >
        lowercased on ingest to join Windows host inventory; unlike the ULS
        trace file the emitting host is a real structured field here, not
        derived from a log filename
    - vendor: Channel
      type: string
      description: event log channel the record came from
      ecs: null
      status: unmapped
      custom: sharepoint.uls.event_channel
      notes: >
        Application, Microsoft-SharePoint Products-Shared/Operational,
        .../Audit, or Microsoft-Office Server-Search/Operational; the Windows
        integration stores this as winlog.channel, which is outside the ECS
        core dictionary, so it is kept on a custom key for routing
    - vendor: EventRecordID
      type: integer
      description: per-channel monotonic record identifier
      ecs: null
      status: unmapped
      custom: sharepoint.uls.event_record_id
      notes: >
        native winlog.record_id; a per-channel sequence useful for detecting
        dropped or gapped records across the crossing
    - vendor: Message
      type: string
      description: rendered description of the event, including stack detail on errors
      ecs: message
      status: mapped
      notes: >
        the ULS Correlation GUID, when present, appears only inside this
        rendered text and not as a structured field, so trace.id cannot be
        reliably populated from the event log
  - format: jdbc-sql
    recommended: true
    recommended_because: >-
      the logging database view returns the whole trace feed as typed columns
      from every farm server; the event log only ever holds the subset of
      events configured above its event-log level, so it cannot replace the
      trace feed.
    enable: >
      The Usage and Health Data Collection service can import ULS trace
      entries into the farm-wide logging database (default name
      SharePoint_Logging, historically WSS_Logging) where they are exposed as
      the dbo.ULSTraceLog view. Enable it in Central Administration >
      Monitoring > Reporting > Configure usage and health data collection by
      turning on usage data collection and the Trace Log event; the
      "Diagnostic Data Provider: Trace Log" timer job then writes rows to the
      logging database and creates the view on first run (it does not exist
      until the provider is enabled). Every farm server's trace lines land in
      this one database, so it is queried over JDBC/SQL with no per-server
      file tail. The columns are typed (LogTime, MachineName, ProcessName,
      ThreadID, Area, Category, Level, EventID, Message, CorrelationId,
      RowCreatedTime), and RowCreatedTime is a natural high-water column for
      incremental reads.
    references:
    - >-
      https://learn.microsoft.com/en-us/sharepoint/administration/view-data-in-the-logging-database
    - https://docs.nxlog.co/integrate/sharepoint.html
    - >-
      https://moredvikas.wordpress.com/2017/06/13/sharepoint-2013-correlation-id-not-found-on-sharepoint-farm-enable-job-diagnostic-data-provider-trace-log-and-query-view-ulstracelog/
    parsing:
      mechanism: elastic-ingest-pipeline
      artifact: >-
        logs-sharepoint_onprem.uls@custom (column rename-to-ECS; collected by
        an SQL/JDBC input, not a file tail)
      notes: >
        This transport removes two of the flat file's problems: the view
        returns typed columns so there is no tab-delimited parse and no
        repeated per-file header block to drop, and MachineName is a real
        column so the emitting host no longer has to be stamped from a
        filename. Collect with a scheduled query (Elastic Agent SQL input,
        Logstash JDBC, or a Cribl Database Collector) tracking a high-water
        mark on RowCreatedTime so rows are read once, then a pure column
        rename to ECS. The ULS Level to event.severity lookup and the
        Area/Category handling are unchanged from the flat file, and
        over-length messages may still be split across rows depending on how
        the provider imports them.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Run the Database Collector low-side against the logging database
          with a high-water mark on RowCreatedTime so rows are not re-read,
          and hold volume down at source with a Level and Area filter rather
          than importing Verbose/VerboseEx farm-wide. Because the rows are
          typed there is no misalignment risk when Microsoft adds a trace
          column, but still gate the output with C.Schema(...).validate plus a
          dead-letter route. The logging database is a low-side asset: collect
          it in that enclave and cross NDJSON rather than opening a SQL port
          across the guard.
        elastic: >
          Own a custom logs-sharepoint_onprem.uls pipeline that converts the
          ULS Level enum to numeric event.severity through an explicit lookup
          - the ULS scale is not syslog severity, and High/Medium are less
          severe than Unexpected/Monitorable, so a naive string sort inverts
          it - and splits ProcessName into process.name and process.pid if the
          hex id is appended. Map sharepoint.uls.area as keyword and keep the
          Area/ Category pair on log.logger, and put Correlation on trace.id
          so a single request pivots across servers - an advantage of this
          feed is that every farm server's lines are already consolidated in
          one database. For ToolShell-era detection (CVE-2025-53770 and the
          related ToolPane.aspx chain) pair this dataset with the iis map
          exactly as the trace feed does: the suspicious POST to
          /_layouts/*/ToolPane.aspx and the dropped webshell retrieval are
          IIS-side, while ULS carries the deserialization and web-part load
          errors around them.
        relay: >
          Cross one NDJSON object per row so the logging-DB feed presents the
          same schema as the other SharePoint streams to the content filter.
          The one unbounded value to cap is Message, which can carry stack
          detail; length-cap and normalise it low-side. The logging database
          is a low-side asset, so run the collector in that enclave and cross
          the NDJSON rather than opening a broad SQL port across the guard.
          Treat the crossing as at-most-once and reconcile row counts per
          (MachineName, hour) using LogTime, with RowCreatedTime as the
          collection high-water.
      direct:
        parse_location: high
        cribl: >
          High-side farms collect the same way with no guard hops: a scheduled
          query against dbo.ULSTraceLog with a RowCreatedTime high-water mark,
          emitting structured rows straight into the core worker group.
          Because the rows are already typed, the core stage is a
          pass-through.
        elastic: >
          Apply the same custom logs-sharepoint_onprem.uls pipeline - Level to
          event.severity lookup, ProcessName split, Correlation to trace.id,
          Area/Category to log.logger - as a pure column rename over the typed
          view, collected over the Elastic Agent SQL input or Logstash JDBC.
    fields:
    - vendor: LogTime
      type: timestamp
      description: date and time the trace line was written, to sub-second precision
      ecs: '@timestamp'
      status: mapped
      transform: >
        the trace event time carried into the logging DB; normalise to UTC
        consistently with the flat-file feed so the two streams line up
    - vendor: MachineName
      type: string
      description: farm server that produced the trace line
      ecs: host.name
      status: mapped
      notes: >
        a real structured column here - unlike the flat file, where the
        emitting host is only recoverable from the log filename - because the
        logging database is farm-wide
    - vendor: ProcessName
      type: string
      description: host executable that emitted the line
      ecs: process.name
      status: partial
      notes: >
        if the trailing hex process id is appended as in the flat file's
        Process column it must be split out into process.pid before
        process.name is clean
    - vendor: ThreadID
      type: string
      description: id of the thread on that process which emitted the line
      ecs: process.thread.id
      status: mapped
      transform: written as a hex string; convert to an integer
    - vendor: Area
      type: string
      description: SharePoint component or service application that generated the event
      ecs: null
      status: unmapped
      custom: sharepoint.uls.area
      notes: >
        e.g. SharePoint Foundation, SharePoint Server Search; also the unit
        that diagnostic-logging throttling is configured against, so it
        determines what is present at all
    - vendor: Category
      type: string
      description: subcategory within the Area, e.g. Topology or Claims Authentication
      ecs: log.logger
      status: partial
      notes: >
        log.logger carries the Area/Category pair concatenated; Area is kept
        as a custom field as well so it stays filterable on its own
    - vendor: Level
      type: string
      description: trace severity - Unexpected, Monitorable, High, Medium, Verbose, VerboseEx
      ecs: log.level
      status: mapped
      notes: >
        the ULS scale is not syslog severity and does not sort naturally:
        Unexpected and Monitorable are the most severe while High and Medium
        are routine, so a lookup is required to derive event.severity
    - vendor: EventID
      type: string
      description: short ULS event tag identifying the message template
      ecs: event.code
      status: mapped
      notes: >
        a four-character alphanumeric tag such as 8e2s - not a Windows event
        id and not numeric, so it must be mapped as keyword
    - vendor: Message
      type: string
      description: descriptive text of the trace event, including stack detail on errors
      ecs: message
      status: mapped
      notes: >
        free text that can exceed the ULS per-line limit; over-length messages
        may still arrive split across rows depending on how the import
        provider writes them
    - vendor: CorrelationId
      type: string
      description: GUID tying together every trace line produced while servicing one request
      ecs: trace.id
      status: mapped
      notes: >
        the correlation id shown on SharePoint error pages; in this feed it is
        already consolidated across every farm server in one database, so a
        single request pivots without joining per-server files
    - vendor: RowCreatedTime
      type: timestamp
      description: time the row was written into the logging database by the import job
      ecs: null
      status: unmapped
      custom: sharepoint.uls.row_created_time
      notes: >
        distinct from LogTime (the event time) - this is the import time and
        the natural high-water column for an incremental collector
