id: sharepoint-onprem
name: SharePoint Server (on-prem)
vendor: Microsoft
versions: SharePoint Server 2016, 2019, Subscription Edition
draft: true
references:
- >-
  https://learn.microsoft.com/en-us/previous-versions/office/sharepoint-server/ms453817(v=office.15)
- >-
  https://learn.microsoft.com/en-us/previous-versions/office/developer/sharepoint-2010/ms456618(v=office.14)
- >-
  https://learn.microsoft.com/en-us/sharepoint/administration/configure-diagnostic-logging
- https://learn.microsoft.com/en-us/sharepoint/administration/view-diagnostic-logs
- >-
  https://learn.microsoft.com/en-us/powershell/module/microsoft.sharepoint.powershell/get-splogevent
- >-
  https://www.microsoft.com/en-us/security/blog/2025/07/22/disrupting-active-exploitation-of-on-premises-sharepoint-vulnerabilities/
datasets:
- id: audit
  name: Site collection audit log
  description: >
    Item-level auditing events (open/view, update, delete, check-out/in,
    move/copy, permission and schema changes) recorded per site collection
    when auditing is switched on. Records land in the dbo.AuditData table of
    the site collection's content database; there is no stream or syslog
    emitter, so collection is a scheduled PULL — the Central Administration
    audit log reports, SPAudit.GetEntries via the SharePoint Management Shell,
    or a read-only view over AuditData. Auditing is OFF by default and is
    enabled per site collection, and the log records completed actions only:
    there are no failure or denied-access records here. This is the on-prem
    analogue of the SharePoint Online activity in the m365-ual map; the two do
    not share a schema.
  event_categories:
  - file
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        A Cribl Collector runs the audit export against the farm and hands the
        rows to the core worker group; the crossing shape is detailed in this
        dataset's relay recommendation.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-sharepoint_onprem.audit
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        A Cribl Collector runs the audit export against the farm and hands the
        rows to the core worker group.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-sharepoint_onprem.audit
  formats:
  - format: api-pull
    parsing:
      mechanism: cribl-pipeline
      artifact: custom SharePoint audit-export pipeline
      notes: >
        No Elastic integration covers on-prem SharePoint — the Microsoft 365
        and SharePoint Online integrations read the O365 Management Activity
        API, which does not exist on-prem — and there is no Cribl pack for
        AuditData, so this is a hand-built pipeline over the export rows.
    fields:
    - vendor: Occurred
      type: timestamp
      description: UTC date and time the audited event took place
      ecs: '@timestamp'
      status: mapped
      transform: >
        stored as a SQL datetime in UTC; convert to RFC3339 on export and do
        not re-interpret it in the farm's local timezone
    - vendor: Event
      type: integer
      description: SPAuditEventType enum value identifying the audited action
      ecs: event.code
      status: mapped
      notes: >
        numeric enum (CheckOut, CheckIn, View, Delete, Update, ChildDelete,
        SchemaChange, SecGroupCreate, AuditMaskChange, ...); needs a lookup
        table before it can drive a readable event.action
    - vendor: EventName
      type: string
      description: name of the audited event as a string
      ecs: event.action
      status: partial
      notes: >
        populated only for custom (SPAuditEventType.Custom) entries written by
        solutions; for built-in events it is empty and event.action has to be
        derived from the numeric Event enum instead
    - vendor: ItemType
      type: integer
      description: SPAuditItemType enum value for the kind of object acted on
      ecs: null
      status: unmapped
      custom: sharepoint.audit.item_type
      notes: >
        numeric enum (Site, Web, List, Folder, Document, ListItem, ...); it
        determines how DocLocation and ItemId should be read, so it must be
        resolved before either is trusted
    - vendor: ItemId
      type: string
      description: GUID of the list item, document, or object the event applies to
      ecs: null
      status: unmapped
      custom: sharepoint.audit.item_id
    - vendor: UserId
      type: integer
      description: site-collection member ID of the user who performed the action
      ecs: user.id
      status: partial
      notes: >
        an internal integer scoped to the site collection, not a SID or UPN;
        it must be resolved through the site's UserInfo list (or Get-SPUser)
        to populate user.name, and the same integer means different people in
        different site collections
    - vendor: DocLocation
      type: string
      description: location of the audited object at the time of the event
      ecs: file.path
      status: partial
      notes: >
        a site-relative URL (e.g. Shared Documents/report.docx), not a
        filesystem path; the site collection URL has to be prefixed before it
        resolves, and the value is also a natural fit for url.path
    - vendor: LocationType
      type: integer
      description: enum indicating how DocLocation should be interpreted
      ecs: null
      status: unmapped
      custom: sharepoint.audit.location_type
    - vendor: MachineIp
      type: ip
      description: IP address of the machine the audited event came from
      ecs: source.ip
      status: mapped
      notes: >
        the client address for UI-driven events; frequently empty for events
        raised through the object model or by timer jobs, so its absence is
        not evidence that the action was local
    - vendor: MachineName
      type: string
      description: name of the machine the audited event came from
      ecs: source.address
      status: partial
      notes: >
        usually empty on web-request-driven events, so it cannot be relied on
        as client identity; kept on source.address rather than host.name
        because host.* on this dataset belongs to the SharePoint server
    - vendor: SiteId
      type: string
      description: GUID of the site collection the event was recorded in
      ecs: null
      status: unmapped
      custom: sharepoint.audit.site_id
      notes: >
        the partition key for the whole dataset — auditing is enabled per site
        collection, so this is what tells you which scopes are actually
        reporting
    - vendor: EventSource
      type: integer
      description: >-
        SPAuditEventSource enum - whether the event was raised by user action
        or programmatically
      ecs: null
      status: unmapped
      custom: sharepoint.audit.event_source
      notes: >
        SharePoint = raised by user action through the UI, ObjectModel =
        raised programmatically; the UI/programmatic split is the primary
        triage signal for anomalous bulk reads or deletes, and no ECS field
        carries it
    - vendor: SourceName
      type: string
      description: name of the application or solution that raised an ObjectModel event
      ecs: null
      status: unmapped
      custom: sharepoint.audit.source_name
    - vendor: EventData
      type: string
      description: XML markup carrying detail specific to the event type
      ecs: null
      status: unmapped
      custom: sharepoint.audit.event_data
      notes: >
        per-event-type XML (e.g. old and new role definitions on a permission
        change, source and target on a move); unbounded free text and the main
        mapping-explosion and content-filter risk on this dataset
    - vendor: AppPrincipalId
      type: integer
      description: identifier of the app principal that acted on behalf of the user
      ecs: null
      status: unmapped
      custom: sharepoint.audit.app_principal_id
      notes: >
        non-zero when an add-in or app-only call performed the action rather
        than the user directly; worth alerting on for unexpected principals
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Run the export as a Cribl Collector with a checkpoint on Occurred
          and a dedupe key of (SiteId, Occurred, Event, UserId, ItemId),
          because a pull that overlaps its previous window will otherwise
          re-ingest whole hours of audit rows. Resolve the numeric enums and
          identities low-side with lookup files pulled from the same farm —
          Event and ItemType to readable action/object names, and UserId
          through the site collection's UserInfo list to a login name — since
          the UserId→login mapping is scoped to that site collection and is
          not reconstructable downstream. Parse EventData's XML into a small
          allow-listed set of keys (permission role before/after, target
          principal, new name) and truncate the remainder rather than
          forwarding the raw blob.
        elastic: >
          Own a custom logs-sharepoint_onprem.audit ingest pipeline: set
          event.action and event.category from the resolved Event enum, and
          set event.outcome to success explicitly for every record, since
          SharePoint audits completed actions only and a missing outcome would
          otherwise read as unknown across the whole dataset. Prefix the site
          collection URL onto DocLocation and copy the result to url.path
          alongside file.path so the site-relative value is actually
          resolvable. Add index-template mappings for the custom namespace —
          sharepoint.audit item_id, site_id, source_name and event_source as
          keyword, item_type/location_type/app_principal_id as long, and
          event_data as an ignore_above keyword so the XML blob cannot explode
          the mapping.
        relay: >
          For low-side farms, full ECS-shaped NDJSON crosses (envelope mode B)
          — one flattened audit row per line, UTF-8, LF-terminated,
          compression disabled, nesting depth 2 or less — because the UserId
          and enum resolutions can only be done next to the farm. The friction
          to settle with the guard owner is EventData and DocLocation:
          unbounded XML and user-supplied document titles in arbitrary
          unicode, which must be flattened to allow-listed keys and
          length-capped low-side so a custom NDJSON content filter stays
          simple. Nothing CEF-shaped crosses on this route — it is a
          pull/export, not syslog. With no return channel, treat the crossing
          as at-most-once, run the guard destination on Persistent Queue
          backpressure rather than Block, and reconcile low-side and high-side
          row counts per (site collection, hour); keep the raw exported row
          across the guard only until the enum lookups are proven.
      direct:
        parse_location: low
        cribl: >
          Run the export as a Cribl Collector with a checkpoint on Occurred
          and a dedupe key of (SiteId, Occurred, Event, UserId, ItemId),
          because a pull that overlaps its previous window will otherwise
          re-ingest whole hours of audit rows. Resolve the numeric enums and
          identities with lookup files pulled from the same farm — Event and
          ItemType to readable action/object names, and UserId through the
          site collection's UserInfo list to a login name — since the
          UserId→login mapping is scoped to that site collection and is not
          reconstructable downstream. Parse EventData's XML into a small
          allow-listed set of keys (permission role before/after, target
          principal, new name) and truncate the remainder rather than
          forwarding the raw blob.
        elastic: >
          Own a custom logs-sharepoint_onprem.audit ingest pipeline: set
          event.action and event.category from the resolved Event enum, and
          set event.outcome to success explicitly for every record, since
          SharePoint audits completed actions only and a missing outcome would
          otherwise read as unknown across the whole dataset. Prefix the site
          collection URL onto DocLocation and copy the result to url.path
          alongside file.path so the site-relative value is actually
          resolvable. Add index-template mappings for the custom namespace —
          sharepoint.audit item_id, site_id, source_name and event_source as
          keyword, item_type/location_type/app_principal_id as long, and
          event_data as an ignore_above keyword so the XML blob cannot explode
          the mapping.
  - format: jdbc-sql
    enable: >
      A direct SQL/JDBC read of the dbo.AuditData table in the site
      collection's content database (WSS_Content), rather than the
      object-model export. Auditing is still switched on per site collection;
      the same completed-action rows that SPAudit.GetEntries returns are
      persisted here, and a database collector can query them directly with a
      high-water mark on the Occurred column. The column set is fixed
      (Occurred, SiteId, ItemId, ItemType, UserId, AppPrincipalId,
      MachineName, MachineIp, DocLocation, LocationType, Event, EventName,
      EventSource, SourceName, EventData). Important: Microsoft does not
      support querying or modifying content databases directly - run the
      collector as a read-only login with READ UNCOMMITTED so it never takes
      locks that could stall the farm, and never write to the table (the
      farm's own audit-trimming timer job owns deletes). The UserId to login
      resolution still requires joining the same content database's UserInfo
      list, which is scoped to that one site collection, so it cannot be
      deferred downstream.
    references:
    - https://docs.nxlog.co/integrate/sharepoint.html
    - >-
      https://mikesdatawork.wordpress.com/2018/04/03/sql-cleanup-task-for-sharepoint-auditdata-table/
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        custom SharePoint AuditData SQL pipeline (Database Collector
        high-water read + enum/identity resolution + rename-to-ECS)
      notes: >
        There is no file or stream to tail and no Elastic integration or Cribl
        pack for on-prem AuditData - the O365 Management Activity API the
        M365/SharePoint Online integrations read does not exist on-prem.
        Collect with a Database Collector (or Elastic Agent SQL / Logstash
        JDBC input) that tracks a high-water mark on Occurred so a re-poll
        that overlaps its window does not re-ingest whole hours of rows. The
        columns arrive already typed, so no delimited parse is needed; the
        pipeline is enum/identity resolution followed by a column rename. The
        numeric Event and ItemType enums and the site-collection-scoped UserId
        must be resolved against lookup files pulled from the same farm before
        the rows are trustworthy.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Run the Database Collector low-side against the content database,
          checkpointing on Occurred with a dedupe key of (SiteId, Occurred,
          Event, UserId, ItemId) so an overlapping poll cannot duplicate rows.
          Resolve the numeric enums and identities next to the farm with
          lookup files pulled from the same content database - Event and
          ItemType to readable action and object names, and UserId through the
          site collection's UserInfo list to a login name - because the UserId
          to login mapping is scoped to that site collection and the same
          integer means different people in different collections. Parse
          EventData's XML into a small allow-listed set of keys (permission
          role before and after, target principal, new name) and truncate the
          remainder rather than forwarding the raw blob. Run the collector as
          a read-only login with READ UNCOMMITTED so the audit read never
          locks a production content DB, and hold the Elastic destination on
          Persistent Queue backpressure rather than Block.
        elastic: >
          Feed the resolved rows into the same custom
          logs-sharepoint_onprem.audit ingest pipeline the object-model export
          targets: set event.action and event.category from the resolved Event
          enum and set event.outcome to success explicitly for every record,
          since AuditData holds completed actions only and a missing outcome
          would read as unknown across the whole dataset. Prefix the site
          collection URL onto DocLocation and copy the result to url.path
          alongside file.path so the site-relative value resolves. Add
          index-template mappings for the custom namespace - sharepoint.audit
          item_id, site_id, source_name and event_source as keyword,
          item_type/location_type/app_principal_id as long, and event_data as
          an ignore_above keyword so the XML blob cannot explode the mapping.
          Because this is a direct table read rather than an object-model
          call, nothing about the ECS shape changes - the transport differs,
          not the target schema.
        relay: >
          For low-side farms, full ECS-shaped NDJSON crosses (envelope mode B)
          - one flattened audit row per line, UTF-8, LF-terminated,
          compression disabled, nesting depth 2 or less - because the UserId
          and enum resolutions can only be done next to the farm. The content
          database is itself a low-side asset: run the collector in that
          enclave and cross the resolved NDJSON rather than opening a SQL port
          across the guard. The friction to settle with the guard owner is
          EventData and DocLocation - unbounded XML and user-supplied document
          titles in arbitrary unicode - which must be flattened to
          allow-listed keys and length-capped low-side so a custom NDJSON
          content filter stays simple. Nothing CEF-shaped crosses on this
          route; it is a pull/export, not syslog. With no return channel treat
          the crossing as at-most-once, and reconcile low-side and high-side
          row counts per (site collection, hour) using Occurred.
      direct:
        parse_location: low
        cribl: >
          High-side farms collect the same way with no guard hops: a Database
          Collector against the content DB checkpointed on Occurred, with the
          enum and UserInfo resolution done next to the farm because it is
          site-collection-scoped and not reconstructable downstream. Keep the
          read-only READ UNCOMMITTED login and the Occurred high-water mark;
          with no guard in the path the resolved rows go straight to the core
          worker group.
        elastic: >
          Point the source at the same custom logs-sharepoint_onprem.audit
          pipeline: set event.action and event.category from the resolved
          Event enum, set event.outcome to success explicitly for every record
          since AuditData holds completed actions only, and prefix the site
          collection URL onto DocLocation, copying the result to url.path
          alongside file.path so the site-relative value resolves. Collection
          is over the Elastic Agent SQL input or Logstash JDBC directly
          against the content database.
    fields:
    - vendor: Occurred
      type: timestamp
      description: >-
        UTC date and time the audited event took place (datetime column, the
        collector's high-water key)
      ecs: '@timestamp'
      status: mapped
      transform: >
        stored as a SQL datetime in UTC; convert to RFC3339 on export and do
        not re-interpret it in the farm server's local timezone
    - vendor: SiteId
      type: string
      description: uniqueidentifier of the site collection the event was recorded in
      ecs: null
      status: unmapped
      custom: sharepoint.audit.site_id
      notes: >
        the partition key for the dataset - auditing is enabled per site
        collection, so this identifies which scopes are actually reporting and
        which content database the row came from
    - vendor: ItemId
      type: string
      description: uniqueidentifier of the list item, document, or object the event applies to
      ecs: null
      status: unmapped
      custom: sharepoint.audit.item_id
    - vendor: ItemType
      type: integer
      description: SPAuditItemType enum for the kind of object acted on
      ecs: null
      status: unmapped
      custom: sharepoint.audit.item_type
      notes: >
        numeric enum (Site, Web, List, Folder, Document, ListItem, ...); it
        governs how DocLocation and ItemId should be read, so it must be
        resolved before either is trusted
    - vendor: UserId
      type: integer
      description: site-collection member id of the user who performed the action
      ecs: user.id
      status: partial
      notes: >
        an internal integer scoped to the site collection, not a SID or UPN;
        resolve it through the same content database's UserInfo list to
        populate user.name - the same integer means different people in
        different site collections
    - vendor: AppPrincipalId
      type: integer
      description: identifier of the app principal that acted on behalf of the user
      ecs: null
      status: unmapped
      custom: sharepoint.audit.app_principal_id
      notes: >
        non-zero when an add-in or app-only call performed the action rather
        than the user directly; worth alerting on for unexpected principals
    - vendor: MachineName
      type: string
      description: name of the machine the audited event came from
      ecs: source.address
      status: partial
      notes: >
        usually empty on web-request-driven events, so it cannot be relied on
        as client identity; kept on source.address rather than host.name
        because host.* here belongs to the SharePoint server
    - vendor: MachineIp
      type: ip
      description: IP address of the machine the audited event came from
      ecs: source.ip
      status: mapped
      notes: >
        the client address for UI-driven events; frequently empty for events
