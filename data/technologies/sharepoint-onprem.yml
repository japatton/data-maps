- id: uls
  name: ULS diagnostic trace log
  description: >
    Unified Logging Service trace log — tab-delimited files written locally on
    every server in the farm as HOSTNAME-YYYYMMDD-HHMM.log, read with
    Get-SPLogEvent or tailed by a file-based agent. This is operational
    diagnostic telemetry, not an audit trail: it records what SharePoint code
    did, with no notion of an actor performing an action on an object. It
    earns SOC attention because unhandled deserialization and web-part loading
    errors surface here during on-prem SharePoint exploitation. IIS request
    logging for the SharePoint web front ends is covered by the iis map and is
    deliberately not duplicated here.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Tab-delimited flat files collected from each farm server; same path as
        the audit dataset above.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-sharepoint_onprem.uls
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Tab-delimited flat files collected from each farm server; same path as
        the audit dataset above.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-sharepoint_onprem.uls
  formats:
  - format: other
    parsing:
      mechanism: cribl-pipeline
      artifact: custom ULS tab-delimited pipeline
      notes: >
        No Elastic integration or Cribl pack parses ULS; the format is a fixed
        tab-delimited column set with a repeated header block per file, so a
        hand-built delimited-parse pipeline is the realistic mechanism.
    fields:
    - vendor: Timestamp
      type: timestamp
      description: date and time the trace line was written, to sub-second precision
      ecs: '@timestamp'
      status: mapped
      transform: >
        written in the server's local time as MM/DD/YYYY HH:MM:SS.ff; convert
        to UTC using the farm server's offset before indexing
    - vendor: Process
      type: string
      description: host executable that emitted the line, with its process id in hex
      ecs: process.name
      status: partial
      notes: >
        composite value of the form "w3wp.exe (0x1A2C)"; the trailing hex
        process id must be split out into process.pid before process.name is
        clean
    - vendor: TID
      type: string
      description: id of the thread on that process which emitted the line
      ecs: process.thread.id
      status: mapped
      transform: written as a hex string (e.g. 0x1F40); convert to an integer
    - vendor: Area
      type: string
      description: SharePoint component or service application that generated the event
      ecs: null
      status: unmapped
      custom: sharepoint.uls.area
      notes: >
        e.g. SharePoint Foundation, SharePoint Server Search; Area is also the
        unit that diagnostic-logging event throttling is configured against,
        so it determines what is present at all
    - vendor: Category
      type: string
      description: subcategory within the Area, e.g. Topology or Claims Authentication
      ecs: log.logger
      status: partial
      notes: >
        log.logger carries the Area/Category pair concatenated; Area is kept
        as a custom field as well so it stays filterable on its own
    - vendor: EventID
      type: string
      description: short ULS event tag identifying the message template
      ecs: event.code
      status: mapped
      notes: >
        a four-character alphanumeric tag such as 8e2s — not a Windows event
        id and not numeric, so it must be mapped as keyword
    - vendor: Level
      type: enum
      description: trace severity - Unexpected, Monitorable, High, Medium, Verbose, VerboseEx
      ecs: log.level
      status: mapped
      notes: >
        the ULS scale is not syslog severity and does not sort naturally:
        Unexpected and Monitorable are the most severe while High and Medium
        are routine, so a lookup is required to derive event.severity
    - vendor: Message
      type: string
      description: descriptive text of the trace event, including stack detail on errors
      ecs: message
      status: mapped
      notes: >
        free text that can exceed the ULS per-line limit and be split across
        continuation rows, so it must be reassembled before it is complete
    - vendor: Correlation
      type: string
      description: GUID tying together every trace line produced while servicing one request
      ecs: trace.id
      status: mapped
      notes: >
        the correlation id shown on SharePoint error pages; the only join key
        between front-end and service-application lines and across farm
        servers
    - vendor: Continuation
      type: boolean
      description: flag marking a row as the continuation of an over-length previous row
      ecs: null
      status: unmapped
      custom: sharepoint.uls.continuation
      notes: >
        exposed by Get-SPLogEvent; kept so that reassembled messages can be
        distinguished from single-row ones after the low-side join
    - vendor: log file name (HOSTNAME-YYYYMMDD-HHMM.log)
      type: string
      description: farm server that produced the trace file, taken from the filename
      ecs: host.name
      status: partial
      notes: >
        ULS lines carry no server column, so the emitting host is only
        available from the log filename and must be stamped at collection time
        or it is lost
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse the tab-delimited columns at the collector, drop the repeated
          per-file header rows, and stamp host.name from the HOSTNAME portion
          of the log filename since no per-line server column exists — none of
          this is recoverable downstream once the file boundary is lost.
          Reassemble ULS continuation lines (long messages are split across
          rows) by Correlation plus Process and TID before forwarding, and
          hold volume down with a low-side Level and Area filter rather than
          shipping Verbose/VerboseEx farm-wide; gate the output with
          C.Schema(...).validate plus a dead-letter route, because a
          hand-built delimited parser silently misaligns when Microsoft adds a
          column.
        elastic: >
          Own a custom logs-sharepoint_onprem.uls ingest pipeline that
          converts the ULS Level enum to numeric event.severity through an
          explicit lookup — the ULS scale is not syslog severity, and
          High/Medium are less severe than Unexpected/Monitorable, so a naive
          string sort inverts it — and that splits the composite Process value
          into process.name and process.pid. Map sharepoint.uls.area and
          .category as keyword and .continuation as boolean in the index
          template, and keep Correlation on trace.id so a single request can
          be pivoted across servers. For ToolShell-era detection
          (CVE-2025-53770 and the related ToolPane.aspx chain), pair this
          dataset with the iis map rather than expecting it to stand alone:
          the suspicious POST to /_layouts/*/ToolPane.aspx with a SignOut.aspx
          referer and the retrieval of a dropped webshell such as
          spinstall0.aspx are IIS-side, while ULS carries the deserialization
          and web-part load errors around them, and neither the webshell file
          drop into the on-disk LAYOUTS directory nor the failed request
          appears in the site collection audit log at all.
