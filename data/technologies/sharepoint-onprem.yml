    - vendor: DocLocation
      type: string
      description: location of the audited object at the time of the event
      ecs: file.path
      status: partial
      notes: >
        a site-relative URL (e.g. Shared Documents/report.docx), not a
        filesystem path; the site collection URL must be prefixed before it
        resolves, and the value is also a natural fit for url.path
    - vendor: LocationType
      type: integer
      description: enum indicating how DocLocation should be interpreted
      ecs: null
      status: unmapped
      custom: sharepoint.audit.location_type
    - vendor: Event
      type: integer
      description: SPAuditEventType enum value identifying the audited action
      ecs: event.code
      status: mapped
      notes: >
        numeric enum (CheckOut, CheckIn, View, Delete, Update, ChildDelete,
        SchemaChange, SecGroupCreate, AuditMaskChange, ...); needs a lookup
        table before it can drive a readable event.action
    - vendor: EventName
      type: string
      description: name of the audited event as a string
      ecs: event.action
      status: partial
      notes: >
        populated only for custom (SPAuditEventType.Custom) entries written by
        solutions; for built-in events it is empty and event.action has to be
        derived from the numeric Event enum instead
    - vendor: EventSource
      type: integer
      description: >-
        SPAuditEventSource enum - whether the event was raised by user action
        or programmatically
      ecs: null
      status: unmapped
      custom: sharepoint.audit.event_source
      notes: >
        SharePoint = raised by user action through the UI, ObjectModel =
        raised programmatically; the UI/programmatic split is the primary
        triage signal for anomalous bulk reads or deletes, and no ECS field
        carries it
    - vendor: SourceName
      type: string
      description: name of the application or solution that raised an ObjectModel event
      ecs: null
      status: unmapped
      custom: sharepoint.audit.source_name
    - vendor: EventData
      type: string
      description: XML markup carrying detail specific to the event type
      ecs: null
      status: unmapped
      custom: sharepoint.audit.event_data
      notes: >
        per-event-type XML (e.g. old and new role definitions on a permission
        change, source and target on a move); unbounded free text and the main
