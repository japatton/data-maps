id: windows
name: Windows
vendor: Microsoft
versions: Windows Server 2019, Windows Server 2022, Windows 10/11
draft: true
references:
- https://www.elastic.co/docs/reference/integrations/windows
- https://www.elastic.co/docs/reference/integrations/system
- >-
  https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-audit-policy-settings
datasets:
- id: security
  name: Security event log
  description: >-
    authentication, logon/logoff, and account/group management events
    (Security channel)
  event_categories:
  - authentication
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        The Elastic Agent reads the Security channel through the System
        integration and ships to Cribl.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.security
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        The Elastic Agent reads the Security channel through the System
        integration and ships to Cribl.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.security
  formats:
  - format: windows-event
    parsing:
      mechanism: elastic-integration
      artifact: System integration (winlog input, Security channel)
      notes: >
        The Elastic System integration - not the Windows integration - owns
        the Security channel; there is no logs-windows.security data stream.
        Events delivered by Windows Event Forwarding instead land in
        logs-windows.forwarded, which re-invokes a trimmed copy of the same
        pipelines and loses some categorization. Every EventData element
        listed below is preserved verbatim at winlog.event_data.<XmlName> in
        addition to any ECS mapping, so the custom names given here are our
        normalized aliases, not a second copy.
    fields:
    - vendor: EventID
      type: integer
      description: numeric identifier of the audit event, e.g. 4624/4625/4688
      ecs: event.code
      status: mapped
    - vendor: Computer
      type: string
      description: hostname of the computer that recorded the event
      ecs: host.name
      status: mapped
    - vendor: SubjectUserName
      type: string
      description: account name of the subject that requested the logon or action
      ecs: user.name
      status: partial
      custom: winlog.event_data.SubjectUserName
      notes: >-
        branches by event id. On the account- and group-management ids
        (4720/4722/4725/4726/4738, 4728/4729/4732/4733/4756) the subject is
        the administrator or process making the change and owns user.name. On
        4624/4625 the subject is only the account that requested the logon —
        typically SYSTEM or the machine account — so it is withheld from
        user.name there, where the account that authenticated owns it; on
        those ids the value is appended to related.user and otherwise stays at
        winlog.event_data.SubjectUserName.
    - vendor: SubjectUserSid
      type: string
      description: security identifier (SID) of the subject account
      ecs: user.id
      status: partial
      custom: winlog.event_data.SubjectUserSid
      notes: >-
        follows SubjectUserName's branch — on the account- and
        group-management ids (4720/4722/4725/4726/4738,
        4728/4729/4732/4733/4756) the subject owns user.* and this is the
        rename-stable identifier behind user.name, so it takes user.id. On
        4624/4625 it is withheld from user.id, which TargetUserSid holds for
        the account that authenticated, and stays at
        winlog.event_data.SubjectUserSid.
    - vendor: SubjectDomainName
      type: string
      description: domain or computer name of the subject account
      ecs: user.domain
      status: partial
      custom: winlog.event_data.SubjectDomainName
      notes: >-
        follows SubjectUserName's branch — user.domain on the account- and
        group-management ids, withheld on 4624/4625 where TargetDomainName
        holds it. For a local account on a member host the element carries the
        computer name rather than a directory domain, so pair it with
        SubjectUserSid before treating the value as a domain.
    - vendor: TargetUserName
      type: string
      description: >-
        name of the object the logon or account-management action was
        performed for — the account that authenticated on 4624/4625, the
        account acted on for user-account management, but the GROUP name on
        4728/4729/4732/4733/4756
      ecs: user.name
      status: partial
      notes: >-
        the sharpest mapping hazard in this dataset — one element carrying
        three identities. On 4624/4625 it is the account the logon was
        performed for and owns user.name. On 4720/4722/4725/4726/4738 it is
        the account acted on and belongs in user.target.name, with the
        administrator in SubjectUserName holding user.name. On the
        group-membership ids the element still called TargetUserName holds a
        group name and belongs in group.name / user.target.group.name, not in
        any user.* name field.
    - vendor: TargetDomainName
      type: string
      description: >-
        domain or computer name of the target account, or of the group on the
        group-membership events
      ecs: user.domain
      status: partial
      notes: >-
        follows TargetUserName's branch — user.domain on 4624/4625,
        user.target.domain on the user-account-management ids, group.domain /
        user.target.group.domain on 4728/4729/4732/4733/4756
    - vendor: TargetUserSid
      type: string
      description: >-
        security identifier (SID) of the target account, or of the group on
        the group-membership events
      ecs: user.id
      status: partial
      notes: >-
        follows TargetUserName's branch — user.id on 4624/4625, group.id /
        user.target.group.id on 4728/4729/4732/4733/4756. The
        user-account-management events carry the target SID as TargetSid
        rather than TargetUserSid, so a rule keyed on this element alone
        misses them.
    - vendor: IpAddress
      type: ip
      description: IPv4/IPv6 address of the machine the logon attempt came from
      ecs: source.ip
      status: mapped
    - vendor: IpPort
      type: port
      description: source port of the remote logon attempt, 0 for interactive logons
      ecs: source.port
      status: mapped
    - vendor: LogonType
      type: integer
      description: UInt32 code for the type of logon performed
      ecs: null
      status: unmapped
      custom: winlog.event_data.LogonType
      notes: >-
        numeric logon type (2=interactive, 3=network, 10=RDP, etc.); no ECS
        logon-type field, kept for triage
    - vendor: Status
      type: string
      description: NTSTATUS reason code for the logon failure, rendered as hex (HexInt32)
      ecs: null
      status: partial
      custom: winlog.event_data.Status
      notes: >-
        hex NTSTATUS/failure code; needs a lookup table to derive a clean
        event.outcome value for logon failures
    - vendor: SubStatus
      type: string
      description: additional NTSTATUS detail about the failure, rendered as hex (HexInt32)
      ecs: null
      status: partial
      custom: winlog.event_data.SubStatus
      notes: secondary hex status code refining Status, same lookup-table gap
    - vendor: ProcessName
      type: string
      description: full path and name of the executable for the process involved in the event
      ecs: process.executable
      status: mapped
    - vendor: WorkstationName
      type: string
      description: machine name from which the logon attempt was performed
      ecs: null
      status: unmapped
      custom: winlog.event_data.WorkstationName
    - vendor: AuthenticationPackageName
      type: string
      description: authentication package used for the logon (NTLM, Kerberos, Negotiate)
      ecs: null
      status: unmapped
      custom: winlog.event_data.AuthenticationPackageName
    - vendor: MemberName
      type: string
      description: distinguished name of the account added to or removed from the group
      ecs: user.target.name
      status: partial
      custom: winlog.event_data.MemberName
      transform: >-
        rendered as a distinguished name (CN=Jane
        Doe,OU=Users,DC=example,DC=com), so the CN has to be extracted before
        it matches the bare account names every other identity field in this
        dataset carries; keep the full DN at winlog.event_data.MemberName,
        since the OU path is the only organisational context the record
        carries
      notes: >-
        the account added to or removed from a security-enabled group
        (4728/4729/4732/4733/4756), and the only element naming the party
        acted upon on those ids — the element still called TargetUserName
        holds the GROUP name there. This is the dataset's producer for
        user.target.name, which its iam alerting profile requires; on the
        account-management ids (4720/4722/4725/4726/4738) the target-side
        identity branches off TargetUserName instead, as that row records.
    - vendor: MemberSid
      type: string
      description: security identifier (SID) of the account added to or removed from the group
      ecs: null
      status: unmapped
      custom: winlog.event_data.MemberSid
    - vendor: Keywords
      type: string
      description: hex keyword bitmask (HexInt64) carrying the audit-success/audit-failure flag
      ecs: event.outcome
      status: mapped
      transform: >
        the event's audit-success/audit-failure keyword bitmask is translated
        to success/failure; this is the actual source of event.outcome for
        this dataset, not any single vendor column
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the core worker group as a pass-through for this route — no
          low-side field extraction, and carry the full rendered event XML in
          _raw end-to-end because Security-channel events are forensically
          load-bearing. Limit low-side work to Persistent Queue backpressure
          on the Elastic destination and host-context enrichment (host→site,
          host→owner) that is cheaper near the source than in an ingest
          pipeline.
        elastic: >
          The stock System integration ingest pipeline is the parser; layer a
          logs-system.security@custom pipeline that resolves the hex NTSTATUS
          Status/SubStatus codes through a lookup/enrich table into a readable
          failure reason and confirms event.outcome is driven off the
          audit-success/audit-failure Keywords bitmask rather than any single
          column. Write detection content against the identity branch the
          field list documents rather than against a single column: on
          4624/4625 user.name/user.domain/user.id carry
          TargetUserName/TargetDomainName/TargetUserSid — the account that
          authenticated — while SubjectUserName is the requesting account,
          usually SYSTEM or the machine account; on the
          user-account-management ids
          SubjectUserName/SubjectDomainName/SubjectUserSid hold
          user.name/user.domain/user.id and the target moves to user.target.*;
          and on 4728/4729/4732/4733/4756 TargetUserName is a group name bound
          for group.name and user.target.group.name. Add explicitly typed
          custom-namespace index-template mappings for the PascalCase
          winlog.event_data.* fields the map carries — SubjectUserName,
          SubjectUserSid, SubjectDomainName, LogonType, WorkstationName,
          AuthenticationPackageName, MemberName, MemberSid — so they stay
          queryable instead of relying on dynamic mapping. Mirror the same
          @custom logic onto logs-windows.forwarded for any hosts that arrive
          by Windows Event Forwarding.
      direct:
        parse_location: high
        cribl: >
          Keep the core worker group as a pass-through for this route — no
          edge-side field extraction, and carry the full rendered event XML in
          _raw end-to-end because Security-channel events are forensically
          load-bearing. Limit edge-side work to Persistent Queue backpressure
          on the Elastic destination and host-context enrichment (host→site,
          host→owner) that is cheaper near the source than in an ingest
          pipeline.
        elastic: >
          The stock System integration ingest pipeline is the parser; layer a
          logs-system.security@custom pipeline that resolves the hex NTSTATUS
          Status/SubStatus codes through a lookup/enrich table into a readable
          failure reason and confirms event.outcome is driven off the
          audit-success/audit-failure Keywords bitmask rather than any single
          column. Write detection content against the identity branch the
          field list documents rather than against a single column: on
          4624/4625 user.name/user.domain/user.id carry
          TargetUserName/TargetDomainName/TargetUserSid — the account that
          authenticated — while SubjectUserName is the requesting account,
          usually SYSTEM or the machine account; on the
          user-account-management ids
          SubjectUserName/SubjectDomainName/SubjectUserSid hold
          user.name/user.domain/user.id and the target moves to user.target.*;
          and on 4728/4729/4732/4733/4756 TargetUserName is a group name bound
          for group.name and user.target.group.name. Add explicitly typed
          custom-namespace index-template mappings for the PascalCase
          winlog.event_data.* fields the map carries — SubjectUserName,
          SubjectUserSid, SubjectDomainName, LogonType, WorkstationName,
          AuthenticationPackageName, MemberName, MemberSid — so they stay
          queryable instead of relying on dynamic mapping. Mirror the same
          @custom logic onto logs-windows.forwarded for any hosts that arrive
          by Windows Event Forwarding.
- id: sysmon
  name: Sysmon operational log
  description: >-
    Sysinternals Sysmon process, network, and file-system telemetry
    (Microsoft-Windows-Sysmon/Operational channel)
  event_categories:
  - process
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-windows.sysmon_operational
    direct:
    - hop: cribl
      location: edge worker group
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-windows.sysmon_operational
  formats:
  - format: windows-event
    parsing:
      mechanism: elastic-integration
      artifact: Windows integration
    fields:
    - vendor: Image
      type: string
      description: full path of the process image
      ecs: process.executable
      status: mapped
    - vendor: CommandLine
      type: string
      description: full command line the process was launched with
      ecs: process.command_line
      status: mapped
    - vendor: ParentImage
      type: string
      description: full path of the parent process image
      ecs: process.parent.executable
      status: mapped
    - vendor: ParentCommandLine
      type: string
      description: full command line of the parent process
      ecs: process.parent.command_line
      status: mapped
    - vendor: ParentProcessId
      type: integer
      description: UInt32 process id of the parent process
      ecs: process.parent.pid
      status: mapped
    - vendor: User
      type: string
      description: domain and account name the process runs as
      ecs: user.name
      status: partial
      transform: >-
        arrives as DOMAIN\user (e.g. NT AUTHORITY\SYSTEM) and must be split on
        the backslash into user.domain plus user.name before the account leaf
        behaves as a login name; unqualified local accounts appear without a
        domain component
    - vendor: ProcessGuid
      type: string
      description: GUID uniquely identifying the process across reboots
      ecs: process.entity_id
      status: mapped
    - vendor: ProcessId
      type: integer
      description: UInt32 process id assigned by Windows
      ecs: process.pid
      status: mapped
    - vendor: Hashes
      type: string
      description: >-
        comma-separated list of hashes of the image file, per the Sysmon
        HashAlgorithms setting
      ecs: process.hash.sha256
      status: partial
      notes: >
        single field holding "SHA1=...,MD5=...,SHA256=...,IMPHASH=..."; needs
        splitting into individual hash fields before the SHA-256 component can
        be reliably extracted
    - vendor: UtcTime
      type: timestamp
      description: UTC time Sysmon recorded the event
      ecs: '@timestamp'
      status: partial
      notes: >
        nominally maps to @timestamp, but the ingest pipeline already derives
        @timestamp from the event envelope on arrival; this raw field is
        retained for drift-checking against forwarding delay, not as the
        mapping source
    - vendor: RuleName
      type: string
      description: name/tag of the Sysmon config rule that matched
      ecs: null
      status: unmapped
      custom: sysmon.rule_name
      notes: name of the Sysmon config rule that produced the event
    - vendor: IntegrityLevel
      type: string
      description: integrity level the process runs at (Low, Medium, High, System)
      ecs: null
      status: unmapped
      custom: sysmon.integrity_level
    - vendor: OriginalFileName
      type: string
      description: original filename from the PE version resource of the image
      ecs: process.pe.original_file_name
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass Sysmon events through the core worker group unparsed and keep
          _raw intact — process/network telemetry is the highest-value
          forensic artifact on this route, so it is the last place to drop
          raw. Use Persistent Queue backpressure on the Elastic destination,
          and if volume becomes a problem shape it with event-type filters
          driven by the Sysmon config rather than by trimming fields in Cribl.
        elastic: >
          Let the Windows integration's sysmon_operational ingest pipeline
          parse, and add a logs-windows.sysmon_operational@custom pipeline
          that splits the composite Hashes string into per-algorithm fields
          (process.hash.md5, .sha1, .sha256, plus imphash) instead of
          pattern-matching SHA-256 out of the concatenated value. Have the
          same pipeline split the DOMAIN\user value in User on the backslash
          into user.domain and user.name, since the composite string does not
          satisfy the user.name this dataset's process alerting profile
          requires. Keep @timestamp derived from the event envelope and retain
          UtcTime only as a forwarding-delay drift check, and map
          sysmon.rule_name and sysmon.integrity_level as keyword in the
          custom-namespace index template.
      direct:
        parse_location: high
        cribl: >
          Pass Sysmon events through the core worker group unparsed and keep
          _raw intact — process/network telemetry is the highest-value
          forensic artifact on this route, so it is the last place to drop
          raw. Use Persistent Queue backpressure on the Elastic destination,
          and if volume becomes a problem shape it with event-type filters
          driven by the Sysmon config rather than by trimming fields in Cribl.
        elastic: >
          Let the Windows integration's sysmon_operational ingest pipeline
          parse, and add a logs-windows.sysmon_operational@custom pipeline
          that splits the composite Hashes string into per-algorithm fields
          (process.hash.md5, .sha1, .sha256, plus imphash) instead of
          pattern-matching SHA-256 out of the concatenated value. Have the
          same pipeline split the DOMAIN\user value in User on the backslash
          into user.domain and user.name, since the composite string does not
          satisfy the user.name this dataset's process alerting profile
          requires. Keep @timestamp derived from the event envelope and retain
          UtcTime only as a forwarding-delay drift check, and map
          sysmon.rule_name and sysmon.integrity_level as keyword in the
          custom-namespace index template.
- id: system
  name: System event log
  description: >-
    thin starter — service start/stop, driver load, and OS-level events
    (System channel)
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.system
    direct:
    - hop: cribl
      location: edge worker group
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.system
  formats:
  - format: windows-event
    parsing:
      mechanism: elastic-integration
      artifact: System integration (winlog input, System channel)
      notes: >
        The Elastic System integration - not the Windows integration - owns
        the System channel; there is no logs-windows.system data stream.
        Events delivered by Windows Event Forwarding instead land in
        logs-windows.forwarded.
    fields:
    - vendor: EventID
      type: integer
      description: numeric identifier of the System-channel event
      ecs: event.code
      status: mapped
    - vendor: Computer
      type: string
      description: hostname of the computer that recorded the event
      ecs: host.name
      status: mapped
    - vendor: ProviderName
      type: string
      description: name of the event provider that raised the event
      ecs: null
      status: unmapped
      custom: winlog.provider_name
    - vendor: Level
      type: enum
      description: >-
        event severity level - Critical, Error, Warning, Information
        (win:UInt8 in the raw XML)
      ecs: event.severity
      status: partial
      notes: >-
        Windows severity levels (Critical/Error/Warning/Information) need a
        lookup to ECS's numeric scale
    - vendor: Message
      type: string
      description: rendered human-readable event message text
      ecs: message
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep this channel as an unparsed pass-through on the core worker
          group with Persistent Queue backpressure on the Elastic destination.
          System events are lower forensic value than Security/Sysmon, so this
          is the first Windows dataset where dropping _raw after the
          integration parser is proven is acceptable, and the first candidate
          for provider-based noise suppression low-side.
        elastic: >
          The System integration ingest pipeline parses this channel; add a
          logs-system.system@custom pipeline that converts the Windows Level
          enum (Critical/Error/Warning/Information) into ECS's numeric
          event.severity via an explicit lookup rather than leaving the raw
          label, and set event.kind/event.category consistently for
          service-start/stop and driver-load codes. Map winlog.provider_name
          as keyword in the index template so provider-scoped dashboards and
          filters work without dynamic mapping.
      direct:
        parse_location: high
        cribl: >
          Keep this channel as an unparsed pass-through on the core worker
          group with Persistent Queue backpressure on the Elastic destination.
          System events are lower forensic value than Security/Sysmon, so this
          is the first Windows dataset where dropping _raw after the
          integration parser is proven is acceptable, and the first candidate
          for provider-based noise suppression at the edge worker group.
        elastic: >
          The System integration ingest pipeline parses this channel; add a
          logs-system.system@custom pipeline that converts the Windows Level
          enum (Critical/Error/Warning/Information) into ECS's numeric
          event.severity via an explicit lookup rather than leaving the raw
          label, and set event.kind/event.category consistently for
          service-start/stop and driver-load codes. Map winlog.provider_name
          as keyword in the index template so provider-scoped dashboards and
          filters work without dynamic mapping.
- id: application
  name: Application event log
  description: thin starter — application-emitted events (Application channel)
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.application
    direct:
    - hop: cribl
      location: edge worker group
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-system.application
  formats:
  - format: windows-event
    parsing:
      mechanism: elastic-integration
      artifact: System integration (winlog input, Application channel)
      notes: >
        The Elastic System integration - not the Windows integration - owns
        the Application channel; there is no logs-windows.application data
        stream. Events delivered by Windows Event Forwarding instead land in
        logs-windows.forwarded.
    fields:
    - vendor: EventID
      type: integer
      description: numeric identifier of the Application-channel event
      ecs: event.code
      status: mapped
    - vendor: Computer
      type: string
      description: hostname of the computer that recorded the event
      ecs: host.name
      status: mapped
    - vendor: Source
      type: string
      description: name of the application or service that emitted the event
      ecs: null
      status: unmapped
      custom: winlog.provider_name
      notes: originating application/service name
    - vendor: Message
      type: string
      description: rendered human-readable event message text
      ecs: message
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Pass-through on the core worker group with Persistent Queue
          backpressure; do no low-side extraction. This is the highest-volume,
          lowest-forensic-value Windows channel, so it is the first place to
          drop _raw once the integration parser is proven and the best
          candidate for a low-side allow-list of provider names worth
          forwarding at all.
        elastic: >
          Parse with the stock System integration pipeline and add a
          logs-system.application@custom pipeline that normalizes the
          Application-channel Source value into winlog.provider_name
          consistently with the System channel, so both datasets can be
          filtered by one field. Map winlog.provider_name as keyword in the
          custom-namespace index template, and treat this thin starter's
          remaining coverage (level, outcome, per-provider event codes) as
          follow-on mapping work before it leaves draft.
      direct:
        parse_location: high
        cribl: >
