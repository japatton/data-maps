id: forcepoint-web
name: Forcepoint Web Security
vendor: Forcepoint
versions: 8.5, 8.5.3, 8.5.4, 8.5.5 (on-prem); Web Security Cloud / Cloud Security Gateway
draft: true
references:
- https://help.forcepoint.com/websec/en-us/on-prem/85/siem/
- >-
  https://help.forcepoint.com/websec/en-us/on-prem/85/siem/B2E5849B-47DA-4FEA-B89B-4647084E4ECC.html
- >-
  https://help.forcepoint.com/websec/en-us/on-prem/85/siem/B180CA52-DB55-4DCD-A393-2F3DE855CFC8.html
- >-
  https://help.forcepoint.com/websec/en-us/on-prem/85/siem/5EA353E4-BD6A-4DB1-9F1A-BB8AFA6A328E.html
- >-
  https://help.forcepoint.com/websec/en-us/on-prem/85/siem/494CD315-257B-47EE-81DE-74A93F6F5B53.html
- >-
  https://help.forcepoint.com/websec/en-us/on-prem/85/siem/7CA7B176-BD96-48A2-802A-95F7B8D3DB8F.html
- >-
  https://help.forcepoint.com/websec/en-us/on-prem/85/web_admin_guide/guid-9bac8092-5dcf-49ae-bb18-20b624f70d0e.html
- >-
  https://help.forcepoint.com/websec/en-us/cloud/siem_guide/1414df42-25b8-4bc0-9977-19b7e7ff92b9.html
- https://www.elastic.co/docs/reference/integrations/forcepoint_web
- https://github.com/elastic/integrations/tree/main/packages/forcepoint_web
datasets:
- id: web-transaction
  name: Internet activity (web transaction) log
  description: >
    One record per web request handled by Filtering Service / Content Gateway,
    carrying the requested URL, the URL Database category, the policy that
    matched, and the disposition (permitted/blocked) that was applied. This is
    the high-volume proxy/URL-filtering stream and the primary reason a SOC
    ingests this product. Records leave Filtering Service via the Multiplexer,
    which forwards them to the SIEM Integration target in syslog/CEF
    (ArcSight), syslog/key-value (Splunk), syslog/LEEF (QRadar), or a custom
    format string; the CEF form is modelled here because it is what the legacy
    ArcSight deployment already emits. Product note: this is the former
    Websense Web Security Gateway (TRITON suite), so asset inventories,
    connector names, and older runbooks may still say "Websense". Field names
    below are the CEF extension keys from the predefined format string, with
    the underlying Forcepoint internal key in parentheses.
  event_categories:
  - web
  - network
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Receives the Multiplexer's syslog/CEF stream (UDP or TCP, configured
        on Settings > General > SIEM Integration) on the Cribl Syslog source.
        Proxy logs carry full user-supplied URLs and User-Agent strings that
        the cross-domain content inspector will want to constrain on the
        low-side crossing.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_web.transaction
      notes: >
        Custom data stream — the shipped Elastic integration only defines
        forcepoint_web.logs for the file/CSV input, not for the syslog/CEF
        feed.
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Receives the Multiplexer's syslog/CEF stream (UDP or TCP, configured
        on Settings > General > SIEM Integration) on the Cribl Syslog source
        and forwards it straight to the core worker group.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_web.transaction
      notes: >
        Custom data stream — the shipped Elastic integration only defines
        forcepoint_web.logs for the file/CSV input, not for the syslog/CEF
        feed.
  formats:
  - format: syslog-cef
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Forcepoint CEF pipeline
      notes: >
        No vendor-specific Cribl pack exists for Forcepoint Web Security. Plan
        is a Cribl pipeline built on the generic CEF parser (the Cribl Pack
        for Syslog Input handles the syslog framing), plus three lookup files
        derived from the vendor reference tables: disposition number, category
        number, and category reason code. The legacy ArcSight SmartConnector
        used this same predefined CEF string, so the ArcSight-era field names
        carry over one-for-one. Note the rt (time) key is epoch seconds in
        v8.5 and epoch milliseconds from v8.5.3 onward — the pipeline must
        branch on productVersion before deriving @timestamp, and
        logRecordSource (OnPrem/Hybrid) should be kept to tell appliance
        traffic from SIEMConnector-relayed hybrid traffic.
    fields:
    - vendor: src (source)
      type: ip
      description: IPv4 or IPv6 address of the client machine that made the request.
      ecs: source.ip
      status: mapped
    - vendor: spt (clientSourcePort)
      type: port
      description: Source port of the client connection to the proxy.
      ecs: source.port
      status: mapped
    - vendor: dst (destination)
      type: ip
      description: >-
        Translated address of the destination machine, resolved by DNS from
        the requested URL.
      ecs: destination.ip
      status: mapped
    - vendor: dpt (port)
      type: port
      description: TCP port of the origin server.
      ecs: destination.port
      status: mapped
    - vendor: dhost (urlHost)
      type: string
      description: Host (domain) portion of the requested URL.
      ecs: url.domain
      status: mapped
    - vendor: request (url)
      type: string
      description: Full requested URL, without the protocol scheme or port.
      ecs: url.original
      status: partial
      notes: >
        The vendor strips the scheme and port, so url.original is not a
        round-trippable URL; the ingest pipeline has to re-attach a scheme
        inferred from the protocol key before url.full, url.path, and
        url.query can be parsed out.
    - vendor: requestMethod (method)
      type: enum
      description: HTTP method associated with the request (GET, POST, PUT, ...).
      ecs: http.request.method
      status: mapped
    - vendor: requestClientApplication (userAgent)
      type: string
      description: Contents of the User-Agent request header, when present.
      ecs: user_agent.original
      status: mapped
    - vendor: suser (userPath)
      type: string
      description: >-
        Directory path of the user the policy was applied to — NameSpace,
        Domain, and UserName components.
      ecs: user.name
      status: partial
      transform: >
        emitted as an escaped LDAP path ("LDAP://10.10.10.254
        CN\=Users,DC\=forcepoint,DC\=local/win7"); must be unescaped and split
        so the trailing account lands in user.name and the DC components in
        user.domain, otherwise the whole path is indexed as the username and
        breaks any join against directory data.
    - vendor: loginID
      type: string
      description: Login ID of the user to whom the policy was applied.
      ecs: user.id
      status: partial
      notes: >
        Short account identifier, the cleaner join key of the two user fields.
        Output can optionally be reconfigured (via Forcepoint Technical
        Support) to emit domain/userID instead of the full LDAP path, which
        changes what this field contains — confirm the deployed setting before
        relying on it.
    - vendor: act (dispositionString)
      type: enum
      description: Permitted or Blocked, derived from the numeric disposition code.
      ecs: event.action
      status: mapped
      transform: >
        permitted/blocked is copied to event.action verbatim and also drives
        event.outcome (permitted -> success, blocked -> success with a blocked
        action, never failure — a block is a successful policy enforcement,
        not an error). There is no separate vendor column for outcome in the
        predefined CEF string.
    - vendor: cn1 (dispositionNumber)
      type: integer
      description: >-
        Numeric code for the specific action applied to the request, labelled
        DispositionCode in CEF.
      ecs: event.code
      status: partial
      transform: >
        needs the vendor Disposition reference lookup to become meaningful —
        e.g. 1025 category blocked, 1026 category permitted, 1029 always
        blocked, 1043 permitted by quota, 1047 file type blocked, 1064 blocked
        by Web DLP, 1067 cloud app permitted, plus a parallel 1281+ range for
        real-time analysis variants. Without the lookup the SOC can only alert
        on act, losing the reason a request was blocked.
    - vendor: severity (CEF header)
      type: integer
      description: >-
        CEF header severity; the vendor sets 1 if the request was permitted
        and 7 if it was blocked.
      ecs: event.severity
      status: partial
      transform: >
        this is a two-valued permitted/blocked flag dressed up as a severity,
        not a real risk score; keep it but do not build alert thresholds on it
        — use dispositionNumber and the category instead.
    - vendor: app (protocol)
      type: string
      description: >-
        Protocol name for the request, either a URL Database protocol or a
        customer-defined custom protocol.
      ecs: network.protocol
      status: mapped
    - vendor: categoryNumber (CEF Signature_ID)
      type: integer
      description: >-
        Integer identifying the URL Database category assigned to the request;
        carried as the CEF Signature_ID in the header.
      ecs: null
      status: unmapped
      custom: forcepoint.web.category_number
      notes: >
        The single most useful Forcepoint-specific field and the one with no
        ECS home — ECS has no URL-reputation/category namespace. Requires the
        vendor Category number reference lookup to resolve to a name (e.g.
        Malicious Web Sites, Bot Networks). Store the resolved name alongside
        the number.
    - vendor: cs2 (dynamicCategory)
      type: integer
      description: >-
        Category determined by real-time content analysis (Real-Time Security
        Scanning, Advanced File Analysis); zero when no dynamic categorization
        occurred.
      ecs: null
      status: unmapped
      custom: forcepoint.web.dynamic_category
      notes: >-
        labelled DynCat in the CEF string; uses the same category number
        lookup as categoryNumber
    - vendor: reason (scanReasonString)
      type: string
      description: >-
        Scanning analytic result, e.g. "0-1404-Threat.Malicious.Web.RealTime";
        "-" when no analysis fired.
      ecs: null
      status: unmapped
      custom: forcepoint.web.scan_reason
      notes: >
        The closest thing this stream has to a threat verdict. The dotted tail
        is a Forcepoint threat taxonomy string and would need a mapping table
        before it could populate threat.* or rule.category; left custom rather
        than guessing at an ECS threat mapping.
    - vendor: cs1 (policyNames)
      type: string
      description: >-
        Name of the policy or policies that could apply to the request,
        labelled Policy in CEF.
      ecs: rule.name
      status: partial
      transform: >
        may contain several policies separated by "**" (a user can match
        through multiple group memberships, e.g. "Super
        Administrator**Default"); split into an array before alerting on a
        specific policy name.
    - vendor: in (bytesReceived)
      type: bytes
      description: Bytes received from the origin server in response to the request.
      ecs: destination.bytes
      status: mapped
    - vendor: out (bytesSent)
      type: bytes
      description: Bytes sent by the client as part of the request.
      ecs: source.bytes
      status: mapped
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Build the CEF exit on the core worker group: the generic CEF parser
          plus csN/cnN Label indirection resolves DispositionCode, Policy and
          DynCat into named keys, and the pipeline must branch on
          productVersion before deriving @timestamp because rt is epoch
          seconds in 8.5 and epoch milliseconds from 8.5.3 on. Do the
          normalizations that need vendor reference data here — the three
          lookup files (disposition number, category number, category reason
          code), the act-driven event.outcome derivation where blocked is a
          successful enforcement rather than a failure, the unescape-and-split
          of the LDAP suser path into user.name plus user.domain, and the "**"
          split of multi-policy cs1 into an array. Validate the emitted ECS
          JSON with C.Schema(...).validate immediately before the guard
          destination with a dead-letter route for failures and Persistent
          Queue backpressure (never Block), and drop _raw on this route first:
          it is the highest-volume, lowest-forensic-value stream in the file.
        elastic: >
          No shipped integration covers the syslog/CEF feed, so stand up a
          custom ingest pipeline and index template for
          logs-forcepoint_web.transaction that accepts pre-shaped documents
          rather than re-parsing them, with custom-namespace keyword mappings
          for forcepoint.web.category_number (and its resolved name),
          dynamic_category and scan_reason. Re-attach a scheme inferred from
          the protocol key before running the URI-parts processor, since the
          vendor strips scheme and port and url.full, url.path and url.query
          are otherwise underivable. Assert in the template that event.outcome
          is populated for every disposition the low-side lookup can emit, and
          document that event.severity here is a two-valued permitted/blocked
          flag so no alert threshold is built on it.
        relay: >
          Full ECS-shaped JSON crosses the guard, not CEF: the Multiplexer
          keeps emitting syslog/CEF and that does not change, but the
          conversion happens low-side so no CEF reaches the boundary or
          Elastic. This is the dataset the content filter will fight — full
          user-supplied URLs with kilobyte query strings, percent-encoded and
          non-ASCII bytes, and arbitrary User-Agent text — so cap
          url.original, user_agent.original and the scan-reason string to
          declared lengths low-side and hold the document to two levels of
          nesting with short ASCII allowlisted keys, because a custom NDJSON
          filter on the guard is bespoke work and only stays simple if the
          shape is constrained. Treat the crossing as at-most-once, size the
          Persistent Queue for the proxy peak, and detect silent drops by
          reconciling low-side and high-side counts per (dataset, hour) rather
          than expecting acknowledgements.
      direct:
        parse_location: low
        cribl: >
          Build the CEF exit on the core worker group: the generic CEF parser
          plus csN/cnN Label indirection resolves DispositionCode, Policy and
          DynCat into named keys, and the pipeline must branch on
          productVersion before deriving @timestamp because rt is epoch
          seconds in 8.5 and epoch milliseconds from 8.5.3 on. Do the
          normalizations that need vendor reference data here — the three
          lookup files (disposition number, category number, category reason
          code), the act-driven event.outcome derivation where blocked is a
          successful enforcement rather than a failure, the unescape-and-split
          of the LDAP suser path into user.name plus user.domain, and the "**"
          split of multi-policy cs1 into an array. Validate the emitted ECS
          JSON with C.Schema(...).validate immediately before the Elastic
          destination with a dead-letter route for failures and Persistent
          Queue backpressure (never Block), and drop _raw on this route first:
          it is the highest-volume, lowest-forensic-value stream in the file.
        elastic: >
          No shipped integration covers the syslog/CEF feed, so stand up a
          custom ingest pipeline and index template for
          logs-forcepoint_web.transaction that accepts pre-shaped documents
          rather than re-parsing them, with custom-namespace keyword mappings
          for forcepoint.web.category_number (and its resolved name),
          dynamic_category and scan_reason. Re-attach a scheme inferred from
          the protocol key before running the URI-parts processor, since the
          vendor strips scheme and port and url.full, url.path and url.query
          are otherwise underivable. Assert in the template that event.outcome
          is populated for every disposition the Cribl lookup can emit, and
          document that event.severity here is a two-valued permitted/blocked
          flag so no alert threshold is built on it.
  - format: syslog-kv
    enable: >
      In the Web module of Forcepoint Security Manager go to Settings >
      General > SIEM Integration, tick "Enable SIEM integration for this
      Policy Server", enter the collector IP/hostname and port, choose the
      transport (UDP or TCP), and set the Syslog output format selector to
      "syslog/key-value pairs (Splunk and others)"; a sample predefined string
      is shown of the form "<156>%<:%b %d %H:%M:%S> %<-sourceServer>
      vendor=Forcepoint product=Security product_version=%<productVersion>
      ...". Click Save and Deploy so the Multiplexer begins forwarding a copy
      of every filtered transaction to the SIEM target in addition to Log
      Server. The format is one selection per channel, so key-value replaces
      the CEF predefined string on this channel rather than adding to it. To
      add reference keys the predefined string omits, select Custom and extend
      the string with the extra %<key> variables from the SIEM key reference
      (up to 2048 characters).
    references:
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/siem/B2E5849B-47DA-4FEA-B89B-4647084E4ECC.html
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/siem/B180CA52-DB55-4DCD-A393-2F3DE855CFC8.html
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/siem/5EA353E4-BD6A-4DB1-9F1A-BB8AFA6A328E.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Forcepoint key-value pipeline
      notes: >
        No vendor-specific Cribl pack exists, and the shipped Elastic
        forcepoint_web integration only covers the cloud CSV file input, not
        this syslog feed. Plan is a Cribl pipeline built on the generic
        key-value/KV parser (the Cribl Pack for Syslog Input handles the
        syslog framing) plus the same three vendor lookup files the CEF
        pipeline needs - disposition number, category number, and category
        reason code. The key-value form is easier to parse than CEF because
        the keys are self-describing internal names with no cs/cn slot
        indirection or cs*Label pairing to honour, but the value semantics are
        identical: time is epoch seconds in v8.5 and epoch milliseconds from
        v8.5.3 onward so the pipeline must branch on productVersion before
        deriving @timestamp, and logRecordSource (OnPrem/Hybrid) still
        distinguishes appliance traffic from SIEMConnector-relayed hybrid
        traffic.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Build the KV parse on the low-side edge worker group: the generic
          key-value function resolves every attribute to a named key with no
          Label indirection, then apply the vendor reference normalizations
          here - the three lookup files (disposition number, category number,
          category reason code), the act/dispositionString-driven
          event.outcome derivation where blocked is a successful enforcement
          rather than a failure, the unescape-and-split of the LDAP userPath
          into user.name plus user.domain, and the "**" split of multi-policy
          policyNames into an array. Branch on productVersion before deriving
          @timestamp from time. Because this string can carry the response
          keys CEF omits, also normalize proxyStatusCode to
          http.response.status_code and contentType to http.request.mime_type
          low-side. Validate the emitted ECS JSON with C.Schema(...).validate
          immediately before the guard destination with a dead-letter route
          for failures and Persistent Queue backpressure (never Block), and
          drop _raw on this route first - it is the highest-volume,
          lowest-forensic-value stream in the file.
        elastic: >
          No shipped integration covers this syslog feed, so stand up a custom
          ingest pipeline and index template for
          logs-forcepoint_web.transaction that accepts pre-shaped documents
          rather than re-parsing them, with custom-namespace keyword mappings
          for forcepoint.web.category_number (and its resolved name),
          category_reason_code, dynamic_category, scan_reason,
          log_record_source and proxy_source_address. Re-attach a scheme
          inferred from the protocol key before running the URI-parts
          processor, since the vendor strips scheme and port and url.full,
          url.path and url.query are otherwise underivable. Assert
          event.outcome is populated for every disposition the low-side lookup
          can emit, and document that event.severity here is a two-valued
          permitted/blocked flag so no alert threshold is built on it.
        relay: >
          Full ECS-shaped JSON crosses the guard, not the key-value line: the
          Multiplexer keeps emitting syslog/key-value and that does not
          change, but the conversion happens low-side so no raw vendor syslog
          reaches the boundary or Elastic. This is the dataset the content
          filter will fight - full user-supplied URLs with kilobyte query
          strings, percent-encoded and non-ASCII bytes, arbitrary User-Agent
          text, and now also refererUrl and fileName free text the richer key
          set adds - so cap url.original, user_agent.original,
          http.request.referrer, file.name and the scan-reason string to
          declared lengths low-side and hold the document to two levels of
          nesting with short ASCII allowlisted keys. Treat the crossing as
          at-most-once, size the Persistent Queue for the proxy peak, and
          detect silent drops by reconciling low-side and high-side counts per
          (dataset, hour) rather than expecting acknowledgements.
      direct:
        parse_location: low
        cribl: >
          Build the KV parse with the generic key-value function, which
          resolves every attribute to a named key with no Label indirection,
          then apply the vendor reference normalizations: the three lookup
          files (disposition number, category number, category reason code),
          the act/dispositionString-driven event.outcome derivation where
          blocked is a successful enforcement rather than a failure, the
          unescape-and-split of the LDAP userPath into user.name plus
          user.domain, and the "**" split of multi-policy policyNames into an
          array. Branch on productVersion before deriving @timestamp from
          time, and normalize proxyStatusCode to http.response.status_code and
          contentType to http.request.mime_type since this string carries the
          response keys CEF omits. Retain full url.original,
          user_agent.original and referer/filename values. Pick key-value or
          the CEF predefined string as the single authoritative feed per SIEM
          channel, since the Format selector is one choice and running two
          channels to the same collector double-counts transactions.
        elastic: >
          Stand up the same custom ingest pipeline and index template for
          logs-forcepoint_web.transaction that accepts pre-shaped documents,
          with custom-namespace keyword mappings for
          forcepoint.web.category_number (and its resolved name),
          category_reason_code, dynamic_category, scan_reason,
          log_record_source and proxy_source_address, and re-attach a scheme
          inferred from the protocol key before the URI-parts processor. With
          no guard in the path the reason to prefer key-value over CEF is
          fidelity: the Custom key-value string can emit the response-status,
          content-type, referer, filename and category-reason keys the CEF
          string drops, so choose it where the SOC wants those columns rather
          than the CEF subset.
    fields:
    - vendor: source
      type: ip
      description: IPv4 or IPv6 address of the client (requesting) machine.
      ecs: source.ip
      status: mapped
    - vendor: clientSourcePort
      type: port
      description: Source port of the client connection to the proxy.
      ecs: source.port
      status: mapped
    - vendor: destination
      type: ip
      description: Translated IPv4 or IPv6 address of the destination machine.
      ecs: destination.ip
      status: mapped
    - vendor: port
      type: port
      description: TCP port of the origin server.
      ecs: destination.port
      status: mapped
    - vendor: urlHost
      type: string
      description: Host (domain) portion of the requested URL.
      ecs: url.domain
      status: mapped
    - vendor: url
      type: string
      description: Full requested URL; does not include protocol scheme or port.
      ecs: url.original
      status: partial
      transform: >
        the vendor strips the scheme and port, so url.original is not a
        round-trippable URL; the ingest pipeline has to re-attach a scheme
        inferred from the protocol key before url.full, url.path and url.query
        can be parsed out.
    - vendor: method
      type: enum
      description: HTTP method associated with the request (GET, POST, PUT, ...).
      ecs: http.request.method
      status: mapped
    - vendor: protocolVersion
      type: string
      description: HTTP version of the request, expressed as Byte.Byte (e.g. 1.1).
      ecs: http.version
      status: partial
      transform: >-
        emitted as a "Byte.Byte" pair; normalize to the plain HTTP version
        string ("1.1") before assigning http.version
    - vendor: userAgent
      type: string
      description: Contents of the User-Agent HTTP header, when present.
      ecs: user_agent.original
      status: mapped
    - vendor: userPath
      type: string
      description: NameSpace, Domain and UserName of the user the policy was applied to.
      ecs: user.name
      status: partial
      transform: >
        emitted as an escaped LDAP path ("LDAP://10.10.10.254
        CN\=Users,DC\=forcepoint,DC\=local/win7"); must be unescaped and split
        so the trailing account lands in user.name and the DC components in
        user.domain, otherwise the whole path is indexed as the username and
        breaks any directory join.
    - vendor: loginID
      type: string
      description: Login ID of the user to whom the policy was applied.
      ecs: user.id
      status: partial
      notes: >
        short account identifier, the cleaner join key of the two user fields;
        can optionally be reconfigured via Forcepoint Technical Support to
        emit domain/userID, which changes what this field carries - confirm
        the deployed setting before relying on it.
    - vendor: dispositionString
      type: enum
      description: Permitted or Blocked, derived from the value of dispositionNumber.
      ecs: event.action
      status: mapped
      transform: >
        permitted/blocked is copied to event.action verbatim and also drives
        event.outcome (permitted -> success, blocked -> success with a blocked
        action, never failure - a block is a successful policy enforcement);
        there is no separate outcome key in the predefined string.
    - vendor: dispositionNumber
      type: integer
      description: Numeric code for the specific action applied to the request.
      ecs: event.code
      status: partial
      transform: >
        needs the vendor Disposition reference lookup to become meaningful
        (e.g. 1025 category blocked, 1026 category permitted, 1029 always
        blocked, 1043 permitted by quota, 1047 file type blocked, 1064 blocked
        by Web DLP); without it the SOC can only alert on the
        permitted/blocked string, losing the reason a request was blocked.
    - vendor: severity
      type: integer
      description: Vendor-set severity, 1 if the request was permitted and 7 if it was blocked.
      ecs: event.severity
      status: partial
      transform: >
        a two-valued permitted/blocked flag dressed up as a severity, not a
        real risk score; keep it but do not build alert thresholds on it - use
        dispositionNumber and the category instead.
    - vendor: protocol
      type: string
      description: >-
        Protocol name for the request, either a URL Database protocol or a
        customer-defined custom protocol.
      ecs: network.protocol
      status: mapped
    - vendor: proxyStatusCode
      type: integer
      description: Proxy HTTP response code returned to the client.
      ecs: http.response.status_code
      status: mapped
      notes: >
        not carried on the CEF predefined string; the key-value form exposes
        it, so range queries on 4xx/5xx become possible on this feed where
        they were not on CEF.
    - vendor: serverStatusCode
      type: integer
      description: Origin server HTTP response code seen upstream by the proxy.
      ecs: null
      status: unmapped
      custom: forcepoint.web.server_status_code
      notes: >-
        distinct from proxyStatusCode (client-facing); kept custom so the two
        status codes do not collide on http.response.status_code
    - vendor: contentType
      type: string
      description: Content-Type value from the request header (for example image/gif).
      ecs: http.request.mime_type
      status: mapped
      notes: >
        the vendor sources this from the request header per the SIEM key
        reference; if a deployment is confirmed to populate it from the
        response instead, move it to http.response.mime_type.
    - vendor: refererUrl
      type: string
      description: URL of the referer site associated with the request.
      ecs: http.request.referrer
      status: mapped
      notes: user-supplied free text; one of the fields to length-cap before a guard crossing
    - vendor: fileName
      type: string
      description: Name of the file associated with the request.
      ecs: file.name
      status: mapped
    - vendor: fileTypeCode
      type: integer
      description: The file type associated with the request.
      ecs: null
      status: unmapped
      custom: forcepoint.web.file_type_code
      notes: numeric code; needs a vendor file-type lookup to resolve to a name
    - vendor: categoryNumber
      type: integer
      description: Integer representing the URL Database category assigned to the request.
      ecs: null
      status: unmapped
      custom: forcepoint.web.category_number
      notes: >
        the single most useful Forcepoint-specific field and the one with no
        ECS home - ECS has no URL-reputation/category namespace. Requires the
        vendor Category number reference lookup to resolve to a name
        (Malicious Web Sites, Bot Networks, ...); store the resolved name
        alongside the number.
    - vendor: categoryReasonCode
      type: integer
      description: The reason the URL was assigned to the listed category.
      ecs: null
      status: unmapped
      custom: forcepoint.web.category_reason_code
      notes: >
        the third vendor lookup the pipeline needs; explains why the category
        was applied and is not present on the CEF string, so this feed can
        answer "why blocked" more precisely than CEF.
    - vendor: dynamicCategory
      type: integer
      description: If non-zero, the category determined by real-time content analysis.
      ecs: null
      status: unmapped
      custom: forcepoint.web.dynamic_category
      notes: >-
        zero when no dynamic categorization occurred; resolves through the
        same category number lookup as categoryNumber
    - vendor: scanReasonString
      type: string
      description: >-
        Scanning analytic result, e.g. "0-1404-Threat.Malicious.Web.RealTime";
        empty when no analysis fired.
      ecs: null
      status: unmapped
      custom: forcepoint.web.scan_reason
      notes: >
        the closest thing this stream has to a threat verdict; the dotted tail
        is a Forcepoint threat taxonomy string that would need a mapping table
        before it could populate threat.* or rule.category, so left custom
        rather than guessing at an ECS threat mapping.
    - vendor: policyNames
      type: string
      description: Name of the policy or policies that could be applied to the request.
      ecs: rule.name
      status: partial
      transform: >
        may contain several policies separated by "**" (a user can match
        through multiple group memberships, e.g. "Super
        Administrator**Default"); split into an array before alerting on a
        specific policy name.
    - vendor: networkDirection
      type: integer
      description: Direction of the request, inbound (0) or outbound (1).
      ecs: network.direction
      status: partial
      transform: >-
        map the 0/1 code to the ECS network.direction vocabulary (0 ->
        inbound, 1 -> outbound)
    - vendor: keyword
      type: string
      description: >-
        Keyword used to block a request; empty if the request was not blocked
        by keyword.
      ecs: null
      status: unmapped
      custom: forcepoint.web.keyword
    - vendor: cloudAppName
      type: string
      description: Name of the requested cloud application, when cloud-app control identified one.
      ecs: null
      status: unmapped
      custom: forcepoint.web.cloud_app_name
      notes: >-
        ECS has no cloud-application-catalog namespace; paired keys
        cloudAppRiskLevel/cloudAppType are similarly custom if the deployment
        enables them
    - vendor: proxySourceAddress
      type: ip
      description: >-
        IP address of the proxy (on-premises data) or the SIEMConnector IP
        address (hybrid data).
      ecs: null
      status: unmapped
      custom: forcepoint.web.proxy_source_address
      notes: >
        identifies the emitting proxy / relay rather than either endpoint;
        kept custom rather than forced onto observer.ip because on hybrid
        records it is the SIEMConnector, not the enforcement point.
    - vendor: logRecordSource
      type: string
      description: Source of the log record - Hybrid or on-premises (OnPrem).
      ecs: null
      status: unmapped
      custom: forcepoint.web.log_record_source
      notes: >-
        keep it to tell appliance traffic from SIEMConnector-relayed hybrid
        traffic; drives whether proxySourceAddress is a proxy or the
        SIEMConnector
    - vendor: bytesReceived
      type: bytes
      description: Bytes received in response to the request.
      ecs: destination.bytes
      status: mapped
    - vendor: bytesSent
      type: bytes
      description: Bytes sent as part of the request.
      ecs: source.bytes
      status: mapped
    - vendor: time
      type: integer
      description: Seconds (v8.5) or milliseconds (v8.5.3+) since midnight Jan 1 1970.
      ecs: '@timestamp'
      status: partial
      transform: >
        epoch seconds in v8.5 and epoch milliseconds from v8.5.3 onward, so
        the pipeline must branch on productVersion before deriving @timestamp.
    - vendor: productVersion
      type: string
      description: Web protection product version, as determined by Multiplexer.
      ecs: observer.version
      status: mapped
  - format: syslog-leef
    enable: >
      Settings > General > SIEM Integration as for the other formats, but set
      the Syslog output format selector to "syslog/LEEF (QRadar)"; a LEEF
      predefined sample string is displayed. Save and Deploy. LEEF is one
      Format selection per channel, mutually exclusive with the CEF and
      key-value predefined strings, and like them can be copied into the
      Custom field for editing (2048-character limit).
    references:
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/siem/B2E5849B-47DA-4FEA-B89B-4647084E4ECC.html
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/siem/B180CA52-DB55-4DCD-A393-2F3DE855CFC8.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Forcepoint LEEF pipeline
      notes: >
        Neither the Elastic forcepoint_web integration nor a Cribl pack
        ingests this LEEF stream. A pipeline would split the LEEF:1.0 header
        and the tab-delimited attribute body and map the named attributes to
        ECS; the value semantics (epoch time seconds vs milliseconds by
        version, the LDAP userPath, the disposition/category/reason lookups)
        are identical to the CEF and key-value forms. The blocker is that the
        LEEF attribute names for this predefined string are not published in
        the on-prem SIEM reference, so the field mapping must be captured from
        a live sample on the deployed appliance before the pipeline can be
        built.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Split the LEEF header and tab-delimited body low-side and apply the
          same vendor lookups and value normalizations as the key-value and
          CEF pipelines (version-branched @timestamp, LDAP userPath split,
          disposition/category/reason lookups, "**" policy split,
          permitted/blocked-driven event.outcome). Capture a live LEEF sample
          first to pin the exact attribute names. Validate with
          C.Schema(...).validate and a dead-letter route before the guard,
          Persistent Queue backpressure (never Block), and drop _raw on this
          high-volume route.
        elastic: >
          Same custom logs-forcepoint_web.transaction pipeline, index template
          and forcepoint.web.* keyword mappings as the key-value alternate;
          the LEEF form carries the same data, only the transport wrapper
          differs.
        relay: >
          Same crossing profile as the key-value alternate - full ECS JSON
          crosses, not LEEF; the free-text flashpoints (url.original,
          user_agent.original, referer, scan-reason) are capped low-side, the
          document held to two levels of nesting with allowlisted keys, and
          the crossing treated as at-most-once with per (dataset, hour)
          reconciliation.
      direct:
        parse_location: low
        cribl: >
          Split the LEEF:1.0 header and tab-delimited body and apply the
          vendor lookups and value normalizations: version-branched
          @timestamp, the LDAP userPath split, the disposition/category/reason
          lookups, the "**" policy split, and permitted/blocked-driven
          event.outcome. Capture a live LEEF sample first to pin the exact
          attribute names, since they are not published in the on-prem SIEM
          reference. Run one authoritative Format per channel; there is little
          reason to run LEEF rather than key-value unless a QRadar consumer
          shares the same channel, since key-value's field reference is fully
          published and LEEF's is not.
        elastic: >
          Same custom logs-forcepoint_web.transaction pipeline, index template
          and forcepoint.web.* keyword mappings as the key-value alternate;
          the LEEF form carries the same data, only the transport wrapper
          differs.
    fields_omitted: >
      Forcepoint's on-prem SIEM reference does not publish the LEEF attribute
      names for this predefined string, so the tab-delimited attribute keys
      cannot be listed the way the syslog-kv entry's are. The values they
      carry are the same transaction data the syslog-cef entry inventories,
      under names only a live sample from the appliance reveals.
    fields: []
  - format: csv-file
    enable: >
      In Content Gateway Manager go to Configure > My Proxy > Logs > Event
      Collation (or Configure > Subsystems > Logging) and enable event
      logging, then under Configure > My Proxy > Logs choose a standard format
      - Squid, Netscape Common, Netscape Extended or Netscape Extended-2 -
      which writes a rolling squid.log / extended.log to /opt/WCG/logs on the
      appliance. For a field set of your own choosing, enable Custom logging
      instead and add LogFormat, LogFilter and LogObject specifications to
      logs_xml.config using the Content Gateway logging field symbols.
      Collection is by tailing the resulting file (or via a log collation
      server), not by syslog, so this path is enabled on the Content Gateway
      appliance rather than in Security Manager.
    references:
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/wcg_help/guid-3d972d55-2119-4653-817c-83f70f50e68d.html
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/wcg_help/guid-1a9907b8-b8f7-4a11-a6e2-a924d41b5775.html
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/wcg_help/guid-a8b05415-98ba-4c49-83a8-24a571226bca.html
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/wcg_help/guid-17e65049-9371-4da4-86f6-9b6086b3cc78.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Content Gateway squid-log pipeline
      notes: >
        The Squid format is a fixed, space-delimited, positional line: the 10
        fields below in order. No shipped integration or Cribl pack parses
        Forcepoint's CG log specifically, but a generic Squid parser (regex or
        a delimited-line function) unpacks it. Two structural quirks matter:
        the timestamp is squid epoch seconds with a millisecond fraction, and
        the fourth field packs the cache result code and the HTTP status code
        together as "TCP_MISS/200", so it must be split on "/". This form
        carries a canonical, scheme-included URL (unlike the SIEM feed which
        strips scheme and port) but has no policy, category, disposition or
        scan-reason columns unless a Custom logs_xml.config LogFormat is used
        to add them, so it is a lighter, proxy-centric record rather than the
        policy-rich SIEM line.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Tail the squid.log on a low-side Cribl File Monitor source and parse
          the 10 positional fields: split the packed cache/HTTP field on "/"
          to send the numeric part to http.response.status_code and keep the
          cache result code (TCP_HIT/TCP_MISS/...) in
          forcepoint.web.cache_result_code, parse the squid epoch-with-
          fraction timestamp to @timestamp, and convert the elapsed
          milliseconds to nanoseconds for event.duration. The URL here is
          canonical and scheme-included so url.full/url.path/url.query parse
          directly with no scheme re-attachment. Length-cap url.original and
          the content-type before the guard, validate with
          C.Schema(...).validate plus a dead-letter route, and use Persistent
          Queue backpressure so a slow downstream never stalls the file tail.
          If richer forensics are needed, prefer a Custom logs_xml.config
          LogFormat on the appliance over Squid so category and policy symbols
          are present rather than absent.
        elastic: >
          No integration covers the CG log, so stand up a custom ingest
          pipeline and index template for logs-forcepoint_web.transaction (or
          a distinct proxy_access stream if kept separate from the SIEM feed)
          that accepts the pre-shaped documents, with a
          forcepoint.web.cache_result_code keyword mapping and the
          proxy-hierarchy code kept in a custom namespace. Assert
          http.response.status_code is a long so range queries work, and
          document that this feed lacks the category/disposition columns the
          SIEM feed carries, so category dashboards should key on the SIEM
          stream, not this one.
        relay: >
          The URL and content-type free text are the crossing friction, same
          as the SIEM feeds: cap url.original and http.response.mime_type
          low-side, normalize to UTF-8 and strip control characters, and hold
          the record to two levels of nesting with allowlisted keys. This is a
          high-volume proxy stream, so treat it as at-most-once, size the
          Persistent Queue for the proxy peak, and reconcile line counts per
          (dataset, hour) - a tailed file gives no acknowledgement. Because
          the squid line has no policy/category/scan columns, it is a
          narrower, easier crossing than the SIEM line but also a lower-value
          one.
      direct:
        parse_location: low
        cribl: >
          Tail the squid.log on a Cribl File Monitor source and parse the 10
          positional fields: split the packed cache/HTTP field on "/" to send
          the numeric part to http.response.status_code and keep the cache
          result code (TCP_HIT/TCP_MISS/...) in
          forcepoint.web.cache_result_code, parse the squid
          epoch-with-fraction timestamp to @timestamp, and convert the elapsed
          milliseconds to nanoseconds for event.duration. The URL here is
          canonical and scheme-included so url.full/url.path/url.query parse
          directly with no scheme re-attachment; retain full url.original.
          Where the deployment needs the policy, category and disposition
          context, prefer the Multiplexer SIEM feed (key-value or CEF) over
          this proxy log, or extend the CG Custom LogFormat to emit those
          symbols; run the squid log only where a lightweight proxy-access
          record suffices.
        elastic: >
          No integration covers the CG log, so stand up a custom ingest
          pipeline and index template for logs-forcepoint_web.transaction (or
          a distinct proxy_access stream if kept separate from the SIEM feed)
          with a forcepoint.web.cache_result_code keyword mapping and the
          proxy-hierarchy code kept in a custom namespace. Assert
          http.response.status_code is a long so range queries work, and
          document that this feed lacks the category/disposition columns the
          SIEM feed carries, so category dashboards should key on the SIEM
          stream, not this one.
    fields:
    - vendor: Timestamp
      type: timestamp
      description: >-
        Client request time in Squid format - seconds since Jan 1 1970 UTC
        with millisecond resolution.
      ecs: '@timestamp'
      status: partial
      transform: >-
        squid epoch seconds with a fractional-millisecond suffix; parse both
        the integer and fraction rather than assuming whole seconds
    - vendor: Elapsed Time
      type: integer
      description: >-
        Milliseconds between the client connection being established and the
        last response byte being sent to the client.
      ecs: event.duration
      status: partial
      transform: >-
        emitted in milliseconds; multiply by 1,000,000 to store event.duration
        in nanoseconds as ECS requires
    - vendor: Client IP
      type: ip
      description: IP address of the client host machine.
      ecs: source.ip
      status: mapped
    - vendor: Cache Result Code/HTTP Status
      type: string
      description: >-
        Packed field - the cache result code (HIT, MISS, ...) and the proxy
        HTTP response status code, e.g. TCP_MISS/200.
      ecs: http.response.status_code
      status: partial
      transform: >
        split on "/"; the numeric part is http.response.status_code and the
        leading cache result token (TCP_HIT, TCP_MISS, ...) is kept in custom
        forcepoint.web.cache_result_code.
    - vendor: Response Size
      type: bytes
      description: >-
        Length of the Content Gateway response to the client in bytes,
        including headers and content.
      ecs: http.response.bytes
      status: mapped
    - vendor: Request Method
      type: enum
      description: Client request method (GET, POST, ...).
      ecs: http.request.method
      status: mapped
    - vendor: URL
      type: string
      description: >-
        Client request canonical URL; unparseable characters are replaced by
        escape sequences.
      ecs: url.original
      status: mapped
      notes: >
        unlike the SIEM feed this URL is canonical and includes the scheme, so
        url.full/url.path/url.query parse directly with no scheme
        re-attachment; unescape the squid escape sequences first.
    - vendor: Username
      type: string
      description: >-
        Authenticated client user name; a hyphen (-) means no authentication
        was required.
      ecs: user.name
      status: partial
      notes: >-
        literal "-" for unauthenticated requests; treat "-" as null rather
        than a username
    - vendor: Hierarchy/Server
      type: string
      description: >-
        Proxy hierarchy route Content Gateway used to retrieve the object,
        plus the request server name (e.g. DIRECT/origin.example.com).
      ecs: null
      status: unmapped
      custom: forcepoint.web.proxy_hierarchy
      notes: >
        packs the hierarchy code (DIRECT, PARENT_HIT, ...) and the upstream
        server together; if the server portion is needed as an endpoint, split
        it out to destination.domain, but keep the hierarchy code custom - it
        has no ECS home.
    - vendor: Content Type
      type: string
      description: Object content type taken from the Content Gateway response header.
      ecs: http.response.mime_type
      status: mapped
- id: cloud-log-export
  name: Cloud / hybrid log export
  description: >
    Web request records for cloud-enforced and hybrid (roaming) users,
    retrieved as gzip-compressed CSV by the Forcepoint Log Export SIEM tool
    rather than pushed over syslog. This is the stream the shipped Elastic
    integration consumes, and it is the only Forcepoint web feed that carries
    explicit threat_type / threat_name verdict columns, so it is where malware
    alerting is practical.
  event_categories:
  - web
  - malware
  route:
    guarded:
    - hop: other
      name: Forcepoint Log Export SIEM tool
      notes: >
        Scheduled downloader authenticating to the cloud portal with a
        dedicated SIEM-only administrator account; writes gzip CSV to a
        staging directory. Column selection is made in the cloud portal (max
        35 columns for Web Security data), so the field list below is the
        integration's default set and must be re-confirmed against the
        deployed column selection.
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Cribl File Monitor / Filesystem source over the staging directory.
        Note that a file-based, pull-driven source is a poor fit for a one-way
        guard relay and has to be re-shaped into a stream before the guard hop
        on the low-side path.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_web.logs
    direct:
    - hop: other
      name: Forcepoint Log Export SIEM tool
      notes: >
        Scheduled downloader authenticating to the cloud portal with a
        dedicated SIEM-only administrator account; writes gzip CSV to a
        staging directory. Column selection is made in the cloud portal (max
        35 columns for Web Security data), so the field list below is the
        integration's default set and must be re-confirmed against the
        deployed column selection.
    - hop: cribl
      location: edge worker group
      notes: >
        Cribl File Monitor / Filesystem source over the staging directory,
        re-shaped into a stream and forwarded straight to the core worker
        group.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_web.logs
  formats:
  - format: api-pull
    parsing:
      mechanism: elastic-integration
      artifact: Forcepoint Web Security integration (forcepoint_web)
      notes: >
        The Elastic integration's file input parses the CSV against a fixed
        default column order; if the portal column selection is changed the
        integration policy's field list has to be edited to match or the whole
        export silently mis-parses. Custom fields in this dataset use the
        integration's own forcepoint_web.* namespace (underscore) rather than
        the forcepoint.web.* namespace used by the syslog datasets — that
        split is inherited from the integration and should be normalized if
        these two streams are ever merged into one dataset.
    fields:
    - vendor: source_ip
      type: ip
      description: Client IP address that issued the request.
      ecs: source.ip
      status: mapped
    - vendor: destination_ip
      type: ip
      description: IP address of the origin server.
      ecs: destination.ip
      status: mapped
    - vendor: connection_ip
      type: ip
      description: Egress/translated address the cloud service saw the connection arrive from.
      ecs: source.nat.ip
      status: mapped
    - vendor: url
      type: string
      description: Requested URL.
      ecs: url.original
      status: mapped
    - vendor: http_request_method
      type: enum
      description: HTTP method of the request.
      ecs: http.request.method
      status: mapped
    - vendor: http_status_code
      type: string
      description: HTTP response status code returned for the request.
      ecs: http.response.status_code
      status: partial
      transform: >-
        exported as a string; must be converted to a long before range queries
        (>=400) work
    - vendor: user
      type: string
      description: Authenticated user the request is attributed to.
      ecs: user.name
      status: mapped
      notes: >-
        the integration copies this to both user.id and user.name because the
        export does not distinguish the two
    - vendor: workstation
      type: string
      description: Hostname of the client workstation.
      ecs: host.name
      status: mapped
    - vendor: user_agent_string
      type: string
      description: User-Agent header sent by the client.
      ecs: user_agent.original
      status: mapped
    - vendor: action
      type: enum
      description: Disposition applied to the request (permitted, blocked, ...).
      ecs: event.action
      status: mapped
      transform: >-
        same permitted/blocked vocabulary as the on-prem act key; drives
        event.outcome the same way
    - vendor: policy_name
      type: string
      description: Name of the cloud policy that matched the request.
      ecs: rule.name
      status: mapped
    - vendor: category
      type: string
      description: URL Database category name assigned to the request.
      ecs: null
      status: unmapped
      custom: forcepoint_web.category
      notes: >
        resolved name rather than the on-prem numeric categoryNumber; the two
        streams therefore disagree in shape for the same concept and need a
        shared normalized field if the SOC wants one category dashboard across
        cloud and on-prem
    - vendor: risk_class
      type: string
      description: >-
        Forcepoint risk class grouping for the category (Security Risk, Legal
        Liability, Productivity Loss, ...).
      ecs: null
      status: unmapped
      custom: forcepoint_web.risk_class
    - vendor: threat_type
      type: string
      description: Class of threat detected on the request, when analysis fired.
      ecs: null
      status: unmapped
      custom: forcepoint_web.threat_type
      notes: >
        vendor taxonomy does not use the ECS threat indicator type vocabulary
        (domain-name, file, ipv4-addr, url, ...), so the values would never
        have matched a threat.* query without a translation table. It is also
        the wrong object: threat.indicator.* models an indicator supplied by a
        threat-intel provider, and this is Forcepoint's own analysis verdict
        about the request.
    - vendor: threat_name
      type: string
      description: Specific threat or malware family name reported for the request.
      ecs: null
      status: unmapped
      custom: forcepoint_web.threat_name
      notes: >
        populated only when Forcepoint analysis produced a verdict; empty on
        the vast majority of records. Detection identity, not indicator
        identity: not threat.indicator.name, which models an indicator
        supplied by a threat-intel provider. Not rule.name either — that
        already holds policy_name on this dataset, and pairing a
        malware-family name with a policy rule under one rule.* object would
        mislead anything reading them as a pair.
    - vendor: date
      type: string
      description: Calendar date portion of the request timestamp, exported as its own CSV column.
      ecs: null
      status: partial
      custom: forcepoint_web.date
      notes: >-
        must be concatenated with the time column and parsed in the export's
        configured timezone to build @timestamp
    - vendor: time
      type: string
      description: Time-of-day portion of the request timestamp, exported as its own CSV column.
      ecs: null
      status: partial
      custom: forcepoint_web.time
      notes: see date; the pair is the only timestamp the CSV carries
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep this hop transport-only — a Filesystem/File Monitor source over
          the staging directory that decompresses the gzip CSV, tracks file
          state so a re-downloaded export is not ingested twice, and tags
          records with the logs-forcepoint_web.logs route key without doing
          any field extraction. Add one guard against the documented silent
          failure: fingerprint the header row or column count on every file
          and dead-letter plus alert on drift, because a changed portal column
          selection mis-parses the whole export downstream instead of
          erroring. Use Persistent Queue backpressure on the destination so a
          slow downstream never stalls the scheduled downloader.
        elastic: >
          The forcepoint_web integration's file input is the parser here;
          confine changes to a logs-forcepoint_web.logs@custom pipeline and
          keep the integration policy's field list synchronized with the
          deployed portal column selection. That custom pipeline owns three
          fixes the map documents: convert http_status_code from string to
          long so range queries work, concatenate the date and time columns
          and parse them in the export's configured timezone to build
          @timestamp, and write a shared normalized category field so the
          resolved forcepoint_web.category name and the on-prem numeric
          forcepoint.web.category_number answer one dashboard. Keep
          threat_type and threat_name in the forcepoint_web.* custom namespace
          and add no ECS translation for them: they are Forcepoint's own
          analysis verdict about the request rather than an indicator supplied
          by a threat-intelligence provider, and threat.indicator.type carries
          the STIX cyber-observable vocabulary (domain-name, file, ipv4-addr,
          url, ...), which has no member a threat class such as spyware or
          trojan maps onto.
        relay: >
          This is the source that cannot cross as-is: a scheduled, pull-driven
          file collector has no stream to relay, so low-side instances must
          re-shape the flow into NDJSON thin envelopes ({_dataId, @timestamp,
          host, _raw}, one CSV row per line) emitted low-side. Prefer the
          Filesystem → Automated Secure Transfer drop-box → Filesystem
          collector variant for exactly this dataset, since a batch source is
          the one with a real replay story under an at-most-once crossing.
          Note that _raw here is a whole CSV row carrying the URL and
          User-Agent free text, so bound its length low-side and reconcile row
          counts per (dataset, hour) — a lost file is a lost hour with no
          acknowledgement to reveal it.
      direct:
        parse_location: high
        cribl: >
          Keep this hop transport-only — a Filesystem/File Monitor source over
          the staging directory that decompresses the gzip CSV, tracks file
          state so a re-downloaded export is not ingested twice, and tags
          records with the logs-forcepoint_web.logs route key without doing
          any field extraction. Add one guard against the documented silent
          failure: fingerprint the header row or column count on every file
          and dead-letter plus alert on drift, because a changed portal column
          selection mis-parses the whole export downstream instead of
          erroring. Use Persistent Queue backpressure on the destination so a
          slow downstream never stalls the scheduled downloader.
        elastic: >
          The forcepoint_web integration's file input is the parser here;
          confine changes to a logs-forcepoint_web.logs@custom pipeline and
          keep the integration policy's field list synchronized with the
          deployed portal column selection. That custom pipeline owns three
          fixes the map documents: convert http_status_code from string to
          long so range queries work, concatenate the date and time columns
          and parse them in the export's configured timezone to build
          @timestamp, and write a shared normalized category field so the
          resolved forcepoint_web.category name and the on-prem numeric
          forcepoint.web.category_number answer one dashboard. Keep
          threat_type and threat_name in the forcepoint_web.* custom namespace
          and add no ECS translation for them: they are Forcepoint's own
          analysis verdict about the request rather than an indicator supplied
          by a threat-intelligence provider, and threat.indicator.type carries
          the STIX cyber-observable vocabulary (domain-name, file, ipv4-addr,
          url, ...), which has no member a threat class such as spyware or
          trojan maps onto.
- id: audit-log
  name: Security Manager audit log
  description: >
    Administrator accountability trail from the Web module of the Forcepoint
    Security Manager — logons, logoffs, and every change to a policy, filter,
    exception, or setting, with before and after values. Forwarded on its own
    SIEM Integration channel configured on the primary Policy Server (v8.5.4
    and v8.5.5 only). Records are retained for just 60 days in the product, so
    shipping them off-box is the retention strategy, not a convenience.
  event_categories:
  - configuration
  - iam
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Separate destination IP/port and transport from the Internet activity
        feed — this is a distinct SIEM Integration block in the UI and can
        point somewhere else entirely.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_web.audit
      notes: custom data stream; no Elastic integration covers the Forcepoint audit channel
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Separate destination IP/port and transport from the Internet activity
        feed — this is a distinct SIEM Integration block in the UI and can
        point somewhere else entirely.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-forcepoint_web.audit
      notes: custom data stream; no Elastic integration covers the Forcepoint audit channel
  formats:
  - format: syslog-cef
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Forcepoint audit pipeline
      notes: >
        Vendor field names here are the audit log column names from the
        Security Manager Status > Audit Log page; the predefined key-value
        format string exposes them as action, _userPath, and _details, with
        the change detail collapsed into a single free-text blob. If the
        deployment can use a Custom format string, emit the columns
        individually rather than accepting the predefined string — recovering
        previous/current values out of the packed details blob is fragile.
    fields:
    - vendor: Date
      type: timestamp
      description: 'Date and time of the change, adjusted for the Security Manager''s time zone.'
      ecs: '@timestamp'
      status: partial
      transform: >
        local time with no offset in the record; the pipeline must apply the
        Security Manager's configured timezone, and the vendor explicitly
        warns that component clocks must be synchronized or audit ordering is
        wrong
    - vendor: User
      type: string
      description: User name of the administrator who made the change.
      ecs: user.name
      status: mapped
    - vendor: Server
      type: string
      description: IP address or name of the Policy Server machine affected by the change.
      ecs: host.target.name
      status: partial
      notes: >
        this is the machine acted upon by the administrator, not the machine
        that emitted the record, so ECS 9.4's host.target.* reuse (new since
        8.11, GA) is the correct home and leaves host.* free for the Security
        Manager box itself. May hold either a hostname or an IP, so it needs a
        conditional split to host.target.name vs host.target.ip; also only
        present for changes that affect the Policy Server (Settings changes),
        blank for policy-object edits
    - vendor: Role
      type: string
      description: Delegated administration role affected by the change.
      ecs: null
      status: unmapped
      custom: forcepoint.web.audit.role
      notes: >
        this is the role the changed object belongs to, not the acting
        administrator's role, so it must not be written to user.roles; blank
        on logon/logoff records
    - vendor: Type
      type: string
      description: >-
        Configuration element that was changed — policy, category filter,
        logon/logoff, and so on.
      ecs: null
      status: unmapped
      custom: forcepoint.web.audit.element_type
      notes: >-
        the discriminator that tells IAM events (logon/logoff) apart from
        configuration events in this single stream
    - vendor: Element
      type: string
      description: >-
        Identifier of the specific object changed, e.g. the category filter
        name or role name.
      ecs: null
      status: unmapped
      custom: forcepoint.web.audit.element
    - vendor: Action
      type: enum
      description: Type of change made — add, delete, change, log on, log off, and so on.
      ecs: event.action
      status: mapped
    - vendor: Previous
      type: string
      description: Value of the changed setting before the change.
      ecs: null
      status: unmapped
      custom: forcepoint.web.audit.previous_value
      notes: >
        free text of arbitrary length and the field most likely to be
        length-capped or rejected by a cross-domain guard content filter;
        blank for password changes by design
    - vendor: Current
      type: string
      description: Value of the changed setting after the change.
      ecs: null
      status: unmapped
      custom: forcepoint.web.audit.current_value
    - vendor: product_version (productVersion)
      type: string
      description: Web protection product version reported by the Multiplexer.
      ecs: observer.version
      status: mapped
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Take this on its own syslog source (separate destination IP/port
          from the Internet activity feed) and push for the Custom format
          string so the audit columns arrive individually; if the deployment
          is stuck on the predefined string, the pipeline owns the fragile
          split of the packed _details blob into previous and current values
          and should mark records where that split fails rather than silently
          emitting empty ones. Apply the Security Manager's configured
          timezone to the Date column since the record carries no offset,
          type-test Server so it lands in host.target.name or host.target.ip,
          and keep Role out of user.roles — it describes the changed object,
          not the acting administrator. Validate with C.Schema(...).validate
          plus a dead-letter route before the guard destination with
          Persistent Queue backpressure, and keep _raw across the crossing:
          this is low-volume, forensically valuable, and the parser is
          unproven.
        elastic: >
          No integration covers the audit channel, so stand up a custom ingest
          pipeline and index template for logs-forcepoint_web.audit that
          accepts the pre-shaped documents, with custom-namespace keyword
          mappings for forcepoint.web.audit.role, element_type, element,
          previous_value and current_value. Drive event.category off the Type
          discriminator so logon/logoff records land in iam and object edits
          in configuration within this single stream, and set event.outcome to
          success for completed audit actions. Because the product retains
          only 60 days, treat the index template and ILM policy for this data
          stream as the system of record and give it a retention far longer
          than the transaction stream's.
        relay: >
          Full ECS-shaped JSON crosses, not CEF — the Security Manager keeps
          emitting its SIEM Integration string and the conversion happens
          low-side. The Previous and Current values are unbounded free text
          and are the fields a cross-domain content filter will truncate or
          reject outright, so cap them low-side, set an explicit truncation
          flag when you do, and keep the record to two levels of nesting with
          short ASCII allowlisted keys so a custom NDJSON filter rule stays
          tractable. At-most-once matters more here than anywhere else in this
          file: a dropped audit record is unrecoverable after 60 days, so
          reconcile counts per (dataset, hour) and alarm on any low-side /
          high-side mismatch rather than treating it as noise.
      direct:
        parse_location: low
        cribl: >
          Take this on its own syslog source (separate destination IP/port
          from the Internet activity feed) and push for the Custom format
          string so the audit columns arrive individually; if the deployment
          is stuck on the predefined string, the pipeline owns the fragile
          split of the packed _details blob into previous and current values
          and should mark records where that split fails rather than silently
          emitting empty ones. Apply the Security Manager's configured
          timezone to the Date column since the record carries no offset,
          type-test Server so it lands in host.target.name or host.target.ip,
          and keep Role out of user.roles — it describes the changed object,
          not the acting administrator. Validate with C.Schema(...).validate
          plus a dead-letter route before the Elastic destination with
          Persistent Queue backpressure, and keep _raw: this is low-volume,
          forensically valuable, and the parser is unproven.
        elastic: >
          No integration covers the audit channel, so stand up a custom ingest
          pipeline and index template for logs-forcepoint_web.audit that
          accepts the pre-shaped documents, with custom-namespace keyword
          mappings for forcepoint.web.audit.role, element_type, element,
          previous_value and current_value. Drive event.category off the Type
          discriminator so logon/logoff records land in iam and object edits
          in configuration within this single stream, and set event.outcome to
          success for completed audit actions. Because the product retains
          only 60 days, treat the index template and ILM policy for this data
          stream as the system of record and give it a retention far longer
          than the transaction stream's.
  - format: syslog-kv
    enable: >
      On v8.5.4 and v8.5.5, configure the Audit Log Data section of Settings >
      General > SIEM Integration on the primary Policy Server (a distinct
      block from the Internet-activity SIEM configuration, with its own
      destination IP/port and transport). Set the Format selector to
      "syslog/key-value pairs (Splunk and others)"; the predefined audit
      string is of the form "<156>%<:%b %d %H:%M:%S> %<-sourceServer>
      vendor=Forcepoint product=Security product_version=%<productVersion>
      action=%<action value> user=%<_userPath> reason=%<_details>". Save and
      Deploy. Key-value is one Format selection per channel, mutually
      exclusive with CEF and LEEF; select Custom to emit the audit columns
      individually rather than collapsing the change into the packed
      _details/reason blob.
    references:
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/siem/B2E5849B-47DA-4FEA-B89B-4647084E4ECC.html
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/siem/B180CA52-DB55-4DCD-A393-2F3DE855CFC8.html
    - >-
      https://help.forcepoint.com/websec/en-us/on-prem/85/siem/5EA353E4-BD6A-4DB1-9F1A-BB8AFA6A328E.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom Forcepoint audit key-value pipeline
      notes: >
        No integration covers the Forcepoint audit channel. The key-value
        predefined string exposes the change as action=, user= and reason=
        (the internal action value, userPath and details keys), with the
        before/after change detail collapsed into the single free-text reason
        (_details) blob. If the deployment can use a Custom format string,
        emit the audit columns individually instead - recovering previous and
        current values out of the packed blob is fragile. The record carries
        no timezone offset, so apply the Security Manager's configured
        timezone, and the vendor warns component clocks must be synchronized
        or audit ordering is wrong.
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Take this on its own low-side syslog source (separate destination
          IP/port from the Internet-activity feed) and parse the key-value
          attributes. Push for the Custom format string so the audit columns
          arrive individually; if stuck on the predefined key-value string,
          the pipeline owns the fragile split of the packed reason/_details
          blob into previous and current values and should mark records where
          that split fails rather than silently emitting empty ones. Apply the
          Security Manager's configured timezone to the record time, type-test
          sourceServer so it lands in host.target.name or host.target.ip, and
          drive event.category off the action value so logon/logoff land in
          iam and object edits in configuration. Validate with
          C.Schema(...).validate plus a dead-letter route before the guard
          with Persistent Queue backpressure, and keep _raw across the
          crossing - this is low-volume, forensically valuable, and the parser
          is unproven.
        elastic: >
          No integration covers the audit channel, so stand up a custom ingest
          pipeline and index template for logs-forcepoint_web.audit that
          accepts the pre-shaped documents, with custom-namespace keyword
          mappings for forcepoint.web.audit.details, previous_value and
          current_value. Set event.outcome to success for completed audit
          actions, and because the product retains audit records only 60 days,
          treat this index template and ILM policy as the system of record and
          give it a retention far longer than the transaction stream's.
        relay: >
          Full ECS-shaped JSON crosses, not the key-value line - the Security
          Manager keeps emitting its SIEM string and the conversion happens
          low-side. The reason/_details blob is unbounded free text carrying
          previous and current setting values, so it is the field a
          cross-domain content filter will truncate or reject: cap it
          low-side, set an explicit truncation flag when you do, and keep the
          record to two levels of nesting with short ASCII allowlisted keys.
          At-most-once matters more here than anywhere else in this file - a
          dropped audit record is unrecoverable after 60 days - so reconcile
          counts per (dataset, hour) and alarm on any low-side/high-side
          mismatch rather than treating it as noise.
      direct:
        parse_location: low
        cribl: >
          Take this on its own syslog source (separate destination IP/port
          from the Internet-activity feed) and parse the key-value attributes,
          keeping _raw. Prefer the Custom format string so the change columns
          arrive individually rather than packed into the reason/_details
          blob; if stuck on the predefined string, the pipeline owns the
          fragile split of that blob into previous and current values and
          should mark records where it fails rather than silently emitting
          empty ones. Apply the Security Manager's configured timezone to the
          record time, type-test sourceServer so it lands in host.target.name
          or host.target.ip, and drive event.category off the action value so
          logon/logoff land in iam and object edits in configuration. One
          authoritative Format per audit channel.
        elastic: >
          Stand up a custom ingest pipeline and index template for
          logs-forcepoint_web.audit that accepts the pre-shaped documents,
          with custom-namespace keyword mappings for
          forcepoint.web.audit.details, previous_value and current_value. Set
          event.outcome to success for completed audit actions, and because
          the product retains audit records only 60 days, treat this index
          template and ILM policy as the system of record and give it a
          retention far longer than the transaction stream's.
    fields:
    - vendor: action value
      type: enum
      description: Type of change made - log on, log off, add, delete, or change.
      ecs: event.action
      status: mapped
      notes: >-
        emitted as the action= attribute; also the discriminator that
        separates iam (logon/logoff) from configuration (object edits) events
    - vendor: userPath
      type: string
      description: User name of the administrator who made the change.
      ecs: user.name
      status: mapped
      notes: emitted as the user= attribute
    - vendor: details
      type: string
      description: >-
        Specific information about the change that was made, including before
        and after values.
      ecs: null
      status: unmapped
      custom: forcepoint.web.audit.details
      notes: >
        emitted as the reason= attribute, a single packed free-text blob; the
        fragile split into previous_value and current_value happens in the
        pipeline, and this is the field most likely to be length-capped or
        rejected by a guard content filter (blank for password changes by
        design).
    - vendor: sourceServer
      type: string
      description: >-
        IP address or name of the machine where the Policy Server or Policy
        Broker change occurred.
      ecs: host.target.name
      status: partial
      notes: >
        the machine acted upon, not the emitter, so ECS host.target.* reuse is
        the correct home; may hold a hostname or an IP, so it needs a
        conditional split to host.target.name vs host.target.ip.
    - vendor: productVersion
      type: string
      description: Web protection product version, as determined by Multiplexer.
      ecs: observer.version
      status: mapped
