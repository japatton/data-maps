id: zos-smf
name: IBM z/OS system SMF records
vendor: IBM
versions: z/OS 2.4, 2.5, 3.1 (base SMF; Communications Server for type 119)
draft: true
references:
- >-
  https://www.ibm.com/docs/en/zos/3.1.0?topic=sr-record-type-14-x0e-input-rdback-data-set-activity
- https://www.ibm.com/docs/en/zos/2.4.0?topic=records-smf-record-type-30
- >-
  https://www.ibm.com/docs/en/zos/3.1.0?topic=records-ftp-server-transfer-completion-record-subtype-70
- >-
  https://www.ibm.com/docs/en/zos/2.4.0?topic=es-smf-119-tcp-connection-termination-record-subtype-2-enhanced-provide-ip-filter-information
- https://www.ibm.com/docs/en/zos/2.5.0?topic=reference-type-118-smf-records
- >-
  https://www.ibm.com/docs/en/zos/2.4.0?topic=records-record-type-92-x5c-file-system-activity
- https://www.ibm.com/docs/en/SSLTBW_3.1.0/pdf/ieag200_v3r1.pdf
- https://www.ibm.com/support/pages/apar/OA50737
- >-
  https://www.ibm.com/docs/en/taw/1.3.0?topic=sr-smf-type-42-6-dasd-data-set-io-report
- https://ibm.github.io/IBM-SMF-Explorer/mappings/smf30/SMF30S4/
- https://www.ibm.com/docs/en/zcdp/5.1.0?topic=engine-smf-data-stream-reference
- https://www.pacsys.com/smf/smf30_v2r4.htm
- http://www.pacsys.com/smf/smf14.htm
- http://www.pacsys.com/smf/smf119_subtype02.htm
- http://www.pacsys.com/smf/smf119_subtype03.htm
- https://docs.zetaly.io/docs/smf-42-6-dasd-data-set-level-io-statistics
- https://docs.bmc.com/docs/amidefzos/61/overview-932976759.html
- >-
  https://docs.bmc.com/docs/amidefzos/61/proprietary-syslog-format-extensions-932976770.html
datasets:
- id: job-accounting
  name: Job and step accounting (SMF type 30)
  description: >
    Address-space accounting written by the system for every batch job, TSO
    session and started task: subtype 1 when the address space is created,
    subtype 4 at step end, subtype 5 at job end, and subtypes 2 and 3 at
    interval boundaries for long-running work. This is the closest thing z/OS
    has to process-execution telemetry - the program that ran (SMF30PGM), the
    job it ran under (SMF30JBN), the RACF identity it ran as (SMF30RUD), the
    ASID it occupied, how it ended, and what it consumed. It is written by the
    system, not by the security manager, so it sees work that RACF never
    audits: an authorized program run out of hours, a batch job that appears
    on an LPAR it has no business on, an abend pattern against a sensitive
    load library. Fields below are the documented SMF mapping-macro names
    (IFASMF30 / IFASMFR), not the names of any one formatter's output: they
    are what the site's offload step must be told to emit, and they are how a
    field in this table is traced back to a byte offset in a section of the
    record. Two honest gaps: there is no command line - z/OS has PGM= and
    PARM=, and SMF 30 carries the program name but not the PARM string, so
    process.command_line is genuinely absent; and the processor-accounting
    section, addressed by the SMF30COF, SMF30CLN and SMF30CON triplet, was not
    confirmed to individual field names here, so the CPU and elapsed numbers
    it carries are described rather than inventoried.
  event_categories:
  - process
  route:
    guarded:
    - hop: other
      name: z/OS SMF offload - IFASMFDP dump plus site formatter (or a real-time SMF agent)
      notes: >
        This is where the binary becomes text, and it is the hop every field
        name in this document depends on. SMF type 30 is written as binary
        records to VSAM man-data sets or to a System Logger log stream;
        nothing off-platform reads it in that form. The established path is a
        scheduled IFASMFDP dump followed by a formatting step on the LPAR - a
        DFSORT/ICETOOL job or a site program using the IFASMF30 mapping macro
        - that emits one delimited text line per record carrying the SMF30
        field names below, which is then moved by batch SFTP. That makes this
        a periodic file drop, not a stream: end-to-end latency is the dump
        interval, commonly 15 minutes to 24 hours. Sites running IBM Z Common
        Data Provider (System Data Engine off the SMF in-memory resource or
        log stream) or a commercial real-time agent such as BMC AMI Defender
        for z/OS get a near-real-time push instead. Which of the two is in
        play must be confirmed per LPAR before any detection is written
        against this dataset; it changes alerting latency by orders of
        magnitude and it changes who owns the EBCDIC-to-UTF-8 transcode.
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Cribl receives either a Filesystem/S3 Collector run over the formatted
        dump output or a TCP/HTTP source fed by the real-time agent; that
        collector runs in the mainframe enclave and pushes across the guard.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_smf.job_accounting
    direct:
    - hop: other
      name: z/OS SMF offload - IFASMFDP dump plus site formatter (or a real-time SMF agent)
      notes: >
        Same extraction reality as the guarded side: SMF 30 is binary until an
        on-LPAR step formats it. Either a scheduled IFASMFDP dump plus a
        DFSORT/IFASMF30 formatting job writes delimited text that batch SFTP
        moves, or IBM Z Common Data Provider / a commercial real-time agent
        pushes formatted records as they are written. Confirm which per LPAR;
        the field names are the same either way, the latency is not.
    - hop: cribl
      location: edge worker group
      notes: >
        Cribl receives either a Filesystem/S3 Collector run over the formatted
        dump output or a TCP/HTTP source fed by the real-time agent.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_smf.job_accounting
  formats:
  - format: other
    parsing:
      mechanism: cribl-pipeline
      artifact: custom SMF-30 delimited-record pipeline
      notes: >
        No Elastic integration and no Cribl pack exists for base z/OS SMF, so
        the parser is hand-built against the site's own formatter output. The
        important consequence of that: the delimiter, the column order and the
        null representation are decided by the DFSORT/ICETOOL job, not by IBM,
        so the pipeline is written against a captured sample and the formatter
        job must be treated as part of the parser and version-controlled with
        it. Only the field names below are stable, because they come from the
        IBM mapping macro. Subtype selection also belongs to the formatter:
        emitting every SMF 30 subtype produces interval records (2 and 3) at
        several times the volume of the lifecycle records that carry the
        security signal, so the offload should select subtypes 1, 4 and 5
        unless a specific need for interval accounting is agreed.
    fields:
    - vendor: SMF30STP
      type: integer
      description: record subtype - 1 job start, 4 step end, 5 job end, 2/3 interval
      ecs: event.action
      status: mapped
      transform: >
        map the numeric subtype to a stable verb (1 to job-start, 4 to
        step-end, 5 to job-end, 2 and 3 to interval-accounting) rather than
        indexing the integer; the subtype is the only thing in the record that
        says what happened, so an unmapped subtype must dead-letter rather
        than land with an empty event.action
    - vendor: SMF30TME / SMF30DTE
      type: timestamp
      description: >-
        time (hundredths of a second since midnight) and date (0cyydddF packed
        julian) the record was moved to the SMF buffer, in two header fields
      ecs: '@timestamp'
      status: partial
      transform: >
        the two header fields must be combined into one value; they are local
        LPAR time with no zone, so the LPAR's UTC offset has to be applied
        before indexing, and the packed julian date has to be converted by the
        formatter or the pipeline
      notes: >
        this is when SMF buffered the record, not when the step ran; for
        subtype 4 and 5 records the two are close, but a long-running address
        space's subtype 1 is written at creation and its subtype 5 hours
        later, so event.start / event.end from the accounting section is what
        a duration question needs, not this
    - vendor: SMF30SID
      type: string
      description: four-character SMF system identifier of the LPAR, from the SID parameter
      ecs: host.name
      status: mapped
      notes: >
        the same LPAR identity the RACF datasets key on, so zos-racf and
        zos-smf records join on host.name; on a sysplex it identifies the
        member, never the sysplex, and must not be collapsed across members
    - vendor: SMF30SYN
      type: string
      description: system name from the SYSNAME parameter in IEASYSxx
      ecs: host.hostname
      status: partial
      notes: >
        conventionally identical to SMF30SID and often ignored for that
        reason, but the two are independently configurable and a site that has
        let them drift will have detections that silently match nothing;
        carrying both makes the drift visible
    - vendor: SMF30SYP
      type: string
      description: sysplex name the LPAR is a member of
      ecs: null
      status: unmapped
      custom: zos.smf.sysplex_name
      notes: >
        ECS has no sysplex concept and host.name is already the LPAR, so this
        is the grouping key that answers "which plex" without overloading a
        host field; kept at the technology level of the namespace because
        every dataset in this file carries it
    - vendor: SMF30JBN
      type: string
      description: job or session name (identification section)
      ecs: process.name
      status: mapped
      notes: >
        the address space name as the operator and every other mainframe tool
        sees it, which is what an analyst will pivot on; zos-racf maps its own
        job name to a custom key because a RACF audit record's job name is
        incidental context, but on SMF 30 the address space is the subject of
        the record and process.name is the honest target
    - vendor: SMF30PGM
      type: string
      description: program name, taken from the PGM= parameter on the EXEC statement
      ecs: process.executable
      status: partial
      notes: >
        the load module that ran - the closest thing to an executable - but it
        is a member name, not a path: the library it was loaded from is
        resolved through the STEPLIB/JOBLIB concatenation and is not in this
        section, so process.executable holds a bare eight-character name and
        cannot be treated as a filesystem path
    - vendor: SMF30STM
      type: string
      description: step name from the EXEC statement
      ecs: null
      status: unmapped
      custom: zos.smf.job_accounting.step_name
      notes: >
        JCL step identity, not a process attribute; with SMF30STN it is what
        makes several subtype 4 records reassemble into one job in the right
        order
    - vendor: SMF30STN
      type: integer
      description: step number within the job
      ecs: null
      status: unmapped
      custom: zos.smf.job_accounting.step_number
    - vendor: SMF30JNM
      type: string
      description: JES job identifier (for example JOB01234)
      ecs: null
      status: unmapped
      custom: zos.smf.job_accounting.jes_job_id
      notes: >
        the join key to every other SMF record for the same unit of work,
        including the SMFJOBID the dataset-access records carry; not
        process.entity_id, because a subtype 4 record is a step and several
        share one job id, so it is not unique per document
    - vendor: SMF30ASI
      type: integer
      description: address space identifier (ASID) the work occupied
      ecs: process.pid
      status: partial
      notes: >
        the genuine z/OS analogue of a pid, and it is what a memory-level
        investigation needs; the caveat is reuse - ASIDs are recycled as
        address spaces end, so process.pid is only unique within (host.name,
        time window) and must never be used as a document key
    - vendor: SMF30RUD
      type: string
      description: RACF user ID the address space ran under, taken from the ACEE
      ecs: user.name
      status: mapped
      notes: >
        the security identity, and the reason this record type is worth
        collecting at all: it is the field that makes "which user ran this
        program" answerable without a RACF audit record existing
    - vendor: SMF30GRP
      type: string
      description: RACF group ID (connect group) from the ACEE
      ecs: user.group.name
      status: mapped
    - vendor: SMF30USR
      type: string
      description: 'programmer''s name from the JOB statement'
      ecs: user.full_name
      status: partial
      notes: >
        free text a submitter types on the JOB card, not a directory-sourced
        display name; useful for triage, worthless as an identity assertion,
        and it should never be joined on
    - vendor: SMF30TID
      type: string
      description: RACF terminal ID associated with the address space
      ecs: null
      status: unmapped
      custom: zos.smf.job_accounting.terminal
      notes: >
        3270 terminal identity, blank for batch; not an ECS network address
        and not resolvable to one, exactly as zos-racf treats INIT_TERM
    - vendor: SMF30CL8
      type: string
      description: eight-character job class
      ecs: null
      status: unmapped
      custom: zos.smf.job_accounting.job_class
      notes: >
        the older single-character SMF30CLS is still present for
        compatibility; take SMF30CL8 and let the short form fall away
    - vendor: SMF30UIF
      type: string
      description: user-defined identification field from the JOB statement
      ecs: null
      status: unmapped
      custom: zos.smf.job_accounting.user_identification
      notes: >
        an accounting string the submitter chooses, deliberately not mapped to
        any user.* field - it looks like an identity and is not one, and
        conflating it with SMF30RUD is the single easiest way to author a
        wrong mainframe detection
    - vendor: SMF30PSN
      type: string
      description: name of the cataloged procedure that invoked the step
      ecs: null
      status: unmapped
      custom: zos.smf.job_accounting.procedure_name
      notes: >
        tempting as process.parent.name, but a procedure is expanded JCL
        rather than a parent process, and mapping it would put a non-executing
        thing into the process ancestry
    - vendor: SMF30SCC
      type: integer
      description: step or job completion code (completion section)
      ecs: process.exit_code
      status: partial
      transform: >
        the accompanying flag distinguishes a user abend from a system abend
        from a normal return code, so the raw halfword must be interpreted
        rather than indexed alone; carry the abend flavour into
        zos.smf.job_accounting.termination_flags
    - vendor: SMF30STI
      type: enum
      description: >-
        step/job termination indicator flags - abended, flushed, to be
        restarted, EXCP counts unreliable
      ecs: null
      status: unmapped
      custom: zos.smf.job_accounting.termination_flags
      notes: >
        collapses naturally into a keyword array; the flushed and
        to-be-restarted flags are what stop a restart storm being read as
        repeated failed executions
    - vendor: SMF30ARC
      type: integer
      description: abend reason code accompanying the completion code
      ecs: null
      status: unmapped
      custom: zos.smf.job_accounting.abend_reason_code
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse on the low side, in the mainframe enclave, because there is no
          Elastic integration to parse for us and because the record crosses a
          guard: emit one flat ECS-shaped JSON object per SMF 30 record and
          let nothing formatter-shaped travel. Do the three things only the
          low side can do correctly - combine SMF30DTE and SMF30TME into a
          single UTC @timestamp using the LPAR's configured offset, resolve
          SMF30STP to a stable event.action verb and dead-letter unknown
          subtypes rather than indexing a bare integer, and interpret SMF30SCC
          with its abend flag instead of shipping a raw halfword. Drop
          subtypes 2 and 3 here if the offload could not be narrowed on the
          LPAR, since interval accounting is most of the volume and none of
          the signal. Validate against a Cribl Schema Library schema
          immediately before the forwarding destination with a dead-letter
          route, and run the destination on Persistent Queue backpressure so a
          dump-interval burst does not drop records.
        elastic: >
          Own a custom logs-zos_smf.job_accounting ingest pipeline that
          finishes only what the low side cannot. Add explicitly typed
          index-template mappings for zos.smf.sysplex_name and the
          zos.smf.job_accounting.* keys - step_name, step_number, jes_job_id,
          job_class, terminal, user_identification, procedure_name,
          termination_flags and abend_reason_code - as keyword, and
          abend_reason_code as long, so dynamic mapping never decides them.
          Build the enrichment that makes this dataset useful high-side: an
          enrich policy keyed on process.executable that tags known
          authorized-library programs, and a runtime join from
          zos.smf.job_accounting.jes_job_id to the dataset-access records so
          "what did this job open" is one query. Document in the template that
          process.command_line is permanently absent for this source, so the
          process alerting profile's gap is a known property rather than a
          collection failure.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) - one JSON object
          per SMF 30 record, UTF-8, LF-terminated, compression disabled,
          nesting depth of two or less. NDJSON replaces CEF here; there is no
          CEF anywhere on this path unless the site chooses the BMC agent, and
          even then the CEF is parsed out low-side and never crosses. The
          source is EBCDIC, so transcode to UTF-8 low-side and strip the
          trailing blank padding IBM writes into every fixed-width field, or
          the guard's filter sees one long line of padding rather than a
          record. The content-filter friction to settle with the guard owner
          is small and specific: SMF30USR and SMF30UIF are free text a
          submitter types on a JOB card and are the only unbounded fields in
          the inventory - cap and flag both low-side to a length the custom
          filter accepts. Reassembly and redaction stay low-side. With no
          return channel and a batch dump upstream, reconcile low-side and
          high-side counts per (dataset, SMF dump interval) rather than per
          hour, and keep _raw until the formatter's column order is proven
          stable across a change window.
      direct:
        parse_location: low
        cribl: >
          Parse in the edge pipeline for the same reason as the guarded side -
          there is no Elastic integration for base SMF, so somebody has to,
          and doing it next to the source keeps the formatter and the parser
          in one blast radius. Combine SMF30DTE and SMF30TME into a single UTC
          @timestamp with the LPAR offset, resolve SMF30STP to a stable
          event.action verb with unknown subtypes dead-lettered, and interpret
          SMF30SCC with its abend flag rather than shipping a raw halfword.
          Drop subtypes 2 and 3 if the offload could not be narrowed on the
          LPAR. Validate against a Cribl Schema Library schema before the
          destination with a dead-letter route, and run on Persistent Queue
          backpressure to absorb the dump-interval burst.
        elastic: >
          Target the same custom logs-zos_smf.job_accounting pipeline and
          index template the guarded feed uses, so the two enclaves' copies of
          this technology stay one schema. Type zos.smf.sysplex_name and the
          zos.smf.job_accounting.* keys explicitly as keyword, with
          abend_reason_code as long. Add the authorized-library enrich policy
          on process.executable and the jes_job_id join to the dataset-access
          records here as well, and record that process.command_line is
          permanently absent for this source rather than leaving it looking
          like a collection gap.
  - format: syslog-cef
    enable: >
      Install BMC AMI Defender for z/OS (the former CorreLog SIEM Agent for
      z/OS) as a started task on the LPAR to replace the IFASMFDP dump with a
      real-time feed. The agent monitors SMF as records are written, selects
      the record types and the individual SMF fields named in its FIELDS
      parameter, reformats each into a syslog message, and sends it over
      UDP/IP, TCP/IP or encrypted TCP/IP to a syslog destination - here a
      Cribl Syslog Source in the mainframe enclave. Set OPTions SIEMtype(CEF)
      to get CEF-framed output instead of the product's proprietary syslog
      extensions; LEEF is available on the same switch for a QRadar estate and
      is the wrong choice for this path. Configure the SMF 30 selection to
      subtypes 1, 4 and 5, and confirm the FIELDS list names every SMF30 field
      the inventory above depends on before cutover, because the agent emits
      what it is told to emit and nothing else.
    references:
    - https://docs.bmc.com/docs/amidefzos/61/overview-932976759.html
    - >-
      https://docs.bmc.com/docs/amidefzos/61/proprietary-syslog-format-extensions-932976770.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom SMF-30 CEF pipeline
      notes: >
        No Elastic integration and no Cribl pack normalizes z/OS SMF in any
        encoding, so CEF is parsed by a custom pipeline keyed off the "CEF:0"
        banner. This encoding is materially easier than the dump path in three
        ways that matter: the agent has already transcoded EBCDIC, the
        extension is named key=value rather than positional columns, and the
        feed is real time rather than a dump interval. What it does not change
        is the field vocabulary - the agent's FIELDS parameter selects SMF
        field names, so the CEF extension keys are the same SMF30 names the
        `other` entry inventories, and the two encodings converge on one ECS
        mapping.
    fields_omitted: >
      The CEF extension keys are the SMF30 field names the `other` format
      entry already tables, selected by the agent's FIELDS parameter, so
      repeating them here would publish the same inventory twice under a
      different heading. What is genuinely different and is not tabled is the
      CEF header - the vendor, product, signature id and severity BMC assigns
      per SMF record type - whose per-type values sit behind BMC documentation
      that could not be retrieved for this entry and must be confirmed against
      a captured sample from the site's own agent.
    fields: []
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Terminate the syslog stream on the edge worker group in the
          mainframe enclave and unpack CEF there - CEF is parsed out low-side
          everywhere in this estate, and a real-time agent feed is exactly the
          case where doing it anywhere else buys nothing. Key on the "CEF:0"
          banner, split the extension into named SMF30 keys, and land the
          result in the same ECS shape the dump-path pipeline produces so a
          site running both encodings during a migration does not fork the
          schema. Apply the LPAR timezone to the agent's event time, which is
          naive local time, resolve SMF30STP to the same event.action verbs,
          and assert that the FIELDS-selected key set actually contains
          user.name and process.name before forwarding - an agent
          misconfiguration silently produces well-formed CEF with no identity
          in it. Schema-validate before the destination behind a dead-letter
          route and run on Persistent Queue backpressure.
        elastic: >
          Land in the same custom logs-zos_smf.job_accounting ingest pipeline
          and index template the dump path targets, so the encoding a site
          chooses is a transport decision rather than a schema decision. Keep
          the zos.smf.job_accounting.* keys typed as keyword high-side, and
          hold the CEF-header-to-event.code crosswalk as a documented,
          versioned mapping so a BMC signature-id change is caught rather than
          silently dynamic-mapped. The one thing to add for this encoding is a
          completeness check: because the agent emits only the FIELDS it was
          given, alert on a sustained drop in the population rate of
          user.name, not just on record volume.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), one record per
          line, UTF-8, LF-terminated, compression disabled, nesting depth two
          or less. Nothing CEF-shaped crosses the guard: the CEF is resolved
          to named fields low-side and the boundary sees an allow-listed key
          set, which is the whole point of parsing low. This encoding is the
          easier of the two at the boundary because the agent has already
          transcoded EBCDIC and there is no fixed-width padding to normalize;
          the remaining friction is the same free text the dump path has,
          SMF30USR and SMF30UIF, capped and flagged low-side. Reassembly and
          redaction stay low-side. Because the feed is real time rather than
          batched, reconcile counts per (dataset, hour) here rather than per
          dump interval.
      direct:
        parse_location: low
        cribl: >
          Terminate the syslog stream on the edge worker group and unpack CEF
          there, keyed on the "CEF:0" banner, landing the result in the same
          ECS shape the dump-path pipeline produces. Apply the LPAR timezone
          to the agent's naive local event time, resolve SMF30STP to the same
          event.action verbs, and assert the FIELDS-selected key set contains
          user.name and process.name before forwarding. The decision this
          encoding really represents is latency against coverage: the agent
          gives near-real-time SMF 30 and removes the dump-interval delay
          entirely, but it only ever emits the fields it was configured with,
          so verify the FIELDS list against the inventory before retiring the
          dump path rather than after. Schema-validate before the destination
          behind a dead-letter route, on Persistent Queue backpressure.
        elastic: >
          Target the same custom logs-zos_smf.job_accounting pipeline and
          template as the dump path so all producers converge on one ECS
          schema. Type the zos.smf.job_accounting.* keys as keyword, hold the
          CEF-header-to-event.code crosswalk as a versioned mapping so a BMC
          signature-id change is caught, and alert on a sustained drop in the
          population rate of user.name so an agent misconfiguration surfaces
          as a detection gap rather than as quiet nulls.
- id: dataset-access
  name: Data set open and I/O activity (SMF types 14, 15 and 42 subtype 6)
  description: >
    Which data set was touched, by which job, on which volume. Type 14 is
    written when a non-VSAM data set is opened for INPUT or RDBACK; type 15 is
    written when one is opened for OUTPUT, UPDAT, INOUT or OUTIN. The two have
    identical layouts and identical field names - both use the SMF14 prefix -
    so the record type itself is the read/write discriminator. This dataset
    deliberately folds in SMF type 42 subtype 6, the DASD data-set-level I/O
    statistics record, because 14 and 15 answer "who opened it" and stop
    there: they are written at OPEN and say nothing about what was actually
    read or written afterwards. 42.6 is the practical answer to "what did this
    job actually touch", with per-data-set I/O and read counts, and it uses a
    different prefix family (S42DS.../S42JD...), which is why the inventory
    below is explicit about which record each field comes from. The limitation
    an engineer must know before writing a detection: SMF 14/15 carries no
    RACF user ID. SMF14UID is the user-defined identification field from the
    JOB statement, which is an accounting string, not an identity. The
    authenticated user has to be joined in from the SMF 30 job-accounting
    record on job name plus JES job id, and any detection that skips that join
    is attributing data set access to a string the submitter chose.
  event_categories:
  - file
  route:
    guarded:
    - hop: other
      name: z/OS SMF offload - IFASMFDP dump plus site formatter (or a real-time SMF agent)
      notes: >
        Same extraction reality as the job-accounting dataset, and the same
        place the binary becomes text: an IFASMFDP dump plus a DFSORT/ICETOOL
        or IFGSMF14-based formatting step on the LPAR, moved by batch SFTP, or
        a real-time agent pushing formatted records as they are written. One
        thing is specific to this dataset - volume. Type 14 and 15 are written
        on every data set open on the system, which on a busy LPAR is by a
        wide margin the highest-rate record type in this document, and 42.6
        adds an interval record per data set on top. The subtype and data set
        name selection has to happen in the offload step on the LPAR, not
        downstream, or the feed is unaffordable before it reaches the guard.
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Cribl receives either a Filesystem/S3 Collector run over the formatted
        dump output or a TCP/HTTP source fed by the real-time agent; the
        second, coarser volume filter (system and temporary data set name
        patterns) lands here, after the LPAR-side selection.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_smf.dataset_access
    direct:
    - hop: other
      name: z/OS SMF offload - IFASMFDP dump plus site formatter (or a real-time SMF agent)
      notes: >
        Same extraction reality as the guarded side: an IFASMFDP dump plus an
        on-LPAR formatting step, or a real-time agent. The volume caveat is
        identical and is the first thing to settle - open records are written
        for every data set open on the system, so the selection belongs in the
        offload step rather than downstream.
    - hop: cribl
      location: edge worker group
      notes: >
        Cribl receives either a Filesystem/S3 Collector run over the formatted
        dump output or a TCP/HTTP source fed by the real-time agent, and
        applies the second, coarser data set name volume filter.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_smf.dataset_access
  formats:
  - format: other
    parsing:
      mechanism: cribl-pipeline
      artifact: custom SMF-14/15 and SMF-42.6 delimited-record pipeline
      notes: >
        No Elastic integration and no Cribl pack exists for base z/OS SMF; the
        parser is hand-built against the site's formatter output, and the
        formatter job is part of the parser and version-controlled with it.
        Two structural facts drive this pipeline. First, type 14 and type 15
        share one layout and one field-name family, so a single branch parses
        both and the record type sets the direction - do not build two
        parsers. Second, the record is section-based rather than flat: the
        data set name comes from the embedded JFCB, the device and volume from
        a repeating UCB section, and the job id and sysplex name from the step
        information section (type 3), so the formatter must be told which
        sections to emit and the pipeline must tolerate their absence. The
        42.6 records are a separate branch keyed on the S42 prefix family and
        land as their own documents in the same data stream.
    fields:
    - vendor: SMF14RTY
      type: integer
      description: record type - 14 for INPUT/RDBACK open, 15 for OUTPUT/UPDAT/INOUT/OUTIN open
      ecs: event.action
      status: mapped
      transform: >
        map 14 to dataset-open-input and 15 to dataset-open-output; this is
        the read/write discriminator and it lives in the record type rather
        than in any field, which is the single most common mistake made when
        mapping these records
      notes: >
        the open intent is what OPEN requested, not what the program then did
        - a data set opened for OUTPUT and never written still produces a type
        15 record
    - vendor: SMF14TME / SMF14DTE
      type: timestamp
      description: >-
        time (hundredths of a second since midnight) and date (0cyydddF packed
        julian) the record was moved to the SMF buffer
      ecs: '@timestamp'
      status: partial
      transform: >
        combine the two header fields, convert the packed julian date, and
        apply the LPAR's UTC offset before indexing
    - vendor: SMF14SID
      type: string
      description: four-character SMF system identifier of the LPAR
      ecs: host.name
      status: mapped
    - vendor: SMF14JBN
      type: string
      description: job or session name that opened the data set
      ecs: process.name
      status: mapped
      notes: >
        the same address space name SMF30JBN carries, and half of the join key
        back to the job-accounting record that holds the RACF user ID
    - vendor: SMFJOBID
      type: string
      description: JES job identifier, from the step information section (type 3)
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.jes_job_id
      notes: >
        added to type 14/15 with the step information section in DFSMS 2.2
        (APAR OA50737) and the reason this dataset can be joined to SMF 30 at
        all - job name alone is ambiguous across reruns; a site below that
        maintenance level has to fall back to job name plus time window, which
        is materially weaker
    - vendor: SMFPLXID
      type: string
      description: sysplex name, from the step information section (type 3)
      ecs: null
      status: unmapped
      custom: zos.smf.sysplex_name
      notes: added by the same APAR as SMFJOBID; the same key the SMF 30 records use
    - vendor: SMF14UID
      type: string
      description: user-defined identification field from the JOB statement
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.user_identification
      notes: >
        deliberately not mapped to user.name. This is an accounting string the
        submitter types on the JOB card, and SMF 14/15 has no RACF user ID at
        all; user.name for this dataset must come from the SMF 30 join on
        SMFJOBID, and mapping this field would make an unauthenticated string
        look like an authenticated identity in every file-activity query
    - vendor: SMF14_JFCBDSNM
      type: string
      description: 44-character data set name, from the embedded JFCB
      ecs: file.path
      status: mapped
      notes: >
        a catalog name, not a filesystem path - dotted qualifiers with no
        leading separator, and the same name can exist on several volumes, so
        file.path alone does not identify a physical data set; pair it with
        the volume serial for that
    - vendor: SMF14_JFCBELNM
      type: string
      description: PDS member name, from the embedded JFCB
      ecs: file.name
      status: partial
      notes: >
        the member within a partitioned data set, which is the closest z/OS
        gets to a file inside a directory; empty for sequential data sets, and
        it must not be concatenated into file.path or the catalog name stops
        matching
    - vendor: SMF14_JFCBCRDT
      type: timestamp
      description: data set creation date, packed YYDDDD
      ecs: file.created
      status: partial
      transform: >
        expand the packed two-digit year with the same century window the site
        uses elsewhere; the field is a date with no time component, so
        file.created lands at midnight LPAR time
    - vendor: SMF14_JFCBXPDT
      type: timestamp
      description: data set expiration date
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.expiration_date
      notes: >
        retention metadata with no ECS equivalent; worth carrying because an
        open against a data set past its expiration date is a recognizable
        housekeeping-bypass pattern
    - vendor: SMF14OPE
      type: timestamp
      description: time the data set was opened
      ecs: event.start
      status: partial
      transform: >
        apply the LPAR's UTC offset and take the date from the record header,
        which is where the date lives - this field is a time of day only
    - vendor: SMF14RIN
      type: enum
      description: >-
        record and data set indicator bits - EOV, DASD, temporary data set,
        data set organization
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.dataset_indicators
      notes: >
        collapses into a keyword array; the temporary-data-set bit is the most
        useful single flag in the record because dropping temporary data sets
        removes most of the volume without losing signal
    - vendor: SMF14DCBOR
      type: enum
      description: data set organization from the DCB (sequential, partitioned, direct)
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.dataset_organization
    - vendor: SMF14DCBRF
      type: enum
      description: record format from the DCB (F, FB, V, VB, U and variants)
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.record_format
    - vendor: SMF14UCBDV
      type: string
      description: device number, from the UCB section
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.device_number
      notes: >
        the UCB section repeats once per volume for a multi-volume data set,
        so this is an array in practice and a pipeline that takes only the
        first occurrence silently loses the rest
    - vendor: SMF14EXCP
      type: integer
      description: EXCP count for the entire step, from the UCB section
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.excp_count
      notes: >
        a step-level channel-program count, not a per-data-set I/O count - the
        per-data-set numbers are the S42DS fields below, which is exactly why
        42.6 is folded into this dataset
    - vendor: S42DSN
      type: string
      description: data set name (SMF 42 subtype 6 data set header section)
      ecs: file.path
      status: mapped
      notes: >
        the 42.6 counterpart of SMF14_JFCBDSNM and the field that lets an
        analyst pivot from "opened" to "actually read or written" on one
        file.path; the two record families produce separate documents in the
        same data stream and are joined at query time, not at ingest
    - vendor: S42JDJNM
      type: string
      description: job name (SMF 42 subtype 6)
      ecs: process.name
      status: mapped
    - vendor: S42JDUID
      type: string
      description: user identification carried on the SMF 42 subtype 6 record
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.io_user_identification
      notes: >
        left unmapped on purpose. IBM's own documentation for this field was
        not reachable here, so whether it carries the RACF user ID or the
        JOB-card accounting string like SMF14UID is unconfirmed; mapping it to
        user.name on a guess would put an unverified identity into every file
        query, and the honest move is to carry it in the custom namespace
        until a site sample settles it
    - vendor: S42DSVOL
      type: string
      description: volume serial number the data set resides on (SMF 42 subtype 6)
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.volume_serial
      notes: >
        the second half of a physical data set identity; ECS has no volume
        concept, and file.device is documented for a device name rather than a
        DASD volume label, so this stays custom
    - vendor: SMF42SID
      type: string
      description: system name on the SMF 42 record
      ecs: host.name
      status: mapped
    - vendor: SMF42PTS
      type: timestamp
      description: interval start, or data set OPEN time of day (SMF 42 subtype 6)
      ecs: event.start
      status: partial
      transform: 'apply the LPAR''s UTC offset and take the date from the record header'
    - vendor: SMF42PTE
      type: timestamp
      description: interval end time (SMF 42 subtype 6)
      ecs: event.end
      status: partial
      transform: 'apply the LPAR''s UTC offset and take the date from the record header'
    - vendor: S42DSION
      type: integer
      description: total number of I/O operations against the data set in the interval
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.io_count
      notes: >
        with S42DSRDT this is the volumetric signal - a job whose read count
        against a sensitive data set is orders of magnitude above its own
        baseline is the exfiltration-shaped pattern on this platform, and
        neither number exists anywhere in type 14/15
    - vendor: S42DSRDT
      type: integer
      description: total number of read operations against the data set in the interval
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.read_count
    - vendor: S42DSMXR
      type: float
      description: maximum data set I/O response time in seconds
      ecs: null
      status: unmapped
      custom: zos.smf.dataset_access.max_response_time
      notes: >
        performance rather than security, carried only because it is free and
        because a response-time cliff is often the first visible sign of a
        bulk copy nobody scheduled
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse low-side, in the mainframe enclave, and treat volume as the
          first-class problem this dataset has: type 14 and 15 are written on
          every data set open on the LPAR, so the pipeline's first stage is a
          suppression list on file.path - temporary data sets (the SMF14RIN
          temporary bit), SYS1.* system libraries, and the site's known
          high-churn work data sets - applied before any enrichment work is
          spent. Then do what only the low side can: set event.action from the
          record type (14 to dataset-open-input, 15 to dataset-open-output)
          because the read/write direction lives in the record type and not in
          a field, combine SMF14DTE and SMF14TME into a UTC @timestamp with
          the LPAR offset, and handle the repeating UCB section as an array
          rather than taking its first occurrence. Route the S42 branch
          through the same ECS shaping so the two record families land
          field-compatible. Leave user.name empty rather than filling it from
          SMF14UID. Validate against a Cribl Schema Library schema before the
          forwarding destination with a dead-letter route, on Persistent Queue
          backpressure.
        elastic: >
          Own a custom logs-zos_smf.dataset_access ingest pipeline whose main
          job is the identity join the record cannot do for itself: enrich
          from the job-accounting data stream on
          zos.smf.dataset_access.jes_job_id to populate user.name and
          user.group.name from SMF30RUD and SMF30GRP, and mark records where
          the join failed so the file alerting profile's missing user.name is
          visibly a join miss rather than a silent null. Add explicitly typed
          index-template mappings for zos.smf.sysplex_name and the
          zos.smf.dataset_access.* keys as keyword, with io_count, read_count
          and excp_count as long and max_response_time as float, so volumetric
          detections aggregate correctly instead of on dynamically-mapped
          strings. Build the detections as per-(user.name, file.path)
          baselines rather than on single events - one data set open is
          nothing, an order-of-magnitude change in read_count against a
          classified data set is the finding.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), UTF-8 transcoded
          and blank-padding normalized low-side, LF-terminated, compression
          disabled, nesting depth two or less. No CEF exists on this path.
          This is the highest-volume dataset in the document and the crossing
          is where that hurts, so the suppression list is a relay concern and
          not only a cost one: agree with the guard owner a bounded
          records-per-interval figure and enforce it low-side with Persistent
          Queue rather than discovering it as guard backpressure. The
          content-filter friction is narrow and easy to explain - data set
          names are a well-formed dotted-qualifier grammar the filter can be
          given a regex for, and the only free text in the whole inventory is
          SMF14UID, capped and flagged low-side. Reassembly of the repeating
          UCB section is pinned low-side; a multi-volume record must cross as
          one object with an array, never as fragments. Reconcile counts per
          (dataset, SMF dump interval).
      direct:
        parse_location: low
        cribl: >
          Parse in the edge pipeline, with the same suppression-first shape:
          drop temporary data sets, SYS1.* system libraries and the site's
          high-churn work data sets before spending enrichment on them. Set
          event.action from the record type (14 to dataset-open-input, 15 to
          dataset-open-output), combine SMF14DTE and SMF14TME into a UTC
          @timestamp with the LPAR offset, handle the repeating UCB section as
          an array, and route the S42 branch through the same ECS shaping so
          the two record families land field-compatible. Leave user.name empty
          rather than filling it from SMF14UID - the join belongs downstream
          where the job-accounting records are. Schema-validate before the
          destination with a dead-letter route, on Persistent Queue
          backpressure.
        elastic: >
          Target the same custom logs-zos_smf.dataset_access pipeline and
          template as the guarded feed. The identity join is the substance
          here too: enrich from the job-accounting data stream on
          zos.smf.dataset_access.jes_job_id to populate user.name and
          user.group.name, and flag join misses explicitly. Type the
          zos.smf.dataset_access.* keys as keyword with the counters as long
          and max_response_time as float, and build detections as
          per-(user.name, file.path) baselines rather than per-event rules.
  - format: syslog-cef
    enable: >
      Install BMC AMI Defender for z/OS as a started task on the LPAR and
      select SMF record types 14, 15 and 42 in its configuration, naming the
      SMF14 and S42 fields the inventory above depends on in the FIELDS
      parameter. Set OPTions SIEMtype(CEF) for CEF-framed syslog and point the
      agent at a Cribl Syslog Source in the mainframe enclave over encrypted
      TCP. The volume warning applies with more force on this path than on the
      dump path: a real-time agent forwarding every data set open on a busy
      LPAR is a sustained syslog rate rather than a burst per dump interval,
      so the record and data set selection must be narrowed in the agent's own
      configuration on the LPAR before this feed is enabled, not in Cribl
      afterwards.
    references:
    - https://docs.bmc.com/docs/amidefzos/61/overview-932976759.html
    - >-
      https://docs.bmc.com/docs/amidefzos/61/proprietary-syslog-format-extensions-932976770.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom SMF-14/15 CEF pipeline
      notes: >
        Parsed by a custom pipeline keyed off the "CEF:0" banner, since no
        Elastic integration or Cribl pack normalizes z/OS SMF in any encoding.
        The agent's FIELDS parameter selects SMF field names, so the CEF
        extension keys are the same SMF14 and S42 names the `other` entry
        tables and both encodings converge on one ECS mapping. The real
        difference is that the section-walking problem disappears - the agent
        has already resolved the JFCB, UCB and step information sections into
        named keys and transcoded EBCDIC - at the cost of whatever the FIELDS
        list omits being unrecoverable downstream.
    fields_omitted: >
      The CEF extension keys are the SMF14 and S42 field names the `other`
      format entry already tables, selected by the agent's FIELDS parameter,
      so tabling them again would publish one inventory under two headings.
      The genuinely different part is the CEF header - the vendor, product,
      signature id and severity BMC assigns to record types 14, 15 and 42 -
      which sits behind BMC documentation that could not be retrieved for this
      entry and must be confirmed against a captured sample from the site's
      own agent.
    fields: []
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Terminate the syslog stream on the edge worker group in the
          mainframe enclave and unpack CEF there; CEF is parsed out low-side
          everywhere in this estate. Key on the "CEF:0" banner, split the
          extension into named SMF14 and S42 keys, and land the result in the
          same ECS shape the dump-path pipeline produces. Apply the
          suppression list here as the very first stage rather than after
          parsing - on this encoding the feed is a sustained rate rather than
          a periodic burst, and parsing every temporary data set open before
          discarding it is the cost that makes people turn the feed off. Set
          event.action from the CEF-carried record type, apply the LPAR
          timezone to the agent's naive local event time, and leave user.name
          empty for the downstream join. Schema-validate before the
          destination behind a dead-letter route, on Persistent Queue
          backpressure.
        elastic: >
          Land in the same custom logs-zos_smf.dataset_access pipeline and
          index template the dump path targets, including the same enrich
          policy that joins zos.smf.dataset_access.jes_job_id to the
          job-accounting stream for user.name and user.group.name. Keep the
          zos.smf.dataset_access.* keys typed as keyword with the counters as
          long, hold the CEF-header-to-event.code crosswalk as a documented
          versioned mapping, and add a completeness check specific to this
          encoding: alert on a sustained drop in the population rate of
          file.path, because an agent FIELDS change can produce well-formed
          CEF with no data set name in it.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), one record per
          line, UTF-8, LF-terminated, compression disabled, nesting depth two
          or less. Nothing CEF-shaped crosses the guard - it is resolved to an
          allow-listed key set low-side. This encoding is easier at the
          boundary than the dump path because the agent has already transcoded
          EBCDIC and flattened the sections, so there is no fixed-width
          padding and no multi-volume fragment reassembly to pin low-side. The
          rate is the thing to negotiate: agree a bounded records-per-hour
          figure with the guard owner and enforce it low-side with the
          suppression list and Persistent Queue. The only free text is
          SMF14UID, capped and flagged low-side. Reconcile counts per
          (dataset, hour) rather than per dump interval, since this feed is
          continuous.
      direct:
        parse_location: low
        cribl: >
          Terminate the syslog stream on the edge worker group and unpack CEF
          there, keyed on the "CEF:0" banner, with the suppression list as the
          first stage. Set event.action from the CEF-carried record type,
          apply the LPAR timezone to the agent's naive local event time, land
          the result in the same ECS shape the dump path produces, and leave
          user.name empty for the downstream join. The decision this encoding
          represents is latency against sustainable rate: it removes the
          dump-interval delay, which matters for data set access far less than
          it does for logon events, and it costs a permanent syslog rate
          proportional to every open on the LPAR - so prefer it only where the
          record selection has already been narrowed on the mainframe.
          Schema-validate before the destination behind a dead-letter route,
          on Persistent Queue backpressure.
        elastic: >
          Target the same custom logs-zos_smf.dataset_access pipeline and
          template as the dump path, with the same jes_job_id enrich policy
          for user.name and user.group.name. Type the zos.smf.dataset_access.*
          keys as keyword with the counters as long, hold the CEF-header
          crosswalk as a versioned mapping, and alert on a sustained drop in
          the population rate of file.path so an agent FIELDS change surfaces
          as a detection gap rather than as quiet nulls.
- id: tcpip
  name: TCP/IP, FTP and Telnet activity (SMF type 119)
  description: >
    z/OS Communications Server network telemetry, written as SMF type 119.
    Three subtypes carry the security signal and this dataset covers all
    three: subtype 70, the FTP server transfer completion record, one per file
    transferred, deleted or renamed through the z/OS FTP daemon; subtype 3,
    its client-side counterpart written when the mainframe is the FTP client;
    and subtype 2, the TCP connection termination record, which is a superset
    of the subtype 1 initiation record and carries the Telnet section for
    TN3270 sessions. The FTP transfer records are the highest-value item in
    this technology for a SOC: bulk data leaving the mainframe, with the file
    name, the user, the byte count and both endpoints on one record. Every
    subtype 119 record begins with the common TCP/IP identification section
    (SMF119TI_*), which is where the host, sysplex, stack and address-space
    identity come from, so those fields appear once in the inventory and apply
    to all three subtypes. SMF type 118 is the older record type covering the
    same ground - FTP subtypes 3 and 70-74, Telnet subtypes 20 and 21, socket
    API subtypes 1 and 2, mapped by the EZASMF76 macro - and is still enabled
    on many systems. It is not modelled as its own format entry here because
    it is a different record type rather than a different encoding, and
    because it should not be the feed anyone builds on: type 118 has no IPv6
    support at all, so a 118-based feed silently drops or truncates every
    connection that is not IPv4. Where 118 is all a site has, the FTP
    subcommand and Telnet connection status fields are the usable equivalents
    of SMF119FT_FSCmd and the subtype 2 Telnet section, and the migration to
    119 should be treated as a prerequisite rather than an improvement.
  event_categories:
  - network
  - file
  route:
    guarded:
    - hop: other
      name: z/OS SMF offload - IFASMFDP dump plus site formatter (or a real-time SMF agent)
      notes: >
        Same place the binary becomes text as the other datasets - an IFASMFDP
        dump plus an on-LPAR formatting step moved by batch SFTP, or a
        real-time agent - with one addition specific to type 119: z/OS
        Communications Server can write these records to an SMF log stream
        rather than to SMF man-data sets, and where that is configured the
        real-time path is available without a third-party agent. Whether the
        FTP daemon and the TN3270 server are actually configured to write
        SMF119 at all is a separate per-stack question from whether SMF is
        recording type 119: FTP.DATA SMF statements and the TCP/IP profile's
        SMFCONFIG and SMFPARMS settings decide which subtypes are produced,
        and a stack that produces none looks identical downstream to a quiet
        network.
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Cribl receives either a Filesystem/S3 Collector run over the formatted
        dump output or a TCP/HTTP source fed by the real-time agent or log
        stream reader; the subtype split into transfer records and connection
        records happens here, after collection and before the crossing.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_smf.tcpip
    direct:
    - hop: other
      name: z/OS SMF offload - IFASMFDP dump plus site formatter (or a real-time SMF agent)
      notes: >
        Same extraction reality as the guarded side, including the type 119
        log stream option that makes a real-time feed available without a
        third-party agent. Confirm per stack that FTP.DATA and the TCP/IP
        profile's SMFCONFIG/SMFPARMS settings actually produce the subtypes
        this dataset maps; a stack producing none is indistinguishable
        downstream from a quiet network.
    - hop: cribl
      location: edge worker group
      notes: >
        Cribl receives either a Filesystem/S3 Collector run over the formatted
        dump output or a TCP/HTTP source fed by the real-time agent or log
        stream reader, and splits transfer records from connection records.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zos_smf.tcpip
  formats:
  - format: other
    parsing:
      mechanism: cribl-pipeline
      artifact: custom SMF-119 delimited-record pipeline
      notes: >
        No Elastic integration and no Cribl pack exists for z/OS
        Communications Server SMF, so the parser is hand-built against the
        site's formatter output and the formatter job is version-controlled
        with it. Structurally this is a two-branch pipeline over one common
        header: the SMF119TI_ identification section is parsed once, then the
        subtype selects either the SMF119FT_FS transfer branch (70, and the
        client-side 3 with its own FT prefix variant) or the SMF119AP_TT
        connection branch (2, with the Telnet section present only for TN3270
        sessions). The single hardest thing to get right is not a field but an
        orientation: subtype 2 names its endpoints local and remote, not
        source and destination, and which is which depends on
        SMF119AP_TTStatus, so the mapping to source.* and destination.* is
        conditional and a pipeline that hardcodes it will invert half the
        estate's traffic.
    fields:
    - vendor: SMF119TI_SYSName
      type: string
      description: system name from SYSNAME in IEASYSxx (common TCP/IP identification section)
      ecs: host.name
      status: mapped
      notes: >
        the type 119 records identify the LPAR by SYSNAME rather than by the
        four-character SMF id the other datasets use, so a site whose SID and
        SYSNAME differ will not join zos-smf.tcpip to zos-smf.job_accounting
        on host.name without normalizing one to the other first
    - vendor: SMF119TI_SysplexName
      type: string
      description: sysplex name from SYSPLEX in COUPLExx
      ecs: null
      status: unmapped
      custom: zos.smf.sysplex_name
    - vendor: SMF119TI_Stack
      type: string
      description: TCP/IP stack name the record was written by
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.stack_name
      notes: >
        an LPAR can run several stacks (CINET), and they are separate network
        identities sharing one host.name; without this key their traffic is
        indistinguishable
    - vendor: SMF119TI_Comp
      type: enum
      description: TCP/IP subcomponent writing the record (FTPC, FTPS, IP, STACK, TCP)
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.component
      notes: >
        the cheapest subtype-independent discriminator between the FTP server,
        the FTP client and the stack, and a useful assertion that the branch
        the pipeline chose matches the record it actually has
    - vendor: SMF119TI_ASName
      type: string
      description: started task qualifier or address space name writing the record
      ecs: process.name
      status: partial
      notes: >
        the daemon - FTPD, TCPIP, the TN3270 server - not the remote party and
        not the user's work; it is the honest process identity for a network
        record and it is what makes the file alerting profile's process.name
        requirement satisfiable at all here, but it is deliberately coarse and
        must not be read as "the program that moved the data"
    - vendor: SMF119TI_ASID
      type: integer
      description: ASID of the address space writing the record
      ecs: process.pid
      status: partial
      notes: >
        same reuse caveat as SMF30ASI - unique only within (host.name, time
        window), never a document key
    - vendor: SMF119TI_UserID
      type: string
      description: user ID of the security context the SMF record was written under
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.record_writer_userid
      notes: >
        deliberately not user.name. On a subtype 70 record this is the FTP
        daemon's own started-task identity, not the client's; the client is
        SMF119FT_FSSUser. Mapping this to user.name would attribute every
        transfer on the system to the daemon and make FTP exfiltration
        detection impossible
    - vendor: SMF119FT_FSOper
      type: enum
      description: >-
        FTP operation on the server transfer record - Append, Delete, Rename,
        Retrieve, Store, Store Unique
      ecs: event.action
      status: mapped
      transform: >
        map to stable verbs (Retrieve to ftp-download, Store and Store Unique
        to ftp-upload, Append to ftp-append, Delete to ftp-delete, Rename to
        ftp-rename); the download/upload distinction is the direction of data
        movement and is what separates a routine job from an exfiltration
        question
    - vendor: SMF119FT_FSCmd
      type: string
      description: FTP command as defined by RFC 959 and successors
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.ftp_command
      notes: >
        the wire-level command behind SMF119FT_FSOper; kept as context rather
        than mapped, since event.action already carries the operation and two
        overlapping actions in one document invites contradictory detections
    - vendor: SMF119FT_FSSUser
      type: string
      description: client user ID the transfer was performed under on the server
      ecs: user.name
      status: mapped
      notes: >
        the RACF user the FTP daemon authenticated, and the only real identity
        on the record; this is the field that makes the FTP feed worth having
    - vendor: SMF119FT_FSFileName1
      type: string
      description: MVS data set or z/OS UNIX file name transferred, deleted or renamed
      ecs: file.path
      status: mapped
      notes: >
        one field holding two different grammars - a dotted catalog data set
        name or a slash-separated z/OS UNIX path - distinguishable by
        SMF119FT_FSDsType; a detection matching on path separators must
        account for both or it will only ever see half the transfers
    - vendor: SMF119FT_FSFileName2
      type: string
      description: new file or data set name, populated for rename operations
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.ftp_target_name
      notes: >
        the obvious ECS candidate is file.target_path, but that field is
        documented specifically as the target of a symlink and a rename
        destination is not one; keeping it custom avoids teaching every
        consumer that file.target_path means two different things
    - vendor: SMF119FT_FSM1
      type: string
      description: PDS member name associated with the transfer
      ecs: file.name
      status: partial
      notes: >
        the member inside a partitioned data set, empty for sequential data
        sets and z/OS UNIX files; must not be concatenated into file.path,
        exactly as SMF14_JFCBELNM is handled in the dataset-access map
    - vendor: SMF119FT_FSDsType
      type: enum
      description: data set type transferred - SEQ, PDS or z/OS UNIX
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.ftp_dataset_type
      notes: the discriminator that tells a parser how to read SMF119FT_FSFileName1
    - vendor: SMF119FT_FSDRIP
      type: ip
      description: remote IP address of the FTP data connection
      ecs: source.ip
      status: mapped
      notes: >
        on a server transfer record the remote end is the client, so remote
        maps to source and local to destination regardless of which way the
        bytes moved; the data direction is carried by event.action, not by the
        address orientation, and inverting the addresses to express direction
        would break every source/destination correlation
    - vendor: SMF119FT_FSDLIP
      type: ip
      description: local IP address of the FTP data connection
      ecs: destination.ip
      status: mapped
    - vendor: SMF119FT_FSDRPort
      type: integer
      description: remote port of the FTP data connection
      ecs: source.port
      status: mapped
    - vendor: SMF119FT_FSDLPort
      type: integer
      description: local port of the FTP data connection
      ecs: destination.port
      status: mapped
    - vendor: SMF119FT_FSCRIP
      type: ip
      description: remote IP address of the FTP control connection
      ecs: client.ip
      status: mapped
      notes: >
        the control connection is where the session was initiated from, which
        is what ECS client.* means; keeping it separate from source.ip matters
        because in passive mode the data connection can come from a different
        address than the control connection, and collapsing the two hides
        exactly the case worth alerting on
    - vendor: SMF119FT_FSCRPort
      type: integer
      description: remote port of the FTP control connection
      ecs: client.port
      status: mapped
    - vendor: SMF119FT_FSBytes
      type: integer
      description: number of bytes transmitted, 64-bit
      ecs: network.bytes
      status: mapped
      notes: >
        the volumetric field the whole dataset earns its place on; a 64-bit
        count, so it must be typed as long high-side and never allowed to
        dynamic-map from a formatter that emits it as a string
    - vendor: SMF119FT_FSSTime / SMF119FT_FSSDate
      type: timestamp
      description: time and date the transmission started
      ecs: event.start
      status: partial
      transform: 'combine the two fields and apply the LPAR''s UTC offset'
    - vendor: SMF119FT_FSETime / SMF119FT_FSEDate
      type: timestamp
      description: time and date the transmission ended
      ecs: event.end
      status: partial
      transform: >
        combine the two fields and apply the LPAR's UTC offset; the record is
        written at completion, so @timestamp and event.end are close and
        event.start can be well before the dump interval the record arrived in
    - vendor: SMF119FT_FSDur
      type: integer
      description: file transmission duration in hundredths of a second
      ecs: event.duration
      status: partial
      transform: >
        multiply by 10,000,000 to get the nanoseconds ECS expects; a raw
        hundredths value indexed into event.duration is wrong by seven orders
        of magnitude and will look plausible
    - vendor: SMF119FT_FSLReply
      type: integer
      description: last RFC 959 reply code sent to the client
      ecs: event.outcome
      status: partial
      transform: >
        derive success from a 2xx completion reply and failure from 4xx and
        5xx; 1xx and 3xx are intermediate and should not appear on a
        completion record, so treat them as unknown and flag rather than
        guessing. Carry the numeric code itself into
        zos.smf.tcpip.ftp_reply_code so the reason survives the collapse
    - vendor: SMF119FT_FSMechanism
      type: enum
      description: protection mechanism in use - None, GSSAPI or AT-TLS
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.ftp_protection_mechanism
      notes: >
        the cleartext-FTP finding in one field. tls.* was considered and
        rejected: AT-TLS is one of three values here and GSSAPI is not TLS at
        all, so populating a tls.* field from this would assert a protocol
        that may not be in use
    - vendor: SMF119FT_FSLoginMech
      type: enum
      description: login method used - password, certificate or Kerberos ticket
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.ftp_login_mechanism
      notes: >
        no ECS field describes how an already-authenticated session
        authenticated; worth carrying because a password login to an FTP
        service the site believes is certificate-only is a standing detection
    - vendor: SMF119AP_TTRName
      type: string
      description: >-
        address space name that closed the TCP connection (subtype 2
        connection termination section)
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.connection_owner_asname
      notes: >
        the same value SMF119TI_ASName carries on a subtype 2 record; kept as
        the section-level source rather than double-mapped to process.name, so
        that one document never has two vendor fields feeding one ECS field
    - vendor: SMF119AP_TTStatus
      type: enum
      description: socket type - passive (server) or active (client)
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.socket_role
      notes: >
        the discriminator the entire subtype 2 address mapping depends on: it
        is what decides whether the local or the remote endpoint is the
        initiator, and therefore whether the local/remote fields below are
        being read the right way round
    - vendor: SMF119AP_TTRIP
      type: ip
      description: remote IP address at the time the connection closed
      ecs: source.ip
      status: partial
      transform: >
        conditional on SMF119AP_TTStatus - for a passive/server socket the
        remote end is the initiator and maps to source.ip with the local end
        as destination.ip; for an active/client socket the orientation
        reverses. The record names its endpoints local and remote, not source
        and destination, and a pipeline that hardcodes one direction inverts
        every outbound connection the mainframe makes
    - vendor: SMF119AP_TTLIP
      type: ip
      description: local IP address at the time the connection closed
      ecs: destination.ip
      status: partial
      transform: the same SMF119AP_TTStatus condition, applied consistently with TTRIP
    - vendor: SMF119AP_TTRPort
      type: integer
      description: remote port number when the connection closed
      ecs: source.port
      status: partial
      transform: the same SMF119AP_TTStatus condition, applied consistently with TTRIP
    - vendor: SMF119AP_TTLPort
      type: integer
      description: local port number when the connection closed
      ecs: destination.port
      status: partial
      transform: the same SMF119AP_TTStatus condition, applied consistently with TTRIP
    - vendor: SMF119AP_TTInBytes
      type: integer
      description: number of bytes received on the connection
      ecs: source.bytes
      status: partial
      transform: >
        inbound is relative to the stack, so it is bytes sent by the remote
        party; under the passive/server orientation that is source.bytes, and
        it must flip with the addresses when SMF119AP_TTStatus says the socket
        was active
    - vendor: SMF119AP_TTOutBytes
      type: integer
      description: number of bytes sent on the connection
      ecs: destination.bytes
      status: partial
      transform: the same SMF119AP_TTStatus condition, applied consistently with TTInBytes
    - vendor: SMF119AP_TTSTime / SMF119AP_TTSDate
      type: timestamp
      description: time and date the connection was established
      ecs: event.start
      status: partial
      transform: >
        combine the two fields and apply the LPAR's UTC offset; the subtype 2
        counterpart of SMF119FT_FSSTime, and the reason subtype 2 is collected
        instead of subtype 1 - the termination record carries the
        establishment time as well, so one record describes the whole
        connection
    - vendor: SMF119AP_TTETime / SMF119AP_TTEDate
      type: timestamp
      description: time and date the connection entered TIMEWAIT or LASTACK
      ecs: event.end
      status: partial
      transform: 'combine the two fields and apply the LPAR''s UTC offset'
    - vendor: SMF119AP_TTTermCode
      type: enum
      description: reason code for the connection termination
      ecs: event.reason
      status: partial
      transform: >
        resolve the documented code range to readable text via a lookup rather
        than indexing the hex value; a normal close and a reset are both
        terminations and only this field separates them, so it also feeds
        event.outcome
    - vendor: SMF119AP_TTConnID
      type: string
      description: TCP socket resource identifier for the connection
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.connection_id
      notes: >
        the join key from a subtype 2 connection record to the FTP data
        connection on a subtype 70 record, which is what lets a transfer be
        placed inside the session that carried it
    - vendor: SMF119AP_TTTelLUName
      type: string
      description: Telnet LU name assigned to the TN3270 session
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.telnet_lu_name
      notes: >
        present only when the connection was a TN3270 session; the LU name is
        the mainframe-side identity a RACF logon later reports as its port of
        entry, so it is the field that stitches a network connection to a
        zos-racf RACINIT record
    - vendor: SMF119AP_TTTelAppl
      type: string
      description: target application the Telnet session connected to
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.telnet_application
      notes: >
        the CICS region, IMS system or TSO the session reached; service.name
        was considered and left alone so that it does not mean the FTP daemon
        on one record and a CICS region on another
    - vendor: SMF119AP_TTTelLogmode
      type: string
      description: logmode name negotiated for the Telnet session
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.telnet_logmode
    - vendor: SMF119AP_TTTelTermCode
      type: enum
      description: termination reason code specific to the Telnet connection
      ecs: null
      status: unmapped
      custom: zos.smf.tcpip.telnet_termination_code
      notes: >
        distinct from SMF119AP_TTTermCode, which describes the TCP connection;
        the Telnet code describes the 3270 session that rode it, and the two
        disagree in the interesting cases
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Parse low-side, in the mainframe enclave, and treat the subtype
          split as the first decision: parse the SMF119TI_ identification
          section once, then branch on subtype into the FTP transfer shape and
          the TCP connection shape, emitting one flat ECS-shaped JSON object
          per record. Three things must happen here and nowhere else. Resolve
          the endpoint orientation for subtype 2 from SMF119AP_TTStatus before
          anything downstream sees an address - the record has local and
          remote, ECS has source and destination, and only the low side still
          has the flag that relates them. Convert SMF119FT_FSDur from
          hundredths of a second to the nanoseconds event.duration expects.
          Set network.transport to a constant tcp for both branches, since
          every record here is TCP and the network alerting profile requires
          it. Combine the paired date and time fields into UTC using the
          LPAR's offset, derive event.outcome from SMF119FT_FSLReply while
          keeping the numeric code, and cap SMF119FT_FSFileName1, which is the
          only genuinely unbounded field on the record. Schema-validate before
          the destination behind a dead-letter route, on Persistent Queue
          backpressure.
        elastic: >
          Own a custom logs-zos_smf.tcpip ingest pipeline and give it the
          enrichment the record cannot carry: resolve SMF119AP_TTTermCode to
          readable text through an enrich policy so a reset and a normal close
          are distinguishable without a code table in every query, and add geo
          and asset context to source.ip only after the orientation has been
          settled low-side, never as a way of guessing it. Type
          zos.smf.sysplex_name and the zos.smf.tcpip.* keys as keyword with
          ftp_reply_code as long, and type network.bytes, source.bytes and
          destination.bytes as long so the 64-bit transfer counts aggregate.
          The detections worth building are volumetric and relational rather
          than per-event: bytes transferred per (user.name, file.path) against
          that user's own baseline, cleartext transfers where
          zos.smf.tcpip.ftp_protection_mechanism is None, and a join from
          zos.smf.tcpip.telnet_lu_name to the zos-racf RACINIT records so a
          TN3270 session and the logon it carried are one story.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B) - one JSON object
          per record, UTF-8, LF-terminated, compression disabled, nesting
          depth two or less. NDJSON replaces CEF at this crossing and nothing
          CEF-shaped travels. Transcode EBCDIC and normalize fixed-width blank
          padding low-side. The content-filter friction to settle with the
          guard owner is concentrated in one field: SMF119FT_FSFileName1 is a
          file name that can be either a dotted MVS data set name or an
          arbitrary z/OS UNIX path, and a z/OS UNIX path is attacker-
          influenced free text of meaningful length - cap it, flag the
          truncation, and give the filter the two grammars explicitly rather
          than one loose pattern. IP addresses are the other item to raise
          early: type 119 carries IPv6, and a filter written against dotted
          quads will silently drop the records that matter most on a
          dual-stack LPAR. Orientation resolution and reassembly stay
          low-side; a record must never cross with local/remote unresolved,
          because the high side cannot recover the flag. Reconcile counts per
          (dataset, SMF dump interval), and carry _raw for the FTP subtypes
          until the field positions are proven, since a bulk transfer record
          is the highest-consequence document in this technology.
      direct:
        parse_location: low
        cribl: >
          Parse in the edge pipeline with the same two-branch shape: the
          SMF119TI_ section once, then a subtype branch into the FTP transfer
          and TCP connection shapes. Resolve the subtype 2 endpoint
          orientation from SMF119AP_TTStatus before any address is emitted,
          convert SMF119FT_FSDur from hundredths of a second to nanoseconds,
          and set network.transport to a constant tcp so the network alerting
          profile is satisfied. Combine the paired date and time fields into
          UTC with the LPAR offset, derive event.outcome from
          SMF119FT_FSLReply while keeping the numeric reply code, and cap
          SMF119FT_FSFileName1. Schema-validate before the destination behind
          a dead-letter route, on Persistent Queue backpressure.
        elastic: >
          Target the same custom logs-zos_smf.tcpip pipeline and index
          template as the guarded feed. Resolve SMF119AP_TTTermCode through an
          enrich policy, type zos.smf.sysplex_name and the zos.smf.tcpip.*
          keys as keyword with ftp_reply_code as long, and type network.bytes,
          source.bytes and destination.bytes as long for the 64-bit counts.
          Build the same volumetric and relational detections - transferred
          bytes per (user.name, file.path) against baseline, cleartext
          transfers where zos.smf.tcpip.ftp_protection_mechanism is None, and
          the zos.smf.tcpip.telnet_lu_name join to the zos-racf RACINIT
          records - so a session and the logon it carried resolve to one story
          on both sides of the estate.
  - format: syslog-cef
    enable: >
      Install BMC AMI Defender for z/OS as a started task on the LPAR and
      select SMF record type 119 in its configuration, naming the SMF119TI_,
      SMF119FT_FS and SMF119AP_TT fields the inventory above depends on in the
      FIELDS parameter. Set OPTions SIEMtype(CEF) for CEF-framed syslog and
      point the agent at a Cribl Syslog Source in the mainframe enclave over
      encrypted TCP. Before enabling it, confirm on the stack side that the
      subtypes actually exist to be forwarded: FTP.DATA SMF statements control
      the FTP server and client records, and the TCP/IP profile's SMFCONFIG
      and SMFPARMS settings control the connection records. Narrow the subtype
      selection to 2, 3 and 70 - subtype 2 is written for every TCP connection
      the stack closes, which on a busy stack is a high sustained rate, and it
      is the one subtype here worth filtering by port or application before it
      leaves the LPAR.
    references:
    - https://docs.bmc.com/docs/amidefzos/61/overview-932976759.html
    - >-
      https://docs.bmc.com/docs/amidefzos/61/proprietary-syslog-format-extensions-932976770.html
    parsing:
      mechanism: cribl-pipeline
      artifact: custom SMF-119 CEF pipeline
      notes: >
        Parsed by a custom pipeline keyed off the "CEF:0" banner; no Elastic
        integration or Cribl pack normalizes z/OS Communications Server SMF in
        any encoding. The agent's FIELDS parameter selects SMF field names, so
        the CEF extension keys are the same SMF119 names the `other` entry
        tables and both encodings converge on one ECS mapping. Real time is
        worth more on this dataset than on the others - an FTP transfer that
        surfaces a dump interval late is a post-mortem rather than a detection
        - but the orientation problem does not go away with the encoding:
        SMF119AP_TTStatus must still be in the FIELDS list, or the subtype 2
        records arrive with local and remote addresses that cannot be resolved
        to source and destination by anyone downstream.
    fields_omitted: >
      The CEF extension keys are the SMF119TI_, SMF119FT_FS and SMF119AP_TT
      field names the `other` format entry already tables, selected by the
      agent's FIELDS parameter, so tabling them again would publish one
      inventory under two headings. What is not tabled is the CEF header - the
      vendor, product, signature id and severity BMC assigns per subtype -
      which sits behind BMC documentation that could not be retrieved for this
      entry and must be confirmed against a captured sample from the site's
      own agent.
    fields: []
    recommendations:
      guarded:
        parse_location: low
        cribl: >
          Terminate the syslog stream on the edge worker group in the
          mainframe enclave and unpack CEF there; CEF is parsed out low-side
          everywhere in this estate, and on this dataset the low side is also
          the only place the endpoint orientation can still be resolved. Key
          on the "CEF:0" banner, split the extension into named SMF119 keys,
          branch on subtype, and land the result in the same ECS shape the
          dump-path pipeline produces. Assert SMF119AP_TTStatus is present on
          every subtype 2 record and dead-letter those that lack it rather
          than guessing the direction. Convert SMF119FT_FSDur to nanoseconds,
          set network.transport to a constant tcp, apply the LPAR timezone to
          the agent's naive local event time, derive event.outcome from
          SMF119FT_FSLReply while keeping the numeric code, and cap
          SMF119FT_FSFileName1. Schema-validate before the destination behind
          a dead-letter route, on Persistent Queue backpressure.
        elastic: >
          Land in the same custom logs-zos_smf.tcpip ingest pipeline and index
          template the dump path targets, with the same SMF119AP_TTTermCode
          enrich policy and the same keyword typing for the zos.smf.tcpip.*
          keys and long typing for the byte counters. Hold the
          CEF-header-to-event.code crosswalk as a documented versioned mapping
          so a BMC signature-id change is caught rather than dynamic-mapped.
          The completeness check that matters on this encoding is directional:
          alert on subtype 2 records arriving without
          zos.smf.tcpip.socket_role, because that is what an agent FIELDS
          change looks like from the SIEM and it silently degrades every
          network detection built on this data stream.
        relay: >
          Full ECS-shaped NDJSON crosses (envelope mode B), one record per
          line, UTF-8, LF-terminated, compression disabled, nesting depth two
          or less. Nothing CEF-shaped crosses the guard - it is resolved to an
          allow-listed key set low-side, and the orientation is resolved with
          it, because the high side has no way to recover local-versus-remote
          once the flag is gone. The agent has already transcoded EBCDIC, so
          there is no padding normalization to pin low-side on this encoding.
          The friction to settle with the guard owner is the same two items as
          the dump path: SMF119FT_FSFileName1, which can be an arbitrary z/OS
          UNIX path and must be capped and flagged, and IPv6 addresses, which
          a filter written against dotted quads will drop on a dual-stack
          LPAR. Because the feed is continuous rather than batched, reconcile
          counts per (dataset, hour), and keep the FTP subtypes' _raw until
          the agent's key set is proven stable across a maintenance window.
      direct:
        parse_location: low
        cribl: >
          Terminate the syslog stream on the edge worker group and unpack CEF
          there, keyed on the "CEF:0" banner, branching on subtype into the
          FTP transfer and TCP connection shapes. Assert SMF119AP_TTStatus is
          present on subtype 2 records and dead-letter those that lack it,
          convert SMF119FT_FSDur to nanoseconds, set network.transport to a
          constant tcp, apply the LPAR timezone to the agent's naive local
          event time, derive event.outcome from SMF119FT_FSLReply while
          keeping the numeric code, and cap SMF119FT_FSFileName1. The decision
          this encoding represents is latency, and it is worth more here than
          on any other dataset in this file: an FTP transfer record that
          arrives a dump interval late cannot stop the transfer, so where only
          one dataset can justify the agent, this is the one. Schema-validate
          before the destination behind a dead-letter route, on Persistent
          Queue backpressure.
        elastic: >
          Target the same custom logs-zos_smf.tcpip pipeline and template as
          the dump path, with the same SMF119AP_TTTermCode enrich policy,
          keyword typing for the zos.smf.tcpip.* keys and long typing for the
          byte counters. Hold the CEF-header crosswalk as a versioned mapping,
          and alert on subtype 2 records arriving without
          zos.smf.tcpip.socket_role so an agent FIELDS change surfaces as a
          detection gap rather than as quietly inverted traffic.
