      ecs: null
      status: unmapped
      custom: zeek.dns.rejected
- id: http
  name: HTTP log (http.log)
  description: >
    One record per HTTP request/response pair on any port the HTTP analyzer
    claims, including pipelined transactions on a single flow. Cleartext HTTP
    only — TLS-wrapped traffic surfaces in ssl.log instead, so on a modern
    segment this dataset covers internal services, captive portals, update
    channels, and C2 that has not bothered with TLS.
  event_categories:
  - web
  - network
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same sensor JSON stream as conn.log, split by _path. This is the
        dataset to scrutinize first before the boundary — uri, user_agent, and
        referrer are all attacker-controlled free text of unbounded length and
        need capping or stripping to clear content inspection.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (the __syslogout internal
        field carrying a CEF-structured string), being retired; plan of
        record: Cribl HTTP Destination -> guard -> Cribl HTTP Source carrying
        NDJSON. The high side parses _raw (Extract JSON) then adds Cribl
        fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zeek.http
    direct:
    - hop: cribl
      location: edge worker group
      notes: Same sensor JSON stream as conn.log, split by _path.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zeek.http
  formats:
  - format: json
    parsing:
      mechanism: elastic-integration
      artifact: Zeek integration
    fields:
    - vendor: ts
      type: timestamp
      description: time the request was seen
      ecs: '@timestamp'
      status: mapped
      transform: double epoch-seconds, same parse as conn.log ts
    - vendor: uid
      type: string
      description: flow identifier joining this transaction back to conn.log
      ecs: event.id
      status: mapped
    - vendor: id.orig_h
      type: ip
      description: IP address of the requesting client
      ecs: source.ip
      status: mapped
    - vendor: id.resp_h
      type: ip
      description: IP address of the responding server
      ecs: destination.ip
      status: mapped
    - vendor: id.resp_p
      type: port
      description: server port the request was made to
      ecs: destination.port
      status: mapped
    - vendor: trans_depth
      type: integer
      description: 1-based index of this transaction within a keep-alive/pipelined flow
      ecs: null
      status: unmapped
      custom: zeek.http.trans_depth
      notes: >-
        needed to disambiguate multiple http.log records sharing one uid;
        without it, joins to conn.log fan out
    - vendor: method
      type: string
      description: HTTP request verb — GET, POST, CONNECT, ...
      ecs: http.request.method
      status: mapped
    - vendor: host
      type: string
      description: value of the HTTP Host header
      ecs: url.domain
      status: partial
      notes: >-
        attacker-controlled and frequently a bare IP or a non-resolving name;
        it is the claimed host, not necessarily destination.ip's real identity
    - vendor: uri
      type: string
      description: request target as it appeared on the request line
      ecs: url.original
      status: partial
      transform: >
        Zeek logs origin-form only — path plus query, no scheme and no
        authority — so url.original must be assembled as "http://" + host +
        uri, and url.path/url.query split out of it, before the web alerting
        profile's url.original requirement is genuinely met
    - vendor: referrer
      type: string
      description: value of the HTTP Referer header
      ecs: http.request.referrer
      status: mapped
    - vendor: version
      type: string
      description: HTTP protocol version string, e.g. 1.1
      ecs: http.version
      status: mapped
    - vendor: user_agent
      type: string
      description: value of the HTTP User-Agent header
      ecs: user_agent.original
      status: mapped
    - vendor: request_body_len
      type: long
      description: uncompressed size in bytes of the request body
      ecs: http.request.body.bytes
      status: mapped
    - vendor: response_body_len
      type: long
      description: uncompressed size in bytes of the response body
      ecs: http.response.body.bytes
      status: mapped
    - vendor: status_code
      type: integer
      description: numeric HTTP response status returned by the server
      ecs: http.response.status_code
      status: mapped
      transform: >
        also the only viable source for the web profile's event.outcome —
        bucket 1xx/2xx/3xx to success and 4xx/5xx to failure; the field is
        absent entirely when the sensor never saw the response, which must not
        be collapsed into failure
    - vendor: username
      type: string
      description: username supplied via HTTP basic authentication
      ecs: url.username
      status: mapped
      notes: >
        also worth copying to user.name for the identity pivot, but the value
        is a cleartext credential holder — the paired `password` field must be
        dropped in Cribl before the Elastic destination, not merely left
        unmapped
    - vendor: proxied
      type: array
      description: >-
        set of headers indicating the request passed through a proxy
        (X-Forwarded-For, Via, ...)
      ecs: null
      status: unmapped
      custom: zeek.http.proxied
      notes: >-
        when populated, source.ip is the proxy and the real client is inside
        these header values
    - vendor: resp_mime_types
      type: array
      description: vector of MIME types the file analyzer identified in the response body
      ecs: http.response.mime_type
      status: partial
      notes: >
        ECS http.response.mime_type is a single value while Zeek emits a
        vector (one per response entity); take the first element or index as
        an array deliberately, and note these are sniffed content types, not
        the declared Content-Type header
    - vendor: resp_fuids
      type: array
      description: >-
        vector of file identifiers for response bodies, joining to files.log
        and x509.log
      ecs: null
      status: unmapped
      custom: zeek.http.resp_fuids
      notes: >-
        the only bridge from an HTTP transaction to the file hashes in
        files.log — the malware profile's file.hash.sha256 lives there, not
        here
    - vendor: _system_name
      type: string
      description: hostname of the sensor that wrote the record
      ecs: observer.name
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          The mandatory low-side work on this dataset is a drop rule for the
          `password` column (and masking of any credentials embedded in the
          uri userinfo) applied on the core worker group before the Elastic
          destination, so the cleartext basic-auth secret never leaves the low
          side at all. Beyond that, route on `_path`, cap the unbounded uri,
          user_agent, and referrer values, and run Persistent Queue
          backpressure; _raw can be dropped once the parser is proven.
        elastic: >
          Add a logs-zeek.http@custom pipeline that assembles url.original as
          "http://" + host + uri and splits url.path and url.query out of it,
          derives event.outcome by bucketing status_code (1xx/2xx/3xx success,
          4xx/5xx failure) while leaving it unset when the sensor never saw a
          response, and copies url.username to user.name for the identity
          pivot. Take the first element of resp_mime_types (or map it as an
          explicit array) rather than letting dynamic mapping decide, add
          custom-namespace mappings for trans_depth, proxied, and resp_fuids,
          and enrich file hashes in from the files.log data stream on
          resp_fuids since the malware profile's file.hash.sha256 does not
          exist on this record.
        relay: >
          Low-side instances cross the guard, and this is the dataset to
          scrutinize first: uri, user_agent, and referrer are
          attacker-controlled free text of unbounded length and unicode shape
          that content inspection will cap or reject, so bound and normalize
          them low-side and validate the envelope with C.Schema(...) into a
          dead-letter route before the guard destination. The password drop
          must sit upstream of the guard, not on the high side — a redaction
          that runs after the crossing has already leaked the credential
          across the boundary.
      direct:
        parse_location: high
        cribl: >
          The mandatory work on this dataset is a drop rule for the `password`
          column (and masking of any credentials embedded in the uri userinfo)
          applied in Cribl before the Elastic destination, so the cleartext
          basic-auth secret is never indexed. Beyond that, route on `_path`,
          cap the unbounded uri, user_agent, and referrer values, and run
          Persistent Queue backpressure; _raw can be dropped once the parser
          is proven.
        elastic: >
          Add a logs-zeek.http@custom pipeline that assembles url.original as
          "http://" + host + uri and splits url.path and url.query out of it,
          derives event.outcome by bucketing status_code (1xx/2xx/3xx success,
          4xx/5xx failure) while leaving it unset when the sensor never saw a
          response, and copies url.username to user.name for the identity
          pivot. Take the first element of resp_mime_types (or map it as an
          explicit array) rather than letting dynamic mapping decide, add
          custom-namespace mappings for trans_depth, proxied, and resp_fuids,
          and enrich file hashes in from the files.log data stream on
          resp_fuids since the malware profile's file.hash.sha256 does not
          exist on this record.
  - format: csv-file
    enable: >
      As for conn.log: `redef LogAscii::use_json = F;` with
      json-streaming-logs unloaded, or the Corelight TSV export profile.
      http.log is a separate file (#path "http"). The vector columns
      orig_fuids/orig_filenames/orig_mime_types/
      resp_fuids/resp_filenames/resp_mime_types and the set columns
      tags/proxied are comma-joined under set_separator ",". Absent optional
      columns render as "-" and an empty header value as "(empty)".
    references:
    - https://docs.zeek.org/en/master/frameworks/logging.html
    - https://docs.zeek.org/en/master/scripts/base/protocols/http/main.zeek.html
    - >-
      https://docs.zeek.org/en/master/scripts/base/frameworks/logging/writers/ascii.zeek.html
    parsing:
      mechanism: cribl-pipeline
      artifact: Cribl Zeek-TSV parser pipeline (with password drop), then logs-zeek.http@custom
      notes: >
        No stock integration parses TSV. The custom pipeline reads the
        #fields/ #types header, splits the comma-joined vector/set columns,
        and maps "-" to null. The mandatory http-specific step is that the
        cleartext password column must be DROPPED in the parser before the
        record leaves the low side - it is a real column in TSV http.log, not
        merely unmapped. After extraction, logs-zeek.http@custom assembles
        url.original as "http://" + host + uri and splits url.path/url.query
        out, buckets status_code into event.outcome, and enriches file hashes
        from files.log on resp_fuids.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          The mandatory low-side work is the password drop (and masking of any
          credentials in the uri userinfo), applied during TSV extraction on
          the low side so the cleartext basic-auth secret never crosses the
          boundary - a redaction that runs after the crossing has already
          leaked it. Beyond that, split the TSV at the edge, cap the unbounded
          uri/user_agent/ referrer values, and attach sensor identity since
          TSV http.log has no _system_name. Persistent Queue backpressure on
          the destination.
        elastic: >
          Run logs-zeek.http@custom on the extracted fields: assemble
          url.original as "http://" + host + uri and split url.path/url.query
          out of it, derive event.outcome by bucketing status_code
          (1xx/2xx/3xx success, 4xx/5xx failure) while leaving it unset when
          the sensor never saw a response, and copy url.username to user.name
          for the identity pivot. Take the first element of resp_mime_types
          (or map it as an explicit array), add custom-namespace mappings for
          trans_depth, proxied, tags, status_msg and resp_fuids, and enrich
          file.hash.sha256 in from files.log on resp_fuids since it does not
          exist on this record.
        relay: >
          This is the dataset to scrutinize first: uri, user_agent, referrer,
          and the tags/proxied set values are attacker-controlled free text of
          unbounded length and unicode shape that content inspection will cap
          or reject, so bound and normalize them low-side and validate the
          envelope with C.Schema(...) into a dead-letter route before the
          guard destination. The password drop must sit upstream of the guard,
          not on the high side.
      direct:
        parse_location: low
        cribl: >
          High-side sensor, no guard: split the TSV at the edge and forward
          NDJSON, still applying the password drop since this is cleartext
          HTTP. Choose the TSV writer or the JSON writer as the single
          authoritative HTTP feed and attach sensor identity, which the record
          lacks.
        elastic: >
          The same logs-zeek.http@custom handling applies to the TSV-extracted
          fields: assemble url.original as "http://" + host + uri with
          url.path/url.query split out, bucket status_code into event.outcome,
          and enrich file.hash.sha256 from files.log on resp_fuids. With no
          boundary, prefer the JSON writer: it is what the stock integration
          parses and it carries _system_name, whereas TSV requires the custom
          split plus the manual password drop on every record.
    fields:
    - vendor: ts
      type: timestamp
      description: time the request was seen
      ecs: '@timestamp'
      status: partial
      transform: double epoch-seconds, same parse as conn.log ts
    - vendor: uid
      type: string
      description: flow identifier joining this transaction back to conn.log
      ecs: event.id
      status: mapped
    - vendor: id.orig_h
      type: ip
      description: IP address of the requesting client
      ecs: source.ip
      status: mapped
    - vendor: id.orig_p
      type: port
      description: client source port (present in TSV http.log; omitted from the JSON subset)
      ecs: source.port
      status: mapped
    - vendor: id.resp_h
      type: ip
      description: IP address of the responding server
      ecs: destination.ip
      status: mapped
    - vendor: id.resp_p
      type: port
      description: server port the request was made to
      ecs: destination.port
      status: mapped
    - vendor: trans_depth
      type: integer
      description: 1-based index of this transaction within a keep-alive/pipelined flow
      ecs: null
      status: unmapped
      custom: zeek.http.trans_depth
      notes: >-
        needed to disambiguate multiple http.log records sharing one uid;
        without it, joins to conn.log fan out
    - vendor: method
      type: string
      description: HTTP request verb - GET, POST, CONNECT, ...
      ecs: http.request.method
      status: mapped
    - vendor: host
      type: string
      description: value of the HTTP Host header
      ecs: url.domain
      status: partial
      notes: >-
        attacker-controlled and often a bare IP or non-resolving name; the
        claimed host, not necessarily destination.ip's real identity
    - vendor: uri
      type: string
      description: request target as it appeared on the request line
      ecs: url.original
      status: partial
      transform: >
        origin-form only - path plus query, no scheme or authority - so
        url.original must be assembled as "http://" + host + uri, with
        url.path/url.query split out of it
    - vendor: referrer
      type: string
      description: value of the HTTP Referer header
      ecs: http.request.referrer
      status: mapped
    - vendor: version
      type: string
      description: HTTP protocol version string, e.g. 1.1
      ecs: http.version
      status: mapped
    - vendor: user_agent
      type: string
      description: value of the HTTP User-Agent header
      ecs: user_agent.original
      status: mapped
    - vendor: origin
      type: string
      description: value of the HTTP Origin header
      ecs: null
      status: unmapped
      custom: zeek.http.origin
      notes: >-
        useful for CSRF/CORS analysis; no ECS home distinct from url.domain,
        and it is the header-claimed origin not the observed one
    - vendor: request_body_len
      type: long
      description: uncompressed size in bytes of the request body
      ecs: http.request.body.bytes
      status: mapped
    - vendor: response_body_len
      type: long
      description: uncompressed size in bytes of the response body
      ecs: http.response.body.bytes
      status: mapped
    - vendor: status_code
      type: integer
      description: numeric HTTP response status returned by the server
      ecs: http.response.status_code
      status: mapped
      transform: >
        also the only source for the web profile's event.outcome - bucket
        1xx/2xx/3xx to success and 4xx/5xx to failure; absent ("-") when the
        sensor never saw the response, which must not collapse to failure
    - vendor: status_msg
      type: string
      description: HTTP reason phrase accompanying status_code, e.g. "OK", "Not Found"
      ecs: null
      status: unmapped
      custom: zeek.http.status_msg
      notes: >-
        ECS has no reason-phrase field; the numeric status_code is the
        analytic value, the phrase is kept only for display
    - vendor: info_code
      type: integer
      description: numeric 1xx informational status seen before the final response
      ecs: null
      status: unmapped
      custom: zeek.http.info_code
      notes: >-
        100-Continue / 101-Switching-Protocols and the like; distinct from
        status_code, which holds the final response
    - vendor: info_msg
      type: string
      description: reason phrase accompanying info_code
      ecs: null
      status: unmapped
      custom: zeek.http.info_msg
    - vendor: tags
      type: array
      description: >-
        set of indicators Zeek attached to the transaction (e.g. URI_SQLI,
        EMPTY_REQUEST)
      ecs: null
      status: unmapped
      custom: zeek.http.tags
      notes: >-
        a set, comma-joined in TSV; Zeek's own lightweight detection markers
        on the request, worth keeping as a keyword array for triage
    - vendor: username
      type: string
      description: username supplied via HTTP basic authentication
      ecs: url.username
      status: mapped
      notes: >-
        worth copying to user.name for the identity pivot; the paired password
        column below must be dropped in the parser, not merely left unmapped
    - vendor: password
      type: string
      description: cleartext password supplied via HTTP basic authentication
      ecs: null
      status: unmapped
      custom: zeek.http.password
      notes: >
        a real TSV column carrying a cleartext credential - it must be DROPPED
        during low-side extraction before the record leaves the low side,
        never indexed; listed here only so the drop is explicit, not as a
        mapping target
    - vendor: proxied
      type: array
      description: >-
        set of headers indicating the request passed through a proxy
        (X-Forwarded-For, Via, ...)
      ecs: null
      status: unmapped
      custom: zeek.http.proxied
      notes: >-
        a set, comma-joined in TSV; when populated, source.ip is the proxy and
        the real client is inside these header values
    - vendor: orig_fuids
      type: array
      description: vector of file identifiers for request bodies, joining to files.log
      ecs: null
      status: unmapped
      custom: zeek.http.orig_fuids
      notes: >-
        comma-joined in TSV; the bridge from an uploaded body to its files.log
        entry (uploads, webshell posts)
    - vendor: orig_filenames
      type: array
      description: vector of filenames offered for request-body entities
      ecs: null
      status: unmapped
      custom: zeek.http.orig_filenames
    - vendor: orig_mime_types
      type: array
      description: vector of MIME types the file analyzer identified in the request body
      ecs: http.request.mime_type
      status: partial
      notes: >-
        ECS http.request.mime_type is single-valued while Zeek emits a
        comma-joined vector; take the first element or index deliberately as
        an array, and note these are sniffed types, not the declared
        Content-Type
    - vendor: resp_fuids
      type: array
      description: >-
        vector of file identifiers for response bodies, joining to files.log
        and x509.log
      ecs: null
      status: unmapped
      custom: zeek.http.resp_fuids
      notes: >-
        comma-joined in TSV; the only bridge from an HTTP transaction to the
        file hashes in files.log - the malware profile's file.hash.sha256
        lives there, not here
    - vendor: resp_filenames
      type: array
      description: vector of filenames offered for response-body entities
      ecs: null
      status: unmapped
      custom: zeek.http.resp_filenames
    - vendor: resp_mime_types
      type: array
      description: vector of MIME types the file analyzer identified in the response body
      ecs: http.response.mime_type
      status: partial
      notes: >-
        ECS http.response.mime_type is single-valued while Zeek emits a
        comma-joined vector; take the first element or index as an array
        deliberately, and note these are sniffed content types, not the
        declared Content-Type
- id: notice
  name: Notice log (notice.log)
  description: >
    Zeek's detection output — one record per notice raised by a policy script,
    package, or the Intel framework (SSL::Invalid_Server_Cert, Intel::Notice,
    Scan::Port_Scan, HTTP::SQL_Injection_Attacker, ...). Low volume relative
    to the protocol logs and the natural feed for CSOC detection rules, but
    the content depends entirely on which scripts and packages a given sensor
    loads.
  event_categories:
  - network
  - malware
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Same sensor JSON stream as conn.log, split by _path, crossing under an
        allow-list on logs-zeek.notice. `msg` and `sub` carry script-generated
        free text that can embed observed payload fragments.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (the __syslogout internal
        field carrying a CEF-structured string), being retired; plan of
        record: Cribl HTTP Destination -> guard -> Cribl HTTP Source carrying
        NDJSON. The high side parses _raw (Extract JSON) then adds Cribl
        fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zeek.notice
    direct:
    - hop: cribl
      location: edge worker group
      notes: Same sensor JSON stream as conn.log, split by _path.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-zeek.notice
  formats:
  - format: json
    parsing:
      mechanism: elastic-integration
      artifact: Zeek integration
      notes: >
        The integration parses the record shape, but the `note` vocabulary is
        open-ended — every package a sensor loads adds its own values — so a
        Cribl lookup keyed on `note` is still needed to attach severity and
        rule metadata that Zeek itself does not emit.
    fields:
    - vendor: ts
      type: timestamp
      description: time the notice was raised
      ecs: '@timestamp'
      status: mapped
      transform: double epoch-seconds, same parse as conn.log ts
    - vendor: uid
      type: string
      description: flow identifier of the connection that triggered the notice, when there was one
      ecs: event.id
      status: partial
      notes: >-
        absent for notices raised from a host or file context rather than a
        connection, so it cannot be relied on as the join key for every record
    - vendor: note
      type: enum
      description: >-
        the notice type, a namespaced identifier such as
        SSL::Invalid_Server_Cert or Intel::Notice
      ecs: rule.name
      status: mapped
      notes: >
        the field CSOC rules key on; treat the vocabulary as open (it grows
        with every loaded package) and alert on an allow-list of known notes
        rather than assuming a fixed enumeration
    - vendor: msg
      type: string
      description: human-readable description of what was detected
      ecs: message
      status: mapped
    - vendor: sub
      type: string
      description: secondary detail string whose meaning is defined per notice type
      ecs: null
      status: unmapped
      custom: zeek.notice.sub
      notes: >-
        often holds the actual indicator (certificate subject, matched intel
        value, URI), but the semantics vary by `note` so it cannot be mapped
        to one ECS target
    - vendor: id.orig_h
      type: ip
      description: originator address of the triggering connection
      ecs: source.ip
      status: mapped
    - vendor: id.resp_h
      type: ip
      description: responder address of the triggering connection
      ecs: destination.ip
      status: mapped
    - vendor: src
      type: ip
      description: address the notice is "about", set independently of the connection tuple
      ecs: source.ip
      status: partial
      notes: >
        duplicates id.orig_h for connection-scoped notices but is the only
        address present for host-scoped ones; the pipeline must coalesce src
        and id.orig_h into source.ip rather than picking one, or a whole class
        of notices arrives with no source address
    - vendor: dst
      type: ip
      description: peer address the notice is about, for host-scoped notices
      ecs: destination.ip
      status: partial
      notes: same coalescing requirement as src/id.resp_h
    - vendor: p
      type: port
      description: port the notice is about
      ecs: destination.port
      status: partial
      notes: >-
        which side of the connection this port belongs to is defined by the
        raising script, not by the schema
    - vendor: proto
      type: enum
      description: transport protocol of the triggering connection — tcp, udp, or icmp
      ecs: network.transport
      status: mapped
    - vendor: actions
      type: array
      description: >-
        set of dispositions applied to the notice — Notice::ACTION_LOG,
        ACTION_EMAIL, ACTION_DROP, ACTION_ALARM
      ecs: event.action
      status: partial
      notes: >
        this describes what Zeek did about the notice, not the behaviour that
        was detected; mapping it to event.action satisfies the alerting
        profile's field requirement in name only, and rules should key on
        rule.name (`note`) for the actual detection
    - vendor: dropped
      type: boolean
      description: whether a requested ACTION_DROP was successfully carried out
      ecs: event.outcome
      status: partial
      transform: >
        boolean to success/failure, but only meaningful when a blocking
        framework (NetControl or a Corelight blocking integration) is actually
        wired up; on a passive tap it is always false and must not be read as
        "the detection failed"
    - vendor: fuid
      type: string
      description: identifier of the file the notice concerns, joining to files.log
      ecs: null
      status: unmapped
      custom: zeek.notice.fuid
      notes: >-
        the malware profile's file.hash.sha256 and file.path are not in
        notice.log — they must be enriched in from files.log on this fuid
    - vendor: file_mime_type
      type: string
      description: sniffed MIME type of the file the notice concerns
      ecs: file.mime_type
      status: mapped
    - vendor: file_desc
      type: string
      description: context describing where the file came from, e.g. the source URL
      ecs: null
      status: unmapped
      custom: zeek.notice.file_desc
      notes: >
        ECS 9.4 has beta file.origin_url; adopt when GA, and only for the
        records where this describe-string is actually a URL — the value is
        free text whose shape depends on the protocol the file was carried
        over, so it is not a URL on every notice
    - vendor: suppress_for
      type: float
      description: interval in seconds for which duplicate notices of this identity are suppressed
      ecs: null
      status: unmapped
      custom: zeek.notice.suppress_for
      notes: >
        the reason notice counts under-report reality — the default is one
        hour per identity, so rules that count notices are counting
        suppression windows, not events
    - vendor: remote_location.country_code
      type: string
      description: >-
        two-letter country code of the remote address, when a GeoIP database
        is loaded on the sensor
      ecs: source.geo.country_iso_code
      status: partial
      notes: >-
        only present if the sensor has MaxMind data available, and "remote"
        may be either side depending on the raising script
    - vendor: peer_descr
      type: string
      description: descriptive name of the Zeek cluster node that raised the notice
      ecs: observer.name
      status: partial
      notes: >-
        identifies a worker process within a cluster, so it is finer-grained
        than _system_name; pick one consistently for observer.name across
        datasets
    - vendor: community_id
      type: string
      description: Community ID v1 hash of the triggering flow
      ecs: network.community_id
      status: mapped
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the `note`-keyed lookup table low-side, attaching the severity
          and rule metadata Zeek does not emit, and treat it as a maintained
          artifact that has to be extended whenever a sensor loads a new
          package — an unmatched note must pass through with a default rather
          than be dropped. This is a low-volume, high-forensic-value detection
          stream, so retain _raw end-to-end and use Persistent Queue
          backpressure rather than any sampling.
        elastic: >
          Add a logs-zeek.notice@custom pipeline that coalesces src with
          id.orig_h into source.ip and dst with id.resp_h into destination.ip
          (picking one column loses every host-scoped notice), sets
          event.outcome from `dropped` only where a NetControl or Corelight
          blocking framework is actually wired up and leaves it unset on
          passive taps, and enriches file.hash and file.path in from the
          files.log data stream on fuid. Settle observer.name on one source
          across all four Zeek datasets — peer_descr is per-worker while
          _system_name is per-appliance — and map zeek.notice.sub, fuid,
          file_desc, and suppress_for in the custom-namespace index template,
          with suppress_for documented as the reason notice counts
          under-report.
        relay: >
          Low-side instances cross the guard: the friction is that `msg` and
          `sub` are script-generated free text that can embed observed payload
          fragments, so bound their length and normalize unicode low-side
          before the guard destination. Carry _raw across for this stream — it
          is IDS-class evidence — and because the volume is low enough that a
          silently filtered notice is invisible, reconcile low-side and
          high-side counts per `note` value per hour rather than per dataset.
      direct:
        parse_location: high
        cribl: >
          Keep the `note`-keyed lookup table in Cribl, attaching the severity
          and rule metadata Zeek does not emit, and treat it as a maintained
          artifact that has to be extended whenever a sensor loads a new
          package — an unmatched note must pass through with a default rather
          than be dropped. This is a low-volume, high-forensic-value detection
          stream, so retain _raw end-to-end and use Persistent Queue
          backpressure rather than any sampling.
        elastic: >
          Add a logs-zeek.notice@custom pipeline that coalesces src with
          id.orig_h into source.ip and dst with id.resp_h into destination.ip
          (picking one column loses every host-scoped notice), sets
          event.outcome from `dropped` only where a NetControl or Corelight
          blocking framework is actually wired up and leaves it unset on
          passive taps, and enriches file.hash and file.path in from the
          files.log data stream on fuid. Settle observer.name on one source
          across all four Zeek datasets — peer_descr is per-worker while
          _system_name is per-appliance — and map zeek.notice.sub, fuid,
          file_desc, and suppress_for in the custom-namespace index template,
          with suppress_for documented as the reason notice counts
          under-report.
  - format: csv-file
    enable: >
      As for conn.log: `redef LogAscii::use_json = F;` with
      json-streaming-logs unloaded, or the Corelight TSV export profile.
      notice.log is a separate file (#path "notice"). The geo_location record
      remote_location is flattened to
      remote_location.country_code/.region/.city/.latitude/.longitude columns;
      the set columns actions and email_dest are comma-joined; the dropped
      column appears only when policy/frameworks/notice/actions/drop.zeek is
      loaded, and community_id only with the community-id policy. Absent
      optional columns render as "-".
    references:
    - https://docs.zeek.org/en/master/frameworks/logging.html
    - https://docs.zeek.org/en/master/scripts/base/frameworks/notice/main.zeek.html
    - >-
      https://docs.zeek.org/en/master/scripts/base/frameworks/logging/writers/ascii.zeek.html
    parsing:
      mechanism: cribl-pipeline
      artifact: >-
        Cribl Zeek-TSV parser pipeline (note-keyed severity lookup), then
        logs-zeek.notice@custom
      notes: >
        No stock integration parses TSV. The custom pipeline reads the
        #fields/ #types header and splits the comma-joined actions and
        email_dest sets, and - as on the JSON path - a note-keyed lookup still
        attaches the severity and rule metadata Zeek does not emit, because
        the note vocabulary is open-ended (every loaded package adds its own
        values). logs-zeek.notice@custom then coalesces src with id.orig_h
        into source.ip and dst with id.resp_h into destination.ip, and
        enriches file.hash from files.log on fuid.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Split the TSV low-side and keep the note-keyed lookup table here,
          attaching the severity and rule metadata Zeek does not emit; treat
          it as a maintained artifact extended whenever a sensor loads a new
          package, and pass an unmatched note through with a default rather
          than dropping it. This is a low-volume, high-forensic-value
          detection stream, so retain the raw record end-to-end and use
          Persistent Queue backpressure rather than sampling. Bound the
          free-text msg and sub before the boundary.
        elastic: >
          Run logs-zeek.notice@custom: coalesce src with id.orig_h into
          source.ip and dst with id.resp_h into destination.ip (picking one
          column loses every host-scoped notice), set event.outcome from
          dropped only where a NetControl or Corelight blocking framework is
          actually wired up and leave it unset on passive taps, and enrich
          file.hash and file.path from files.log on fuid. Settle observer.name
          on peer_descr consistently across the Zeek datasets (TSV notice.log
          has no _system_name, so peer_descr is the only in-band option), and
          map zeek.notice.sub/fuid/file_desc/n/suppress_for in the custom
          index template, with suppress_for documented as the reason counts
          under-report.
        relay: >
          msg and sub are script-generated free text that can embed observed
          payload fragments, so bound their length and normalize unicode
          low-side before the guard destination. Carry the raw record across
          for this stream - it is IDS-class evidence - and because a silently
          filtered notice is invisible at this volume, reconcile low-side and
          high-side counts per note value per hour rather than per dataset.
          The crossing is at-most-once with no ack.
      direct:
        parse_location: low
        cribl: >
          High-side sensor, no guard: split the TSV at the edge, run the
          note-keyed severity lookup, and forward NDJSON. Choose the TSV
          writer or the JSON writer as the single authoritative notice feed
          per sensor.
        elastic: >
          The same logs-zeek.notice@custom handling applies to the
          TSV-extracted fields: coalesce src with id.orig_h into source.ip and
          dst with id.resp_h into destination.ip, and enrich file.hash and
          file.path from files.log on fuid. With no boundary, prefer the JSON
          writer where available - it is what the stock integration parses -
          but TSV notice.log is the least painful of the four to accept, since
          peer_descr preserves an in-band sensor identity that conn/dns/http
          TSV lack.
    fields:
    - vendor: ts
      type: timestamp
      description: time the notice was raised
      ecs: '@timestamp'
      status: partial
      transform: double epoch-seconds, same parse as conn.log ts
    - vendor: uid
      type: string
      description: flow identifier of the connection that triggered the notice, when there was one
      ecs: event.id
      status: partial
      notes: >-
        renders as "-" for notices raised from a host or file context rather
        than a connection, so it cannot be relied on as the join key for every
        record
    - vendor: id.orig_h
      type: ip
      description: originator address of the triggering connection
      ecs: source.ip
      status: mapped
    - vendor: id.orig_p
      type: port
      description: originator port of the triggering connection
      ecs: source.port
      status: mapped
    - vendor: id.resp_h
      type: ip
      description: responder address of the triggering connection
      ecs: destination.ip
      status: mapped
    - vendor: id.resp_p
      type: port
      description: responder port of the triggering connection
      ecs: destination.port
      status: mapped
    - vendor: fuid
      type: string
      description: identifier of the file the notice concerns, joining to files.log
      ecs: null
      status: unmapped
      custom: zeek.notice.fuid
      notes: >-
        the malware profile's file.hash.sha256 and file.path are not in
        notice.log - they must be enriched in from files.log on this fuid
    - vendor: file_mime_type
      type: string
      description: sniffed MIME type of the file the notice concerns
      ecs: file.mime_type
      status: mapped
    - vendor: file_desc
      type: string
      description: context describing where the file came from, e.g. the source URL
      ecs: null
      status: unmapped
      custom: zeek.notice.file_desc
      notes: >-
        free text whose shape depends on the carrying protocol, so not a URL
        on every notice; ECS 9.4 beta file.origin_url is a candidate only for
        the records where it genuinely is one
    - vendor: proto
      type: enum
      description: transport protocol of the triggering connection - tcp, udp, or icmp
      ecs: network.transport
      status: mapped
    - vendor: note
      type: enum
      description: >-
        the notice type, a namespaced identifier such as
        SSL::Invalid_Server_Cert or Intel::Notice
      ecs: rule.name
      status: mapped
      notes: >-
        the field CSOC rules key on; treat the vocabulary as open (it grows
        with every loaded package) and alert on an allow-list of known notes
    - vendor: msg
      type: string
      description: human-readable description of what was detected
      ecs: message
      status: mapped
    - vendor: sub
      type: string
      description: secondary detail string whose meaning is defined per notice type
      ecs: null
      status: unmapped
      custom: zeek.notice.sub
      notes: >-
        often holds the actual indicator (certificate subject, matched intel
        value, URI) but the semantics vary by note, so it cannot map to one
        ECS target
    - vendor: src
      type: ip
      description: address the notice is "about", set independently of the connection tuple
      ecs: source.ip
      status: partial
      notes: >-
        duplicates id.orig_h for connection-scoped notices but is the only
        address present for host-scoped ones; coalesce src and id.orig_h into
        source.ip rather than picking one
    - vendor: dst
      type: ip
      description: peer address the notice is about, for host-scoped notices
      ecs: destination.ip
      status: partial
      notes: same coalescing requirement as src/id.resp_h
    - vendor: p
      type: port
      description: port the notice is about
      ecs: destination.port
      status: partial
      notes: >-
        which side of the connection this port belongs to is defined by the
        raising script, not the schema
    - vendor: 'n'
      type: integer
      description: >-
        numeric count carried by the notice, meaning defined per notice type
        (e.g. a threshold or observed quantity)
      ecs: null
      status: unmapped
      custom: zeek.notice.n
      notes: >-
        script-defined, so it can be a scan count, a byte total, or unused;
        kept raw because there is no consistent ECS target across note types
    - vendor: peer_descr
      type: string
      description: descriptive name of the Zeek cluster node that raised the notice
      ecs: observer.name
      status: partial
      notes: >-
        the ONLY in-band sensor identity in TSV notice.log - there is no
        _system_name column - so settle observer.name on it here; it names a
        worker process within a cluster, finer-grained than the appliance name
    - vendor: actions
      type: array
      description: >-
        set of dispositions applied to the notice - Notice::ACTION_LOG,
        ACTION_EMAIL, ACTION_DROP, ACTION_ALARM
      ecs: event.action
      status: partial
      notes: >-
        a set, comma-joined in TSV; describes what Zeek did about the notice,
        not the detected behaviour - rules should key on rule.name (note) for
        the actual detection
    - vendor: email_dest
      type: array
      description: set of email addresses an ACTION_EMAIL disposition targeted
      ecs: null
      status: unmapped
      custom: zeek.notice.email_dest
      notes: >-
        a set, comma-joined in TSV; operational routing metadata, present only
        when the email action fired
    - vendor: suppress_for
      type: float
      description: interval in seconds for which duplicate notices of this identity are suppressed
      ecs: null
      status: unmapped
      custom: zeek.notice.suppress_for
      notes: >-
        the reason notice counts under-report reality - the default is one
        hour per identity, so rules that count notices are counting
        suppression windows, not events
    - vendor: remote_location.country_code
      type: string
      description: >-
        two-letter country code of the remote address, when a GeoIP database
        is loaded on the sensor
      ecs: source.geo.country_iso_code
      status: partial
      notes: >-
        present only if the sensor has MaxMind data, and "remote" may be
        either side depending on the raising script
    - vendor: remote_location.region
      type: string
      description: region/subdivision of the remote address from the GeoIP lookup
      ecs: source.geo.region_name
      status: partial
      notes: same GeoIP-availability and remote-side caveats as country_code
    - vendor: remote_location.city
      type: string
      description: city of the remote address from the GeoIP lookup
      ecs: source.geo.city_name
      status: partial
      notes: same GeoIP-availability and remote-side caveats as country_code
    - vendor: remote_location.latitude
      type: float
      description: latitude of the remote address from the GeoIP lookup
      ecs: source.geo.location
      status: partial
      transform: >-
        source.geo.location is a geo_point; combine this latitude with
        remote_location.longitude into one {lat, lon} object rather than
        mapping either scalar alone
    - vendor: remote_location.longitude
      type: float
      description: longitude of the remote address from the GeoIP lookup
      ecs: source.geo.location
      status: partial
      transform: pair with remote_location.latitude into the single source.geo.location geo_point
    - vendor: dropped
      type: boolean
      description: whether a requested ACTION_DROP was successfully carried out
      ecs: event.outcome
      status: partial
      transform: >
        boolean to success/failure, but present only when the drop action
        policy is loaded and meaningful only with a blocking framework
        (NetControl or a Corelight blocking integration) wired up; on a
        passive tap it is absent or always false and must not be read as "the
        detection failed"
    - vendor: community_id
      type: string
      description: Community ID v1 hash of the triggering flow
      ecs: network.community_id
      status: mapped
      notes: present only with the community-id policy loaded
