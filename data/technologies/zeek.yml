        a flat vector mixing record types - A/AAAA addresses, CNAME targets,
        TXT strings, MX hosts - with no per-element type, written comma-joined
        in TSV. ECS dns.answers expects an array of objects and
        dns.resolved_ip only the address subset, so elements must be typed and
