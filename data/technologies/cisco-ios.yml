          NBRCHANGE branches that key on clogHistFacility as well as
          event.code, since LINK and LINEPROTO share the UPDOWN mnemonic.
          Normalise the state token to interface-up / interface-down for
          event.action while keeping `administratively down` distinct so
          maintenance shutdowns do not alert, split the adjacency transition
          into separate old/new fields, settle the interface-name home on the
          custom cisco.ios.interface.name rather than
          observer.ingress.interface.name and populate only one, map the
          neighbour address as a custom ip field, and apply the
          clogHistSeverity minus-one conversion. Accept the 254-byte
          truncation as a non-issue for this family (the messages are short),
          and treat the trap purely as a transport choice, not a fidelity
          improvement over syslog.
    fields:
    - vendor: clogHistMsgText
      type: string
      description: >-
        CISCO-SYSLOG-MIB - full text of the state-change message; short enough
        that the 254-byte truncation rarely bites this family.
      ecs: event.original
      status: partial
      notes: >
        carries the whole %LINK-3-UPDOWN / %LINEPROTO-5-UPDOWN /
        %OSPF-5-ADJCHG / %DUAL-5-NBRCHANGE sentence; the interface name, the
        `changed state to <up|down>` token, the neighbour address and the
        `from <old> to <new>` adjacency transition all still have to be parsed
        out of it.
    - vendor: clogHistMsgName
      type: string
      description: CISCO-SYSLOG-MIB - message name (the bare mnemonic), SIZE 1..30.
      ecs: event.code
      status: mapped
      transform: >
        UPDOWN (shared by LINK and LINEPROTO - clogHistFacility is what
        distinguishes them), ADJCHG, NBRCHANGE. Because UPDOWN is shared,
        every query over this dataset must filter on clogHistFacility as well
        as event.code.
    - vendor: clogHistFacility
      type: string
      description: >-
        CISCO-SYSLOG-MIB - facility name (e.g. 'LINK', 'LINEPROTO', 'OSPF',
        'DUAL'), SIZE 1..20.
      ecs: null
      status: unmapped
      custom: cisco.ios.facility
      notes: >
        critically, LINK-3-UPDOWN and LINEPROTO-5-UPDOWN share the UPDOWN
        mnemonic, so event.code alone cannot tell a physical-layer failure
        from a protocol-layer one - the separately-carried facility name is
        what resolves it, which is one place the trap's broken-out facility
        varbind is genuinely convenient. The reparse also uses LINK/LINEPROTO
        to set observer.type=switch. Not mapped to log.syslog.facility.name
        for the same reason as the other datasets.
    - vendor: clogHistSeverity
      type: integer
      description: CISCO-SYSLOG-MIB - SyslogSeverity enum emergency(1)..debug(8).
      ecs: event.severity
      status: partial
      transform: >
        subtract one to recover the Cisco 0-7 digit; LINK is 3 and LINEPROTO
        is 5 for the same physical event, so the inverted scale absolutely
        needs the shared lookup before any threshold.
    - vendor: clogHistTimestamp
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - value of sysUpTime (device-uptime ticks) when the
        message was generated.
      ecs: null
      status: unmapped
      custom: cisco.ios.snmp.sysuptime
      notes: >
        uptime ticks, not wall-clock; @timestamp must come from the
        trap-receiver arrival time. On this dataset the ticks double as a
        cheap check for whether a "link down" was actually a device reboot
        (the value resets to near zero).
    - vendor: clogHistIndex
      type: integer
      description: >-
        CISCO-SYSLOG-MIB - monotonically increasing index of the message in
        the syslog history table.
      ecs: null
      status: unmapped
      custom: cisco.ios.snmp.history_index
      notes: >-
        gap/duplicate detection only, the trap analogue of the syslog sequence
        number; useful for spotting traps lost during a flap storm
