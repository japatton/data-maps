          strings with arbitrary user-supplied text, which must be decoded,
          capped and held to short ASCII keys with nesting depth two before
          the guard destination. At-most-once with no return channel -
          reconcile low-side and high-side counts per (dataset, hour), and
          expect the reconciliation to be noisiest on this dataset because of
          its volume.
