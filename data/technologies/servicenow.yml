      https://www.servicenow.com/standard/resource-center/data-sheet/ds-log-export-service.html
    - >-
      https://www.servicenow.com/community/developer-forum/three-types-of-event-logs-transaction-logs-and-system-logs-by/m-p/2759655
    parsing:
      mechanism: cribl-pipeline
      artifact: Cribl Kafka Source -> logs-servicenow.event@custom
      notes: >
        The Kafka Source consumes the topic and reshapes each JSON row into
        servicenow.event.*; the URL, timing and size columns arrive as strings
        and still need typing high-side. Volume control has to happen on the
        Log Source filter, since a topic sized for the raw transaction rate is
        the dominant cost on this technology.
    recommendations:
      guarded:
        parse_location: hybrid
        cribl: >
          Consume low-side and do the reduction here: drop static-asset and
          polling URLs the Log Source filter missed, percent-decode and cap
          the URL, split the query string off the path, and de-duplicate on
          sys_id against Kafka re-delivery before anything crosses.
        elastic: >
          Reuse logs-servicenow.event@custom to finish the typing: response
          time and component timers to numerics, response_time converted
          milliseconds-to-nanoseconds for event.duration, output_length to a
          long on http.response.body.bytes, and url.domain filled from the
          instance hostname since the vendor URL is relative.
        relay: >
          The reduced, ECS-shaped subset crosses as mode B, not every
          transaction. URLs are the content-filter friction - kilobyte-scale
          encoded sysparm_query strings - so decode, cap and hold them to
          short ASCII keys low-side. Reconcile distinct sys_id per (dataset,
          hour); expect this feed to be the noisiest because of its volume.
      direct:
        parse_location: hybrid
        cribl: >
          High-side consumes Hermes directly with no guard hop, but the same
          URL normalization and drop rules still pay for themselves on ingest
          cost; de-duplicate on sys_id and run Persistent Queue backpressure.
        elastic: >
          logs-servicenow.event@custom does the numeric typing and url.*
          splitting exactly as on the REST path; keep
          servicenow.transaction.session_id as keyword for the cross-request
          pivot.
    fields:
    - vendor: sys_created_on
      type: timestamp
      description: date and time the transaction was recorded
      ecs: '@timestamp'
      status: mapped
      transform: Glide date/time in instance time zone; parse to UTC
    - vendor: sys_created_by
      type: string
      description: user name that issued the transaction
      ecs: user.name
      status: mapped
    - vendor: remote_ip
      type: ip
      description: IP address of the client that issued the transaction
      ecs: source.ip
      status: mapped
      notes: >-
        forwarded-for client address behind the load balancer; confirm the
        header trust chain before treating it as authoritative
    - vendor: url
      type: string
      description: relative URL of the transaction (path and query, no scheme or host)
      ecs: url.original
      status: partial
      notes: >-
        supply url.domain from the instance identity and split into url.path
        and url.query rather than leaving it whole
    - vendor: response_time
      type: integer
      description: server-side processing time in milliseconds
      ecs: event.duration
      status: partial
      transform: vendor milliseconds; multiply by 1,000,000 for ECS nanoseconds
    - vendor: output_length
      type: integer
      description: response payload size in bytes - the bulk-export/enumeration signal
      ecs: http.response.body.bytes
      status: mapped
      notes: 'type as a long, not the API''s string'
    - vendor: type
      type: enum
      description: transaction origin (UI, REST, SOAP, processor)
      ecs: null
      custom: servicenow.transaction.type
      status: unmapped
    - vendor: session_id
      type: string
      description: user session identifier, stable login to logout
      ecs: null
      custom: servicenow.transaction.session_id
      status: unmapped
      notes: ECS 9.4 has no general session field; the join back to the login/logout rows
    - vendor: sys_id
      type: string
      description: sys_id of the transaction row, used to de-duplicate re-delivered records
      ecs: event.id
      status: mapped
  - format: json
    enable: >
