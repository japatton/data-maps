      type: timestamp
      description: actual time implementation work began
      ecs: event.start
      status: partial
      notes: >-
        only populated once the change enters the implement state; fall back
        to the planned window while in flight
    - vendor: work_end
      type: timestamp
      description: actual time implementation work finished
      ecs: event.end
      status: partial
      notes: same population caveat as work_start
    - vendor: close_code
      type: enum
      description: closure result (successful, successful_with_issues, unsuccessful)
      ecs: event.outcome
      status: partial
      transform: >-
        successful to success, unsuccessful to failure; successful_with_issues
        has no ECS equivalent and becomes unknown with the raw value retained
  - format: csv-file
    enable: >
      Same System Export Sets pipeline on change_request but with the Export
      Set file type set to CSV. Because CSV is a flat delimited format with no
      value/display_value pairing, reference fields (assigned_to,
      requested_by, cmdb_ci) render as their display value and choice fields
      (state, risk, approval) render according to the export's label setting,
      so configure the Export Definition columns deliberately - dot-walk the
      sys_id of any reference whose stable identity is needed, and decide per
      choice column whether the code or the label is exported.
    references:
    - https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB1691217
    - >-
      https://www.servicenow.com/community/developer-blog/servicenow-things-to-know-111-system-export-sets/ba-p/2926648
    - >-
      https://www.servicenow.com/community/platform-analytics-forum/scheduled-export-of-a-file-in-csv-format-into-a-shared-folder/m-p/1266620
    parsing:
      mechanism: cribl-pipeline
      artifact: Cribl File Source (CSV) -> logs-servicenow.event@custom
      notes: >
        A Cribl File Source with a CSV/delimited parser reads the file; the
        header row names the selected columns. The flattening is the parsing
        hazard - a reference column arrives as a display name and a choice
        column may arrive as a label rather than a code, so the @custom
        pipeline must know which convention each column was exported under.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          De-duplicate on sys_id so the latest state wins, length-cap
          short_description and strip control characters and embedded
          delimiters low-side (a comma or newline in free text is the classic
          CSV corruption), and leave work-notes columns out of the Export
          Definition.
        elastic: >
          logs-servicenow.event@custom must branch on the export convention:
          if choice fields were exported as labels, skip the sys_choice
          enrichment for them; if reference fields were exported as display
          names, map assigned_to to user.name directly and accept that user.id
          is unavailable unless a dot-walked sys_id column was added.
        relay: >
          Full ECS JSON crosses as mode B after the CSV is parsed and
          normalized low-side; reconcile distinct sys_id per (dataset, hour)
          and alert on shortfall, since the approved-change join fails open on
          a silent drop.
      direct:
        parse_location: high
        cribl: >
          High-side reads the CSV with no guard hop; still normalize embedded
          delimiters and de-duplicate on sys_id at the File Source.
        elastic: >
          logs-servicenow.event@custom must branch on the export convention:
          if choice fields were exported as labels, skip the sys_choice
          enrichment for them; if reference fields were exported as display
          names, map assigned_to to user.name directly and accept that user.id
          is unavailable unless a dot-walked sys_id column was added.
    fields:
    - vendor: number
      type: string
      description: human-readable change number (CHG0030001)
      ecs: null
      custom: servicenow.change.number
      status: unmapped
    - vendor: sys_id
      type: string
      description: sys_id of the change record - the join target for sys_audit documentkey
      ecs: event.id
      status: mapped
    - vendor: sys_updated_on
      type: timestamp
      description: date and time the change record was last modified
      ecs: '@timestamp'
      status: mapped
      transform: watermark column; Glide date/time, parse to UTC
    - vendor: state
      type: string
      description: >-
        state of the change, exported as the numeric code or the label
        depending on the export setting
      ecs: null
      custom: servicenow.change.state
      status: unmapped
      transform: >-
        if exported as a code, apply the per-instance sys_choice lookup; if
        exported as a label, skip the lookup for this column
    - vendor: approval
      type: enum
      description: approval state (not requested, requested, approved, rejected)
      ecs: null
      custom: servicenow.change.approval
      status: unmapped
    - vendor: assigned_to
      type: string
      description: user the change is assigned to, rendered as the display name in CSV
      ecs: user.name
      status: partial
      notes: >-
        CSV has no value/display pairing, so this is the full name; add a
        dot-walked assigned_to.sys_id column if user.id is needed
    - vendor: cmdb_ci
      type: string
      description: primary configuration item, rendered as the display name in CSV
      ecs: null
      custom: servicenow.change.cmdb_ci
      status: unmapped
      notes: resolve through the CMDB rather than assuming host.name
    - vendor: short_description
      type: string
      description: one-line summary of the change
      ecs: message
      status: mapped
      notes: strip embedded commas/newlines that corrupt the CSV row
    - vendor: close_code
      type: enum
      description: closure result (successful, successful_with_issues, unsuccessful)
      ecs: event.outcome
      status: partial
      transform: >-
        successful to success, unsuccessful to failure, successful_with_issues
        to unknown with the raw value retained
  - format: webhook
    enable: >
      Create an Outbound REST Message targeting the collector endpoint and an
      after-update Business Rule on change_request, conditioned on state or
      approval changing, that builds a JSON body from the record and calls
      sn_ws.RESTMessageV2. This is the canonical ServiceNow webhook use case -
      it pushes each state transition of a change in near real time so the
      approved-change join is current rather than lagging a poll interval, and
      the Business Rule can pre-resolve reference fields before sending.
    references:
    - >-
      https://docs.servicenow.com/bundle/kingston-application-development/page/integrate/outbound-rest/concept/c_OutboundRESTWebService.html
    - https://www.nowspectrum.com/blog/restmessagev2-guide
    - >-
      https://www.servicenow.com/community/developer-forum/how-to-setup-outbound-webhook-for-any-event-occurs-in-the/m-p/2141298
    parsing:
      mechanism: cribl-pipeline
      artifact: Cribl HTTP Source -> logs-servicenow.event@custom
      notes: >
        A Cribl HTTP Source receives the POST body. The payload is
        author-defined, so the Business Rule can emit resolved reference names
        and either choice codes or labels; keep the keys aligned with the REST
        path's columns so logs-servicenow.event@custom applies.
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Have the Business Rule resolve assigned_to and cmdb_ci to readable
          values and include both sys_id and number so the low-side HTTP
          Source only caps short_description and de-duplicates on sys_id. Fire
          on state/approval change so a chatty field edit does not generate a
          push per keystroke.
        elastic: >
          logs-servicenow.event@custom derives event.outcome from close_code
          and prefers work_start/work_end for event.start/event.end; if the
          rule sent choice labels, skip the sys_choice enrichment for those
          columns.
        relay: >
          ECS-aligned JSON crosses as mode B, at-most-once with no broker to
          replay. Reconcile distinct sys_id per (dataset, hour) and alert on
          shortfall - a dropped change transition is exactly what makes
          legitimate activity look unauthorized.
      direct:
        parse_location: high
        cribl: >
          High-side POSTs straight to the core HTTP Source; de-duplicate on
          sys_id and keep the state/approval condition on the Business Rule.
        elastic: >
          Same custom pipeline; monitor instance-side for Business Rule
          execution errors, the only signal the feed has stopped.
    fields:
    - vendor: number
      type: string
      description: human-readable change number (CHG0030001)
      ecs: null
      custom: servicenow.change.number
      status: unmapped
    - vendor: sys_id
      type: string
      description: sys_id of the change record, included to de-duplicate retries
      ecs: event.id
      status: mapped
    - vendor: sys_updated_on
      type: timestamp
      description: date and time of the state transition that fired the rule
      ecs: '@timestamp'
      status: mapped
      transform: Glide date/time; parse to UTC
    - vendor: state
      type: integer
      description: numeric state of the change
      ecs: null
      custom: servicenow.change.state
      status: unmapped
      transform: per-instance sys_choice lookup unless the rule sent the label
    - vendor: approval
      type: enum
      description: approval state (not requested, requested, approved, rejected)
      ecs: null
      custom: servicenow.change.approval
      status: unmapped
      notes: the field that answers whether the change was approved
    - vendor: assigned_to
      type: string
      description: user the change is assigned to
      ecs: user.name
      status: partial
      notes: >-
        the Business Rule should emit the resolved user_name (or sys_id)
        rather than the raw reference so the join does not silently miss
    - vendor: cmdb_ci
      type: string
      description: primary configuration item the change affects
      ecs: null
      custom: servicenow.change.cmdb_ci
      status: unmapped
      notes: resolve through the CMDB rather than assuming host.name
    - vendor: short_description
      type: string
      description: one-line summary of the change
      ecs: message
      status: mapped
    - vendor: close_code
      type: enum
      description: closure result (successful, successful_with_issues, unsuccessful)
      ecs: event.outcome
      status: partial
      transform: >-
        successful to success, unsuccessful to failure, successful_with_issues
        to unknown with the raw value retained
