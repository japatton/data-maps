          Take the shaped documents into logs-servicenow.event and use a
          logs-servicenow.event@custom pipeline to finish the typing the
          integration leaves as strings: response_time and the component
          timers to numerics, response_time converted
          milliseconds-to-nanoseconds for event.duration, output_length to a
          long on http.response.body.bytes, and url.domain filled in from the
          instance hostname since the vendor URL is relative. Map
          servicenow.transaction.session_id and .system_id as keyword -
          session id is the only pivot that reconstructs a user's activity
          across requests and ECS 9.4 has no general session field to hold it.
  - format: kafka-json
    enable: >
      With the Log Export Service plugin active, add the transaction log
      (syslog_transaction) as a Log Source in Log Export Service > Log
      Sources; this is the highest-volume table on the instance, so use the
      Log Source filter to exclude static-asset and polling URLs before the
      topic. Provision the Hermes cluster/topic via the LES Guided Setup and
      consume with a MID Server or Kafka connector; transactions stream as
      JSON records in near real time.
    references:
    - >-
      https://docs.servicenow.com/en-US/bundle/vancouver-platform-security/page/administer/log-export-service/concept/les-landing-page.html
