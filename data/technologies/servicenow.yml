- id: change-request
  name: Change request records (change_request)
  description: >
    Change management records pulled for correlation context rather than as a
    security log in their own right: the approved-change join that lets an
    analyst ask whether a firewall edit, a service restart or a privileged
    account grant seen elsewhere in the SIEM fell inside an authorized change
    window. State, risk and approval are numeric or choice-list values whose
    codes are configurable per instance, so this feed is only as good as the
    lookup tables shipped with it.
  event_categories:
  - configuration
  route:
    guarded:
    - hop: cribl
      location: edge worker group, low-side enclave
      notes: >
        Cribl REST Collector against /api/now/table/change_request watermarked
        on sys_updated_on so state transitions re-emit the record; low volume
        compared with the other three datasets.
    - hop: guard
      device: Everfox High Speed Guard
      constraints: >-
        Per-feed content-filter policy not yet defined with the guard owner;
        expected friction and the crossing shape are detailed in this
        dataset's relay recommendation.
      notes: >
        Current crossing: Cribl Syslog Destination (__syslogout carrying a
        CEF-structured string), being retired; plan of record: Cribl HTTP
        Destination -> guard -> Cribl HTTP Source carrying NDJSON. High side
        parses _raw (Extract JSON) then adds Cribl fields before Routes.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-servicenow.event
    direct:
    - hop: cribl
      location: edge worker group
      notes: >
        Cribl REST Collector against /api/now/table/change_request watermarked
        on sys_updated_on so state transitions re-emit the record; low volume
        compared with the other three datasets. It delivers straight to
        Elastic with no guard hop.
    - hop: cribl
      location: core worker group, Elastic side
    - hop: elastic
      data_stream: logs-servicenow.event
  formats:
  - format: api-pull
    parsing:
      mechanism: elastic-integration
      artifact: ServiceNow integration
      notes: >
        change_request is one of the integration's default tables, so the
        transport and the servicenow.event.* field shape are stock; the choice
        list decoding and ECS placement below are not.
    fields:
    - vendor: number
      type: string
      description: human-readable change number, e.g. CHG0030001
      ecs: null
      status: unmapped
      custom: servicenow.change.number
      notes: >-
        the identifier analysts and change owners actually cite; needs a
        keyword mapping because every correlation query filters on it
    - vendor: sys_id
      type: string
      description: sys_id of the change record, the join target for sys_audit documentkey
      ecs: event.id
      status: mapped
    - vendor: sys_updated_on
      type: timestamp
      description: date and time the change record was last modified
      ecs: '@timestamp'
      status: mapped
      transform: >
        the collector watermarks on this column, so @timestamp tracks the most
        recent state transition rather than record creation; Glide date/time
        string in the instance time zone, parse explicitly to UTC
    - vendor: sys_created_on
      type: timestamp
      description: date and time the change record was created
      ecs: null
      status: unmapped
      custom: servicenow.change.created_on
      notes: kept separately because @timestamp is driven by sys_updated_on on this dataset
    - vendor: state
      type: integer
      description: >-
        numeric state of the change (-5 new, -4 assess, -3 authorize, -2
        scheduled, -1 implement, 0 review, 3 closed, 4 canceled out of the
        box)
      ecs: null
      status: unmapped
      custom: servicenow.change.state
      transform: >
        numeric choice-list codes need a lookup to labels, and the code-to-
        label mapping is configurable per instance - build the table from the
        instance's own sys_choice records rather than the out-of-box values
    - vendor: type
      type: enum
      description: change type - normal, standard, or emergency
      ecs: null
      status: unmapped
      custom: servicenow.change.type
      notes: >-
        emergency changes are the ones a SOC most often has to distinguish,
        since they bypass the normal approval path
    - vendor: risk
      type: integer
      description: assessed risk of the change (2 high, 3 moderate, 4 low out of the box)
      ecs: null
      status: unmapped
      custom: servicenow.change.risk
      transform: same per-instance choice-list lookup problem as state
    - vendor: approval
      type: enum
      description: approval state of the change - not requested, requested, approved, rejected
      ecs: null
      status: unmapped
      custom: servicenow.change.approval
      notes: >-
        this, not state, is the field that answers "was this an approved
        change" - a scheduled change with approval rejected is exactly the
        case worth alerting on
    - vendor: assigned_to
      type: string
      description: reference to the sys_user the change is assigned to
      ecs: user.name
      status: partial
      notes: >
        reference field - .value is a sys_id and .display_value the user's
        full name, neither of which is the user_name that other datasets put
        on user.name; resolve against sys_user before the join or the
        correlation silently misses
    - vendor: requested_by
      type: string
      description: reference to the sys_user who requested the change
      ecs: null
      status: unmapped
      custom: servicenow.change.requested_by
      notes: >-
        kept custom rather than overloading user.name, which assigned_to
        already occupies on this dataset
    - vendor: cmdb_ci
      type: string
      description: reference to the primary configuration item the change affects
      ecs: null
      status: unmapped
      custom: servicenow.change.cmdb_ci
      notes: >
        deliberately not mapped to host.name - a CI may be a business service,
        application or cluster rather than a host, so the join to host.name
        has to go through a CMDB resolution step instead of being assumed at
        ingest
    - vendor: start_date
      type: timestamp
      description: planned start of the change window
      ecs: null
      status: unmapped
      custom: servicenow.change.planned_start
      notes: >-
        planned, not actual - kept off event.start so the two are never
        conflated in a correlation window
    - vendor: end_date
      type: timestamp
      description: planned end of the change window
      ecs: null
      status: unmapped
      custom: servicenow.change.planned_end
    - vendor: work_start
      type: timestamp
      description: actual time implementation work began
      ecs: event.start
      status: partial
      notes: >-
        only populated once the change enters the implement state, so
        correlation must fall back to the planned window for changes still in
        flight
    - vendor: work_end
      type: timestamp
      description: actual time implementation work finished
      ecs: event.end
      status: partial
      notes: same population caveat as work_start
    - vendor: short_description
      type: string
      description: one-line summary of the change
      ecs: message
      status: mapped
    - vendor: close_code
      type: enum
      description: closure result of the change - successful, successful_with_issues, unsuccessful
      ecs: event.outcome
      status: partial
      transform: >
        successful maps to success and unsuccessful to failure, but
        successful_with_issues has no ECS equivalent and must become unknown
        with the raw value retained in a custom field, or partially failed
        changes will be counted as clean
    recommendations:
      guarded:
        parse_location: high
        cribl: >
          Keep the collector simple and let it re-pull on sys_updated_on with
          overlap, de-duplicating on sys_id so the latest state of a change
          wins - a change record is a slowly-changing document, not an event,
          and losing its final transition is what breaks the approved-change
          join. Request display values alongside raw values on this pull so
          reference fields (assigned_to, cmdb_ci, requested_by) arrive
          resolvable without a second API call. Persistent Queue backpressure
          on the Elastic destination.
        elastic: >
          In a logs-servicenow.event@custom pipeline, resolve the numeric
          state and risk choice lists through an enrich policy built from the
          instance's own sys_choice values rather than hardcoding the
          out-of-box codes, and derive event.outcome from close_code
          (successful to success, unsuccessful to failure,
          successful_with_issues to unknown with the raw value retained).
          Prefer work_start/work_end for event.start/event.end and keep the
          planned window as servicenow.change.planned_start/.planned_end so
          correlation can fall back to it while the change is still open. Map
          servicenow.change.number, .approval, .type and .cmdb_ci as keyword -
          the number and CI are the two fields every correlation query joins
          on.
        relay: >
          Low volume and individually significant, so this is the dataset
          where a silent guard drop hurts most: the approved-change join fails
          open and legitimate activity looks unauthorized. Full ECS JSON
          crosses; short_description is the only unbounded free text and
          should be length-capped and stripped of control characters low-side,
          while work-notes style columns are deliberately not carried.
          Reconcile low-side and high-side counts per (dataset, hour) and
          alert on any shortfall rather than sampling.
      direct:
        parse_location: high
        cribl: >
          Keep the collector simple and let it re-pull on sys_updated_on with
          overlap, de-duplicating on sys_id so the latest state of a change
          wins - a change record is a slowly-changing document, not an event,
          and losing its final transition is what breaks the approved-change
          join. Request display values alongside raw values on this pull so
          reference fields (assigned_to, cmdb_ci, requested_by) arrive
          resolvable without a second API call. Persistent Queue backpressure
          on the Elastic destination.
        elastic: >
          In a logs-servicenow.event@custom pipeline, resolve the numeric
          state and risk choice lists through an enrich policy built from the
          instance's own sys_choice values rather than hardcoding the
          out-of-box codes, and derive event.outcome from close_code
          (successful to success, unsuccessful to failure,
          successful_with_issues to unknown with the raw value retained).
          Prefer work_start/work_end for event.start/event.end and keep the
          planned window as servicenow.change.planned_start/.planned_end so
          correlation can fall back to it while the change is still open. Map
          servicenow.change.number, .approval, .type and .cmdb_ci as keyword -
          the number and CI are the two fields every correlation query joins
          on.
  - format: json
    enable: >
      Configure a System Export Sets pipeline on change_request: an Export
