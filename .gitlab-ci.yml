stages:
  - test
  - deploy

test:
  stage: test
  script:
    - python3 --version
    - pip3 install -r requirements.txt
    - python3 -m unittest discover -s tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Pure Node: the stock image, no packages fetched.  The Python/JS validator
# parity check is split across the two jobs through a committed fixture -
# `test` proves studio/tests/fixtures/parity.json is current, this job
# proves validate.js reproduces it - so neither image needs the other
# runtime.  The emitter round-trip (tests/test_studio_yaml.py) needs both in
# one process and is a local check; see the README.
test-js:
  stage: test
  image: node:20-bookworm
  script:
    - node --version
    - node --test studio/tests/*.test.js
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# The deploy reads data/studio.yml (the committed defaults) and lets the
# environment override it, so one repository can serve two sites without
# a branch of its own.  Set these as group-level CI/CD variables;
# unset, the committed file stands.
#
#   STUDIO_REPOSITORY_KIND            gitlab | forgejo
#   STUDIO_REPOSITORY_API_URL         e.g. https://gitlab.example/api/v4
#   STUDIO_REPOSITORY_PROJECT         group/project
#   STUDIO_REPOSITORY_DEFAULT_BRANCH  e.g. main
#   STUDIO_REPOSITORY_WEB_IDE_URL     with {project} {branch} {path}
#   STUDIO_ANALYSIS_API_KIND          openai | azure
#   STUDIO_ANALYSIS_API_URL           the LLM endpoint
#   STUDIO_ANALYSIS_MODEL             the model name
#   STUDIO_ANALYSIS_API_VERSION       azure only; empty otherwise
#   STUDIO_ANALYSIS_ALLOW_OVERRIDE    true | false - false pins the
#                                     endpoint above in Settings
#   STUDIO_ELASTIC_URL                Kibana/Elastic base url, or empty
#   STUDIO_ALLOWED_HOSTS              comma-separated hostnames; the
#                                     build fails if any url above
#                                     points off the list.  Unset, or set
#                                     to an empty value, and the check is
#                                     not run at all - an empty list would
#                                     otherwise forbid every url, which is
#                                     never what setting it meant
#
# No secrets belong here: tokens and API keys live only in the admin's
# browser settings panel.
pages:
  stage: deploy
  script:
    - pip3 install -r requirements.txt
    - python3 -m datamaps.build
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
